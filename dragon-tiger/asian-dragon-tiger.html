<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Dragon Tiger</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% 20%,#173a2b 0,#07140f 45%,#030806 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:480px;
    margin:auto;
    min-height:100vh;
    padding-bottom:20px;
}

/* HEADER */

.header{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:rgba(5,15,12,.95);
    border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:20px;
    font-weight:900;
    color:#f5cf66;
}

.balance{
    background:#101c18;
    border:1px solid rgba(245,207,102,.25);
    border-radius:10px;
    padding:8px 12px;
    color:#f5cf66;
    font-weight:800;
}

/* STATUS */

.status{
    display:flex;
    justify-content:space-between;
    padding:12px 15px;
    font-size:13px;
    background:#08120f;
}

.status-left{
    color:#9aa9a3;
}

.status-right{
    color:#2ed573;
    font-weight:800;
}

/* TABLE */

.table{
    margin:10px;
    padding:12px;
    border-radius:18px;
    background:
        linear-gradient(145deg,#0e2d20,#071812);
    border:1px solid rgba(46,213,115,.18);
    box-shadow:0 12px 35px rgba(0,0,0,.4);
}

.cards{
    display:grid;
    grid-template-columns:1fr 80px 1fr;
    align-items:center;
    gap:8px;
}

/* PLAYER */

.player{
    text-align:center;
}

.player-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:10px;
}

.dragon{
    color:#f05b5b;
}

.tiger{
    color:#f5cf66;
}

.card-area{
    height:145px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */

.card{
    width:90px;
    height:125px;
    background:#fff;
    color:#111;
    border-radius:9px;
    position:relative;
    box-shadow:
        0 8px 20px rgba(0,0,0,.5);
    transform-style:preserve-3d;
}

.card.hidden{
    background:
        linear-gradient(135deg,#152e25,#07140f);
    border:2px solid #f5cf66;
}

.card.hidden::before{
    content:"♛";
    position:absolute;
    inset:7px;
    border:1px solid rgba(245,207,102,.5);
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f5cf66;
    font-size:38px;
}

.card.red{
    color:#d92828;
}

.card-top{
    position:absolute;
    top:7px;
    left:8px;
    font-size:19px;
    font-weight:900;
}

.card-symbol{
    position:absolute;
    top:38px;
    left:0;
    right:0;
    text-align:center;
    font-size:44px;
}

.card-bottom{
    position:absolute;
    bottom:5px;
    right:8px;
    font-size:19px;
    font-weight:900;
    transform:rotate(180deg);
}

/* VS */

.vs{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b1713;
    border:2px solid rgba(245,207,102,.35);
    color:#f5cf66;
    font-weight:900;
    margin:auto;
}

/* RESULT */

.result{
    text-align:center;
    margin-top:8px;
    min-height:30px;
}

.result-text{
    display:inline-block;
    padding:7px 18px;
    border-radius:20px;
    background:#101d18;
    color:#f5cf66;
    font-size:14px;
    font-weight:900;
}

/* TIMER */

.timer-box{
    text-align:center;
    margin:12px 0;
}

.timer{
    font-size:30px;
    font-weight:900;
    color:#2ed573;
}

.timer-label{
    color:#7d8d86;
    font-size:11px;
}

/* BET AREA */

.bet-area{
    margin:10px;
}

.bet-title{
    text-align:center;
    font-weight:900;
    margin-bottom:10px;
    color:#dfe8e3;
}

.bet-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.bet-btn{
    min-height:65px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    color:white;
    font-weight:900;
    cursor:pointer;
    background:#111d18;
    transition:.15s;
}

.bet-btn:active{
    transform:scale(.96);
}

.bet-btn.dragon{
    background:linear-gradient(145deg,#7d2020,#421414);
}

.bet-btn.tiger{
    background:linear-gradient(145deg,#856b19,#44360d);
}

.bet-btn.tie{
    background:linear-gradient(145deg,#275e42,#123523);
}

.bet-btn.selected{
    border:2px solid #2ed573;
    box-shadow:0 0 15px rgba(46,213,115,.35);
}

.bet-name{
    display:block;
    font-size:15px;
}

.bet-payout{
    display:block;
    font-size:10px;
    opacity:.65;
    margin-top:4px;
}

/* CHIPS */

.chips{
    margin-top:14px;
    display:flex;
    justify-content:center;
    gap:8px;
}

.chip{
    width:48px;
    height:48px;
    border-radius:50%;
    border:3px solid #26352f;
    background:#101915;
    color:#fff;
    font-weight:900;
    cursor:pointer;
}

.chip.active{
    border-color:#f5cf66;
    transform:scale(1.1);
    box-shadow:0 0 12px rgba(245,207,102,.35);
}

/* INFO */

.info{
    margin:10px;
    padding:12px;
    border-radius:13px;
    background:#0c1713;
    border:1px solid rgba(255,255,255,.06);
}

.info-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin:6px 0;
}

.green{
    color:#2ed573;
}

.gold{
    color:#f5cf66;
}

/* HISTORY */

.history{
    margin:10px;
}

.history-title{
    font-size:13px;
    font-weight:900;
    margin-bottom:7px;
}

.history-list{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
}

.history-list::-webkit-scrollbar{
    display:none;
}

.history-item{
    min-width:32px;
    height:32px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:900;
}

.h-dragon{
    background:#7d2020;
}

.h-tiger{
    background:#806717;
}

.h-tie{
    background:#236040;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:8px;
    margin:10px;
}

.control{
    flex:1;
    padding:11px;
    border:0;
    border-radius:9px;
    background:#18241f;
    color:#b9c7c1;
    font-weight:800;
}

/* ANIMATION */

.card.dealing{
    animation:deal .7s ease forwards;
}

@keyframes deal{
    0%{
        transform:translateY(-80px) rotateY(180deg);
        opacity:0;
    }
    60%{
        transform:translateY(10px) rotateY(20deg);
    }
    100%{
        transform:translateY(0) rotateY(0);
        opacity:1;
    }
}

.shake{
    animation:shake .45s ease;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    75%{transform:translateX(5px)}
}

.win{
    animation:win .8s ease;
}

@keyframes win{
    0%{box-shadow:0 0 0 rgba(46,213,115,0)}
    50%{box-shadow:0 0 35px rgba(46,213,115,.8)}
    100%{box-shadow:0 0 0 rgba(46,213,115,0)}
}

/* POPUP */

.popup{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
    pointer-events:none;
    z-index:100;
    padding:22px 35px;
    border-radius:18px;
    background:rgba(5,14,11,.96);
    border:2px solid #f5cf66;
    text-align:center;
    transition:.3s;
    box-shadow:0 15px 60px rgba(0,0,0,.7);
}

.popup.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.popup-title{
    font-size:12px;
    color:#9ba8a2;
}

.popup-result{
    font-size:30px;
    font-weight:900;
    color:#f5cf66;
    margin-top:5px;
}

/* MOBILE */

@media(max-width:360px){

    .cards{
        grid-template-columns:1fr 55px 1fr;
    }

    .card{
        width:75px;
        height:110px;
    }

    .card-symbol{
        font-size:36px;
    }

    .chip{
        width:43px;
        height:43px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            DRAGON TIGER
        </div>

        <div class="balance">
            BDT <span id="balance">10000.00</span>
        </div>

    </header>


    <!-- STATUS -->

    <div class="status">

        <div class="status-left">
            Round #<span id="round">1001</span>
        </div>

        <div
            class="status-right"
            id="status"
        >
            BETTING OPEN
        </div>

    </div>


    <!-- GAME TABLE -->

    <section class="table">

        <div class="cards">

            <!-- DRAGON -->

            <div class="player">

                <div class="player-title dragon">
                    🐉 DRAGON
                </div>

                <div class="card-area">

                    <div
                        id="dragonCard"
                        class="card hidden"
                    ></div>

                </div>

            </div>


            <!-- VS -->

            <div class="vs">
                VS
            </div>


            <!-- TIGER -->

            <div class="player">

                <div class="player-title tiger">
                    🐯 TIGER
                </div>

                <div class="card-area">

                    <div
                        id="tigerCard"
                        class="card hidden"
                    ></div>

                </div>

            </div>

        </div>


        <!-- RESULT -->

        <div class="result">

            <span
                id="result"
                class="result-text"
            >
                Place your bet
            </span>

        </div>


        <!-- TIMER -->

        <div class="timer-box">

            <div
                id="timer"
                class="timer"
            >
                10
            </div>

            <div class="timer-label">
                SECONDS
            </div>

        </div>

    </section>


    <!-- BET -->

    <section class="bet-area">

        <div class="bet-title">
            SELECT YOUR BET
        </div>


        <div class="bet-buttons">

            <button
                id="dragonBet"
                class="bet-btn dragon"
                onclick="selectBet('dragon')"
            >

                <span class="bet-name">
                    🐉 DRAGON
                </span>

                <span class="bet-payout">
                    1 : 1
                </span>

            </button>


            <button
                id="tieBet"
                class="bet-btn tie"
                onclick="selectBet('tie')"
            >

                <span class="bet-name">
                    TIE
                </span>

                <span class="bet-payout">
                    1 : 8
                </span>

            </button>


            <button
                id="tigerBet"
                class="bet-btn tiger"
                onclick="selectBet('tiger')"
            >

                <span class="bet-name">
                    🐯 TIGER
                </span>

                <span class="bet-payout">
                    1 : 1
                </span>

            </button>

        </div>


        <!-- CHIPS -->

        <div class="chips">

            <button
                class="chip active"
                data-value="10"
                onclick="setChip(10)"
            >
                10
            </button>

            <button
                class="chip"
                data-value="50"
                onclick="setChip(50)"
            >
                50
            </button>

            <button
                class="chip"
                data-value="100"
                onclick="setChip(100)"
            >
                100
            </button>

            <button
                class="chip"
                data-value="500"
                onclick="setChip(500)"
            >
                500
            </button>

            <button
                class="chip"
                data-value="1000"
                onclick="setChip(1000)"
            >
                1K
            </button>

        </div>

    </section>


    <!-- INFO -->

    <section class="info">

        <div class="info-row">

            <span>
                Selected Bet
            </span>

            <span
                id="selectedBet"
                class="gold"
            >
                None
            </span>

        </div>


        <div class="info-row">

            <span>
                Bet Amount
            </span>

            <span
                id="betAmount"
                class="gold"
            >
                BDT 0.00
            </span>

        </div>


        <div class="info-row">

            <span>
                Last Win
            </span>

            <span
                id="lastWin"
                class="green"
            >
                BDT 0.00
            </span>

        </div>

    </section>


    <!-- HISTORY -->

    <section class="history">

        <div class="history-title">
            RESULT HISTORY
        </div>

        <div
            id="history"
            class="history-list"
        ></div>

    </section>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="control"
            onclick="clearBet()"
        >
            CLEAR
        </button>

        <button
            class="control"
            onclick="repeatBet()"
        >
            REBET
        </button>

    </div>

</div>


<!-- POPUP -->

<div
    id="popup"
    class="popup"
>

    <div class="popup-title">
        ROUND RESULT
    </div>

    <div
        id="popupResult"
        class="popup-result"
    >
        DRAGON
    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const ROUND_TIME = 10;


/* =========================================================
   STATE
========================================================= */

let balance = 10000;

let selectedBet = null;

let chip = 10;

let betAmount = 0;

let lastBet = null;

let round = 1001;

let timeLeft = ROUND_TIME;

let timer = null;

let dealing = false;

let history = [];


/* =========================================================
   CARD DATA
========================================================= */

const suits = [

    {
        symbol:"♥",
        red:true
    },

    {
        symbol:"♦",
        red:true
    },

    {
        symbol:"♣",
        red:false
    },

    {
        symbol:"♠",
        red:false
    }

];


const ranks = [

    {
        name:"A",
        value:14
    },

    {
        name:"K",
        value:13
    },

    {
        name:"Q",
        value:12
    },

    {
        name:"J",
        value:11
    },

    {
        name:"10",
        value:10
    },

    {
        name:"9",
        value:9
    },

    {
        name:"8",
        value:8
    },

    {
        name:"7",
        value:7
    },

    {
        name:"6",
        value:6
    },

    {
        name:"5",
        value:5
    },

    {
        name:"4",
        value:4
    },

    {
        name:"3",
        value:3
    },

    {
        name:"2",
        value:2
    }

];


/* =========================================================
   RANDOM
========================================================= */

function randomInt(max){

    if(
        window.crypto &&
        window.crypto.getRandomValues
    ){

        const array =
            new Uint32Array(1);

        window.crypto.getRandomValues(array);

        return array[0] % max;
    }

    return Math.floor(
        Math.random() * max
    );
}


/* =========================================================
   RANDOM CARD
========================================================= */

function randomCard(){

    const suit =
        suits[
            randomInt(suits.length)
        ];

    const rank =
        ranks[
            randomInt(ranks.length)
        ];

    return {

        suit:suit.symbol,

        red:suit.red,

        name:rank.name,

        value:rank.value

    };

}


/* =========================================================
   DISPLAY CARD
========================================================= */

function displayCard(element, card){

    element.className =
        "card dealing";

    if(card.red){

        element.classList.add("red");

    }

    element.innerHTML = `

        <div class="card-top">
            ${card.name}${card.suit}
        </div>

        <div class="card-symbol">
            ${card.suit}
        </div>

        <div class="card-bottom">
            ${card.name}${card.suit}
        </div>

    `;

}


/* =========================================================
   SELECT BET
========================================================= */

function selectBet(type){

    if(dealing)
        return;

    if(timeLeft <= 0)
        return;


    selectedBet = type;


    document
        .querySelectorAll(".bet-btn")
        .forEach(btn =>
            btn.classList.remove("selected")
        );


    document
        .getElementById(
            type + "Bet"
        )
        .classList.add("selected");


    document
        .getElementById("selectedBet")
        .innerText =
            type.toUpperCase();


    updateBetAmount();

}


/* =========================================================
   SET CHIP
========================================================= */

function setChip(value){

    chip = value;


    document
        .querySelectorAll(".chip")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                Number(btn.dataset.value) === value
            );

        });


    updateBetAmount();

}


/* =========================================================
   BET AMOUNT
========================================================= */

function updateBetAmount(){

    if(!selectedBet){

        betAmount = 0;

    }
    else{

        betAmount = chip;

    }


    document
        .getElementById("betAmount")
        .innerText =
            "BDT " +
            betAmount.toFixed(2);

}


/* =========================================================
   PLACE BET
========================================================= */

function confirmBet(){

    if(!selectedBet)
        return false;


    if(chip > balance){

        alert("Insufficient demo balance.");

        return false;

    }


    balance -= chip;

    updateBalance();

    return true;

}


/* =========================================================
   CLEAR BET
========================================================= */

function clearBet(){

    if(dealing)
        return;


    if(
        selectedBet &&
        betAmount > 0
    ){

        balance += betAmount;

        updateBalance();

    }


    selectedBet = null;

    betAmount = 0;


    document
        .querySelectorAll(".bet-btn")
        .forEach(btn =>
            btn.classList.remove("selected")
        );


    document
        .getElementById("selectedBet")
        .innerText =
            "None";


    document
        .getElementById("betAmount")
        .innerText =
            "BDT 0.00";

}


/* =========================================================
   REBET
========================================================= */

function repeatBet(){

    if(dealing)
        return;


    if(!lastBet)
        return;


    if(lastBet > balance){

        alert(
            "Not enough demo balance."
        );

        return;

    }


    selectedBet =
        lastBet.type;


    chip =
        lastBet.amount;


    balance -= chip;


    updateBalance();


    document
        .querySelectorAll(".bet-btn")
        .forEach(btn =>
            btn.classList.remove("selected")
        );


    document
        .getElementById(
            selectedBet + "Bet"
        )
        .classList.add("selected");


    document
        .getElementById("selectedBet")
        .innerText =
            selectedBet.toUpperCase();


    betAmount = chip;


    updateBetAmount();

}


/* =========================================================
   BALANCE
========================================================= */

function updateBalance(){

    document
        .getElementById("balance")
        .innerText =
            balance.toFixed(2);

}


/* =========================================================
   START ROUND
========================================================= */

function startRound(){

    dealing = false;

    timeLeft = ROUND_TIME;


    document
        .getElementById("status")
        .innerText =
            "BETTING OPEN";


    document
        .getElementById("status")
        .style.color =
            "#2ed573";


    document
        .getElementById("timer")
        .innerText =
            timeLeft;


    document
        .getElementById("result")
        .innerText =
            "Place your bet";


    clearCards();


    clearInterval(timer);


    timer =
        setInterval(() => {

            timeLeft--;


            document
                .getElementById("timer")
                .innerText =
                    timeLeft;


            if(timeLeft <= 0){

                clearInterval(timer);

                startDeal();

            }

        },1000);

}


/* =========================================================
   CLEAR CARDS
========================================================= */

function clearCards(){

    document
        .getElementById("dragonCard")
        .className =
            "card hidden";


    document
        .getElementById("dragonCard")
        .innerHTML =
            "";


    document
        .getElementById("tigerCard")
        .className =
            "card hidden";


    document
        .getElementById("tigerCard")
        .innerHTML =
            "";

}


/* =========================================================
   DEAL
========================================================= */

function startDeal(){

    dealing = true;


    document
        .getElementById("status")
        .innerText =
            "DEALING";


    document
        .getElementById("status")
        .style.color =
            "#f5cf66";


    /*
       If user selected a bet,
       confirm it now.
    */

    if(selectedBet){

        lastBet = {

            type:selectedBet,

            amount:betAmount

        };

    }


    const dragon =
        randomCard();


    const tiger =
        randomCard();


    const dragonElement =
        document.getElementById(
            "dragonCard"
        );


    const tigerElement =
        document.getElementById(
            "tigerCard"
        );


    /*
       First card
    */

    setTimeout(() => {

        displayCard(
            dragonElement,
            dragon
        );

    },400);


    /*
       Second card
    */

    setTimeout(() => {

        displayCard(
            tigerElement,
            tiger
        );

    },1200);


    /*
       Result
    */

    setTimeout(() => {

        finishRound(
            dragon,
            tiger
        );

    },2000);

}


/* =========================================================
   FINISH ROUND
========================================================= */

function finishRound(
    dragon,
    tiger
){

    let winner;


    if(
        dragon.value >
        tiger.value
    ){

        winner = "dragon";

    }

    else if(
        tiger.value >
        dragon.value
    ){

        winner = "tiger";

    }

    else{

        winner = "tie";

    }


    /*
       Result text
    */

    let text;


    if(winner === "dragon"){

        text = "🐉 DRAGON WINS";

    }

    else if(winner === "tiger"){

        text = "🐯 TIGER WINS";

    }

    else{

        text = "🤝 TIE";

    }


    document
        .getElementById("result")
        .innerText =
            text;


    /*
       Winner animation
    */

    if(winner === "dragon"){

        document
            .getElementById("dragonCard")
            .classList.add("win");

    }

    else if(winner === "tiger"){

        document
            .getElementById("tigerCard")
            .classList.add("win");

    }


    /*
       Calculate demo payout
    */

    let win = 0;


    if(selectedBet){

        if(selectedBet === winner){

            if(winner === "tie"){

                /*
                   8:1
                */

                win =
                    betAmount * 9;

            }

            else{

                /*
                   1:1
                */

                win =
                    betAmount * 2;

            }

        }

    }


    if(win > 0){

        balance += win;

        document
            .getElementById("lastWin")
            .innerText =
                "BDT " +
                win.toFixed(2);

    }

    else{

        document
            .getElementById("lastWin")
            .innerText =
                "BDT 0.00";

    }


    updateBalance();


    /*
       History
    */

    addHistory(winner);


    /*
       Popup
    */

    showPopup(text);


    /*
       Clear selected bet
    */

    selectedBet = null;

    betAmount = 0;


    document
        .querySelectorAll(".bet-btn")
        .forEach(btn =>
            btn.classList.remove("selected")
        );


    document
        .getElementById("selectedBet")
        .innerText =
            "None";


    document
        .getElementById("betAmount")
        .innerText =
            "BDT 0.00";


    /*
       Next round
    */

    setTimeout(() => {

        round++;

        document
            .getElementById("round")
            .innerText =
                round;

        startRound();

    },3000);

}


/* =========================================================
   HISTORY
========================================================= */

function addHistory(winner){

    history.unshift(winner);


    if(history.length > 20){

        history.pop();

    }


    const container =
        document.getElementById(
            "history"
        );


    container.innerHTML =
        history.map(item => {

            let cls;

            let text;


            if(item === "dragon"){

                cls = "h-dragon";

                text = "D";

            }

            else if(item === "tiger"){

                cls = "h-tiger";

                text = "T";

            }

            else{

                cls = "h-tie";

                text = "TIE";

            }


            return `

                <div
                    class="history-item ${cls}"
                >
                    ${text}
                </div>

            `;

        }).join("");

}


/* =========================================================
   POPUP
========================================================= */

function showPopup(text){

    const popup =
        document.getElementById(
            "popup"
        );


    document
        .getElementById(
            "popupResult"
        )
        .innerText =
            text;


    popup.classList.add("show");


    setTimeout(() => {

        popup.classList.remove("show");

    },1600);

}


/* =========================================================
   INIT
========================================================= */

updateBalance();

startRound();

</script>
