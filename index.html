<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Portal - Online Gaming Platform</title> 
    <!-- Tailwind CSS CDN --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Supabase JS Client & App Config --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <script src="supabase-config.js"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        :root {
            --font-xs: 11px;
            --font-sm: 12px;
            --font-base: 14px;
            --font-md: 16px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-2xl: 28px;
            --font-3xl: 32px;
        }

        /* Custom Scrollbar Styling */ 
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: #0F212E; } 
        ::-webkit-scrollbar-thumb { background: #1A2C38; border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: #283552; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
        
        html { overflow-y: auto; -webkit-overflow-scrolling: touch; background: #0F212E; } 
        body { overflow-x: hidden; background: #0F212E; color: #0000FF; font-size: var(--font-base); } 
        img { -webkit-user-drag: none; } 

        .shuffle-banner {
            background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%);
            border: 1px solid #0F212E;
            position: relative;
            overflow: hidden;
        }

        .banner-slide {
            transition: opacity 0.6s ease-in-out;
        }

        .slide-animate {
            animation: fadeInSlide 0.35s ease-in-out;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateX(15px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .game-card { min-width: 0; min-height: 154px; }
        .game-art { min-height: 154px; }
        @media (min-width: 640px) {
          .game-card, .game-art { min-height: 210px; }
        }

        .progress-bar-bg { background: #0F212E; border: 1px solid #0F212E; }
        .progress-fill { background: linear-gradient(90deg, #16a765, #2ed573); transition: width 0.4s ease; }
    </style> 
</head> 
<body class="bg-[#0F212E] text-[#0000FF] min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-black pb-24"> 
    <!-- Top Navigation Bar Anchor Container --> 
    <div id="topBarContainer" class="sticky top-0 z-50"></div> 

    <!-- Main Application Wrapper --> 
    <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-3 sm:py-5 space-y-4"> 
        
        <!-- ব্যানার কার্ডের উপরে চিকন একটি দাগ -->
        <div class="w-full h-[2px] bg-[#1A2C38] rounded-full"></div>

        <!-- Multiple Dynamic Banner Slider Container -->
        <div id="bannerContainer" class="shuffle-banner rounded-2xl relative shadow-xl min-h-[110px] sm:min-h-[130px] flex items-center overflow-hidden border border-[#0F212E]">
            <div class="w-full p-3 sm:p-5 flex flex-col justify-between relative z-10">
                <div class="space-y-1 max-w-sm">
                    <span class="inline-block bg-[#24ee89]/15 text-[#0000FF] border border-[#24ee89]/30 text-[var(--font-xs)] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">Refreshed!</span>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight text-[#0000FF] uppercase italic">Boost Your Level Up!</h1>
                    <p class="text-[var(--font-xs)] text-[#0000FF] font-medium">Earn more rewards now when ranking up!</p>
                </div>
            </div>
        </div>
        <!-- Banner Dots Indicator -->
        <div id="bannerDots" class="flex justify-center gap-1.5 -mt-1"></div>

        <!-- VIP Level Progress Bar with Premium Rewards Symbol -->
        <div class="bg-[#1A2C38] border border-[#0F212E] rounded-2xl p-3.5 shadow-lg flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="txtCurrentLevel" class="text-xs font-extrabold text-[#0000FF]">Level: Bronze I</span>
                    <span class="text-[10px] text-[#24ee89] font-bold" id="txtPercentage">0.00%</span>
                </div>
                <a href="account/my-level-up.html" class="w-7 h-7 rounded-xl bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#0000FF] hover:text-[#24ee89] transition shadow" title="VIP Rewards">
                    <i class="fa-solid fa-gift text-xs"></i>
                </a>
            </div>
            <div class="w-full h-2.5 rounded-full progress-bar-bg overflow-hidden p-0.5">
                <div id="progressFill" class="h-full rounded-full progress-fill" style="width: 0%;"></div>
            </div>
            <div class="flex justify-between text-[10px] font-bold text-[#0000FF]">
                <span id="txtCurrentWager">Wager: ৳0.00</span>
                <span id="txtNextLevel">Next: Silver I</span>
            </div>
        </div>

        <!-- ক্যাটাগরি বাটন বার -->
        <div id="categorySliderBar" class="flex items-center gap-2.5 overflow-x-auto no-scrollbar py-1">
            <!-- Dynamic Category Buttons Rendered Here -->
        </div>

        <!-- Dynamic Categories Sections Container --> 
        <div id="categoriesContainer" class="space-y-6">
            <!-- Sections rendered dynamically from database -->
        </div>
    </div> 

    <!-- Category All Games Modal with Loading Animation & Search Icon -->
    <div id="categoryModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[10000] hidden flex flex-col">
        <!-- Modal Top Bar -->
        <div id="modalTopBar" class="sticky top-0 z-50"></div>

        <!-- Modal Content Area -->
        <div class="flex-1 overflow-y-auto max-w-7xl w-full mx-auto p-3 sm:p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-[#0F212E] pb-3">
                <div class="flex items-center gap-3">
                    <h2 id="modalCategoryTitle" class="text-lg sm:text-xl font-black text-[#0000FF] flex items-center gap-2">
                        <i class="fa-solid fa-gamepad text-[#24ee89]"></i> <span id="modalTitleText">Category Games</span>
                    </h2>
                    <!-- Search Symbol Icon -->
                    <a href="search.html" title="Search Games" class="w-8 h-8 rounded-xl bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#0000FF] hover:text-[#24ee89] transition">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </a>
                </div>
                <button onclick="closeCategoryModal()" class="w-9 h-9 rounded-xl bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#0000FF] hover:bg-red-500 hover:border-red-500 transition">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <!-- Loading Spinner Container -->
            <div id="modalLoader" class="flex flex-col items-center justify-center py-20 space-y-3">
                <div class="w-10 h-10 border-4 border-[#24ee89] border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-gray-400 font-semibold tracking-wider uppercase">Loading Games...</p>
            </div>

            <div id="modalGamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5 pb-16 hidden">
                <!-- All games of this category will render here -->
            </div>
        </div>

        <!-- Modal Bottom Bar -->
        <div id="modalBottomBar" class="fixed bottom-0 left-0 right-0 z-50"></div>
    </div>

    <!-- Dynamic Bottom Bar Anchor Container -->
    <div id="bottomBarContainer" class="fixed bottom-0 left-0 right-0 z-50"></div>

    <script> 
        let balanceSubscription = null; 
        let allGridsData = [];
        let categoryIndices = {}; 
        let activeFilterCategory = 'all';
        let bannersList = [];
        let currentBannerIndex = 0;
        let bannerIntervalTimer = null;

        const predefinedCategories = [
            { key: 'original', title: 'Original', icon: 'fa-fire' },
            { key: 'color_trading', title: 'Color Trading', icon: 'fa-palette' },
            { key: 'lucky_lottery', title: 'Lucky Lottery', icon: 'fa-ticket' },
            { key: 'slot', title: 'Slot', icon: 'fa-slot-machine' },
            { key: 'casino', title: 'Casino', icon: 'fa-dice' },
            { key: 'sports', title: 'Sports', icon: 'fa-futbol' }
        ];

        function formatCategoryTitle(rawCategory) {
            if (!rawCategory) return 'Other Games';
            const cleanKey = rawCategory.trim().toLowerCase();
            const found = predefinedCategories.find(c => c.key === cleanKey);
            if (found) return found.title;
            return rawCategory.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        async function syncRealtimeUserBalance() { 
            try { 
                if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') { 
                    const user = await getCurrentUser(); 
                    if (user) { 
                        const { data: profile } = await supabaseClient 
                            .from('profiles') 
                            .select('*') 
                            .eq('id', user.id) 
                            .single(); 

                        const balanceElement = document.getElementById('topBarBalance'); 
                        if (profile && balanceElement) { 
                            balanceElement.innerText = parseFloat(profile.balance || 0).toFixed(2); 
                        } 

                        updateVipProgressUI(profile);

                        if (!balanceSubscription) { 
                            balanceSubscription = supabaseClient 
                                .channel('public:profiles:' + user.id) 
                                .on('postgres_changes', { 
                                    event: 'UPDATE', 
                                    schema: 'public', 
                                    table: 'profiles', 
                                    filter: `id=eq.${user.id}` 
                                }, async (payload) => { 
                                    if (payload.new) {
                                        if (payload.new.balance !== undefined) { 
                                            const topBal = document.getElementById('topBarBalance'); 
                                            if (topBal) { 
                                                topBal.innerText = parseFloat(payload.new.balance).toFixed(2); 
                                            } 
                                        }
                                        updateVipProgressUI(payload.new);
                                    } 
                                }) 
                                .subscribe(); 
                        } 
                    } 
                } 
            } catch (err) { 
                console.error('Balance & VIP Sync Error:', err); 
            } 
        } 

        async function updateVipProgressUI(profile) {
            try {
                if (!profile) return;
                const userLevelNum = Number(profile.current_vip_level || 1);
                const totalWager = Number(profile.total_wager || 0);

                const { data: levels } = await supabaseClient
                    .from('vip_level_settings')
                    .select('*')
                    .order('level_number', { ascending: true });

                if (!levels || levels.length === 0) return;

                const currentLevelObj = levels.find(l => l.level_number === userLevelNum) || levels[0];
                const nextLevelObj = levels.find(l => l.level_number === userLevelNum + 1) || currentLevelObj;

                document.getElementById('txtCurrentLevel').textContent = `Level: ${currentLevelObj.level_name || 'Bronze I'}`;
                document.getElementById('txtNextLevel').textContent = `Next: ${nextLevelObj.level_name || 'Max Level'}`;
                document.getElementById('txtCurrentWager').textContent = `Wager: ৳${totalWager.toLocaleString('en-BD', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

                const currentReq = Number(currentLevelObj.required_wager || 0);
                const nextReq = Number(nextLevelObj.required_wager || currentReq);

                let percentage = 100;
                if (nextReq > currentReq) {
                    percentage = ((totalWager - currentReq) / (nextReq - currentReq)) * 100;
                    if (percentage < 0) percentage = 0;
                    if (percentage > 100) percentage = 100;
                }

                document.getElementById('txtPercentage').textContent = percentage.toFixed(2) + '%';
                document.getElementById('progressFill').style.width = percentage.toFixed(2) + '%';
            } catch (e) {
                console.error('VIP Progress UI Error:', e);
            }
        }

        async function loadTopBar() { 
            try { 
                const response = await fetch('bar/top.html'); 
                if (response.ok) { 
                    const html = await response.text(); 
                    document.getElementById('topBarContainer').innerHTML = html; 
                    syncRealtimeUserBalance(); 
                } 
            } catch (err) { 
                console.error('Error loading top bar component:', err); 
            } 
        } 

        async function loadDynamicBanners() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('site_banners')
                    .select('*')
                    .eq('is_active', true)
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    bannersList = data;
                    renderBanner(0);

                    let intervalSec = bannersList[0].slide_interval ? parseInt(bannersList[0].slide_interval) : 5;
                    if (intervalSec < 2) intervalSec = 3;

                    if (bannerIntervalTimer) clearInterval(bannerIntervalTimer);
                    bannerIntervalTimer = setInterval(() => {
                        currentBannerIndex = (currentBannerIndex + 1) % bannersList.length;
                        renderBanner(currentBannerIndex);
                    }, intervalSec * 1000);
                }
            } catch (err) {
                console.error('Banner Load Error:', err);
            }
        }

        function renderBanner(index) {
            const bannerContainer = document.getElementById('bannerContainer');
            const dotsContainer = document.getElementById('bannerDots');
            if (!bannerContainer || bannersList.length === 0) return;

            const banner = bannersList[index];
            let bgStyle = banner.image_url ? `background-image: url('${banner.image_url}'); background-size: cover; background-position: center;` : '';

            bannerContainer.style.cssText = `background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%); ${bgStyle}`;
            
            bannerContainer.innerHTML = `
                <div class="absolute inset-0 bg-black/25 z-0"></div>
                <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-[#24ee89]/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="w-full p-3 sm:p-5 flex flex-col justify-between relative z-10 banner-slide">
                    <div class="space-y-1 max-w-sm">
                        ${banner.badge_text ? `<span class="inline-block bg-[#24ee89]/15 text-[#0000FF] border border-[#24ee89]/30 text-[var(--font-xs)] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">${banner.badge_text}</span>` : ''}
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-[#0000FF] uppercase italic drop-shadow-md">${banner.title}</h1>
                        ${banner.subtitle ? `<p class="text-[var(--font-xs)] text-[#0000FF] font-medium drop-shadow">${banner.subtitle}</p>` : ''}
                    </div>
                </div>
                ${banner.link_url ? `<a href="${banner.link_url}" class="absolute inset-0 z-20"></a>` : ''}
            `;

            if (dotsContainer && bannersList.length > 1) {
                dotsContainer.innerHTML = bannersList.map((_, i) => `
                    <button onclick="switchBanner(${i})" class="h-1.5 rounded-full transition-all duration-300 ${i === index ? 'w-6 bg-[#24ee89]' : 'w-1.5 bg-[#0F212E]'}"></button>
                `).join('');
            }
        }

        function switchBanner(index) {
            currentBannerIndex = index;
            renderBanner(currentBannerIndex);
        }

        async function fetchGridData() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('grid_control_url_image')
                    .select('*')
                    .eq('is_active', true)
                    .order('sort_order', { ascending: true });

                if (!error && data) {
                    allGridsData = data.map(item => {
                        const rawCat = item.category ? item.category.trim() : 'original';
                        return {
                            id: item.id,
                            title: item.title,
                            imageUrl: item.image_url,
                            pageUrl: item.page_url,
                            categoryKey: rawCat.toLowerCase(),
                            categoryTitle: formatCategoryTitle(rawCat),
                            show_title: item.show_title,
                            show_badge: item.show_badge
                        };
                    });

                    const categoriesMap = {};
                    allGridsData.forEach(item => {
                        categoriesMap[item.categoryKey] = item.categoryTitle;
                        categoryIndices[item.categoryKey] = 0;
                    });

                    renderCategorySliderButtons(categoriesMap);
                    renderCategories();
                }
            } catch (err) {
                console.error('Grid Data Fetch Error:', err);
            }
        }

        function renderCategorySliderButtons(categoriesMap) {
            const barContainer = document.getElementById('categorySliderBar');
            if (!barContainer) return;

            let html = `
                <button type="button" onclick="filterCategoryButton('all')" class="category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition ${activeFilterCategory === 'all' ? 'bg-[#24ee89] text-[#0F212E] shadow-sm' : 'bg-[#1A2C38] text-[#0000FF] border border-[#0F212E]'}" data-cat="all">
                    <i class="fa-solid fa-fire text-orange-500"></i> All Games
                </button>
            `;

            const orderedKeys = ['original', 'color_trading', 'lucky_lottery', 'slot', 'casino', 'sports'];
            let displayedKeys = [...new Set(Object.keys(categoriesMap))];

            orderedKeys.forEach(k => {
                if (categoriesMap[k]) {
                    const title = categoriesMap[k];
                    const isActive = activeFilterCategory === k;
                    html += `
                        <button type="button" onclick="filterCategoryButton('${k}')" class="category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition ${isActive ? 'bg-[#24ee89] text-[#0F212E] shadow-sm' : 'bg-[#1A2C38] text-[#0000FF] border border-[#0F212E]'}" data-cat="${k}">
                            <i class="fa-solid fa-gamepad text-[#24ee89]"></i> ${title}
                        </button>
                    `;
                }
            });

            displayedKeys.forEach(k => {
                if (!orderedKeys.includes(k) && categoriesMap[k]) {
                    const title = categoriesMap[k];
                    const isActive = activeFilterCategory === k;
                    html += `
                        <button type="button" onclick="filterCategoryButton('${k}')" class="category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition ${isActive ? 'bg-[#24ee89] text-[#0F212E] shadow-sm' : 'bg-[#1A2C38] text-[#0000FF] border border-[#0F212E]'}" data-cat="${k}">
                            <i class="fa-solid fa-gamepad text-[#24ee89]"></i> ${title}
                        </button>
                    `;
                }
            });

            barContainer.innerHTML = html;
        }

        function filterCategoryButton(categoryKey) {
            activeFilterCategory = categoryKey;
            
            document.querySelectorAll('.category-filter-btn').forEach(btn => {
                const isSelected = btn.getAttribute('data-cat') === categoryKey;
                if (isSelected) {
                    btn.className = 'category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition bg-[#24ee89] text-[#0F212E] shadow-sm';
                } else {
                    btn.className = 'category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition bg-[#1A2C38] text-[#0000FF] border border-[#0F212E]';
                }
            });

            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            let catKeys = [...new Set(allGridsData.map(item => item.categoryKey))];
            
            if (activeFilterCategory !== 'all') {
                catKeys = catKeys.filter(k => k === activeFilterCategory);
            }

            catKeys.forEach(catKey => {
                const catItems = allGridsData.filter(item => item.categoryKey === catKey);
                if (catItems.length === 0) return;

                const categoryTitle = catItems[0].categoryTitle;
                const currentIndex = categoryIndices[catKey] || 0;
                const visibleItems = activeFilterCategory === 'all' ? catItems.slice(currentIndex, currentIndex + 3) : catItems;

                const section = document.createElement('div');
                section.className = 'space-y-3 pb-4 border-b border-[#0F212E]';
                section.innerHTML = `
                    <div class="flex items-center justify-between border-b border-[#0F212E] pb-2"> 
                        <h2 class="text-[var(--font-sm)] sm:text-[var(--font-md)] font-bold text-[#0000FF] flex items-center gap-2 cursor-pointer hover:text-[#24ee89] transition" onclick="openCategoryModal('${catKey}', '${categoryTitle}')" title="Click to view all"> 
                            <span class="w-2.5 h-2.5 rounded-full bg-[#0000FF] inline-block"></span> ${categoryTitle} 
                        </h2> 
                        ${activeFilterCategory === 'all' ? `
                        <div class="flex items-center gap-1.5">
                            <button onclick="slideCategory('${catKey}', -1)" class="w-7 h-7 rounded-full bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#0000FF] hover:bg-[#24ee89] hover:text-[#0F212E] transition">
                                <i class="fa-solid fa-chevron-left text-[10px]"></i>
                            </button>
                            <button onclick="slideCategory('${catKey}', 1)" class="w-7 h-7 rounded-full bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#0000FF] hover:bg-[#24ee89] hover:text-[#0F212E] transition">
                                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>` : ''}
                    </div> 
                    <div class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5 slide-animate" id="grid-${CSS.escape(catKey)}">
                    </div>
                `;

                container.appendChild(section);

                const gridContainer = section.querySelector(`#grid-${CSS.escape(catKey)}`);
                const fragment = document.createDocumentFragment();

                visibleItems.forEach(game => {
                    let imageUrl = game.imageUrl ? game.imageUrl.trim() : '';
                    let pageUrl = game.pageUrl ? game.pageUrl.trim() : '#';
                    const hasImg = imageUrl !== '';
                    const title = game.title || 'Untitled Game';
                    const catBadge = categoryTitle.toUpperCase();
                    const showTitle = game.show_title !== false;
                    const showBadge = game.show_badge !== false;

                    const card = document.createElement('a');
                    card.href = pageUrl;
                    card.className = 'game-card group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#24ee89]/70 rounded-2xl overflow-hidden flex flex-col justify-between transition-transform duration-150 shadow-lg';
                    card.innerHTML = ` 
                        <div class="game-art absolute inset-0 bg-gradient-to-b from-[#1A2C38] to-[#1A2C38] flex flex-col items-center justify-center p-1">
                          ${hasImg 
                            ? `<img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-200" loading="lazy" />`
                            : `<i class="fa-solid fa-gamepad text-3xl sm:text-4xl text-[#0000FF] drop-shadow-lg mb-2"></i>
                               ${showTitle ? `<div class="text-center font-black text-xs sm:text-sm text-[#0000FF] tracking-wide drop-shadow-lg px-2">${title}</div>` : ''}`
                          }
                        </div>
                        <div class="relative z-10 flex justify-end items-center p-2">
                          ${showBadge ? `<span class="text-[9px] sm:text-[10px] font-bold text-[#0000FF] bg-[#1A2C38]/90 px-2 py-0.5 rounded-full border border-[#0F212E] backdrop-blur-sm">${catBadge}</span>` : ''}
                        </div>
                        <div class="relative z-10 p-2 text-center bg-gradient-to-t from-[#1A2C38] via-[#1A2C38]/80 to-transparent">
                          ${showTitle ? `<span class="text-[9px] sm:text-[11px] font-bold tracking-wider text-[#0000FF] truncate block">${title}</span>` : ''}
                        </div>
                    `;
                    fragment.appendChild(card);
                });

                gridContainer.appendChild(fragment);
            });
        }

        function slideCategory(catKey, direction) {
            const catItems = allGridsData.filter(item => item.categoryKey === catKey);
            if (catItems.length <= 3) return; 

            let currentIndex = categoryIndices[catKey] || 0;
            currentIndex += direction * 3;

            if (currentIndex >= catItems.length) {
                currentIndex = 0; 
            } else if (currentIndex < 0) {
                currentIndex = Math.max(0, catItems.length - 3); 
            }

            categoryIndices[catKey] = currentIndex;
            renderCategories();
        }

        async function openCategoryModal(catKey, categoryTitle) {
            const modal = document.getElementById('categoryModal');
            const modalLoader = document.getElementById('modalLoader');
            const modalGrid = document.getElementById('modalGamesGrid');

            document.getElementById('modalTitleText').innerText = categoryTitle;

            modal.classList.remove('hidden');
            modalLoader.classList.remove('hidden');
            modalGrid.classList.add('hidden');

            const catItems = allGridsData.filter(item => item.categoryKey === catKey);

            modalGrid.innerHTML = catItems.map(game => {
                let imageUrl = game.imageUrl ? game.imageUrl.trim() : '';
                let pageUrl = game.pageUrl ? game.pageUrl.trim() : '#';
                const hasImg = imageUrl !== '';
                const title = game.title || 'Untitled Game';
                const catBadge = categoryTitle.toUpperCase();
                const showTitle = game.show_title !== false;
                const showBadge = game.show_badge !== false;

                return `
                    <a href="${pageUrl}" class="game-card group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#24ee89]/70 rounded-2xl overflow-hidden flex flex-col justify-between transition-transform duration-150 shadow-lg">
                        <div class="game-art absolute inset-0 bg-gradient-to-b from-[#1A2C38] to-[#1A2C38] flex flex-col items-center justify-center p-1">
                          ${hasImg 
                            ? `<img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-200" loading="lazy" />`
                            : `<i class="fa-solid fa-gamepad text-3xl sm:text-4xl text-[#0000FF] drop-shadow-lg mb-2"></i>
                               ${showTitle ? `<div class="text-center font-black text-xs sm:text-sm text-[#0000FF] tracking-wide drop-shadow-lg px-2">${title}</div>` : ''}`
                          }
                        </div>
                        <div class="relative z-10 flex justify-end items-center p-2">
                          ${showBadge ? `<span class="text-[9px] sm:text-[10px] font-bold text-[#0000FF] bg-[#1A2C38]/90 px-2 py-0.5 rounded-full border border-[#0F212E] backdrop-blur-sm">${catBadge}</span>` : ''}
                        </div>
                        <div class="relative z-10 p-2 text-center bg-gradient-to-t from-[#1A2C38] via-[#1A2C38]/80 to-transparent">
                          ${showTitle ? `<span class="text-[9px] sm:text-[11px] font-bold tracking-wider text-[#0000FF] truncate block">${title}</span>` : ''}
                        </div>
                    </a>
                `;
            }).join('');

            setTimeout(() => {
                modalLoader.classList.add('hidden');
                modalGrid.classList.remove('hidden');
            }, 2500);

            try {
                const topRes = await fetch('bar/top.html');
                if (topRes.ok) {
                    document.getElementById('modalTopBar').innerHTML = await topRes.text();
                }
                const botRes = await fetch('bar/bottom.html');
                if (botRes.ok) {
                    document.getElementById('modalBottomBar').innerHTML = await botRes.text();
                }
            } catch (err) {
                console.error('Modal Bars Load Error:', err);
            }
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
        }

        async function loadBottomBar() {
            try {
                const response = await fetch('bar/bottom.html');
                if (response.ok) {
                    const html = await response.text();
                    const bottomBarContainer = document.getElementById('bottomBarContainer');
                    if (bottomBarContainer) {
                        bottomBarContainer.innerHTML = html;
                    }
                }
            } catch (err) {
                console.error('Error loading bottom bar component:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => { 
            loadTopBar(); 
            loadBottomBar();
            loadDynamicBanners(); 
            fetchGridData(); 
        }); 
    </script> 
</body> 
</html>
