<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Portal - Online Gaming Platform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track { background: #0f141c; }
    ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #30363d; }
  </style>
</head>
<body class="bg-[#0f141c] text-white min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-black">

  <!-- First Time Initial Data Loader Overlay -->
  <div id="initialLoader" class="fixed inset-0 z-[100] bg-[#0f141c] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="relative flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-gray-800 border-t-[#24ee89] rounded-full animate-spin"></div>
      <div class="absolute text-emerald-400 font-extrabold text-xs">LOAD</div>
    </div>
    <p class="mt-4 text-xs font-bold text-gray-400 tracking-widest uppercase animate-pulse">Loading Platform...</p>
  </div>

  <!-- Top Navigation Bar Anchor Container -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <!-- Main Application Wrapper -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-5">

    <!-- Category Navigation Bar -->
    <div class="flex items-center justify-between border-b border-gray-800/80 pb-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
        <button onclick="filterCategory('original')" id="catOriginal" class="flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap">
          Original Games
        </button>
        <!-- Changed All Games to Roulette with direct link -->
        <a href="roulette/roulette.html" class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Roulette
        </a>
        <!-- Changed Slots to Blackjack with direct link -->
        <a href="blackjack/blackjacktable.html" class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Blackjack
        </a>
        <button onclick="filterCategory('live')" id="catLive" class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Live Casino
        </button>
      </div>

      <div class="hidden sm:flex items-center bg-[#161b22] border border-gray-800 rounded-xl px-3 py-1.5 text-xs text-gray-400">
        <input type="text" id="gameSearch" onkeyup="searchGames()" placeholder="Search game..." class="bg-transparent text-white focus:outline-none w-28 lg:w-40">
      </div>
    </div>

    <!-- Games Grid Section -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 id="sectionTitle" class="text-base font-bold text-white flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span>
          Original Games
        </h2>
      </div>

      <!-- Exactly 3 Columns Grid -->
      <div id="gamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5">
        <!-- Dynamic game cards rendered here -->
      </div>
    </section>

  </div>

  <!-- Footer Section -->
  <footer class="bg-[#161b22] border-t border-gray-800/80 mt-12 py-6 text-center text-xs text-gray-500 space-y-2">
    <p>&copy; 2026 Game Portal. All Rights Reserved.</p>
    <p class="text-[10px] text-gray-600">Provably Fair Gaming Engine integrated with Supabase Realtime Authentication.</p>
  </footer>

  <script>
    // Game list dataset
    const gameList = [
      { 
        id: 'dice', 
        name: 'Classic Dice', 
        path: 'game/dice.html', 
        category: 'original', 
        players: 2155,
        image: 'assets/images/dice.png',
        badge: '500',
        fallbackBg: 'from-emerald-600 to-teal-950'
      },
      { 
        id: 'mines', 
        name: 'Mines', 
        path: 'game/mines.html', 
        category: 'original', 
        players: 1420,
        image: 'assets/images/mines.png',
        badge: '1000',
        fallbackBg: 'from-purple-600 to-indigo-950'
      },
      { 
        id: 'limbo', 
        name: 'Limbo', 
        path: 'game/limbo.html', 
        category: 'original', 
        players: 830,
        image: 'assets/images/limbo.png',
        badge: '10000',
        fallbackBg: 'from-green-600 to-emerald-950'
      },
      { 
        id: 'plinko', 
        name: 'Plinko', 
        path: 'game/plinko.html', 
        category: 'original', 
        players: 610,
        image: 'assets/images/plinko.png',
        badge: '1000',
        fallbackBg: 'from-teal-600 to-cyan-950'
      },
      { 
        id: 'crash', 
        name: 'Crash', 
        path: 'game/crash.html', 
        category: 'original', 
        players: 3105,
        image: 'assets/images/crash.png',
        badge: 'HOT',
        fallbackBg: 'from-purple-700 to-purple-950'
      },
      { 
        id: 'wheel', 
        name: 'Wheel', 
        path: 'game/wheel.html', 
        category: 'original', 
        players: 420,
        image: 'assets/images/wheel.png',
        badge: '49.50',
        fallbackBg: 'from-fuchsia-600 to-pink-950'
      },
      { 
        id: 'keno', 
        name: 'Keno', 
        path: 'game/keno.html', 
        category: 'original', 
        players: 290,
        image: 'assets/images/keno.png',
        badge: '100',
        fallbackBg: 'from-amber-600 to-yellow-950'
      },
      { 
        id: 'roulette', 
        name: 'Roulette', 
        path: 'roulette/roulette.html', 
        category: 'original', 
        players: 510,
        image: 'assets/images/roulette.png',
        badge: '36',
        fallbackBg: 'from-red-600 to-rose-950'
      }
    ];

    let currentCategory = 'original';

    // Handle First-Time Data Loader Animation
    function handleInitialLoader() {
      const loader = document.getElementById('initialLoader');
      const isLoaded = sessionStorage.getItem('portal_loaded');

      if (!isLoaded) {
        // Show loader for 800ms on first load, then hide & store flag
        setTimeout(() => {
          loader.classList.add('opacity-0');
          setTimeout(() => {
            loader.style.display = 'none';
            sessionStorage.setItem('portal_loaded', 'true');
          }, 500);
        }, 800);
      } else {
        // Hide immediately without lagging
        loader.style.display = 'none';
      }
    }

    // Top Navigation Loader
    async function loadTopBar() {
      try {
        const response = await fetch('bar/top.html');
        if (response.ok) {
          const html = await response.text();
          document.getElementById('topBarContainer').innerHTML = html;
          if (typeof syncTopBarBalance === 'function') syncTopBarBalance();
        }
      } catch (err) { 
        console.error("Error loading top bar component:", err); 
      }
    }

    // Render Game Cards
    function renderGames(filter = 'original', searchQuery = '') {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const filteredGames = gameList.filter(game => {
        const matchesCategory = (filter === 'all') || (game.category === filter);
        const matchesSearch = game.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filteredGames.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-500 text-xs">
            No games found for the selected category.
          </div>
        `;
        return;
      }

      filteredGames.forEach(game => {
        const card = document.createElement('a');
        card.href = game.path;
        card.className = "group relative bg-[#161b22] border border-gray-800/80 hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-52 md:h-56 transition duration-300 hover:-translate-y-1.5 hover:shadow-2xl hover:shadow-[#24ee89]/15";
        
        card.innerHTML = `
          <!-- Full Card Cover Local Image -->
          <img src="${game.image}" 
               onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" 
               class="absolute inset-0 w-full h-full object-cover z-0 transition duration-500 group-hover:scale-105" 
               alt="${game.name}" />

          <!-- Fallback Gradient (Showed if local image is missing) -->
          <div class="hidden absolute inset-0 bg-gradient-to-b ${game.fallbackBg} opacity-90 transition"></div>

          <!-- Dark Gradient Overlay for Text Visibility -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-black/40 z-10"></div>

          <!-- Top Bar Overlay: Badge & Dynamic Live Users -->
          <div class="relative z-20 flex justify-between items-center p-2">
            <span class="text-[9px] font-extrabold text-yellow-300 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded-md border border-yellow-500/30">
              ${game.badge}
            </span>
            <span class="text-[9px] font-bold text-emerald-400 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-full border border-white/10">
              <span id="player-count-${game.id}">${game.players.toLocaleString()}</span>
            </span>
          </div>

          <!-- Bottom Title Overlay -->
          <div class="relative z-20 p-2.5 text-center">
            <h3 class="text-xs sm:text-sm font-black text-white tracking-wider uppercase group-hover:text-[#24ee89] transition truncate">
              ${game.name}
            </h3>
            <span class="text-[8px] font-bold text-gray-300 block uppercase tracking-widest opacity-80">
              Original Game
            </span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Dynamic Live User Fluctuation (Fluctuates live users to look realistic)
    function startRealtimePlayerSimulation() {
      setInterval(() => {
        gameList.forEach(game => {
          const change = Math.floor(Math.random() * 11) - 5; // -5 to +5 change
          game.players = Math.max(100, game.players + change);
          
          const el = document.getElementById(`player-count-${game.id}`);
          if (el) {
            el.innerText = game.players.toLocaleString();
          }
        });
      }, 3000);
    }

    // Category Filter Switcher
    function filterCategory(cat) {
      currentCategory = cat;
      const categories = ['original', 'live'];
      
      categories.forEach(c => {
        const btn = document.getElementById(`cat${c.charAt(0).toUpperCase() + c.slice(1)}`);
        if (btn) {
          if (c === cat) {
            btn.className = "flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap";
          } else {
            btn.className = "flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap";
          }
        }
      });

      const titles = {
        'original': 'Original Games',
        'live': 'Live Casino'
      };

      document.getElementById('sectionTitle').innerHTML = `
        <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span>
        ${titles[cat] || 'Games'}
      `;

      renderGames(cat);
    }

    // Search Filter
    function searchGames() {
      const query = document.getElementById('gameSearch').value;
      renderGames(currentCategory, query);
    }

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
      handleInitialLoader();
      loadTopBar();
      renderGames('original');
      startRealtimePlayerSimulation();
    });
  </script>
</body>
</html>
