<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Portal - Online Gaming Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0f141c;
    }

    ::-webkit-scrollbar-thumb {
      background: #21262d;
      border-radius: 4px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* =========================================
       PREMIUM DICE EFFECT
    ========================================= */

    .dice-svg {
      width: 150px;
      height: 150px;
      overflow: visible;
      filter:
        drop-shadow(0 18px 18px rgba(0, 0, 0, 0.35))
        drop-shadow(0 0 18px rgba(36, 238, 137, 0.18));
      transition: transform 0.35s ease;
    }

    .group:hover .dice-svg {
      transform: scale(1.07) rotate(-1deg);
    }

    .dice-glow {
      animation: diceGlow 2.5s ease-in-out infinite;
    }

    @keyframes diceGlow {
      0%, 100% {
        opacity: .65;
      }

      50% {
        opacity: 1;
      }
    }

    /* Soft green light behind dice */
    .dice-light {
      position: absolute;
      width: 130px;
      height: 90px;
      border-radius: 50%;
      background: rgba(36, 238, 137, 0.20);
      filter: blur(30px);
      pointer-events: none;
    }
  </style>
</head>

<body class="bg-[#0f141c] text-white min-h-screen flex flex-col font-sans antialiased">

  <!-- Top Navigation Bar -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>


  <!-- Main Application Wrapper -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-5">


    <!-- Category Navigation Bar -->
    <div class="flex items-center justify-between border-b border-gray-800/80 pb-3">

      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">

        <button
          onclick="filterCategory('original')"
          id="catOriginal"
          class="flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap">
          Original Games
        </button>

        <button
          onclick="filterCategory('all')"
          id="catAll"
          class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          All Games
        </button>

        <button
          onclick="filterCategory('slots')"
          id="catSlots"
          class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Slots
        </button>

        <button
          onclick="filterCategory('live')"
          id="catLive"
          class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Live Casino
        </button>

      </div>


      <div class="hidden sm:flex items-center bg-[#161b22] border border-gray-800 rounded-xl px-3 py-1.5 text-xs text-gray-400">

        <input
          type="text"
          id="gameSearch"
          onkeyup="searchGames()"
          placeholder="Search game..."
          class="bg-transparent text-white focus:outline-none w-28 lg:w-40">

      </div>

    </div>


    <!-- Games Grid Section -->
    <section>

      <div class="flex items-center justify-between mb-4">

        <h2
          id="sectionTitle"
          class="text-base font-bold text-white flex items-center gap-2">

          <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span>

          Original Games (game/)

        </h2>

        <span
          class="text-xs text-gray-500 font-medium"
          id="gameCount">
          8 Games Available
        </span>

      </div>


      <!-- Games Grid -->
      <div
        id="gamesGrid"
        class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5">

        <!-- Dynamic game cards -->

      </div>

    </section>

  </div>
