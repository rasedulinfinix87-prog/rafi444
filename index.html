<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Portal - Online Gaming Platform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1b2438; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #283552; }

    /* Card Fade-in & Smooth Loader Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-animate {
      animation: fadeIn 0.4s ease-out forwards;
      will-change: transform, opacity;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-black">

  <!-- 3 Seconds Loading Screen Overlay -->
  <div id="loader" class="fixed inset-0 z-[100] bg-[#0b0f19] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="relative flex items-center justify-center">
      <div class="w-16 h-16 border-4 border-slate-800 border-t-[#24ee89] rounded-full animate-spin"></div>
      <div class="absolute text-[10px] font-black text-[#24ee89]">LOADING</div>
    </div>
    <p class="mt-4 text-xs font-semibold text-slate-400 tracking-wider uppercase animate-pulse">Initializing Portal...</p>
  </div>

  <!-- Top Navigation Bar Anchor Container -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <!-- Main Application Wrapper -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-5">

    <!-- Category Navigation Bar -->
    <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
        <button onclick="filterCategory('original')" id="catOriginal" class="flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap">
          Original Games
        </button>
        <button onclick="filterCategory('roulette')" id="catRoulette" class="flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Roulette
        </button>
        <button onclick="filterCategory('blackjack')" id="catBlackjack" class="flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Blackjack
        </button>
        <button onclick="filterCategory('live')" id="catLive" class="flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Live Casino
        </button>
      </div>

      <div class="hidden sm:flex items-center bg-[#111827] border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-400">
        <input type="text" id="gameSearch" onkeyup="searchGames()" placeholder="Search game..." class="bg-transparent text-white focus:outline-none w-28 lg:w-40">
      </div>
    </div>

    <!-- Games Grid Section -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 id="sectionTitle" class="text-base font-bold text-white flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span>
          Original Games
        </h2>
      </div>

      <!-- Exactly 3 Columns Grid -->
      <div id="gamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5">
        <!-- Dynamic game cards rendered here -->
      </div>
    </section>

  </div>

  <!-- Footer Section -->
  <footer class="bg-[#111827] border-t border-slate-800/80 mt-12 py-6 text-center text-xs text-slate-500 space-y-2">
    <p>&copy; 2026 Game Portal. All Rights Reserved.</p>
    <p class="text-[10px] text-slate-600">Provably Fair Gaming Engine integrated with Supabase Realtime Authentication.</p>
  </footer>

  <script>
    // Games List Configuration
    const gameList = [
      { 
        id: 'dice', 
        name: 'Classic Dice', 
        path: 'game/dice.html', 
        category: 'original', 
        players: 2155,
        image: 'assets/images/dice.png',
        badge: 'BOOM',
        fallbackBg: 'from-emerald-900 to-slate-950'
      },
      { 
        id: 'mines', 
        name: 'Mines', 
        path: 'game/mines.html', 
        category: 'original', 
        players: 1420,
        image: 'assets/images/mines.png',
        badge: 'BOOM',
        fallbackBg: 'from-indigo-900 to-slate-950'
      },
      { 
        id: 'limbo', 
        name: 'Limbo', 
        path: 'game/limbo.html', 
        category: 'original', 
        players: 830,
        image: 'assets/images/limbo.png',
        badge: 'BOOM',
        fallbackBg: 'from-emerald-950 to-slate-950'
      },
      { 
        id: 'plinko', 
        name: 'Plinko', 
        path: 'game/plinko.html', 
        category: 'original', 
        players: 610,
        image: 'assets/images/plinko.png',
        badge: 'BOOM',
        fallbackBg: 'from-cyan-950 to-slate-950'
      },
      { 
        id: 'crash', 
        name: 'Crash', 
        path: 'game/crash.html', 
        category: 'original', 
        players: 3105,
        image: 'assets/images/crash.png',
        badge: 'BOOM',
        fallbackBg: 'from-purple-950 to-slate-950'
      },
      { 
        id: 'wheel', 
        name: 'Wheel', 
        path: 'game/wheel.html', 
        category: 'original', 
        players: 420,
        image: 'assets/images/wheel.png',
        badge: 'BOOM',
        fallbackBg: 'from-fuchsia-950 to-slate-950'
      },
      { 
        id: 'keno', 
        name: 'Keno', 
        path: 'game/keno.html', 
        category: 'original', 
        players: 290,
        image: 'assets/images/keno.png',
        badge: 'BOOM',
        fallbackBg: 'from-amber-950 to-slate-950'
      },
      { 
        id: 'roulette', 
        name: 'Roulette', 
        path: 'roulette/roulette.html', 
        category: 'roulette', 
        players: 510,
        image: 'assets/images/roulette.png',
        badge: 'BOOM',
        fallbackBg: 'from-rose-950 to-slate-950'
      },
      { 
        id: 'blackjack', 
        name: 'Blackjack', 
        path: 'blackjack/blackjacktable.html', 
        category: 'blackjack', 
        players: 940,
        image: 'assets/images/blackjack.png',
        badge: 'BOOM',
        fallbackBg: 'from-blue-950 to-slate-950'
      }
    ];

    let currentCategory = 'original';
    let balanceSubscription = null;

    // Supabase Realtime User Balance Sync
    async function syncRealtimeUserBalance() {
      try {
        if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') {
          const user = await getCurrentUser();
          if (user) {
            // Initial Balance Fetch
            const { data: profile } = await supabaseClient
              .from('profiles')
              .select('balance')
              .eq('id', user.id)
              .single();

            if (profile && document.getElementById('topBarBalance')) {
              document.getElementById('topBarBalance').innerText = parseFloat(profile.balance).toFixed(2);
            }

            // Realtime Change Listener
            if (!balanceSubscription) {
              balanceSubscription = supabaseClient
                .channel('public:profiles:' + user.id)
                .on('postgres_changes', {
                  event: 'UPDATE',
                  schema: 'public',
                  table: 'profiles',
                  filter: `id=eq.${user.id}`
                }, (payload) => {
                  if (payload.new && payload.new.balance !== undefined) {
                    const topBal = document.getElementById('topBarBalance');
                    if (topBal) topBal.innerText = parseFloat(payload.new.balance).toFixed(2);
                  }
                })
                .subscribe();
            }
          }
        }
      } catch (err) {
        console.error("Balance Sync Error:", err);
      }
    }

    // Dynamic Top Bar Loader
    async function loadTopBar() {
      try {
        const response = await fetch('bar/top.html');
        if (response.ok) {
          const html = await response.text();
          document.getElementById('topBarContainer').innerHTML = html;
          syncRealtimeUserBalance();
        }
      } catch (err) { 
        console.error("Error loading top bar component:", err); 
      }
    }

    // Dynamic Live Players Fluctuation System
    function startLivePlayerUpdates() {
      setInterval(() => {
        gameList.forEach(game => {
          const variation = Math.floor(Math.random() * 11) - 5; // -5 to +5
          game.players = Math.max(100, game.players + variation);
          
          const playerElem = document.getElementById(`player-count-${game.id}`);
          if (playerElem) {
            playerElem.innerText = game.players.toLocaleString();
          }
        });
      }, 3500);
    }

    // Render Game Cards
    function renderGames(filter = 'original', searchQuery = '') {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const filteredGames = gameList.filter(game => {
        const matchesCategory = (filter === 'all') || (game.category === filter);
        const matchesSearch = game.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filteredGames.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-500 text-xs bg-[#111827] rounded-2xl border border-slate-800">
            No games found for the selected category.
          </div>
        `;
        return;
      }

      // Render cards cleanly together
      const fragment = document.createDocumentFragment();

      filteredGames.forEach((game) => {
        const card = document.createElement('a');
        card.href = game.path;
        card.className = "card-animate group relative bg-[#111827] border border-slate-800 hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-52 md:h-56 transition duration-300 hover:-translate-y-1.5 hover:shadow-2xl hover:shadow-[#24ee89]/15";
        
        card.innerHTML = `
          <!-- Full Card Cover Local Image -->
          <img src="${game.image}" 
               onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" 
               class="absolute inset-0 w-full h-full object-cover z-0 transition duration-500 group-hover:scale-105" 
               alt="${game.name}" />

          <!-- Fallback Gradient (Showed if local image is missing) -->
          <div class="hidden absolute inset-0 bg-gradient-to-b ${game.fallbackBg} opacity-90 transition"></div>

          <!-- Dark Gradient Overlay for Text Visibility -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-black/40 z-10"></div>

          <!-- Top Bar Overlay: BOOM Badge & Online Player Count (Without Aviator Icon) -->
          <div class="relative z-20 flex justify-between items-center p-2">
            <span class="text-[9px] font-extrabold text-amber-400 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded-md border border-amber-400/30">
              ${game.badge}
            </span>
            <span class="text-[9px] font-bold text-slate-200 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-full border border-white/10">
              <span id="player-count-${game.id}">${game.players.toLocaleString()}</span> Online
            </span>
          </div>

          <!-- Bottom Title Overlay -->
          <div class="relative z-20 p-2.5 text-center">
            <h3 class="text-xs sm:text-sm font-black text-white tracking-wider uppercase group-hover:text-[#24ee89] transition truncate">
              ${game.name}
            </h3>
          </div>
        `;

        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
    }

    // Category Filter Switcher
    function filterCategory(cat) {
      currentCategory = cat;
      const categories = ['original', 'roulette', 'blackjack', 'live'];
      
      categories.forEach(c => {
        const btn = document.getElementById(`cat${c.charAt(0).toUpperCase() + c.slice(1)}`);
        if (btn) {
          if (c === cat) {
            btn.className = "flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap";
          } else {
            btn.className = "flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap";
          }
        }
      });

      const titles = {
        'original': 'Original Games',
        'roulette': 'Roulette Games',
        'blackjack': 'Blackjack Games',
        'live': 'Live Casino'
      };

      document.getElementById('sectionTitle').innerHTML = `
        <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span>
        ${titles[cat] || 'Games'}
      `;

      renderGames(cat);
    }

    // Search Filter
    function searchGames() {
      const query = document.getElementById('gameSearch').value;
      renderGames(currentCategory, query);
    }

    // Initialization Logic
    document.addEventListener('DOMContentLoaded', () => {
      // 3 Seconds Loader Timer
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.classList.add('opacity-0');
          setTimeout(() => loader.remove(), 500);
        }
      }, 3000);

      loadTopBar();
      renderGames('original');
      startLivePlayerUpdates();
    });
  </script>
</body>
</html>
