<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Portal - Online Gaming Platform</title> 
    <!-- Tailwind CSS CDN --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Supabase JS Client & App Config --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <script src="supabase-config.js"></script> 
    <style> 
        :root {
            --font-xs: 11px;
            --font-sm: 12px;
            --font-base: 14px;
            --font-md: 16px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-2xl: 28px;
            --font-3xl: 32px;
        }

        /* Custom Scrollbar Styling */ 
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: #0F212E; } 
        ::-webkit-scrollbar-thumb { background: #1A2C38; border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: #283552; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
        /* Mobile scrolling optimization */ 
        html { overflow-y: auto; -webkit-overflow-scrolling: touch; background: #0F212E; } 
        body { overflow-x: hidden; background: #0F212E; color: #FFFFFF; font-size: var(--font-base); } 
        img { -webkit-user-drag: none; } 

        /* Shuffle Style Glass & Accents */
        .glass-card {
            background: rgba(245, 207, 102, 0.04);
            border: 1px solid rgba(245, 207, 102, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
        }

        .shuffle-banner {
            background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%);
            border: 1px solid #0F212E;
            position: relative;
            overflow: hidden;
        }

        /* Banner Slide Animation */
        .banner-slide {
            transition: opacity 0.6s ease-in-out;
        }
    </style> 
</head> 
<body class="bg-[#0F212E] text-[#FFFFFF] min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-black pb-24"> 
    <!-- Top Navigation Bar Anchor Container --> 
    <div id="topBarContainer" class="sticky top-0 z-50"></div> 

    <!-- Main Application Wrapper --> 
    <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-3 sm:py-5 space-y-5"> 
        
        <!-- Multiple Dynamic Banner Slider Container -->
        <div id="bannerContainer" class="shuffle-banner rounded-2xl relative shadow-xl min-h-[140px] flex items-center overflow-hidden">
            <!-- Dynamic Banners Rendered Here -->
            <div class="w-full p-4 sm:p-6 flex flex-col justify-between relative z-10">
                <div class="space-y-1.5 max-w-sm">
                    <span class="inline-block bg-[#24ee89]/15 text-[#24ee89] border border-[#24ee89]/30 text-[var(--font-xs)] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Refreshed!</span>
                    <h1 class="text-[var(--font-2xl)] sm:text-[var(--font-3xl)] font-black tracking-tight text-[#FFFFFF] uppercase italic">Boost Your Level Up!</h1>
                    <p class="text-[var(--font-xs)] text-[#FFFFFF] font-medium">Earn more rewards now when ranking up!</p>
                </div>
            </div>
        </div>
        <!-- Banner Dots Indicator -->
        <div id="bannerDots" class="flex justify-center gap-1.5 -mt-2"></div>

        <!-- Search Bar Section --> 
        <div class="flex items-center justify-between bg-[#1A2C38] border border-[#0F212E] rounded-xl px-3 py-2 text-[var(--font-xs)] text-[#FFFFFF]"> 
            <input type="text" id="gameSearch" onkeyup="handleSearch()" placeholder="Search game..." class="bg-transparent text-[#FFFFFF] focus:outline-none w-full"> 
            <i class="fa-solid fa-search text-[#FFFFFF]"></i>
        </div> 

        <!-- Dynamic Categories Sections Container --> 
        <div id="categoriesContainer" class="space-y-8">
            <!-- Sections rendered dynamically from database -->
        </div>
    </div> 

    <!-- Footer Section --> 
    <footer class="bg-[#1A2C38] border-t border-[#0F212E] mt-12 py-6 text-center text-[var(--font-xs)] text-[#FFFFFF] space-y-2"> 
        <p>&copy; 2026 Game Portal. All Rights Reserved.</p> 
    </footer> 

    <!-- Dynamic Bottom Bar Anchor Container -->
    <div id="bottomBarContainer" class="fixed bottom-0 left-0 right-0 z-50"></div>

    <script> 
        let balanceSubscription = null; 
        let allGridsData = [];
        let categoryDisplayLimits = {}; 
        let bannersList = [];
        let currentBannerIndex = 0;
        let bannerIntervalTimer = null;

        // Supabase Realtime User Balance Sync 
        async function syncRealtimeUserBalance() { 
            try { 
                if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') { 
                    const user = await getCurrentUser(); 
                    if (user) { 
                        const { data: profile } = await supabaseClient 
                            .from('profiles') 
                            .select('balance') 
                            .eq('id', user.id) 
                            .single(); 
                        const balanceElement = document.getElementById('topBarBalance'); 
                        if (profile && balanceElement) { 
                            balanceElement.innerText = parseFloat(profile.balance).toFixed(2); 
                        } 
                        if (!balanceSubscription) { 
                            balanceSubscription = supabaseClient 
                                .channel('public:profiles:' + user.id) 
                                .on('postgres_changes', { 
                                    event: 'UPDATE', 
                                    schema: 'public', 
                                    table: 'profiles', 
                                    filter: `id=eq.${user.id}` 
                                }, (payload) => { 
                                    if (payload.new && payload.new.balance !== undefined) { 
                                        const topBal = document.getElementById('topBarBalance'); 
                                        if (topBal) { 
                                            topBal.innerText = parseFloat(payload.new.balance).toFixed(2); 
                                        } 
                                    } 
                                }) 
                                .subscribe(); 
                        } 
                    } 
                } 
            } catch (err) { 
                console.error('Balance Sync Error:', err); 
            } 
        } 

        // Dynamic Top Bar Loader 
        async function loadTopBar() { 
            try { 
                const response = await fetch('bar/top.html'); 
                if (response.ok) { 
                    const html = await response.text(); 
                    document.getElementById('topBarContainer').innerHTML = html; 
                    syncRealtimeUserBalance(); 
                } 
            } catch (err) { 
                console.error('Error loading top bar component:', err); 
            } 
        } 

        // Supabase থেকে মাল্টিপল ব্যানার ফেচ করা এবং স্লাইড ইন্টারভ্যাল হ্যান্ডেল করা
        async function loadDynamicBanners() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('site_banners')
                    .select('*')
                    .eq('is_active', true)
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    bannersList = data;
                    renderBanner(0);

                    // টেবিল থেকে প্রাপ্ত প্রথম ব্যানারের slide_interval (সেকেন্ড) ব্যবহার করা, না থাকলে ডিফল্ট ৫ সেকেন্ড
                    let intervalSec = bannersList[0].slide_interval ? parseInt(bannersList[0].slide_interval) : 5;
                    if (intervalSec < 2) intervalSec = 3;

                    if (bannerIntervalTimer) clearInterval(bannerIntervalTimer);
                    bannerIntervalTimer = setInterval(() => {
                        currentBannerIndex = (currentBannerIndex + 1) % bannersList.length;
                        renderBanner(currentBannerIndex);
                    }, intervalSec * 1000);
                }
            } catch (err) {
                console.error('Banner Load Error:', err);
            }
        }

        // নির্দিষ্ট ইনডেক্সের ব্যানার রেন্ডার করা (হালকা ওভারলে সহ)
        function renderBanner(index) {
            const bannerContainer = document.getElementById('bannerContainer');
            const dotsContainer = document.getElementById('bannerDots');
            if (!bannerContainer || bannersList.length === 0) return;

            const banner = bannersList[index];
            let bgStyle = banner.image_url ? `background-image: url('${banner.image_url}'); background-size: cover; background-position: center;` : '';

            bannerContainer.style.cssText = `background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%); ${bgStyle}`;
            
            bannerContainer.innerHTML = `
                <div class="absolute inset-0 bg-black/25 z-0"></div> <!-- হালকা শ্যাডো বা ওভারলে -->
                <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-[#24ee89]/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="w-full p-4 sm:p-6 flex flex-col justify-between relative z-10 banner-slide">
                    <div class="space-y-1.5 max-w-sm">
                        ${banner.badge_text ? `<span class="inline-block bg-[#24ee89]/15 text-[#24ee89] border border-[#24ee89]/30 text-[var(--font-xs)] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">${banner.badge_text}</span>` : ''}
                        <h1 class="text-[var(--font-2xl)] sm:text-[var(--font-3xl)] font-black tracking-tight text-[#FFFFFF] uppercase italic drop-shadow-md">${banner.title}</h1>
                        ${banner.subtitle ? `<p class="text-[var(--font-xs)] text-[#FFFFFF] font-medium drop-shadow">${banner.subtitle}</p>` : ''}
                    </div>
                </div>
                ${banner.link_url ? `<a href="${banner.link_url}" class="absolute inset-0 z-20"></a>` : ''}
            `;

            // ডটস বা ইন্ডিকেটর আপডেট করা
            if (dotsContainer && bannersList.length > 1) {
                dotsContainer.innerHTML = bannersList.map((_, i) => `
                    <button onclick="switchBanner(${i})" class="h-1.5 rounded-full transition-all duration-300 ${i === index ? 'w-6 bg-[#24ee89]' : 'w-1.5 bg-[#0F212E]'}"></button>
                `).join('');
            }
        }

        // ডটে ক্লিক করে ব্যানার পরিবর্তনের ফাংশন
        function switchBanner(index) {
            currentBannerIndex = index;
            renderBanner(currentBannerIndex);
        }

        // Supabase থেকে `grid_control_url_image` টেবিল ডেটা ফেচ করা
        async function fetchGridData() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('grid_control_url_image')
                    .select('*')
                    .eq('is_active', true)
                    .order('sort_order', { ascending: true });

                if (!error && data) {
                    allGridsData = data.map(item => ({
                        id: item.id,
                        title: item.title,
                        imageUrl: item.image_url,
                        pageUrl: item.page_url,
                        category: item.category ? item.category.trim() : 'Original Games',
                        players: Math.floor(Math.random() * 1500) + 100
                    }));

                    const categories = [...new Set(allGridsData.map(item => item.category))];
                    categories.forEach(cat => {
                        if (!categoryDisplayLimits[cat]) {
                            categoryDisplayLimits[cat] = 3; 
                        }
                    });

                    renderCategories();
                }
            } catch (err) {
                console.error('Grid Data Fetch Error:', err);
            }
        }

        // ক্যাটাগরি ও গেম কার্ড রেন্ডার করার ফাংশন
        function renderCategories(searchQuery = '') {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            const normalizedQuery = searchQuery.toLowerCase();
            const categories = [...new Set(allGridsData.map(item => item.category))];

            categories.forEach(cat => {
                const catItems = allGridsData.filter(item => 
                    item.category === cat && item.title.toLowerCase().includes(normalizedQuery)
                );

                if (catItems.length === 0) return;

                const currentLimit = categoryDisplayLimits[cat] || 3;
                const visibleItems = catItems.slice(0, currentLimit);
                const hasMore = currentLimit < catItems.length;

                const section = document.createElement('div');
                section.className = 'space-y-3';
                section.innerHTML = `
                    <div class="flex items-center justify-between border-b border-[#0F212E] pb-2"> 
                        <h2 class="text-[var(--font-sm)] sm:text-[var(--font-md)] font-bold text-[#FFFFFF] flex items-center gap-2"> 
                            <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span> ${cat} 
                        </h2> 
                    </div> 
                    <div class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5" id="grid-${CSS.escape(cat)}">
                    </div>
                    ${hasMore ? `
                        <div class="text-center pt-1">
                            <button onclick="loadMore('${cat}')" class="w-full py-2.5 bg-[#1A2C38] hover:bg-[#0F212E] border border-[#0F212E] text-[#FFFFFF] font-bold text-[var(--font-xs)] rounded-xl transition">
                                Load More
                            </button>
                        </div>
                    ` : ''}
                `;

                container.appendChild(section);

                const gridContainer = section.querySelector(`#grid-${CSS.escape(cat)}`);
                const fragment = document.createDocumentFragment();

                visibleItems.forEach(game => {
                    const card = document.createElement('a');
                    card.href = game.pageUrl;
                    card.className = 'group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-40 sm:h-48 md:h-52 transition-all duration-200 hover:scale-[1.02] shadow-lg';
                    card.innerHTML = ` 
                        <img src="${game.imageUrl}" onerror="this.style.display='none';" class="absolute inset-0 w-full h-full object-cover z-0" alt="${game.title}" loading="lazy" decoding="async" /> 
                        <div class="relative z-20 flex justify-start items-center p-2.5"> 
                            <span class="text-[9px] sm:text-[10px] font-bold text-[#FFFFFF] bg-black/60 px-2.5 py-0.5 rounded-full border border-white/10 backdrop-blur-md flex items-center gap-1"> 
                                <span class="w-1.5 h-1.5 rounded-full bg-[#24ee89] inline-block"></span>
                                <span>${game.players.toLocaleString()} playing</span> 
                            </span> 
                        </div> 
                        <div></div> 
                    `;
                    fragment.appendChild(card);
                });

                gridContainer.appendChild(fragment);
            });
        }

        function loadMore(category) {
            if (!categoryDisplayLimits[category]) {
                categoryDisplayLimits[category] = 3;
            }
            categoryDisplayLimits[category] += 9; 
            renderCategories(document.getElementById('gameSearch').value);
        }

        function handleSearch() {
            const query = document.getElementById('gameSearch').value;
            renderCategories(query);
        }

        async function loadBottomBar() {
            try {
                const response = await fetch('bar/bottom.html');
                if (response.ok) {
                    const html = await response.text();
                    const bottomBarContainer = document.getElementById('bottomBarContainer');
                    if (bottomBarContainer) {
                        bottomBarContainer.innerHTML = html;
                    }
                }
            } catch (err) {
                console.error('Error loading bottom bar component:', err);
            }
        }

        // Initialization Logic 
        document.addEventListener('DOMContentLoaded', () => { 
            loadTopBar(); 
            loadBottomBar();
            loadDynamicBanners(); // মাল্টিপল ব্যানার এবং টাইমিং লোড
            fetchGridData(); 
        }); 
    </script> 
</body> 
</html>
