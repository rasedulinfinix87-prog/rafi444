<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Portal - Online Gaming Platform</title> 
    <!-- Tailwind CSS CDN --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Supabase JS Client & App Config --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <script src="supabase-config.js"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        :root {
            --font-xs: 11px;
            --font-sm: 12px;
            --font-base: 14px;
            --font-md: 16px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-2xl: 28px;
            --font-3xl: 32px;
        }

        /* Custom Scrollbar Styling */ 
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: #0F212E; } 
        ::-webkit-scrollbar-thumb { background: #1A2C38; border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: #283552; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
        
        html { overflow-y: auto; -webkit-overflow-scrolling: touch; background: #0F212E; } 
        body { overflow-x: hidden; background: #0F212E; color: #FFFFFF; font-size: var(--font-base); } 
        img { -webkit-user-drag: none; } 

        .shuffle-banner {
            background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%);
            border: 1px solid #0F212E;
            position: relative;
            overflow: hidden;
        }

        .banner-slide {
            transition: opacity 0.6s ease-in-out;
        }

        .slide-animate {
            animation: fadeInSlide 0.35s ease-in-out;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateX(15px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style> 
</head> 
<body class="bg-[#0F212E] text-[#FFFFFF] min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-black pb-24"> 
    <!-- Top Navigation Bar Anchor Container --> 
    <div id="topBarContainer" class="sticky top-0 z-50"></div> 

    <!-- Main Application Wrapper --> 
    <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-3 sm:py-5 space-y-5"> 
        
        <!-- Multiple Dynamic Banner Slider Container -->
        <div id="bannerContainer" class="shuffle-banner rounded-2xl relative shadow-xl min-h-[140px] flex items-center overflow-hidden">
            <div class="w-full p-4 sm:p-6 flex flex-col justify-between relative z-10">
                <div class="space-y-1.5 max-w-sm">
                    <span class="inline-block bg-[#24ee89]/15 text-[#24ee89] border border-[#24ee89]/30 text-[var(--font-xs)] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Refreshed!</span>
                    <h1 class="text-[var(--font-2xl)] sm:text-[var(--font-3xl)] font-black tracking-tight text-[#FFFFFF] uppercase italic">Boost Your Level Up!</h1>
                    <p class="text-[var(--font-xs)] text-[#FFFFFF] font-medium">Earn more rewards now when ranking up!</p>
                </div>
            </div>
        </div>
        <!-- Banner Dots Indicator -->
        <div id="bannerDots" class="flex justify-center gap-1.5 -mt-2"></div>

        <!-- Dynamic Categories Sections Container --> 
        <div id="categoriesContainer" class="space-y-8">
            <!-- Sections rendered dynamically from database -->
        </div>
    </div> 

    <!-- Loading Overlay (2.5 Seconds Animation) -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[20000] hidden flex flex-col items-center justify-center space-y-3">
        <div class="w-12 h-12 border-4 border-[#24ee89] border-t-transparent rounded-full animate-spin"></div>
        <p class="text-[var(--font-sm)] font-bold text-[#FFFFFF] tracking-wider">Loading Category Games...</p>
    </div>

    <!-- Category All Games Modal -->
    <div id="categoryModal" class="fixed inset-0 bg-[#0F212E] z-[10000] hidden flex flex-col">
        <!-- Modal Top Bar -->
        <div id="modalTopBar" class="sticky top-0 z-50"></div>

        <!-- Modal Content Area -->
        <div class="flex-1 overflow-y-auto max-w-7xl w-full mx-auto p-3 sm:p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-[#0F212E] pb-3">
                <h2 id="modalCategoryTitle" class="text-lg sm:text-xl font-black text-[#FFFFFF] flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span> <span id="modalTitleText">Category Games</span>
                </h2>
                <button onclick="closeCategoryModal()" class="w-9 h-9 rounded-xl bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:bg-red-500 hover:border-red-500 transition">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <div id="modalGamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5 pb-16">
                <!-- All games of this category will render here -->
            </div>
        </div>

        <!-- Modal Bottom Bar -->
        <div id="modalBottomBar" class="fixed bottom-0 left-0 right-0 z-50"></div>
    </div>

    <!-- Dynamic Bottom Bar Anchor Container -->
    <div id="bottomBarContainer" class="fixed bottom-0 left-0 right-0 z-50"></div>

    <script> 
        let balanceSubscription = null; 
        let allGridsData = [];
        let categoryIndices = {}; 
        let bannersList = [];
        let currentBannerIndex = 0;
        let bannerIntervalTimer = null;

        async function syncRealtimeUserBalance() { 
            try { 
                if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') { 
                    const user = await getCurrentUser(); 
                    if (user) { 
                        const { data: profile } = await supabaseClient 
                            .from('profiles') 
                            .select('balance') 
                            .eq('id', user.id) 
                            .single(); 
                        const balanceElement = document.getElementById('topBarBalance'); 
                        if (profile && balanceElement) { 
                            balanceElement.innerText = parseFloat(profile.balance).toFixed(2); 
                        } 
                        if (!balanceSubscription) { 
                            balanceSubscription = supabaseClient 
                                .channel('public:profiles:' + user.id) 
                                .on('postgres_changes', { 
                                    event: 'UPDATE', 
                                    schema: 'public', 
                                    table: 'profiles', 
                                    filter: `id=eq.${user.id}` 
                                }, (payload) => { 
                                    if (payload.new && payload.new.balance !== undefined) { 
                                        const topBal = document.getElementById('topBarBalance'); 
                                        if (topBal) { 
                                            topBal.innerText = parseFloat(payload.new.balance).toFixed(2); 
                                        } 
                                    } 
                                }) 
                                .subscribe(); 
                        } 
                    } 
                } 
            } catch (err) { 
                console.error('Balance Sync Error:', err); 
            } 
        } 

        async function loadTopBar() { 
            try { 
                const response = await fetch('bar/top.html'); 
                if (response.ok) { 
                    const html = await response.text(); 
                    document.getElementById('topBarContainer').innerHTML = html; 
                    syncRealtimeUserBalance(); 
                } 
            } catch (err) { 
                console.error('Error loading top bar component:', err); 
            } 
        } 

        async function loadDynamicBanners() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('site_banners')
                    .select('*')
                    .eq('is_active', true)
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    bannersList = data;
                    renderBanner(0);

                    let intervalSec = bannersList[0].slide_interval ? parseInt(bannersList[0].slide_interval) : 5;
                    if (intervalSec < 2) intervalSec = 3;

                    if (bannerIntervalTimer) clearInterval(bannerIntervalTimer);
                    bannerIntervalTimer = setInterval(() => {
                        currentBannerIndex = (currentBannerIndex + 1) % bannersList.length;
                        renderBanner(currentBannerIndex);
                    }, intervalSec * 1000);
                }
            } catch (err) {
                console.error('Banner Load Error:', err);
            }
        }

        function renderBanner(index) {
            const bannerContainer = document.getElementById('bannerContainer');
            const dotsContainer = document.getElementById('bannerDots');
            if (!bannerContainer || bannersList.length === 0) return;

            const banner = bannersList[index];
            let bgStyle = banner.image_url ? `background-image: url('${banner.image_url}'); background-size: cover; background-position: center;` : '';

            bannerContainer.style.cssText = `background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%); ${bgStyle}`;
            
            bannerContainer.innerHTML = `
                <div class="absolute inset-0 bg-black/25 z-0"></div>
                <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-[#24ee89]/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="w-full p-4 sm:p-6 flex flex-col justify-between relative z-10 banner-slide">
                    <div class="space-y-1.5 max-w-sm">
                        ${banner.badge_text ? `<span class="inline-block bg-[#24ee89]/15 text-[#24ee89] border border-[#24ee89]/30 text-[var(--font-xs)] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">${banner.badge_text}</span>` : ''}
                        <h1 class="text-[var(--font-2xl)] sm:text-[var(--font-3xl)] font-black tracking-tight text-[#FFFFFF] uppercase italic drop-shadow-md">${banner.title}</h1>
                        ${banner.subtitle ? `<p class="text-[var(--font-xs)] text-[#FFFFFF] font-medium drop-shadow">${banner.subtitle}</p>` : ''}
                    </div>
                </div>
                ${banner.link_url ? `<a href="${banner.link_url}" class="absolute inset-0 z-20"></a>` : ''}
            `;

            if (dotsContainer && bannersList.length > 1) {
                dotsContainer.innerHTML = bannersList.map((_, i) => `
                    <button onclick="switchBanner(${i})" class="h-1.5 rounded-full transition-all duration-300 ${i === index ? 'w-6 bg-[#24ee89]' : 'w-1.5 bg-[#0F212E]'}"></button>
                `).join('');
            }
        }

        function switchBanner(index) {
            currentBannerIndex = index;
            renderBanner(currentBannerIndex);
        }

        async function fetchGridData() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('grid_control_url_image')
                    .select('*')
                    .eq('is_active', true)
                    .order('sort_order', { ascending: true });

                if (!error && data) {
                    allGridsData = data.map(item => ({
                        id: item.id,
                        title: item.title,
                        imageUrl: item.image_url,
                        pageUrl: item.page_url,
                        category: item.category ? item.category.trim() : 'Original Games'
                    }));

                    const categories = [...new Set(allGridsData.map(item => item.category))];
                    categories.forEach(cat => {
                        categoryIndices[cat] = 0; 
                    });

                    renderCategories();
                }
            } catch (err) {
                console.error('Grid Data Fetch Error:', err);
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            const categories = [...new Set(allGridsData.map(item => item.category))];

            categories.forEach(cat => {
                const catItems = allGridsData.filter(item => item.category === cat);
                if (catItems.length === 0) return;

                const currentIndex = categoryIndices[cat] || 0;
                const visibleItems = catItems.slice(currentIndex, currentIndex + 3);

                const section = document.createElement('div');
                section.className = 'space-y-3';
                section.innerHTML = `
                    <div class="flex items-center justify-between border-b border-white/10 pb-2"> 
                        <h2 class="text-[var(--font-sm)] sm:text-[var(--font-md)] font-bold text-[#FFFFFF] flex items-center gap-2 cursor-pointer hover:text-[#24ee89] transition" onclick="handleCategoryClick('${cat}')" title="Click to view all"> 
                            <span class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span> ${cat} 
                        </h2> 
                        <div class="flex items-center gap-1.5">
                            <button onclick="slideCategory('${cat}', -1)" class="w-7 h-7 rounded-full bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:bg-[#24ee89] hover:text-[#0F212E] transition">
                                <i class="fa-solid fa-chevron-left text-[10px]"></i>
                            </button>
                            <button onclick="slideCategory('${cat}', 1)" class="w-7 h-7 rounded-full bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:bg-[#24ee89] hover:text-[#0F212E] transition">
                                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </button>
                        </div>
                    </div> 
                    <!-- ক্যাটাগরির নিচে চিকন লম্বা বর্ডার দাগ -->
                    <div class="w-full h-[1px] bg-white/10 -mt-2 mb-2"></div>
                    
                    <div class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5 slide-animate" id="grid-${CSS.escape(cat)}">
                    </div>
                `;

                container.appendChild(section);

                const gridContainer = section.querySelector(`#grid-${CSS.escape(cat)}`);
                const fragment = document.createDocumentFragment();

                visibleItems.forEach(game => {
                    const card = document.createElement('a');
                    card.href = game.pageUrl;
                    card.className = 'group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-40 sm:h-48 md:h-52 transition-all duration-200 hover:scale-[1.02] shadow-lg';
                    card.innerHTML = ` 
                        <img src="${game.imageUrl}" onerror="this.style.display='none';" class="absolute inset-0 w-full h-full object-cover z-0" alt="${game.title}" loading="lazy" decoding="async" /> 
                        <div class="relative z-20 flex justify-start items-center p-2.5"></div> 
                        <div></div> 
                    `;
                    fragment.appendChild(card);
                });

                gridContainer.appendChild(fragment);
            });
        }

        function slideCategory(category, direction) {
            const catItems = allGridsData.filter(item => item.category === category);
            if (catItems.length <= 3) return; 

            let currentIndex = categoryIndices[category] || 0;
            currentIndex += direction * 3;

            if (currentIndex >= catItems.length) {
                currentIndex = 0; 
            } else if (currentIndex < 0) {
                currentIndex = Math.max(0, catItems.length - 3); 
            }

            categoryIndices[category] = currentIndex;
            renderCategories();
        }

        // ২.৫ সেকেন্ড লোডিং অ্যানিমেশন সহ মডাল ওপেন করার লজিক
        function handleCategoryClick(categoryName) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.remove('hidden');

            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                openCategoryModal(categoryName);
            }, 2500); // ২.৫ সেকেন্ড সময়
        }

        async function openCategoryModal(categoryName) {
            const modal = document.getElementById('categoryModal');
            document.getElementById('modalTitleText').innerText = categoryName;

            const modalGrid = document.getElementById('modalGamesGrid');
            const catItems = allGridsData.filter(item => item.category === categoryName);

            modalGrid.innerHTML = catItems.map(game => `
                <a href="${game.pageUrl}" class="group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-40 sm:h-48 md:h-52 transition-all duration-200 hover:scale-[1.02] shadow-lg">
                    <img src="${game.imageUrl}" onerror="this.style.display='none';" class="absolute inset-0 w-full h-full object-cover z-0" alt="${game.title}" loading="lazy" decoding="async" /> 
                    <div class="relative z-20 flex justify-start items-center p-2.5"></div> 
                    <div></div> 
                </a>
            `).join('');

            modal.classList.remove('hidden');

            try {
                const topRes = await fetch('bar/top.html');
                if (topRes.ok) {
                    document.getElementById('modalTopBar').innerHTML = await topRes.text();
                }
                const botRes = await fetch('bar/bottom.html');
                if (botRes.ok) {
                    document.getElementById('modalBottomBar').innerHTML = await botRes.text();
                }
            } catch (err) {
                console.error('Modal Bars Load Error:', err);
            }
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
        }

        async function loadBottomBar() {
            try {
                const response = await fetch('bar/bottom.html');
                if (response.ok) {
                    const html = await response.text();
                    const bottomBarContainer = document.getElementById('bottomBarContainer');
                    if (bottomBarContainer) {
                        bottomBarContainer.innerHTML = html;
                    }
                }
            } catch (err) {
                console.error('Error loading bottom bar component:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => { 
            loadTopBar(); 
            loadBottomBar();
            loadDynamicBanners(); 
            fetchGridData(); 
        }); 
    </script> 
</body> 
</html>
