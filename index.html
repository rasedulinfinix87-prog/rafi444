<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Portal - Online Gaming Platform</title> 
    <!-- Tailwind CSS CDN --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Supabase JS Client & App Config --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <script src="supabase-config.js"></script> 
    <style> 
        :root {
            --font-xs: 14px;
            --font-sm: 15px;
            --font-base: 16px;
            --font-md: 17px;
            --font-lg: 18px;
            --font-xl: 22px;
            --font-2xl: 28px;
            --font-3xl: 32px;
        }

        /* Custom Scrollbar Styling */ 
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: #0F212E; } 
        ::-webkit-scrollbar-thumb { background: #1A2C38; border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: #283552; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
        
        html { overflow-y: auto; -webkit-overflow-scrolling: touch; background: #0F212E; } 
        body { overflow-x: hidden; background: #0F212E; color: #FFFFFF; font-size: var(--font-base); } 
        img { -webkit-user-drag: none; } 

        .shuffle-banner {
            background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%);
            border: 1px solid #0F212E;
            position: relative;
            overflow: hidden;
        }

        .banner-slide {
            transition: opacity 0.6s ease-in-out;
        }

        .slide-animate {
            animation: fadeInSlide 0.35s ease-in-out;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateX(15px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .game-card { min-width: 0; min-height: 154px; }
        .game-art { min-height: 154px; }
        @media (min-width: 640px) {
          .game-card, .game-art { min-height: 210px; }
        }

        .progress-bar-bg { background: #0F212E; border: 1px solid #0F212E; }
        .progress-fill { background: linear-gradient(90deg, #1F51FF, #3b82f6); transition: width 0.4s ease; }
    </style> 
</head> 
<body class="bg-[#0F212E] text-[#FFFFFF] min-h-screen flex flex-col font-sans antialiased selection:bg-[#1F51FF] selection:text-white pb-24" style="font-size: var(--font-base);"> 
    <!-- Top Navigation Bar Anchor Container --> 
    <div id="topBarContainer" class="sticky top-0 z-50"></div> 

    <!-- Main Application Wrapper --> 
    <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-3 sm:py-5 space-y-4"> 
        
        <!-- ব্যানার কার্ডের উপরে চিকন একটি দাগ -->
        <div class="w-full h-[2px] bg-[#0F212E] rounded-full"></div>

        <!-- Multiple Dynamic Banner Slider Container -->
        <div id="bannerContainer" class="shuffle-banner rounded-2xl relative shadow-xl min-h-[110px] sm:min-h-[130px] flex items-center overflow-hidden border border-[#0F212E]">
            <div class="w-full p-3 sm:p-5 flex flex-col justify-between relative z-10">
                <div class="space-y-1 max-w-sm">
                    <span class="inline-block bg-[#1F51FF]/20 text-[#FFFFFF] border border-[#0F212E] text-[var(--font-xs)] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">Refreshed!</span>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight text-[#FFFFFF] uppercase italic">Boost Your Level Up!</h1>
                    <p class="text-[var(--font-xs)] text-[#FFFFFF] font-medium">Earn more rewards now when ranking up!</p>
                </div>
            </div>
        </div>
        <!-- Banner Dots Indicator -->
        <div id="bannerDots" class="flex justify-center gap-1.5 -mt-1"></div>

        <!-- VIP Level Progress Bar with Premium Rewards Symbol -->
        <div class="bg-[#1A2C38] border border-[#0F212E] rounded-2xl p-3.5 shadow-lg flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="txtCurrentLevel" class="text-xs font-extrabold text-[#FFFFFF]">Level: Bronze I</span>
                    <span class="text-[10px] text-[#FFFFFF] font-bold" id="txtPercentage">0.00%</span>
                </div>
                <a href="account/my-level-up.html" class="w-7 h-7 rounded-xl bg-[#1F51FF] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:opacity-90 transition shadow" title="VIP Rewards">
                    <svg class="w-3.5 h-3.5 fill-current text-white" viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a3 3 0 0 0-3-3c-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2a3 3 0 0 0-3 3c0 .35.07.69.18 1H4c-1.1 0-1.99.9-1.99 2L2 19c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7.5 10.33l1.66 1.34L12 8.66l2.84 3.01 1.66-1.34L14.92 8H20v6z"/></svg>
                </a>
            </div>
            <div class="w-full h-2.5 rounded-full progress-bar-bg overflow-hidden p-0.5">
                <div id="progressFill" class="h-full rounded-full progress-fill" style="width: 0%;"></div>
            </div>
            <div class="flex justify-between text-[10px] font-bold text-[#FFFFFF]">
                <span id="txtCurrentWager">Wager: ৳0.00</span>
                <span id="txtNextLevel">Next: Silver I</span>
            </div>
        </div>

        <!-- ক্যাটাগরি বাটন বার -->
        <div id="categorySliderBar" class="flex items-center gap-2.5 overflow-x-auto no-scrollbar py-1">
            <!-- Dynamic Category Buttons Rendered Here -->
        </div>

        <!-- Dynamic Categories Sections Container --> 
        <div id="categoriesContainer" class="space-y-6">
            <!-- Sections rendered dynamically from database -->
        </div>
    </div> 

    <!-- Category All Games Modal with Loading Animation & Search Icon -->
    <div id="categoryModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[10000] hidden flex flex-col">
        <!-- Modal Top Bar -->
        <div id="modalTopBar" class="sticky top-0 z-50"></div>

        <!-- Modal Content Area -->
        <div class="flex-1 overflow-y-auto max-w-7xl w-full mx-auto p-3 sm:p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-[#0F212E] pb-3">
                <div class="flex items-center gap-3">
                    <h2 id="modalCategoryTitle" class="text-lg sm:text-xl font-black text-[#FFFFFF] flex items-center gap-2">
                        <svg class="w-5 h-5 fill-current text-[#FFFFFF]" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8zM6 15h2v-2h2v-2H8V9H6v2H4v2h2z"/></svg>
                        <span id="modalTitleText">Category Games</span>
                    </h2>
                    <!-- Search Symbol Icon -->
                    <a href="search.html" title="Search Games" class="w-8 h-8 rounded-xl bg-[#1F51FF] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:opacity-90 transition">
                        <svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </a>
                </div>
                <button onclick="closeCategoryModal()" class="w-9 h-9 rounded-xl bg-[#1F51FF] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:opacity-90 transition">
                    <svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            
            <!-- Loading Spinner Container -->
            <div id="modalLoader" class="flex flex-col items-center justify-center py-20 space-y-3">
                <div class="w-10 h-10 border-4 border-[#1F51FF] border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs text-[#FFFFFF] font-semibold tracking-wider uppercase">Loading Games...</p>
            </div>

            <div id="modalGamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5 pb-16 hidden">
                <!-- All games of this category will render here -->
            </div>
        </div>

        <!-- Modal Bottom Bar -->
        <div id="modalBottomBar" class="fixed bottom-0 left-0 right-0 z-50"></div>
    </div>

    <!-- Dynamic Bottom Bar Anchor Container -->
    <div id="bottomBarContainer" class="fixed bottom-0 left-0 right-0 z-50"></div>

    <script> 
        let balanceSubscription = null; 
        let allGridsData = [];
        let categoryIndices = {}; 
        let activeFilterCategory = 'all';
        let bannersList = [];
        let currentBannerIndex = 0;
        let bannerIntervalTimer = null;

        const predefinedCategories = [
            { key: 'original', title: 'Original' },
            { key: 'color_trading', title: 'Color Trading' },
            { key: 'lucky_lottery', title: 'Lucky Lottery' },
            { key: 'slot', title: 'Slot' },
            { key: 'casino', title: 'Casino' },
            { key: 'sports', title: 'Sports' }
        ];

        function formatCategoryTitle(rawCategory) {
            if (!rawCategory) return 'Other Games';
            const cleanKey = rawCategory.trim().toLowerCase();
            const found = predefinedCategories.find(c => c.key === cleanKey);
            if (found) return found.title;
            return rawCategory.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        async function syncRealtimeUserBalance() { 
            try { 
                if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') { 
                    const user = await getCurrentUser(); 
                    if (user) { 
                        const { data: profile } = await supabaseClient 
                            .from('profiles') 
                            .select('*') 
                            .eq('id', user.id) 
                            .single(); 

                        const balanceElement = document.getElementById('topBarBalance'); 
                        if (profile && balanceElement) { 
                            balanceElement.innerText = parseFloat(profile.balance || 0).toFixed(2); 
                        } 

                        updateVipProgressUI(profile);

                        if (!balanceSubscription) { 
                            balanceSubscription = supabaseClient 
                                .channel('public:profiles:' + user.id) 
                                .on('postgres_changes', { 
                                    event: 'UPDATE', 
                                    schema: 'public', 
                                    table: 'profiles', 
                                    filter: `id=eq.${user.id}` 
                                }, async (payload) => { 
                                    if (payload.new) {
                                        if (payload.new.balance !== undefined) { 
                                            const topBal = document.getElementById('topBarBalance'); 
                                            if (topBal) { 
                                                topBal.innerText = parseFloat(payload.new.balance).toFixed(2); 
                                            } 
                                        }
                                        updateVipProgressUI(payload.new);
                                    } 
                                }) 
                                .subscribe(); 
                        } 
                    } 
                } 
            } catch (err) { 
                console.error('Balance & VIP Sync Error:', err); 
            } 
        } 

        async function updateVipProgressUI(profile) {
            try {
                if (!profile) return;
                const userLevelNum = Number(profile.current_vip_level || 1);
                const totalWager = Number(profile.total_wager || 0);

                const { data: levels } = await supabaseClient
                    .from('vip_level_settings')
                    .select('*')
                    .order('level_number', { ascending: true });

                if (!levels || levels.length === 0) return;

                const currentLevelObj = levels.find(l => l.level_number === userLevelNum) || levels[0];
                const nextLevelObj = levels.find(l => l.level_number === userLevelNum + 1) || currentLevelObj;

                document.getElementById('txtCurrentLevel').textContent = `Level: ${currentLevelObj.level_name || 'Bronze I'}`;
                document.getElementById('txtNextLevel').textContent = `Next: ${nextLevelObj.level_name || 'Max Level'}`;
                document.getElementById('txtCurrentWager').textContent = `Wager: ৳${totalWager.toLocaleString('en-BD', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

                const currentReq = Number(currentLevelObj.required_wager || 0);
                const nextReq = Number(nextLevelObj.required_wager || currentReq);

                let percentage = 100;
                if (nextReq > currentReq) {
                    percentage = ((totalWager - currentReq) / (nextReq - currentReq)) * 100;
                    if (percentage < 0) percentage = 0;
                    if (percentage > 100) percentage = 100;
                }

                document.getElementById('txtPercentage').textContent = percentage.toFixed(2) + '%';
                document.getElementById('progressFill').style.width = percentage.toFixed(2) + '%';
            } catch (e) {
                console.error('VIP Progress UI Error:', e);
            }
        }

        async function loadTopBar() { 
            try { 
                const response = await fetch('bar/top.html'); 
                if (response.ok) { 
                    const html = await response.text(); 
                    document.getElementById('topBarContainer').innerHTML = html; 
                    syncRealtimeUserBalance(); 
                } 
            } catch (err) { 
                console.error('Error loading top bar component:', err); 
            } 
        } 

        async function loadDynamicBanners() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('site_banners')
                    .select('*')
                    .eq('is_active', true)
                    .order('created_at', { ascending: false });

                if (!error && data && data.length > 0) {
                    bannersList = data;
                    renderBanner(0);

                    let intervalSec = bannersList[0].slide_interval ? parseInt(bannersList[0].slide_interval) : 5;
                    if (intervalSec < 2) intervalSec = 3;

                    if (bannerIntervalTimer) clearInterval(bannerIntervalTimer);
                    bannerIntervalTimer = setInterval(() => {
                        currentBannerIndex = (currentBannerIndex + 1) % bannersList.length;
                        renderBanner(currentBannerIndex);
                    }, intervalSec * 1000);
                }
            } catch (err) {
                console.error('Banner Load Error:', err);
            }
        }

        function renderBanner(index) {
            const bannerContainer = document.getElementById('bannerContainer');
            const dotsContainer = document.getElementById('bannerDots');
            if (!bannerContainer || bannersList.length === 0) return;

            const banner = bannersList[index];
            let bgStyle = banner.image_url ? `background-image: url('${banner.image_url}'); background-size: cover; background-position: center;` : '';

            bannerContainer.style.cssText = `background: linear-gradient(135deg, #1A2C38 0%, #0F212E 100%); ${bgStyle}`;
            
            bannerContainer.innerHTML = `
                <div class="absolute inset-0 bg-black/25 z-0"></div>
                <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-[#1F51FF]/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="w-full p-3 sm:p-5 flex flex-col justify-between relative z-10 banner-slide">
                    <div class="space-y-1 max-w-sm">
                        ${banner.badge_text ? `<span class="inline-block bg-[#1F51FF]/20 text-[#FFFFFF] border border-[#0F212E] text-[var(--font-xs)] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">${banner.badge_text}</span>` : ''}
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-[#FFFFFF] uppercase italic drop-shadow-md">${banner.title}</h1>
                        ${banner.subtitle ? `<p class="text-[var(--font-xs)] text-[#FFFFFF] font-medium drop-shadow">${banner.subtitle}</p>` : ''}
                    </div>
                </div>
                ${banner.link_url ? `<a href="${banner.link_url}" class="absolute inset-0 z-20"></a>` : ''}
            `;

            if (dotsContainer && bannersList.length > 1) {
                dotsContainer.innerHTML = bannersList.map((_, i) => `
                    <button onclick="switchBanner(${i})" class="h-1.5 rounded-full transition-all duration-300 ${i === index ? 'w-6 bg-[#1F51FF]' : 'w-1.5 bg-[#0F212E]'}"></button>
                `).join('');
            }
        }

        function switchBanner(index) {
            currentBannerIndex = index;
            renderBanner(currentBannerIndex);
        }

        async function fetchGridData() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('grid_control_url_image')
                    .select('*')
                    .eq('is_active', true)
                    .order('sort_order', { ascending: true });

                if (!error && data) {
                    allGridsData = data.map(item => {
                        const rawCat = item.category ? item.category.trim() : 'original';
                        return {
                            id: item.id,
                            title: item.title,
                            imageUrl: item.image_url,
                            pageUrl: item.page_url,
                            categoryKey: rawCat.toLowerCase(),
                            categoryTitle: formatCategoryTitle(rawCat),
                            show_title: item.show_title,
                            show_badge: item.show_badge
                        };
                    });

                    const categoriesMap = {};
                    allGridsData.forEach(item => {
                        categoriesMap[item.categoryKey] = item.categoryTitle;
                        categoryIndices[item.categoryKey] = 0;
                    });

                    renderCategorySliderButtons(categoriesMap);
                    renderCategories();
                }
            } catch (err) {
                console.error('Grid Data Fetch Error:', err);
            }
        }

        function getCategorySvgIcon(key) {
            switch(key) {
                case 'all':
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11z"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M3 13.5h8v8H3z"/></svg>';
                case 'original':
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>';
                case 'color_trading':
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.35c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.46 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>';
                case 'lucky_lottery':
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a3 3 0 0 0-3-3c-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2a3 3 0 0 0-3 3c0 .35.07.69.18 1H4c-1.1 0-1.99.9-1.99 2L2 19c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>';
                case 'slot':
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>';
                case 'casino':
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5S17.33 9 16.5 9z"/></svg>';
                case 'sports':
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>';
                default:
                    return '<svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>';
            }
        }

        function renderCategorySliderButtons(categoriesMap) {
            const barContainer = document.getElementById('categorySliderBar');
            if (!barContainer) return;

            let html = `
                <button type="button" onclick="filterCategoryButton('all')" class="category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition ${activeFilterCategory === 'all' ? 'bg-[#1F51FF] text-[#FFFFFF] shadow-sm' : 'bg-[#1A2C38] text-[#FFFFFF] border border-[#0F212E]'}" data-cat="all">
                    ${getCategorySvgIcon('all')} All Games
                </button>
            `;

            const orderedKeys = ['original', 'color_trading', 'lucky_lottery', 'slot', 'casino', 'sports'];
            let displayedKeys = [...new Set(Object.keys(categoriesMap))];

            orderedKeys.forEach(k => {
                if (categoriesMap[k]) {
                    const title = categoriesMap[k];
                    const isActive = activeFilterCategory === k;
                    html += `
                        <button type="button" onclick="filterCategoryButton('${k}')" class="category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition ${isActive ? 'bg-[#1F51FF] text-[#FFFFFF] shadow-sm' : 'bg-[#1A2C38] text-[#FFFFFF] border border-[#0F212E]'}" data-cat="${k}">
                            ${getCategorySvgIcon(k)} ${title}
                        </button>
                    `;
                }
            });

            displayedKeys.forEach(k => {
                if (!orderedKeys.includes(k) && categoriesMap[k]) {
                    const title = categoriesMap[k];
                    const isActive = activeFilterCategory === k;
                    html += `
                        <button type="button" onclick="filterCategoryButton('${k}')" class="category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition ${isActive ? 'bg-[#1F51FF] text-[#FFFFFF] shadow-sm' : 'bg-[#1A2C38] text-[#FFFFFF] border border-[#0F212E]'}" data-cat="${k}">
                            ${getCategorySvgIcon(k)} ${title}
                        </button>
                    `;
                }
            });

            barContainer.innerHTML = html;
        }

        function filterCategoryButton(categoryKey) {
            activeFilterCategory = categoryKey;
            
            document.querySelectorAll('.category-filter-btn').forEach(btn => {
                const isSelected = btn.getAttribute('data-cat') === categoryKey;
                if (isSelected) {
                    btn.className = 'category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition bg-[#1F51FF] text-[#FFFFFF] shadow-sm';
                } else {
                    btn.className = 'category-filter-btn whitespace-nowrap flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--font-xs)] font-bold transition bg-[#1A2C38] text-[#FFFFFF] border border-[#0F212E]';
                }
            });

            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            let catKeys = [...new Set(allGridsData.map(item => item.categoryKey))];
            
            if (activeFilterCategory !== 'all') {
                catKeys = catKeys.filter(k => k === activeFilterCategory);
            }

            catKeys.forEach(catKey => {
                const catItems = allGridsData.filter(item => item.categoryKey === catKey);
                if (catItems.length === 0) return;

                const categoryTitle = catItems[0].categoryTitle;
                const currentIndex = categoryIndices[catKey] || 0;
                const visibleItems = activeFilterCategory === 'all' ? catItems.slice(currentIndex, currentIndex + 3) : catItems;

                const section = document.createElement('div');
                section.className = 'space-y-3 pb-4 border-b border-[#1A2C38]';
                section.innerHTML = `
                    <div class="flex items-center justify-between border-b border-[#0F212E] pb-2"> 
                        <h2 class="text-[var(--font-sm)] sm:text-[var(--font-md)] font-bold text-[#FFFFFF] flex items-center gap-2 cursor-pointer hover:text-[#1F51FF] transition" onclick="openCategoryModal('${catKey}', '${categoryTitle}')" title="Click to view all"> 
                            <span class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span> ${categoryTitle} 
                        </h2> 
                        ${activeFilterCategory === 'all' ? `
                        <div class="flex items-center gap-1.5">
                            <button onclick="slideCategory('${catKey}', -1)" class="w-7 h-7 rounded-full bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:bg-[#1F51FF] transition">
                                <svg class="w-3 h-3 fill-current text-white" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            </button>
                            <button onclick="slideCategory('${catKey}', 1)" class="w-7 h-7 rounded-full bg-[#1A2C38] border border-[#0F212E] flex items-center justify-center text-[#FFFFFF] hover:bg-[#1F51FF] transition">
                                <svg class="w-3 h-3 fill-current text-white" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                            </button>
                        </div>` : ''}
                    </div> 
                    <div class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5 slide-animate" id="grid-${CSS.escape(catKey)}">
                    </div>
                `;

                container.appendChild(section);

                const gridContainer = section.querySelector(`#grid-${CSS.escape(catKey)}`);
                const fragment = document.createDocumentFragment();

                visibleItems.forEach(game => {
                    let imageUrl = game.imageUrl ? game.imageUrl.trim() : '';
                    let pageUrl = game.pageUrl ? game.pageUrl.trim() : '#';
                    const hasImg = imageUrl !== '';
                    const title = game.title || 'Untitled Game';
                    const catBadge = categoryTitle.toUpperCase();
                    const showTitle = game.show_title !== false;
                    const showBadge = game.show_badge !== false;

                    const card = document.createElement('a');
                    card.href = pageUrl;
                    card.className = 'game-card group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#1F51FF] rounded-2xl overflow-hidden flex flex-col justify-between transition-transform duration-150 shadow-lg';
                    card.innerHTML = ` 
                        <div class="game-art absolute inset-0 bg-gradient-to-b from-indigo-900/60 to-[#1A2C38] flex flex-col items-center justify-center p-1">
                          ${hasImg 
                            ? `<img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-200" loading="lazy" />`
                            : `<svg class="w-8 h-8 fill-current text-white/80 mb-2" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8z"/></svg>
                               ${showTitle ? `<div class="text-center font-black text-xs sm:text-sm text-[#FFFFFF] tracking-wide drop-shadow-lg px-2">${title}</div>` : ''}`
                          }
                        </div>
                        <div class="relative z-10 flex justify-end items-center p-2">
                          ${showBadge ? `<span class="text-[9px] sm:text-[10px] font-bold text-[#FFFFFF] bg-black/60 px-2 py-0.5 rounded-full border border-white/10 backdrop-blur-sm">${catBadge}</span>` : ''}
                        </div>
                        <div class="relative z-10 p-2 text-center bg-gradient-to-t from-black/90 via-black/50 to-transparent">
                          ${showTitle ? `<span class="text-[9px] sm:text-[11px] font-bold tracking-wider text-[#FFFFFF] truncate block">${title}</span>` : ''}
                        </div>
                    `;
                    fragment.appendChild(card);
                });

                gridContainer.appendChild(fragment);
            });
        }

        function slideCategory(catKey, direction) {
            const catItems = allGridsData.filter(item => item.categoryKey === catKey);
            if (catItems.length <= 3) return; 

            let currentIndex = categoryIndices[catKey] || 0;
            currentIndex += direction * 3;

            if (currentIndex >= catItems.length) {
                currentIndex = 0; 
            } else if (currentIndex < 0) {
                currentIndex = Math.max(0, catItems.length - 3); 
            }

            categoryIndices[catKey] = currentIndex;
            renderCategories();
        }

        async function openCategoryModal(catKey, categoryTitle) {
            const modal = document.getElementById('categoryModal');
            const modalLoader = document.getElementById('modalLoader');
            const modalGrid = document.getElementById('modalGamesGrid');

            document.getElementById('modalTitleText').innerText = categoryTitle;

            modal.classList.remove('hidden');
            modalLoader.classList.remove('hidden');
            modalGrid.classList.add('hidden');

            const catItems = allGridsData.filter(item => item.categoryKey === catKey);

            modalGrid.innerHTML = catItems.map(game => {
                let imageUrl = game.imageUrl ? game.imageUrl.trim() : '';
                let pageUrl = game.pageUrl ? game.pageUrl.trim() : '#';
                const hasImg = imageUrl !== '';
                const title = game.title || 'Untitled Game';
                const catBadge = categoryTitle.toUpperCase();
                const showTitle = game.show_title !== false;
                const showBadge = game.show_badge !== false;

                return `
                    <a href="${pageUrl}" class="game-card group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#1F51FF] rounded-2xl overflow-hidden flex flex-col justify-between transition-transform duration-150 shadow-lg">
                        <div class="game-art absolute inset-0 bg-gradient-to-b from-indigo-900/60 to-[#1A2C38] flex flex-col items-center justify-center p-1">
                          ${hasImg 
                            ? `<img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-200" loading="lazy" />`
                            : `<svg class="w-8 h-8 fill-current text-white/80 mb-2" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8z"/></svg>
                               ${showTitle ? `<div class="text-center font-black text-xs sm:text-sm text-[#FFFFFF] tracking-wide drop-shadow-lg px-2">${title}</div>` : ''}`
                          }
                        </div>
                        <div class="relative z-10 flex justify-end items-center p-2">
                          ${showBadge ? `<span class="text-[9px] sm:text-[10px] font-bold text-[#FFFFFF] bg-black/60 px-2 py-0.5 rounded-full border border-white/10 backdrop-blur-sm">${catBadge}</span>` : ''}
                        </div>
                        <div class="relative z-10 p-2 text-center bg-gradient-to-t from-black/90 via-black/50 to-transparent">
                          ${showTitle ? `<span class="text-[9px] sm:text-[11px] font-bold tracking-wider text-[#FFFFFF] truncate block">${title}</span>` : ''}
                        </div>
                    </a>
                `;
            }).join('');

            setTimeout(() => {
                modalLoader.classList.add('hidden');
                modalGrid.classList.remove('hidden');
            }, 2500);

            try {
                const topRes = await fetch('bar/top.html');
                if (topRes.ok) {
                    document.getElementById('modalTopBar').innerHTML = await topRes.text();
                }
                const botRes = await fetch('bar/bottom.html');
                if (botRes.ok) {
                    document.getElementById('modalBottomBar').innerHTML = await botRes.text();
                }
            } catch (err) {
                console.error('Modal Bars Load Error:', err);
            }
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
        }

        async function loadBottomBar() {
            try {
                const response = await fetch('bar/bottom.html');
                if (response.ok) {
                    const html = await response.text();
                    const bottomBarContainer = document.getElementById('bottomBarContainer');
                    if (bottomBarContainer) {
                        bottomBarContainer.innerHTML = html;
                    }
                }
            } catch (err) {
                console.error('Error loading bottom bar component:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => { 
            loadTopBar(); 
            loadBottomBar();
            loadDynamicBanners(); 
            fetchGridData(); 
        }); 
    </script> 
</body> 
</html>
