<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Portal - Online Gaming Platform</title> 
    <!-- Tailwind CSS CDN --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Supabase JS Client & App Config --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <script src="supabase-config.js"></script> 
    <style> 
        /* Custom Scrollbar Styling */ 
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: #0b0f19; } 
        ::-webkit-scrollbar-thumb { background: #1b2438; border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: #283552; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
        /* Mobile scrolling optimization */ 
        html { overflow-y: auto; -webkit-overflow-scrolling: touch; } 
        body { overflow-x: hidden; } 
        img { -webkit-user-drag: none; } 
    </style> 
</head> 
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-black"> 
    <!-- Top Navigation Bar Anchor Container --> 
    <div id="topBarContainer" class="sticky top-0 z-50"></div> 

    <!-- Main Application Wrapper --> 
    <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-5"> 
        <!-- Category Navigation Bar --> 
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3"> 
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"> 
                <button onclick="filterCategory('original')" id="catOriginal" class="flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap"> Original Games </button> 
                <button onclick="filterCategory('colortrading')" id="catColortrading" class="flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap"> Color Trading </button> 
                <button onclick="filterCategory('blackjack')" id="catBlackjack" class="flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap"> Blackjack </button> 
                <button onclick="filterCategory('live')" id="catLive" class="flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap"> Live Casino </button> 
            </div> 
            <div class="hidden sm:flex items-center bg-[#111827] border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-400"> 
                <input type="text" id="gameSearch" onkeyup="searchGames()" placeholder="Search game..." class="bg-transparent text-white focus:outline-none w-28 lg:w-40"> 
            </div> 
        </div> 

        <!-- Games Grid Section --> 
        <section> 
            <div class="flex items-center justify-between mb-4"> 
                <h2 id="sectionTitle" class="text-base font-bold text-white flex items-center gap-2"> 
                    <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span> Original Games 
                </h2> 
            </div> 
            <!-- Exactly 3 Columns Grid --> 
            <div id="gamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5"> 
                <!-- Dynamic game cards rendered here --> 
            </div> 
        </section> 
    </div> 

    <!-- Footer Section --> 
    <footer class="bg-[#111827] border-t border-slate-800/80 mt-12 py-6 text-center text-xs text-slate-500 space-y-2"> 
        <p>&copy; 2026 Game Portal. All Rights Reserved.</p> 
    </footer> 

    <script> 
        // Games List Configuration 
        const gameList = [ 
            { id: 'dice', name: 'Classic Dice', path: 'game/dice.html', category: 'original', players: 1077, image: 'assets/images/dice.png', fallbackBg: 'from-emerald-900 to-slate-950' }, 
            { id: 'mines', name: 'Mines', path: 'game/mines.html', category: 'original', players: 710, image: 'assets/images/mines.png', fallbackBg: 'from-indigo-900 to-slate-950' }, 
            { id: 'limbo', name: 'Limbo', path: 'game/limbo.html', category: 'original', players: 415, image: 'assets/images/limbo.png', fallbackBg: 'from-emerald-950 to-slate-950' }, 
            { id: 'plinko', name: 'Plinko', path: 'game/plinko.html', category: 'original', players: 305, image: 'assets/images/plinko.png', fallbackBg: 'from-cyan-950 to-slate-950' }, 
            { id: 'crash', name: 'Crash', path: 'game/crash.html', category: 'original', players: 1552, image: 'assets/images/crash.png', fallbackBg: 'from-purple-950 to-slate-950' }, 
            { id: 'wheel', name: 'Wheel', path: 'game/wheel.html', category: 'original', players: 210, image: 'assets/images/wheel.png', fallbackBg: 'from-fuchsia-950 to-slate-950' }, 
            { id: 'keno', name: 'Keno', path: 'game/keno.html', category: 'original', players: 145, image: 'assets/images/keno.png', fallbackBg: 'from-amber-950 to-slate-950' }, 
            { id: 'coin-flip', name: 'Coin Flip', path: 'game/coin-flip.html', category: 'original', players: 180, image: 'assets/images/coin-flip.png', fallbackBg: 'from-yellow-900 to-slate-950' }, 
            
            // Color Trading Cards (Total 6 Cards)
            { id: 'color-trade-win-go', name: 'Color Trade Win Go', path: 'color-trading/card/cards.html', category: 'colortrading', players: 340, image: 'assets/images/color-trade.png', fallbackBg: 'from-emerald-950 to-slate-950' },
            { id: 'roulette', name: 'Roulette', path: 'color-trading/card/cards.html', category: 'colortrading', players: 255, image: 'assets/images/roulette.png', fallbackBg: 'from-rose-950 to-slate-950' }, 
            { id: 'color-trade-k3', name: 'K3 Lotter Trading', path: 'color-trading/card/cards.html', category: 'colortrading', players: 290, image: 'assets/images/k3.png', fallbackBg: 'from-blue-950 to-slate-950' },
            { id: 'color-trade-5d', name: '5D Lotter Trading', path: 'color-trading/card/cards.html', category: 'colortrading', players: 310, image: 'assets/images/5d.png', fallbackBg: 'from-purple-950 to-slate-950' },
            { id: 'color-trade-trx', name: 'TRX Win Go', path: 'color-trading/card/cards.html', category: 'colortrading', players: 420, image: 'assets/images/trx.png', fallbackBg: 'from-amber-950 to-slate-950' },
            { id: 'color-trade-parity', name: 'Parity Trading', path: 'color-trading/card/cards.html', category: 'colortrading', players: 195, image: 'assets/images/parity.png', fallbackBg: 'from-teal-950 to-slate-950' },
            
            // Blackjack & Live Cards
            { id: 'blackjack', name: 'Blackjack', path: 'blackjack/blackjacktable.html', category: 'blackjack', players: 470, image: 'assets/images/blackjack.png', fallbackBg: 'from-blue-950 to-slate-950' },
            { id: 'live-baccarat', name: 'Live Baccarat', path: 'live/baccarat.html', category: 'live', players: 520, image: 'assets/images/baccarat.png', fallbackBg: 'from-red-950 to-slate-950' },
            { id: 'live-dragon-tiger', name: 'Dragon Tiger', path: 'live/dragon-tiger.html', category: 'live', players: 310, image: 'assets/images/dragon-tiger.png', fallbackBg: 'from-amber-900 to-slate-950' }
        ]; 

        let currentCategory = 'original'; 
        let balanceSubscription = null; 
        let playerUpdateInterval = null; 

        // Supabase Realtime User Balance Sync 
        async function syncRealtimeUserBalance() { 
            try { 
                if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') { 
                    const user = await getCurrentUser(); 
                    if (user) { 
                        const { data: profile } = await supabaseClient 
                            .from('profiles') 
                            .select('balance') 
                            .eq('id', user.id) 
                            .single(); 
                        const balanceElement = document.getElementById('topBarBalance'); 
                        if (profile && balanceElement) { 
                            balanceElement.innerText = parseFloat(profile.balance).toFixed(2); 
                        } 
                        if (!balanceSubscription) { 
                            balanceSubscription = supabaseClient 
                                .channel('public:profiles:' + user.id) 
                                .on('postgres_changes', { 
                                    event: 'UPDATE', 
                                    schema: 'public', 
                                    table: 'profiles', 
                                    filter: `id=eq.${user.id}` 
                                }, (payload) => { 
                                    if (payload.new && payload.new.balance !== undefined) { 
                                        const topBal = document.getElementById('topBarBalance'); 
                                        if (topBal) { 
                                            topBal.innerText = parseFloat(payload.new.balance).toFixed(2); 
                                        } 
                                    } 
                                }) 
                                .subscribe(); 
                        } 
                    } 
                } 
            } catch (err) { 
                console.error('Balance Sync Error:', err); 
            } 
        } 

        // Dynamic Top Bar Loader 
        async function loadTopBar() { 
            try { 
                const response = await fetch('bar/top.html'); 
                if (response.ok) { 
                    const html = await response.text(); 
                    document.getElementById('topBarContainer').innerHTML = html; 
                    syncRealtimeUserBalance(); 
                } 
            } catch (err) { 
                console.error('Error loading top bar component:', err); 
            } 
        } 

        // Optimized Live Players Update 
        function startLivePlayerUpdates() { 
            if (playerUpdateInterval) { 
                clearInterval(playerUpdateInterval); 
            } 
            playerUpdateInterval = setInterval(() => { 
                const visibleCounts = document.querySelectorAll('[id^="player-count-"]'); 
                visibleCounts.forEach((playerElem) => { 
                    const gameId = playerElem.id.replace('player-count-', ''); 
                    const game = gameList.find(item => item.id === gameId); 
                    if (!game) return; 
                    const variation = Math.floor(Math.random() * 7) - 3; 
                    game.players = Math.max(50, game.players + variation); 
                    playerElem.textContent = game.players.toLocaleString(); 
                }); 
            }, 8000); 
        } 

        // Render Game Cards 
        function renderGames(filter = 'original', searchQuery = '') { 
            const grid = document.getElementById('gamesGrid'); 
            grid.innerHTML = ''; 
            const normalizedQuery = searchQuery.toLowerCase(); 
            const filteredGames = gameList.filter(game => { 
                const matchesCategory = filter === 'all' || game.category === filter; 
                const matchesSearch = game.name.toLowerCase().includes(normalizedQuery); 
                return matchesCategory && matchesSearch; 
            }); 

            if (filteredGames.length === 0) { 
                grid.innerHTML = ` 
                    <div class="col-span-full text-center py-12 text-slate-500 text-xs bg-[#111827] rounded-2xl border border-slate-800"> 
                        No games found for the selected category. 
                    </div> 
                `; 
                return; 
            } 

            const fragment = document.createDocumentFragment(); 
            filteredGames.forEach((game) => { 
                const card = document.createElement('a'); 
                card.href = game.path; 
                card.className = 'group relative bg-[#111827] border border-slate-800 hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-52 md:h-56 transition-transform duration-100'; 
                card.innerHTML = ` 
                    <img src="${game.image}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="absolute inset-0 w-full h-full object-cover z-0" alt="${game.name}" loading="lazy" decoding="async" /> 
                    <div class="hidden absolute inset-0 bg-gradient-to-b ${game.fallbackBg} opacity-90"></div> 
                    <div class="relative z-20 flex justify-end items-center p-2.5"> 
                        <span class="text-[10px] font-bold text-slate-200 bg-black/60 px-2 py-0.5 rounded-full border border-white/10"> 
                            <span id="player-count-${game.id}">${game.players.toLocaleString()}</span> 
                        </span> 
                    </div> 
                    <div></div> 
                `; 
                fragment.appendChild(card); 
            }); 
            grid.appendChild(fragment); 
        } 

        // Category Filter Switcher 
        function filterCategory(cat) { 
            currentCategory = cat; 
            const categories = ['original', 'colortrading', 'blackjack', 'live']; 
            categories.forEach(c => { 
                let idName = c;
                if (c === 'colortrading') idName = 'Colortrading';
                const btn = document.getElementById(`cat${idName.charAt(0).toUpperCase() + idName.slice(1)}`); 
                if (btn) { 
                    if (c === cat) { 
                        btn.className = 'flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap'; 
                    } else { 
                        btn.className = 'flex items-center gap-2 bg-[#111827] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap'; 
                    } 
                } 
            }); 

            const titles = { 
                original: 'Original Games', 
                colortrading: 'Color Trading Games', 
                blackjack: 'Blackjack Games', 
                live: 'Live Casino' 
            }; 
            document.getElementById('sectionTitle').innerHTML = ` 
                <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span> ${titles[cat] || 'Games'} 
            `; 
            renderGames(cat); 
        } 

        // Search Filter 
        function searchGames() { 
            const searchInput = document.getElementById('gameSearch'); 
            if (!searchInput) return; 
            renderGames(currentCategory, searchInput.value); 
        } 

        // Initialization Logic 
        document.addEventListener('DOMContentLoaded', () => { 
            loadTopBar(); 
            renderGames('original'); 
            startLivePlayerUpdates(); 
        }); 
    </script> 
</body> 
</html>
