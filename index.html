<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Portal - Online Gaming Platform</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track { background: #0f141c; }
    ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#0f141c] text-white min-h-screen flex flex-col font-sans antialiased">

  <!-- Top Navigation Bar Anchor Container -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <!-- Main Application Wrapper -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-6 space-y-5">

    <!-- Category Navigation Bar -->
    <div class="flex items-center justify-between border-b border-gray-800/80 pb-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
        <button onclick="filterCategory('original')" id="catOriginal" class="flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md whitespace-nowrap">
          Original Games
        </button>
        <button onclick="filterCategory('all')" id="catAll" class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          All Games
        </button>
        <button onclick="filterCategory('slots')" id="catSlots" class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Slots
        </button>
        <button onclick="filterCategory('live')" id="catLive" class="flex items-center gap-2 bg-[#161b22] hover:bg-gray-800 border border-gray-800 text-gray-300 font-bold px-3.5 py-2 rounded-xl text-xs transition whitespace-nowrap">
          Live Casino
        </button>
      </div>

      <div class="hidden sm:flex items-center bg-[#161b22] border border-gray-800 rounded-xl px-3 py-1.5 text-xs text-gray-400">
        <input type="text" id="gameSearch" onkeyup="searchGames()" placeholder="Search game..." class="bg-transparent text-white focus:outline-none w-28 lg:w-40">
      </div>
    </div>

    <!-- Games Grid Section -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 id="sectionTitle" class="text-base font-bold text-white flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span>
          Original Games (game/)
        </h2>
        <span class="text-xs text-gray-500 font-medium" id="gameCount">8 Games Available</span>
      </div>

      <!-- 3 Columns Grid -->
      <div id="gamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5">
        <!-- Dynamic game cards rendered here -->
      </div>
    </section>

  </div>

  <script>
    // List of games with Thumbnail Image and Online Player Count
    const gameList = [
      { 
        id: 'dice', 
        name: 'Classic Dice', 
        path: 'game/dice.html', 
        category: 'original', 
        image: '🎲', 
        thumb: 'assets/images/dice.png', // আপনার ছবির লিঙ্ক
        players: '2,155',
        bg: 'from-emerald-600 to-teal-950'
      },
      { 
        id: 'mines', 
        name: 'Mines', 
        path: 'game/mines.html', 
        category: 'original', 
        image: '💣', 
        thumb: 'assets/images/mines.png',
        players: '1,420',
        bg: 'from-purple-600 to-indigo-950'
      },
      { 
        id: 'limbo', 
        name: 'Limbo', 
        path: 'game/limbo.html', 
        category: 'original', 
        image: '🚀', 
        thumb: 'assets/images/limbo.png',
        players: '830',
        bg: 'from-emerald-600 to-green-950'
      },
      { 
        id: 'plinko', 
        name: 'Plinko', 
        path: 'game/plinko.html', 
        category: 'original', 
        image: '⚪', 
        thumb: 'assets/images/plinko.png',
        players: '610',
        bg: 'from-teal-600 to-cyan-950'
      },
      { 
        id: 'crash', 
        name: 'Crash', 
        path: 'game/crash.html', 
        category: 'original', 
        image: '📈', 
        thumb: 'assets/images/crash.png',
        players: '3,105',
        bg: 'from-purple-700 to-purple-950'
      },
      { 
        id: 'wheel', 
        name: 'Wheel', 
        path: 'game/wheel.html', 
        category: 'original', 
        image: '🎡', 
        thumb: 'assets/images/wheel.png',
        players: '420',
        bg: 'from-fuchsia-600 to-pink-950'
      },
      { 
        id: 'keno', 
        name: 'Keno', 
        path: 'game/keno.html', 
        category: 'original', 
        image: '🔢', 
        thumb: 'assets/images/keno.png',
        players: '290',
        bg: 'from-amber-600 to-yellow-950'
      },
      { 
        id: 'roulette', 
        name: 'Roulette', 
        path: 'game/roulette.html', 
        category: 'original', 
        image: '🎰', 
        thumb: 'assets/images/roulette.png',
        players: '510',
        bg: 'from-red-600 to-rose-950'
      }
    ];

    let currentCategory = 'original';

    async function loadTopBar() {
      try {
        const response = await fetch('bar/top.html');
        if (response.ok) {
          const html = await response.text();
          document.getElementById('topBarContainer').innerHTML = html;
          if (typeof syncTopBarBalance === 'function') syncTopBarBalance();
        }
      } catch (err) { console.error(err); }
    }

    function renderGames(filter = 'original', searchQuery = '') {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const filteredGames = gameList.filter(game => {
        const matchesCategory = (filter === 'all') || (game.category === filter);
        const matchesSearch = game.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      document.getElementById('gameCount').innerText = `${filteredGames.length} Games Available`;

      filteredGames.forEach(game => {
        const card = document.createElement('a');
        card.href = game.path;
        card.className = "group relative bg-[#161b22] border border-gray-800/80 hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-52 md:h-56 transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-[#24ee89]/10";
        
        card.innerHTML = `
          <!-- Gradient Background -->
          <div class="absolute inset-0 bg-gradient-to-b ${game.bg} opacity-90 group-hover:opacity-100 transition"></div>
          
          <!-- Top Bar: Player Count Badge -->
          <div class="relative z-10 flex justify-end p-2">
            <span class="text-[9px] font-bold text-white bg-black/40 backdrop-blur-md px-2 py-0.5 rounded-full border border-white/10 flex items-center gap-1">
              👤 ${game.players}
            </span>
          </div>

          <!-- Thumbnail Image (If image file exists) or Emoji Fallback -->
          <div class="relative z-10 flex justify-center items-center my-auto px-2">
            <img src="${game.thumb}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="max-h-20 sm:max-h-24 object-contain drop-shadow-2xl transition duration-300 group-hover:scale-105" />
            <span class="hidden text-3xl sm:text-4xl transition duration-300 group-hover:scale-110">${game.image}</span>
          </div>

          <!-- Bottom Title Overlay -->
          <div class="relative z-10 p-2.5 bg-gradient-to-t from-black/90 via-black/50 to-transparent text-center">
            <h3 class="text-xs sm:text-sm font-black text-white tracking-wide uppercase group-hover:text-[#24ee89] transition truncate">
              ${game.name}
            </h3>
            <span class="text-[8px] font-semibold text-gray-300 block uppercase tracking-wider">
              Original Game
            </span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      renderGames(cat);
    }

    function searchGames() {
      const query = document.getElementById('gameSearch').value;
      renderGames(currentCategory, query);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTopBar();
      renderGames('original');
    });
  </script>
</body>
</html>
