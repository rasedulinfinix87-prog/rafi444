<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Portal - Online Gaming Platform</title> 
    <!-- Tailwind CSS CDN --> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <!-- Supabase JS Client & App Config --> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <script src="supabase-config.js"></script> 
    <style> 
        /* Custom Scrollbar Styling */ 
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: #080B10; } 
        ::-webkit-scrollbar-thumb { background: #1b2438; border-radius: 4px; } 
        ::-webkit-scrollbar-thumb:hover { background: #283552; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
        /* Mobile scrolling optimization */ 
        html { overflow-y: auto; -webkit-overflow-scrolling: touch; background: #080B10; } 
        body { overflow-x: hidden; background: #080B10; color: #ffffff; } 
        img { -webkit-user-drag: none; } 

        /* Shuffle Style Glass & Accents */
        .glass-card {
            background: rgba(245, 207, 102, 0.04);
            border: 1px solid rgba(245, 207, 102, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
        }

        .shuffle-banner {
            background: linear-gradient(135deg, #151a23 0%, #0d1118 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
    </style> 
</head> 
<body class="bg-[#080B10] text-white min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-black pb-24"> 
    <!-- Top Navigation Bar Anchor Container --> 
    <div id="topBarContainer" class="sticky top-0 z-50"></div> 

    <!-- Main Application Wrapper --> 
    <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-4 py-3 sm:py-5 space-y-4"> 
        
        <!-- Shuffle Style Promotional Banner Container (Dynamic Supabase support) -->
        <div id="bannerContainer" class="shuffle-banner rounded-2xl p-4 sm:p-6 flex flex-col justify-between relative shadow-xl min-h-[130px]">
            <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-[#24ee89]/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 space-y-1.5 max-w-sm">
                <span class="inline-block bg-[#24ee89]/15 text-[#24ee89] border border-[#24ee89]/30 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Refreshed!</span>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white uppercase italic">Boost Your Level Up!</h1>
                <p class="text-xs text-slate-400 font-medium">Earn more rewards now when ranking up!</p>
            </div>
        </div>

        <!-- Category Navigation Bar --> 
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3"> 
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"> 
                <button onclick="filterCategory('original')" id="catOriginal" class="flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-4 py-2.5 rounded-xl text-xs transition shadow-md whitespace-nowrap"> Original Games </button> 
                <button onclick="filterCategory('colortrading')" id="catColortrading" class="flex items-center gap-2 bg-[#151a23] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition whitespace-nowrap"> Color Trading </button> 
                <button onclick="filterCategory('blackjack')" id="catBlackjack" class="flex items-center gap-2 bg-[#151a23] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition whitespace-nowrap"> Blackjack </button> 
                <button onclick="filterCategory('live')" id="catLive" class="flex items-center gap-2 bg-[#151a23] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition whitespace-nowrap"> Live Casino </button> 
            </div> 
            <div class="hidden sm:flex items-center bg-[#151a23] border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-400"> 
                <input type="text" id="gameSearch" onkeyup="searchGames()" placeholder="Search game..." class="bg-transparent text-white focus:outline-none w-28 lg:w-40"> 
            </div> 
        </div> 

        <!-- Games Grid Section --> 
        <section> 
            <div class="flex items-center justify-between mb-3.5"> 
                <h2 id="sectionTitle" class="text-sm sm:text-base font-bold text-white flex items-center gap-2"> 
                    <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span> Original Games 
                </h2> 
            </div> 
            <!-- Exactly 3 Columns Grid --> 
            <div id="gamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4 md:gap-5"> 
                <!-- Dynamic game cards from Supabase grid_control_url_image rendered here --> 
            </div> 
        </section> 
    </div> 

    <!-- Footer Section --> 
    <footer class="bg-[#151a23] border-t border-slate-800/80 mt-12 py-6 text-center text-xs text-slate-500 space-y-2"> 
        <p>&copy; 2026 Game Portal. All Rights Reserved.</p> 
    </footer> 

    <!-- Dynamic Bottom Bar Anchor Container -->
    <div id="bottomBarContainer" class="fixed bottom-0 left-0 right-0 z-50"></div>

    <script> 
        let currentCategory = 'original'; 
        let balanceSubscription = null; 
        let playerUpdateInterval = null; 
        let dynamicGrids = [];

        // Supabase Realtime User Balance Sync 
        async function syncRealtimeUserBalance() { 
            try { 
                if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') { 
                    const user = await getCurrentUser(); 
                    if (user) { 
                        const { data: profile } = await supabaseClient 
                            .from('profiles') 
                            .select('balance') 
                            .eq('id', user.id) 
                            .single(); 
                        const balanceElement = document.getElementById('topBarBalance'); 
                        if (profile && balanceElement) { 
                            balanceElement.innerText = parseFloat(profile.balance).toFixed(2); 
                        } 
                        if (!balanceSubscription) { 
                            balanceSubscription = supabaseClient 
                                .channel('public:profiles:' + user.id) 
                                .on('postgres_changes', { 
                                    event: 'UPDATE', 
                                    schema: 'public', 
                                    table: 'profiles', 
                                    filter: `id=eq.${user.id}` 
                                }, (payload) => { 
                                    if (payload.new && payload.new.balance !== undefined) { 
                                        const topBal = document.getElementById('topBarBalance'); 
                                        if (topBal) { 
                                            topBal.innerText = parseFloat(payload.new.balance).toFixed(2); 
                                        } 
                                    } 
                                }) 
                                .subscribe(); 
                        } 
                    } 
                } 
            } catch (err) { 
                console.error('Balance Sync Error:', err); 
            } 
        } 

        // Dynamic Top Bar Loader 
        async function loadTopBar() { 
            try { 
                const response = await fetch('bar/top.html'); 
                if (response.ok) { 
                    const html = await response.text(); 
                    document.getElementById('topBarContainer').innerHTML = html; 
                    syncRealtimeUserBalance(); 
                } 
            } catch (err) { 
                console.error('Error loading top bar component:', err); 
            } 
        } 

        // Supabase থেকে ব্যানার ফেচ করার ফাংশন
        async function loadDynamicBanner() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data: banners, error } = await supabaseClient
                    .from('site_banners')
                    .select('*')
                    .eq('is_active', true)
                    .order('created_at', { ascending: false })
                    .limit(1);

                const bannerContainer = document.getElementById('bannerContainer');
                if (!bannerContainer) return;

                if (error || !banners || banners.length === 0) {
                    bannerContainer.innerHTML = `
                        <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-[#24ee89]/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 space-y-1.5 max-w-sm">
                            <span class="inline-block bg-[#24ee89]/15 text-[#24ee89] border border-[#24ee89]/30 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Refreshed!</span>
                            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white uppercase italic">Boost Your Level Up!</h1>
                            <p class="text-xs text-slate-400 font-medium">Earn more rewards now when ranking up!</p>
                        </div>
                    `;
                    return;
                }

                const banner = banners[0];
                let bgStyle = '';
                if (banner.image_url) {
                    bgStyle = `background-image: url('${banner.image_url}'); background-size: cover; background-position: center;`;
                }

                bannerContainer.style.cssText += bgStyle;
                bannerContainer.innerHTML = `
                    <div class="absolute inset-0 bg-black/40 z-0"></div>
                    <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-[#24ee89]/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="relative z-10 space-y-1.5 max-w-sm">
                        ${banner.badge_text ? `<span class="inline-block bg-[#24ee89]/15 text-[#24ee89] border border-[#24ee89]/30 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider">${banner.badge_text}</span>` : ''}
                        <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white uppercase italic">${banner.title}</h1>
                        ${banner.subtitle ? `<p class="text-xs text-slate-300 font-medium">${banner.subtitle}</p>` : ''}
                    </div>
                    ${banner.link_url ? `<a href="${banner.link_url}" class="absolute inset-0 z-20"></a>` : ''}
                `;
            } catch (err) {
                console.error('Banner Load Error:', err);
            }
        }

        // Supabase থেকে `grid_control_url_image` টেবিল ডেটা ফেচ করা
        async function fetchGridData() {
            try {
                if (typeof supabaseClient === 'undefined') return;

                const { data, error } = await supabaseClient
                    .from('grid_control_url_image')
                    .select('*')
                    .eq('is_active', true)
                    .order('sort_order', { ascending: true });

                if (!error && data) {
                    dynamicGrids = data.map(item => ({
                        id: item.id,
                        name: item.title,
                        path: item.page_url,
                        category: item.category ? item.category.toLowerCase().trim() : 'original',
                        players: Math.floor(Math.random() * 800) + 150, // লাইভ প্লেয়ার কাউন্ট সিমুলেশন
                        image: item.image_url,
                        fallbackBg: 'from-emerald-900 to-slate-950'
                    }));
                    renderGames(currentCategory);
                }
            } catch (err) {
                console.error('Grid Data Fetch Error:', err);
            }
        }

        // Render Game Cards 
        function renderGames(filter = 'original', searchQuery = '') { 
            const grid = document.getElementById('gamesGrid'); 
            grid.innerHTML = ''; 
            const normalizedQuery = searchQuery.toLowerCase(); 
            
            const filteredGames = dynamicGrids.filter(game => { 
                const matchesCategory = filter === 'all' || game.category === filter; 
                const matchesSearch = game.name.toLowerCase().includes(normalizedQuery); 
                return matchesCategory && matchesSearch; 
            }); 

            if (filteredGames.length === 0) { 
                grid.innerHTML = ` 
                    <div class="col-span-full text-center py-12 text-slate-500 text-xs bg-[#151a23] rounded-2xl border border-slate-800"> 
                        No games found for the selected category. 
                    </div> 
                `; 
                return; 
            } 

            const fragment = document.createDocumentFragment(); 
            filteredGames.forEach((game) => { 
                const card = document.createElement('a'); 
                card.href = game.path; 
                card.className = 'group relative bg-[#151a23] border border-slate-800/80 hover:border-[#24ee89]/60 rounded-2xl overflow-hidden flex flex-col justify-between h-40 sm:h-48 md:h-52 transition-all duration-200 hover:scale-[1.02] shadow-lg'; 
                card.innerHTML = ` 
                    <img src="${game.image}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="absolute inset-0 w-full h-full object-cover z-0" alt="${game.name}" loading="lazy" decoding="async" /> 
                    <div class="hidden absolute inset-0 bg-gradient-to-b ${game.fallbackBg} opacity-90"></div> 
                    <div class="relative z-20 flex justify-end items-center p-2.5"> 
                        <span class="text-[10px] font-bold text-slate-200 bg-black/60 px-2.5 py-0.5 rounded-full border border-white/10 backdrop-blur-md"> 
                            <span id="player-count-${game.id}">${game.players.toLocaleString()}</span> playing
                        </span> 
                    </div> 
                    <div></div> 
                `; 
                fragment.appendChild(card); 
            }); 
            grid.appendChild(fragment); 
        } 

        // Category Filter Switcher 
        function filterCategory(cat) { 
            currentCategory = cat; 
            const categories = ['original', 'colortrading', 'blackjack', 'live']; 
            categories.forEach(c => { 
                let idName = c;
                if (c === 'colortrading') idName = 'Colortrading';
                const btn = document.getElementById(`cat${idName.charAt(0).toUpperCase() + idName.slice(1)}`); 
                if (btn) { 
                    if (c === cat) { 
                        btn.className = 'flex items-center gap-2 bg-[#24ee89] text-black font-extrabold px-4 py-2.5 rounded-xl text-xs transition shadow-md whitespace-nowrap'; 
                    } else { 
                        btn.className = 'flex items-center gap-2 bg-[#151a23] hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs transition whitespace-nowrap'; 
                    } 
                } 
            }); 

            const titles = { 
                original: 'Original Games', 
                colortrading: 'Color Trading Games', 
                blackjack: 'Blackjack Games', 
                live: 'Live Casino' 
            }; 
            document.getElementById('sectionTitle').innerHTML = ` 
                <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89]"></span> ${titles[cat] || 'Games'} 
            `; 
            renderGames(cat); 
        } 

        // Search Filter 
        function searchGames() { 
            const searchInput = document.getElementById('gameSearch'); 
            if (!searchInput) return; 
            renderGames(currentCategory, searchInput.value); 
        } 

        // Dynamic Bottom Bar Loader
        async function loadBottomBar() {
            try {
                const response = await fetch('bar/bottom.html');
                if (response.ok) {
                    const html = await response.text();
                    const bottomBarContainer = document.getElementById('bottomBarContainer');
                    if (bottomBarContainer) {
                        bottomBarContainer.innerHTML = html;
                    }
                } else {
                    console.error('Error loading bottom bar component:', response.status);
                }
            } catch (err) {
                console.error('Error loading bottom bar component:', err);
            }
        }

        // Initialization Logic 
        document.addEventListener('DOMContentLoaded', () => { 
            loadTopBar(); 
            loadBottomBar();
            loadDynamicBanner();
            fetchGridData(); // Supabase থেকে গ্রিড ডেটা লোড
        }); 
    </script> 
</body> 
</html>
