<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trade - Win Go</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .custom-gradient {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .ruby-sphere {
            background: radial-gradient(circle at 35% 35%, #ff4d4d, #cc0000 50%, #5a0000);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(239,68,68,.5);
            border: 2px solid #ff1a1a;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .green-sphere {
            background: radial-gradient(circle at 35% 35%, #2eff7d, #00b33c 50%, #004d1a);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(0,255,65,.5);
            border: 2px solid #1aff66;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .violet-sphere {
            background: radial-gradient(circle at 35% 35%, #b192ff, #7c3aed 50%, #3b0764);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(124,58,237,.5);
            border: 2px solid #a78bfa;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .main-game-card {
            background: #080d20;
            border: 1px solid #253047;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-section { min-width: 0; }
        .mode-button { min-height: 58px; }

        .number-button {
            aspect-ratio: 1 / 1;
            min-width: 0;
            font-size: 20px;
        }

        /* One combined Period and Timer card */
        .period-timer-card {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(16,185,129,.13), transparent 48%),
                radial-gradient(ellipse at 100% 100%, rgba(59,130,246,.12), transparent 45%),
                linear-gradient(145deg, #0b1428, #030817 65%, #071326);
            border: 1px solid #263b54;
            border-radius: 22px;
            padding: 15px;
            min-height: 112px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 22px rgba(0,0,0,.4),
                0 8px 20px rgba(0,0,0,.18);
        }

        .period-timer-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #34d399, transparent);
        }

        /* No separate inner cards */
        .period-info, .timer-area {
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .period-heading {
            display: block;
            font-size: 10px;
            line-height: 1.4;
            color: #93c5fd;
            letter-spacing: .7px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .period-number-display {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px 7px;
            border-radius: 10px;
            border: 1px solid rgba(251,191,36,.32);
            background: linear-gradient(180deg, #020617, #0f172a);
            color: #fbbf24;
            font-family: monospace;
            font-size: clamp(11px, 3.4vw, 15px);
            line-height: 1.4;
            font-weight: 900;
            letter-spacing: .2px;
            text-align: center;
            overflow-wrap: anywhere;
            text-shadow: 0 0 10px rgba(251,191,36,.22);
            box-shadow: inset 0 2px 7px rgba(0,0,0,.4);
        }

        .timer-area { text-align: center; }

        .timer-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 25px;
            padding: 6px 9px;
            margin-bottom: 9px;
            border-radius: 8px;
            border: 1px solid rgba(52,211,153,.28);
            background: rgba(6,78,59,.3);
            color: #6ee7b7;
            font-size: 9px;
            line-height: 1.2;
            font-weight: 900;
            letter-spacing: .5px;
            white-space: nowrap;
        }

        .timer-label::before {
            content: "";
            width: 6px;
            height: 6px;
            flex: 0 0 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 7px rgba(52,211,153,.8);
        }

        .timer-label.timer-label-danger {
            color: #fecdd3;
            background: rgba(136,19,55,.45);
            border-color: rgba(251,113,133,.65);
            animation: dangerPulse 1s infinite;
        }

        .timer-label.timer-label-danger::before {
            background: #fb7185;
        }

        .digital-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .timer-digit {
            width: 25px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            background: linear-gradient(180deg, #16a34a, #08752c);
            border: 1px solid #22c55e;
            box-shadow: inset 0 2px 4px rgba(255,255,255,.18),
                inset 0 -4px 5px rgba(0,0,0,.35),
                0 0 9px rgba(34,197,94,.24);
            color: white;
            font-family: monospace;
            font-size: 23px;
            font-weight: 900;
            position: relative;
            overflow: hidden;
        }

        .timer-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,0,0,.18);
            border-top: 1px solid rgba(255,255,255,.10);
        }

        .timer-colon {
            color: #4ade80;
            font-size: 23px;
            line-height: 1;
            font-weight: 900;
            padding: 0 1px;
        }

        .digital-timer.timer-danger .timer-digit {
            background: linear-gradient(180deg, #f43f5e, #9f1239);
            border-color: #fb7185;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer.timer-danger .timer-colon { color: #fb7185; }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .72; }
        }

        /* Smooth blinking highlight for winning selections */
        .winning-blink {
            position: relative;
            z-index: 2;
            animation: winningBlink 1.05s ease-in-out infinite;
        }

        .win-blink-green {
            --win-glow: rgba(34, 255, 130, .95);
        }

        .win-blink-red {
            --win-glow: rgba(255, 65, 95, .95);
        }

        .win-blink-violet {
            --win-glow: rgba(190, 130, 255, .95);
        }

        .win-blink-number {
            --win-glow: rgba(255, 255, 255, .95);
        }

        .win-blink-big {
            --win-glow: rgba(255, 190, 45, .95);
        }

        .win-blink-small {
            --win-glow: rgba(70, 160, 255, .95);
        }

        @keyframes winningBlink {
            0%, 100% {
                filter: brightness(1);
                box-shadow: 0 0 5px var(--win-glow, white);
                outline: 2px solid transparent;
                outline-offset: 1px;
            }
            50% {
                filter: brightness(1.5);
                box-shadow: 0 0 15px var(--win-glow, white),
                    0 0 28px var(--win-glow, white);
                outline: 2px solid var(--win-glow, white);
                outline-offset: 2px;
            }
        }

        .history-table {
            min-width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .history-table th, .history-table td {
            padding: 9px 7px;
            text-align: left;
            vertical-align: middle;
        }

        .my-history-table {
            min-width: 850px;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .my-history-table th, .my-history-table td {
            padding: 10px 9px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }

        .my-history-table th {
            background: #111b30;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .my-history-table td { font-size: 11px; }

        .result-number {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 900;
            color: white;
        }

        .result-red {
            background: #e11d48;
            border: 2px solid #fb7185;
            box-shadow: 0 0 8px rgba(244,63,94,.25);
        }

        .result-green {
            background: #059669;
            border: 2px solid #34d399;
            box-shadow: 0 0 8px rgba(16,185,129,.25);
        }

        .result-violet {
            background: #7c3aed;
            border: 2px solid #a78bfa;
            box-shadow: 0 0 8px rgba(139,92,246,.25);
        }

        .result-badge {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .date-cell {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 10px !important;
        }

        .history-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        @media (max-width: 380px) {
            .period-timer-card {
                padding: 10px;
                gap: 8px;
                grid-template-columns: minmax(0, 1fr) auto;
            }

            .period-heading {
                font-size: 9px;
                letter-spacing: .3px;
            }

            .period-number-display {
                font-size: 11px;
                padding: 8px 4px;
            }

            .timer-digit {
                width: 21px;
                height: 34px;
                font-size: 20px;
            }

            .timer-colon { font-size: 20px; }

            .timer-label {
                font-size: 8px;
                letter-spacing: .2px;
                padding: 5px 6px;
                gap: 4px;
            }
        }

        @media (max-width: 320px) {
            .period-timer-card {
                grid-template-columns: minmax(0, 1fr);
            }

            .period-number-display { font-size: 14px; }

            .timer-digit {
                width: 27px;
                height: 38px;
                font-size: 23px;
            }
        }
    </style>
</head>

<body class="flex justify-center items-center min-h-screen bg-slate-950">

    <script>
        let currentUser = null;
        let userProfile = null;
        let selectedGameDuration = 30;
        let currentPeriodNumber = "2026101501";
        let timerSeconds = 30;
        let timerInterval = null;
        let selectedTarget = null;
        let activeTab = 'game-history';

        document.addEventListener("DOMContentLoaded", async () => {
            currentUser = await requireAuth();

            if (currentUser) {
                await loadUserProfile();
                startTimer();
                loadHistoryData('game-history');
            }
        });

        async function loadUserProfile() {
            userProfile = await getUserProfile(currentUser.id);

            if (userProfile) {
                document.getElementById("user-balance").innerText =
                    Number(userProfile.balance).toFixed(2);
            }
        }

        function changeGameMode(duration, modeKey) {
            selectedGameDuration = duration;
            timerSeconds = duration;

            ['10s', '30s', '1m', '5m'].forEach(key => {
                let btn = document.getElementById(`mode-${key}`);

                if (key === modeKey) {
                    btn.className = "mode-button bg-rose-600 p-2 rounded-xl text-center border border-rose-500 transition active:scale-95 shadow-md";
                    btn.querySelector("div:nth-child(2)").className =
                        "text-[11px] font-bold text-white mt-1";
                } else {
                    btn.className = "mode-button bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-center border border-slate-700 transition active:scale-95";
                    btn.querySelector("div:nth-child(2)").className =
                        "text-[11px] font-bold text-amber-400 mt-1";
                }
            });

            startTimer();
        }

        /* Highlight the winning number, size and color buttons */
        function clearWinningHighlights() {
            document.querySelectorAll('.winning-blink').forEach(button => {
                button.classList.remove(
                    'winning-blink',
                    'win-blink-green',
                    'win-blink-red',
                    'win-blink-violet',
                    'win-blink-number',
                    'win-blink-big',
                    'win-blink-small'
                );
            });
        }

        function highlightWinningTargets(winningColor, winningNumber, winningBigSmall) {
            clearWinningHighlights();

            const colorClass = {
                Green: 'win-blink-green',
                Red: 'win-blink-red',
                Violet: 'win-blink-violet'
            };

            document.querySelectorAll('button[onclick^="openBetModal("]').forEach(button => {
                const match = button.getAttribute('onclick')?.match(/openBetModal\(['"]([^'"]+)['"]\)/);

                if (!match) return;

                const target = match[1];
                let highlightClass = '';

                if (target === winningColor) {
                    highlightClass = colorClass[winningColor] || '';
                } else if (target === String(winningNumber)) {
                    highlightClass = 'win-blink-number';
                } else if (target === winningBigSmall) {
                    highlightClass = winningBigSmall === 'Big'
                        ? 'win-blink-big'
                        : 'win-blink-small';
                }

                if (highlightClass) {
                    button.classList.add('winning-blink', highlightClass);
                }
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = selectedGameDuration;

            const timerElem = document.getElementById("countdown-timer");
            const timerLabel = document.getElementById("timer-label");

            function updateMainTimer() {
                if (!timerElem) return;

                const min = Math.floor(timerSeconds / 60);
                const sec = timerSeconds % 60;

                const timeText =
                    `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

                timerElem.innerHTML = `
                    <span class="timer-digit">${timeText[0]}</span>
                    <span class="timer-digit">${timeText[1]}</span>
                    <span class="timer-colon">:</span>
                    <span class="timer-digit">${timeText[3]}</span>
                    <span class="timer-digit">${timeText[4]}</span>
                `;

                if (timerSeconds <= 5) {
                    timerElem.classList.add("timer-danger");

                    if (timerLabel) {
                        timerLabel.innerText = "BET CLOSED";
                        timerLabel.classList.add("timer-label-danger");
                    }
                } else {
                    timerElem.classList.remove("timer-danger");

                    if (timerLabel) {
                        timerLabel.innerText = "PLACE YOUR BET";
                        timerLabel.classList.remove("timer-label-danger");
                    }
                }
            }

            updateMainTimer();

            timerInterval = setInterval(() => {
                timerSeconds = Math.max(0, timerSeconds - 1);
                updateMainTimer();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    processRoundResult();
                }
            }, 1000);
        }

        function switchTab(tabName) {
            activeTab = tabName;

            ['game-history', 'chart', 'my-history'].forEach(t => {
                let btn = document.getElementById(`tab-${t}`);

                if (t === tabName) {
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-rose-600 text-white transition";
                } else {
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
                }
            });

            loadHistoryData(tabName);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function getSavedBetResult(row) {
            let savedResult = String(row.winning_result || '');
            let resultMatch = savedResult.match(/(Green|Red|Violet)\s*[-:]\s*(\d)/i);

            let color = resultMatch
                ? resultMatch[1].charAt(0).toUpperCase() + resultMatch[1].slice(1).toLowerCase()
                : (row.winning_color || '');

            let number = resultMatch
                ? Number(resultMatch[2])
                : (row.winning_number !== null &&
                   row.winning_number !== undefined &&
                   row.winning_number !== ''
                    ? Number(row.winning_number)
                    : null);

            if (!['Green', 'Red', 'Violet'].includes(color)) {
                color = '';
            }

            let bigSmall = number !== null && Number.isFinite(number)
                ? (number >= 5 ? 'Big' : 'Small')
                : '';

            let colorClass = color === 'Red'
                ? 'result-red'
                : color === 'Green'
                    ? 'result-green'
                    : color === 'Violet'
                        ? 'result-violet'
                        : '';

            return {
                color,
                number,
                bigSmall,
                colorClass,
                hasResult: number !== null &&
                           Number.isFinite(number) &&
                           color !== ''
            };
        }

        function formatHistoryDate(dateValue) {
            if (!dateValue) return { date: 'N/A', time: 'N/A' };

            const date = new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return { date: 'N/A', time: 'N/A' };
            }

            return {
                date: date.toLocaleDateString('en-GB', {
                    timeZone: 'Asia/Dhaka',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }),
                time: date.toLocaleTimeString('en-GB', {
                    timeZone: 'Asia/Dhaka',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                })
            };
        }

        async function loadHistoryData(type) {
            let container = document.getElementById("tab-content");

            container.innerHTML =
                `<p class="text-center text-slate-500 py-3">Loading...</p>`;

            if (type === 'game-history') {
                let { data, error } = await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq("status", "completed")
                    .order("created_at", { ascending: false })
                    .limit(10);

                if (error || !data || data.length === 0) {
                    container.innerHTML =
                        `<p class="text-center text-slate-500 py-3">No history found</p>`;
                    return;
                }

                let html = `<div class="overflow-x-auto">
                    <table class="history-table">
                    <thead>
                    <tr class="text-slate-400 border-b border-slate-800">
                        <th>Period</th>
                        <th>Number</th>
                        <th>Big/Small</th>
                        <th>Color</th>
                    </tr>
                    </thead><tbody>`;

                data.forEach(row => {
                    let bs = Number(row.winning_number) >= 5 ? 'Big' : 'Small';

                    let colorClass = row.winning_color === 'Green'
                        ? 'text-emerald-400'
                        : (row.winning_color === 'Red'
                            ? 'text-rose-500'
                            : 'text-purple-400');

                    html += `<tr class="border-b border-slate-900/50">
                        <td class="font-mono text-amber-300">${escapeHtml(row.period_number)}</td>
                        <td class="font-bold">${escapeHtml(row.winning_number)}</td>
                        <td class="font-semibold">${bs}</td>
                        <td class="font-bold ${colorClass}">${escapeHtml(row.winning_color)}</td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
                container.innerHTML = html;

            } else if (type === 'my-history') {
                let { data, error } = await supabaseClient
                    .from("color_game_history")
                    .select("*")
                    .eq("user_id", currentUser.id)
                    .order("created_at", { ascending: false })
                    .limit(10);

                if (error) {
                    console.error("My History error:", error);
                    container.innerHTML =
                        `<p class="text-center text-rose-400 py-4">
                            Unable to load My History. Please check the database.
                        </p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML =
                        `<p class="text-center text-slate-500 py-4">No bets found</p>`;
                    return;
                }

                let html = `
                    <div class="mb-3 text-[10px] text-slate-400">
                        Showing your latest 10 bets. Scroll horizontally to see all details.
                    </div>
                    <div class="history-scroll max-h-96">
                    <table class="my-history-table">
                    <thead>
                    <tr>
                        <th>Period</th>
                        <th>Bet</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Result No.</th>
                        <th>Result Color</th>
                        <th>Big/Small</th>
                        <th>Date & Time</th>
                    </tr>
                    </thead><tbody>`;

                data.forEach(row => {
                    let status = String(row.status || 'pending').toLowerCase();

                    let statusColor = status === 'win'
                        ? 'text-emerald-400'
                        : status === 'loss'
                            ? 'text-rose-400'
                            : 'text-amber-400';

                    let statusLabel = status === 'win'
                        ? 'WIN'
                        : status === 'loss'
                            ? 'LOSS'
                            : 'PENDING';

                    let result = getSavedBetResult(row);

                    let resultNumberHtml = result.hasResult
                        ? `<span class="result-number ${result.colorClass}">${result.number}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let resultColorHtml = result.hasResult
                        ? `<span class="result-badge ${
                            result.color === 'Red'
                                ? 'bg-rose-900/60 text-rose-300 border border-rose-700'
                                : result.color === 'Green'
                                    ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-700'
                                    : 'bg-purple-900/60 text-purple-300 border border-purple-700'
                          }">${escapeHtml(result.color.toUpperCase())}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let bigSmallHtml = result.hasResult
                        ? `<span class="result-badge ${
                            result.bigSmall === 'Big'
                                ? 'bg-amber-900/60 text-amber-300 border border-amber-700'
                                : 'bg-blue-900/60 text-blue-300 border border-blue-700'
                          }">${result.bigSmall.toUpperCase()}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let dateTime = formatHistoryDate(row.created_at);

                    html += `
                        <tr>
                            <td class="font-mono text-amber-300">${escapeHtml(row.period_number || '—')}</td>
                            <td class="font-bold text-white">${escapeHtml(row.bet_type || '—')}</td>
                            <td class="font-mono text-slate-200">৳${Number(row.bet_amount || 0).toFixed(2)}</td>
                            <td class="font-bold ${statusColor}">${statusLabel}</td>
                            <td>${resultNumberHtml}</td>
                            <td>${resultColorHtml}</td>
                            <td>${bigSmallHtml}</td>
                            <td class="date-cell">
                                <div>${escapeHtml(dateTime.date)}</div>
                                <div class="text-slate-400">${escapeHtml(dateTime.time)}</div>
                            </td>
                        </tr>`;
                });

                html += `
                    </tbody></table></div>
                    <div class="mt-3 p-3 rounded-xl bg-slate-900 border border-slate-800">
                        <p class="text-[10px] text-slate-400 leading-relaxed">
                            Result No., Result Color এবং Big/Small দেখানোর জন্য
                            সংশ্লিষ্ট রাউন্ডের ফলাফল ডাটাবেসে সংরক্ষিত থাকতে হবে।
                            Pending বেটের ফলাফল রাউন্ড সম্পন্ন না হওয়া পর্যন্ত
                            দেখানো হবে না।
                        </p>
                    </div>`;

                container.innerHTML = html;

            } else if (type === 'chart') {
                container.innerHTML =
                    `<p class="text-center text-slate-500 py-5">Chart feature coming soon...</p>`;
            }
        }

        function openBetModal(target) {
            if (timerSeconds <= 5) {
                document.getElementById("game-status-text").innerText =
                    "No More Bet! Please wait for the next round.";
                return;
            }

            selectedTarget = target;

            document.getElementById("modal-target").innerText = target;
            document.getElementById("bet-modal").classList.remove("hidden");
            document.getElementById("bet-modal").classList.add("flex");
        }

        function closeBetModal() {
            document.getElementById("bet-modal").classList.remove("flex");
            document.getElementById("bet-modal").classList.add("hidden");
        }

        function closeWinModal() {
            document.getElementById("win-modal").classList.remove("flex");
            document.getElementById("win-modal").classList.add("hidden");
        }

        async function confirmAndPlaceBet() {
            if (timerSeconds <= 5) {
                closeBetModal();

                document.getElementById("game-status-text").innerText =
                    "No More Bet! Please wait for the next round.";

                return;
            }

            let amount = parseFloat(
                document.getElementById("bet-amount-input").value
            );

            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            if (amount > Number(userProfile.balance)) {
                alert("Insufficient balance!");
                return;
            }

            let newBalance = Number(userProfile.balance) - amount;

            const { error: profileError } = await supabaseClient
                .from("profiles")
                .update({ balance: newBalance })
                .eq("id", currentUser.id);

            if (profileError) {
                alert("Failed to place bet. Try again.");
                return;
            }

            userProfile.balance = newBalance;

            document.getElementById("user-balance").innerText =
                newBalance.toFixed(2);

            const { error: betInsertError } = await supabaseClient
                .from("color_game_history")
                .insert([{
                    user_id: currentUser.id,
                    period_number: currentPeriodNumber,
                    bet_type: selectedTarget,
                    bet_amount: amount,
                    status: 'pending'
                }]);

            if (betInsertError) {
                console.error("Bet history insert error:", betInsertError);
                alert("Bet history could not be saved. Please contact support.");
                return;
            }

            await updatePeriodAmounts(amount, selectedTarget);
            closeBetModal();

            document.getElementById("game-status-text").innerText =
                `Successfully placed ৳${amount} on ${selectedTarget}!`;

            if (activeTab === 'my-history') {
                loadHistoryData('my-history');
            }
        }

        async function updatePeriodAmounts(amount, target) {
            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            if (!periodData) {
                await supabaseClient.from("color_periods").insert([{
                    period_number: currentPeriodNumber,
                    total_green_amount: target === 'Green' ? amount : 0,
                    total_red_amount: target === 'Red' ? amount : 0,
                    total_violet_amount: target === 'Violet' ? amount : 0,
                    status: 'pending'
                }]);

            } else {
                let updateField = {};

                if (target === 'Green') {
                    updateField.total_green_amount =
                        Number(periodData.total_green_amount) + amount;
                } else if (target === 'Red') {
                    updateField.total_red_amount =
                        Number(periodData.total_red_amount) + amount;
                } else if (target === 'Violet') {
                    updateField.total_violet_amount =
                        Number(periodData.total_violet_amount) + amount;
                }

                await supabaseClient
                    .from("color_periods")
                    .update(updateField)
                    .eq("period_number", currentPeriodNumber);
            }
        }

        async function processRoundResult() {
            document.getElementById("game-status-text").innerText =
                "Calculating result...";

            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            let green = periodData ? Number(periodData.total_green_amount) : 0;
            let red = periodData ? Number(periodData.total_red_amount) : 0;
            let violet = periodData ? Number(periodData.total_violet_amount) : 0;

            let winningColor = 'Green';

            if (green === 0 && red === 0 && violet === 0) {
                const randomColors = ['Green', 'Red', 'Green', 'Red', 'Violet'];

                winningColor =
                    randomColors[Math.floor(Math.random() * randomColors.length)];

            } else {
                if (green <= red && green <= violet) {
                    winningColor = 'Green';
                } else if (red <= green && red <= violet) {
                    winningColor = 'Red';
                } else {
                    winningColor = 'Violet';
                }
            }

            let numbersMap = {
                Green: [1, 3, 7, 9],
                Red: [2, 4, 6, 8],
                Violet: [0, 5]
            };

            let possibleNums = numbersMap[winningColor];

            let winningNumber =
                possibleNums[Math.floor(Math.random() * possibleNums.length)];

            let winningBigSmall = winningNumber >= 5 ? 'Big' : 'Small';
            let winningResultString = `${winningColor}-${winningNumber}`;

            await supabaseClient
                .from("color_periods")
                .update({
                    winning_color: winningColor,
                    winning_number: winningNumber,
                    status: 'completed'
                })
                .eq("period_number", currentPeriodNumber);

            let { data: allBets } = await supabaseClient
                .from("color_game_history")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .eq("status", 'pending');

            let userWonAmount = 0;
            let hasUserWon = false;

            if (allBets && allBets.length > 0) {
                for (let bet of allBets) {
                    let isWin = false;
                    let multiplier = 2;

                    if (bet.bet_type === 'Red') multiplier = 1.9;
                    else if (bet.bet_type === 'Violet') multiplier = 4.5;
                    else if (
                        bet.bet_type === 'Big' ||
                        bet.bet_type === 'Small'
                    ) multiplier = 1.9;
                    else if (!isNaN(bet.bet_type)) multiplier = 9;

                    if (bet.bet_type === winningColor) {
                        isWin = true;
                    } else if (bet.bet_type === String(winningNumber)) {
                        isWin = true;
                    } else if (bet.bet_type === winningBigSmall) {
                        isWin = true;
                    }

                    if (isWin) {
                        let payoutAmount = bet.bet_amount * multiplier;

                        if (bet.user_id === currentUser.id) {
                            userWonAmount = payoutAmount;
                            hasUserWon = true;
                        }

                        await supabaseClient
                            .from("color_game_history")
                            .update({
                                winning_result: winningResultString,
                                payout: payoutAmount,
                                status: 'win'
                            })
                            .eq("id", bet.id);

                        let { data: targetProfile } = await supabaseClient
                            .from("profiles")
                            .select("balance")
                            .eq("id", bet.user_id)
                            .single();

                        if (targetProfile) {
                            let updatedBal =
                                Number(targetProfile.balance) + payoutAmount;

                            await supabaseClient
                                .from("profiles")
                                .update({ balance: updatedBal })
                                .eq("id", bet.user_id);
                        }

                    } else {
                        await supabaseClient
                            .from("color_game_history")
                            .update({
                                winning_result: winningResultString,
                                payout: 0,
                                status: 'loss'
                            })
                            .eq("id", bet.id);
                    }
                }
            }

            document.getElementById("game-status-text").innerText =
                `Result: ${winningResultString} (${winningBigSmall})`;

            /* Blink the winning number, color and Big/Small selections */
            highlightWinningTargets(
                winningColor,
                winningNumber,
                winningBigSmall
            );

            await loadUserProfile();

            if (hasUserWon) {
                document.getElementById("win-res-badge").innerText = winningColor;
                document.getElementById("win-res-num").innerText = winningNumber;
                document.getElementById("win-res-bs").innerText = winningBigSmall;

                document.getElementById("win-bonus-amount").innerText =
                    `৳${userWonAmount.toFixed(2)}`;

                document.getElementById("win-period-text").innerText =
                    `Period: ${currentPeriodNumber}`;

                document.getElementById("win-modal").classList.remove("hidden");
                document.getElementById("win-modal").classList.add("flex");
            }

            currentPeriodNumber = String(parseInt(currentPeriodNumber) + 1);

            document.getElementById("period-number").innerText =
                currentPeriodNumber;

            loadHistoryData(activeTab);

            /* Start the next round immediately */
            startTimer();
        }
    </script>
