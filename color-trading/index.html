<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কালার ট্রেডিং গেম</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- আপনার বিদ্যমান কনফিগারেশন ফাইল -->
    <script src="../supabase-config.js"></script>
    
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-slate-950">

    <div class="w-full max-w-md min-h-screen bg-slate-900 flex flex-col justify-between shadow-2xl border-x border-slate-800">
        
        <!-- Header: ব্যালেন্স ও ওয়ালেট -->
        <header class="p-4 bg-slate-900 flex justify-between items-center border-b border-slate-800 sticky top-0 z-10">
            <h1 class="text-lg font-bold text-amber-400">Color Trade</h1>
            <div class="bg-slate-800 px-3 py-1.5 rounded-full text-sm font-semibold border border-slate-700">
                Balance: ৳ <span id="user-balance" class="text-emerald-400 font-mono">0.00</span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="p-4 flex-1 flex flex-col gap-4 overflow-y-auto pb-20">
            
            <!-- Timer & Period Section -->
            <div class="bg-slate-950 p-4 rounded-xl flex justify-between items-center border border-slate-800 shadow-inner">
                <div>
                    <p class="text-xs text-slate-400">Period No</p>
                    <p id="period-number" class="font-mono font-bold text-amber-300 text-sm">2026101501</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-slate-400">Time Remaining</p>
                    <p id="countdown-timer" class="font-mono text-2xl font-bold text-emerald-400">00:30</p>
                </div>
            </div>

            <!-- Color Betting Buttons -->
            <div class="grid grid-cols-3 gap-3">
                <button onclick="openBetModal('Green')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 py-3.5 rounded-xl font-bold shadow-lg transition text-white">Green (2x)</button>
                <button onclick="openBetModal('Violet')" class="bg-purple-600 hover:bg-purple-500 active:scale-95 py-3.5 rounded-xl font-bold shadow-lg transition text-white">Violet (4.5x)</button>
                <button onclick="openBetModal('Red')" class="bg-rose-600 hover:bg-rose-500 active:scale-95 py-3.5 rounded-xl font-bold shadow-lg transition text-white">Red (1.9x)</button>
            </div>

            <!-- Number Selection (0-9 সাজানো বিন্যাস) -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <p class="text-xs text-slate-400 mb-3 text-center">Select Number (Payout 9x)</p>
                <div class="grid grid-cols-5 gap-2.5">
                    <button onclick="openBetModal('0')" class="bg-slate-800 hover:bg-purple-700 active:scale-95 py-3 rounded-lg font-bold transition text-purple-300 border border-purple-900/50">0</button>
                    <button onclick="openBetModal('1')" class="bg-slate-800 hover:bg-emerald-700 active:scale-95 py-3 rounded-lg font-bold transition text-emerald-300 border border-emerald-900/50">1</button>
                    <button onclick="openBetModal('2')" class="bg-slate-800 hover:bg-rose-700 active:scale-95 py-3 rounded-lg font-bold transition text-rose-300 border border-rose-900/50">2</button>
                    <button onclick="openBetModal('3')" class="bg-slate-800 hover:bg-emerald-700 active:scale-95 py-3 rounded-lg font-bold transition text-emerald-300 border border-emerald-900/50">3</button>
                    <button onclick="openBetModal('4')" class="bg-slate-800 hover:bg-rose-700 active:scale-95 py-3 rounded-lg font-bold transition text-rose-300 border border-rose-900/50">4</button>
                    <button onclick="openBetModal('5')" class="bg-slate-800 hover:bg-purple-700 active:scale-95 py-3 rounded-lg font-bold transition text-purple-300 border border-purple-900/50">5</button>
                    <button onclick="openBetModal('6')" class="bg-slate-800 hover:bg-rose-700 active:scale-95 py-3 rounded-lg font-bold transition text-rose-300 border border-rose-900/50">6</button>
                    <button onclick="openBetModal('7')" class="bg-slate-800 hover:bg-emerald-700 active:scale-95 py-3 rounded-lg font-bold transition text-emerald-300 border border-emerald-900/50">7</button>
                    <button onclick="openBetModal('8')" class="bg-slate-800 hover:bg-rose-700 active:scale-95 py-3 rounded-lg font-bold transition text-rose-300 border border-rose-900/50">8</button>
                    <button onclick="openBetModal('9')" class="bg-slate-800 hover:bg-emerald-700 active:scale-95 py-3 rounded-lg font-bold transition text-emerald-300 border border-emerald-900/50">9</button>
                </div>
            </div>

            <!-- Game Status Box -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <h3 class="text-xs text-slate-400 mb-2">Game Status</h3>
                <div id="game-status-text" class="text-sm font-semibold text-amber-200">
                    Place your bet before timer ends...
                </div>
            </div>

        </main>

        <!-- Bottom Navigation -->
        <footer class="p-3 bg-slate-900 border-t border-slate-800 flex justify-around text-xs text-slate-400 fixed bottom-0 max-w-md w-full z-10">
            <button class="flex flex-col items-center text-amber-400 font-bold">🏠 Home</button>
            <button onclick="alert('History feature coming soon!')" class="flex flex-col items-center hover:text-white">📊 History</button>
            <button onclick="logoutUser()" class="flex flex-col items-center hover:text-rose-400">🚪 Logout</button>
        </footer>

    </div>

    <!-- Bet Modal (Popup) -->
    <div id="bet-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs p-5 rounded-2xl shadow-2xl flex flex-col gap-4">
            <h3 class="text-base font-bold text-slate-200">Place Bet on: <span id="modal-target" class="text-amber-400"></span></h3>
            
            <div>
                <label class="text-xs text-slate-400 block mb-1">Enter Amount (৳)</label>
                <input type="number" id="bet-amount-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-amber-400" placeholder="100" value="100">
            </div>

            <div class="flex gap-2">
                <button onclick="closeBetModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl font-semibold transition text-sm">Cancel</button>
                <button onclick="confirmAndPlaceBet()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-xl font-bold transition text-sm">Confirm</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        let currentUser = null;
        let userProfile = null;
        let currentPeriodNumber = "2026101501";
        let timerSeconds = 30;
        let timerInterval = null;
        let selectedTarget = null;

        document.addEventListener("DOMContentLoaded", async () => {
            currentUser = await requireAuth();
            if (currentUser) {
                await loadUserProfile();
                startTimer();
            }
        });

        async function loadUserProfile() {
            userProfile = await getUserProfile(currentUser.id);
            if (userProfile) {
                document.getElementById("user-balance").innerText = Number(userProfile.balance).toFixed(2);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 30;
            
            timerInterval = setInterval(() => {
                timerSeconds--;
                let displaySec = timerSeconds < 10 ? "0" + timerSeconds : timerSeconds;
                document.getElementById("countdown-timer").innerText = `00:${displaySec}`;
                
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    processRoundResult();
                }
            }, 1000);
        }

        function openBetModal(target) {
            selectedTarget = target;
            document.getElementById("modal-target").innerText = target;
            document.getElementById("bet-modal").classList.remove("hidden");
            document.getElementById("bet-modal").classList.add("flex");
        }

        function closeBetModal() {
            document.getElementById("bet-modal").classList.remove("flex");
            document.getElementById("bet-modal").classList.add("hidden");
        }

        async function confirmAndPlaceBet() {
            let amount = parseFloat(document.getElementById("bet-amount-input").value);

            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            if (amount > userProfile.balance) {
                alert("Insufficient balance!");
                return;
            }

            let newBalance = userProfile.balance - amount;

            const { error: profileError } = await supabaseClient
                .from("profiles")
                .update({ balance: newBalance })
                .eq("id", currentUser.id);

            if (profileError) {
                alert("Failed to place bet. Try again.");
                console.error(profileError);
                return;
            }

            userProfile.balance = newBalance;
            document.getElementById("user-balance").innerText = newBalance.toFixed(2);

            await supabaseClient.from("color_game_history").insert([{
                user_id: currentUser.id,
                period_number: currentPeriodNumber,
                bet_type: selectedTarget,
                bet_amount: amount,
                status: 'pending'
            }]);

            await updatePeriodAmounts(amount, selectedTarget);

            closeBetModal();
            document.getElementById("game-status-text").innerText = `Bet placed successfully on ${selectedTarget} (৳${amount})!`;
        }

        async function updatePeriodAmounts(amount, target) {
            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            if (!periodData) {
                await supabaseClient.from("color_periods").insert([{
                    period_number: currentPeriodNumber,
                    total_green_amount: target === 'Green' ? amount : 0,
                    total_red_amount: target === 'Red' ? amount : 0,
                    total_violet_amount: target === 'Violet' ? amount : 0,
                    status: 'pending'
                }]);
            } else {
                let updateField = {};
                if (target === 'Green') updateField.total_green_amount = Number(periodData.total_green_amount) + amount;
                else if (target === 'Red') updateField.total_red_amount = Number(periodData.total_red_amount) + amount;
                else if (target === 'Violet') updateField.total_violet_amount = Number(periodData.total_violet_amount) + amount;

                await supabaseClient
                    .from("color_periods")
                    .update(updateField)
                    .eq("period_number", currentPeriodNumber);
            }
        }

        async function processRoundResult() {
            document.getElementById("game-status-text").innerText = "Calculating result...";

            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            let green = periodData ? Number(periodData.total_green_amount) : 0;
            let red = periodData ? Number(periodData.total_red_amount) : 0;
            let violet = periodData ? Number(periodData.total_violet_amount) : 0;

            let winningColor = 'Green';
            if (green === 0 && red === 0 && violet === 0) {
                const randomColors = ['Green', 'Red', 'Green', 'Red', 'Violet'];
                winningColor = randomColors[Math.floor(Math.random() * randomColors.length)];
            } else {
                if (green <= red && green <= violet) winningColor = 'Green';
                else if (red <= green && red <= violet) winningColor = 'Red';
                else winningColor = 'Violet';
            }

            let numbersMap = {
                Green: [1, 3, 7, 9],
                Red: [2, 4, 6, 8],
                Violet: [0, 5]
            };
            let possibleNums = numbersMap[winningColor];
            let winningNumber = possibleNums[Math.floor(Math.random() * possibleNums.length)];
            let winningResultString = `${winningColor}-${winningNumber}`;

            await supabaseClient
                .from("color_periods")
                .update({ winning_color: winningColor, winning_number: winningNumber, status: 'completed' })
                .eq("period_number", currentPeriodNumber);

            let { data: allBets } = await supabaseClient
                .from("color_game_history")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .eq("status", 'pending');

            if (allBets && allBets.length > 0) {
                for (let bet of allBets) {
                    let isWin = false;
                    let multiplier = 2; // ডিফল্ট Green এর জন্য 2x

                    if (bet.bet_type === 'Red') {
                        multiplier = 1.9;
                    } else if (bet.bet_type === 'Violet') {
                        multiplier = 4.5;
                    } else if (!isNaN(bet.bet_type)) {
                        multiplier = 9; // নির্দিষ্ট নাম্বারের জন্য 9x
                    }

                    // উইনিং ম্যাচিং চেক
                    if (bet.bet_type === winningColor) {
                        isWin = true;
                    } else if (bet.bet_type === String(winningNumber)) {
                        isWin = true;
                    }

                    if (isWin) {
                        let payoutAmount = bet.bet_amount * multiplier;
                        
                        await supabaseClient
                            .from("color_game_history")
                            .update({ winning_result: winningResultString, payout: payoutAmount, status: 'win' })
                            .eq("id", bet.id);

                        let { data: targetProfile } = await supabaseClient
                            .from("profiles")
                            .select("balance")
                            .eq("id", bet.user_id)
                            .single();

                        if (targetProfile) {
                            let updatedBal = Number(targetProfile.balance) + payoutAmount;
                            await supabaseClient
                                .from("profiles")
                                .update({ balance: updatedBal })
                                .eq("id", bet.user_id);
                        }
                    } else {
                        await supabaseClient
                            .from("color_game_history")
                            .update({ winning_result: winningResultString, payout: 0, status: 'loss' })
                            .eq("id", bet.id);
                    }
                }
            }

            document.getElementById("game-status-text").innerText = `Result: ${winningResultString}. New round starting...`;

            await loadUserProfile();

            currentPeriodNumber = String(parseInt(currentPeriodNumber) + 1);
            document.getElementById("period-number").innerText = currentPeriodNumber;

            setTimeout(() => {
                startTimer();
            }, 2000);
        }
    </script>
</body>
</html>
