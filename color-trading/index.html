<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trade - Win Go</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .custom-gradient {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .ruby-sphere {
            background: radial-gradient(circle at 35% 35%, #ff4d4d, #cc0000 50%, #5a0000);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(239,68,68,.5);
            border: 2px solid #ff1a1a;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .green-sphere {
            background: radial-gradient(circle at 35% 35%, #2eff7d, #00b33c 50%, #004d1a);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(0,255,65,.5);
            border: 2px solid #1aff66;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .violet-sphere {
            background: radial-gradient(circle at 35% 35%, #b192ff, #7c3aed 50%, #3b0764);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(124,58,237,.5);
            border: 2px solid #a78bfa;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .main-game-card {
            background: #080d20;
            border: 1px solid #253047;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .game-section { min-width: 0; position: relative; }

        /* বর্ডার ছাড়া শুধু কমন প্লেট কন্টেইনার */
        .modes-plate {
            background: linear-gradient(145deg, #0b1428, #030817 65%, #071326);
            border: none;
            border-radius: 18px;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,.4);
        }

        .mode-button {
            position: relative;
            background: transparent;
            border: none;
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .mode-button.active-mode {
            background: rgba(239, 68, 68, 0.12);
            border: none;
            box-shadow: none;
        }

        .mode-button.active-mode::after {
            content: "";
            position: absolute;
            bottom: 2px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ef4444, transparent);
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
        }

        .number-button {
            aspect-ratio: 1 / 1;
            min-width: 0;
            font-size: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .number-payout {
            font-size: 8.5px;
            opacity: 0.85;
            font-weight: 600;
        }

        /* Period and Timer card */
        .period-timer-card {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(16,185,129,.13), transparent 48%),
                radial-gradient(ellipse at 100% 100%, rgba(59,130,246,.12), transparent 45%),
                linear-gradient(145deg, #0b1428, #030817 65%, #071326);
            border: 1px solid #263b54;
            border-radius: 22px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 6px;
            box-shadow: inset 0 0 22px rgba(0,0,0,.4),
                0 8px 20px rgba(0,0,0,.18);
        }

        .period-timer-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #34d399, transparent);
        }

        .card-divider {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(52, 211, 153, 0.3), transparent);
            margin: 4px 0;
        }

        .period-info, .timer-area {
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .period-info {
            flex: 1;
            max-width: 68%;
        }

        .timer-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .period-heading-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }

        .how-to-play-btn {
            font-size: 10px;
            font-weight: 700;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 7px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .how-to-play-btn:hover {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .period-heading {
            display: block;
            font-size: 9px;
            line-height: 1.3;
            color: #93c5fd;
            letter-spacing: .5px;
            text-transform: uppercase;
            font-weight: 900;
            white-space: nowrap;
            text-align: left;
            margin: 0;
        }

        .period-number-display {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1.5px;
            width: 100%;
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            text-align: left;
            overflow: hidden;
            margin-top: 2px;
        }

        .period-digit {
            flex: 0 1 17px;
            min-width: 0;
            height: 31px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            border: 1px solid #60a5fa;
            box-shadow: inset 0 2px 4px rgba(255,255,255,.18),
                inset 0 -4px 5px rgba(0,0,0,.35),
                0 0 7px rgba(59,130,246,.3);
            color: white;
            font-family: monospace;
            font-size: clamp(9px, 2.8vw, 13px);
            font-weight: 900;
            text-shadow: 0 0 5px rgba(255,255,255,.3);
        }

        .period-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,0,0,.18);
            border-top: 1px solid rgba(255,255,255,.10);
        }

        .timer-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 22px;
            padding: 4px 7px;
            margin-bottom: 5px;
            border-radius: 6px;
            border: 1px solid rgba(52,211,153,.28);
            background: rgba(6,78,59,.3);
            color: #6ee7b7;
            font-size: 8.5px;
            line-height: 1.2;
            font-weight: 900;
            letter-spacing: .4px;
            white-space: nowrap;
        }

        .timer-label::before {
            content: "";
            width: 5px;
            height: 5px;
            flex: 0 0 5px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 6px rgba(52,211,153,.8);
        }

        .timer-label.timer-label-danger {
            color: #fecdd3;
            background: rgba(136,19,55,.45);
            border-color: rgba(251,113,133,.65);
            animation: dangerPulse 1s infinite;
        }

        .timer-label.timer-label-danger::before {
            background: #fb7185;
        }

        .digital-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            position: relative;
        }

        .digital-timer::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #34d399, transparent);
            box-shadow: 0 0 6px rgba(52, 211, 153, 0.6);
        }

        .digital-timer.timer-danger::after {
            background: linear-gradient(90deg, transparent, #fb7185, transparent);
            box-shadow: 0 0 6px rgba(251, 113, 133, 0.6);
        }

        .timer-digit {
            width: 22px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: linear-gradient(180deg, #16a34a, #08752c);
            border: 1px solid #22c55e;
            box-shadow: inset 0 2px 4px rgba(255,255,255,.18),
                inset 0 -4px 5px rgba(0,0,0,.35),
                0 0 9px rgba(34,197,94,.24);
            color: white;
            font-family: monospace;
            font-size: 20px;
            font-weight: 900;
            position: relative;
            overflow: hidden;
        }

        .timer-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,0,0,.18);
            border-top: 1px solid rgba(255,255,255,.10);
        }

        .timer-colon {
            color: #4ade80;
            font-size: 20px;
            line-height: 1;
            font-weight: 900;
            padding: 0 1px;
        }

        .digital-timer.timer-danger .timer-digit {
            background: linear-gradient(180deg, #f43f5e, #9f1239);
            border-color: #fb7185;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer.timer-danger .timer-colon {
            color: #fb7185;
        }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .72; }
        }

        .winning-blink {
            position: relative;
            z-index: 2;
            animation: winningBlink .45s ease-in-out 3;
        }

        .win-blink-green { --win-glow: rgba(34,255,130,.95); }
        .win-blink-red { --win-glow: rgba(255,65,95,.95); }
        .win-blink-violet { --win-glow: rgba(190,130,255,.95); }
        .win-blink-number { --win-glow: rgba(255,255,255,.95); }
        .win-blink-big { --win-glow: rgba(255,190,45,.95); }
        .win-blink-small { --win-glow: rgba(70,160,255,.95); }

        @keyframes winningBlink {
            0%, 100% {
                filter: brightness(1);
                box-shadow: 0 0 5px var(--win-glow, white);
                outline: 2px solid transparent;
                outline-offset: 1px;
            }
            50% {
                filter: brightness(1.5);
                box-shadow: 0 0 15px var(--win-glow, white),
                    0 0 28px var(--win-glow, white);
                outline: 2px solid var(--win-glow, white);
                outline-offset: 2px;
            }
        }

        .history-table {
            min-width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .history-table th, .history-table td {
            padding: 9px 7px;
            text-align: left;
            vertical-align: middle;
        }

        .my-history-table {
            min-width: 850px;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .my-history-table th, .my-history-table td {
            padding: 10px 9px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }

        .my-history-table th {
            background: #111b30;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .my-history-table td { font-size: 11px; }

        .result-number {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 900;
            color: white;
        }

        .result-red {
            background: #e11d48;
            border: 2px solid #fb7185;
            box-shadow: 0 0 8px rgba(244,63,94,.25);
        }

        .result-green {
            background: #059669;
            border: 2px solid #34d399;
            box-shadow: 0 0 8px rgba(16,185,129,.25);
        }

        .result-violet {
            background: #7c3aed;
            border: 2px solid #a78bfa;
            box-shadow: 0 0 8px rgba(139,92,246,.25);
        }

        .result-badge {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .date-cell {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 10px !important;
        }

        .history-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        /* Chips & Action Buttons Styling */
        .chips-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b1329;
            padding: 8px 10px;
            border-radius: 16px;
            border: none;
            gap: 6px;
            overflow-x: auto;
        }

        .action-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .action-chip {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            background: #1e293b;
            border: none;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .action-chip:hover { background: #334155; color: white; }

        .rebet-badge-2x {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 8px;
            font-weight: 900;
            background: #f59e0b;
            color: #0f172a;
            padding: 0 3px;
            border-radius: 4px;
            border: 1px solid #fff;
        }

        .chips-group {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
        }

        .chip-item {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            border: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4), inset 0 2px 2px rgba(255,255,255,0.4), inset 0 -3px 4px rgba(0,0,0,0.6);
            transition: transform 0.1s;
            flex-shrink: 0;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            position: relative;
        }

        .chip-item:active { transform: scale(0.92); }
        .chip-item.selected-chip {
            transform: scale(1.08);
            box-shadow: 0 0 5px rgba(255,255,255,0.5), inset 0 2px 2px rgba(255,255,255,0.6), inset 0 -3px 4px rgba(0,0,0,0.6);
        }

        /* Casino Chip Colors */
        .chip-20 { background: radial-gradient(circle, #0284c7 42%, #ffffff 43%, #ffffff 58%, #0284c7 59%); }
        .chip-50 { background: radial-gradient(circle, #16a34a 42%, #ffffff 43%, #ffffff 58%, #16a34a 59%); }
        .chip-100 { background: radial-gradient(circle, #e11d48 42%, #ffffff 43%, #ffffff 58%, #e11d48 59%); }
        .chip-500 { background: radial-gradient(circle, #7c3aed 42%, #ffffff 43%, #ffffff 58%, #7c3aed 59%); }
        .chip-1k { background: radial-gradient(circle, #d97706 42%, #ffffff 43%, #ffffff 58%, #d97706 59%); }
        .chip-10k { background: radial-gradient(circle, #881337 42%, #ffffff 43%, #ffffff 58%, #881337 59%); }

        /* Placed Bet Badge on Target buttons */
        .bet-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #f59e0b;
            color: #0f172a;
            font-size: 9px;
            font-weight: 900;
            padding: 1px 5px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
            border: 1px solid #fff;
        }

        /* Win Payout Floating Animation on Target Button */
        .win-payout-overlay {
            position: absolute;
            inset: 0;
            background: rgba(16, 185, 129, 0.9);
            color: white;
            font-size: 11px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: inherit;
            z-index: 20;
            animation: popWinAmount 2s ease forwards;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        @keyframes popWinAmount {
            0% { transform: scale(0.8); opacity: 0; }
            20% { transform: scale(1.15); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Zoom Out Animation for Bottom Bar Result Status */
        @keyframes zoomOutResult {
            0% { transform: scale(1.2); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.3); opacity: 0; }
        }

        .animate-zoom-out {
            animation: zoomOutResult 1.5s ease forwards;
        }

        /* Bottom Fixed Thin Bar Styling */
        .bottom-fixed-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 28rem;
            background: rgba(8, 13, 32, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #1e293b;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 40;
            font-size: 11px;
        }
    </style>
</head>

                </div>

                <div class="game-section grid grid-cols-3 gap-2">

                    <button onclick="placeDirectBet('Violet')" id="btn-Violet"

                    </button>

                    <button onclick="placeDirectBet('Red')" id="btn-Red"

                    </button>
                </div>

                        <button onclick="placeDirectBet('0')" id="btn-0" class="number-button violet-sphere active:scale-95 rounded-xl font-black transition relative"><span>0</span><span class="number-payout">(9x)</span></button>
                        <button onclick="placeDirectBet('1')" id="btn-1" class="number-button green-sphere active:scale-95 rounded-xl font-black transition relative"><span>1</span><span class="number-payout">(9x)</span></button>

                        <button onclick="placeDirectBet('7')" id="btn-7" class="number-button green-sphere active:scale-95 rounded-xl font-black transition relative"><span>7</span><span class="number-payout">(9x)</span></button>
                        <button onclick="placeDirectBet('8')" id="btn-8" class="number-button ruby-sphere active:scale-95 rounded-xl font-black transition relative"><span>8</span><span class="number-payout">(9x)</span></button>
                        <button onclick="placeDirectBet('9')" id="btn-9" class="number-button green-sphere active:scale-95 rounded-xl font-black transition relative"><span>9</span><span class="number-payout">(9x)</span></button>

                <div class="game-section grid grid-cols-2 gap-2">
                    <button onclick="placeDirectBet('Big')" id="btn-Big"
                        class="bg-amber-600 hover:bg-amber-500 active:scale-95 py-3 rounded-xl font-bold text-sm shadow-md transition text-white relative">
                        Big
                    </button>

                    <button onclick="placeDirectBet('Small')" id="btn-Small"
                        class="bg-blue-600 hover:bg-blue-500 active:scale-95 py-3 rounded-xl font-bold text-sm shadow-md transition text-white relative">
                        Small
                    </button>

                <!-- Chips & Action Bar -->
                <div class="game-section chips-container">
                    <div class="action-group">
                        <button onclick="undoLastBet()" class="action-chip" title="Undo Bet">↩</button>
                        <button onclick="rebetLast()" class="action-chip" title="Rebet">
                            🔄
                            <span class="rebet-badge-2x">2x</span>
                        </button>
                    </div>
                    <div class="chips-group">
                        <div onclick="selectChip(20, this)" class="chip-item chip-20 selected-chip">৳20</div>
                        <div onclick="selectChip(50, this)" class="chip-item chip-50">৳50</div>
                        <div onclick="selectChip(100, this)" class="chip-item chip-100">৳100</div>
                        <div onclick="selectChip(500, this)" class="chip-item chip-500">৳500</div>
                        <div onclick="selectChip(1000, this)" class="chip-item chip-1k">৳1K</div>
                        <div onclick="selectChip(10000, this)" class="chip-item chip-10k">৳10K</div>
                    </div>

                <div id="game-status-text" class="hidden" aria-live="polite">
                    Place your bet before timer ends...
                </div>

            </div>

            <div class="bg-slate-950 rounded-2xl border border-slate-800 p-3 mt-3">
                <div class="flex border-b border-slate-800 pb-2 mb-3 gap-2">

                    <button onclick="switchTab('game-history')" id="tab-game-history"
                        class="flex-1 py-2 text-xs font-bold rounded-lg bg-rose-600 text-white transition">
                        Game History
                    </button>

                    <button onclick="switchTab('chart')" id="tab-chart"
                        class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition">
                        Chart
                    </button>

                    <button onclick="switchTab('my-history')" id="tab-my-history"
                        class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition">
                        My History
                    </button>

                </div>

                <div id="tab-content" class="max-h-96 overflow-auto text-xs">
                    <p class="text-center text-slate-500 py-3">Loading...</p>
                </div>
            </div>

        </main>

        <!-- Bottom Fixed Thin Bar -->
        <div class="bottom-fixed-bar">
            <div>
                <span class="text-slate-400">Balance:</span> 
                <span class="text-emerald-400 font-mono font-bold">৳<span id="bar-user-balance">0.00</span></span>
            </div>
            <div id="bottom-bar-center-status" class="font-bold text-xs text-center">
                <!-- Win/Lost result displays dynamically here -->
            </div>
            <div>
                <span class="text-slate-400">Total Bet:</span> 
                <span class="text-amber-400 font-mono font-bold">৳<span id="bar-total-bet">0.00</span></span>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let userProfile = null;
        let selectedGameDuration = 15;
        let currentPeriodNumber = "2026101501";
        let timerSeconds = 15;
        let timerInterval = null;

        let activeTab = 'game-history';
        let selectedChipAmount = 20; 
        let lastPlacedBet = null;
        let currentRoundTotalBet = 0;
        let userActiveBets = [];

        document.addEventListener("DOMContentLoaded", async () => {
            renderPeriodNumber();

            currentUser = await requireAuth();

            if (currentUser) {
                await loadUserProfile();
                startTimer();
                loadHistoryData('game-history');
            }
        });

        function selectChip(amount, element) {
            selectedChipAmount = amount;
            document.querySelectorAll('.chip-item').forEach(el => el.classList.remove('selected-chip'));
            element.classList.add('selected-chip');
        }

        async function undoLastBet() {
            if (timerSeconds <= 5) {
                alert("No More Bet! Undo is disabled.");
                return;
            }

            if (userActiveBets.length === 0) {
                alert("No active bet to undo for this round!");
                return;
            }

            let lastBet = userActiveBets.pop();
            
            let refundedBalance = Number(userProfile.balance) + lastBet.amount;
            const { error: profileError } = await supabaseClient
                .from("profiles")
                .update({ balance: refundedBalance })
                .eq("id", currentUser.id);

            if (profileError) {
                alert("Failed to undo bet. Try again.");
                userActiveBets.push(lastBet);
                return;
            }

            userProfile.balance = refundedBalance;
            let bal = refundedBalance.toFixed(2);
            document.getElementById("user-balance").innerText = bal;
            document.getElementById("bar-user-balance").innerText = bal;

            currentRoundTotalBet = Math.max(0, currentRoundTotalBet - lastBet.amount);
            document.getElementById("bar-total-bet").innerText = currentRoundTotalBet.toFixed(2);

            await supabaseClient
                .from("color_game_history")
                .delete()
                .eq("id", lastBet.db_id);

            await updatePeriodAmountsOnUndo(lastBet.amount, lastBet.target);

            updateBetBadgesUI();
            document.getElementById("game-status-text").innerText = "Last bet successfully undone.";
        }

        async function updatePeriodAmountsOnUndo(amount, target) {
            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            if (periodData) {
                let updateField = {};
                if (target === 'Green') {
                    updateField.total_green_amount = Math.max(0, Number(periodData.total_green_amount) - amount);
                } else if (target === 'Red') {
                    updateField.total_red_amount = Math.max(0, Number(periodData.total_red_amount) - amount);
                } else if (target === 'Violet') {
                    updateField.total_violet_amount = Math.max(0, Number(periodData.total_violet_amount) - amount);
                }
                await supabaseClient
                    .from("color_periods")
                    .update(updateField)
                    .eq("period_number", currentPeriodNumber);
            }
        }

        async function rebetLast() {
            if (timerSeconds <= 5) {
                alert("No More Bet! Rebet is disabled.");
                return;
            }

            if (!lastPlacedBet) {
                alert("No previous bet to rebet!");
                return;
            }
            let doubledAmount = lastPlacedBet.amount * 2;
            
            if (doubledAmount > Number(userProfile.balance)) {
                alert("Insufficient balance for 2x rebet!");
                return;
            }

            executeBetPlacement(lastPlacedBet.target, doubledAmount);
        }

        function placeDirectBet(target) {
            if (timerSeconds <= 5) {
                document.getElementById("game-status-text").innerText =
                    "No More Bet! Please wait for the next round.";
                return;
            }

            executeBetPlacement(target, selectedChipAmount);
        }

        async function executeBetPlacement(target, amount) {
            if (amount > Number(userProfile.balance)) {
                alert("Insufficient balance!");
                return;
            }

            let newBalance = Number(userProfile.balance) - amount;

            const { error: profileError } = await supabaseClient
                .from("profiles")
                .update({ balance: newBalance })
                .eq("id", currentUser.id);

            if (profileError) {
                alert("Failed to place bet. Try again.");
                return;
            }

            userProfile.balance = newBalance;
            let bal = newBalance.toFixed(2);
            document.getElementById("user-balance").innerText = bal;
            document.getElementById("bar-user-balance").innerText = bal;

            currentRoundTotalBet += amount;
            document.getElementById("bar-total-bet").innerText = currentRoundTotalBet.toFixed(2);

            const { data: insertedData, error: betInsertError } = await supabaseClient
                .from("color_game_history")
                .insert([{
                    user_id: currentUser.id,
                    period_number: currentPeriodNumber,
                    bet_type: target,
                    bet_amount: amount,
                    status: 'pending'
                }])
                .select();

            if (betInsertError) {
                console.error("Bet history insert error:", betInsertError);
                alert("Bet history could not be saved. Please contact support.");
                return;
            }

            let newDbId = insertedData && insertedData[0] ? insertedData[0].id : null;

            lastPlacedBet = { target: target, amount: amount };
            userActiveBets.push({ db_id: newDbId, target: target, amount: amount });
            updateBetBadgesUI();

            await updatePeriodAmounts(amount, target);

            document.getElementById("game-status-text").innerText =
                `Successfully placed ৳${amount} on ${target}!`;

            if (activeTab === 'my-history') {
                loadHistoryData('my-history');
            }
        }

        function updateBetBadgesUI() {
            document.querySelectorAll('.bet-badge').forEach(el => el.remove());

            let targetTotals = {};
            userActiveBets.forEach(bet => {
                targetTotals[bet.target] = (targetTotals[bet.target] || 0) + bet.amount;
            });

            for (let target in targetTotals) {
                let btn = document.getElementById(`btn-${target}`);
                if (btn) {
                    let badge = document.createElement('span');
                    badge.className = 'bet-badge';
                    badge.innerText = `৳${targetTotals[target]}`;
                    btn.appendChild(badge);
                }
            }
        }

        function playVoiceMessage(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;  
                utterance.pitch = 0.4; 

                let voices = window.speechSynthesis.getVoices();
                let maleVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Male') || v.name.includes('David') || v.name.includes('Mark') || v.name.includes('Google UK English Male')));
                if (maleVoice) {
                    utterance.voice = maleVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        async function loadUserProfile() {
            userProfile = await getUserProfile(currentUser.id);

            if (userProfile) {
                let bal = Number(userProfile.balance).toFixed(2);
                document.getElementById("user-balance").innerText = bal;
                document.getElementById("bar-user-balance").innerText = bal;
            }
        }

        function changeGameMode(duration, modeKey) {
            selectedGameDuration = duration;
            timerSeconds = duration;
            currentRoundTotalBet = 0;
            userActiveBets = [];
            updateBetBadgesUI();
            document.getElementById("bar-total-bet").innerText = "0.00";

            ['15s', '30s', '1m', '5m'].forEach(key => {
                let btn = document.getElementById(`mode-${key}`);
                let txt = document.getElementById(`text-${key}`);

                if (key === modeKey) {
                    btn.className = "mode-button active-mode";
                    txt.className = "text-[11px] font-bold text-white mt-1";
                } else {
                    btn.className = "mode-button";
                    txt.className = "text-[11px] font-bold text-amber-400 mt-1";
                }
            });

            startTimer();
        }

        function renderPeriodNumber() {
            const element = document.getElementById("period-number");
            if (!element) return;

            const periodText = String(currentPeriodNumber);

            element.innerHTML = [...periodText].map(digit =>
                `<span class="period-digit">${digit}</span>`
            ).join("");
        }

        function clearWinningHighlights() {
            document.querySelectorAll('.winning-blink').forEach(button => {
                button.classList.remove(
                    'winning-blink',
                    'win-blink-green',
                    'win-blink-red',
                    'win-blink-violet',
                    'win-blink-number',
                    'win-blink-big',
                    'win-blink-small'
                );
            });
        }

        function highlightWinningTargets(winningColor, winningNumber, winningBigSmall) {
            clearWinningHighlights();

            const colorClass = {
                Green: 'win-blink-green',
                Red: 'win-blink-red',
                Violet: 'win-blink-violet'
            };

            document.querySelectorAll('button[onclick^="placeDirectBet("]').forEach(button => {
                const match = button.getAttribute('onclick')?.match(/placeDirectBet\(['"]([^'"]+)['"]\)/);

                if (!match) return;

                const target = match[1];
                let highlightClass = '';

                if (target === winningColor) {
                    highlightClass = colorClass[winningColor] || '';
                } else if (target === String(winningNumber)) {
                    highlightClass = 'win-blink-number';
                } else if (target === winningBigSmall) {
                    highlightClass = winningBigSmall === 'Big'
                        ? 'win-blink-big'
                        : 'win-blink-small';
                }

                if (highlightClass) {
                    button.classList.add('winning-blink', highlightClass);

                    button.addEventListener('animationend', function removeBlink(event) {
                        if (event.animationName !== 'winningBlink') return;

                        button.classList.remove(
                            'winning-blink',
                            'win-blink-green',
                            'win-blink-red',
                            'win-blink-violet',
                            'win-blink-number',
                            'win-blink-big',
                            'win-blink-small'
                        );

                        button.removeEventListener('animationend', removeBlink);
                    });
                }
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = selectedGameDuration;

            const timerElem = document.getElementById("countdown-timer");
            const timerLabel = document.getElementById("timer-label");

            function updateMainTimer() {
                if (!timerElem) return;

                const min = Math.floor(timerSeconds / 60);
                const sec = timerSeconds % 60;

                const timeText =
                    `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

                timerElem.innerHTML = `
                    <span class="timer-digit">${timeText[0]}</span>
                    <span class="timer-digit">${timeText[1]}</span>
                    <span class="timer-colon">:</span>
                    <span class="timer-digit">${timeText[3]}</span>
                    <span class="timer-digit">${timeText[4]}</span>
                `;

                if (timerSeconds <= 5) {
                    timerElem.classList.add("timer-danger");

                    if (timerLabel) {
                        timerLabel.innerText = "NO MORE BET";
                        timerLabel.classList.add("timer-label-danger");
                    }

                    if (timerSeconds === 5) {
                        playVoiceMessage("No more bets");
                    }
                } else {
                    timerElem.classList.remove("timer-danger");

                    if (timerLabel) {
                        timerLabel.innerText = "PLACE YOUR BET";
                        timerLabel.classList.remove("timer-label-danger");
                    }
                }
            }

            updateMainTimer();

            timerInterval = setInterval(() => {
                timerSeconds = Math.max(0, timerSeconds - 1);
                updateMainTimer();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    processRoundResult();
                }
            }, 1000);
        }

        function switchTab(tabName) {
            const container = document.getElementById("tab-content");

            if (activeTab === tabName && !container.classList.contains("hidden")) {
                activeTab = null;
                container.classList.add("hidden");

                ['game-history', 'chart', 'my-history'].forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
                });

                return;
            }

            activeTab = tabName;
            container.classList.remove("hidden");

            ['game-history', 'chart', 'my-history'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);

                if (t === tabName) {
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-rose-600 text-white transition";
                } else {
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
                }
            });

            loadHistoryData(tabName);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function getSavedBetResult(row) {
            let savedResult = String(row.winning_result || '');
            let resultMatch = savedResult.match(/(Green|Red|Violet)\s*[-:]\s*(\d)/i);

            let color = resultMatch
                ? resultMatch[1].charAt(0).toUpperCase() + resultMatch[1].slice(1).toLowerCase()
                : (row.winning_color || '');

            let number = resultMatch
                ? Number(resultMatch[2])
                : (row.winning_number !== null &&
                   row.winning_number !== undefined &&
                   row.winning_number !== ''
                    ? Number(row.winning_number)
                    : null);

            if (!['Green', 'Red', 'Violet'].includes(color)) {
                color = '';
            }

            let bigSmall = number !== null && Number.isFinite(number)
                ? (number >= 5 ? 'Big' : 'Small')
                : '';

            let colorClass = color === 'Red'
                ? 'result-red'
                : color === 'Green'
                    ? 'result-green'
                    : color === 'Violet'
                        ? 'result-violet'
                        : '';

            return {
                color,
                number,
                bigSmall,
                colorClass,
                hasResult: number !== null &&
                           Number.isFinite(number) &&
                           color !== ''
            };
        }

        function formatHistoryDate(dateValue) {
            if (!dateValue) return { date: 'N/A', time: 'N/A' };

            const date = new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return { date: 'N/A', time: 'N/A' };
            }

            return {
                date: date.toLocaleDateString('en-GB', {
                    timeZone: 'Asia/Dhaka',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }),
                time: date.toLocaleTimeString('en-GB', {
                    timeZone: 'Asia/Dhaka',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                })
            };
        }

        async function loadHistoryData(type) {
            let container = document.getElementById("tab-content");

            if (!type) return;

            container.classList.remove("hidden");
            container.innerHTML =
                `<p class="text-center text-slate-500 py-3">Loading...</p>`;

            if (type === 'game-history') {
                let { data, error } = await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq("status", "completed")
                    .order("created_at", { ascending: false })
                    .limit(10);

                if (error || !data || data.length === 0) {
                    container.innerHTML =
                        `<p class="text-center text-slate-500 py-3">No history found</p>`;
                    return;
                }

                let html = `<div class="overflow-x-auto">
                    <table class="history-table">
                    <thead>
                    <tr class="text-slate-400 border-b border-slate-800">
                        <th>Period</th>
                        <th>Number</th>
                        <th>Big/Small</th>
                        <th>Color</th>
                    </tr>
                    </thead><tbody>`;

                data.forEach(row => {
                    let bs = Number(row.winning_number) >= 5 ? 'Big' : 'Small';

                    let colorClass = row.winning_color === 'Green'
                        ? 'text-emerald-400'
                        : (row.winning_color === 'Red'
                            ? 'text-rose-500'
                            : 'text-purple-400');

                    html += `<tr class="border-b border-slate-900/50">
                        <td class="font-mono text-amber-300">${escapeHtml(row.period_number)}</td>
                        <td class="font-bold">${escapeHtml(row.winning_number)}</td>
                        <td class="font-semibold">${bs}</td>
                        <td class="font-bold ${colorClass}">${escapeHtml(row.winning_color)}</td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
                container.innerHTML = html;

            } else if (type === 'my-history') {
                let { data, error } = await supabaseClient
                    .from("color_game_history")
                    .select("*")
                    .eq("user_id", currentUser.id)
                    .order("created_at", { ascending: false })
                    .limit(10);

                if (error) {
                    console.error("My History error:", error);
                    container.innerHTML =
                        `<p class="text-center text-rose-400 py-4">
                            Unable to load My History. Please check the database.
                        </p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML =
                        `<p class="text-center text-slate-500 py-4">No bets found</p>`;
                    return;
                }

                let html = `
                    <div class="mb-3 text-[10px] text-slate-400">
                        Showing your latest 10 bets. Scroll horizontally to see all details.
                    </div>
                    <div class="history-scroll max-h-96">
                    <table class="my-history-table">
                    <thead>
                    <tr>
                        <th>Period</th>
                        <th>Bet</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Result No.</th>
                        <th>Result Color</th>
                        <th>Big/Small</th>
                        <th>Date & Time</th>
                    </tr>
                    </thead><tbody>`;

                data.forEach(row => {
                    let status = String(row.status || 'pending').toLowerCase();

                    let statusColor = status === 'win'
                        ? 'text-emerald-400'
                        : status === 'loss'
                            ? 'text-rose-400'
                            : 'text-amber-400';

                    let statusLabel = status === 'win'
                        ? 'WIN'
                        : status === 'loss'
                            ? 'LOSS'
                            : 'PENDING';

                    let result = getSavedBetResult(row);

                    let resultNumberHtml = result.hasResult
                        ? `<span class="result-number ${result.colorClass}">${result.number}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let resultColorHtml = result.hasResult
                        ? `<span class="result-badge ${
                            result.color === 'Red'
                                ? 'bg-rose-900/60 text-rose-300 border border-rose-700'
                                : result.color === 'Green'
                                    ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-700'
                                    : 'bg-purple-900/60 text-purple-300 border border-purple-700'
                          }">${escapeHtml(result.color.toUpperCase())}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let bigSmallHtml = result.hasResult
                        ? `<span class="result-badge ${
                            result.bigSmall === 'Big'
                                ? 'bg-amber-900/60 text-amber-300 border border-amber-700'
                                : 'bg-blue-900/60 text-blue-300 border border-blue-700'
                          }">${result.bigSmall.toUpperCase()}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let dateTime = formatHistoryDate(row.created_at);

                    html += `
                        <tr>
                            <td class="font-mono text-amber-300">${escapeHtml(row.period_number || '—')}</td>
                            <td class="font-bold text-white">${escapeHtml(row.bet_type || '—')}</td>
                            <td class="font-mono text-slate-200">৳${Number(row.bet_amount || 0).toFixed(2)}</td>
                            <td class="font-bold ${statusColor}">${statusLabel}</td>
                            <td>${resultNumberHtml}</td>
                            <td>${resultColorHtml}</td>
                            <td>${bigSmallHtml}</td>
                            <td class="date-cell">
                                <div>${escapeHtml(dateTime.date)}</div>
                                <div class="text-slate-400">${escapeHtml(dateTime.time)}</div>
                            </td>
                        </tr>`;
                });

                html += `
                    </tbody></table></div>
                    <div class="mt-3 p-3 rounded-xl bg-slate-900 border border-slate-800">
                        <p class="text-[10px] text-slate-400 leading-relaxed">
                            Result No., Result Color এবং Big/Small দেখানোর জন্য
                            সংশ্লিষ্ট রাউন্ডের ফলাফল ডাটাবেসে সংরক্ষিত থাকতে হবে।
                            Pending বেটের ফলাফল রাউন্ড সম্পন্ন না হওয়া পর্যন্ত
                            দেখানো হবে না।
                        </p>
                    </div>`;

                container.innerHTML = html;

            } else if (type === 'chart') {
                container.innerHTML =
                    `<p class="text-center text-slate-500 py-5">Chart feature coming soon...</p>`;
            }
        }

        async function updatePeriodAmounts(amount, target) {
            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            if (!periodData) {
                await supabaseClient.from("color_periods").insert([{
                    period_number: currentPeriodNumber,
                    total_green_amount: target === 'Green' ? amount : 0,
                    total_red_amount: target === 'Red' ? amount : 0,
                    total_violet_amount: target === 'Violet' ? amount : 0,
                    status: 'pending'
                }]);

            } else {
                let updateField = {};

                if (target === 'Green') {
                    updateField.total_green_amount =
                        Number(periodData.total_green_amount) + amount;
                } else if (target === 'Red') {
                    updateField.total_red_amount =
                        Number(periodData.total_red_amount) + amount;
                } else if (target === 'Violet') {
                    updateField.total_violet_amount =
                        Number(periodData.total_violet_amount) + amount;
                }

                await supabaseClient
                    .from("color_periods")
                    .update(updateField)
                    .eq("period_number", currentPeriodNumber);
            }
        }

        async function processRoundResult() {
            document.getElementById("game-status-text").innerText =
                "Calculating result...";

            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            let green = periodData ? Number(periodData.total_green_amount) : 0;
            let red = periodData ? Number(periodData.total_red_amount) : 0;
            let violet = periodData ? Number(periodData.total_violet_amount) : 0;

            let winningColor = 'Green';

            if (green === 0 && red === 0 && violet === 0) {
                const randomColors = ['Green', 'Red', 'Green', 'Red', 'Violet'];

                winningColor =
                    randomColors[Math.floor(Math.random() * randomColors.length)];

            } else {
                if (green <= red && green <= violet) {
                    winningColor = 'Green';
                } else if (red <= green && red <= violet) {
                    winningColor = 'Red';
                } else {
                    winningColor = 'Violet';
                }
            }

            let numbersMap = {
                Green: [1, 3, 7, 9],
                Red: [2, 4, 6, 8],
                Violet: [0, 5]
            };

            let possibleNums = numbersMap[winningColor];

            let winningNumber =
                possibleNums[Math.floor(Math.random() * possibleNums.length)];

            let winningBigSmall = winningNumber >= 5 ? 'Big' : 'Small';
            let winningResultString = `${winningColor}-${winningNumber}`;

            await supabaseClient
                .from("color_periods")
                .update({
                    winning_color: winningColor,
                    winning_number: winningNumber,
                    status: 'completed'
                })
                .eq("period_number", currentPeriodNumber);

            let { data: allBets } = await supabaseClient
                .from("color_game_history")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .eq("status", 'pending');

            let userWonAmount = 0;
            let hasUserWon = false;
            let userParticipated = false;
            let userWinsMap = {}; 

            if (allBets && allBets.length > 0) {
                for (let bet of allBets) {
                    let isWin = false;
                    let multiplier = 2;

                    if (bet.bet_type === 'Red') multiplier = 1.9;
                    else if (bet.bet_type === 'Violet') multiplier = 4.5;
                    else if (
                        bet.bet_type === 'Big' ||
                        bet.bet_type === 'Small'
                    ) multiplier = 1.9;
                    else if (!isNaN(bet.bet_type)) multiplier = 9;

                    if (bet.bet_type === winningColor) {
                        isWin = true;
                    } else if (bet.bet_type === String(winningNumber)) {
                        isWin = true;
                    } else if (bet.bet_type === winningBigSmall) {
                        isWin = true;
                    }

                    if (bet.user_id === currentUser.id) {
                        userParticipated = true;
                    }

                    if (isWin) {
                        let payoutAmount = bet.bet_amount * multiplier;

                        if (bet.user_id === currentUser.id) {
                            userWonAmount += payoutAmount;
                            hasUserWon = true;
                            let totalTargetWinReturn = bet.bet_amount + payoutAmount;
                            userWinsMap[bet.bet_type] = (userWinsMap[bet.bet_type] || 0) + totalTargetWinReturn;
                        }

                        await supabaseClient
                            .from("color_game_history")
                            .update({
                                winning_result: winningResultString,
                                payout: payoutAmount,
                                status: 'win'
                            })
                            .eq("id", bet.id);

                        let { data: targetProfile } = await supabaseClient
                            .from("profiles")
                            .select("balance")
                            .eq("id", bet.user_id)
                            .single();

                        if (targetProfile) {
                            let updatedBal =
                                Number(targetProfile.balance) + payoutAmount;

                            await supabaseClient
                                .from("profiles")
                                .update({ balance: updatedBal })
                                .eq("id", bet.user_id);
                        }

                    } else {
                        await supabaseClient
                            .from("color_game_history")
                            .update({
                                winning_result: winningResultString,
                                payout: 0,
                                status: 'loss'
                            })
                            .eq("id", bet.id);
                    }
                }
            }

            // Immediately clear chips/badges from buttons as the round ends
            currentRoundTotalBet = 0;
            userActiveBets = [];
            updateBetBadgesUI();
            document.getElementById("bar-total-bet").innerText = "0.00";

            for (let target in userWinsMap) {
                let btn = document.getElementById(`btn-${target}`);
                if (btn) {
                    let overlay = document.createElement('div');
                    overlay.className = 'win-payout-overlay';
                    overlay.innerText = `+৳${userWinsMap[target].toFixed(1)}`;
                    btn.appendChild(overlay);
                    setTimeout(() => overlay.remove(), 2000);
                }
            }

            document.getElementById("game-status-text").innerText =
                `Result: ${winningResultString} (${winningBigSmall})`;

            highlightWinningTargets(
                winningColor,
                winningNumber,
                winningBigSmall
            );

            await loadUserProfile();

            // Set bottom bar center status depending on user participate & win/loss
            let centerStatusElem = document.getElementById("bottom-bar-center-status");
            if (userParticipated) {
                if (hasUserWon) {
                    centerStatusElem.innerHTML = `<span class="text-emerald-400 animate-zoom-out inline-block">Win ৳${userWonAmount.toFixed(2)}</span>`;
                    playVoiceMessage("congratulation winner");
                } else {
                    centerStatusElem.innerHTML = `<span class="text-rose-500 animate-zoom-out inline-block">Lost</span>`;
                    playVoiceMessage("better luck next time");
                }
            } else {
                centerStatusElem.innerHTML = "";
            }

            currentPeriodNumber = String(parseInt(currentPeriodNumber, 10) + 1);

            renderPeriodNumber();

            if (activeTab) {
                loadHistoryData(activeTab);
            }

            startTimer();
        }
    </script>
