<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Game</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .green-btn { background-color: #24ee89; color: #0f141c; }
    .green-btn:hover { background-color: #1ed47b; }
  </style>
</head>
<body class="bg-[#0f141c] text-white min-h-screen flex flex-col justify-between">

  <!-- Top Navigation Bar Container -->
  <header class="w-full bg-[#0f141c] border-b border-[#222b3a] px-4 py-2.5 flex items-center justify-between text-white select-none">
    <div class="flex items-center gap-3">
      <button
        id="hamburgerBtn"
        onclick="toggleSidebar()"
        class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-[#222b3a] transition focus:outline-none"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <div class="flex items-center gap-3">
      <!-- Deposit Button -->
      <a
        href="account/deposit.html"
        id="depositLinkBtn"
        class="green-btn font-extrabold p-1.5 rounded-md transition flex items-center justify-center shadow-md"
      >
        <svg class="w-4 h-4 text-[#0f141c]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
      </a>

      <!-- Notifications -->
      <div class="relative">
        <button
          id="notifBtn"
          onclick="toggleNotifications()"
          class="relative p-2 text-gray-400 hover:text-white rounded-lg hover:bg-[#222b3a] transition focus:outline-none"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#24ee89] rounded-full ring-2 ring-[#0f141c]"></span>
        </button>

        <!-- Notification Dropdown -->
        <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-[#171d28] border border-[#222b3a] rounded-xl shadow-2xl z-50 overflow-hidden">
          <div class="p-3 border-b border-[#222b3a] flex justify-between items-center">
            <span class="text-xs font-bold text-gray-300">Notifications</span>
            <button onclick="clearNotifications()" class="text-[10px] text-gray-500 hover:text-gray-300">Mark as read</button>
          </div>
          <div id="notifList" class="max-h-60 overflow-y-auto p-2 text-xs space-y-2 text-gray-400">
            <div class="p-2 bg-[#0f141c] rounded-lg border border-[#222b3a]">
              <p class="text-white font-medium text-[11px]">Welcome Bonus Received!</p>
              <span class="text-[9px] text-gray-500">Your initial deposit bonus has been credited.</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Profile Button -->
      <a
        href="mem/member.html"
        id="profileLinkBtn"
        class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-[#222b3a] transition border border-[#222b3a] flex items-center justify-center bg-[#0f141c]"
      >
        <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </a>
    </div>
  </header>

  <!-- Main Game Section / Interface -->
  <main class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col gap-4">
    <div class="bg-[#171d28] border border-[#222b3a] rounded-xl p-4 text-center">
      <h2 class="text-lg font-bold text-[#24ee89] mb-1">Color Prediction Game</h2>
      <p id="timerDisplay" class="text-sm text-gray-400">Next Period in: <span class="text-white font-mono font-bold">30s</span></p>
      <p id="periodDisplay" class="text-xs text-gray-500 mt-1">Period: <span class="font-mono">Loading...</span></p>
    </div>

    <!-- Game History Button & Container -->
    <div class="bg-[#171d28] border border-[#222b3a] rounded-xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-bold text-white">Game History</h3>
        <button onclick="fetchGameHistory()" class="text-xs text-[#24ee89] hover:underline">Refresh</button>
      </div>
      <div id="gameHistoryList" class="space-y-2 max-h-48 overflow-y-auto text-xs">
        <p class="text-gray-500 text-center py-2">Loading history...</p>
      </div>
    </div>
  </main>

  <script>
    // Supabase Configuration (আপনার প্রজেক্ট অনুযায়ী Credentials দিন)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleNotifications() {
      const dropdown = document.getElementById('notifDropdown');
      dropdown.classList.toggle('hidden');
    }

    function clearNotifications() {
      document.getElementById('notifBadge').style.display = 'none';
      document.getElementById('notifList').innerHTML = '<p class="text-center text-gray-500 p-2">No new notifications</p>';
    }

    function toggleSidebar() {
      alert('Sidebar toggled');
    }

    // ইউজার বেট করুক বা না করুক Supabase-এ গেমের তথ্য ও ফলাফল রেকর্ড করার লজিক
    async function recordGameRoundToSupabase(periodNumber, winningResult, betDetails = null) {
      try {
        // বর্তমান লগইন করা ইউজারের তথ্য নেওয়া
        const { data: { user } } = await supabaseClient.auth.getUser();
        const userId = user ? user.id : null;

        // যদি ইউজার লগইন করা থাকে তবেই টেবিলে ডেটা এন্ট্রি হবে
        if (!userId) {
          console.warn("User not logged in, skipping history insert.");
          return;
        }

        const payload = {
          user_id: userId,
          period_number: periodNumber,
          bet_type: betDetails ? betDetails.bet_type : 'NONE', // ইউজার বেট না করলে 'NONE' বা ডিফল্ট মান
          bet_amount: betDetails ? betDetails.bet_amount : 0,    // বেট না করলে পরিমাণ ০
          winning_result: winningResult,
          payout: betDetails && betDetails.winning ? betDetails.payout : 0,
          status: betDetails ? (betDetails.winning ? 'won' : 'lost') : 'completed'
        };

        const { data, error } = await supabaseClient
          .from('color_game_history')
          .insert([payload]);

        if (error) {
          console.error("Supabase Insert Error:", error.message);
        } else {
          console.log("Game history recorded successfully:", data);
          fetchGameHistory(); // হিস্ট্রি রিফ্রেশ করা
        }
      } catch (err) {
        console.error("Unexpected error recording game history:", err);
      }
    }

    // গেম হিস্ট্রি ফেচ করে UI-তে দেখানোর ফাংশন
    async function fetchGameHistory() {
      try {
        const { data, error } = await supabaseClient
          .from('color_game_history')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(10);

        const historyContainer = document.getElementById('gameHistoryList');
        if (error) {
          historyContainer.innerHTML = `<p class="text-red-400 text-center py-2">Error loading history</p>`;
          return;
        }

        if (!data || data.length === 0) {
          historyContainer.innerHTML = `<p class="text-gray-500 text-center py-2">No history found</p>`;
          return;
        }

        historyContainer.innerHTML = data.map(item => `
          <div class="p-2 bg-[#0f141c] rounded-lg border border-[#222b3a] flex justify-between items-center">
            <div>
              <span class="text-white font-mono font-bold">Period: ${item.period_number}</span>
              <p class="text-[10px] text-gray-400">Bet: ${item.bet_type} (${item.bet_amount}৳)</p>
            </div>
            <div class="text-right">
              <span class="font-bold ${item.status === 'won' ? 'text-[#24ee89]' : 'text-gray-400'}">Result: ${item.winning_result}</span>
              <p class="text-[10px] text-gray-500">${new Date(item.created_at).toLocaleTimeString()}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error fetching history:", err);
      }
    }

    // পেজ লোড হওয়ার পর হিস্ট্রি লোড করা
    window.addEventListener('DOMContentLoaded', () => {
      fetchGameHistory();
      
      // ডেমো হিসেবে পিরিয়ড শেষ হওয়ার পর স্বয়ংক্রিয়ভাবে ডাটা সেভ করার টেস্ট কল (আপনার গেম লজিকের সাথে এটি যুক্ত করবেন)
      // উদাহরণস্বরূপ: recordGameRoundToSupabase("2026101601", "Green", null);
    });
  </script>
</body>
</html>
