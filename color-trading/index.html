<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trade - Win Go</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .custom-gradient {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .ruby-sphere {
            background: radial-gradient(circle at 35% 35%, #ff4d4d 0%, #cc0000 50%, #5a0000 100%);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.8), 
                        inset 3px 3px 6px rgba(255,255,255,0.4), 
                        0 0 12px rgba(239, 68, 68, 0.5);
            border: 2px solid #ff1a1a;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        .green-sphere {
            background: radial-gradient(circle at 35% 35%, #2eff7d 0%, #00b33c 50%, #004d1a 100%);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.8), 
                        inset 3px 3px 6px rgba(255,255,255,0.4), 
                        0 0 12px rgba(0, 255, 65, 0.5);
            border: 2px solid #1aff66;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        .violet-sphere {
            background: radial-gradient(circle at 35% 35%, #b192ff 0%, #7c3aed 50%, #3b0764 100%);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.8), 
                        inset 3px 3px 6px rgba(255,255,255,0.4), 
                        0 0 12px rgba(124, 58, 237, 0.5);
            border: 2px solid #a78bfa;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-slate-950">

    <div class="w-full max-w-md min-h-screen bg-slate-900 flex flex-col justify-between shadow-2xl border-x border-slate-800 relative overflow-hidden">
        
        <!-- Header -->
        <header class="p-4 custom-gradient flex justify-between items-center shadow-lg">
            <h1 class="text-lg font-extrabold text-white tracking-wider">W 1XBET</h1>
            <div class="bg-black/30 px-3 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-white/10">
                Wallet: ৳ <span id="user-balance" class="text-emerald-300 font-mono text-sm">0.00</span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="p-4 flex-1 flex flex-col gap-3 overflow-y-auto pb-10">
            
            <!-- Time Mode Selection Cards (ঘড়ি আইকনসহ) -->
            <div class="grid grid-cols-4 gap-2">
                <button onclick="changeGameMode(10, '10s')" id="mode-10s" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-center border border-slate-700 transition active:scale-95">
                    <div class="text-xs">🕒</div>
                    <div class="text-[11px] font-bold text-amber-400 mt-1">Win 10s</div>
                </button>
                <button onclick="changeGameMode(30, '30s')" id="mode-30s" class="bg-rose-600 p-2 rounded-xl text-center border border-rose-500 transition active:scale-95 shadow-md">
                    <div class="text-xs">🕒</div>
                    <div class="text-[11px] font-bold text-white mt-1">Win 30s</div>
                </button>
                <button onclick="changeGameMode(60, '1m')" id="mode-1m" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-center border border-slate-700 transition active:scale-95">
                    <div class="text-xs">🕒</div>
                    <div class="text-[11px] font-bold text-amber-400 mt-1">Win 1m</div>
                </button>
                <button onclick="changeGameMode(300, '5m')" id="mode-5m" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-center border border-slate-700 transition active:scale-95">
                    <div class="text-xs">🕒</div>
                    <div class="text-[11px] font-bold text-amber-400 mt-1">Win 5m</div>
                </button>
            </div>

            <!-- Timer & Period Section -->
            <div class="bg-slate-950 p-4 rounded-2xl flex justify-between items-center border border-slate-800/80 shadow-inner">
                <div>
                    <p class="text-[11px] text-slate-400">Period No</p>
                    <p id="period-number" class="font-mono font-bold text-amber-400 text-xs">2026101501</p>
                </div>
                <div class="text-right">
                    <p class="text-[11px] text-slate-400">Time remaining</p>
                    <p id="countdown-timer" class="font-mono text-2xl font-black text-emerald-400">00:30</p>
                </div>
            </div>

            <!-- Color Betting Buttons (মাল্টিপ্লায়ার টেক্সট ছাড়া) -->
            <div class="grid grid-cols-3 gap-2.5">
                <button onclick="openBetModal('Green')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 py-3 rounded-xl font-bold text-xs shadow-md transition text-white">Green</button>
                <button onclick="openBetModal('Violet')" class="bg-purple-600 hover:bg-purple-500 active:scale-95 py-3 rounded-xl font-bold text-xs shadow-md transition text-white">Violet</button>
                <button onclick="openBetModal('Red')" class="bg-rose-600 hover:bg-rose-500 active:scale-95 py-3 rounded-xl font-bold text-xs shadow-md transition text-white">Red</button>
            </div>

            <!-- Number Selection Grid (0 to 9 with proper color mapping) -->
            <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                <p class="text-[11px] text-slate-400 mb-2.5 text-center">Select Number (Payout 9x)</p>
                <div class="grid grid-cols-5 gap-2">
                    <button onclick="openBetModal('0')" class="violet-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Violet">0</button>
                    <button onclick="openBetModal('1')" class="green-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Green">1</button>
                    <button onclick="openBetModal('2')" class="ruby-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Red">2</button>
                    <button onclick="openBetModal('3')" class="green-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Green">3</button>
                    <button onclick="openBetModal('4')" class="ruby-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Red">4</button>
                    <button onclick="openBetModal('5')" class="violet-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Violet">5</button>
                    <button onclick="openBetModal('6')" class="ruby-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Red">6</button>
                    <button onclick="openBetModal('7')" class="green-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Green">7</button>
                    <button onclick="openBetModal('8')" class="ruby-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Red">8</button>
                    <button onclick="openBetModal('9')" class="green-sphere active:scale-95 py-2.5 rounded-xl font-black transition text-base" data-color="Green">9</button>
                </div>
            </div>

            <!-- Big & Small Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openBetModal('Big')" class="bg-amber-600 hover:bg-amber-500 active:scale-95 py-3 rounded-xl font-bold text-sm shadow-md transition text-white">Big (1.9x)</button>
                <button onclick="openBetModal('Small')" class="bg-blue-600 hover:bg-blue-500 active:scale-95 py-3 rounded-xl font-bold text-sm shadow-md transition text-white">Small (1.9x)</button>
            </div>

            <!-- Game Status -->
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                <div id="game-status-text" class="text-xs font-semibold text-slate-300">
                    Place your bet before timer ends...
                </div>
            </div>

        </main>
    </div>

    <!-- Big Countdown Overlay (5 সেকেন্ড বাকি থাকলে প্রিমিয়াম লুক) -->
    <div id="big-countdown-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden justify-center items-center z-50">
        <div class="text-center flex flex-col items-center">
            <p class="text-amber-400 text-xl font-bold mb-4 tracking-widest uppercase animate-bounce">Round Ending Soon</p>
            <div id="big-number-display" class="text-white font-mono font-black text-9xl animate-pulse text-rose-500 drop-shadow-[0_0_50px_rgba(244,63,94,0.9)]">
                5
            </div>
        </div>
    </div>

    <!-- Bet Modal -->
    <div id="bet-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs p-5 rounded-2xl shadow-2xl flex flex-col gap-4">
            <h3 class="text-sm font-bold text-slate-300">Place Bet on: <span id="modal-target" class="text-amber-400 font-extrabold text-base"></span></h3>
            <div>
                <label class="text-[11px] text-slate-400 block mb-1">Enter Amount (৳)</label>
                <input type="number" id="bet-amount-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono text-sm focus:outline-none focus:border-amber-400" value="100">
            </div>
            <div class="flex gap-2">
                <button onclick="closeBetModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-xl font-semibold transition text-xs">Cancel</button>
                <button onclick="confirmAndPlaceBet()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-2 rounded-xl font-bold transition text-xs">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Win Congratulations Popup (প্রিমিয়াম স্টাইল) -->
    <div id="win-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden justify-center items-center z-50 p-4">
        <div class="relative w-full max-w-sm bg-gradient-to-b from-rose-600 via-rose-500 to-amber-600 p-6 rounded-3xl shadow-2xl border-4 border-amber-300/40 text-center flex flex-col items-center">
            
            <div class="w-16 h-16 bg-amber-400 rounded-full border-4 border-white flex items-center justify-center shadow-lg -mt-10 mb-2 animate-bounce">
                <span class="text-2xl">🎉</span>
            </div>

            <h2 class="text-2xl font-black text-white tracking-wider drop-shadow-md">Congratulations</h2>
            <p class="text-xs text-white/90 mb-2">You have won the trade!</p>
            
            <div class="flex items-center gap-2 my-2">
                <span class="text-xs text-white/80">Result:</span>
                <span id="win-res-badge" class="px-3 py-1 bg-rose-700 text-white font-bold rounded-full text-xs border border-white/20">Red</span>
                <span id="win-res-num" class="w-6 h-6 bg-amber-500 rounded-full text-white font-bold text-xs flex items-center justify-center">8</span>
                <span id="win-res-bs" class="px-2 py-0.5 bg-blue-600 text-white rounded font-bold text-xs">Big</span>
            </div>

            <div class="w-full bg-white text-slate-900 rounded-2xl p-4 shadow-inner mt-2 flex flex-col items-center">
                <p class="text-xs text-slate-400 uppercase font-semibold">Winning Bonus</p>
                <p id="win-bonus-amount" class="text-3xl font-black text-rose-600 my-1 font-mono">৳0.00</p>
                <p id="win-period-text" class="text-[11px] text-slate-500 font-mono">Period: 2026101501</p>
            </div>

            <button onclick="closeWinModal()" class="mt-5 w-full bg-slate-900 hover:bg-slate-950 text-white py-3 rounded-xl font-bold shadow-lg transition text-sm border border-slate-700">
                Collect & Continue
            </button>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        let currentUser = null;
        let userProfile = null;
        let selectedGameDuration = 30; // ডিফল্ট ৩০ সেকেন্ড
        let currentPeriodNumber = "2026101501";
        let timerSeconds = 30;
        let timerInterval = null;
        let selectedTarget = null;

        document.addEventListener("DOMContentLoaded", async () => {
            currentUser = await requireAuth();
            if (currentUser) {
                await loadUserProfile();
                startTimer();
            }
        });

        async function loadUserProfile() {
            userProfile = await getUserProfile(currentUser.id);
            if (userProfile) {
                document.getElementById("user-balance").innerText = Number(userProfile.balance).toFixed(2);
            }
        }

        function changeGameMode(duration, modeKey) {
            selectedGameDuration = duration;
            timerSeconds = duration;
            
            // মোড কার্ড স্টাইল আপডেট
            ['10s', '30s', '1m', '5m'].forEach(key => {
                let btn = document.getElementById(`mode-${key}`);
                if(key === modeKey) {
                    btn.className = "bg-rose-600 p-2 rounded-xl text-center border border-rose-500 transition active:scale-95 shadow-md";
                    btn.querySelector("div:nth-child(2)").className = "text-[11px] font-bold text-white mt-1";
                } else {
                    btn.className = "bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-center border border-slate-700 transition active:scale-95";
                    btn.querySelector("div:nth-child(2)").className = "text-[11px] font-bold text-amber-400 mt-1";
                }
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = selectedGameDuration;
            document.getElementById("big-countdown-overlayclassList").add("hidden");
            document.getElementById("big-countdown-overlay").classList.remove("flex");
            
            timerInterval = setInterval(() => {
                timerSeconds--;
                let min = Math.floor(timerSeconds / 60);
                let sec = timerSeconds % 60;
                let displayTime = min > 0 ? `${min}:${sec < 10 ? '0' : ''}${sec}` : `00:${sec < 10 ? '0' : ''}${sec}`;
                document.getElementById("countdown-timer").innerText = displayTime;
                
                if (timerSeconds <= 5 && timerSeconds > 0) {
                    document.getElementById("big-number-display").innerText = timerSeconds;
                    document.getElementById("big-countdown-overlay").classList.remove("hidden");
                    document.getElementById("big-countdown-overlay").classList.add("flex");
                }

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById("big-countdown-overlay").classList.remove("flex");
                    document.getElementById("big-countdown-overlay").classList.add("hidden");
                    processRoundResult();
                }
            }, 1000);
        }

        function openBetModal(target) {
            selectedTarget = target;
            document.getElementById("modal-target").innerText = target;
            document.getElementById("bet-modal").classList.remove("hidden");
            document.getElementById("bet-modal").classList.add("flex");
        }

        function closeBetModal() {
            document.getElementById("bet-modal").classList.remove("flex");
            document.getElementById("bet-modal").classList.add("hidden");
        }

        function closeWinModal() {
            document.getElementById("win-modal").classList.remove("flex");
            document.getElementById("win-modal").classList.add("hidden");
        }

        async function confirmAndPlaceBet() {
            let amount = parseFloat(document.getElementById("bet-amount-input").value);

            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            if (amount > userProfile.balance) {
                alert("Insufficient balance!");
                return;
            }

            let newBalance = userProfile.balance - amount;

            const { error: profileError } = await supabaseClient
                .from("profiles")
                .update({ balance: newBalance })
                .eq("id", currentUser.id);

            if (profileError) {
                alert("Failed to place bet. Try again.");
                return;
            }

            userProfile.balance = newBalance;
            document.getElementById("user-balance").innerText = newBalance.toFixed(2);

            await supabaseClient.from("color_game_history").insert([{
                user_id: currentUser.id,
                period_number: currentPeriodNumber,
                bet_type: selectedTarget,
                bet_amount: amount,
                status: 'pending'
            }]);

            await updatePeriodAmounts(amount, selectedTarget);
            closeBetModal();
            document.getElementById("game-status-text").innerText = `Successfully placed ৳${amount} on ${selectedTarget}!`;
        }

        async function updatePeriodAmounts(amount, target) {
            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            if (!periodData) {
                await supabaseClient.from("color_periods").insert([{
                    period_number: currentPeriodNumber,
                    total_green_amount: target === 'Green' ? amount : 0,
                    total_red_amount: target === 'Red' ? amount : 0,
                    total_violet_amount: target === 'Violet' ? amount : 0,
                    status: 'pending'
                }]);
            } else {
                let updateField = {};
                if (target === 'Green') updateField.total_green_amount = Number(periodData.total_green_amount) + amount;
                else if (target === 'Red') updateField.total_red_amount = Number(periodData.total_red_amount) + amount;
                else if (target === 'Violet') updateField.total_violet_amount = Number(periodData.total_violet_amount) + amount;

                await supabaseClient
                    .from("color_periods")
                    .update(updateField)
                    .eq("period_number", currentPeriodNumber);
            }
        }

        async function processRoundResult() {
            document.getElementById("game-status-text").innerText = "Calculating result...";

            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            let green = periodData ? Number(periodData.total_green_amount) : 0;
            let red = periodData ? Number(periodData.total_red_amount) : 0;
            let violet = periodData ? Number(periodData.total_violet_amount) : 0;

            let winningColor = 'Green';
            if (green === 0 && red === 0 && violet === 0) {
                const randomColors = ['Green', 'Red', 'Green', 'Red', 'Violet'];
                winningColor = randomColors[Math.floor(Math.random() * randomColors.length)];
            } else {
                if (green <= red && green <= violet) winningColor = 'Green';
                else if (red <= green && red <= violet) winningColor = 'Red';
                else winningColor = 'Violet';
            }

            let numbersMap = {
                Green: [1, 3, 7, 9],
                Red: [2, 4, 6, 8],
                Violet: [0, 5]
            };
            let possibleNums = numbersMap[winningColor];
            let winningNumber = possibleNums[Math.floor(Math.random() * possibleNums.length)];
            let winningBigSmall = winningNumber >= 5 ? 'Big' : 'Small';
            let winningResultString = `${winningColor}-${winningNumber}`;

            await supabaseClient
                .from("color_periods")
                .update({ winning_color: winningColor, winning_number: winningNumber, status: 'completed' })
                .eq("period_number", currentPeriodNumber);

            let { data: allBets } = await supabaseClient
                .from("color_game_history")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .eq("status", 'pending');

            let userWonAmount = 0;
            let hasUserWon = false;

            if (allBets && allBets.length > 0) {
                for (let bet of allBets) {
                    let isWin = false;
                    let multiplier = 2;

                    if (bet.bet_type === 'Red') multiplier = 1.9;
                    else if (bet.bet_type === 'Violet') multiplier = 4.5;
                    else if (bet.bet_type === 'Big' || bet.bet_type === 'Small') multiplier = 1.9;
                    else if (!isNaN(bet.bet_type)) multiplier = 9;

                    if (bet.bet_type === winningColor) isWin = true;
                    else if (bet.bet_type === String(winningNumber)) isWin = true;
                    else if (bet.bet_type === winningBigSmall) isWin = true;

                    if (isWin) {
                        let payoutAmount = bet.bet_amount * multiplier;
                        if (bet.user_id === currentUser.id) {
                            userWonAmount = payoutAmount;
                            hasUserWon = true;
                        }
                        
                        await supabaseClient
                            .from("color_game_history")
                            .update({ winning_result: winningResultString, payout: payoutAmount, status: 'win' })
                            .eq("id", bet.id);

                        let { data: targetProfile } = await supabaseClient
                            .from("profiles")
                            .select("balance")
                            .eq("id", bet.user_id)
                            .single();

                        if (targetProfile) {
                            let updatedBal = Number(targetProfile.balance) + payoutAmount;
                            await supabaseClient
                                .from("profiles")
                                .update({ balance: updatedBal })
                                .eq("id", bet.user_id);
                        }
                    } else {
                        await supabaseClient
                            .from("color_game_history")
                            .update({ winning_result: winningResultString, payout: 0, status: 'loss' })
                            .eq("id", bet.id);
                    }
                }
            }

            document.getElementById("game-status-text").innerText = `Result: ${winningResultString} (${winningBigSmall})`;
            await loadUserProfile();

            if (hasUserWon) {
                document.getElementById("win-res-badge").innerText = winningColor;
                document.getElementById("win-res-num").innerText = winningNumber;
                document.getElementById("win-res-bs").innerText = winningBigSmall;
                document.getElementById("win-bonus-amount").innerText = `৳${userWonAmount.toFixed(2)}`;
                document.getElementById("win-period-text").innerText = `Period: ${currentPeriodNumber}`;
                
                document.getElementById("win-modal").classList.remove("hidden");
                document.getElementById("win-modal").classList.add("flex");
            }

            currentPeriodNumber = String(parseInt(currentPeriodNumber) + 1);
            document.getElementById("period-number").innerText = currentPeriodNumber;

            setTimeout(() => {
                startTimer();
            }, 3000);
        }
    </script>
</body>
</html>
