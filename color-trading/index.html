<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trade - Win Go</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .custom-gradient {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .ruby-sphere {
            background: radial-gradient(circle at 35% 35%, #ff4d4d, #cc0000 50%, #5a0000);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(239,68,68,.5);
            border: 2px solid #ff1a1a;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .green-sphere {
            background: radial-gradient(circle at 35% 35%, #2eff7d, #00b33c 50%, #004d1a);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(0,255,65,.5);
            border: 2px solid #1aff66;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .violet-sphere {
            background: radial-gradient(circle at 35% 35%, #b192ff, #7c3aed 50%, #3b0764);
            box-shadow: inset -3px -3px 8px rgba(0,0,0,.8),
                inset 3px 3px 6px rgba(255,255,255,.4),
                0 0 12px rgba(124,58,237,.5);
            border: 2px solid #a78bfa;
            color: white;
            text-shadow: 0 0 8px rgba(255,255,255,.8);
        }

        .main-game-card {
            background: #080d20;
            border: 1px solid #253047;
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-section { min-width: 0; }
        .mode-button { min-height: 58px; }

        .number-button {
            aspect-ratio: 1 / 1;
            min-width: 0;
            font-size: 20px;
        }

        /* Period and Timer card */
        .period-timer-card {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(16,185,129,.13), transparent 48%),
                radial-gradient(ellipse at 100% 100%, rgba(59,130,246,.12), transparent 45%),
                linear-gradient(145deg, #0b1428, #030817 65%, #071326);
            border: 1px solid #263b54;
            border-radius: 22px;
            padding: 15px;
            min-height: 112px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 22px rgba(0,0,0,.4),
                0 8px 20px rgba(0,0,0,.18);
        }

        .period-timer-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 14%;
            right: 14%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #34d399, transparent);
        }

        .period-info, .timer-area {
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .period-heading {
            display: block;
            font-size: 10px;
            line-height: 1.4;
            color: #93c5fd;
            letter-spacing: .7px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 8px;
            white-space: nowrap;
            text-align: left;
        }

        .period-number-display {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            width: 100%;
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            text-align: left;
            overflow: hidden;
        }

        .period-digit {
            flex: 0 1 19px;
            min-width: 0;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            background: linear-gradient(180deg, #16a34a, #08752c);
            border: 1px solid #22c55e;
            box-shadow: inset 0 2px 4px rgba(255,255,255,.18),
                inset 0 -4px 5px rgba(0,0,0,.35),
                0 0 7px rgba(34,197,94,.2);
            color: white;
            font-family: monospace;
            font-size: clamp(10px, 3.1vw, 14px);
            font-weight: 900;
            text-shadow: 0 0 5px rgba(255,255,255,.3);
        }

        .period-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,0,0,.18);
            border-top: 1px solid rgba(255,255,255,.10);
        }

        .timer-area { text-align: center; }

        .timer-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 25px;
            padding: 6px 9px;
            margin-bottom: 9px;
            border-radius: 8px;
            border: 1px solid rgba(52,211,153,.28);
            background: rgba(6,78,59,.3);
            color: #6ee7b7;
            font-size: 9px;
            line-height: 1.2;
            font-weight: 900;
            letter-spacing: .5px;
            white-space: nowrap;
        }

        .timer-label::before {
            content: "";
            width: 6px;
            height: 6px;
            flex: 0 0 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 7px rgba(52,211,153,.8);
        }

        .timer-label.timer-label-danger {
            color: #fecdd3;
            background: rgba(136,19,55,.45);
            border-color: rgba(251,113,133,.65);
            animation: dangerPulse 1s infinite;
        }

        .timer-label.timer-label-danger::before {
            background: #fb7185;
        }

        .digital-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .timer-digit {
            width: 25px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            background: linear-gradient(180deg, #16a34a, #08752c);
            border: 1px solid #22c55e;
            box-shadow: inset 0 2px 4px rgba(255,255,255,.18),
                inset 0 -4px 5px rgba(0,0,0,.35),
                0 0 9px rgba(34,197,94,.24);
            color: white;
            font-family: monospace;
            font-size: 23px;
            font-weight: 900;
            position: relative;
            overflow: hidden;
        }

        .timer-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,0,0,.18);
            border-top: 1px solid rgba(255,255,255,.10);
        }

        .timer-colon {
            color: #4ade80;
            font-size: 23px;
            line-height: 1;
            font-weight: 900;
            padding: 0 1px;
        }

        .digital-timer.timer-danger .timer-digit {
            background: linear-gradient(180deg, #f43f5e, #9f1239);
            border-color: #fb7185;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer.timer-danger .timer-colon {
            color: #fb7185;
        }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .72; }
        }

        /* Winning selection blinks exactly 3 times */
        .winning-blink {
            position: relative;
            z-index: 2;
            animation: winningBlink .45s ease-in-out 3;
        }

        .win-blink-green { --win-glow: rgba(34,255,130,.95); }
        .win-blink-red { --win-glow: rgba(255,65,95,.95); }
        .win-blink-violet { --win-glow: rgba(190,130,255,.95); }
        .win-blink-number { --win-glow: rgba(255,255,255,.95); }
        .win-blink-big { --win-glow: rgba(255,190,45,.95); }
        .win-blink-small { --win-glow: rgba(70,160,255,.95); }

        @keyframes winningBlink {
            0%, 100% {
                filter: brightness(1);
                box-shadow: 0 0 5px var(--win-glow, white);
                outline: 2px solid transparent;
                outline-offset: 1px;
            }

            50% {
                filter: brightness(1.5);
                box-shadow: 0 0 15px var(--win-glow, white),
                    0 0 28px var(--win-glow, white);
                outline: 2px solid var(--win-glow, white);
                outline-offset: 2px;
            }
        }

        .history-table {
            min-width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .history-table th, .history-table td {
            padding: 9px 7px;
            text-align: left;
            vertical-align: middle;
        }

        .my-history-table {
            min-width: 850px;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .my-history-table th, .my-history-table td {
            padding: 10px 9px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }

        .my-history-table th {
            background: #111b30;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .my-history-table td { font-size: 11px; }

        .result-number {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 900;
            color: white;
        }

        .result-red {
            background: #e11d48;
            border: 2px solid #fb7185;
            box-shadow: 0 0 8px rgba(244,63,94,.25);
        }

        .result-green {
            background: #059669;
            border: 2px solid #34d399;
            box-shadow: 0 0 8px rgba(16,185,129,.25);
        }

        .result-violet {
            background: #7c3aed;
            border: 2px solid #a78bfa;
            box-shadow: 0 0 8px rgba(139,92,246,.25);
        }

        .result-badge {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .date-cell {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 10px !important;
        }

        .history-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }


        /* =========================================================
           WIN CONGRATULATIONS POPUP
           New visual animation - existing game logic unchanged
           ========================================================= */

        #win-modal {
            background:
                radial-gradient(circle at center,
                    rgba(255, 160, 40, .10),
                    rgba(0,0,0,.86) 58%,
                    rgba(0,0,0,.94));
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }

        .win-popup {
            position: relative;
            width: min(94vw, 390px);
            min-height: 480px;
            padding: 0 14px 24px;
            overflow: visible;
            border-radius: 30px;
            background:
                linear-gradient(180deg,
                    #ff784c 0%,
                    #f85b48 35%,
                    #f44245 72%,
                    #ed303e 100%);
            border: 1px solid rgba(255,255,255,.22);
            box-shadow:
                0 30px 70px rgba(0,0,0,.65),
                0 0 45px rgba(255,78,55,.25),
                inset 0 1px 0 rgba(255,255,255,.35);
            transform-origin: center center;
            animation: winPopupEnter .65s cubic-bezier(.17,.89,.32,1.28) both;
        }

        .win-popup::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%,
                    rgba(255,255,255,.23),
                    transparent 30%),
                linear-gradient(180deg,
                    transparent 60%,
                    rgba(165,0,20,.12));
        }

        .win-popup::after {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            bottom: -5px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0,0,0,.28);
            filter: blur(12px);
            z-index: -1;
        }

        @keyframes winPopupEnter {
            0% {
                opacity: 0;
                transform: translateY(70px) scale(.65) rotate(-2deg);
            }

            55% {
                opacity: 1;
                transform: translateY(-8px) scale(1.035) rotate(.5deg);
            }

            75% {
                transform: translateY(3px) scale(.985);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* Decorative rays behind medal */
        .win-rays {
            position: absolute;
            top: -72px;
            left: 50%;
            width: 230px;
            height: 230px;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 1;
        }

        .win-rays span {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 102px;
            transform-origin: 50% 100%;
            background: linear-gradient(
                to top,
                rgba(255,215,90,.55),
                rgba(255,244,190,.05)
            );
            border-radius: 100%;
        }

        .win-rays span:nth-child(1) {
            transform: translate(-50%, -100%) rotate(0deg);
        }

        .win-rays span:nth-child(2) {
            transform: translate(-50%, -100%) rotate(45deg);
        }

        .win-rays span:nth-child(3) {
            transform: translate(-50%, -100%) rotate(90deg);
        }

        .win-rays span:nth-child(4) {
            transform: translate(-50%, -100%) rotate(135deg);
        }

        .win-rays span:nth-child(5) {
            transform: translate(-50%, -100%) rotate(180deg);
        }

        .win-rays span:nth-child(6) {
            transform: translate(-50%, -100%) rotate(225deg);
        }

        .win-rays span:nth-child(7) {
            transform: translate(-50%, -100%) rotate(270deg);
        }

        .win-rays span:nth-child(8) {
            transform: translate(-50%, -100%) rotate(315deg);
        }


        /* Ribbon */
        .win-ribbon-area {
            position: relative;
            height: 145px;
            margin: 0 -14px;
            z-index: 3;
        }

        .win-ribbon {
            position: absolute;
            top: 54px;
            width: 155px;
            height: 68px;
            background:
                linear-gradient(180deg,
                    #ffb72e 0%,
                    #f28a19 48%,
                    #dc5b0d 100%);
            box-shadow:
                0 7px 10px rgba(113,35,0,.28),
                inset 0 1px 1px rgba(255,255,255,.55),
                inset 0 -4px 7px rgba(128,43,0,.22);
        }

        .win-ribbon.left {
            left: -16px;
            transform: rotate(-9deg);
            border-radius: 10px 0 0 12px;
        }

        .win-ribbon.right {
            right: -16px;
            transform: rotate(9deg);
            border-radius: 0 10px 12px 0;
        }

        .win-ribbon.left::after,
        .win-ribbon.right::after {
            content: "";
            position: absolute;
            bottom: -16px;
            width: 42px;
            height: 34px;
            background: #cf550b;
            clip-path: polygon(0 0, 100% 0, 76% 100%, 50% 72%, 23% 100%);
        }

        .win-ribbon.left::after {
            right: 8px;
        }

        .win-ribbon.right::after {
            left: 8px;
        }

        .win-ribbon-fold {
            position: absolute;
            top: 62px;
            width: 35px;
            height: 53px;
            background: linear-gradient(
                90deg,
                rgba(150,48,0,.55),
                rgba(255,172,35,.6)
            );
            z-index: 2;
        }

        .win-ribbon-fold.left {
            left: 119px;
            transform: skewY(12deg);
        }

        .win-ribbon-fold.right {
            right: 119px;
            transform: skewY(-12deg);
        }


        /* White decorative petals */
        .win-petals {
            position: absolute;
            left: 50%;
            top: 4px;
            width: 210px;
            height: 125px;
            transform: translateX(-50%);
            z-index: 4;
            pointer-events: none;
        }

        .petal {
            position: absolute;
            width: 35px;
            height: 73px;
            background: linear-gradient(
                90deg,
                #fff,
                #fff7f2 55%,
                #e9d7d1
            );
            border-radius: 70% 30% 70% 30%;
            box-shadow:
                0 3px 8px rgba(70,0,0,.16),
                inset 1px 0 3px rgba(255,255,255,.9);
            transform-origin: 50% 90%;
        }

        .petal.p1 {
            left: 86px;
            top: -2px;
            transform: rotate(0deg);
        }

        .petal.p2 {
            left: 42px;
            top: 15px;
            transform: rotate(-42deg) scale(.92);
        }

        .petal.p3 {
            right: 42px;
            top: 15px;
            transform: rotate(42deg) scale(.92);
        }

        .petal.p4 {
            left: 14px;
            top: 45px;
            transform: rotate(-65deg) scale(.76);
        }

        .petal.p5 {
            right: 14px;
            top: 45px;
            transform: rotate(65deg) scale(.76);
        }

        .petal.p6 {
            left: 67px;
            top: 45px;
            transform: rotate(-24deg) scale(.68);
        }

        .petal.p7 {
            right: 67px;
            top: 45px;
            transform: rotate(24deg) scale(.68);
        }


        /* Gold medal */
        .win-medal {
            position: absolute;
            top: 7px;
            left: 50%;
            width: 132px;
            height: 132px;
            transform: translateX(-50%);
            border-radius: 50%;
            z-index: 7;
            background:
                radial-gradient(circle at 37% 30%,
                    #fff6a3 0%,
                    #ffd34f 18%,
                    #ffae18 45%,
                    #ed7d08 68%,
                    #b95000 100%);
            border: 8px solid #ffe8a0;
            box-shadow:
                0 0 0 3px #f1a62a,
                0 0 0 6px rgba(255,255,255,.42),
                0 10px 24px rgba(103,30,0,.36),
                inset 0 3px 8px rgba(255,255,255,.75),
                inset 0 -8px 12px rgba(139,52,0,.35);
            animation: medalFloat 2.2s ease-in-out infinite;
        }

        .win-medal::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 3px solid rgba(255,239,157,.9);
            box-shadow:
                inset 0 0 0 3px rgba(235,129,8,.45),
                0 0 12px rgba(255,247,190,.55);
        }

        .win-medal::after {
            content: "";
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255,238,160,.55);
        }

        @keyframes medalFloat {
            0%, 100% {
                transform: translateX(-50%) translateY(0) rotate(0deg);
            }

            50% {
                transform: translateX(-50%) translateY(-5px) rotate(.8deg);
            }
        }

        .win-rocket {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -52%);
            width: 63px;
            height: 70px;
            z-index: 3;
            filter: drop-shadow(0 2px 3px rgba(110,55,0,.28));
        }

        .rocket-body {
            position: absolute;
            left: 17px;
            top: 5px;
            width: 30px;
            height: 51px;
            background: #fffdf3;
            border-radius: 50% 50% 43% 43%;
            transform: rotate(0deg);
        }

        .rocket-body::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 8px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffbd2f;
            box-shadow:
                0 0 0 2px rgba(222,135,8,.18),
                inset 0 1px 3px rgba(255,255,255,.8);
        }

        .rocket-body::after {
            content: "⚡";
            position: absolute;
            left: 11px;
            top: 9px;
            color: white;
            font-size: 10px;
            line-height: 14px;
            font-weight: 900;
        }

        .rocket-fin-left,
        .rocket-fin-right {
            position: absolute;
            top: 32px;
            width: 17px;
            height: 22px;
            background: #fffdf3;
        }

        .rocket-fin-left {
            left: 4px;
            border-radius: 100% 0 0 10px;
            transform: skewY(-28deg);
        }

        .rocket-fin-right {
            right: 4px;
            border-radius: 0 100% 10px 0;
            transform: skewY(28deg);
        }

        .rocket-fire {
            position: absolute;
            left: 50%;
            bottom: -4px;
            width: 17px;
            height: 25px;
            transform: translateX(-50%);
            background: linear-gradient(
                180deg,
                #fff6a1,
                #ffad1e 45%,
                #f04425
            );
            clip-path: polygon(
                50% 100%,
                18% 60%,
                37% 0,
                54% 34%,
                71% 0,
                82% 60%
            );
            animation: rocketFire .45s ease-in-out infinite alternate;
        }

        @keyframes rocketFire {
            from {
                transform: translateX(-50%) scaleY(.82);
            }
            to {
                transform: translateX(-50%) scaleY(1.08);
            }
        }


        /* Congratulations title */
        .win-title {
            position: relative;
            z-index: 5;
            margin-top: 0;
            color: white;
            font-size: clamp(29px, 8vw, 39px);
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: .2px;
            text-shadow:
                0 2px 0 rgba(175,35,24,.45),
                0 4px 12px rgba(120,0,0,.35);
            animation: titleReveal .65s .15s both;
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(.85);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .win-subtitle {
            position: relative;
            z-index: 5;
            margin-top: 7px;
            color: rgba(255,255,255,.88);
            font-size: 12px;
            font-weight: 600;
            animation: titleReveal .65s .22s both;
        }


        /* Result badges */
        .win-result-row {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 17px;
            margin-bottom: 12px;
            animation: titleReveal .65s .28s both;
        }

        .win-result-label {
            color: rgba(255,255,255,.76);
            font-size: 11px;
            font-weight: 600;
        }

        .win-result-pill {
            min-width: 58px;
            padding: 6px 11px;
            border-radius: 8px;
            background: rgba(196,25,46,.52);
            border: 1px solid rgba(255,255,255,.25);
            color: white;
            font-size: 11px;
            font-weight: 900;

                0 9px 16px rgba(80,0,0,.28),

                100% 0,
                100% 90%,
                97% 95%,
                94% 91%,
                91% 96%,
                88% 91%,
                85% 96%,
                82% 91%,
                79% 96%,
                76% 91%,
                73% 96%,
                70% 91%,
                67% 96%,
                64% 91%,
                61% 96%,
                58% 91%,
                55% 96%,
                52% 91%,
                49% 96%,
                46% 91%,
                43% 96%,
                40% 91%,
                37% 96%,
                34% 91%,
                31% 96%,
                28% 91%,
                25% 96%,

                19% 96%,
                16% 91%,
                13% 96%,

    <script>
        let currentUser = null;
        let userProfile = null;
        let selectedGameDuration = 30;
        let currentPeriodNumber = "2026101501";
        let timerSeconds = 30;
        let timerInterval = null;
        let selectedTarget = null;

        let activeTab = 'game-history';

        document.addEventListener("DOMContentLoaded", async () => {
            renderPeriodNumber();

            currentUser = await requireAuth();

            if (currentUser) {
                await loadUserProfile();
                startTimer();
                loadHistoryData('game-history');
            }
        });

        async function loadUserProfile() {
            userProfile = await getUserProfile(currentUser.id);

            if (userProfile) {
                document.getElementById("user-balance").innerText =
                    Number(userProfile.balance).toFixed(2);
            }
        }

        function changeGameMode(duration, modeKey) {
            selectedGameDuration = duration;
            timerSeconds = duration;

            ['10s', '30s', '1m', '5m'].forEach(key => {
                let btn = document.getElementById(`mode-${key}`);

                if (key === modeKey) {
                    btn.className = "mode-button bg-rose-600 p-2 rounded-xl text-center border border-rose-500 transition active:scale-95 shadow-md";

                    btn.querySelector("div:nth-child(2)").className =
                        "text-[11px] font-bold text-white mt-1";

                } else {
                    btn.className = "mode-button bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-center border border-slate-700 transition active:scale-95";

                    btn.querySelector("div:nth-child(2)").className =
                        "text-[11px] font-bold text-amber-400 mt-1";
                }
            });

            startTimer();
        }


        function renderPeriodNumber() {
            const element = document.getElementById("period-number");

            if (!element) return;

            const periodText = String(currentPeriodNumber);

            element.innerHTML = [...periodText].map(digit =>
                `<span class="period-digit">${digit}</span>`
            ).join("");
        }


        function clearWinningHighlights() {

            document.querySelectorAll('.winning-blink').forEach(button => {

                button.classList.remove(
                    'winning-blink',
                    'win-blink-green',
                    'win-blink-red',
                    'win-blink-violet',
                    'win-blink-number',
                    'win-blink-big',
                    'win-blink-small'
                );

            });

        }


        function highlightWinningTargets(
            winningColor,
            winningNumber,
            winningBigSmall
        ) {

            clearWinningHighlights();

            const colorClass = {
                Green: 'win-blink-green',
                Red: 'win-blink-red',
                Violet: 'win-blink-violet'
            };

            document.querySelectorAll(
                'button[onclick^="openBetModal("]'
            ).forEach(button => {

                const match = button
                    .getAttribute('onclick')
                    ?.match(
                        /openBetModal\(['"]([^'"]+)['"]\)/
                    );

                if (!match) return;

                const target = match[1];

                let highlightClass = '';

                if (target === winningColor) {

                    highlightClass =
                        colorClass[winningColor] || '';

                } else if (
                    target === String(winningNumber)
                ) {

                    highlightClass =
                        'win-blink-number';

                } else if (
                    target === winningBigSmall
                ) {

                    highlightClass =
                        winningBigSmall === 'Big'
                            ? 'win-blink-big'
                            : 'win-blink-small';
                }

                if (highlightClass) {

                    button.classList.add(
                        'winning-blink',
                        highlightClass
                    );

                    button.addEventListener(
                        'animationend',
                        function removeBlink(event) {

                            if (
                                event.animationName !==
                                'winningBlink'
                            ) return;

                            button.classList.remove(
                                'winning-blink',
                                'win-blink-green',
                                'win-blink-red',
                                'win-blink-violet',
                                'win-blink-number',
                                'win-blink-big',
                                'win-blink-small'
                            );

                            button.removeEventListener(
                                'animationend',
                                removeBlink
                            );

                        }
                    );
                }

            });
        }


        function startTimer() {

            clearInterval(timerInterval);

            timerSeconds = selectedGameDuration;

            const timerElem =
                document.getElementById("countdown-timer");

            const timerLabel =
                document.getElementById("timer-label");


            function updateMainTimer() {

                if (!timerElem) return;

                const min =
                    Math.floor(timerSeconds / 60);

                const sec =
                    timerSeconds % 60;

                const timeText =
                    `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;


                timerElem.innerHTML = `
                    <span class="timer-digit">${timeText[0]}</span>
                    <span class="timer-digit">${timeText[1]}</span>
                    <span class="timer-colon">:</span>
                    <span class="timer-digit">${timeText[3]}</span>
                    <span class="timer-digit">${timeText[4]}</span>
                `;


                if (timerSeconds <= 5) {

                    timerElem.classList.add(
                        "timer-danger"
                    );

                    if (timerLabel) {

                        timerLabel.innerText =
                            "BET CLOSED";

                        timerLabel.classList.add(
                            "timer-label-danger"
                        );
                    }

                } else {

                    timerElem.classList.remove(
                        "timer-danger"
                    );

                    if (timerLabel) {

                        timerLabel.innerText =
                            "PLACE YOUR BET";

                        timerLabel.classList.remove(
                            "timer-label-danger"
                        );
                    }
                }
            }


            updateMainTimer();


            timerInterval = setInterval(() => {

                timerSeconds =
                    Math.max(0, timerSeconds - 1);

                updateMainTimer();


                if (timerSeconds <= 0) {

                    clearInterval(timerInterval);

                    processRoundResult();
                }

            }, 1000);
        }


        function switchTab(tabName) {

            const container =
                document.getElementById("tab-content");


            if (
                activeTab === tabName &&
                !container.classList.contains("hidden")
            ) {

                container.classList.add("hidden");

                        btn.className =

        function escapeHtml(value) {

            return String(value ?? '')
                .replace(
                    /[&<>"']/g,
                    char => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    })[char]
                );
        }


        function getSavedBetResult(row) {

            let savedResult =
                String(row.winning_result || '');

            let resultMatch =
                savedResult.match(
                    /(Green|Red|Violet)\s*[-:]\s*(\d)/i
                );


            let color = resultMatch
                ? resultMatch[1].charAt(0).toUpperCase() +
                  resultMatch[1].slice(1).toLowerCase()
                : (row.winning_color || '');


            let number = resultMatch
                ? Number(resultMatch[2])
                : (
                    row.winning_number !== null &&
                    row.winning_number !== undefined &&
                    row.winning_number !== ''
                )
                    ? Number(row.winning_number)
                    : null;


            if (
                !['Green', 'Red', 'Violet']
                .includes(color)
            ) {
                color = '';
            }


            let bigSmall =
                number !== null &&
                Number.isFinite(number)
                    ? (number >= 5 ? 'Big' : 'Small')
                    : '';


            let colorClass =
                color === 'Red'
                    ? 'result-red'
                    : color === 'Green'
                        ? 'result-green'
                        : color === 'Violet'
                            ? 'result-violet'
                            : '';


            return {
                color,
                number,
                bigSmall,
                colorClass,
                hasResult:
                    number !== null &&
                    Number.isFinite(number) &&
                    color !== ''
            };
        }


        function formatHistoryDate(dateValue) {

            if (!dateValue) {
                return {
                    date: 'N/A',
                    time: 'N/A'
                };
            }


            const date =
                new Date(dateValue);


            if (Number.isNaN(date.getTime())) {

                return {
                    date: 'N/A',
                    time: 'N/A'
                };
            }


            return {

                date: date.toLocaleDateString(
                    'en-GB',
                    {
                        timeZone: 'Asia/Dhaka',
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    }
                ),

                time: date.toLocaleTimeString(
                    'en-GB',
                    {
                        timeZone: 'Asia/Dhaka',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    }
                )
            };
        }

        async function confirmAndPlaceBet() {

            if (timerSeconds <= 5) {

                closeBetModal();

                document.getElementById(
                    "game-status-text"
                ).innerText =
                    "No More Bet! Please wait for the next round.";

                return;
            }


            let amount =
                parseFloat(
                    document.getElementById(
                        "bet-amount-input"
                    ).value
                );


            if (isNaN(amount) || amount <= 0) {

                alert(
                    "Please enter a valid amount!"
                );

                return;
            }


            if (
                amount >
                Number(userProfile.balance)
            ) {

                alert(
                    "Insufficient balance!"
                );

                return;
            }


            let newBalance =
                Number(userProfile.balance) -
                amount;


            const {
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .update({
                        balance: newBalance
                    })
                    .eq(
                        "id",
                        currentUser.id
                    );


            if (profileError) {

                alert(
                    "Failed to place bet. Try again."
                );

                return;
            }


            userProfile.balance =
                newBalance;


            document.getElementById(
                "user-balance"
            ).innerText =
                newBalance.toFixed(2);


            const {
                error: betInsertError
            } =
                await supabaseClient
                    .from("color_game_history")
                    .insert([{
                        user_id: currentUser.id,
                        period_number: currentPeriodNumber,
                        bet_type: selectedTarget,
                        bet_amount: amount,
                        status: 'pending'
                    }]);


            if (betInsertError) {

                console.error(
                    "Bet history insert error:",
                    betInsertError
                );

                alert(
                    "Bet history could not be saved. Please contact support."
                );

                return;
            }


            await updatePeriodAmounts(
                amount,
                selectedTarget
            );


            closeBetModal();


            document.getElementById(
                "game-status-text"
            ).innerText =
                `Successfully placed ৳${amount} on ${selectedTarget}!`;


            if (activeTab === 'my-history') {

                loadHistoryData(
                    'my-history'
                );
            }
        }


        async function updatePeriodAmounts(
            amount,
            target
        ) {

            let {
                data: periodData
            } =
                await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq(
                        "period_number",
                        currentPeriodNumber
                    )
                    .maybeSingle();


            if (!periodData) {

                await supabaseClient
                    .from("color_periods")
                    .insert([{

                        period_number:
                            currentPeriodNumber,

                        total_green_amount:
                            target === 'Green'
                                ? amount
                                : 0,

                        total_red_amount:
                            target === 'Red'
                                ? amount
                                : 0,

                        total_violet_amount:
                            target === 'Violet'
                                ? amount
                                : 0,

                        status: 'pending'

                    }]);

            } else {

                let updateField = {};


                if (target === 'Green') {

                    updateField.total_green_amount =
                        Number(
                            periodData.total_green_amount
                        ) + amount;

                } else if (target === 'Red') {

                    updateField.total_red_amount =
                        Number(
                            periodData.total_red_amount
                        ) + amount;

                } else if (target === 'Violet') {

                    updateField.total_violet_amount =
                        Number(
                            periodData.total_violet_amount
                        ) + amount;
                }


                await supabaseClient
                    .from("color_periods")
                    .update(updateField)
                    .eq(
                        "period_number",
                        currentPeriodNumber
                    );
            }
        }


        async function processRoundResult() {

            document.getElementById(
                "game-status-text"
            ).innerText =
                "Calculating result...";


            let {
                data: periodData
            } =
                await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq(
                        "period_number",
                        currentPeriodNumber
                    )
                    .maybeSingle();


            let green =
                periodData
                    ? Number(
                        periodData.total_green_amount
                    )
                    : 0;


            let red =
                periodData
                    ? Number(
                        periodData.total_red_amount
                    )
                    : 0;


            let violet =
                periodData
                    ? Number(
                        periodData.total_violet_amount
                    )
                    : 0;


            let winningColor = 'Green';


            if (
                green === 0 &&
                red === 0 &&
                violet === 0
            ) {

                const randomColors = [
                    'Green',
                    'Red',
                    'Green',
                    'Red',
                    'Violet'
                ];


                winningColor =
                    randomColors[
                        Math.floor(
                            Math.random() *
                            randomColors.length
                        )
                    ];

            } else {

                if (
                    green <= red &&
                    green <= violet
                ) {

                    winningColor =
                        'Green';

                } else if (
                    red <= green &&
                    red <= violet
                ) {

                    winningColor =
                        'Red';

                } else {

                    winningColor =
                        'Violet';
                }
            }


            let numbersMap = {

                Green: [
                    1,
                    3,
                    7,
                    9
                ],

                Red: [
                    2,
                    4,
                    6,
                    8
                ],

                Violet: [
                    0,
                    5
                ]

            };


            let possibleNums =
                numbersMap[winningColor];


            let winningNumber =
                possibleNums[
                    Math.floor(
                        Math.random() *
                        possibleNums.length
                    )
                ];


            let winningBigSmall =
                winningNumber >= 5
                    ? 'Big'
                    : 'Small';


            let winningResultString =
                `${winningColor}-${winningNumber}`;


            await supabaseClient
                .from("color_periods")
                .update({

                    winning_color:
                        winningColor,

                    winning_number:
                        winningNumber,

                    status:
                        'completed'

                })
                .eq(
                    "period_number",
                    currentPeriodNumber
                );


            let {
                data: allBets
            } =
                await supabaseClient
                    .from("color_game_history")
                    .select("*")
                    .eq(
                        "period_number",
                        currentPeriodNumber
                    )
                    .eq(
                        "status",
                        'pending'
                    );


            let userWonAmount = 0;

            let hasUserWon = false;


            if (
                allBets &&
                allBets.length > 0
            ) {

                for (
                    let bet of allBets
                ) {

                    let isWin = false;

                    let multiplier = 2;


                    if (
                        bet.bet_type === 'Red'
                    ) {

                        multiplier = 1.9;

                    } else if (
                        bet.bet_type === 'Violet'
                    ) {

                        multiplier = 4.5;

                    } else if (
                        bet.bet_type === 'Big' ||
                        bet.bet_type === 'Small'
                    ) {

                        multiplier = 1.9;

                    } else if (
                        !isNaN(
                            bet.bet_type
                        )
                    ) {

                        multiplier = 9;
                    }


                    if (
                        bet.bet_type ===
                        winningColor
                    ) {

                        isWin = true;

                    } else if (
                        bet.bet_type ===
                        String(winningNumber)
                    ) {

                        isWin = true;

                    } else if (
                        bet.bet_type ===
                        winningBigSmall
                    ) {

                        isWin = true;
                    }


                    if (isWin) {

                        let payoutAmount =
                            bet.bet_amount *
                            multiplier;


                        if (
                            bet.user_id ===
                            currentUser.id
                        ) {

                            userWonAmount +=
                                payoutAmount;

                            hasUserWon = true;
                        }


                        await supabaseClient
                            .from(
                                "color_game_history"
                            )
                            .update({

                                winning_result:
                                    winningResultString,

                                payout:
                                    payoutAmount,

                                status:
                                    'win'

                            })
                            .eq(
                                "id",
                                bet.id
                            );


                        let {
                            data: targetProfile
                        } =
                            await supabaseClient
                                .from("profiles")
                                .select("balance")
                                .eq(
                                    "id",
                                    bet.user_id
                                )
                                .single();


                        if (targetProfile) {

                            let updatedBal =
                                Number(
                                    targetProfile.balance
                                ) +
                                payoutAmount;


                            await supabaseClient
                                .from("profiles")
                                .update({
                                    balance:
                                        updatedBal
                                })
                                .eq(
                                    "id",
                                    bet.user_id
                                );
                        }

                    } else {

                        await supabaseClient
                            .from(
                                "color_game_history"
                            )
                            .update({

                                winning_result:
                                    winningResultString,

                                payout:
                                    0,

                                status:
                                    'loss'

                            })
                            .eq(
                                "id",
                                bet.id
                            );
                    }
                }
            }


            document.getElementById(
                "game-status-text"
            ).innerText =
                `Result: ${winningResultString} (${winningBigSmall})`;


            highlightWinningTargets(
                winningColor,
                winningNumber,
                winningBigSmall
            );


            await loadUserProfile();


            if (hasUserWon) {

                document.getElementById(
                    "win-res-badge"
                ).innerText =
                    winningColor;


                document.getElementById(
                    "win-res-num"
                ).innerText =
                    winningNumber;


                document.getElementById(
                    "win-res-bs"
                ).innerText =
                    winningBigSmall;


                document.getElementById(
                    "win-bonus-amount"
                ).innerText =
                    `৳${userWonAmount.toFixed(2)}`;


                document.getElementById(
                    "win-period-text"
                ).innerText =
                    `Period: ${currentPeriodNumber}`;


                /*
                 * Re-trigger popup animation every time.
                 * This does not change any game logic.
                 */
                const winModal =
                    document.getElementById(
                        "win-modal"
                    );

                const winPopup =
                    winModal.querySelector(
                        ".win-popup"
                    );


                winPopup.style.animation = "none";

                void winPopup.offsetWidth;

                winPopup.style.animation = "";


                winModal.classList.remove(
                    "hidden"
                );

                winModal.classList.add(
                    "flex"
                );
            }


            currentPeriodNumber =
                String(
                    parseInt(
                        currentPeriodNumber,
                        10
                    ) + 1
                );


            renderPeriodNumber();


            if (activeTab) {

                loadHistoryData(
                    activeTab
                );
            }


            startTimer();
        }
    </script>
