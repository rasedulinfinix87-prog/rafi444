<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Trade - Win Go</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #020611;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        button {
            -webkit-user-select: none;
            user-select: none;
        }

        /* =========================================================
           MAIN APP
        ========================================================= */

        .app-shell {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% 32%, rgba(17, 52, 91, .18), transparent 30%),
                radial-gradient(circle at 50% 70%, rgba(7, 53, 100, .14), transparent 34%),
                linear-gradient(180deg, #030812 0%, #050b17 50%, #020611 100%);
            border-left: 1px solid #14243a;
            border-right: 1px solid #14243a;
            box-shadow:
                0 0 50px rgba(0,0,0,.75),
                inset 0 0 40px rgba(0,0,0,.45);
        }

        .main-content {
            padding: 9px 10px 105px;
        }

        .main-game-card {
            width: 100%;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: transparent;
            border: 0;
        }

        .game-section {
            min-width: 0;
            position: relative;
        }

        /* =========================================================
           GAME MODE TOP BUTTONS
        ========================================================= */

        .modes-plate {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            padding: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
        }

        .mode-button {
            min-height: 74px;
            padding: 7px 3px;
            border-radius: 18px;
            border: 1px solid #1d3453;
            background:
                linear-gradient(145deg, rgba(17,34,59,.98), rgba(4,13,28,.98));
            color: #dbeafe;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: .2s ease;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.04),
                0 4px 12px rgba(0,0,0,.28);
        }

        .mode-button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                115deg,
                transparent 20%,
                rgba(255,255,255,.05) 50%,
                transparent 80%
            );
            pointer-events: none;
        }

        .mode-button:active {
            transform: scale(.97);
        }

        .mode-button.active-mode {
            border-color: #ff304c;
            background:
                radial-gradient(circle at 50% 20%, rgba(255,42,72,.15), transparent 60%),
                linear-gradient(145deg, #211329, #100a18);
            box-shadow:
                inset 0 0 16px rgba(255,38,67,.13),
                0 0 12px rgba(255,30,65,.15);
        }

        .mode-button.active-mode::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255,54,78,.55);
            border-radius: inherit;
            box-shadow: 0 0 9px rgba(255,39,70,.3);
            pointer-events: none;
        }

        .mode-button:nth-child(2) .custom-clock-icon {
            --clock-color: #ffd63d;
        }

        .mode-button:nth-child(3) .custom-clock-icon {
            --clock-color: #20d7ff;
        }

        .mode-button:nth-child(4) .custom-clock-icon {
            --clock-color: #cf70ff;
        }

        .mode-button .text-\[10\.5px\] {
            color: #dce7f7 !important;
            font-size: 12px !important;
            font-weight: 800 !important;
            margin-top: 0 !important;
            white-space: nowrap;
        }

        .mode-button.active-mode .text-\[10\.5px\] {
            color: #fff !important;
        }

        .custom-clock-icon {
            width: 29px;
            height: 29px;
            border: 3px solid var(--clock-color, #ff5468);
            border-radius: 50%;
            background: transparent;
            position: relative;
            box-shadow:
                0 0 7px color-mix(in srgb, var(--clock-color, #ff5468) 55%, transparent),
                inset 0 0 4px rgba(255,255,255,.08);
        }

        .custom-clock-icon::before {
            content: "";
            position: absolute;
            width: 2px;
            height: 9px;
            left: 11px;
            top: 4px;
            background: var(--clock-color, #ff5468);
            border-radius: 2px;
            transform-origin: bottom center;
            transform: rotate(0deg);
            box-shadow: 0 0 4px var(--clock-color, #ff5468);
        }

        .custom-clock-icon::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 2px;
            left: 11px;
            top: 13px;
            background: var(--clock-color, #ff5468);
            border-radius: 2px;
            transform-origin: left center;
            transform: rotate(20deg);
            box-shadow: 0 0 4px var(--clock-color, #ff5468);
        }

        /* =========================================================
           PERIOD + TIMER
        ========================================================= */

        .period-timer-card {
            min-height: 104px;
            padding: 15px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-radius: 20px;
            border: 1px solid #193554;
            background:
                radial-gradient(circle at 8% 0%, rgba(25,103,176,.16), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(10,119,139,.10), transparent 45%),
                linear-gradient(145deg, #071525, #030914 65%, #061325);
            box-shadow:
                inset 0 0 18px rgba(0,0,0,.45),
                0 5px 16px rgba(0,0,0,.25);
            overflow: hidden;
        }

        .period-timer-card::before {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            top: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #2b6d9e, transparent);
        }

        .period-info {
            flex: 1;
            max-width: 65%;
            padding: 0;
            border: 0;
            background: transparent;
        }

        .period-heading-group {
            display: block;
            width: 100%;
        }

        .period-heading {
            margin: 0 0 8px;
            color: #a7c7ee;
            font-size: 13px;
            line-height: 1;
            letter-spacing: .8px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .card-divider {
            display: none;
        }

        .period-number-display {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .period-digit {
            width: 34px;
            min-width: 0;
            height: 42px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: monospace;
            font-size: 25px;
            font-weight: 900;
            line-height: 1;
            background:
                linear-gradient(180deg, #1688d5 0%, #0753a9 48%, #0b3b83 100%);
            border: 1px solid #1595ff;
            box-shadow:
                inset 0 1px 4px rgba(255,255,255,.25),
                inset 0 -5px 8px rgba(0,0,0,.28),
                0 0 8px rgba(0,136,255,.28);
            text-shadow: 0 0 7px rgba(255,255,255,.4);
            position: relative;
            overflow: hidden;
        }

        .period-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,0,0,.2);
            border-top: 1px solid rgba(255,255,255,.13);
        }

        .timer-area {
            flex-shrink: 0;
            min-width: 132px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-label {
            width: 100%;
            min-height: 0;
            padding: 0;
            margin: 0 0 5px;
            border: 0;
            background: transparent;
            color: #23e9bd;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .3px;
            text-align: center;
            white-space: nowrap;
        }

        .timer-label::before {
            display: none;
        }

        .timer-label.timer-label-danger {
            color: #ff7184;
            background: transparent;
            border: 0;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer {
            min-width: 130px;
            height: 58px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border-radius: 17px;
            border: 2px solid #079c70;
            background:
                radial-gradient(circle at 50% 0%, rgba(0,255,185,.09), transparent 65%),
                #031a18;
            box-shadow:
                inset 0 0 10px rgba(0,255,174,.08),
                0 0 8px rgba(0,200,145,.08);
        }

        .digital-timer::after {
            display: none;
        }

        .timer-digit {
            width: 30px;
            height: 43px;
            border-radius: 6px;
            background:
                linear-gradient(180deg, #22df75, #069447 50%, #056b35);
            border: 1px solid #1ee87a;
            box-shadow:
                inset 0 2px 4px rgba(255,255,255,.18),
                inset 0 -4px 6px rgba(0,0,0,.32),
                0 0 7px rgba(24,220,112,.2);
            font-family: monospace;
            font-size: 25px;
            font-weight: 900;
            color: #fff;
        }

        .timer-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0,0,0,.2);
            border-top: 1px solid rgba(255,255,255,.1);
        }

        .timer-colon {
            color: #36ee91;
            font-size: 24px;
            font-weight: 900;
            padding: 0;
        }

        .digital-timer.timer-danger {
            border-color: #f43f5e;
            background: #260812;
        }

        .digital-timer.timer-danger .timer-digit {
            background: linear-gradient(180deg, #f43f5e, #9f1239);
            border-color: #fb7185;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer.timer-danger .timer-colon {
            color: #fb7185;
        }

        /* =========================================================
           COLOR BET BUTTONS
        ========================================================= */

        .color-bet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .color-bet-button {
            height: 66px;
            border-radius: 19px;
            position: relative;
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            overflow: visible;
            transition: .15s ease;
        }

        .color-bet-button:active {
            transform: scale(.96);
        }

        .green-bet {
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.14), transparent 55%),
                linear-gradient(180deg, #0be26a, #00ad4d);
            border: 2px solid #16ff77;
            box-shadow:
                inset 0 1px 4px rgba(255,255,255,.25),
                0 0 13px rgba(0,255,102,.42);
        }

        .violet-bet {
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.14), transparent 55%),
                linear-gradient(180deg, #c219ff, #7610cf);
            border: 2px solid #d93cff;
            box-shadow:
                inset 0 1px 4px rgba(255,255,255,.25),
                0 0 14px rgba(186,35,255,.4);
        }

        .red-bet {
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.14), transparent 55%),
                linear-gradient(180deg, #ff3737, #cf111d);
            border: 2px solid #ff4e52;
            box-shadow:
                inset 0 1px 4px rgba(255,255,255,.25),
                0 0 14px rgba(255,35,45,.38);
        }

        /* =========================================================
           NUMBER WHEEL
        ========================================================= */

        .number-wheel-section {
            position: relative;
            width: 100%;
            padding: 0 0 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }

        .wheel-wrapper {
            width: min(94vw, 440px);
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-glow {
            position: absolute;
            inset: 5%;
            border-radius: 50%;
            background: transparent;
            box-shadow:
                0 0 35px rgba(0,139,255,.18),
                0 0 70px rgba(0,78,255,.12);
            pointer-events: none;
        }

        .wheel-outer {
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            background:
                conic-gradient(
                    from -90deg,
                    #f8c45a,
                    #fff0a8,
                    #b9781d,
                    #ffdc72,
                    #7a450e,
                    #ffc85b,
                    #fff0a0,
                    #a76a17,
                    #f7c75d
                );
            padding: 12px;
            box-shadow:
                0 0 12px rgba(255,193,64,.55),
                inset 0 0 10px rgba(255,255,255,.55),
                0 10px 22px rgba(0,0,0,.55);
        }

        .wheel-outer::before {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.42);
            pointer-events: none;
        }

        .wheel-face {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background:
                conic-gradient(
                    from -90deg,
                    #8518db 0deg 36deg,
                    #08aa53 36deg 72deg,
                    #e51c25 72deg 108deg,
                    #0bad55 108deg 144deg,
                    #d91d26 144deg 180deg,
                    #8518db 180deg 216deg,
                    #d91d26 216deg 252deg,
                    #0aa852 252deg 288deg,
                    #e21c26 288deg 324deg,
                    #0aa852 324deg 360deg
                );
                box-shadow:
                    inset 0 0 25px rgba(0,0,0,.5),
                    inset 0 0 4px rgba(255,255,255,.35);
            }

        .wheel-face::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                repeating-conic-gradient(
                    from -90deg,
                    transparent 0deg 34.8deg,
                    rgba(255,255,255,.72) 34.8deg 35.3deg,
                    transparent 35.3deg 36deg
                );
            z-index: 5;
            pointer-events: none;
        }

        .wheel-face::after {
            content: "";
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.22);
            box-shadow:
                inset 0 0 15px rgba(0,0,0,.55),
                0 0 7px rgba(255,255,255,.18);
            z-index: 6;
            pointer-events: none;
        }

        .wheel-number {
            position: absolute;
            width: 19%;
            height: 19%;
            transform: translate(-50%, -50%);
            border: 0;
            background: transparent;
            color: #fff;
            font-size: clamp(27px, 8vw, 42px);
            font-weight: 900;
            line-height: 1;
            text-shadow:
                0 2px 2px rgba(0,0,0,.65),
                0 0 5px rgba(255,255,255,.2);
            z-index: 10;
            cursor: pointer;
            padding: 0;
            transition: transform .15s ease, filter .15s ease;
        }

        .wheel-number:active {
            transform: translate(-50%, -50%) scale(.9);
        }

        .wheel-number .wheel-payout {
            display: block;
            margin-top: 4px;
            font-size: clamp(8px, 2vw, 11px);
            font-weight: 700;
            opacity: .85;
        }

        .wheel-number:nth-child(1) {
            left: 50%;
            top: 13%;
        }

        .wheel-number:nth-child(2) {
            left: 73.5%;
            top: 21.5%;
        }

        .wheel-number:nth-child(3) {
            left: 87%;
            top: 39%;
        }

        .wheel-number:nth-child(4) {
            left: 87%;
            top: 61%;
        }

        .wheel-number:nth-child(5) {
            left: 73.5%;
            top: 78.5%;
        }

        .wheel-number:nth-child(6) {
            left: 50%;
            top: 87%;
        }

        .wheel-number:nth-child(7) {
            left: 26.5%;
            top: 78.5%;
        }

        .wheel-number:nth-child(8) {
            left: 13%;
            top: 61%;
        }

        .wheel-number:nth-child(9) {
            left: 13%;
            top: 39%;
        }

        .wheel-number:nth-child(10) {
            left: 26.5%;
            top: 21.5%;
        }

        .wheel-center {
            position: absolute;
            width: 27%;
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 40% 35%, #182637, #060c14 62%, #010308);
            border: 9px solid #d99b2c;
            box-shadow:
                0 0 0 4px #512d0b,
                0 0 0 6px #f0b744,
                inset 0 0 15px rgba(0,0,0,.9),
                0 0 15px rgba(255,190,55,.35);
            z-index: 20;
        }

        .wheel-center::before {
            content: "";
            position: absolute;
            width: 45%;
            height: 45%;
            left: 27.5%;
            top: 27.5%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #ffd66b, #ed8b00 48%, #5d2d00);
            border: 2px solid #ffce59;
            box-shadow:
                inset 2px 2px 5px rgba(255,255,255,.55),
                0 0 8px rgba(255,180,35,.55);
        }

        .wheel-center::after {
            content: "";
            position: absolute;
            inset: 16%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.15);
        }

        /* POINTER */

        .wheel-pointer {
            position: absolute;
            top: -1%;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 68px;
            z-index: 40;
            filter:
                drop-shadow(0 4px 4px rgba(0,0,0,.7))
                drop-shadow(0 0 8px rgba(255,174,0,.5));
        }

        .wheel-pointer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 4px;
            width: 40px;
            height: 55px;
            background:
                linear-gradient(135deg, #fff4b2 0%, #ffbd38 38%, #e47700 100%);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            border: 3px solid #ffcf57;
            box-shadow:
                inset 0 2px 4px rgba(255,255,255,.8);
        }

        .wheel-pointer::after {
            content: "";
            position: absolute;
            top: 10px;
            left: 18px;
            width: 13px;
            height: 27px;
            background: rgba(255,255,255,.72);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }

        /* =========================================================
           BIG / SMALL
        ========================================================= */

        .big-small-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .big-small-button {
            height: 66px;
            border-radius: 19px;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            position: relative;
            cursor: pointer;
            transition: .15s ease;
        }

        .big-small-button:active {
            transform: scale(.96);
        }

        .big-button {
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.12), transparent 55%),
                linear-gradient(180deg, #ffad10, #ed8500);
            border: 2px solid #ffc02d;
            box-shadow:
                inset 0 1px 4px rgba(255,255,255,.28),
                0 0 13px rgba(255,167,0,.34);
        }

        .small-button {
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.13), transparent 55%),
                linear-gradient(180deg, #1988ff, #0754cf);
            border: 2px solid #2798ff;
            box-shadow:
                inset 0 1px 4px rgba(255,255,255,.28),
                0 0 13px rgba(0,122,255,.34);
        }

        /* =========================================================
           OLD NUMBER GRID - HIDDEN BECAUSE WHEEL REPLACES IT
        ========================================================= */

        .legacy-number-grid {
            display: none !important;
        }

        /* =========================================================
           CHIPS / ACTION BAR
        ========================================================= */

        .chips-container {
            min-height: 76px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 9px;
            border-radius: 18px;
            border: 1px solid #1b3048;
            background:
                linear-gradient(145deg, #071426, #030914);
            box-shadow:
                inset 0 0 15px rgba(0,0,0,.35),
                0 5px 12px rgba(0,0,0,.18);
            overflow: hidden;
        }

        .action-group {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
            padding-right: 8px;
            border-right: 1px solid #26364b;
        }

        .action-chip {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #253d5a, #091527 70%);
            border: 1px solid #314a67;
            color: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            position: relative;
            cursor: pointer;
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,.08),
                0 3px 7px rgba(0,0,0,.4);
        }

        .action-chip:active {
            transform: scale(.92);
        }

        .rebet-badge-2x {
            position: absolute;
            right: -4px;
            bottom: 1px;
            padding: 1px 4px;
            border-radius: 5px;
            background: #ffc62d;
            color: #17202b;
            font-size: 9px;
            font-weight: 900;
            border: 1px solid #fff0a0;
        }

        .chips-group {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 7px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .chips-group::-webkit-scrollbar {
            display: none;
        }

        .chip-item {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 12px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,.12);
            box-shadow:
                inset 0 0 0 4px rgba(0,0,0,.18),
                inset 0 2px 5px rgba(255,255,255,.32),
                0 3px 6px rgba(0,0,0,.45);
            transition: .15s ease;
        }

        .chip-item::before {
            content: "";
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,.55);
        }

        .chip-item::after {
            content: attr(data-text);
            position: absolute;
            width: 31px;
            height: 31px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            color: #fff;
            background: inherit;
            border: 1px solid rgba(255,255,255,.45);
            box-shadow: inset 0 2px 4px rgba(255,255,255,.12);
        }

        .chip-item {
            font-size: 0;
        }

        .chip-item.selected-chip {
            transform: scale(1.13);
            border-color: #fff !important;
            box-shadow:
                inset 0 0 0 4px rgba(0,0,0,.16),
                0 0 10px rgba(255,255,255,.48);
        }

        .chip-20 {
            background: #087ed4;
            border-color: #35aaff;
        }

        .chip-50 {
            background: #18a84c;
            border-color: #5df087;
        }

        .chip-100 {
            background: #e21d36;
            border-color: #ff5d6c;
        }

        .chip-500 {
            background: #7f31e4;
            border-color: #b77cff;
        }

        .chip-1k {
            background: #d47d00;
            border-color: #ffb32d;
        }

        .chip-10k {
            background: #9e173d;
            border-color: #e94c77;
        }

        /* =========================================================
           BET BADGE
        ========================================================= */

        .bet-badge {
            position: absolute;
            top: -8px;
            right: -7px;
            min-width: 38px;
            padding: 3px 6px;
            border-radius: 10px;
            background: #ffc21c;
            color: #111827;
            border: 2px solid #fff;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
            text-align: center;
            z-index: 50;
            box-shadow: 0 2px 7px rgba(0,0,0,.65);
        }

        /* =========================================================
           WIN OVERLAY / HIGHLIGHT
        ========================================================= */

        .win-payout-overlay {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(10,194,112,.9);
            color: #fff;
            font-size: 17px;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,.8);
            animation: popWinAmount 2s ease forwards;
        }

        .winning-blink {
            z-index: 60 !important;
            animation: winningBlink .45s ease-in-out 3;
        }

        .win-blink-green {
            --win-glow: rgba(34,255,130,.95);
        }

        .win-blink-red {
            --win-glow: rgba(255,65,95,.95);
        }

        .win-blink-violet {
            --win-glow: rgba(210,130,255,.95);
        }

        .win-blink-number {
            --win-glow: rgba(255,255,255,.95);
        }

        .win-blink-big {
            --win-glow: rgba(255,190,45,.95);
        }

        .win-blink-small {
            --win-glow: rgba(70,160,255,.95);
        }

        @keyframes winningBlink {
            0%, 100% {
                filter: brightness(1);
                box-shadow: 0 0 7px var(--win-glow);
                outline: 2px solid transparent;
            }

            50% {
                filter: brightness(1.5);
                box-shadow:
                    0 0 18px var(--win-glow),
                    0 0 32px var(--win-glow);
                outline: 3px solid var(--win-glow);
            }
        }

        @keyframes popWinAmount {
            0% {
                opacity: 0;
                transform: scale(.75);
            }

            20% {
                opacity: 1;
                transform: scale(1.08);
            }

            80% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1);
            }
        }

        @keyframes dangerPulse {
            0%,100% {
                opacity: 1;
            }

            50% {
                opacity: .65;
            }
        }

        /* =========================================================
           HISTORY / STATISTICS
        ========================================================= */

        .history-panel {
            margin-top: 12px;
            padding: 9px;
            border-radius: 18px;
            border: 1px solid #172d46;
            background:
                linear-gradient(145deg, #061222, #020811);
            box-shadow:
                inset 0 0 15px rgba(0,0,0,.3);
        }

        .history-tabs {
            display: flex;
            gap: 6px;
            padding-bottom: 8px;
            border-bottom: 1px solid #17283c;
        }

        .history-tab {
            flex: 1;
            min-height: 36px;
            border-radius: 9px;
            border: 1px solid #1d3047;
            background: #0a1526;
            color: #8293aa;
            font-size: 10px;
            font-weight: 800;
        }

        .history-tab.active {
            color: #fff;
            background:
                linear-gradient(180deg, #f13a4c, #c4162a);
            border-color: #ff4b5c;
            box-shadow: 0 0 9px rgba(255,42,65,.18);
        }

        .history-content {
            max-height: 290px;
            overflow: auto;
            font-size: 11px;
        }

        .history-table {
            min-width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .history-table th,
        .history-table td {
            padding: 8px 6px;
            text-align: left;
            vertical-align: middle;
        }

        .history-table th {
            color: #71829a;
            font-size: 9px;
        }

        .history-table td {
            border-bottom: 1px solid rgba(30,48,69,.6);
            font-size: 10px;
        }

        .my-history-table {
            min-width: 850px;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .my-history-table th,
        .my-history-table td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #17263a;
            vertical-align: middle;
        }

        .my-history-table th {
            color: #8091a7;
            font-size: 9px;
        }

        .my-history-table td {
            font-size: 10px;
        }

        .result-number {
            width: 27px;
            height: 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #fff;
            font-size: 12px;
            font-weight: 900;

        .trend-grid-container {

            height: 29px;

            align-items: center;
            justify-content: center;
            color: #fff;

            font-weight: 900;

                inset 0 2px 4px rgba(255,255,255,.4),

        /* =========================================================
           BOTTOM BALANCE BAR
        ========================================================= */

        .bottom-fixed-bar {
            position: fixed;
            z-index: 500;
            left: 50%;
            bottom: 8px;
            transform: translateX(-50%);

            align-items: center;
            justify-content: space-between;

                0 7px 25px rgba(0,0,0,.65),

        }

        .bottom-fixed-bar > div {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bottom-fixed-bar > div:first-child::before {
            content: "▣";
            position: absolute;
            margin-left: -37px;
            margin-top: 1px;
            width: 31px;
            height: 31px;

            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #0a1b31;
            border: 1px solid #284663;
            color: #a9d3ff;
            font-size: 16px;
        }

        .bottom-fixed-bar > div:last-child::before {
            content: "●";
            position: absolute;
            margin-left: -37px;
            margin-top: 1px;
            width: 31px;
            height: 31px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #241b06;
            border: 1px solid #624b16;
            color: #ffca3a;
            font-size: 13px;
        }

        #bar-user-balance,
        #bar-total-bet {
            font-size: 16px;
            font-weight: 900;
        }

        #bottom-bar-center-status {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            white-space: nowrap;
        }

        /* =========================================================
           STATUS
        ========================================================= */

        #game-status-text {
            text-align: center;
            padding: 4px;
            color: #8193aa;
            font-size: 9px;
        }

        .animate-zoom-out {
            animation: zoomOutResult 1.5s ease forwards;
        }

        @keyframes zoomOutResult {
            0% {
                transform: scale(1.2);
                opacity: 1;
            }

            80% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(.3);
                opacity: 0;
            }
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 390px) {
            .main-content {
                padding-left: 7px;
                padding-right: 7px;
            }

            .mode-button {
                min-height: 67px;
                border-radius: 15px;
            }

            .period-timer-card {
                padding: 12px 9px;
            }

            .period-digit {
                width: 28px;
                height: 37px;
                font-size: 21px;
            }

            .period-number-display {
                gap: 3px;
            }

            .timer-area {
                min-width: 112px;
            }

            .digital-timer {
                min-width: 112px;
                height: 51px;
                padding: 5px;
            }

            .timer-digit {
                width: 25px;
                height: 38px;
                font-size: 21px;
            }

            .color-bet-button,
            .big-small-button {
                height: 58px;
                font-size: 17px;
            }

            .wheel-wrapper {
                width: 94vw;
            }

            .action-chip {
                width: 42px;
                height: 42px;
            }

            .chip-item {
                width: 45px;
                min-width: 45px;
                height: 45px;
            }

            .chip-item::after {
                width: 28px;
                height: 28px;
            }
        }

        @media (min-width: 501px) {
            .bottom-fixed-bar {
                position: absolute;
                bottom: 10px;
            }
        }
    </style>
</head>

<script>

    let currentUser = null;
    let userProfile = null;

    let selectedGameDuration = 15;
    let currentPeriodNumber = "2026101501";

    let timerSeconds = 15;
    let timerInterval = null;

    let activeTab = 'game-history';
    let selectedChartDuration = 15;

    let selectedChipAmount = 20;

    let lastPlacedBet = null;
    let currentRoundTotalBet = 0;

    let userActiveBets = [];


    /* =========================================================
       INITIALIZE
    ========================================================= */

    document.addEventListener("DOMContentLoaded", async () => {

        renderPeriodNumber();

        currentUser = await requireAuth();

        if (currentUser) {

            await loadUserProfile();

            await ensureCurrentPeriodExists();

            startTimer();

            loadHistoryData('game-history');

            initRealtimeSubscription();
        }

    });


    /* =========================================================
       PERIOD
    ========================================================= */

    async function ensureCurrentPeriodExists() {

        let { data: periodData, error } =
            await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();


        if (!periodData) {

            await supabaseClient
                .from("color_periods")
                .insert([{
                    period_number: currentPeriodNumber,
                    total_green_amount: 0,

                .on(

                    {

    /* =========================================================
       UNDO
    ========================================================= */

    async function undoLastBet() {

        if (timerSeconds <= 5) {

            alert("No More Bet! Undo is disabled.");

            return;
        }


        if (userActiveBets.length === 0) {

            alert("No active bet to undo for this round!");

            return;
        }


        let lastBet = userActiveBets.pop();

        let refundedBalance =
            Number(userProfile.balance) + lastBet.amount;


        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .update({
                    balance: refundedBalance
                })
                .eq("id", currentUser.id);


        if (profileError) {

            alert("Failed to undo bet. Try again.");

            userActiveBets.push(lastBet);

            return;
        }


        userProfile.balance = refundedBalance;

        document.getElementById("bar-user-balance")
            .innerText =
            refundedBalance.toFixed(2);


        currentRoundTotalBet =
            Math.max(
                0,
                currentRoundTotalBet - lastBet.amount
            );


        document.getElementById("bar-total-bet")
            .innerText =
            currentRoundTotalBet.toFixed(2);


        await supabaseClient
            .from("color_game_history")
            .delete()
            .eq("id", lastBet.db_id);


        await updatePeriodAmountsOnUndo(
            lastBet.amount,
            lastBet.target
        );


        updateBetBadgesUI();


        document.getElementById("game-status-text")
            .innerText =
            "Last bet successfully undone.";

    }


    /* =========================================================
       UNDO PERIOD AMOUNT
    ========================================================= */

    async function updatePeriodAmountsOnUndo(
        amount,
        target
    ) {

        let { data: periodData } =
            await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();


        if (periodData) {

            let updateField = {};


            if (target === 'Green') {

                updateField.total_green_amount =
                    Math.max(
                        0,
                        Number(periodData.total_green_amount) - amount
                    );

            }

            else if (target === 'Red') {

                updateField.total_red_amount =
                    Math.max(
                        0,
                        Number(periodData.total_red_amount) - amount
                    );

            }

            else if (target === 'Violet') {

                updateField.total_violet_amount =
                    Math.max(
                        0,
                        Number(periodData.total_violet_amount) - amount
                    );

            }


            await supabaseClient
                .from("color_periods")
                .update(updateField)
                .eq("period_number", currentPeriodNumber);

        }

    }

       REBET
    ========================================================= */

    async function rebetLast() {

        if (timerSeconds <= 5) {

            alert("No More Bet! Rebet is disabled.");

            return;
        }


        if (!lastPlacedBet) {

            alert("No previous bet to rebet!");

            return;
        }


        let doubledAmount =
            lastPlacedBet.amount * 2;


        if (
            doubledAmount >
            Number(userProfile.balance)
        ) {

            alert("Insufficient balance for 2x rebet!");

            return;
        }


        executeBetPlacement(
            lastPlacedBet.target,
            doubledAmount
        );

    }

    /* =========================================================
       BET PLACEMENT
    ========================================================= */

    async function executeBetPlacement(
        target,
        amount
    ) {

        if (amount > Number(userProfile.balance)) {

            alert("Insufficient balance!");

            return;
        }


        let newBalance =
            Number(userProfile.balance) - amount;


        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .update({
                    balance: newBalance
                })
                .eq("id", currentUser.id);


        if (profileError) {

            alert("Failed to place bet. Try again.");

            return;
        }


        userProfile.balance = newBalance;


        document.getElementById("bar-user-balance")
            .innerText =
            newBalance.toFixed(2);


        currentRoundTotalBet += amount;


        document.getElementById("bar-total-bet")
            .innerText =
            currentRoundTotalBet.toFixed(2);


        const {
            data: insertedData,
            error: betInsertError
        } = await supabaseClient
            .from("color_game_history")
            .insert([{
                user_id: currentUser.id,
                period_number: currentPeriodNumber,
                bet_type: target,
                bet_amount: amount,
                status: 'pending'
            }])
            .select();


        if (betInsertError) {

            console.error(
                "Bet history insert error:",
                betInsertError
            );

            alert(
                "Bet history could not be saved. Please contact support."
            );

            return;
        }


        let newDbId =
            insertedData &&
            insertedData[0]
                ? insertedData[0].id
                : null;


        lastPlacedBet = {
            target: target,
            amount: amount
        };


        userActiveBets.push({
            db_id: newDbId,
            target: target,
            amount: amount
        });


        updateBetBadgesUI();


        await updatePeriodAmounts(
            amount,
            target
        );


        document.getElementById("game-status-text")
            .innerText =
            `Successfully placed ৳${amount} on ${target}!`;


        if (activeTab === 'my-history') {
            loadHistoryData('my-history');
        }

    }

                        v.name.includes('David') ||

    function highlightWinningTargets(
        winningColor,
        winningNumber,
        winningBigSmall
    ) {

        clearWinningHighlights();


        const colorClass = {

            Green: 'win-blink-green',

            Red: 'win-blink-red',

            Violet: 'win-blink-violet'

        };


        document
            .querySelectorAll(
                'button[onclick^="placeDirectBet("]'
            )
            .forEach(button => {

                const match =
                    button
                        .getAttribute('onclick')
                        ?.match(
                            /placeDirectBet\(['"]([^'"]+)['"]\)/
                        );


                if (!match) return;


                const target = match[1];

                let highlightClass = '';


                if (target === winningColor) {

                    highlightClass =
                        colorClass[winningColor] || '';

                }

                else if (
                    target ===
                    String(winningNumber)
                ) {

                    highlightClass =
                        'win-blink-number';

                }

                else if (
                    target ===
                    winningBigSmall
                ) {

                    highlightClass =
                        winningBigSmall === 'Big'
                            ? 'win-blink-big'
                            : 'win-blink-small';

                }


                if (highlightClass) {

                    button.classList.add(
                        'winning-blink',
                        highlightClass
                    );


                    button.addEventListener(
                        'animationend',
                        function removeBlink(event) {

                            if (
                                event.animationName !==
                                'winningBlink'
                            ) {
                                return;
                            }


                            button.classList.remove(
                                'winning-blink',
                                'win-blink-green',
                                'win-blink-red',
                                'win-blink-violet',
                                'win-blink-number',
                                'win-blink-big',
                                'win-blink-small'
                            );


                            button.removeEventListener(
                                'animationend',
                                removeBlink
                            );

                        }
                    );

                }

            });

    }


    /* =========================================================
       TIMER
    ========================================================= */

    function startTimer() {

        clearInterval(timerInterval);


        timerSeconds =
            selectedGameDuration;


        const timerElem =
            document.getElementById(
                "countdown-timer"
            );


        const timerLabel =
            document.getElementById(
                "timer-label"
            );


        function updateMainTimer() {

            if (!timerElem) return;


            const min =
                Math.floor(
                    timerSeconds / 60
                );


            const sec =
                timerSeconds % 60;


            const timeText =
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;


            timerElem.innerHTML = `

                <span class="timer-digit">
                    ${timeText[0]}
                </span>

                <span class="timer-digit">
                    ${timeText[1]}
                </span>

                <span class="timer-colon">
                    :
                </span>

                <span class="timer-digit">
                    ${timeText[3]}
                </span>

                <span class="timer-digit">
                    ${timeText[4]}
                </span>

            `;


            if (timerSeconds <= 5) {

                let centerStatusElem =
                    document.getElementById(
                        "bottom-bar-center-status"
                    );


                let statusSpan =
                    centerStatusElem.querySelector(
                        "span"
                    );


                if (
                    statusSpan &&
                    !statusSpan.classList.contains(
                        "animate-zoom-out"
                    )
                ) {

                    statusSpan.classList.add(
                        "animate-zoom-out"
                    );


                    setTimeout(() => {

                        centerStatusElem.innerHTML =
                            "";

                    }, 1500);

                }


                timerElem.classList.add(
                    "timer-danger"
                );


                if (timerLabel) {

                    timerLabel.innerText =
                        "NO MORE BET";

                    timerLabel.classList.add(
                        "timer-label-danger"
                    );

                }


                if (timerSeconds === 5) {

                    playVoiceMessage(
                        "No more bets"
                    );

                }

            }

            else {

                timerElem.classList.remove(
                    "timer-danger"
                );


                if (timerLabel) {

                    timerLabel.innerText =
                        "PLACE YOUR BET";

                    timerLabel.classList.remove(
                        "timer-label-danger"
                    );

                }

            }

        }


        updateMainTimer();


        timerInterval =
            setInterval(() => {

                timerSeconds =
                    Math.max(
                        0,
                        timerSeconds - 1
                    );


                updateMainTimer();


                if (timerSeconds <= 0) {

                    clearInterval(
                        timerInterval
                    );

                    processRoundResult();

                }

            }, 1000);

    }

    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(value) {

        return String(value ?? '')
            .replace(
                /[&<>"']/g,
                char => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[char]
            );

    }


    /* =========================================================
       SAVED RESULT
    ========================================================= */

    function getSavedBetResult(row) {

        let savedResult =
            String(
                row.winning_result || ''
            );


        let resultMatch =
            savedResult.match(
                /(Green|Red|Violet)\s*[-:]\s*(\d)/i
            );


        let color =
            resultMatch
                ? resultMatch[1]
                    .charAt(0)
                    .toUpperCase() +
                  resultMatch[1]
                    .slice(1)
                    .toLowerCase()
                : (
                    row.winning_color || ''
                );


        let number =
            resultMatch
                ? Number(resultMatch[2])
                : (
                    row.winning_number !== null &&
                    row.winning_number !== undefined &&
                    row.winning_number !== ''
                )
                    ? Number(row.winning_number)
                    : null;


        if (
            ![
                'Green',
                'Red',
                'Violet'
            ].includes(color)
        ) {

            color = '';

        }


        let bigSmall =
            number !== null &&
            Number.isFinite(number)
                ? (
                    number >= 5
                        ? 'Big'
                        : 'Small'
                )
                : '';


        let colorClass =
            color === 'Red'
                ? 'result-red'
                : color === 'Green'
                    ? 'result-green'
                    : color === 'Violet'
                        ? 'result-violet'
                        : '';


        return {

            color,

            number,

            bigSmall,

            colorClass,

            hasResult:
                number !== null &&
                Number.isFinite(number) &&
                color !== ''

        };

    }


    /* =========================================================
       DATE
    ========================================================= */

    function formatHistoryDate(dateValue) {

        if (!dateValue) {

            return {
                date: 'N/A',
                time: 'N/A'
            };

        }


        const date =
            new Date(dateValue);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return {
                date: 'N/A',
                time: 'N/A'
            };

        }


        return {

            date:
                date.toLocaleDateString(
                    'en-GB',
                    {
                        timeZone: 'Asia/Dhaka',
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    }
                ),

            time:
                date.toLocaleTimeString(
                    'en-GB',
                    {
                        timeZone: 'Asia/Dhaka',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    }
                )

        };

    }
