                                    : result.color === 'Green'
                                        ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-700'
                                        : 'bg-purple-900/60 text-purple-300 border border-purple-700'
                            }">
                                ${escapeHtml(
                                    result.color.toUpperCase()
                                )}
                            </span>
                          `

                        : `
                            <span class="text-slate-500">
                                —
                            </span>
                          `;


                let bigSmallHtml =
                    result.hasResult

                        ? `
                            <span class="result-badge ${
                                result.bigSmall === 'Big'
                                    ? 'bg-amber-900/60 text-amber-300 border border-amber-700'
                                    : 'bg-blue-900/60 text-blue-300 border border-blue-700'
                            }">
                                ${result.bigSmall.toUpperCase()}
                            </span>
                          `

                        : `
                            <span class="text-slate-500">
                                —
                            </span>
                          `;


                let dateTime =
                    formatHistoryDate(
                        row.created_at
                    );


                html += `

                    <tr>

                        <td class="font-mono text-amber-300">
                            ${escapeHtml(
                                row.period_number ||
                                '—'
                            )}
                        </td>

                        <td class="font-bold text-white">
                            ${escapeHtml(
                                row.bet_type ||
                                '—'
                            )}
                        </td>

                        <td class="font-mono text-slate-200">
                            ৳${Number(
                                row.bet_amount || 0
                            ).toFixed(2)}
                        </td>

                        <td class="font-bold ${statusColor}">
                            ${statusLabel}
                        </td>

                        <td>
                            ${resultNumberHtml}
                        </td>

                        <td>
                            ${resultColorHtml}
                        </td>

                        <td>
                            ${bigSmallHtml}
                        </td>

                        <td class="date-cell">

                            <div>
                                ${escapeHtml(
                                    dateTime.date
                                )}
                            </div>

                            <div class="text-slate-400">
                                ${escapeHtml(
                                    dateTime.time
                                )}
                            </div>

                        </td>

                    </tr>

                `;

            });


            html += `

                        </tbody>

                    </table>

                </div>

                <div class="mt-2.5 p-2.5 rounded-xl bg-transparent border border-slate-800">

                    <p class="text-[9.5px] text-slate-400 leading-relaxed">

                        Result No., Result Color এবং Big/Small দেখানোর জন্য
                        সংশ্লিষ্ট রাউন্ডের ফলাফল ডাটাবেসে সংরক্ষিত থাকতে হবে।

                    </p>

                </div>

            `;


            container.innerHTML =
                html;

        }


        /* =====================================================
           CHART
        ===================================================== */

        else if (type === 'chart') {

            let {
                data,
                error
            } =
                await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq("status", "completed")
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(30);


            let trendBallsHtml = '';

            let bigCount = 0;
            let smallCount = 0;

            let greenCount = 0;
            let redCount = 0;
            let violetCount = 0;


            if (
                data &&
                data.length > 0
            ) {

                data.forEach(row => {

                    let num =
                        Number(
                            row.winning_number
                        );


                    if (num >= 5) {
                        bigCount++;
                    }

                    else {
                        smallCount++;
                    }


                    if (
                        row.winning_color ===
                        'Green'
                    ) {

                        greenCount++;

                    }

                    else if (
                        row.winning_color ===
                        'Red'
                    ) {

                        redCount++;

                    }

                    else if (
                        row.winning_color ===
                        'Violet'
                    ) {

                        violetCount++;

                    }


                    let bgStyle =
                        row.winning_color ===
                            'Red'

                            ? '#e11d48'

                            : row.winning_color ===
                                'Green'

                                ? '#059669'

                                : '#7c3aed';


                    trendBallsHtml += `

                        <div class="trend-ball"
                             style="background:${bgStyle};">

                            ${num}

                        </div>

                    `;

                });

            }

            else {

                trendBallsHtml =
                    `<p class="text-slate-500 text-center py-2">
                        কোনো ডাটা পাওয়া যায়নি
                    </p>`;

            }


            let total =
                (
                    data
                        ? data.length
                        : 0
                ) || 1;


            let bigPct =
                Math.round(
                    (
                        bigCount /
                        total
                    ) * 100
                );


            let smallPct =
                100 - bigPct;


            let greenPct =
                Math.round(
                    (
                        greenCount /
                        total
                    ) * 100
                );


            let redPct =
                Math.round(
                    (
                        redCount /
                        total
                    ) * 100
                );


            let violetPct =
                100 -
                (
                    greenPct +
                    redPct
                );


            if (violetPct < 0) {
                violetPct = 0;
            }


            container.innerHTML = `

                <div class="bg-transparent p-1 space-y-3">

                    <div class="overflow-x-auto pb-1">

                        <div class="trend-grid-container">

                            ${trendBallsHtml}

                        </div>

                    </div>


                    <div class="h-[1px] w-full bg-slate-800"></div>


                    <div class="space-y-2.5">

                        <div>

                            <div class="flex justify-between text-[11px] font-bold mb-1">

                                <span class="text-amber-400">
                                    Big: ${bigPct}%
                                </span>

                                <span class="text-blue-400">
                                    Small: ${smallPct}%
                                </span>

                            </div>


                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex">

                                <div
                                    class="bg-amber-500 h-full"
                                    style="width:${bigPct}%">
                                </div>

                                <div
                                    class="bg-blue-500 h-full"
                                    style="width:${smallPct}%">
                                </div>

                            </div>

                        </div>


                        <div class="pt-1">

                            <div class="flex justify-between text-[10.5px] font-bold mb-1">

                                <span class="text-emerald-400">
                                    Green: ${greenPct}%
                                </span>

                                <span class="text-purple-400">
                                    Violet: ${violetPct}%
                                </span>

                                <span class="text-rose-400">
                                    Red: ${redPct}%
                                </span>

                            </div>


                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex">

                                <div
                                    class="bg-emerald-600 h-full"
                                    style="width:${greenPct}%">
                                </div>

                                <div
                                    class="bg-purple-600 h-full"
                                    style="width:${violetPct}%">
                                </div>

                                <div
                                    class="bg-rose-600 h-full"
                                    style="width:${redPct}%">
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            `;

        }

    }


    /* =========================================================
       UPDATE PERIOD AMOUNTS
    ========================================================= */

    async function updatePeriodAmounts(
        amount,
        target
    ) {

        let {
            data: periodData
        } =
            await supabaseClient
                .from("color_periods")
                .select("*")
                .eq(
                    "period_number",
                    currentPeriodNumber
                )
                .maybeSingle();


        if (!periodData) {

            await supabaseClient
                .from("color_periods")
                .insert([{

                    period_number:
                        currentPeriodNumber,

                    total_green_amount:
                        target === 'Green'
                            ? amount
                            : 0,

                    total_red_amount:
                        target === 'Red'
                            ? amount
                            : 0,

                    total_violet_amount:
                        target === 'Violet'
                            ? amount
                            : 0,

                    status:
                        'pending'

                }]);

        }

        else {

            let updateField = {};


            if (target === 'Green') {

                updateField.total_green_amount =
                    Number(
                        periodData.total_green_amount
                    ) + amount;

            }

            else if (target === 'Red') {

                updateField.total_red_amount =
                    Number(
                        periodData.total_red_amount
                    ) + amount;

            }

            else if (target === 'Violet') {

                updateField.total_violet_amount =
                    Number(
                        periodData.total_violet_amount
                    ) + amount;

            }


            await supabaseClient
                .from("color_periods")
                .update(updateField)
                .eq(
                    "period_number",
                    currentPeriodNumber
                );

        }

    }


    /* =========================================================
       PROCESS ROUND RESULT
    ========================================================= */

    async function processRoundResult() {

        document.getElementById(
            "game-status-text"
        ).innerText =
            "Calculating result...";


        let {
            data: periodData
        } =
            await supabaseClient
                .from("color_periods")
                .select("*")
                .eq(
                    "period_number",
                    currentPeriodNumber
                )
                .maybeSingle();


        if (!periodData) {

            await ensureCurrentPeriodExists();


            let res =
                await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq(
                        "period_number",
                        currentPeriodNumber
                    )
                    .maybeSingle();


            periodData =
                res.data;

        }


        let green =
            periodData
                ? Number(
                    periodData.total_green_amount ||
                    0
                )
                : 0;


        let red =
            periodData
                ? Number(
                    periodData.total_red_amount ||
                    0
                )
                : 0;


        let violet =
            periodData
                ? Number(
                    periodData.total_violet_amount ||
                    0
                )
                : 0;


        let winningColor =
            'Green';


        if (
            green === 0 &&
            red === 0 &&
            violet === 0
        ) {

            const randomColors =
                [
                    'Green',
                    'Red',
                    'Green',
                    'Red',
                    'Violet'
                ];


            winningColor =
                randomColors[
                    Math.floor(
                        Math.random() *
                        randomColors.length
                    )
                ];

        }

        else {

            if (
                green <= red &&
                green <= violet
            ) {

                winningColor =
                    'Green';

            }

            else if (
                red <= green &&
                red <= violet
            ) {

                winningColor =
                    'Red';

            }

            else {

                winningColor =
                    'Violet';

            }

        }


        let numbersMap = {

            Green:
                [1, 3, 7, 9],

            Red:
                [2, 4, 6, 8],

            Violet:
                [0, 5]

        };


        let possibleNums =
            numbersMap[
                winningColor
            ];


        let winningNumber =
            possibleNums[
                Math.floor(
                    Math.random() *
                    possibleNums.length
                )
            ];


        let winningBigSmall =
            winningNumber >= 5
                ? 'Big'
                : 'Small';


        let winningResultString =
            `${winningColor}-${winningNumber}`;


        await supabaseClient
            .from("color_periods")
            .update({

                winning_color:
                    winningColor,

                winning_number:
                    winningNumber,

                status:
                    'completed'

            })
            .eq(
                "period_number",
                currentPeriodNumber
            );


        let {
            data: allBets
        } =
            await supabaseClient
                .from("color_game_history")
                .select("*")
                .eq(
                    "period_number",
                    currentPeriodNumber
                )
                .eq(
                    "status",
                    'pending'
                );


        let userWonAmount = 0;
        let hasUserWon = false;
        let userParticipated = false;

        let userWinsMap = {};


        if (
            allBets &&
            allBets.length > 0
        ) {

            for (
                let bet of allBets
            ) {

                let isWin = false;

                let multiplier = 2;


                if (
                    bet.bet_type ===
                    'Red'
                ) {

                    multiplier = 1.9;

                }

                else if (
                    bet.bet_type ===
                    'Violet'
                ) {

                    multiplier = 4.5;

                }

                else if (
                    bet.bet_type ===
                        'Big' ||
                    bet.bet_type ===
                        'Small'
                ) {

                    multiplier = 1.9;

                }

                else if (
                    !isNaN(
                        bet.bet_type
                    )
                ) {

                    multiplier = 9;

                }


                if (
                    bet.bet_type ===
                    winningColor
                ) {

                    isWin = true;

                }

                else if (
                    bet.bet_type ===
                    String(winningNumber)
                ) {

                    isWin = true;

                }

                else if (
                    bet.bet_type ===
                    winningBigSmall
                ) {

                    isWin = true;

                }


                if (
                    bet.user_id ===
                    currentUser.id
                ) {

                    userParticipated =
                        true;

                }


                if (isWin) {

                    let payoutAmount =
                        bet.bet_amount *
                        multiplier;


                    if (
                        bet.user_id ===
                        currentUser.id
                    ) {

                        userWonAmount +=
                            payoutAmount;


                        hasUserWon =
                            true;


                        let totalTargetWinReturn =
                            bet.bet_amount +
                            payoutAmount;


                        userWinsMap[
                            bet.bet_type
                        ] =
                            (
                                userWinsMap[
                                    bet.bet_type
                                ] || 0
                            ) +
                            totalTargetWinReturn;

                    }


                    await supabaseClient
                        .from("color_game_history")
                        .update({

                            winning_result:
                                winningResultString,

                            payout:
                                payoutAmount,

                            status:
                                'win'

                        })
                        .eq(
                            "id",
                            bet.id
                        );


                    let {
                        data: targetProfile
                    } =
                        await supabaseClient
                            .from("profiles")
                            .select("balance")
                            .eq(
                                "id",
                                bet.user_id
                            )
                            .single();


                    if (targetProfile) {

                        let updatedBal =
                            Number(
                                targetProfile.balance
                            ) +
                            payoutAmount;


                        await supabaseClient
                            .from("profiles")
                            .update({
                                balance:
                                    updatedBal
                            })
                            .eq(
                                "id",
                                bet.user_id
                            );

                    }

                }

                else {

                    await supabaseClient
                        .from("color_game_history")
                        .update({

                            winning_result:
                                winningResultString,

                            payout:
                                0,

                            status:
                                'loss'

                        })
                        .eq(
                            "id",
                            bet.id
                        );

                }

            }

        }


        currentRoundTotalBet = 0;

        userActiveBets = [];

        updateBetBadgesUI();


        document.getElementById(
            "bar-total-bet"
        ).innerText =
            "0.00";


        for (
            let target in userWinsMap
        ) {

            let btn =
                document.getElementById(
                    `btn-${target}`
                );


            if (btn) {

                let overlay =
                    document.createElement(
                        'div'
                    );


                overlay.className =
                    'win-payout-overlay';


                overlay.innerText =
                    `+৳${userWinsMap[target].toFixed(1)}`;


                btn.appendChild(
                    overlay
                );


                setTimeout(() => {

                    overlay.remove();

                }, 2000);

            }

        }


        document.getElementById(
            "game-status-text"
        ).innerText =
            `Result: ${winningResultString} (${winningBigSmall})`;


        highlightWinningTargets(
            winningColor,
            winningNumber,
            winningBigSmall
        );


        await loadUserProfile();


        let centerStatusElem =
            document.getElementById(
                "bottom-bar-center-status"
            );


        if (userParticipated) {

            if (hasUserWon) {

                centerStatusElem.innerHTML =
                    `<span class="text-emerald-400 inline-block">
                        Win ৳${userWonAmount.toFixed(2)}
                    </span>`;


                playVoiceMessage(
                    "congratulation winner"
                );

            }

            else {

                centerStatusElem.innerHTML =
                    `<span class="text-rose-500 inline-block">
                        Lost
                    </span>`;


                playVoiceMessage(
                    "better luck next time"
                );

            }

        }

        else {

            centerStatusElem.innerHTML =
                "";

        }


        currentPeriodNumber =
            String(
                parseInt(
                    currentPeriodNumber,
                    10
                ) + 1
            );


        renderPeriodNumber();


        await ensureCurrentPeriodExists();


        if (activeTab) {

            loadHistoryData(
                activeTab
            );

        }


        startTimer();

    }

</script>
