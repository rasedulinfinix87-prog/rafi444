<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কালার ট্রেডিং গেম</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            color: #ffcc00;
        }
        .balance-box {
            background: #2c2c2c;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .timer-box {
            font-size: 24px;
            color: #00ffcc;
            margin-bottom: 15px;
            background: #252525;
            padding: 10px;
            border-radius: 8px;
        }
        .colors-section {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .color-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .green { background-color: #28a745; }
        .violet { background-color: #6f42c1; }
        .red { background-color: #dc3545; }
        
        .color-btn:active {
            transform: scale(0.95);
        }
        
        .bet-input-box {
            margin-bottom: 20px;
            text-align: left;
        }
        .bet-input-box label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }
        .bet-input-box input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: white;
            font-size: 16px;
        }
        .result-box {
            font-size: 16px;
            padding: 10px;
            background: #2c2c2c;
            border-radius: 6px;
            min-height: 45px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>Color Trading Game</h2>
        
        <div class="balance-box">
            ব্যালেন্স: ৳ <span id="balance">100</span>
        </div>

        <div class="timer-box" id="timer">১০</div>

        <div class="bet-input-box">
            <label for="betAmount">বাতির পরিমাণ (টাকা):</label>
            <input type="number" id="betAmount" value="10" min="1">
        </div>

        <div class="colors-section">
            <button class="color-btn green" onclick="placeBet('green')">Green (2x)</button>
            <button class="color-btn violet" onclick="placeBet('violet')">Violet (4x)</button>
            <button class="color-btn red" onclick="placeBet('red')">Red (2x)</button>
        </div>

        <div class="result-box" id="resultText">
            রঙ বেছে নিন এবং ট্রেড করুন!
        </div>
    </div>

    <script>
        let balance = 100;
        let timeLeft = 10;
        let isTradingActive = true;
        let selectedBet = null;

        const balanceDisplay = document.getElementById('balance');
        const timerDisplay = document.getElementById('timer');
        const resultText = document.getElementById('resultText');
        const betInput = document.getElementById('betAmount');

        // কাউন্টডাউন টাইমার
        function startTimer() {
            let countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    declareResult();
                }
            }, 1000);
        }

        // বাজি ধরার ফাংশন
        function placeBet(color) {
            if (!isTradingActive) {
                resultText.innerText = "ফলাফল ঘোষণা হচ্ছে, একটু অপেক্ষা করুন!";
                return;
            }

            let amount = parseInt(betInput.value);

            if (isNaN(amount) || amount <= 0) {
                alert("দয়া করে সঠিক বাজি পরিমাণ লিখুন!");
                return;
            }

            if (amount > balance) {
                alert("আপনার পর্যাপ্ত ব্যালেন্স নেই!");
                return;
            }

            selectedBet = { color: color, amount: amount };
            balance -= amount;
            balanceDisplay.innerText = balance;
            
            resultText.style.color = "#00ffcc";
            resultText.innerText = `আপনি ${color.toUpperCase()} রঙে ৳${amount} বাজি ধরেছেন। ফলাফলের অপেক্ষা করুন...`;
            isTradingActive = false;
        }

        // ফলাফল ঘোষণা ফাংশন
        function declareResult() {
            const colors = ['green', 'red', 'green', 'red', 'violet']; // গ্রীন ও রেডের সম্ভাবনা বেশি
            const winningColor = colors[Math.floor(Math.random() * colors.length)];

            let message = `বিজয়ী রঙ: ${winningColor.toUpperCase()}! `;

            if (selectedBet) {
                if (selectedBet.color === winningColor) {
                    let winMultiplier = winningColor === 'violet' ? 4 : 2;
                    let winnings = selectedBet.amount * winMultiplier;
                    balance += winnings;
                    message += `অভিনন্দন! আপনি ৳${winnings} জিতেছেন।`;
                    resultText.style.color = "#28a745";
                } else {
                    message += `দুঃখিত, আপনি হেরে গেছেন।`;
                    resultText.style.color = "#dc3545";
                }
            } else {
                message += `আপনি কোনো বাজি ধরেননি।`;
                resultText.style.color = "#ffcc00";
            }

            balanceDisplay.innerText = balance;
            resultText.innerText = message;

            // রিসেট করে আবার গেম শুরু করা
            setTimeout(() => {
                selectedBet = null;
                timeLeft = 10;
                isTradingActive = true;
                timerDisplay.innerText = timeLeft;
                resultText.style.color = "#ffffff";
                resultText.innerText = "নতুন রাউন্ড শুরু হয়েছে! রঙ বেছে নিন।";
                startTimer();
            }, 4000);
        }

        // গেম স্টার্ট
        startTimer();
    </script>

</body>
</html>
