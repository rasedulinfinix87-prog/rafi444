<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trade - Win Go</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(circle at 50% -10%, #243447 0%, #101820 38%, #070c11 78%);
            color: #f8fafc;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button {
            font-family: inherit;
        }

        .app-shell {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background:
                linear-gradient(180deg, #111a21 0%, #0b1218 38%, #071016 100%);
            position: relative;
            overflow-x: hidden;
            padding-bottom: 110px; /* Big/Small কার্ড যেন বটম বারের নিচে ঢাকা না পড়ে, তার জন্য প্যাডিং বাড়ানো হলো */
            box-shadow: 0 0 50px rgba(0,0,0,.45);
        }

        /* =========================
           TOP HEADER
        ========================== */

        .custom-topbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background: linear-gradient(180deg, #111b22, #0a1218);
            border-bottom: 1px solid rgba(255,255,255,.06);
            position: relative;
        }

        .top-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #17232c;
            border: 1px solid #263640;
            color: #cbd5df;
            font-size: 19px;
            cursor: pointer;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 23px;
            font-weight: 950;
            letter-spacing: -.8px;
        }

        .brand-crown {
            color: #f7c933;
            font-size: 29px;
        }

        .brand-text {
            color: #eef3f7;
        }

        .brand-go {
            color: #ffc42f;
        }

        .header-actions {
            display: flex;
            gap: 7px;
            position: relative;
        }

        .top-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: #0d1519;
            border: 1px solid #27363c;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
            min-width: 150px;
        }

        .top-dropdown.show {
            display: flex;
        }

        .top-dropdown button {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 10px 14px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 1px solid rgba(39, 54, 60, 0.4);
            transition: background 0.15s;
        }

        .top-dropdown button:last-child {
            border-bottom: none;
        }

        .top-dropdown button:hover,
        .top-dropdown button.active {
            background: #1a272e;
            color: #f8fafc;
        }

        /* =========================
           POPUP MODAL
        ========================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 430px;
            background: #101a21;
            border-top: 1px solid #27363f;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            animation: slideUpModal 0.3s ease-out;
        }

        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid #1c2931;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 900;
            color: #f8fafc;
        }

        .modal-close-btn {
            background: #18252d;
            border: 1px solid #2d3e48;
            color: #cbd5df;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .modal-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        /* =========================
           MAIN
        ========================== */

        .page-content {
            padding: 13px;
        }

        .section-gap {
            margin-top: 12px;
        }

        /* =========================
           WALLET
        ========================== */

        .wallet-card {
            position: relative;
            padding: 17px;
            border-radius: 22px;
            background:
                linear-gradient(145deg, #17232b, #0d171e 72%);
            border: 1px solid #35434b;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.04),
                0 12px 28px rgba(0,0,0,.24);
        }

        .wallet-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .wallet-symbol {
            width: 65px;
            height: 65px;
            flex: 0 0 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 35% 30%, #ffd95a, #d79b00 58%, #6f4b00);
            color: #fff3ae;
            font-size: 30px;
            box-shadow:
                inset 3px 3px 8px rgba(255,255,255,.25),
                inset -6px -6px 10px rgba(0,0,0,.28),
                0 5px 18px rgba(220,160,0,.16);
        }

        .wallet-info {
            flex: 1;
            min-width: 0;
        }

        .wallet-label {
            color: #9ba9b5;
            font-size: 14px;
            font-weight: 650;
            margin-bottom: 2px;
        }

        .wallet-amount {
            font-size: 30px;
            line-height: 1.05;
            font-weight: 900;
            letter-spacing: -.8px;
            color: #f4f7f9;
            white-space: nowrap;
        }

        .wallet-id {
            margin-top: 7px;
            color: #8998a5;
            font-size: 12px;
        }

        .wallet-refresh {
            width: 47px;
            height: 47px;
            border-radius: 50%;
            border: 1px solid #45545e;
            background: #111c23;
            color: #c9d2d8;
            font-size: 23px;
            flex-shrink: 0;
        }

        .wallet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px;
            margin-top: 17px;
        }

        .wallet-btn {
            height: 53px;
            border-radius: 17px;
            border: 0;
            color: white;
            font-size: 17px;
            font-weight: 850;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
        }

        .wallet-withdraw {
            background: linear-gradient(180deg, #ef3152, #d91f43);
        }

        .wallet-deposit {
            background: linear-gradient(180deg, #10bd62, #09a852);
        }

        /* =========================
           GAME MODES
        ========================== */

        .mode-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .mode-button {
            min-height: 91px;
            padding: 9px 4px;
            border-radius: 17px;
            border: 1px solid #293740;
            background: linear-gradient(160deg, #142029, #0e171e);
            color: #9daab4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            transition: .2s ease;
        }

        .mode-button.active-mode {
            background:
                linear-gradient(160deg, #ffe16b, #eebc24);
            border-color: #f9d65b;
            color: #17130a;
            box-shadow:
                0 7px 18px rgba(238,188,36,.18),
                inset 0 1px 0 rgba(255,255,255,.45);
        }

        .mode-button.active-mode .custom-clock-icon {
            border-color: #805e00;
            background: #111;
        }

        .custom-clock-icon {
            width: 37px;
            height: 37px;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #dfe5e8 55%, #8b989f 100%);
            border: 2px solid #35434b;
            box-shadow:
                inset 0 2px 4px rgba(255,255,255,.45),
                0 3px 6px rgba(0,0,0,.45);
        }

        .custom-clock-icon::before {
            content: "";
            position: absolute;
            width: 3px;
            height: 12px;
            background: #10171c;
            left: 16px;
            top: 5px;
            border-radius: 3px;
            transform-origin: bottom center;
            transform: rotate(0deg);
        }

        .custom-clock-icon::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 3px;
            background: #10171c;
            left: 17px;
            top: 17px;
            border-radius: 3px;
            transform-origin: left center;
            transform: rotate(25deg);
        }

        /* =========================
           ROUND PANEL
        ========================== */

        .round-card {
            border-radius: 23px;
            overflow: hidden;
            background:
                linear-gradient(150deg, #f4cf54, #f1c43a 52%, #e8b528);
            color: #141414;
            box-shadow:
                0 12px 24px rgba(0,0,0,.2),
                inset 0 1px 0 rgba(255,255,255,.4);
        }

        .round-inner {
            padding: 16px;
        }

        .round-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .period-info {
            flex: 1;
            min-width: 0;
        }

        .period-heading {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 12px;
            border-radius: 22px;
            border: 2px solid #171717;
            font-size: 12px;
            font-weight: 850;
            white-space: nowrap;
            background: rgba(255,255,255,.08);
        }

        .period-heading::before {
            content: "◷";
            font-size: 17px;
        }

        .period-number-display {
            display: flex;
            gap: 3px;
            margin-top: 12px;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .period-digit {
            width: 22px;
            height: 31px;
            flex: 0 0 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            background: #171b1f;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            font-weight: 900;
            box-shadow: inset 0 -3px 4px rgba(0,0,0,.45);
        }

        .timer-area {
            min-width: 126px;
            text-align: right;
        }

        .timer-label {
            color: #171717;
            font-size: 10px;
            font-weight: 900;
            margin-bottom: 7px;
            white-space: nowrap;
        }

        .timer-label.timer-label-danger {
            color: #bd1730;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 3px;
        }

        .timer-digit {
            width: 29px;
            height: 39px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            background: #171b1f;
            color: white;
            font-family: monospace;
            font-size: 23px;
            font-weight: 900;
            box-shadow: inset 0 -4px 5px rgba(0,0,0,.45);
        }

        .timer-colon {
            color: #171717;
            font-size: 22px;
            font-weight: 900;
        }

        .timer-danger .timer-digit {
            background: #5e101c;
            border: 1px solid #c52a42;
        }

        .timer-danger .timer-colon {
            color: #9f1730;
        }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .62; }
        }

        /* =========================
           COLOR SELECT
        ========================== */

        .color-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .color-choice {
            height: 58px;
            border: 0;
            border-radius: 15px;
            color: white;
            font-size: 17px;
            font-weight: 900;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.18),
                0 5px 10px rgba(0,0,0,.2);
            position: relative;
            overflow: visible;
        }

        .green-choice {
            background: linear-gradient(180deg, #13c76a, #08a952);
        }

        .violet-choice {
            background: linear-gradient(180deg, #b441f2, #8b28d1);
        }

        .red-choice {
            background: linear-gradient(180deg, #f43b56, #dd1f3e);
        }

        /* =========================
           NUMBER BOARD
        ========================== */

        .number-panel {
            background: #0c151b;
            border: 1px solid #24323a;
            border-radius: 20px;
            padding: 11px;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 9px;
        }

        .number-button {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50% !important;
            border: 0 !important;
            min-width: 0;
            font-size: 25px !important;
            font-weight: 950 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            line-height: 1;
            color: white;
            box-shadow:
                inset 5px 6px 10px rgba(255,255,255,.36),
                inset -7px -8px 12px rgba(0,0,0,.42),
                0 4px 8px rgba(0,0,0,.45);
        }

        .number-button .number-payout {
            display: none;
        }

        .ruby-sphere {
            background:
                radial-gradient(circle at 32% 25%, #ff7b8d 0%, #f12d45 35%, #c71934 65%, #75101e 100%);
            border: 2px solid #ff5368 !important;
        }

        .green-sphere {
            background:
                radial-gradient(circle at 32% 25%, #65f39e 0%, #19d66c 36%, #08a952 65%, #075c32 100%);
            border: 2px solid #52ec94 !important;
        }

        .violet-sphere {
            background:
                radial-gradient(circle at 32% 25%, #e09bff 0%, #b536e8 36%, #8b22c7 65%, #511176 100%);
            border: 2px solid #d576f7 !important;
        }

        /* =========================
           BIG SMALL
        ========================== */

        .size-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            border-radius: 27px;
            background: #18232b;
            border: 1px solid #31404a;
        }

        .size-button {
            height: 58px;
            border: 0;
            font-size: 17px;
            font-weight: 900;
            color: white;
        }

        .big-choice {
            background: linear-gradient(90deg, #ffb51b, #f7a917);
        }

        .small-choice {
            background: linear-gradient(90deg, #3787ec, #438ef1);
        }

        /* =========================
           STATUS
        ========================== */

        #game-status-text {
            padding: 5px 8px;
            text-align: center;
            color: #aab6bd;
            font-size: 10px;
        }

        /* =========================
           HISTORY & MODAL TABLES
        ========================== */

        .history-table {
            min-width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .history-table th,
        .history-table td {
            padding: 9px 7px;
            text-align: center;
            font-size: 10px;
            border-bottom: 1px solid #1c2931;
        }

        .history-table th {
            color: #7f909b;
            font-weight: 800;
        }

        .my-history-table {
            min-width: 850px;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .my-history-table th,
        .my-history-table td {
            padding: 9px 8px;
            text-align: center;
            border-bottom: 1px solid #1c2931;
            vertical-align: middle;
        }

        .my-history-table th {
            color: #7f909b;
            font-size: 10px;
        }

        .my-history-table td {
            font-size: 10px;
        }

        .history-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .result-number {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: 950;
        }

        .result-red {
            background: #df2444;
            border: 2px solid #ff657c;
        }

        .result-green {
            background: #0ba955;
            border: 2px solid #58e99a;
        }

        .result-violet {
            background: #8b2fd1;
            border: 2px solid #d477fa;
        }

        .result-badge {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 20px;
            font-size: 8px;
            font-weight: 900;
        }

        .date-cell {
            line-height: 1.5;
            color: #cbd5e1;
            font-size: 9px !important;
        }

        /* =========================
           TREND
        ========================== */

        .trend-grid-container {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(6, 30px);
            gap: 6px;
            overflow-x: auto;
            padding: 8px;
        }

        .trend-ball {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 950;
            box-shadow:
                inset 2px 2px 5px rgba(255,255,255,.35),
                inset -3px -3px 5px rgba(0,0,0,.35);
        }

        /* =========================
           BET BADGE / WIN
        ========================== */

        .bet-badge {
            position: absolute;
            top: -7px;
            right: -5px;
            background: #ffd039;
            color: #111;
            font-size: 8px;
            font-weight: 950;
            padding: 3px 6px;
            border-radius: 10px;
            border: 2px solid #111b20;
            z-index: 30;
        }

        .win-payout-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8,180,92,.94);
            color: white;
            font-size: 12px;
            font-weight: 950;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: inherit;
            z-index: 40;
            animation: popWinAmount 2s ease forwards;
        }

        @keyframes popWinAmount {
            0% { transform: scale(.8); opacity: 0; }
            20% { transform: scale(1.08); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes zoomOutResult {
            0% { transform: scale(1.2); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(.3); opacity: 0; }
        }

        .animate-zoom-out {
            animation: zoomOutResult 1.5s ease forwards;
        }

        .winning-blink {
            position: relative;
            z-index: 50;
            animation: winningBlink .45s ease-in-out 3;
        }

        .win-blink-green { --win-glow: rgba(34,255,130,.95); }
        .win-blink-red { --win-glow: rgba(255,65,95,.95); }
        .win-blink-violet { --win-glow: rgba(190,130,255,.95); }
        .win-blink-number { --win-glow: rgba(255,255,255,.95); }
        .win-blink-big { --win-glow: rgba(255,190,45,.95); }
        .win-blink-small { --win-glow: rgba(70,160,255,.95); }

        @keyframes winningBlink {
            0%, 100% {
                filter: brightness(1);
                box-shadow: 0 0 5px var(--win-glow, white);
                outline: 2px solid transparent;
            }
            50% {
                filter: brightness(1.45);
                box-shadow:
                    0 0 15px var(--win-glow, white),
                    0 0 28px var(--win-glow, white);
                outline: 2px solid var(--win-glow, white);
            }
        }

        /* =========================
           UPDATED BOTTOM BAR & CLASSIC CHIPS STYLING (MATCHING APP THEME)
        ========================== */

        .bottom-fixed-bar {
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #111a21; /* ফাইলের মূল ডার্ক ব্যাকগ্রাউন্ড কালারের সাথে সামঞ্জস্য রাখা হলো */
            border-top: 1px solid #27353d;
            padding: 8px 15px 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }

        .bottom-bar-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            height: 48px;
        }

        /* Undo Button (Left) */
        .bottom-action-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #18252d;
            border: 1px solid #2d3e48;
            color: #d5dde2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        /* Rebet Button (Right) */
        .bottom-rebet-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #18252d;
            border: 1px solid #2d3e48;
            color: #d5dde2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            position: relative;
            cursor: pointer;
        }

        .rebet-badge-2x {
            position: absolute;
            right: -2px;
            bottom: -2px;
            background: #f7b719;
            color: #111;
            font-size: 7px;
            padding: 1px 3px;
            border-radius: 5px;
            font-weight: 950;
        }

        /* Stacked Chips Display in Center (Exact Image Design with Classic Token Border) */
        .center-chips-stack {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            height: 44px;
            width: 110px;

        .stacked-chip {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }

        .stack-back-1 {
            background: radial-gradient(circle, #f7b733 40%, #fc4a1a 100%);

            opacity: 0.85;
        }

        .stack-front {
            background: radial-gradient(circle, #ff6b6b 40%, #d91f43 100%);
            transform: translateX(0) scale(1.12);
            z-index: 3;
            border: 3.5px dashed #ffffff;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.8), 0 5px 12px rgba(0,0,0,0.6);
        }

        /* Bottom Bar Info Row (Balance & Total Bet) */
        .bottom-bar-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            border-top: 1px solid rgba(255,255,255,0.05);

        }

        .info-box-left, .info-box-right {
            display: flex;
            flex-direction: column;
        }

        .info-title {
            color: #9ba9b5;
            font-size: 9px;

            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 14px;
            font-family: monospace;
            font-weight: 900;
        }

        #bottom-bar-center-status {
            font-size: 10px;
            white-space: nowrap;
        }

        /* Chip Selection Popup Modal (2nd Image Style) */
        .chips-popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 250;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(3px);
        }

        .chips-popup-overlay.show {
            display: flex;
        }

        .chips-popup-content {
            width: 100%;
            max-width: 430px;
            background: #111a21;
            border-top: 2px solid #27353d;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 15px 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            animation: slideUpModal 0.25s ease-out;
        }

        .popup-chips-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 320px;
            justify-items: center;
        }

        .popup-chip-item {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            position: relative;
            border: 3.5px dashed #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .popup-chip-item.selected-chip {

            border-color: #fff !important;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 6px 15px rgba(0,0,0,0.6);

        /* =========================

        @media (max-width: 360px) {

<script>
    let currentUser = null;
    let userProfile = null;
    let selectedGameDuration = 15;
    let currentPeriodNumber = "2026101501";
    let timerSeconds = 15;
    let timerInterval = null;

    let activeModalTab = 'game-history';
    let selectedChartDuration = 15;
    let selectedChipAmount = 20;
    let lastPlacedBet = null;
    let currentRoundTotalBet = 0;
    let userActiveBets = [];

    function toggleTopMenu() {
        const menu = document.getElementById('top-dropdown-menu');
        if (menu) menu.classList.toggle('show');
    }

    window.addEventListener('click', function(e) {
        if (!e.target.closest('.header-actions') && !e.target.closest('.top-icon')) {
            const menu = document.getElementById('top-dropdown-menu');
            if (menu && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        }
    });

    // Modal Control Functions
    function openModal(tabName) {
        activeModalTab = tabName;
        const modal = document.getElementById('custom-popup-modal');
        const titleElem = document.getElementById('modal-title-text');

        if (tabName === 'game-history') {
            titleElem.innerText = 'Game History';
        } else if (tabName === 'my-history') {
            titleElem.innerText = 'My Bet History';
        } else if (tabName === 'chart') {
            titleElem.innerText = 'Statistics & Percentages';
        }

        modal.classList.add('show');
        loadHistoryData(tabName);
    }

    function closeModal() {
        const modal = document.getElementById('custom-popup-modal');
        modal.classList.remove('show');
    }

    // Chips Popup Control Functions
    function openChipsPopup() {
        const popup = document.getElementById('chips-popup-modal');
        if (popup) popup.classList.add('show');
    }

    function closeChipsPopup() {
        const popup = document.getElementById('chips-popup-modal');
        if (popup) popup.classList.remove('show');
    }

    function closeChipsPopupOnOutside(e) {
        if (e.target.id === 'chips-popup-modal') {
            closeChipsPopup();
        }
    }

    function selectChipFromPopup(amount, element) {
        selectedChipAmount = amount;

        document.querySelectorAll('.popup-chip-item')
            .forEach(el => el.classList.remove('selected-chip'));

        element.classList.add('selected-chip');

        let labelElem = document.getElementById('active-stack-chip-label');
        if (labelElem) {
            let displayVal = amount >= 1000 ? (amount / 1000) + 'K' : amount;
            labelElem.innerText = displayVal;
        }

        let frontChip = document.querySelector('.stack-front');
        if (frontChip) {
            frontChip.className = "stacked-chip stack-front";
            if (amount === 20) frontChip.style.background = "radial-gradient(circle, #ff6b6b 40%, #d91f43 100%)";
            else if (amount === 50) frontChip.style.background = "radial-gradient(circle, #38ef7d 40%, #11998e 100%)";
            else if (amount === 100) frontChip.style.background = "radial-gradient(circle, #f7b733 40%, #fc4a1a 100%)";
            else if (amount === 500) frontChip.style.background = "radial-gradient(circle, #a8ff78 40%, #78ffd6 100%)";
            else if (amount === 1000) frontChip.style.background = "radial-gradient(circle, #4facfe 40%, #00f2fe 100%)";
            else if (amount === 10000) frontChip.style.background = "radial-gradient(circle, #c471f5 40%, #fa71cd 100%)";
        }

        setTimeout(() => {
            closeChipsPopup();
        }, 200);
    }

    document.addEventListener("DOMContentLoaded", async () => {
        renderPeriodNumber();

        currentUser = await requireAuth();

        if (currentUser) {
            await loadUserProfile();
            await ensureCurrentPeriodExists();
            startTimer();
            initRealtimeSubscription();
        }
    });

    async function ensureCurrentPeriodExists() {
        let { data: periodData, error } = await supabaseClient
            .from("color_periods")
            .select("*")
            .eq("period_number", currentPeriodNumber)
            .maybeSingle();

        if (!periodData) {
            await supabaseClient.from("color_periods").insert([{
                period_number: currentPeriodNumber,
                total_green_amount: 0,
                total_red_amount: 0,
                total_violet_amount: 0,
                status: 'pending'
            }]);
        }
    }

    function initRealtimeSubscription() {
        if (typeof supabaseClient !== 'undefined' && supabaseClient.channel) {
            supabaseClient
                .channel('public:color_periods_changes')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'color_periods'
                }, payload => {
                    if (payload.new && payload.new.status === 'completed') {
                        const modal = document.getElementById('custom-popup-modal');
                        if (modal && modal.classList.contains('show') && activeModalTab) {
                            loadHistoryData(activeModalTab);
                        }
                    }
                })
                .subscribe();
        }

        setInterval(() => {
            const modal = document.getElementById('custom-popup-modal');
            if (modal && modal.classList.contains('show') && activeModalTab &&
                (activeModalTab === 'chart' || activeModalTab === 'game-history')) {
                loadHistoryData(activeModalTab);
            }
        }, 5000);
    }

    async function undoLastBet() {
        if (timerSeconds <= 5) {
            alert("No More Bet! Undo is disabled.");
            return;
        }

        if (userActiveBets.length === 0) {
            alert("No active bet to undo for this round!");
            return;
        }

        let lastBet = userActiveBets.pop();

        let refundedBalance =
            Number(userProfile.balance) + lastBet.amount;

        const { error: profileError } = await supabaseClient
            .from("profiles")
            .update({ balance: refundedBalance })
            .eq("id", currentUser.id);

        if (profileError) {
            alert("Failed to undo bet. Try again.");
            userActiveBets.push(lastBet);
            return;
        }

        userProfile.balance = refundedBalance;

        let bal = refundedBalance.toFixed(2);

        document.getElementById("bar-user-balance").innerText = bal;

        const walletBalance = document.getElementById("wallet-main-balance");
        if (walletBalance) {
            walletBalance.innerText = bal;
        }

        currentRoundTotalBet =
            Math.max(0, currentRoundTotalBet - lastBet.amount);

        document.getElementById("bar-total-bet").innerText =
            currentRoundTotalBet.toFixed(2);

        await supabaseClient
            .from("color_game_history")
            .delete()
            .eq("id", lastBet.db_id);

        await updatePeriodAmountsOnUndo(
            lastBet.amount,
            lastBet.target
        );

        updateBetBadgesUI();

        document.getElementById("game-status-text").innerText =
            "Last bet successfully undone.";
    }

    async function updatePeriodAmountsOnUndo(amount, target) {
        let { data: periodData } = await supabaseClient
            .from("color_periods")
            .select("*")
            .eq("period_number", currentPeriodNumber)
            .maybeSingle();

        if (periodData) {
            let updateField = {};

            if (target === 'Green') {
                updateField.total_green_amount =
                    Math.max(
                        0,
                        Number(periodData.total_green_amount) - amount
                    );
            } else if (target === 'Red') {
                updateField.total_red_amount =
                    Math.max(
                        0,
                        Number(periodData.total_red_amount) - amount
                    );
            } else if (target === 'Violet') {
                updateField.total_violet_amount =
                    Math.max(
                        0,
                        Number(periodData.total_violet_amount) - amount
                    );
            }

            await supabaseClient
                .from("color_periods")
                .update(updateField)
                .eq("period_number", currentPeriodNumber);
        }
    }

    async function rebetLast() {
        if (timerSeconds <= 5) {
            alert("No More Bet! Rebet is disabled.");
            return;
        }

        if (!lastPlacedBet) {
            alert("No previous bet to rebet!");
            return;
        }

        let doubledAmount = lastPlacedBet.amount * 2;

        if (doubledAmount > Number(userProfile.balance)) {
            alert("Insufficient balance for 2x rebet!");
            return;
        }

        executeBetPlacement(
            lastPlacedBet.target,
            doubledAmount
        );
    }

    function placeDirectBet(target) {
        if (timerSeconds <= 5) {
            document.getElementById("game-status-text").innerText =
                "No More Bet! Please wait for the next round.";
            return;
        }

        executeBetPlacement(
            target,
            selectedChipAmount
        );
    }

    async function executeBetPlacement(target, amount) {
        if (amount > Number(userProfile.balance)) {
            alert("Insufficient balance!");
            return;
        }

        let newBalance =
            Number(userProfile.balance) - amount;

        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .update({ balance: newBalance })
                .eq("id", currentUser.id);

        if (profileError) {
            alert("Failed to place bet. Try again.");
            return;
        }

        userProfile.balance = newBalance;

        let bal = newBalance.toFixed(2);

        document.getElementById("bar-user-balance").innerText =
            bal;

        const walletBalance =

            utterance.rate = 0.9;
            utterance.pitch = 0.4;

                        v.name.includes('David') ||
                        v.name.includes('Mark') ||

    function highlightWinningTargets(
        winningColor,
        winningNumber,
        winningBigSmall
    ) {
        clearWinningHighlights();

        const colorClass = {
            Green: 'win-blink-green',
            Red: 'win-blink-red',
            Violet: 'win-blink-violet'
        };

        document.querySelectorAll(
            'button[onclick^="placeDirectBet("]'
        ).forEach(button => {

            const match =
                button
                    .getAttribute('onclick')
                    ?.match(
                        /placeDirectBet\(['"]([^'"]+)['"]\)/
                    );

            if (!match) return;

            const target = match[1];

            let highlightClass = '';

            if (target === winningColor) {
                highlightClass =
                    colorClass[winningColor] || '';
            } else if (
                target === String(winningNumber)
            ) {
                highlightClass =
                    'win-blink-number';
            } else if (
                target === winningBigSmall
            ) {
                highlightClass =
                    winningBigSmall === 'Big'
                        ? 'win-blink-big'
                        : 'win-blink-small';
            }

            if (highlightClass) {
                button.classList.add(
                    'winning-blink',
                    highlightClass
                );

                button.addEventListener(
                    'animationend',
                    function removeBlink(event) {
                        if (
                            event.animationName !==
                            'winningBlink'
                        ) return;

                        button.classList.remove(
                            'winning-blink',
                            'win-blink-green',
                            'win-blink-red',
                            'win-blink-violet',
                            'win-blink-number',
                            'win-blink-big',
                            'win-blink-small'
                        );

                        button.removeEventListener(
                            'animationend',
                            removeBlink
                        );
                    }
                );
            }
        });

    function startTimer() {
        clearInterval(timerInterval);

        timerSeconds =
            selectedGameDuration;

        const timerElem =
            document.getElementById(
                "countdown-timer"
            );

        const timerLabel =
            document.getElementById(
                "timer-label"
            );

        function updateMainTimer() {
            if (!timerElem) return;

            const min =
                Math.floor(timerSeconds / 60);

            const sec =
                timerSeconds % 60;

            const timeText =
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            timerElem.innerHTML = `
                <span class="timer-digit">${timeText[0]}</span>
                <span class="timer-digit">${timeText[1]}</span>
                <span class="timer-colon">:</span>
                <span class="timer-digit">${timeText[3]}</span>
                <span class="timer-digit">${timeText[4]}</span>
            `;

            if (timerSeconds <= 5) {

                let centerStatusElem =
                    document.getElementById(
                        "bottom-bar-center-status"
                    );

                let statusSpan =
                    centerStatusElem.querySelector(
                        "span"
                    );

                if (
                    statusSpan &&
                    !statusSpan.classList.contains(
                        "animate-zoom-out"
                    )
                ) {
                    statusSpan.classList.add(
                        "animate-zoom-out"
                    );

                    setTimeout(() => {
                        centerStatusElem.innerHTML =
                            "";
                    }, 1500);
                }

                timerElem.classList.add(
                    "timer-danger"
                );

                if (timerLabel) {
                    timerLabel.innerText =
                        "NO MORE BET";

                    timerLabel.classList.add(
                        "timer-label-danger"
                    );
                }

                if (timerSeconds === 5) {
                    playVoiceMessage(
                        "No more bets"
                    );
                }

            } else {

                timerElem.classList.remove(
                    "timer-danger"
                );

                if (timerLabel) {
                    timerLabel.innerText =
                        "PLACE YOUR BET";

                    timerLabel.classList.remove(
                        "timer-label-danger"
                    );
                }
            }
        }

        updateMainTimer();

        timerInterval =
            setInterval(() => {

                timerSeconds =
                    Math.max(
                        0,
                        timerSeconds - 1
                    );

                updateMainTimer();

                if (timerSeconds <= 0) {
                    clearInterval(
                        timerInterval
                    );

                    processRoundResult();
                }

            }, 1000);
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
    }

    function getSavedBetResult(row) {
        let savedResult =
            String(row.winning_result || '');

        let resultMatch =
            savedResult.match(
                /(Green|Red|Violet)\s*[-:]\s*(\d)/i
            );

        let color =
            resultMatch
                ? resultMatch[1].charAt(0).toUpperCase() +
                  resultMatch[1].slice(1).toLowerCase()
                : (row.winning_color || '');

        let number =
            resultMatch
                ? Number(resultMatch[2])
                : (
                    row.winning_number !== null &&
                    row.winning_number !== undefined &&
                    row.winning_number !== ''
                )
                    ? Number(row.winning_number)
                    : null;

        if (
            ![
                'Green',
                'Red',
                'Violet'
            ].includes(color)
        ) {
            color = '';
        }

        let bigSmall =
            number !== null &&
            Number.isFinite(number)
                ? (number >= 5 ? 'Big' : 'Small')
                : '';

        let colorClass =
            color === 'Red'
                ? 'result-red'
                : color === 'Green'
                    ? 'result-green'
                    : color === 'Violet'
                        ? 'result-violet'
                        : '';

        return {
            color,
            number,
            bigSmall,
            colorClass,
            hasResult:
                number !== null &&
                Number.isFinite(number) &&
                color !== ''
        };
    }

    function formatHistoryDate(dateValue) {
        if (!dateValue) {
            return {
                date: 'N/A',
                time: 'N/A'
            };
        }

        const date =
            new Date(dateValue);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return {
                date: 'N/A',
                time: 'N/A'
            };
        }

        return {
            date:
                date.toLocaleDateString(
                    'en-GB',
                    {
                        timeZone:
                            'Asia/Dhaka',
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    }
                ),

            time:
                date.toLocaleTimeString(
                    'en-GB',
                    {
                        timeZone:
                            'Asia/Dhaka',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    }
                )
        };
    }

    async function updatePeriodAmounts(amount, target) {
        let {
            data: periodData
        } = await supabaseClient
            .from("color_periods")
            .select("*")
            .eq(
                "period_number",
                currentPeriodNumber
            )
            .maybeSingle();

        if (!periodData) {

            await supabaseClient
                .from("color_periods")
                .insert([{
                    period_number:
                        currentPeriodNumber,

                    total_green_amount:
                        target === 'Green'
                            ? amount
                            : 0,

                    total_red_amount:
                        target === 'Red'
                            ? amount
                            : 0,

                    total_violet_amount:
                        target === 'Violet'
                            ? amount
                            : 0,

                    status: 'pending'
                }]);

        } else {

            let updateField = {};

            if (target === 'Green') {

                updateField.total_green_amount =
                    Number(
                        periodData.total_green_amount
                    ) + amount;

            } else if (target === 'Red') {

                updateField.total_red_amount =
                    Number(
                        periodData.total_red_amount
                    ) + amount;

            } else if (target === 'Violet') {

                updateField.total_violet_amount =
                    Number(
                        periodData.total_violet_amount
                    ) + amount;
            }

            await supabaseClient
                .from("color_periods")
                .update(updateField)
                .eq(
                    "period_number",
                    currentPeriodNumber
                );
        }
    }

        } = await supabaseClient

            )

                await supabaseClient
                    .from("color_periods")

                    .maybeSingle();

            periodData =
                res.data;
        }

        let green =
            periodData
                ? Number(
                    periodData.total_green_amount || 0
                )
                : 0;

        let red =
            periodData
                ? Number(
                    periodData.total_red_amount || 0
                )
                : 0;

        let violet =
            periodData
                ? Number(
                    periodData.total_violet_amount || 0
                )
                : 0;

        let winningColor =
            'Green';

        if (
            green === 0 &&
            red === 0 &&
            violet === 0
        ) {

            const randomColors = [
                'Green',
                'Red',
                'Green',
                'Red',
                'Violet'
            ];

            winningColor =
                randomColors[
                    Math.floor(
                        Math.random() *
                        randomColors.length
                    )
                ];

        } else {

            if (
                green <= red &&
                green <= violet
            ) {

                winningColor =
                    'Green';

            } else if (
                red <= green &&
                red <= violet
            ) {

                winningColor =
                    'Red';

            } else {

                winningColor =
                    'Violet';
            }
        }

        let numbersMap = {
            Green: [1, 3, 7, 9],
            Red: [2, 4, 6, 8],
            Violet: [0, 5]
        };

        let possibleNums =
            numbersMap[winningColor];

        let winningNumber =
            possibleNums[
                Math.floor(
                    Math.random() *
                    possibleNums.length
                )
            ];

        let winningBigSmall =
            winningNumber >= 5
                ? 'Big'
                : 'Small';

        let winningResultString =
            `${winningColor}-${winningNumber}`;

        await supabaseClient
            .from("color_periods")
            .update({
                winning_color:
                    winningColor,

                winning_number:
                    winningNumber,

                status:
                    'completed'
            })
            .eq(
                "period_number",
                currentPeriodNumber
            );

        let {
            data: allBets
        } = await supabaseClient
            .from("color_game_history")
            .select("*")
            .eq(
                "period_number",
                currentPeriodNumber
            )
            .eq(
                "status",
                'pending'
            );

        let userWonAmount = 0;
        let hasUserWon = false;
        let userParticipated = false;
        let userWinsMap = {};

        if (
            allBets &&
            allBets.length > 0
        ) {

            for (
                let bet of allBets
            ) {

                let isWin = false;
                let multiplier = 2;

                if (
                    bet.bet_type ===
                    'Red'
                ) {
                    multiplier = 1.9;

                } else if (
                    bet.bet_type ===
                    'Violet'
                ) {
                    multiplier = 4.5;

                } else if (
                    bet.bet_type === 'Big' ||
                    bet.bet_type === 'Small'
                ) {
                    multiplier = 1.9;

                } else if (
                    !isNaN(
                        bet.bet_type
                    )
                ) {
                    multiplier = 9;
                }

                if (
                    bet.bet_type ===
                    winningColor
                ) {
                    isWin = true;

                } else if (
                    bet.bet_type ===
                    String(winningNumber)
                ) {
                    isWin = true;

                } else if (
                    bet.bet_type ===
                    winningBigSmall
                ) {
                    isWin = true;
                }

                if (
                    bet.user_id ===
                    currentUser.id
                ) {
                    userParticipated =
                        true;
                }

                if (isWin) {

                    let payoutAmount =
                        bet.bet_amount *
                        multiplier;

                    if (
                        bet.user_id ===
                        currentUser.id
                    ) {

                        userWonAmount +=
                            payoutAmount;

                        hasUserWon =
                            true;

                        let totalTargetWinReturn =
                            bet.bet_amount +
                            payoutAmount;

                        userWinsMap[
                            bet.bet_type
                        ] =
                            (
                                userWinsMap[
                                    bet.bet_type
                                ] || 0
                            ) +
                            totalTargetWinReturn;
                    }

                    await supabaseClient
                        .from(
                            "color_game_history"
                        )
                        .update({
                            winning_result:
                                winningResultString,

                            payout:
                                payoutAmount,

                            status:
                                'win'
                        })
                        .eq(
                            "id",
                            bet.id
                        );

                    let {
                        data: targetProfile
                    } =
                        await supabaseClient
                            .from("profiles")
                            .select(
                                "balance"
                            )
                            .eq(
                                "id",
                                bet.user_id
                            )
                            .single();

                    if (targetProfile) {

                        let updatedBal =
                            Number(
                                targetProfile.balance
                            ) +
                            payoutAmount;

                        await supabaseClient
                            .from("profiles")
                            .update({
                                balance:
                                    updatedBal
                            })
                            .eq(
                                "id",
                                bet.user_id
                            );
                    }

                } else {

                    await supabaseClient
                        .from(
                            "color_game_history"
                        )
                        .update({
                            winning_result:
                                winningResultString,

                            payout:
                                0,

                            status:
                                'loss'
                        })
                        .eq(
                            "id",
                            bet.id
                        );
                }
            }
        }

        currentRoundTotalBet = 0;

        userActiveBets = [];

        updateBetBadgesUI();

        document.getElementById(
            "bar-total-bet"
        ).innerText = "0.00";

        for (
            let target in userWinsMap
        ) {

            let btn =
                document.getElementById(
                    `btn-${target}`
                );

            if (btn) {

                let overlay =
                    document.createElement(
                        'div'
                    );

                overlay.className =
                    'win-payout-overlay';

                overlay.innerText =
                    `+৳${userWinsMap[target].toFixed(1)}`;

                btn.appendChild(
                    overlay
                );

                setTimeout(
                    () => overlay.remove(),
                    2000
                );
            }
        }

        document.getElementById(
            "game-status-text"
        ).innerText =
            `Result: ${winningResultString} (${winningBigSmall})`;

        highlightWinningTargets(
            winningColor,
            winningNumber,
            winningBigSmall
        );

        await loadUserProfile();

        let centerStatusElem =
            document.getElementById(
                "bottom-bar-center-status"
            );

        if (userParticipated) {

            if (hasUserWon) {

                centerStatusElem.innerHTML =
                    `<span class="text-emerald-400 inline-block">
                        Win ৳${userWonAmount.toFixed(2)}
                    </span>`;

                playVoiceMessage(
                    "congratulation winner"
                );

            } else {

                centerStatusElem.innerHTML =
                    `<span class="text-rose-500 inline-block">
                        Lost
                    </span>`;

                playVoiceMessage(
                    "better luck next time"
                );
            }

        } else {

            centerStatusElem.innerHTML =
                "";
        }

        currentPeriodNumber =
            String(
                parseInt(
                    currentPeriodNumber,
                    10
                ) + 1
            );

        renderPeriodNumber();

        await ensureCurrentPeriodExists();

        const modal = document.getElementById('custom-popup-modal');
        if (modal && modal.classList.contains('show') && activeModalTab) {
            loadHistoryData(activeModalTab);
        }

        startTimer();
    }
</script>

</body>
</html>
