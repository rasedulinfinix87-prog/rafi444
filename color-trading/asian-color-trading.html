<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Trade - Win Go</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{background:radial-gradient(circle at 50% -10%,#243447 0%,#101820 38%,#070c11 78%);color:#f8fafc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font-family:inherit;touch-action:manipulation}
.app-shell{width:100%;max-width:430px;min-height:100vh;margin:auto;background:linear-gradient(180deg,#111a21,#0b1218 38%,#071016);position:relative;overflow-x:hidden;padding-bottom:120px;box-shadow:0 0 50px #0007}
.custom-topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:linear-gradient(180deg,#111b22,#0a1218);border-bottom:1px solid #ffffff0f;position:relative}
.top-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#17232c;border:1px solid #263640;color:#cbd5df;font-size:19px}
.brand{display:flex;align-items:center;gap:7px;font-size:23px;font-weight:950;letter-spacing:-.8px}.brand-crown{color:#f7c933;font-size:29px}.brand-text{color:#eef3f7}.brand-go{color:#ffc42f}
.header-actions{display:flex;gap:7px;position:relative}.top-dropdown{position:absolute;top:50px;right:0;background:#0d1519;border:1px solid #27363c;border-radius:12px;box-shadow:0 5px 20px #0009;display:none;flex-direction:column;overflow:hidden;z-index:100;min-width:150px}.top-dropdown.show{display:flex}.top-dropdown button{background:transparent;border:0;color:#cbd5e1;padding:10px 14px;text-align:left;font-size:12px;font-weight:700;border-bottom:1px solid #27363c66}.top-dropdown button:last-child{border-bottom:0}.top-dropdown button:hover,.top-dropdown button.active{background:#1a272e;color:#fff}
.modal-overlay,.chips-popup-overlay{position:fixed;inset:0;background:#000b;z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}.modal-overlay.show,.chips-popup-overlay.show{display:flex}
.modal-content,.chips-popup-content{width:100%;max-width:430px;background:#101a21;border-top:1px solid #27363f;border-radius:24px 24px 0 0;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 -10px 30px #0008;animation:slideUpModal .3s ease-out}.chips-popup-content{padding:18px 15px 26px;align-items:center;gap:15px;max-height:none}
@keyframes slideUpModal{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #1c2931}.modal-title{font-size:15px;font-weight:900}.modal-close-btn{background:#18252d;border:1px solid #2d3e48;color:#cbd5df;width:32px;height:32px;border-radius:50%}.modal-body{padding:15px;overflow-y:auto;flex:1}
.page-content{padding:13px}.section-gap{margin-top:12px}
.wallet-card{padding:17px;border-radius:22px;background:linear-gradient(145deg,#17232b,#0d171e 72%);border:1px solid #35434b;box-shadow:inset 0 1px #ffffff0a,0 12px 28px #0003}.wallet-top{display:flex;align-items:center;gap:14px}.wallet-symbol{width:65px;height:65px;flex:0 0 65px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#ffd95a,#d79b00 58%,#6f4b00);color:#fff3ae;font-size:30px;box-shadow:inset 3px 3px 8px #fff4,inset -6px -6px 10px #0005,0 5px 18px #dca00029}.wallet-info{flex:1;min-width:0}.wallet-label{color:#9ba9b5;font-size:14px;font-weight:650}.wallet-amount{font-size:30px;line-height:1.05;font-weight:900;letter-spacing:-.8px;white-space:nowrap}.wallet-id{margin-top:7px;color:#8998a5;font-size:12px}.wallet-refresh{width:47px;height:47px;border-radius:50%;border:1px solid #45545e;background:#111c23;color:#c9d2d8;font-size:23px}.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:17px}.wallet-btn{height:53px;border:0;border-radius:17px;color:#fff;font-size:17px;font-weight:850}.wallet-withdraw{background:linear-gradient(#ef3152,#d91f43)}.wallet-deposit{background:linear-gradient(#10bd62,#09a852)}
.mode-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mode-button{min-height:91px;padding:9px 4px;border-radius:17px;border:1px solid #293740;background:linear-gradient(160deg,#142029,#0e171e);color:#9daab4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.mode-button.active-mode{background:linear-gradient(160deg,#ffe16b,#eebc24);border-color:#f9d65b;color:#17130a;box-shadow:0 7px 18px #eebc2430,inset 0 1px #fff7}.custom-clock-icon{width:37px;height:37px;border-radius:50%;position:relative;background:radial-gradient(circle,#dfe5e8 55%,#8b989f);border:2px solid #35434b;box-shadow:inset 0 2px 4px #fff7,0 3px 6px #0007}.custom-clock-icon:before{content:"";position:absolute;width:3px;height:12px;background:#10171c;left:16px;top:5px;border-radius:3px}.custom-clock-icon:after{content:"";position:absolute;width:10px;height:3px;background:#10171c;left:17px;top:17px;border-radius:3px;transform:rotate(25deg);transform-origin:left}
.round-card{border-radius:23px;overflow:hidden;background:linear-gradient(150deg,#f4cf54,#f1c43a 52%,#e8b528);color:#141414;box-shadow:0 12px 24px #0003,inset 0 1px #fff7}.round-inner{padding:16px}.round-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.period-info{flex:1;min-width:0}.period-heading{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:22px;border:2px solid #171717;font-size:12px;font-weight:850;white-space:nowrap}.period-heading:before{content:"◷";font-size:17px}.period-number-display{display:flex;gap:3px;margin-top:12px;overflow:hidden}.period-digit{width:22px;height:31px;flex:0 0 22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:#171b1f;color:#fff;font-family:monospace;font-size:13px;font-weight:900;box-shadow:inset 0 -3px 4px #0007}.timer-area{min-width:126px;text-align:right}.timer-label{color:#171717;font-size:10px;font-weight:900;margin-bottom:7px;white-space:nowrap}.timer-label-danger{color:#bd1730!important;animation:dangerPulse 1s infinite}.digital-timer{display:flex;justify-content:flex-end;align-items:center;gap:3px}.timer-digit{width:29px;height:39px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:#171b1f;color:#fff;font-family:monospace;font-size:23px;font-weight:900;box-shadow:inset 0 -4px 5px #0007}.timer-colon{color:#171717;font-size:22px;font-weight:900}.timer-danger .timer-digit{background:#5e101c;border:1px solid #c52a42}.timer-danger .timer-colon{color:#9f1730}@keyframes dangerPulse{50%{opacity:.62}}
.color-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.color-choice{height:58px;border:0;border-radius:15px;color:#fff;font-size:17px;font-weight:900;box-shadow:inset 0 1px #ffffff30,0 5px 10px #0003;position:relative}.green-choice{background:linear-gradient(#13c76a,#08a952)}.violet-choice{background:linear-gradient(#b441f2,#8b28d1)}.red-choice{background:linear-gradient(#f43b56,#dd1f3e)}
.number-panel{background:#0c151b;border:1px solid #24323a;border-radius:20px;padding:11px}.number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.number-button{width:100%;aspect-ratio:1;border-radius:50%!important;border:0!important;font-size:25px!important;font-weight:950!important;display:flex;align-items:center;justify-content:center;position:relative;line-height:1;color:#fff;box-shadow:inset 5px 6px 10px #fff6,inset -7px -8px 12px #0006,0 4px 8px #0007}.number-payout{display:none}.ruby-sphere{background:radial-gradient(circle at 32% 25%,#ff7b8d,#f12d45 35%,#c71934 65%,#75101e);border:2px solid #ff5368!important}.green-sphere{background:radial-gradient(circle at 32% 25%,#65f39e,#19d66c 36%,#08a952 65%,#075c32);border:2px solid #52ec94!important}.violet-sphere{background:radial-gradient(circle at 32% 25%,#e09bff,#b536e8 36%,#8b22c7 65%,#511176);border:2px solid #d576f7!important}
.size-row{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border-radius:27px;background:#18232b;border:1px solid #31404a}.size-button{height:58px;border:0;font-size:17px;font-weight:900;color:#fff}.big-choice{background:linear-gradient(90deg,#ffb51b,#f7a917)}.small-choice{background:linear-gradient(90deg,#3787ec,#438ef1)}#game-status-text{padding:5px 8px;text-align:center;color:#aab6bd;font-size:10px}
.history-table,.my-history-table{border-collapse:collapse;white-space:nowrap}.history-table{min-width:100%}.history-table th,.history-table td{padding:9px 7px;text-align:center;font-size:10px;border-bottom:1px solid #1c2931}.history-table th,.my-history-table th{color:#7f909b;font-weight:800}.my-history-table{min-width:850px}.my-history-table th,.my-history-table td{padding:9px 8px;text-align:center;border-bottom:1px solid #1c2931;vertical-align:middle}.my-history-table th,.my-history-table td{font-size:10px}.history-scroll{width:100%;overflow:auto;-webkit-overflow-scrolling:touch}.result-number{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:12px;font-weight:950}.result-red{background:#df2444;border:2px solid #ff657c}.result-green{background:#0ba955;border:2px solid #58e99a}.result-violet{background:#8b2fd1;border:2px solid #d477fa}.result-badge{display:inline-block;padding:4px 7px;border-radius:20px;font-size:8px;font-weight:900}.date-cell{line-height:1.5;color:#cbd5e1;font-size:9px!important}
.trend-grid-container{display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,30px);gap:6px;overflow-x:auto;padding:8px}.trend-ball{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:950;box-shadow:inset 2px 2px 5px #fff6,inset -3px -3px 5px #0006}
.bet-badge{position:absolute;top:-7px;right:-5px;background:#ffd039;color:#111;font-size:8px;font-weight:950;padding:3px 6px;border-radius:10px;border:2px solid #111b20;z-index:30}.win-payout-overlay{position:absolute;inset:0;background:#08b45cef;color:#fff;font-size:12px;font-weight:950;display:flex;align-items:center;justify-content:center;border-radius:inherit;z-index:40;animation:popWinAmount 2s ease forwards}@keyframes popWinAmount{0%{transform:scale(.8);opacity:0}20%{transform:scale(1.08);opacity:1}80%{transform:scale(1);opacity:1}100%{opacity:0}}
@keyframes zoomOutResult{0%{transform:scale(1.2);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(.3);opacity:0}}.animate-zoom-out{animation:zoomOutResult 1.5s ease forwards}.winning-blink{position:relative;z-index:50;animation:winningBlink .45s ease-in-out 3}.win-blink-green{--win-glow:#22ff82}.win-blink-red{--win-glow:#ff415f}.win-blink-violet{--win-glow:#be82ff}.win-blink-number{--win-glow:#fff}.win-blink-big{--win-glow:#ffbe2d}.win-blink-small{--win-glow:#46a0ff}@keyframes winningBlink{50%{filter:brightness(1.45);box-shadow:0 0 15px var(--win-glow),0 0 28px var(--win-glow);outline:2px solid var(--win-glow)}}

/* ===================== REAL CASINO CHIP DESIGN ===================== */
:root{--chip-red:#ed3b48;--chip-green:#159653;--chip-gold:#f5a623;--chip-lime:#8fe65d;--chip-blue:#278bd8;--chip-purple:#b34bd4;--chip-ivory:#f7f3e8}
.bottom-fixed-bar{position:fixed;z-index:100;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;background:linear-gradient(180deg,#111a21,#0b141b);border-top:1px solid #27353d;padding:9px 15px 10px;display:flex;flex-direction:column;gap:7px;box-shadow:0 -8px 28px #000a}
.bottom-bar-top-row{height:52px;display:flex;align-items:center;justify-content:space-between;position:relative}.bottom-action-btn,.bottom-rebet-btn{width:44px;height:44px;border-radius:12px;background:#18252d;border:1px solid #2d3e48;color:#d5dde2;display:flex;align-items:center;justify-content:center;font-size:18px}.bottom-rebet-btn{position:relative}.rebet-badge-2x{position:absolute;right:-2px;bottom:-2px;background:#f7b719;color:#111;font-size:7px;padding:1px 3px;border-radius:5px;font-weight:950}
.center-chips-stack{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;cursor:pointer;height:50px;width:132px}.stacked-chip{--chip-color:var(--chip-red);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:950;position:absolute;border:0;isolation:isolate;overflow:hidden;background:var(--chip-color);box-shadow:0 5px 12px #0009,inset 0 2px 3px #fff5,inset 0 -3px 4px #0005;transition:.25s}.stacked-chip:before,.popup-chip-item:before{content:"";position:absolute;inset:1px;border-radius:50%;background:repeating-conic-gradient(from 0deg,#f9f5eb 0deg 9deg,transparent 9deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 66%,#000 67%);mask:radial-gradient(circle,transparent 0 66%,#000 67%);z-index:0}.stacked-chip:after,.popup-chip-item:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #fff6;box-shadow:inset 0 1px 3px #0005,0 1px 2px #fff2;z-index:0}.stacked-chip{font-family:Georgia,serif;text-shadow:0 1px 2px #0008}.stacked-chip>*{position:relative;z-index:2}.stack-back-1{--chip-color:var(--chip-gold);transform:translateX(-27px) scale(.86);z-index:1}.stack-back-2{--chip-color:var(--chip-blue);transform:translateX(27px) scale(.86);z-index:1}.stack-front{--chip-color:var(--chip-red);transform:scale(1.08);z-index:3}.stack-front .chip-value{position:relative;z-index:2}
.bottom-bar-info-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;border-top:1px solid #ffffff0d;padding-top:6px}.info-box-left,.info-box-right{display:flex;flex-direction:column}.info-title{color:#9ba9b5;font-size:9px;text-transform:uppercase;letter-spacing:.5px}.info-value{font-size:14px;font-family:monospace;font-weight:900}#bottom-bar-center-status{font-size:10px;white-space:nowrap}

/* Popup chips: larger casino tokens with segmented outer edge */
.popup-chips-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;width:100%;max-width:330px;justify-items:center}.popup-chip-item{--chip-color:var(--chip-red);width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-size:17px;font-weight:950;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;background:var(--chip-color);border:0;box-shadow:0 8px 18px #0008,inset 0 3px 5px #fff5,inset 0 -5px 7px #0006;transition:transform .18s,filter .18s}.popup-chip-item:before{inset:1px;background:repeating-conic-gradient(from 0deg,#faf7ed 0deg 9deg,transparent 9deg 30deg);-webkit-mask:radial-gradient(circle,transparent 0 65%,#000 66%);mask:radial-gradient(circle,transparent 0 65%,#000 66%)}.popup-chip-item:after{inset:12px;border:2px solid #ffffff66;box-shadow:inset 0 2px 5px #0006,0 1px 2px #fff3}.popup-chip-item.selected-chip{transform:scale(1.1);filter:brightness(1.12);box-shadow:0 0 18px #fff8,0 8px 18px #0009,inset 0 3px 5px #fff5,inset 0 -5px 7px #0006;z-index:10}.popup-chip-item span{position:relative;z-index:2;text-shadow:0 2px 3px #0009}.chip-20{--chip-color:#ed3b48}.chip-50{--chip-color:#159653}.chip-100{--chip-color:#f5a623}.chip-500{--chip-color:#8fe65d;color:#10150e!important;text-shadow:0 1px 2px #fff8!important}.chip-1k{--chip-color:#278bd8}.chip-10k{--chip-color:#b34bd4}
@media(max-width:360px){.page-content{padding:9px}.wallet-amount{font-size:25px}.wallet-symbol{width:57px;height:57px;flex-basis:57px}.mode-button{min-height:82px}.timer-digit{width:25px;height:36px;font-size:20px}.number-grid{gap:7px}.number-button{font-size:22px!important}.popup-chip-item{width:68px;height:68px;font-size:15px}}
</style>
</head>

<body>
<div class="app-shell">

<div class="custom-topbar">
  <div class="top-icon" onclick="toggleTopMenu()">☰</div>
  <div class="brand"><span class="brand-crown">♛</span><span class="brand-text">COLOR <span class="brand-go">GO</span></span></div>
  <div class="header-actions">
    <div class="top-icon" onclick="openModal('game-history')" title="Bet History">📊</div>
    <div class="top-icon" onclick="openModal('chart')" title="Statistics">📈</div>
    <div id="top-dropdown-menu" class="top-dropdown">
      <button onclick="openModal('game-history');toggleTopMenu()">Game History</button>
      <button onclick="openModal('my-history');toggleTopMenu()">My History</button>
      <button onclick="openModal('chart');toggleTopMenu()">Statistics</button>
    </div>
  </div>
</div>

<main class="page-content">
<section class="wallet-card">
  <div class="wallet-top">
    <div class="wallet-symbol">▣</div>
    <div class="wallet-info">
      <div class="wallet-label">Wallet Balance</div>
      <div class="wallet-amount">৳<span id="wallet-main-balance">0.00</span></div>
      <div class="wallet-id">ID: <span id="wallet-user-id">892736281</span></div>
    </div>
    <button class="wallet-refresh" onclick="loadUserProfile()">↻</button>
  </div>
  <div class="wallet-actions">
    <button class="wallet-btn wallet-withdraw">▱ Withdraw</button>
    <button class="wallet-btn wallet-deposit">⊕ Deposit</button>
  </div>
</section>

<section class="section-gap">
<div class="mode-strip">
  <button onclick="changeGameMode(15,'15s')" id="mode-15s" class="mode-button active-mode"><div class="custom-clock-icon"></div><div id="text-15s" class="text-[10.5px] font-bold text-white">Win 15s</div></button>
  <button onclick="changeGameMode(30,'30s')" id="mode-30s" class="mode-button"><div class="custom-clock-icon"></div><div id="text-30s" class="text-[10.5px] font-bold text-amber-400">Win 30s</div></button>
  <button onclick="changeGameMode(60,'1m')" id="mode-1m" class="mode-button"><div class="custom-clock-icon"></div><div id="text-1m" class="text-[10.5px] font-bold text-amber-400">Win 1m</div></button>
  <button onclick="changeGameMode(300,'5m')" id="mode-5m" class="mode-button"><div class="custom-clock-icon"></div><div id="text-5m" class="text-[10.5px] font-bold text-amber-400">Win 5m</div></button>
</div>

<div class="round-card section-gap"><div class="round-inner"><div class="round-top">
  <div class="period-info">
    <div class="period-heading">Period: <span id="period-short-label">Current</span></div>
    <p id="period-number" class="period-number-display" aria-label="Period Number"></p>
  </div>
  <div class="timer-area">
    <p id="timer-label" class="timer-label">PLACE YOUR BET</p>
    <div id="countdown-timer" class="digital-timer"><span class="timer-digit">0</span><span class="timer-digit">0</span><span class="timer-colon">:</span><span class="timer-digit">1</span><span class="timer-digit">5</span></div>
  </div>
</div></div></div>

<div class="color-row section-gap">
  <button onclick="placeDirectBet('Green')" id="btn-Green" class="color-choice green-choice">Green</button>
  <button onclick="placeDirectBet('Violet')" id="btn-Violet" class="color-choice violet-choice">Violet</button>
  <button onclick="placeDirectBet('Red')" id="btn-Red" class="color-choice red-choice">Red</button>
</div>

<div class="number-panel section-gap"><div class="number-grid">
  <button onclick="placeDirectBet('0')" id="btn-0" class="number-button violet-sphere relative"><span>0</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('1')" id="btn-1" class="number-button green-sphere relative"><span>1</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('2')" id="btn-2" class="number-button ruby-sphere relative"><span>2</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('3')" id="btn-3" class="number-button green-sphere relative"><span>3</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('4')" id="btn-4" class="number-button ruby-sphere relative"><span>4</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('5')" id="btn-5" class="number-button violet-sphere relative"><span>5</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('6')" id="btn-6" class="number-button ruby-sphere relative"><span>6</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('7')" id="btn-7" class="number-button green-sphere relative"><span>7</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('8')" id="btn-8" class="number-button ruby-sphere relative"><span>8</span><span class="number-payout">(9x)</span></button>
  <button onclick="placeDirectBet('9')" id="btn-9" class="number-button green-sphere relative"><span>9</span><span class="number-payout">(9x)</span></button>
</div></div>

<div class="size-row section-gap">
  <button onclick="placeDirectBet('Big')" id="btn-Big" class="size-button big-choice relative">Big</button>
  <button onclick="placeDirectBet('Small')" id="btn-Small" class="size-button small-choice relative">Small</button>
</div>
<div id="game-status-text" class="hidden" aria-live="polite">Place your bet before timer ends...</div>
</section>
</main>

<div id="custom-popup-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header"><span id="modal-title-text" class="modal-title">History & Statistics</span><button class="modal-close-btn" onclick="closeModal()">✕</button></div>
    <div id="modal-body-content" class="modal-body"><p class="text-center text-slate-500 py-3">Loading...</p></div>
  </div>
</div>

<div id="chips-popup-modal" class="chips-popup-overlay" onclick="closeChipsPopupOnOutside(event)">
  <div class="chips-popup-content">
    <div class="popup-chips-grid">
      <div onclick="selectChipFromPopup(20,this)" class="popup-chip-item chip-20 selected-chip"><span>20</span></div>

<script>
let currentUser=null,userProfile=null,selectedGameDuration=15,currentPeriodNumber="2026101501",timerSeconds=15,timerInterval=null;
let activeModalTab='game-history',selectedChartDuration=15,selectedChipAmount=20,lastPlacedBet=null,currentRoundTotalBet=0,userActiveBets=[];

function toggleTopMenu(){const m=document.getElementById('top-dropdown-menu');if(m)m.classList.toggle('show')}
window.addEventListener('click',e=>{if(!e.target.closest('.header-actions')&&!e.target.closest('.top-icon')){const m=document.getElementById('top-dropdown-menu');if(m)m.classList.remove('show')}});

function openModal(tabName){
 activeModalTab=tabName;const modal=document.getElementById('custom-popup-modal'),title=document.getElementById('modal-title-text');
 title.innerText=tabName==='game-history'?'Game History':tabName==='my-history'?'My Bet History':'Statistics & Percentages';
 modal.classList.add('show');loadHistoryData(tabName)
}
function closeModal(){document.getElementById('custom-popup-modal').classList.remove('show')}

function closeChipsPopup(){document.getElementById('chips-popup-modal').classList.remove('show')}

function selectChipFromPopup(amount,element){
 selectedChipAmount=amount;
 document.querySelectorAll('.popup-chip-item').forEach(el=>el.classList.remove('selected-chip'));
 element.classList.add('selected-chip');
 const label=document.getElementById('active-stack-chip-label');
 if(label){const displayVal=amount>=1000?(amount/1000)+'K':amount;label.querySelector('.chip-value').innerText=displayVal}
 const front=document.querySelector('.stack-front');
 if(front){
   const colors={20:'#ed3b48',50:'#159653',100:'#f5a623',500:'#8fe65d',1000:'#278bd8',10000:'#b34bd4'};
   front.style.setProperty('--chip-color',colors[amount]||'#ed3b48');
 }

}

document.addEventListener("DOMContentLoaded",async()=>{
 renderPeriodNumber();currentUser=await requireAuth();
 if(currentUser){await loadUserProfile();await ensureCurrentPeriodExists();startTimer();initRealtimeSubscription()}
});

async function ensureCurrentPeriodExists(){
 let {data:periodData}=await supabaseClient.from("color_periods").select("*").eq("period_number",currentPeriodNumber).maybeSingle();
 if(!periodData)await supabaseClient.from("color_periods").insert([{period_number:currentPeriodNumber,total_green_amount:0,total_red_amount:0,total_violet_amount:0,status:'pending'}])
}
function initRealtimeSubscription(){
 if(typeof supabaseClient!=='undefined'&&supabaseClient.channel){
  supabaseClient.channel('public:color_periods_changes').on('postgres_changes',{event:'UPDATE',schema:'public',table:'color_periods'},payload=>{
   if(payload.new&&payload.new.status==='completed'){const modal=document.getElementById('custom-popup-modal');if(modal&&modal.classList.contains('show')&&activeModalTab)loadHistoryData(activeModalTab)}
  }).subscribe()
 }
 setInterval(()=>{const modal=document.getElementById('custom-popup-modal');if(modal&&modal.classList.contains('show')&&activeModalTab&&(activeModalTab==='chart'||activeModalTab==='game-history'))loadHistoryData(activeModalTab)},5000)
}

async function undoLastBet(){
 if(timerSeconds<=5)return alert("No More Bet! Undo is disabled.");
 if(!userActiveBets.length)return alert("No active bet to undo for this round!");
 const lastBet=userActiveBets.pop(),refundedBalance=Number(userProfile.balance)+lastBet.amount;
 const {error:profileError}=await supabaseClient.from("profiles").update({balance:refundedBalance}).eq("id",currentUser.id);
 if(profileError){alert("Failed to undo bet. Try again.");userActiveBets.push(lastBet);return}
 userProfile.balance=refundedBalance;const bal=refundedBalance.toFixed(2);
 document.getElementById("bar-user-balance").innerText=bal;document.getElementById("wallet-main-balance").innerText=bal;
 currentRoundTotalBet=Math.max(0,currentRoundTotalBet-lastBet.amount);document.getElementById("bar-total-bet").innerText=currentRoundTotalBet.toFixed(2);
 await supabaseClient.from("color_game_history").delete().eq("id",lastBet.db_id);await updatePeriodAmountsOnUndo(lastBet.amount,lastBet.target);updateBetBadgesUI();
 document.getElementById("game-status-text").innerText="Last bet successfully undone."
}
async function updatePeriodAmountsOnUndo(amount,target){
 let {data:periodData}=await supabaseClient.from("color_periods").select("*").eq("period_number",currentPeriodNumber).maybeSingle();
 if(periodData){let f={};if(target==='Green')f.total_green_amount=Math.max(0,Number(periodData.total_green_amount)-amount);else if(target==='Red')f.total_red_amount=Math.max(0,Number(periodData.total_red_amount)-amount);else if(target==='Violet')f.total_violet_amount=Math.max(0,Number(periodData.total_violet_amount)-amount);await supabaseClient.from("color_periods").update(f).eq("period_number",currentPeriodNumber)}
}
async function rebetLast(){
 if(timerSeconds<=5)return alert("No More Bet! Rebet is disabled.");
 if(!lastPlacedBet)return alert("No previous bet to rebet!");
 const doubledAmount=lastPlacedBet.amount*2;if(doubledAmount>Number(userProfile.balance))return alert("Insufficient balance for 2x rebet!");
 executeBetPlacement(lastPlacedBet.target,doubledAmount)
}
function placeDirectBet(target){
 if(timerSeconds<=5){document.getElementById("game-status-text").innerText="No More Bet! Please wait for the next round.";return}
 executeBetPlacement(target,selectedChipAmount)
}
async function executeBetPlacement(target,amount){
 if(amount>Number(userProfile.balance))return alert("Insufficient balance!");
 const newBalance=Number(userProfile.balance)-amount;
 const {error:profileError}=await supabaseClient.from("profiles").update({balance:newBalance}).eq("id",currentUser.id);
 if(profileError)return alert("Failed to place bet. Try again.");
 userProfile.balance=newBalance;const bal=newBalance.toFixed(2);
 document.getElementById("bar-user-balance").innerText=bal;document.getElementById("wallet-main-balance").innerText=bal;
 currentRoundTotalBet+=amount;document.getElementById("bar-total-bet").innerText=currentRoundTotalBet.toFixed(2);
 const {data:insertedData,error:betInsertError}=await supabaseClient.from("color_game_history").insert([{user_id:currentUser.id,period_number:currentPeriodNumber,bet_type:target,bet_amount:amount,status:'pending'}]).select();
 if(betInsertError){console.error("Bet history insert error:",betInsertError);alert("Bet history could not be saved. Please contact support.");return}
 const newDbId=insertedData&&insertedData[0]?insertedData[0].id:null;
 lastPlacedBet={target,amount};userActiveBets.push({db_id:newDbId,target,amount});updateBetBadgesUI();await updatePeriodAmounts(amount,target);
 document.getElementById("game-status-text").innerText=`Successfully placed ৳${amount} on ${target}!`;
 const modal=document.getElementById('custom-popup-modal');if(modal&&modal.classList.contains('show')&&activeModalTab==='my-history')loadHistoryData('my-history')
}
function updateBetBadgesUI(){
 document.querySelectorAll('.bet-badge').forEach(el=>el.remove());let targetTotals={};
 userActiveBets.forEach(bet=>targetTotals[bet.target]=(targetTotals[bet.target]||0)+bet.amount);
 for(let target in targetTotals){const btn=document.getElementById(`btn-${target}`);if(btn){const badge=document.createElement('span');badge.className='bet-badge';badge.innerText=`৳${targetTotals[target]}`;btn.appendChild(badge)}}
}
function playVoiceMessage(text){
 if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;u.pitch=.4;const voices=window.speechSynthesis.getVoices();const male=voices.find(v=>v.lang.includes('en')&&(v.name.includes('Male')||v.name.includes('David')||v.name.includes('Mark')||v.name.includes('Google UK English Male')));if(male)u.voice=male;window.speechSynthesis.speak(u)}
}
async function loadUserProfile(){
 userProfile=await getUserProfile(currentUser.id);if(userProfile){const bal=Number(userProfile.balance).toFixed(2);document.getElementById("bar-user-balance").innerText=bal;document.getElementById("wallet-main-balance").innerText=bal;const id=document.getElementById("wallet-user-id");if(id)id.innerText=currentUser.id?String(currentUser.id).slice(-9):"892736281"}
}
async function changeGameMode(duration,modeKey){
 selectedGameDuration=duration;timerSeconds=duration;currentRoundTotalBet=0;userActiveBets=[];updateBetBadgesUI();document.getElementById("bar-total-bet").innerText="0.00";document.getElementById("bottom-bar-center-status").innerHTML="";
 ['15s','30s','1m','5m'].forEach(key=>{const btn=document.getElementById(`mode-${key}`),txt=document.getElementById(`text-${key}`);if(key===modeKey){btn.className="mode-button active-mode";txt.className="text-[10.5px] font-bold text-white"}else{btn.className="mode-button";txt.className="text-[10.5px] font-bold text-amber-400"}});
 await ensureCurrentPeriodExists();startTimer()
}
function renderPeriodNumber(){const el=document.getElementById("period-number");if(!el)return;el.innerHTML=[...String(currentPeriodNumber)].map(d=>`<span class="period-digit">${d}</span>`).join("")}
function clearWinningHighlights(){document.querySelectorAll('.winning-blink').forEach(b=>b.classList.remove('winning-blink','win-blink-green','win-blink-red','win-blink-violet','win-blink-number','win-blink-big','win-blink-small'))}
function highlightWinningTargets(winningColor,winningNumber,winningBigSmall){
 clearWinningHighlights();const colorClass={Green:'win-blink-green',Red:'win-blink-red',Violet:'win-blink-violet'};
 document.querySelectorAll('button[onclick^="placeDirectBet("]').forEach(button=>{
  const match=button.getAttribute('onclick')?.match(/placeDirectBet\(['"]([^'"]+)['"]\)/);if(!match)return;const target=match[1];let hc='';
  if(target===winningColor)hc=colorClass[winningColor]||'';else if(target===String(winningNumber))hc='win-blink-number';else if(target===winningBigSmall)hc=winningBigSmall==='Big'?'win-blink-big':'win-blink-small';
  if(hc){button.classList.add('winning-blink',hc);button.addEventListener('animationend',function rm(e){if(e.animationName!=='winningBlink')return;button.classList.remove('winning-blink','win-blink-green','win-blink-red','win-blink-violet','win-blink-number','win-blink-big','win-blink-small');button.removeEventListener('animationend',rm)})}
 })
}
function startTimer(){
 clearInterval(timerInterval);timerSeconds=selectedGameDuration;const timerElem=document.getElementById("countdown-timer"),timerLabel=document.getElementById("timer-label");
 function updateMainTimer(){
  const min=Math.floor(timerSeconds/60),sec=timerSeconds%60,timeText=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  timerElem.innerHTML=`<span class="timer-digit">${timeText[0]}</span><span class="timer-digit">${timeText[1]}</span><span class="timer-colon">:</span><span class="timer-digit">${timeText[3]}</span><span class="timer-digit">${timeText[4]}</span>`;
  if(timerSeconds<=5){const center=document.getElementById("bottom-bar-center-status"),s=center.querySelector("span");if(s&&!s.classList.contains("animate-zoom-out")){s.classList.add("animate-zoom-out");setTimeout(()=>center.innerHTML="",1500)}timerElem.classList.add("timer-danger");timerLabel.innerText="NO MORE BET";timerLabel.classList.add("timer-label-danger");if(timerSeconds===5)playVoiceMessage("No more bets")}
  else{timerElem.classList.remove("timer-danger");timerLabel.innerText="PLACE YOUR BET";timerLabel.classList.remove("timer-label-danger")}
 }
 updateMainTimer();timerInterval=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);updateMainTimer();if(timerSeconds<=0){clearInterval(timerInterval);processRoundResult()}},1000)
}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getSavedBetResult(row){
 const saved=String(row.winning_result||''),m=saved.match(/(Green|Red|Violet)\s*[-:]\s*(\d)/i);
 let color=m?m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase():(row.winning_color||'');
 let number=m?Number(m[2]):(row.winning_number!==null&&row.winning_number!==undefined&&row.winning_number!==''?Number(row.winning_number):null);
 if(!['Green','Red','Violet'].includes(color))color='';const bigSmall=number!==null&&Number.isFinite(number)?(number>=5?'Big':'Small'):'';
 const colorClass=color==='Red'?'result-red':color==='Green'?'result-green':color==='Violet'?'result-violet':'';
 return{color,number,bigSmall,colorClass,hasResult:number!==null&&Number.isFinite(number)&&color!==''}
}
function formatHistoryDate(dateValue){
 if(!dateValue)return{date:'N/A',time:'N/A'};const date=new Date(dateValue);if(Number.isNaN(date.getTime()))return{date:'N/A',time:'N/A'};
 return{date:date.toLocaleDateString('en-GB',{timeZone:'Asia/Dhaka',day:'2-digit',month:'2-digit',year:'numeric'}),time:date.toLocaleTimeString('en-GB',{timeZone:'Asia/Dhaka',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}
}

async function loadHistoryData(type){
 const container=document.getElementById("modal-body-content");if(!type)return;container.innerHTML=`<p class="text-center text-slate-500 py-3">Loading...</p>`;
 if(type==='game-history'){
  const {data,error}=await supabaseClient.from("color_periods").select("*").eq("status","completed").order("created_at",{ascending:false}).limit(30);
  if(error||!data||!data.length){container.innerHTML=`<p class="text-center text-slate-500 py-3">No history found</p>`;return}
  let html=`<div class="overflow-x-auto"><table class="history-table"><thead><tr><th>Period</th><th>Number</th><th>Big/Small</th><th>Color</th></tr></thead><tbody>`;
  data.forEach(row=>{const bs=Number(row.winning_number)>=5?'Big':'Small',cc=row.winning_color==='Green'?'text-emerald-400':row.winning_color==='Red'?'text-rose-500':'text-purple-400';html+=`<tr><td class="font-mono text-amber-300">${escapeHtml(row.period_number)}</td><td class="font-bold">${escapeHtml(row.winning_number)}</td><td class="font-semibold">${bs}</td><td class="font-bold ${cc}">${escapeHtml(row.winning_color)}</td></tr>`});html+=`</tbody></table></div>`;container.innerHTML=html
 }else if(type==='my-history'){
  const {data,error}=await supabaseClient.from("color_game_history").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(10);
  if(error){container.innerHTML=`<p class="text-center text-rose-400 py-4">Unable to load My History. Please check the database.</p>`;return}
  if(!data||!data.length){container.innerHTML=`<p class="text-center text-slate-500 py-4">No bets found</p>`;return}
  let html=`<div class="p-2 text-[10px] text-slate-400">Showing your latest 10 bets.</div><div class="history-scroll max-h-64"><table class="my-history-table"><thead><tr><th>Period</th><th>Bet</th><th>Amount</th><th>Status</th><th>Result No.</th><th>Result Color</th><th>Big/Small</th><th>Date & Time</th></tr></thead><tbody>`;
  data.forEach(row=>{
   const status=String(row.status||'pending').toLowerCase(),statusColor=status==='win'?'text-emerald-400':status==='loss'?'text-rose-400':'text-amber-400',statusLabel=status==='win'?'WIN':status==='loss'?'LOSS':'PENDING',result=getSavedBetResult(row);
   const resultNumberHtml=result.hasResult?`<span class="result-number ${result.colorClass}">${result.number}</span>`:`<span class="text-slate-500">—</span>`;
   const resultColorHtml=result.hasResult?`<span class="result-badge ${result.color==='Red'?'bg-rose-900/60 text-rose-300 border border-rose-700':result.color==='Green'?'bg-emerald-900/60 text-emerald-300 border border-emerald-700':'bg-purple-900/60 text-purple-300 border border-purple-700'}">${escapeHtml(result.color.toUpperCase())}</span>`:`<span class="text-slate-500">—</span>`;
   const bsHtml=result.hasResult?`<span class="result-badge ${result.bigSmall==='Big'?'bg-amber-900/60 text-amber-300 border border-amber-700':'bg-blue-900/60 text-blue-300 border border-blue-700'}">${result.bigSmall.toUpperCase()}</span>`:`<span class="text-slate-500">—</span>`;
   const dt=formatHistoryDate(row.created_at);
   html+=`<tr><td class="font-mono text-amber-300">${escapeHtml(row.period_number||'—')}</td><td class="font-bold text-white">${escapeHtml(row.bet_type||'—')}</td><td class="font-mono text-slate-200">৳${Number(row.bet_amount||0).toFixed(2)}</td><td class="font-bold ${statusColor}">${statusLabel}</td><td>${resultNumberHtml}</td><td>${resultColorHtml}</td><td>${bsHtml}</td><td class="date-cell"><div>${escapeHtml(dt.date)}</div><div class="text-slate-400">${escapeHtml(dt.time)}</div></td></tr>`
  });html+=`</tbody></table></div>`;container.innerHTML=html
 }else if(type==='chart'){
  const {data}=await supabaseClient.from("color_periods").select("*").eq("status","completed").order("created_at",{ascending:false}).limit(30);
  let trend='',big=0,small=0,green=0,red=0,violet=0;
  if(data&&data.length)data.forEach(row=>{const n=Number(row.winning_number);n>=5?big++:small++;if(row.winning_color==='Green')green++;else if(row.winning_color==='Red')red++;else if(row.winning_color==='Violet')violet++;const bg=row.winning_color==='Red'?'#e11d48':row.winning_color==='Green'?'#059669':'#7c3aed';trend+=`<div class="trend-ball" style="background:${bg}">${n}</div>`});else trend=`<p class="text-slate-500 text-center py-2">কোনো ডাটা পাওয়া যায়নি</p>`;
  const total=(data?.length||0)||1,bigPct=Math.round(big/total*100),smallPct=100-bigPct,greenPct=Math.round(green/total*100),redPct=Math.round(red/total*100),violetPct=Math.max(0,100-greenPct-redPct);
  container.innerHTML=`<div class="p-2 space-y-4"><div class="overflow-x-auto"><div class="trend-grid-container">${trend}</div></div><div class="h-[1px] w-full bg-slate-800"></div><div class="space-y-3"><div><div class="flex justify-between text-[11px] font-bold mb-1"><span class="text-amber-400">Big: ${bigPct}%</span><span class="text-blue-400">Small: ${smallPct}%</span></div><div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex"><div class="bg-amber-500 h-full" style="width:${bigPct}%"></div><div class="bg-blue-500 h-full" style="width:${smallPct}%"></div></div></div><div><div class="flex justify-between text-[10.5px] font-bold mb-1"><span class="text-emerald-400">Green: ${greenPct}%</span><span class="text-purple-400">Violet: ${violetPct}%</span><span class="text-rose-400">Red: ${redPct}%</span></div><div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden flex"><div class="bg-emerald-600 h-full" style="width:${greenPct}%"></div><div class="bg-purple-600 h-full" style="width:${violetPct}%"></div><div class="bg-rose-600 h-full" style="width:${redPct}%"></div></div></div></div></div>`
 }
}

async function updatePeriodAmounts(amount,target){
 let {data:periodData}=await supabaseClient.from("color_periods").select("*").eq("period_number",currentPeriodNumber).maybeSingle();
 if(!periodData){await supabaseClient.from("color_periods").insert([{period_number:currentPeriodNumber,total_green_amount:target==='Green'?amount:0,total_red_amount:target==='Red'?amount:0,total_violet_amount:target==='Violet'?amount:0,status:'pending'}])}
 else{let f={};if(target==='Green')f.total_green_amount=Number(periodData.total_green_amount)+amount;else if(target==='Red')f.total_red_amount=Number(periodData.total_red_amount)+amount;else if(target==='Violet')f.total_violet_amount=Number(periodData.total_violet_amount)+amount;await supabaseClient.from("color_periods").update(f).eq("period_number",currentPeriodNumber)}
}

async function processRoundResult(){
 document.getElementById("game-status-text").innerText="Calculating result...";
 let {data:periodData}=await supabaseClient.from("color_periods").select("*").eq("period_number",currentPeriodNumber).maybeSingle();
 if(!periodData){await ensureCurrentPeriodExists();const res=await supabaseClient.from("color_periods").select("*").eq("period_number",currentPeriodNumber).maybeSingle();periodData=res.data}
 const green=periodData?Number(periodData.total_green_amount||0):0,red=periodData?Number(periodData.total_red_amount||0):0,violet=periodData?Number(periodData.total_violet_amount||0):0;
 let winningColor='Green';
 if(green===0&&red===0&&violet===0){const rc=['Green','Red','Green','Red','Violet'];winningColor=rc[Math.floor(Math.random()*rc.length)]}
 else if(green<=red&&green<=violet)winningColor='Green';else if(red<=green&&red<=violet)winningColor='Red';else winningColor='Violet';
 const numbersMap={Green:[1,3,7,9],Red:[2,4,6,8],Violet:[0,5]},possibleNums=numbersMap[winningColor],winningNumber=possibleNums[Math.floor(Math.random()*possibleNums.length)],winningBigSmall=winningNumber>=5?'Big':'Small',winningResultString=`${winningColor}-${winningNumber}`;
 await supabaseClient.from("color_periods").update({winning_color:winningColor,winning_number:winningNumber,status:'completed'}).eq("period_number",currentPeriodNumber);
 const {data:allBets}=await supabaseClient.from("color_game_history").select("*").eq("period_number",currentPeriodNumber).eq("status",'pending');
 let userWonAmount=0,hasUserWon=false,userParticipated=false,userWinsMap={};
 if(allBets&&allBets.length)for(let bet of allBets){
  let isWin=false,multiplier=2;if(bet.bet_type==='Red')multiplier=1.9;else if(bet.bet_type==='Violet')multiplier=4.5;else if(bet.bet_type==='Big'||bet.bet_type==='Small')multiplier=1.9;else if(!isNaN(bet.bet_type))multiplier=9;
  if(bet.bet_type===winningColor||bet.bet_type===String(winningNumber)||bet.bet_type===winningBigSmall)isWin=true;
  if(bet.user_id===currentUser.id)userParticipated=true;
  if(isWin){
   const payoutAmount=bet.bet_amount*multiplier;
   if(bet.user_id===currentUser.id){userWonAmount+=payoutAmount;hasUserWon=true;const totalTargetWinReturn=bet.bet_amount+payoutAmount;userWinsMap[bet.bet_type]=(userWinsMap[bet.bet_type]||0)+totalTargetWinReturn}
   await supabaseClient.from("color_game_history").update({winning_result:winningResultString,payout:payoutAmount,status:'win'}).eq("id",bet.id);
   const {data:targetProfile}=await supabaseClient.from("profiles").select("balance").eq("id",bet.user_id).single();
   if(targetProfile){const updatedBal=Number(targetProfile.balance)+payoutAmount;await supabaseClient.from("profiles").update({balance:updatedBal}).eq("id",bet.user_id)}
  }else await supabaseClient.from("color_game_history").update({winning_result:winningResultString,payout:0,status:'loss'}).eq("id",bet.id)
 }
 currentRoundTotalBet=0;userActiveBets=[];updateBetBadgesUI();document.getElementById("bar-total-bet").innerText="0.00";
 for(let target in userWinsMap){const btn=document.getElementById(`btn-${target}`);if(btn){const overlay=document.createElement('div');overlay.className='win-payout-overlay';overlay.innerText=`+৳${userWinsMap[target].toFixed(1)}`;btn.appendChild(overlay);setTimeout(()=>overlay.remove(),2000)}}
 document.getElementById("game-status-text").innerText=`Result: ${winningResultString} (${winningBigSmall})`;
 highlightWinningTargets(winningColor,winningNumber,winningBigSmall);await loadUserProfile();
 const center=document.getElementById("bottom-bar-center-status");
 if(userParticipated){if(hasUserWon){center.innerHTML=`<span class="text-emerald-400 inline-block">Win ৳${userWonAmount.toFixed(2)}</span>`;playVoiceMessage("congratulation winner")}else{center.innerHTML=`<span class="text-rose-500 inline-block">Lost</span>`;playVoiceMessage("better luck next time")}}else center.innerHTML="";
 currentPeriodNumber=String(parseInt(currentPeriodNumber,10)+1);renderPeriodNumber();await ensureCurrentPeriodExists();
 const modal=document.getElementById('custom-popup-modal');if(modal&&modal.classList.contains('show')&&activeModalTab)loadHistoryData(activeModalTab);startTimer()
}
</script>
