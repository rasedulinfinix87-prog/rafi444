<body class="flex justify-center items-center min-h-screen bg-slate-950">

<div id="game-status-text" class="hidden" aria-live="polite">Place your bet before timer ends...</div>
</div>
<div class="bg-slate-950 rounded-2xl border border-slate-800 p-3 mt-3">
<div class="flex border-b border-slate-800 pb-2 mb-3 gap-2">
<button onclick="switchTab('game-history')" id="tab-game-history" class="flex-1 py-2 text-xs font-bold rounded-lg bg-rose-600 text-white transition">Game History</button>
<button onclick="switchTab('chart')" id="tab-chart" class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 transition">Chart</button>
<button onclick="switchTab('my-history')" id="tab-my-history" class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 transition">My History</button>
</div>
<div id="tab-content" class="max-h-96 overflow-auto text-xs"><p class="text-center text-slate-500 py-3">Loading...</p></div>
</div>
</main></div>
<div id="bet-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden justify-center items-center z-50 p-4">
<div class="bg-slate-900 border border-slate-800 w-full max-w-xs p-5 rounded-2xl shadow-2xl flex flex-col gap-4">
<h3 class="text-sm font-bold text-slate-300">Place Bet on: <span id="modal-target" class="font-extrabold text-base"></span></h3>
<div><label class="text-[11px] text-slate-400 block mb-1">Enter Amount (৳)</label><input type="number" id="bet-amount-input" min="1" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono text-sm" value="100"></div>
<div class="flex gap-2"><button onclick="closeBetModal()" class="flex-1 py-2 rounded-xl font-semibold transition text-xs">Cancel</button><button onclick="confirmAndPlaceBet()" class="flex-1 py-2 rounded-xl font-bold transition text-xs">Confirm</button></div>
</div></div>
<div id="win-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden justify-center items-center z-50 p-4">
<div class="relative w-full max-w-sm p-6 rounded-3xl shadow-2xl text-center flex flex-col items-center">
<div class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center shadow-lg -mt-10 mb-2"><span class="text-2xl">🎉</span></div>
<h2 class="text-2xl font-black tracking-wider">Congratulations</h2><p class="text-xs mb-2">You have won the trade!</p>
<div class="flex items-center gap-2 my-2"><span class="text-xs">Result:</span><span id="win-res-badge" class="px-3 py-1 font-bold rounded-full text-xs">Red</span><span id="win-res-num" class="w-6 h-6 rounded-full font-bold text-xs flex items-center justify-center">8</span><span id="win-res-bs" class="px-2 py-0.5 rounded font-bold text-xs">Big</span></div>
<div class="w-full bg-white rounded-2xl p-4 shadow-inner mt-2 flex flex-col items-center"><p class="text-xs uppercase font-semibold">Winning Bonus</p><p id="win-bonus-amount" class="text-3xl font-black my-1 font-mono">৳0.00</p><p id="win-period-text" class="text-[11px] font-mono">Period: 2026101501</p></div>
<button onclick="closeWinModal()" class="mt-5 w-full py-3 rounded-xl font-bold shadow-lg transition text-sm">Collect &amp; Continue</button>
</div></div>
<script>
let currentUser=null,userProfile=null,selectedGameDuration=30,currentPeriodNumber="2026101501",timerSeconds=30,timerInterval=null,selectedTarget=null;
let activeTab='game-history';
document.addEventListener("DOMContentLoaded",async()=>{renderPeriodNumber();currentUser=await requireAuth();if(currentUser){await loadUserProfile();startTimer();loadHistoryData('game-history')}});
async function loadUserProfile(){userProfile=await getUserProfile(currentUser.id);if(userProfile)document.getElementById("user-balance").innerText=Number(userProfile.balance).toFixed(2)}
function changeGameMode(duration,modeKey){selectedGameDuration=duration;timerSeconds=duration;['10s','30s','1m','5m'].forEach(key=>{let btn=document.getElementById(`mode-${key}`);btn.classList.toggle('selected-mode',key===modeKey);btn.style.filter=key===modeKey?'brightness(1.16)':'none';btn.style.outline=key===modeKey?'2px solid #00e6a0':'none';btn.style.outlineOffset='1px'});startTimer()}
function renderPeriodNumber(){const element=document.getElementById("period-number");if(element)element.innerHTML=[...String(currentPeriodNumber)].map(d=>`<span class="period-digit">${d}</span>`).join("")}
function clearWinningHighlights(){document.querySelectorAll('.winning-blink').forEach(b=>b.classList.remove('winning-blink','win-blink-green','win-blink-red','win-blink-violet','win-blink-number','win-blink-big','win-blink-small'))}
function highlightWinningTargets(winningColor,winningNumber,winningBigSmall){clearWinningHighlights();const cc={Green:'win-blink-green',Red:'win-blink-red',Violet:'win-blink-violet'};document.querySelectorAll('button[onclick^="openBetModal("]').forEach(button=>{const m=button.getAttribute('onclick')?.match(/openBetModal\(['"]([^'"]+)['"]\)/);if(!m)return;const target=m[1];let cls=target===winningColor?(cc[winningColor]||''):target===String(winningNumber)?'win-blink-number':target===winningBigSmall?(winningBigSmall==='Big'?'win-blink-big':'win-blink-small'):'';if(cls){button.classList.add('winning-blink',cls);button.addEventListener('animationend',function done(e){if(e.animationName!=='winningBlink')return;button.classList.remove('winning-blink','win-blink-green','win-blink-red','win-blink-violet','win-blink-number','win-blink-big','win-blink-small');button.removeEventListener('animationend',done)})}})}
function startTimer(){clearInterval(timerInterval);timerSeconds=selectedGameDuration;const el=document.getElementById("countdown-timer"),label=document.getElementById("timer-label");function update(){if(!el)return;const t=`${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;el.innerHTML=`<span class="timer-digit">${t[0]}</span><span class="timer-digit">${t[1]}</span><span class="timer-colon">:</span><span class="timer-digit">${t[3]}</span><span class="timer-digit">${t[4]}</span>`;el.classList.toggle('timer-danger',timerSeconds<=5);if(label){label.innerText=timerSeconds<=5?'BET CLOSED':'PLACE YOUR BET';label.classList.toggle('timer-label-danger',timerSeconds<=5)}}update();timerInterval=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);update();if(timerSeconds<=0){clearInterval(timerInterval);processRoundResult()}},1000)}
function switchTab(tabName){const c=document.getElementById('tab-content');if(activeTab===tabName&&!c.classList.contains('hidden')){activeTab=null;c.classList.add('hidden');['game-history','chart','my-history'].forEach(t=>{const b=document.getElementById(`tab-${t}`);b.className='flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 transition'});return}activeTab=tabName;c.classList.remove('hidden');['game-history','chart','my-history'].forEach(t=>{const b=document.getElementById(`tab-${t}`);b.className=t===tabName?'flex-1 py-2 text-xs font-bold rounded-lg bg-rose-600 text-white transition':'flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 transition'});loadHistoryData(tabName)}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getSavedBetResult(row){let s=String(row.winning_result||''),m=s.match(/(Green|Red|Violet)\s*[-:]\s*(\d)/i),color=m?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase():(row.winning_color||''),number=m?Number(m[2]):row.winning_number!==null&&row.winning_number!==undefined&&row.winning_number!==''?Number(row.winning_number):null;if(!['Green','Red','Violet'].includes(color))color='';let bigSmall=number!==null&&Number.isFinite(number)?number>=5?'Big':'Small':'';let colorClass=color==='Red'?'result-red':color==='Green'?'result-green':color==='Violet'?'result-violet':'';return{color,number,bigSmall,colorClass,hasResult:number!==null&&Number.isFinite(number)&&color!==''}}
function formatHistoryDate(v){if(!v)return{date:'N/A',time:'N/A'};const d=new Date(v);if(Number.isNaN(d.getTime()))return{date:'N/A',time:'N/A'};return{date:d.toLocaleDateString('en-GB',{timeZone:'Asia/Dhaka',day:'2-digit',month:'2-digit',year:'numeric'}),time:d.toLocaleTimeString('en-GB',{timeZone:'Asia/Dhaka',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}}
async function loadHistoryData(type){const c=document.getElementById('tab-content');if(!type)return;c.classList.remove('hidden');c.innerHTML='<p class="text-center text-slate-500 py-3">Loading...</p>';if(type==='game-history'){const{data,error}=await supabaseClient.from('color_periods').select('*').eq('status','completed').order('created_at',{ascending:false}).limit(10);if(error||!data||!data.length){c.innerHTML='<p class="text-center text-slate-500 py-3">No history found</p>';return}let h='<div class="overflow-x-auto"><table class="history-table"><thead><tr><th>Period</th><th>Number</th><th>Big/Small</th><th>Color</th></tr></thead><tbody>';data.forEach(r=>{let bs=Number(r.winning_number)>=5?'Big':'Small',cl=r.winning_color==='Green'?'text-emerald-300':r.winning_color==='Red'?'text-rose-300':'text-purple-300';h+=`<tr><td class="font-mono text-cyan-300">${escapeHtml(r.period_number)}</td><td class="font-bold">${escapeHtml(r.winning_number)}</td><td class="font-semibold">${bs}</td><td class="font-bold ${cl}">${escapeHtml(r.winning_color)}</td></tr>`});c.innerHTML=h+'</tbody></table></div>'}
else if(type==='my-history'){const{data,error}=await supabaseClient.from('color_game_history').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(10);if(error){c.innerHTML='<p class="text-center text-rose-300 py-4">Unable to load My History. Please check the database.</p>';return}if(!data||!data.length){c.innerHTML='<p class="text-center text-slate-500 py-4">No bets found</p>';return}let h='<div class="mb-3 text-[10px] text-slate-400">Showing latest 10 bets. Scroll horizontally to see all details.</div><div class="history-scroll max-h-96"><table class="my-history-table"><thead><tr><th>Period</th><th>Bet</th><th>Amount</th><th>Status</th><th>Result No.</th><th>Result Color</th><th>Big/Small</th><th>Date &amp; Time</th></tr></thead><tbody>';data.forEach(r=>{let st=String(r.status||'pending').toLowerCase(),sc=st==='win'?'text-emerald-300':st==='loss'?'text-rose-300':'text-amber-300',res=getSavedBetResult(r),dt=formatHistoryDate(r.created_at),rn=res.hasResult?`<span class="result-number ${res.colorClass}">${res.number}</span>`:'—',rc=res.hasResult?`<span class="result-badge ${res.color==='Red'?'bg-rose-900/60 text-rose-300':res.color==='Green'?'bg-emerald-900/60 text-emerald-300':'bg-purple-900/60 text-purple-300'}">${escapeHtml(res.color.toUpperCase())}</span>`:'—',bs=res.hasResult?`<span class="result-badge ${res.bigSmall==='Big'?'bg-amber-900/60 text-amber-300':'bg-blue-900/60 text-blue-300'}">${res.bigSmall.toUpperCase()}</span>`:'—';h+=`<tr><td class="font-mono text-cyan-300">${escapeHtml(r.period_number||'—')}</td><td class="font-bold">${escapeHtml(r.bet_type||'—')}</td><td class="font-mono">৳${Number(r.bet_amount||0).toFixed(2)}</td><td class="font-bold ${sc}">${st.toUpperCase()}</td><td>${rn}</td><td>${rc}</td><td>${bs}</td><td class="date-cell">${escapeHtml(dt.date)}<br><span class="text-slate-400">${escapeHtml(dt.time)}</span></td></tr>`});c.innerHTML=h+'</tbody></table></div>'}
else if(type==='chart')c.innerHTML='<p class="text-center text-slate-500 py-5">Chart feature coming soon...</p>'}
function openBetModal(target){if(timerSeconds<=5){const s=document.getElementById('game-status-text');s.innerText='No More Bet! Please wait for the next round.';s.classList.remove('hidden');return}selectedTarget=target;document.getElementById('modal-target').innerText=target;document.getElementById('bet-modal').classList.remove('hidden');document.getElementById('bet-modal').classList.add('flex')}
function closeBetModal(){document.getElementById('bet-modal').classList.remove('flex');document.getElementById('bet-modal').classList.add('hidden')}
function closeWinModal(){document.getElementById('win-modal').classList.remove('flex');document.getElementById('win-modal').classList.add('hidden')}
async function confirmAndPlaceBet(){if(timerSeconds<=5){closeBetModal();const s=document.getElementById('game-status-text');s.innerText='No More Bet! Please wait for the next round.';s.classList.remove('hidden');return}const amount=parseFloat(document.getElementById('bet-amount-input').value);if(!Number.isFinite(amount)||amount<=0){alert('Please enter a valid amount!');return}if(!userProfile||amount>Number(userProfile.balance)){alert('Insufficient balance!');return}const newBalance=Number(userProfile.balance)-amount;const{error:pe}=await supabaseClient.from('profiles').update({balance:newBalance}).eq('id',currentUser.id);if(pe){alert('Failed to place bet. Try again.');return}userProfile.balance=newBalance;document.getElementById('user-balance').innerText=newBalance.toFixed(2);const{error:be}=await supabaseClient.from('color_game_history').insert([{user_id:currentUser.id,period_number:currentPeriodNumber,bet_type:selectedTarget,bet_amount:amount,status:'pending'}]);if(be){console.error(be);alert('Bet history could not be saved. Please contact support.');return}await updatePeriodAmounts(amount,selectedTarget);closeBetModal();const s=document.getElementById('game-status-text');s.innerText=`Successfully placed ৳${amount} on ${selectedTarget}!`;s.classList.remove('hidden');if(activeTab==='my-history')loadHistoryData('my-history')}
async function updatePeriodAmounts(amount,target){const{data:p}=await supabaseClient.from('color_periods').select('*').eq('period_number',currentPeriodNumber).maybeSingle();if(!p){await supabaseClient.from('color_periods').insert([{period_number:currentPeriodNumber,total_green_amount:target==='Green'?amount:0,total_red_amount:target==='Red'?amount:0,total_violet_amount:target==='Violet'?amount:0,status:'pending'}])}else{const u={};if(target==='Green')u.total_green_amount=Number(p.total_green_amount)+amount;else if(target==='Red')u.total_red_amount=Number(p.total_red_amount)+amount;else if(target==='Violet')u.total_violet_amount=Number(p.total_violet_amount)+amount;if(Object.keys(u).length)await supabaseClient.from('color_periods').update(u).eq('period_number',currentPeriodNumber)}}
async function processRoundResult(){const s=document.getElementById('game-status-text');s.innerText='Calculating result...';s.classList.remove('hidden');const{data:p}=await supabaseClient.from('color_periods').select('*').eq('period_number',currentPeriodNumber).maybeSingle();const g=p?Number(p.total_green_amount):0,r=p?Number(p.total_red_amount):0,v=p?Number(p.total_violet_amount):0;let wc='Green';if(g===0&&r===0&&v===0){const a=['Green','Red','Green','Red','Violet'];wc=a[Math.floor(Math.random()*a.length)]}else if(g<=r&&g<=v)wc='Green';else if(r<=g&&r<=v)wc='Red';else wc='Violet';const nm={Green:[1,3,7,9],Red:[2,4,6,8],Violet:[0,5]},nums=nm[wc],wn=nums[Math.floor(Math.random()*nums.length)],bs=wn>=5?'Big':'Small',result=`${wc}-${wn}`;await supabaseClient.from('color_periods').update({winning_color:wc,winning_number:wn,status:'completed'}).eq('period_number',currentPeriodNumber);const{data:bets}=await supabaseClient.from('color_game_history').select('*').eq('period_number',currentPeriodNumber).eq('status','pending');let won=0,hasWon=false;if(bets?.length){for(const b of bets){let win=false,m=2;if(b.bet_type==='Red')m=1.9;else if(b.bet_type==='Violet')m=4.5;else if(b.bet_type==='Big'||b.bet_type==='Small')m=1.9;else if(!isNaN(b.bet_type))m=9;if(b.bet_type===wc||b.bet_type===String(wn)||b.bet_type===bs)win=true;const payout=win?Number(b.bet_amount)*m:0;await supabaseClient.from('color_game_history').update({winning_result:result,payout,status:win?'win':'loss'}).eq('id',b.id);if(win){if(b.user_id===currentUser.id){won+=payout;hasWon=true}const{data:profile}=await supabaseClient.from('profiles').select('balance').eq('id',b.user_id).single();if(profile)await supabaseClient.from('profiles').update({balance:Number(profile.balance)+payout}).eq('id',b.user_id)}}}s.innerText=`Result: ${result} (${bs})`;highlightWinningTargets(wc,wn,bs);await loadUserProfile();if(hasWon){document.getElementById('win-res-badge').innerText=wc;document.getElementById('win-res-num').innerText=wn;document.getElementById('win-res-bs').innerText=bs;document.getElementById('win-bonus-amount').innerText=`৳${won.toFixed(2)}`;document.getElementById('win-period-text').innerText=`Period: ${currentPeriodNumber}`;document.getElementById('win-modal').classList.remove('hidden');document.getElementById('win-modal').classList.add('flex')}currentPeriodNumber=String(parseInt(currentPeriodNumber,10)+1);renderPeriodNumber();if(activeTab)loadHistoryData(activeTab);startTimer()}
</script>
</body>
</html>
