
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b10">
    <title>Color Trade - Win Go</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        :root {
            --bg: #070b10;
            --panel: #0d141c;
            --panel-2: #111b24;
            --border: rgba(184, 151, 90, .19);
            --gold: #d8b875;
            --gold-light: #f6dfaa;
            --green: #20d69b;
            --muted: #87969f;
            --text: #f4f6f7;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% -10%, rgba(32,214,155,.10), transparent 45%),
                radial-gradient(ellipse at 100% 50%, rgba(216,184,117,.045), transparent 35%),
                var(--bg);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
            touch-action: manipulation;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        /* Main app frame */
        body > div {
            background: transparent !important;
        }

        body > div.w-full.max-w-md {
            max-width: 480px;
            min-height: 100vh;
            background: linear-gradient(180deg, #0b1118 0%, #080d13 100%) !important;
            border-color: rgba(216,184,117,.13) !important;
            box-shadow: 0 0 70px rgba(0,0,0,.5);
        }

        /* Premium header */
        header.custom-gradient {
            position: relative;
            min-height: 76px;
            padding: 18px 17px;
            background:
                radial-gradient(ellipse at 0% 0%, rgba(32,214,155,.15), transparent 60%),
                linear-gradient(135deg, #14251f, #101a1c 48%, #17170f) !important;
            border-bottom: 1px solid rgba(216,184,117,.27);
            box-shadow: 0 8px 30px rgba(0,0,0,.24) !important;
        }

        header.custom-gradient::after {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(216,184,117,.65), transparent);
        }

        header h1 {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0;
            color: var(--gold-light) !important;
            font-size: 17px !important;
            font-weight: 950 !important;
            letter-spacing: 1.5px !important;
            text-shadow: 0 2px 14px rgba(216,184,117,.13);
        }

        header h1::before {
            content: "W";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border: 1px solid rgba(216,184,117,.7);
            border-radius: 11px;
            background: linear-gradient(145deg, #254336, #101a18);
            color: #f5dca3;
            font-size: 17px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 12px rgba(0,0,0,.2);
        }

        header > div {
            padding: 9px 12px !important;
            border: 1px solid rgba(216,184,117,.3) !important;
            border-radius: 12px !important;
            background: rgba(3,9,10,.48) !important;
            color: #b8c5c1;
            font-size: 10px !important;
            letter-spacing: .25px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
        }

        #user-balance {
            color: #54e5b0 !important;
            font-size: 14px !important;
            font-weight: 900;
        }

        main {
            padding: 13px !important;
        }

        /* Main game panel */
        .main-game-card {
            position: relative;
            gap: 15px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 23px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(32,214,155,.045), transparent 45%),
                linear-gradient(155deg, #101820, #0a1017 75%);
            box-shadow:
                0 15px 40px rgba(0,0,0,.24),
                inset 0 1px 0 rgba(255,255,255,.035);
        }

        .game-section {
            min-width: 0;
        }

        /* Game mode selector */
        .game-section.grid.grid-cols-4 {
            gap: 7px !important;
        }

        .mode-button {
            position: relative;
            min-height: 65px;
            padding: 9px 3px !important;
            overflow: hidden;
            border: 1px solid rgba(153,172,178,.15) !important;
            border-radius: 13px !important;
            background: linear-gradient(155deg, #18232c, #101820) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
            transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
        }

        .mode-button > div:first-child {
            margin-bottom: 3px;
            color: #a7b5b8;
            font-size: 13px !important;
        }

        .mode-button > div:nth-child(2) {
            color: #c2cdd0 !important;
            font-size: 10px !important;
            font-weight: 850 !important;
            letter-spacing: .15px;
        }

        #mode-10s,
        #mode-30s,
        #mode-1m,
        #mode-5m {
            box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
        }

        #mode-30s {
            border-color: rgba(216,184,117,.8) !important;
            background: linear-gradient(145deg, #284f40, #142e28) !important;
            box-shadow: 0 4px 16px rgba(32,214,155,.09), inset 0 1px 0 rgba(255,255,255,.1) !important;
        }

        #mode-30s > div:nth-child(2) {
            color: #f5dca3 !important;
        }

        .mode-button:active {
            transform: scale(.96);
        }

        /* Period + countdown */
        .period-timer-card {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
            min-height: 126px;
            padding: 14px 10px;
            overflow: hidden;
            border: 1px solid rgba(216,184,117,.27);
            border-radius: 18px;
            background:
                radial-gradient(ellipse at 5% 0%, rgba(32,214,155,.13), transparent 52%),
                radial-gradient(ellipse at 100% 100%, rgba(216,184,117,.08), transparent 50%),
                linear-gradient(140deg, #14231f, #0b1218 65%, #10170f);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 8px 24px rgba(0,0,0,.15);
        }

        .period-timer-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d8b875, #20d69b, transparent);
        }

        .period-info,
        .timer-area {
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .period-heading {
            margin: 0 0 10px;
            color: #b7c8bf;
            font-size: 9px;
            line-height: 1.4;
            font-weight: 850;
            letter-spacing: .9px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: left;
        }

        .period-number-display {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            width: 100%;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: 0;
            background: transparent;
            text-align: left;
        }

        .period-digit {
            position: relative;
            display: inline-flex;
            flex: 0 1 19px;
            align-items: center;
            justify-content: center;
            min-width: 0;
            height: 32px;
            overflow: hidden;
            border: 1px solid rgba(32,214,155,.55);
            border-radius: 5px;
            background: linear-gradient(180deg, #1e5946, #10382d);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -3px 4px rgba(0,0,0,.25);
            color: #e4fff4;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: clamp(9px, 2.9vw, 13px);
            font-weight: 900;
            text-shadow: 0 0 7px rgba(32,214,155,.17);
        }

        .period-digit::after,
        .timer-digit::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 0;
            left: 0;
            height: 1px;
            border-top: 1px solid rgba(255,255,255,.07);
            background: rgba(0,0,0,.13);
            pointer-events: none;
        }

        .timer-area {
            text-align: center;
        }

        .timer-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 24px;
            margin-bottom: 9px;
            padding: 6px 7px;
            border: 1px solid rgba(32,214,155,.3);
            border-radius: 7px;
            background: rgba(14,65,48,.42);
            color: #72e8bc;
            font-size: 8px;
            line-height: 1.2;
            font-weight: 950;
            letter-spacing: .4px;
            white-space: nowrap;
        }

        .timer-label::before {
            content: "";
            width: 5px;
            height: 5px;
            flex: 0 0 5px;
            border-radius: 50%;
            background: #42e6ac;
            box-shadow: 0 0 7px rgba(66,230,172,.7);
        }

        .timer-label.timer-label-danger {
            border-color: rgba(251,113,133,.65);
            background: rgba(110,25,43,.6);
            color: #ffc2cc;
            animation: dangerPulse 1s infinite;
        }

        .timer-label.timer-label-danger::before {
            background: #fb7185;
        }

        .digital-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .timer-digit {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 25px;
            height: 38px;
            overflow: hidden;
            border: 1px solid rgba(32,214,155,.48);
            border-radius: 6px;
            background: linear-gradient(180deg, #205e49, #10382d);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -4px 5px rgba(0,0,0,.3);
            color: #e8fff6;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 22px;
            font-weight: 950;
        }

        .timer-colon {
            padding: 0 1px;
            color: var(--gold);
            font-size: 21px;
            line-height: 1;
            font-weight: 900;
        }

        .digital-timer.timer-danger .timer-digit {
            border-color: #fb7185;
            background: linear-gradient(180deg, #a9324b, #541c2b);
            color: white;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer.timer-danger .timer-colon {
            color: #fb7185;
        }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .75; }
        }

        /* Color choices */
        .game-section.grid.grid-cols-3 {
            gap: 9px !important;
        }

        .game-section.grid.grid-cols-3 button {
            position: relative;
            min-height: 47px;
            padding: 12px 4px !important;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 12px !important;
            font-size: 11px !important;
            font-weight: 900 !important;
            letter-spacing: .55px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 4px 12px rgba(0,0,0,.16) !important;
            transition: transform .18s, filter .18s;
        }

        .game-section.grid.grid-cols-3 button:nth-child(1) {
            border-color: rgba(103,255,192,.36);
            background: linear-gradient(135deg, #19b981, #087b57) !important;
        }

        .game-section.grid.grid-cols-3 button:nth-child(2) {
            border-color: rgba(213,175,255,.35);
            background: linear-gradient(135deg, #9862e8, #5a329a) !important;
        }

        .game-section.grid.grid-cols-3 button:nth-child(3) {
            border-color: rgba(255,158,173,.35);
            background: linear-gradient(135deg, #f05a70, #ad2542) !important;
        }

        .game-section.grid.grid-cols-3 button:active,
        .game-section.grid.grid-cols-2 button:active {
            transform: scale(.96);
        }

        /* Number selector */
        .main-game-card > .game-section.bg-slate-950 {
            padding: 13px !important;
            border: 1px solid rgba(216,184,117,.18) !important;
            border-radius: 17px !important;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(216,184,117,.045), transparent 60%),
                #0a1016 !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
        }

        .main-game-card > .game-section.bg-slate-950 > p {
            margin-bottom: 13px !important;
            color: #9eadaf !important;
            font-size: 10px !important;
            font-weight: 750;
            letter-spacing: .35px;
        }

        .main-game-card > .game-section.bg-slate-950 .grid {
            gap: 9px !important;
        }

        .number-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-width: 0;
            aspect-ratio: 1 / 1;
            border-radius: 13px !important;
            font-size: 20px !important;
            font-weight: 950 !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.34), inset 0 -5px 9px rgba(0,0,0,.25), 0 4px 9px rgba(0,0,0,.18) !important;
            transition: transform .18s, filter .18s;
        }

        .number-button:active {
            transform: scale(.92);
        }

        .ruby-sphere {
            border: 1px solid #fa7186 !important;
            background: radial-gradient(circle at 32% 24%, #ff8794 0%, #e73c59 40%, #8e1934 100%) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.36), inset 0 -6px 10px rgba(76,0,15,.3), 0 3px 11px rgba(239,68,68,.13) !important;
            color: #fff !important;
            text-shadow: 0 1px 4px rgba(0,0,0,.2);
        }

        .green-sphere {
            border: 1px solid #53e9b0 !important;
            background: radial-gradient(circle at 32% 24%, #7dffcc 0%, #16bd82 40%, #08704f 100%) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -6px 10px rgba(0,50,30,.28), 0 3px 11px rgba(32,214,155,.12) !important;
            color: #fff !important;
            text-shadow: 0 1px 4px rgba(0,0,0,.2);
        }

        .violet-sphere {
            border: 1px solid #c3a2ff !important;
            background: radial-gradient(circle at 32% 24%, #d8c3ff 0%, #9865ec 40%, #52309b 100%) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -6px 10px rgba(35,0,75,.28), 0 3px 11px rgba(124,58,237,.13) !important;
            color: #fff !important;
            text-shadow: 0 1px 4px rgba(0,0,0,.2);
        }

        /* Big and Small */
        .game-section.grid.grid-cols-2 {
            gap: 10px !important;
        }

        .game-section.grid.grid-cols-2 button {
            position: relative;
            min-height: 49px;
            padding: 12px 8px !important;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 12px !important;
            font-size: 13px !important;
            font-weight: 900 !important;
            letter-spacing: .7px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 5px 12px rgba(0,0,0,.16) !important;
            transition: transform .18s;
        }

        .game-section.grid.grid-cols-2 button:first-child {
            background: linear-gradient(135deg, #c99b42, #896023) !important;
            border-color: rgba(244,207,126,.48);
            color: #fff8e7 !important;
        }

        .game-section.grid.grid-cols-2 button:last-child {
            background: linear-gradient(135deg, #397fd2, #204b91) !important;
            border-color: rgba(135,188,255,.4);
            color: #f0f7ff !important;
        }

        /* History panel */
        main > div.bg-slate-950.rounded-2xl {
            margin-top: 14px !important;
            padding: 13px !important;
            border: 1px solid var(--border) !important;
            border-radius: 19px !important;
            background: linear-gradient(155deg, #111922, #0a1016) !important;
            box-shadow: 0 12px 30px rgba(0,0,0,.17), inset 0 1px 0 rgba(255,255,255,.025);
        }

        main > div.bg-slate-950.rounded-2xl > div:first-child {
            gap: 7px !important;
            padding-bottom: 10px !important;
            border-color: rgba(216,184,117,.16) !important;
        }

        main > div.bg-slate-950.rounded-2xl > div:first-child button {
            min-height: 39px;
            padding: 9px 3px !important;
            border: 1px solid rgba(255,255,255,.055);
            border-radius: 10px !important;
            background: #17212a !important;
            color: #9baab1 !important;
            font-size: 10px !important;
            font-weight: 850 !important;
            transition: background .2s, color .2s, border-color .2s;
        }

        main > div.bg-slate-950.rounded-2xl > div:first-child button.bg-rose-600 {
            border-color: rgba(216,184,117,.48) !important;
            background: linear-gradient(135deg, #315343, #18372b) !important;
            color: #f6dfaa !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
        }

        #tab-content {
            color: #dbe5e7;
            scrollbar-width: thin;
            scrollbar-color: #35483f #0a1016;
        }

        #tab-content::-webkit-scrollbar,
        .history-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        #tab-content::-webkit-scrollbar-thumb,
        .history-scroll::-webkit-scrollbar-thumb {
            border-radius: 8px;
            background: #35483f;
        }

        .history-table {
            width: 100%;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            white-space: nowrap;
        }

        .history-table th,
        .history-table td {
            padding: 12px 7px;
            text-align: left;
            vertical-align: middle;
            font-size: 10px;
        }

        .history-table th {
            background: #17231f;
            color: #c1cfc9;
            font-size: 9px;
            font-weight: 850;
            letter-spacing: .35px;
            border-bottom: 1px solid rgba(216,184,117,.22);
        }

        .history-table td {
            border-bottom: 1px solid rgba(255,255,255,.045);
            color: #e3e9e9;
        }

        .history-table tbody tr {
            transition: background .15s;
        }

        .history-table tbody tr:nth-child(even) {
            background: rgba(255,255,255,.015);
        }

        .history-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .my-history-table {
            min-width: 850px;
            border-collapse: separate;
            border-spacing: 0;
            white-space: nowrap;
        }

        .my-history-table th,
        .my-history-table td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,.055);
            vertical-align: middle;
        }

        .my-history-table th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #17231f;
            color: #c1cfc9;
            font-size: 9px;
            font-weight: 850;
            letter-spacing: .25px;
            border-bottom: 1px solid rgba(216,184,117,.22);
        }

        .my-history-table td {
            color: #e1e8e9;
            font-size: 10px;
        }

        .my-history-table tbody tr:nth-child(even) {
            background: rgba(255,255,255,.018);
        }

        .result-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 29px;
            height: 29px;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: 950;
        }

        .result-red {
            background: linear-gradient(145deg, #f05a70, #a51f3d);
            border: 1px solid #ff8b9b;
            box-shadow: 0 2px 8px rgba(244,63,94,.15);
        }

        .result-green {
            background: linear-gradient(145deg, #25ca91, #087752);
            border: 1px solid #68e9b6;
            box-shadow: 0 2px 8px rgba(16,185,129,.15);
        }

        .result-violet {
            background: linear-gradient(145deg, #a477f2, #6034a8);
            border: 1px solid #c7a9ff;
            box-shadow: 0 2px 8px rgba(139,92,246,.15);
        }

        .result-badge {
            display: inline-block;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .3px;
        }

        .date-cell {
            color: #d0d9da;
            font-size: 10px !important;
            line-height: 1.7;
        }

        .history-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            border: 1px solid rgba(216,184,117,.13);
            border-radius: 11px;
            -webkit-overflow-scrolling: touch;
        }

        /* Dynamic history content */
        #tab-content > p {
            padding-top: 20px !important;
            padding-bottom: 20px !important;
            color: #8d9d9f !important;
            font-size: 11px;
        }

        /* Bet modal */
        #bet-modal,
        #win-modal {
            padding: 18px !important;
            background: rgba(2,6,9,.82) !important;
            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(13px);
        }

        #bet-modal > div {
            width: 100%;
            max-width: 350px;
            gap: 19px !important;
            padding: 23px !important;
            border: 1px solid rgba(216,184,117,.38) !important;
            border-radius: 22px !important;
            background:
                radial-gradient(ellipse at 100% 0%, rgba(32,214,155,.08), transparent 50%),
                linear-gradient(145deg, #172129, #0b1218) !important;
            box-shadow: 0 25px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04) !important;
        }

        #bet-modal h3 {
            color: #e5ecea !important;
            font-size: 14px !important;
        }

        #modal-target {
            display: inline-block;
            margin-left: 4px;
            color: var(--gold-light) !important;
        }

        #bet-modal label {
            margin-bottom: 8px !important;
            color: #9fadaf !important;
            font-size: 11px !important;
            font-weight: 700;
        }

        #bet-amount-input {
            min-height: 48px;
            padding: 12px 14px !important;
            border: 1px solid rgba(216,184,117,.25) !important;
            border-radius: 12px !important;
            background: #080e13 !important;
            color: #f3f7f5 !important;
            font-size: 16px !important;

    <script>
        let currentUser = null;
        let userProfile = null;
        let selectedGameDuration = 30;
        let currentPeriodNumber = "2026101501";
        let timerSeconds = 30;
        let timerInterval = null;
        let selectedTarget = null;

        // null means all history panels are closed
        let activeTab = 'game-history';

        document.addEventListener("DOMContentLoaded", async () => {
            renderPeriodNumber();

            currentUser = await requireAuth();

            if (currentUser) {
                await loadUserProfile();
                startTimer();
                loadHistoryData('game-history');
            }
        });

        async function loadUserProfile() {
            userProfile = await getUserProfile(currentUser.id);

            if (userProfile) {
                document.getElementById("user-balance").innerText =
                    Number(userProfile.balance).toFixed(2);
            }
        }

        function changeGameMode(duration, modeKey) {
            selectedGameDuration = duration;
            timerSeconds = duration;

            ['10s', '30s', '1m', '5m'].forEach(key => {
                let btn = document.getElementById(`mode-${key}`);

                if (key === modeKey) {
                    btn.className = "mode-button bg-rose-600 p-2 rounded-xl text-center border border-rose-500 transition active:scale-95 shadow-md";
                    btn.querySelector("div:nth-child(2)").className =
                        "text-[11px] font-bold text-white mt-1";
                } else {
                    btn.className = "mode-button bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-center border border-slate-700 transition active:scale-95";
                    btn.querySelector("div:nth-child(2)").className =
                        "text-[11px] font-bold text-amber-400 mt-1";
                }
            });

            startTimer();
        }

        /* Render each period digit using the timer's digital design */
        function renderPeriodNumber() {
            const element = document.getElementById("period-number");
            if (!element) return;

            const periodText = String(currentPeriodNumber);

            element.innerHTML = [...periodText].map(digit =>
                `<span class="period-digit">${digit}</span>`
            ).join("");
        }

        function clearWinningHighlights() {
            document.querySelectorAll('.winning-blink').forEach(button => {
                button.classList.remove(
                    'winning-blink',
                    'win-blink-green',
                    'win-blink-red',
                    'win-blink-violet',
                    'win-blink-number',
                    'win-blink-big',
                    'win-blink-small'
                );
            });
        }

        function highlightWinningTargets(winningColor, winningNumber, winningBigSmall) {
            clearWinningHighlights();

            const colorClass = {
                Green: 'win-blink-green',
                Red: 'win-blink-red',
                Violet: 'win-blink-violet'
            };

            document.querySelectorAll('button[onclick^="openBetModal("]').forEach(button => {
                const match = button.getAttribute('onclick')?.match(/openBetModal\(['"]([^'"]+)['"]\)/);

                if (!match) return;

                const target = match[1];
                let highlightClass = '';

                if (target === winningColor) {
                    highlightClass = colorClass[winningColor] || '';
                } else if (target === String(winningNumber)) {
                    highlightClass = 'win-blink-number';
                } else if (target === winningBigSmall) {
                    highlightClass = winningBigSmall === 'Big'
                        ? 'win-blink-big'
                        : 'win-blink-small';
                }

                if (highlightClass) {
                    button.classList.add('winning-blink', highlightClass);

                    // Remove highlight after the 3rd blink has finished
                    button.addEventListener('animationend', function removeBlink(event) {
                        if (event.animationName !== 'winningBlink') return;

                        button.classList.remove(
                            'winning-blink',
                            'win-blink-green',
                            'win-blink-red',
                            'win-blink-violet',
                            'win-blink-number',
                            'win-blink-big',
                            'win-blink-small'
                        );

                        button.removeEventListener('animationend', removeBlink);
                    });
                }
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = selectedGameDuration;

            const timerElem = document.getElementById("countdown-timer");
            const timerLabel = document.getElementById("timer-label");

            function updateMainTimer() {
                if (!timerElem) return;

                const min = Math.floor(timerSeconds / 60);
                const sec = timerSeconds % 60;

                const timeText =
                    `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

                timerElem.innerHTML = `
                    <span class="timer-digit">${timeText[0]}</span>
                    <span class="timer-digit">${timeText[1]}</span>
                    <span class="timer-colon">:</span>
                    <span class="timer-digit">${timeText[3]}</span>
                    <span class="timer-digit">${timeText[4]}</span>
                `;

                if (timerSeconds <= 5) {
                    timerElem.classList.add("timer-danger");

                    if (timerLabel) {
                        timerLabel.innerText = "BET CLOSED";
                        timerLabel.classList.add("timer-label-danger");
                    }
                } else {
                    timerElem.classList.remove("timer-danger");

                    if (timerLabel) {
                        timerLabel.innerText = "PLACE YOUR BET";
                        timerLabel.classList.remove("timer-label-danger");
                    }
                }
            }

            updateMainTimer();

            timerInterval = setInterval(() => {
                timerSeconds = Math.max(0, timerSeconds - 1);
                updateMainTimer();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    processRoundResult();
                }
            }, 1000);
        }

        /* Clicking an already-open tab closes it */
        function switchTab(tabName) {
            const container = document.getElementById("tab-content");

            if (activeTab === tabName && !container.classList.contains("hidden")) {
                activeTab = null;
                container.classList.add("hidden");

                ['game-history', 'chart', 'my-history'].forEach(t => {
                    const btn = document.getElementById(`tab-${t}`);
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
                });

                return;
            }

            activeTab = tabName;
            container.classList.remove("hidden");

            ['game-history', 'chart', 'my-history'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);

                if (t === tabName) {
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-rose-600 text-white transition";
                } else {
                    btn.className =
                        "flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 hover:text-white transition";
                }
            });

            loadHistoryData(tabName);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function getSavedBetResult(row) {
            let savedResult = String(row.winning_result || '');
            let resultMatch = savedResult.match(/(Green|Red|Violet)\s*[-:]\s*(\d)/i);

            let color = resultMatch
                ? resultMatch[1].charAt(0).toUpperCase() + resultMatch[1].slice(1).toLowerCase()
                : (row.winning_color || '');

            let number = resultMatch
                ? Number(resultMatch[2])
                : (row.winning_number !== null &&
                   row.winning_number !== undefined &&
                   row.winning_number !== ''
                    ? Number(row.winning_number)
                    : null);

            if (!['Green', 'Red', 'Violet'].includes(color)) {
                color = '';
            }

            let bigSmall = number !== null && Number.isFinite(number)
                ? (number >= 5 ? 'Big' : 'Small')
                : '';

            let colorClass = color === 'Red'
                ? 'result-red'
                : color === 'Green'
                    ? 'result-green'
                    : color === 'Violet'
                        ? 'result-violet'
                        : '';

            return {
                color,
                number,
                bigSmall,
                colorClass,
                hasResult: number !== null &&
                           Number.isFinite(number) &&
                           color !== ''
            };
        }

        function formatHistoryDate(dateValue) {
            if (!dateValue) return { date: 'N/A', time: 'N/A' };

            const date = new Date(dateValue);

            if (Number.isNaN(date.getTime())) {
                return { date: 'N/A', time: 'N/A' };
            }

            return {
                date: date.toLocaleDateString('en-GB', {
                    timeZone: 'Asia/Dhaka',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }),
                time: date.toLocaleTimeString('en-GB', {
                    timeZone: 'Asia/Dhaka',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                })
            };
        }

        async function loadHistoryData(type) {
            let container = document.getElementById("tab-content");

            if (!type) return;

            container.classList.remove("hidden");
            container.innerHTML =
                `<p class="text-center text-slate-500 py-3">Loading...</p>`;

            if (type === 'game-history') {
                let { data, error } = await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq("status", "completed")
                    .order("created_at", { ascending: false })
                    .limit(10);

                if (error || !data || data.length === 0) {
                    container.innerHTML =
                        `<p class="text-center text-slate-500 py-3">No history found</p>`;
                    return;
                }

                let html = `<div class="overflow-x-auto">
                    <table class="history-table">
                    <thead>
                    <tr class="text-slate-400 border-b border-slate-800">
                        <th>Period</th>
                        <th>Number</th>
                        <th>Big/Small</th>
                        <th>Color</th>
                    </tr>
                    </thead><tbody>`;

                data.forEach(row => {
                    let bs = Number(row.winning_number) >= 5 ? 'Big' : 'Small';

                    let colorClass = row.winning_color === 'Green'
                        ? 'text-emerald-400'
                        : (row.winning_color === 'Red'
                            ? 'text-rose-500'
                            : 'text-purple-400');

                    html += `<tr class="border-b border-slate-900/50">
                        <td class="font-mono text-amber-300">${escapeHtml(row.period_number)}</td>
                        <td class="font-bold">${escapeHtml(row.winning_number)}</td>
                        <td class="font-semibold">${bs}</td>
                        <td class="font-bold ${colorClass}">${escapeHtml(row.winning_color)}</td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
                container.innerHTML = html;

            } else if (type === 'my-history') {
                let { data, error } = await supabaseClient
                    .from("color_game_history")
                    .select("*")
                    .eq("user_id", currentUser.id)
                    .order("created_at", { ascending: false })
                    .limit(10);

                if (error) {
                    console.error("My History error:", error);
                    container.innerHTML =
                        `<p class="text-center text-rose-400 py-4">
                            Unable to load My History. Please check the database.
                        </p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML =
                        `<p class="text-center text-slate-500 py-4">No bets found</p>`;
                    return;
                }

                let html = `
                    <div class="mb-3 text-[10px] text-slate-400">
                        Showing your latest 10 bets. Scroll horizontally to see all details.
                    </div>
                    <div class="history-scroll max-h-96">
                    <table class="my-history-table">
                    <thead>
                    <tr>
                        <th>Period</th>
                        <th>Bet</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Result No.</th>
                        <th>Result Color</th>
                        <th>Big/Small</th>
                        <th>Date & Time</th>
                    </tr>
                    </thead><tbody>`;

                data.forEach(row => {
                    let status = String(row.status || 'pending').toLowerCase();

                    let statusColor = status === 'win'
                        ? 'text-emerald-400'
                        : status === 'loss'
                            ? 'text-rose-400'
                            : 'text-amber-400';

                    let statusLabel = status === 'win'
                        ? 'WIN'
                        : status === 'loss'
                            ? 'LOSS'
                            : 'PENDING';

                    let result = getSavedBetResult(row);

                    let resultNumberHtml = result.hasResult
                        ? `<span class="result-number ${result.colorClass}">${result.number}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let resultColorHtml = result.hasResult
                        ? `<span class="result-badge ${
                            result.color === 'Red'
                                ? 'bg-rose-900/60 text-rose-300 border border-rose-700'
                                : result.color === 'Green'
                                    ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-700'
                                    : 'bg-purple-900/60 text-purple-300 border border-purple-700'
                          }">${escapeHtml(result.color.toUpperCase())}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let bigSmallHtml = result.hasResult
                        ? `<span class="result-badge ${
                            result.bigSmall === 'Big'
                                ? 'bg-amber-900/60 text-amber-300 border border-amber-700'
                                : 'bg-blue-900/60 text-blue-300 border border-blue-700'
                          }">${result.bigSmall.toUpperCase()}</span>`
                        : `<span class="text-slate-500">—</span>`;

                    let dateTime = formatHistoryDate(row.created_at);

                    html += `
                        <tr>
                            <td class="font-mono text-amber-300">${escapeHtml(row.period_number || '—')}</td>
                            <td class="font-bold text-white">${escapeHtml(row.bet_type || '—')}</td>
                            <td class="font-mono text-slate-200">৳${Number(row.bet_amount || 0).toFixed(2)}</td>
                            <td class="font-bold ${statusColor}">${statusLabel}</td>
                            <td>${resultNumberHtml}</td>
                            <td>${resultColorHtml}</td>
                            <td>${bigSmallHtml}</td>
                            <td class="date-cell">
                                <div>${escapeHtml(dateTime.date)}</div>
                                <div class="text-slate-400">${escapeHtml(dateTime.time)}</div>
                            </td>
                        </tr>`;
                });

                html += `
                    </tbody></table></div>
                    <div class="mt-3 p-3 rounded-xl bg-slate-900 border border-slate-800">
                        <p class="text-[10px] text-slate-400 leading-relaxed">
                            Result No., Result Color এবং Big/Small দেখানোর জন্য
                            সংশ্লিষ্ট রাউন্ডের ফলাফল ডাটাবেসে সংরক্ষিত থাকতে হবে।
                            Pending বেটের ফলাফল রাউন্ড সম্পন্ন না হওয়া পর্যন্ত
                            দেখানো হবে না।
                        </p>
                    </div>`;

                container.innerHTML = html;

            } else if (type === 'chart') {
                container.innerHTML =
                    `<p class="text-center text-slate-500 py-5">Chart feature coming soon...</p>`;
            }
        }

        function openBetModal(target) {
            if (timerSeconds <= 5) {
                document.getElementById("game-status-text").innerText =
                    "No More Bet! Please wait for the next round.";
                return;
            }

            selectedTarget = target;

            document.getElementById("modal-target").innerText = target;
            document.getElementById("bet-modal").classList.remove("hidden");
            document.getElementById("bet-modal").classList.add("flex");
        }

        function closeBetModal() {
            document.getElementById("bet-modal").classList.remove("flex");
            document.getElementById("bet-modal").classList.add("hidden");
        }

        function closeWinModal() {
            document.getElementById("win-modal").classList.remove("flex");
            document.getElementById("win-modal").classList.add("hidden");
        }

        async function confirmAndPlaceBet() {
            if (timerSeconds <= 5) {
                closeBetModal();

                document.getElementById("game-status-text").innerText =
                    "No More Bet! Please wait for the next round.";

                return;
            }

            let amount = parseFloat(
                document.getElementById("bet-amount-input").value
            );

            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount!");
                return;
            }

            if (amount > Number(userProfile.balance)) {
                alert("Insufficient balance!");
                return;
            }

            let newBalance = Number(userProfile.balance) - amount;

            const { error: profileError } = await supabaseClient
                .from("profiles")
                .update({ balance: newBalance })
                .eq("id", currentUser.id);

            if (profileError) {
                alert("Failed to place bet. Try again.");
                return;
            }

            userProfile.balance = newBalance;

            document.getElementById("user-balance").innerText =
                newBalance.toFixed(2);

            const { error: betInsertError } = await supabaseClient
                .from("color_game_history")
                .insert([{
                    user_id: currentUser.id,
                    period_number: currentPeriodNumber,
                    bet_type: selectedTarget,
                    bet_amount: amount,
                    status: 'pending'
                }]);

            if (betInsertError) {
                console.error("Bet history insert error:", betInsertError);
                alert("Bet history could not be saved. Please contact support.");
                return;
            }

            await updatePeriodAmounts(amount, selectedTarget);
            closeBetModal();

            document.getElementById("game-status-text").innerText =
                `Successfully placed ৳${amount} on ${selectedTarget}!`;

            if (activeTab === 'my-history') {
                loadHistoryData('my-history');
            }
        }

        async function updatePeriodAmounts(amount, target) {
            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            if (!periodData) {
                await supabaseClient.from("color_periods").insert([{
                    period_number: currentPeriodNumber,
                    total_green_amount: target === 'Green' ? amount : 0,
                    total_red_amount: target === 'Red' ? amount : 0,
                    total_violet_amount: target === 'Violet' ? amount : 0,
                    status: 'pending'
                }]);

            } else {
                let updateField = {};

                if (target === 'Green') {
                    updateField.total_green_amount =
                        Number(periodData.total_green_amount) + amount;
                } else if (target === 'Red') {
                    updateField.total_red_amount =
                        Number(periodData.total_red_amount) + amount;
                } else if (target === 'Violet') {
                    updateField.total_violet_amount =
                        Number(periodData.total_violet_amount) + amount;
                }

                await supabaseClient
                    .from("color_periods")
                    .update(updateField)
                    .eq("period_number", currentPeriodNumber);
            }
        }

        async function processRoundResult() {
            document.getElementById("game-status-text").innerText =
                "Calculating result...";

            let { data: periodData } = await supabaseClient
                .from("color_periods")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .maybeSingle();

            let green = periodData ? Number(periodData.total_green_amount) : 0;
            let red = periodData ? Number(periodData.total_red_amount) : 0;
            let violet = periodData ? Number(periodData.total_violet_amount) : 0;

            let winningColor = 'Green';

            if (green === 0 && red === 0 && violet === 0) {
                const randomColors = ['Green', 'Red', 'Green', 'Red', 'Violet'];

                winningColor =
                    randomColors[Math.floor(Math.random() * randomColors.length)];

            } else {
                if (green <= red && green <= violet) {
                    winningColor = 'Green';
                } else if (red <= green && red <= violet) {
                    winningColor = 'Red';
                } else {
                    winningColor = 'Violet';
                }
            }

            let numbersMap = {
                Green: [1, 3, 7, 9],
                Red: [2, 4, 6, 8],
                Violet: [0, 5]
            };

            let possibleNums = numbersMap[winningColor];

            let winningNumber =
                possibleNums[Math.floor(Math.random() * possibleNums.length)];

            let winningBigSmall = winningNumber >= 5 ? 'Big' : 'Small';
            let winningResultString = `${winningColor}-${winningNumber}`;

            await supabaseClient
                .from("color_periods")
                .update({
                    winning_color: winningColor,
                    winning_number: winningNumber,
                    status: 'completed'
                })
                .eq("period_number", currentPeriodNumber);

            let { data: allBets } = await supabaseClient
                .from("color_game_history")
                .select("*")
                .eq("period_number", currentPeriodNumber)
                .eq("status", 'pending');

            let userWonAmount = 0;
            let hasUserWon = false;

            if (allBets && allBets.length > 0) {
                for (let bet of allBets) {
                    let isWin = false;
                    let multiplier = 2;

                    if (bet.bet_type === 'Red') multiplier = 1.9;
                    else if (bet.bet_type === 'Violet') multiplier = 4.5;
                    else if (
                        bet.bet_type === 'Big' ||
                        bet.bet_type === 'Small'
                    ) multiplier = 1.9;
                    else if (!isNaN(bet.bet_type)) multiplier = 9;

                    if (bet.bet_type === winningColor) {
                        isWin = true;
                    } else if (bet.bet_type === String(winningNumber)) {
                        isWin = true;
                    } else if (bet.bet_type === winningBigSmall) {
                        isWin = true;
                    }

                    if (isWin) {
                        let payoutAmount = bet.bet_amount * multiplier;

                        if (bet.user_id === currentUser.id) {
                            userWonAmount += payoutAmount;
                            hasUserWon = true;
                        }

                        await supabaseClient
                            .from("color_game_history")
                            .update({
                                winning_result: winningResultString,
                                payout: payoutAmount,
                                status: 'win'
                            })
                            .eq("id", bet.id);

                        let { data: targetProfile } = await supabaseClient
                            .from("profiles")
                            .select("balance")
                            .eq("id", bet.user_id)
                            .single();

                        if (targetProfile) {
                            let updatedBal =
                                Number(targetProfile.balance) + payoutAmount;

                            await supabaseClient
                                .from("profiles")
                                .update({ balance: updatedBal })
                                .eq("id", bet.user_id);
                        }

                    } else {
                        await supabaseClient
                            .from("color_game_history")
                            .update({
                                winning_result: winningResultString,
                                payout: 0,
                                status: 'loss'
                            })
                            .eq("id", bet.id);
                    }
                }
            }

            document.getElementById("game-status-text").innerText =
                `Result: ${winningResultString} (${winningBigSmall})`;

            // Blink winning color, number and Big/Small exactly 3 times
            highlightWinningTargets(
                winningColor,
                winningNumber,
                winningBigSmall
            );

            await loadUserProfile();

            if (hasUserWon) {
                document.getElementById("win-res-badge").innerText = winningColor;
                document.getElementById("win-res-num").innerText = winningNumber;
                document.getElementById("win-res-bs").innerText = winningBigSmall;

                document.getElementById("win-bonus-amount").innerText =
                    `৳${userWonAmount.toFixed(2)}`;

                document.getElementById("win-period-text").innerText =
                    `Period: ${currentPeriodNumber}`;

                document.getElementById("win-modal").classList.remove("hidden");
                document.getElementById("win-modal").classList.add("flex");
            }

            currentPeriodNumber = String(parseInt(currentPeriodNumber, 10) + 1);

            // Update the digital period display
            renderPeriodNumber();

            // Refresh only when a history panel is open
            if (activeTab) {
                loadHistoryData(activeTab);
            }

            startTimer();
        }
    </script>
