<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trade - Win Go</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, #17232a 0%, #081014 38%, #05090c 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        .app-shell {
            width: 100%;
            max-width: 768px;
            min-height: 100vh;
            margin: 0 auto;
            background:
                linear-gradient(180deg, #10191e 0%, #081014 42%, #071014 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,.55);
        }

        /* =========================
           WALLET / TOP UI
        ========================== */

        .wallet-section {
            padding: 10px 16px 4px;
        }

        .wallet-card {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            padding: 15px;
            background:
                radial-gradient(circle at 5% 5%, rgba(255,193,7,.08), transparent 30%),
                linear-gradient(145deg, #182126, #0d1519 65%, #10191d);
            border: 1px solid rgba(196,154,30,.42);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.04),
                0 8px 25px rgba(0,0,0,.3);
        }

        .wallet-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e4b52b, transparent);
            opacity: .75;
        }

        .wallet-top {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .wallet-icon {
            width: 66px;
            height: 66px;
            min-width: 66px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 35% 30%, #ffd94a, #d99b08 58%, #735000);
            box-shadow:
                inset 4px 4px 8px rgba(255,255,255,.25),
                inset -5px -6px 10px rgba(0,0,0,.45),
                0 5px 18px rgba(221,166,25,.18);
            color: #fff;
            font-size: 31px;
        }

        .wallet-info {
            flex: 1;
            min-width: 0;
        }

        .wallet-title {
            margin: 0;
            color: #9daab2;
            font-size: 15px;
            font-weight: 600;
        }

        .wallet-balance-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 2px;
        }

        .wallet-balance {
            margin: 0;
            color: #f8fafc;
            font-size: clamp(26px, 7vw, 37px);
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -.8px;
        }

        .balance-eye {
            color: #7d8990;
            font-size: 20px;
        }

        .wallet-id {
            margin-top: 4px;
            color: #89969e;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .wallet-refresh {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #52616a;
            background: rgba(9,15,18,.55);
            color: #aab6bc;
            font-size: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .wallet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 14px;
        }

        .wallet-action {
            height: 58px;
            border: 0;
            border-radius: 18px;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
        }

        .withdraw-action {
            background: linear-gradient(135deg, #ed1745, #ee174b);
        }

        .deposit-action {
            background: linear-gradient(135deg, #00ad58, #09bd63);
        }

        /* =========================
           WARNING
        ========================== */

        .warning-card {
            margin: 12px 16px 8px;
            padding: 12px 13px;
            border-radius: 17px;
            border: 1px solid rgba(231,181,38,.55);
            background: linear-gradient(145deg, #282819, #171a16);
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .warning-icon {
            color: #ffca25;
            font-size: 28px;
            flex-shrink: 0;
        }

        .warning-text {
            flex: 1;
            min-width: 0;
        }

        .warning-title {
            color: #f5c52b;
            font-size: 14px;
            line-height: 1.2;
            font-weight: 900;
        }

        .warning-subtitle {
            color: #aeb4b5;
            font-size: 12px;
            margin-top: 3px;
        }

        .warning-details {
            border: 0;
            border-radius: 14px;
            padding: 9px 15px;
            background: linear-gradient(180deg, #ffd94e, #e6ad20);
            color: #171717;
            font-size: 13px;
            font-weight: 900;
            flex-shrink: 0;
        }

        /* =========================
           MAIN GAME
        ========================== */

        .main-content {
            padding: 5px 16px 90px;
        }

        .main-game-card {
            background: transparent;
            border: 0;
            border-radius: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .game-section {
            min-width: 0;
            position: relative;
        }

        /* =========================
           MODES
        ========================== */

        .modes-plate {
            background: transparent;
            border: 0;
            border-radius: 16px;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 9px;
            box-shadow: none;
        }

        .mode-button {
            position: relative;
            background: linear-gradient(145deg, #182227, #10191d);
            border: 1px solid #26343a;
            border-radius: 17px;
            padding: 11px 3px 10px;
            text-align: center;
            cursor: pointer;
            transition: all .2s ease;
            min-height: 105px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
        }

        .mode-button.active-mode {
            background: linear-gradient(145deg, #ffe36a, #eab629);
            border-color: #ffd83c;
            box-shadow:
                0 4px 15px rgba(238,184,31,.18),
                inset 0 1px 0 rgba(255,255,255,.35);
        }

        .mode-button.active-mode::after {
            display: none;
        }

        .custom-clock-icon {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 35% 30%, #f2f5f5, #a9b2b6 70%);
            border: 3px solid #27343a;
            border-radius: 50%;
            position: relative;
            box-shadow:
                inset 0 2px 4px rgba(255,255,255,.7),
                inset 0 -4px 5px rgba(0,0,0,.4),
                0 2px 6px rgba(0,0,0,.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-clock-icon::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 20px;
            width: 3px;
            height: 14px;
            background: #111a1e;
            border-radius: 3px;
            transform-origin: bottom center;
            transform: rotate(0deg);
        }

        .custom-clock-icon::after {
            content: "";
            position: absolute;
            top: 21px;
            left: 20px;
            width: 10px;
            height: 3px;
            background: #111a1e;
            border-radius: 3px;
            transform-origin: left center;
            transform: rotate(25deg);
        }

        .mode-button.active-mode .custom-clock-icon {
            background: radial-gradient(circle at 35% 30%, #ffdc4c, #d89d0b);
            border-color: #9d7100;
        }

        /* =========================
           PERIOD / TIMER
        ========================== */

        .period-timer-card {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(145deg, #ffe45e 0%, #f1c638 55%, #e4ad25 100%);
            border: 0;
            border-radius: 20px;
            padding: 15px 17px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.4),
                0 7px 18px rgba(0,0,0,.2);
        }

        .period-timer-card::before {
            display: none;
        }

        .period-info,
        .timer-area {
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .period-info {
            flex: 1;
            max-width: 58%;
        }

        .timer-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .period-heading-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            width: 100%;
        }

        .period-heading {
            display: none;
        }

        .period-heading-group::before {
            content: "◷  Period:";
            color: #101820;
            font-size: 14px;
            line-height: 1;
            font-weight: 900;
            white-space: nowrap;
        }

        .period-number-display {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1px;
            width: 100%;
            min-width: 0;
            padding: 7px 12px;
            border: 2px solid #11191d;
            background: rgba(255,255,255,.12);
            border-radius: 24px;
            text-align: left;
            overflow: hidden;
            margin-top: 8px;
        }

        .period-digit {
            flex: 1 1 12px;
            min-width: 7px;
            height: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
            color: #11191d;
            font-family: monospace;
            font-size: clamp(8px, 2.5vw, 13px);
            font-weight: 900;
            text-shadow: none;
        }

        .period-digit::after {
            display: none;
        }

        .card-divider {
            display: none;
        }

        .timer-label {
            display: block;
            min-height: 0;
            padding: 0;
            margin: 0 0 6px;
            border: 0;
            background: transparent;
            color: #11191d;
            font-size: 15px;
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .timer-label::before {
            display: none;
        }

        .timer-label.timer-label-danger {
            color: #991b1b;
            background: transparent;
            border: 0;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative;
        }

        .digital-timer::after {
            display: none;
        }

        .timer-digit {
            width: 33px;
            height: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            background: #11191d;
            border: 1px solid #263137;
            box-shadow:
                inset 0 2px 3px rgba(255,255,255,.05),
                inset 0 -3px 4px rgba(0,0,0,.6);
            color: #f5f5f5;
            font-family: monospace;
            font-size: 28px;
            font-weight: 900;
            position: relative;
            overflow: hidden;
        }

        .timer-digit::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(255,255,255,.07);
            border: 0;
        }

        .timer-colon {
            color: #11191d;
            font-size: 25px;
            line-height: 1;
            font-weight: 900;
            padding: 0;
        }

        .digital-timer.timer-danger .timer-digit {
            background: #11191d;
            border-color: #263137;
            animation: dangerPulse 1s infinite;
        }

        .digital-timer.timer-danger .timer-colon {
            color: #991b1b;
        }

        /* =========================
           COLOR BUTTONS
        ========================== */

        .color-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .color-choice {
            height: 62px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.16),
                0 4px 8px rgba(0,0,0,.2);
        }

        .green-choice {
            background: linear-gradient(180deg, #00bd61, #00a852);
        }

        .violet-choice {
            background: linear-gradient(180deg, #a633ed, #9130dc);
        }

        .red-choice {
            background: linear-gradient(180deg, #f13349, #ec233e);
        }

        /* =========================
           NUMBER AREA
        ========================== */

        .number-area {
            background: #080f13;
            border: 1px solid #17252b;
            padding: 15px 10px;
            border-radius: 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.015);
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px 9px;
        }

        .number-button {
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            font-size: 27px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
            border-radius: 50% !important;
            border: 0 !important;
            padding: 0;
            overflow: hidden;
            box-shadow:
                inset 4px 5px 8px rgba(255,255,255,.34),
                inset -5px -7px 10px rgba(0,0,0,.5),
                0 4px 8px rgba(0,0,0,.35);
        }

        .number-button::before {
            content: "";
            position: absolute;
            width: 42%;
            height: 20%;
            top: 13%;
            left: 28%;
            border-radius: 50%;
            background: rgba(255,255,255,.52);
            filter: blur(2px);
        }

        .ruby-sphere {
            background: radial-gradient(circle at 35% 35%, #ff6672, #e82037 48%, #a40b1e 78%, #55030c);
            border: 0;
            color: #fff;
            text-shadow: 0 2px 2px rgba(0,0,0,.35);
        }

        .green-sphere {
            background: radial-gradient(circle at 35% 35%, #54f99b, #09b965 48%, #087a43 78%, #034226);
            border: 0;
            color: #fff;
            text-shadow: 0 2px 2px rgba(0,0,0,.35);
        }

        .violet-sphere {
            background: radial-gradient(circle at 35% 35%, #e7a8ff, #b537e9 48%, #7924ae 78%, #43135e);
            border: 0;
            color: #fff;
            text-shadow: 0 2px 2px rgba(0,0,0,.35);
        }

        .number-payout {
            display: none;
        }

        /* =========================
           BIG SMALL
        ========================== */

        .big-small-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-radius: 35px;
            overflow: hidden;
            height: 63px;
            box-shadow: 0 4px 10px rgba(0,0,0,.22);
        }

        .big-small-btn {
            border: 0;
            color: #fff;
            font-size: 19px;
            font-weight: 900;
            cursor: pointer;
        }

        .big-btn {
            background: linear-gradient(90deg, #ffae12, #ffb900);
        }

        .small-btn {
            background: linear-gradient(90deg, #408de8, #2f80df);
        }

        /* =========================
           CHIP BAR
        ========================== */

        .chips-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b1419;
            padding: 9px 8px;
            border-radius: 13px;
            border: 1px solid #1d2b31;
            gap: 8px;
            overflow-x: auto;
        }

        .action-group {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .action-chip {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            background: #1b272d;
            border: 1px solid #33434a;
            color: #cbd5e1;
            cursor: pointer;
            position: relative;
        }

        .action-chip:hover {
            background: #26353c;
            color: #fff;
        }

        .rebet-badge-2x {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 7px;
            font-weight: 700;
            background: #f59e0b;
            color: #0f172a;
            padding: 0 2px;
            border-radius: 3px;
        }

        .chips-group {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            padding: 1px 0;
        }

        .chip-item {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .15s;
            flex-shrink: 0;
            color: white;
            position: relative;
        }

        .chip-item:active {
            transform: scale(.92);
        }

        .chip-item.selected-chip {
            transform: scale(1.08);
            border-color: #fff !important;
            box-shadow: 0 0 0 2px rgba(255,255,255,.18);
        }

        .chip-20 {
            background: #0284c7;
            border: 1.5px solid #0369a1;
        }

        .chip-20::after,
        .chip-50::after,
        .chip-100::after,
        .chip-500::after,
        .chip-1k::after,
        .chip-10k::after {
            content: attr(data-text);
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.4);
        }

        .chip-20::after {
            background: #0284c7;
        }

        .chip-50 {
            background: #16a34a;
            border: 1.5px solid #15803d;
        }

        .chip-50::after {
            background: #16a34a;
        }

        .chip-100 {
            background: #e11d48;
            border: 1.5px solid #be123c;
        }

        .chip-100::after {
            background: #e11d48;
        }

        .chip-500 {
            background: #7c3aed;
            border: 1.5px solid #6d28d9;
        }

        .chip-500::after {
            background: #7c3aed;
        }

        .chip-1k {
            background: #d97706;
            border: 1.5px solid #b45309;
        }

        .chip-1k::after {
            background: #d97706;
        }

        .chip-10k {
            background: #881337;
            border: 1.5px solid #4c0519;
        }

        .chip-10k::after {
            background: #881337;
        }

        .bet-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #f59e0b;
            color: #0f172a;
            font-size: 8.5px;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,.5);
            z-index: 10;
            border: 1px solid #fff;
        }

        /* =========================
           HISTORY
        ========================== */

        .history-box {
            background: #0a1216;
            border: 1px solid #1d2b31;
            border-radius: 17px;
            padding: 10px;
            margin-top: 2px;
        }

        .history-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding-bottom: 7px;
            border-bottom: 1px solid #1b292f;
        }

        .history-tab {
            min-height: 42px;
            padding: 5px 3px;
            border: 0;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 800;
            color: #829099;
            background: #121d22;
        }

        .history-tab.active {
            background: linear-gradient(145deg, #d49f18, #e7bb34);
            color: #10171a;
        }

        .history-content {
            max-height: 300px;
            overflow: auto;
            background: transparent;
            padding-top: 5px;
        }

        .history-table {
            min-width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .history-table th,
        .history-table td {
            padding: 9px 6px;
            text-align: left;
            vertical-align: middle;
        }

        .history-table th {
            color: #77858d;
            font-size: 9px;
        }

        .history-table td {
            font-size: 10px;
            border-bottom: 1px solid rgba(38,52,59,.55);
        }

        .my-history-table {
            min-width: 850px;
            border-collapse: collapse;
            white-space: nowrap;
        }

        .my-history-table th,
        .my-history-table td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
        }

        .my-history-table th {
            background: transparent;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .my-history-table td {
            font-size: 11px;
        }

        .result-number {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 900;
            color: white;
        }

        .result-red {
            background: #e11d48;
            border: 2px solid #fb7185;
            box-shadow: 0 0 8px rgba(244,63,94,.25);
        }

        .result-green {
            background: #059669;
            border: 2px solid #34d399;
            box-shadow: 0 0 8px rgba(16,185,129,.25);
        }

        .result-violet {
            background: #7c3aed;
            border: 2px solid #a78bfa;
            box-shadow: 0 0 8px rgba(139,92,246,.25);
        }

        .result-badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 50px;
            font-size: 9.5px;
            font-weight: 800;
        }

        .date-cell {
            line-height: 1.5;
            color: #cbd5e1;
            font-size: 9.5px !important;
        }

        .history-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
        }

        /* =========================
           TREND
        ========================== */

        .trend-grid-container {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(6, minmax(0, 1fr));
            gap: 6px;
            overflow-x: auto;
            padding: 6px;
            justify-content: start;
        }

        .trend-ball {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            color: white;
            box-shadow:
                inset 0 2px 4px rgba(255,255,255,.4),
                0 2px 5px rgba(0,0,0,.5);
            flex-shrink: 0;
        }

        /* =========================
           WIN ANIMATION
        ========================== */

        .winning-blink {
            position: relative;
            z-index: 2;
            animation: winningBlink .45s ease-in-out 3;
        }

        .win-blink-green { --win-glow: rgba(34,255,130,.95); }
        .win-blink-red { --win-glow: rgba(255,65,95,.95); }
        .win-blink-violet { --win-glow: rgba(190,130,255,.95); }
        .win-blink-number { --win-glow: rgba(255,255,255,.95); }
        .win-blink-big { --win-glow: rgba(255,190,45,.95); }
        .win-blink-small { --win-glow: rgba(70,160,255,.95); }

        @keyframes winningBlink {
            0%, 100% {
                filter: brightness(1);
                box-shadow: 0 0 5px var(--win-glow, white);
                outline: 2px solid transparent;
                outline-offset: 1px;
            }
            50% {
                filter: brightness(1.5);
                box-shadow:
                    0 0 15px var(--win-glow, white),
                    0 0 28px var(--win-glow, white);
                outline: 2px solid var(--win-glow, white);
                outline-offset: 2px;
            }
        }

        .win-payout-overlay {
            position: absolute;
            inset: 0;
            background: rgba(16,185,129,.92);
            color: white;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: inherit;
            z-index: 20;
            animation: popWinAmount 2s ease forwards;
            text-shadow: 0 1px 2px rgba(0,0,0,.8);
        }

        @keyframes popWinAmount {
            0% { transform: scale(.8); opacity: 0; }
            20% { transform: scale(1.15); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes zoomOutResult {
            0% { transform: scale(1.2); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(.3); opacity: 0; }
        }

        .animate-zoom-out {
            animation: zoomOutResult 1.5s ease forwards;
        }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .72; }
        }

        /* =========================
           BOTTOM BAR
        ========================== */

        .bottom-fixed-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 768px;
            background: rgba(8,14,17,.96);
            backdrop-filter: blur(14px);
            border-top: 1px solid #27363c;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 40;
            font-size: 10px;
            min-height: 51px;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 430px) {
            .wallet-section {
                padding: 8px 13px 3px;
            }

                margin-left: 13px;

    </style>
</head>

<script>
    let currentUser = null;
    let userProfile = null;
    let selectedGameDuration = 15;
    let currentPeriodNumber = "2026101501";
    let timerSeconds = 15;
    let timerInterval = null;

    let activeTab = 'game-history';
    let selectedChartDuration = 15;
    let selectedChipAmount = 20;
    let lastPlacedBet = null;
    let currentRoundTotalBet = 0;
    let userActiveBets = [];

    document.addEventListener("DOMContentLoaded", async () => {
        renderPeriodNumber();

        currentUser = await requireAuth();

        if (currentUser) {
            await loadUserProfile();
            await ensureCurrentPeriodExists();
            startTimer();
            loadHistoryData('game-history');
            initRealtimeSubscription();
        }
    });

    async function ensureCurrentPeriodExists() {
        let { data: periodData, error } = await supabaseClient
            .from("color_periods")
            .select("*")
            .eq("period_number", currentPeriodNumber)
            .maybeSingle();

        if (!periodData) {
            await supabaseClient.from("color_periods").insert([{
                period_number: currentPeriodNumber,
                total_green_amount: 0,
                total_red_amount: 0,
                total_violet_amount: 0,
                status: 'pending'
            }]);
        }
    }

    function initRealtimeSubscription() {
        if (typeof supabaseClient !== 'undefined' && supabaseClient.channel) {
            supabaseClient
                .channel('public:color_periods_changes')
                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'color_periods'
                    },
                    payload => {
                        if (payload.new && payload.new.status === 'completed') {
                            if (activeTab) {
                                loadHistoryData(activeTab);
                            }
                        }
                    }
                )
                .subscribe();
        }

        setInterval(() => {
            if (activeTab &&
                (activeTab === 'chart' || activeTab === 'game-history')) {
                loadHistoryData(activeTab);
            }
        }, 5000);
    }

    function selectChip(amount, element) {
        selectedChipAmount = amount;

        document.querySelectorAll('.chip-item').forEach(el => {
            el.classList.remove('selected-chip');
        });

        element.classList.add('selected-chip');
    }

    async function undoLastBet() {
        if (timerSeconds <= 5) {
            alert("No More Bet! Undo is disabled.");
            return;
        }

        if (userActiveBets.length === 0) {
            alert("No active bet to undo for this round!");
            return;
        }

        let lastBet = userActiveBets.pop();

        let refundedBalance =
            Number(userProfile.balance) + lastBet.amount;

        const { error: profileError } = await supabaseClient
            .from("profiles")
            .update({ balance: refundedBalance })
            .eq("id", currentUser.id);

        if (profileError) {
            alert("Failed to undo bet. Try again.");
            userActiveBets.push(lastBet);
            return;
        }

        userProfile.balance = refundedBalance;

        let bal = refundedBalance.toFixed(2);

        document.getElementById("bar-user-balance").innerText = bal;

        const topBalance = document.getElementById("top-user-balance");
        if (topBalance) {
            topBalance.innerText = bal;
        }

        currentRoundTotalBet =
            Math.max(0, currentRoundTotalBet - lastBet.amount);

        document.getElementById("bar-total-bet").innerText =
            currentRoundTotalBet.toFixed(2);

        await supabaseClient
            .from("color_game_history")
            .delete()
            .eq("id", lastBet.db_id);

        await updatePeriodAmountsOnUndo(
            lastBet.amount,
            lastBet.target
        );

        updateBetBadgesUI();

        document.getElementById("game-status-text").innerText =
            "Last bet successfully undone.";
    }

    async function updatePeriodAmountsOnUndo(amount, target) {
        let { data: periodData } = await supabaseClient
            .from("color_periods")
            .select("*")
            .eq("period_number", currentPeriodNumber)
            .maybeSingle();

        if (periodData) {
            let updateField = {};

            if (target === 'Green') {
                updateField.total_green_amount =
                    Math.max(
                        0,
                        Number(periodData.total_green_amount) - amount
                    );
            } else if (target === 'Red') {
                updateField.total_red_amount =
                    Math.max(
                        0,
                        Number(periodData.total_red_amount) - amount
                    );
            } else if (target === 'Violet') {
                updateField.total_violet_amount =
                    Math.max(
                        0,
                        Number(periodData.total_violet_amount) - amount
                    );
            }

            await supabaseClient
                .from("color_periods")
                .update(updateField)
                .eq("period_number", currentPeriodNumber);
        }
    }

    async function rebetLast() {
        if (timerSeconds <= 5) {
            alert("No More Bet! Rebet is disabled.");
            return;
        }

        if (!lastPlacedBet) {
            alert("No previous bet to rebet!");
            return;
        }

        let doubledAmount = lastPlacedBet.amount * 2;

        if (doubledAmount > Number(userProfile.balance)) {
            alert("Insufficient balance for 2x rebet!");
            return;
        }

        executeBetPlacement(
            lastPlacedBet.target,
            doubledAmount
        );
    }

    function placeDirectBet(target) {
        if (timerSeconds <= 5) {
            document.getElementById("game-status-text").innerText =
                "No More Bet! Please wait for the next round.";
            return;
        }

        executeBetPlacement(
            target,
            selectedChipAmount
        );
    }

    async function executeBetPlacement(target, amount) {
        if (amount > Number(userProfile.balance)) {
            alert("Insufficient balance!");
            return;
        }

        let newBalance =
            Number(userProfile.balance) - amount;

        const { error: profileError } = await supabaseClient
            .from("profiles")
            .update({ balance: newBalance })
            .eq("id", currentUser.id);

        if (profileError) {
            alert("Failed to place bet. Try again.");
            return;
        }

        userProfile.balance = newBalance;

        let bal = newBalance.toFixed(2);

        document.getElementById("bar-user-balance").innerText = bal;

        const topBalance = document.getElementById("top-user-balance");
        if (topBalance) {
            topBalance.innerText = bal;
        }

        currentRoundTotalBet += amount;

        document.getElementById("bar-total-bet").innerText =
            currentRoundTotalBet.toFixed(2);

        const { data: insertedData, error: betInsertError } =
            await supabaseClient
                .from("color_game_history")
                .insert([{
                    user_id: currentUser.id,
                    period_number: currentPeriodNumber,
                    bet_type: target,
                    bet_amount: amount,
                    status: 'pending'
                }])
                .select();

        if (betInsertError) {
            console.error(
                "Bet history insert error:",
                betInsertError
            );

            alert(

    function highlightWinningTargets(
        winningColor,
        winningNumber,
        winningBigSmall
    ) {
        clearWinningHighlights();

        const colorClass = {
            Green: 'win-blink-green',
            Red: 'win-blink-red',
            Violet: 'win-blink-violet'
        };

        document
            .querySelectorAll(
                'button[onclick^="placeDirectBet("]'
            )
            .forEach(button => {

                const match =
                    button
                        .getAttribute('onclick')
                        ?.match(
                            /placeDirectBet\(['"]([^'"]+)['"]\)/
                        );

                if (!match) return;

                const target = match[1];

                let highlightClass = '';

                if (target === winningColor) {
                    highlightClass =
                        colorClass[winningColor] || '';

                } else if (
                    target === String(winningNumber)
                ) {
                    highlightClass =
                        'win-blink-number';

                } else if (
                    target === winningBigSmall
                ) {
                    highlightClass =
                        winningBigSmall === 'Big'
                            ? 'win-blink-big'
                            : 'win-blink-small';
                }

                if (highlightClass) {

                    button.classList.add(
                        'winning-blink',
                        highlightClass
                    );

                    button.addEventListener(
                        'animationend',
                        function removeBlink(event) {

                            if (
                                event.animationName !==
                                'winningBlink'
                            ) return;

                            button.classList.remove(
                                'winning-blink',
                                'win-blink-green',
                                'win-blink-red',
                                'win-blink-violet',
                                'win-blink-number',
                                'win-blink-big',
                                'win-blink-small'
                            );

                            button.removeEventListener(
                                'animationend',
                                removeBlink
                            );
                        }
                    );
                }
            });
    }

    function startTimer() {
        clearInterval(timerInterval);

        timerSeconds =
            selectedGameDuration;

        const timerElem =
            document.getElementById(
                "countdown-timer"
            );

        const timerLabel =
            document.getElementById(
                "timer-label"
            );

        function updateMainTimer() {

            if (!timerElem) return;

            const min =
                Math.floor(timerSeconds / 60);

            const sec =
                timerSeconds % 60;

            const timeText =
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            timerElem.innerHTML = `
                <span class="timer-digit">${timeText[0]}</span>
                <span class="timer-digit">${timeText[1]}</span>
                <span class="timer-colon">:</span>
                <span class="timer-digit">${timeText[3]}</span>
                <span class="timer-digit">${timeText[4]}</span>
            `;

            if (timerSeconds <= 5) {

                let centerStatusElem =
                    document.getElementById(
                        "bottom-bar-center-status"
                    );

                let statusSpan =
                    centerStatusElem.querySelector(
                        "span"
                    );

                if (
                    statusSpan &&
                    !statusSpan.classList.contains(
                        "animate-zoom-out"
                    )
                ) {

                    statusSpan.classList.add(
                        "animate-zoom-out"
                    );

                    setTimeout(() => {
                        centerStatusElem.innerHTML =
                            "";
                    }, 1500);
                }

                timerElem.classList.add(
                    "timer-danger"
                );

                if (timerLabel) {

                    timerLabel.innerText =
                        "NO MORE BET";

                    timerLabel.classList.add(
                        "timer-label-danger"
                    );
                }

                if (timerSeconds === 5) {
                    playVoiceMessage(
                        "No more bets"
                    );
                }

            } else {

                timerElem.classList.remove(
                    "timer-danger"
                );

                if (timerLabel) {

                    timerLabel.innerText =
                        "PLACE YOUR BET";

                    timerLabel.classList.remove(
                        "timer-label-danger"
                    );
                }
            }
        }

        updateMainTimer();

        timerInterval =
            setInterval(() => {

                timerSeconds =
                    Math.max(
                        0,
                        timerSeconds - 1
                    );

                updateMainTimer();

                if (timerSeconds <= 0) {

                    clearInterval(
                        timerInterval
                    );

                    processRoundResult();
                }

            }, 1000);
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(
                /[&<>"']/g,
                char => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[char]
            );
    }

    function getSavedBetResult(row) {

        let savedResult =
            String(
                row.winning_result || ''
            );

        let resultMatch =
            savedResult.match(
                /(Green|Red|Violet)\s*[-:]\s*(\d)/i
            );

        let color =
            resultMatch
                ? resultMatch[1]
                    .charAt(0)
                    .toUpperCase() +
                  resultMatch[1]
                    .slice(1)
                    .toLowerCase()
                : (
                    row.winning_color || ''
                );

        let number =
            resultMatch
                ? Number(resultMatch[2])
                : (
                    row.winning_number !== null &&
                    row.winning_number !== undefined &&
                    row.winning_number !== ''
                        ? Number(row.winning_number)
                        : null
                );

        if (
            ![
                'Green',
                'Red',
                'Violet'
            ].includes(color)
        ) {
            color = '';
        }

        let bigSmall =
            number !== null &&
            Number.isFinite(number)
                ? (
                    number >= 5
                        ? 'Big'
                        : 'Small'
                )
                : '';

        let colorClass =
            color === 'Red'
                ? 'result-red'
                : color === 'Green'
                    ? 'result-green'
                    : color === 'Violet'
                        ? 'result-violet'
                        : '';

        return {
            color,
            number,
            bigSmall,
            colorClass,
            hasResult:
                number !== null &&
                Number.isFinite(number) &&
                color !== ''
        };
    }

    function formatHistoryDate(dateValue) {

        if (!dateValue) {
            return {
                date: 'N/A',
                time: 'N/A'
            };
        }

        const date =
            new Date(dateValue);

        if (Number.isNaN(date.getTime())) {
            return {
                date: 'N/A',
                time: 'N/A'
            };
        }

        return {
            date: date.toLocaleDateString(
                'en-GB',
                {
                    timeZone: 'Asia/Dhaka',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }
            ),

            time: date.toLocaleTimeString(
                'en-GB',
                {
                    timeZone: 'Asia/Dhaka',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                }
            )
        };
    }

    async function updatePeriodAmounts(
        amount,
        target
    ) {

        let { data: periodData } =
            await supabaseClient
                .from("color_periods")
                .select("*")
                .eq(
                    "period_number",
                    currentPeriodNumber
                )
                .maybeSingle();

        if (!periodData) {

            await supabaseClient
                .from("color_periods")
                .insert([{
                    period_number:
                        currentPeriodNumber,

                    total_green_amount:
                        target === 'Green'
                            ? amount
                            : 0,

                    total_red_amount:
                        target === 'Red'
                            ? amount
                            : 0,

                    total_violet_amount:
                        target === 'Violet'
                            ? amount
                            : 0,

                    status: 'pending'
                }]);

        } else {

            let updateField = {};

            if (target === 'Green') {

                updateField.total_green_amount =
                    Number(
                        periodData.total_green_amount
                    ) + amount;

            } else if (target === 'Red') {

                updateField.total_red_amount =
                    Number(
                        periodData.total_red_amount
                    ) + amount;

            } else if (target === 'Violet') {

                updateField.total_violet_amount =
                    Number(
                        periodData.total_violet_amount
                    ) + amount;
            }

            await supabaseClient
                .from("color_periods")
                .update(updateField)
                .eq(
                    "period_number",
                    currentPeriodNumber
                );
        }
    }

    async function processRoundResult() {

        document.getElementById(
            "game-status-text"
        ).innerText =
            "Calculating result...";

        let { data: periodData } =
            await supabaseClient
                .from("color_periods")
                .select("*")
                .eq(
                    "period_number",
                    currentPeriodNumber
                )
                .maybeSingle();

        if (!periodData) {

            await ensureCurrentPeriodExists();

            let res =
                await supabaseClient
                    .from("color_periods")
                    .select("*")
                    .eq(
                        "period_number",
                        currentPeriodNumber
                    )
                    .maybeSingle();

            periodData = res.data;
        }

        let green =
            periodData
                ? Number(
                    periodData.total_green_amount || 0
                )
                : 0;

        let red =
            periodData
                ? Number(
                    periodData.total_red_amount || 0
                )
                : 0;

        let violet =
            periodData
                ? Number(
                    periodData.total_violet_amount || 0
                )
                : 0;

        let winningColor = 'Green';

        if (
            green === 0 &&
            red === 0 &&
            violet === 0
        ) {

            const randomColors = [
                'Green',
                'Red',
                'Green',
                'Red',
                'Violet'
            ];

            winningColor =
                randomColors[
                    Math.floor(
                        Math.random() *
                        randomColors.length
                    )
                ];

        } else {

            if (
                green <= red &&
                green <= violet
            ) {
                winningColor = 'Green';

            } else if (
                red <= green &&
                red <= violet
            ) {
                winningColor = 'Red';

            } else {
                winningColor = 'Violet';
            }
        }

        let numbersMap = {
            Green: [1, 3, 7, 9],
            Red: [2, 4, 6, 8],
            Violet: [0, 5]
        };

        let possibleNums =
            numbersMap[winningColor];

        let winningNumber =
            possibleNums[
                Math.floor(
                    Math.random() *
                    possibleNums.length
                )
            ];

        let winningBigSmall =
            winningNumber >= 5
                ? 'Big'
                : 'Small';

        let winningResultString =
            `${winningColor}-${winningNumber}`;

        await supabaseClient
            .from("color_periods")
            .update({
                winning_color:
                    winningColor,

                winning_number:
                    winningNumber,

                status:
                    'completed'
            })
            .eq(
                "period_number",
                currentPeriodNumber
            );

        let { data: allBets } =
            await supabaseClient
                .from("color_game_history")
                .select("*")
                .eq(
                    "period_number",
                    currentPeriodNumber
                )
                .eq(
                    "status",
                    'pending'
                );

        let userWonAmount = 0;
        let hasUserWon = false;
        let userParticipated = false;
        let userWinsMap = {};

        if (
            allBets &&
            allBets.length > 0
        ) {

            for (let bet of allBets) {

                let isWin = false;
                let multiplier = 2;

                if (
                    bet.bet_type === 'Red'
                ) {
                    multiplier = 1.9;

                } else if (
                    bet.bet_type === 'Violet'
                ) {
                    multiplier = 4.5;

                } else if (
                    bet.bet_type === 'Big' ||
                    bet.bet_type === 'Small'
                ) {
                    multiplier = 1.9;

                } else if (
                    !isNaN(bet.bet_type)
                ) {
                    multiplier = 9;
                }

                if (
                    bet.bet_type ===
                    winningColor
                ) {
                    isWin = true;

                } else if (
                    bet.bet_type ===
                    String(winningNumber)
                ) {
                    isWin = true;

                } else if (
                    bet.bet_type ===
                    winningBigSmall
                ) {
                    isWin = true;
                }

                if (
                    bet.user_id ===
                    currentUser.id
                ) {
                    userParticipated = true;
                }

                if (isWin) {

                    let payoutAmount =
                        bet.bet_amount *
                        multiplier;

                    if (
                        bet.user_id ===
                        currentUser.id
                    ) {

                        userWonAmount +=
                            payoutAmount;

                        hasUserWon = true;

                        let totalTargetWinReturn =
                            bet.bet_amount +
                            payoutAmount;

                        userWinsMap[
                            bet.bet_type
                        ] =
                            (
                                userWinsMap[
                                    bet.bet_type
                                ] || 0
                            ) +
                            totalTargetWinReturn;
                    }

                    await supabaseClient
                        .from("color_game_history")
                        .update({
                            winning_result:
                                winningResultString,

                            payout:
                                payoutAmount,

                            status:
                                'win'
                        })
                        .eq(
                            "id",
                            bet.id
                        );

                    let {
                        data: targetProfile
                    } =
                        await supabaseClient
                            .from("profiles")
                            .select("balance")
                            .eq(
                                "id",
                                bet.user_id
                            )
                            .single();

                    if (targetProfile) {

                        let updatedBal =
                            Number(
                                targetProfile.balance
                            ) +
                            payoutAmount;

                        await supabaseClient
                            .from("profiles")
                            .update({
                                balance:
                                    updatedBal
                            })
                            .eq(
                                "id",
                                bet.user_id
                            );
                    }

                } else {

                    await supabaseClient
                        .from("color_game_history")
                        .update({
                            winning_result:
                                winningResultString,

                            payout: 0,

                            status:
                                'loss'
                        })
                        .eq(
                            "id",
                            bet.id
                        );
                }
            }
        }

        currentRoundTotalBet = 0;
        userActiveBets = [];

        updateBetBadgesUI();

        document.getElementById(
            "bar-total-bet"
        ).innerText = "0.00";

        for (
            let target in userWinsMap
        ) {

            let btn =
                document.getElementById(
                    `btn-${target}`
                );

            if (btn) {

                let overlay =
                    document.createElement(
                        'div'
                    );

                overlay.className =
                    'win-payout-overlay';

                overlay.innerText =
                    `+৳${userWinsMap[target].toFixed(1)}`;

                btn.appendChild(
                    overlay
                );

                setTimeout(() => {
                    overlay.remove();
                }, 2000);
            }
        }

        document.getElementById(
            "game-status-text"
        ).innerText =
            `Result: ${winningResultString} (${winningBigSmall})`;

        highlightWinningTargets(
            winningColor,
            winningNumber,
            winningBigSmall
        );

        await loadUserProfile();

        let centerStatusElem =
            document.getElementById(
                "bottom-bar-center-status"
            );

        if (userParticipated) {

            if (hasUserWon) {

                centerStatusElem.innerHTML =
                    `<span class="text-emerald-400 inline-block">
                        Win ৳${userWonAmount.toFixed(2)}
                    </span>`;

                playVoiceMessage(
                    "congratulation winner"
                );

            } else {

                centerStatusElem.innerHTML =
                    `<span class="text-rose-500 inline-block">
                        Lost
                    </span>`;

                playVoiceMessage(
                    "better luck next time"
                );
            }

        } else {

            centerStatusElem.innerHTML = "";
        }

        currentPeriodNumber =
            String(
                parseInt(
                    currentPeriodNumber,
                    10
                ) + 1
            );

        renderPeriodNumber();

        await ensureCurrentPeriodExists();

        if (activeTab) {
            loadHistoryData(
                activeTab
            );
        }

        startTimer();
    }
</script>
