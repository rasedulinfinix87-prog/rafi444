<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Baccarat Casino</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      background: #121417;
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    .top-icon-btn {
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 13px;
    }

    .timer-ring {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: #ffffff;
    }

    /* Betting Boxes */
    .bet-box-player-pair { background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); border: 1.5px solid #3b82f6; border-radius: 12px; }
    .bet-box-tie { background: linear-gradient(135deg, #065f46 0%, #0f172a 100%); border: 1.5px solid #10b981; border-radius: 12px; }
    .bet-box-banker-pair { background: linear-gradient(135deg, #7f1d1d 0%, #0f172a 100%); border: 1.5px solid #ef4444; border-radius: 12px; }
    .bet-box-player { background: linear-gradient(135deg, #172554 0%, #090d16 100%); border: 2px solid #2563eb; border-radius: 14px; cursor: pointer; }
    .bet-box-banker { background: linear-gradient(135deg, #450a0a 0%, #090d16 100%); border: 2px solid #dc2626; border-radius: 14px; cursor: pointer; }

    /* Chips Row */
    .chip-item {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
      border: 2px dashed rgba(255,255,255,0.7);
    }
    .chip-item.active {
      border: 3px solid #facc15;
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
      z-index: 10;
    }
    .c-5 { background: #78716c; color: #fff; }
    .c-10 { background: #334155; color: #fff; }
    .c-20 { background: #1e3a8a; color: #fff; }
    .c-25 { background: #1e293b; color: #fff; border-color: #facc15; }
    .c-50 { background: #991b1b; color: #fff; }
    .c-100 { background: #0f172a; color: #fff; }
    .c-500 { background: #b45309; color: #fff; }

    .scoreboard-panel { background: #111418; border: 1px solid #1e293b; border-radius: 10px; }
    
    /* Smooth Card Dealing Animation Styles */
    .dealing-card {
      width: 30px;
      height: 42px;
      background: white;
      color: black;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px;
      font-size: 9px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateX(-50px) scale(0.5);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .dealing-card.deal-anim {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-2">

  <!-- Top Bar Container -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <main class="max-w-md w-full mx-auto flex flex-col flex-1 p-2 gap-2">

    <!-- Dealer Header Section with Avatar and Card Shoe on Left -->
    <div class="relative w-full h-40 rounded-2xl overflow-hidden shadow-2xl border border-amber-900/40 flex flex-col justify-between p-2.5 bg-gradient-to-b from-stone-900 to-black">
      
      <!-- Top Action Bar inside Dealer Frame -->
      <div class="relative z-10 w-full flex justify-between items-center">
        <button class="top-icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="flex items-center gap-2">
          <div class="timer-ring" id="timerDisplay">10</div>
          <button class="top-icon-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>

      <!-- Avatar & Shoe Desk Layout (Shoe on Left, Avatar in Center/Right) -->
      <div class="relative z-10 flex items-center justify-between px-1">
        <!-- Left Side: Acrylic Card Shoe Desk Graphic -->
        <div class="bg-black/60 border border-amber-500/30 px-2.5 py-1 rounded-lg backdrop-blur-sm flex items-center gap-1.5 shadow-inner">
          <i class="fa-solid fa-box-archive text-amber-400 text-xs"></i>
          <span class="text-[9px] font-bold text-amber-200">Shoe (8 Decks)</span>
        </div>

        <!-- Right Side: 3D Cartoon Female Avatar -->
        <div class="flex items-center gap-2">
          <div class="flex flex-col text-right">
            <span class="text-[11px] font-extrabold text-purple-300">Aria (Dealer)</span>
            <span class="text-[8px] text-emerald-400 font-bold">● Live</span>
          </div>
          <div class="w-10 h-10 rounded-full bg-purple-900 border-2 border-purple-400 overflow-hidden flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-user-ninja text-xl text-purple-200"></i>
          </div>
        </div>
      </div>

      <!-- Cards Dealing Area inside Dealer Table -->
      <div class="relative z-10 flex justify-between px-2 items-center h-10">
        <div class="flex gap-1 items-center" id="bankerCardSlot">
          <span class="text-[10px] text-red-400 font-bold">Banker:</span>
        </div>
        <div class="flex gap-1 items-center" id="playerCardSlot">
          <span class="text-[10px] text-blue-400 font-bold">Player:</span>
        </div>
      </div>
    </div>

    <!-- Main Betting Options (Player Pair, Tie, Banker Pair) -->
    <div class="grid grid-cols-3 gap-1.5">
      <div class="bet-box-player-pair p-1.5 flex flex-col items-center justify-center text-center h-14 shadow-lg">
        <span class="font-extrabold text-[10px] tracking-wide text-white leading-tight">PLAYER<br>PAIR</span>
        <span class="text-[9px] text-blue-300 font-bold mt-0.5">11:1</span>
      </div>
      <div class="bet-box-tie p-1.5 flex flex-col items-center justify-center text-center h-14 shadow-lg">
        <span class="font-extrabold text-[10px] tracking-wide text-white leading-tight">TIE</span>
        <span class="text-[9px] text-emerald-300 font-bold mt-0.5">8:1</span>
      </div>
      <div class="bet-box-banker-pair p-1.5 flex flex-col items-center justify-center text-center h-14 shadow-lg">
        <span class="font-extrabold text-[10px] tracking-wide text-white leading-tight">BANKER<br>PAIR</span>
        <span class="text-[9px] text-red-300 font-bold mt-0.5">11:1</span>
      </div>
    </div>

    <!-- Main Betting Boxes (Player & Banker) with Deal Trigger -->
    <div class="grid grid-cols-2 gap-1.5">
      <div onclick="makeBetAndDeal('player')" class="bet-box-player p-2.5 flex flex-col justify-between h-20 shadow-xl relative active:scale-95 transition">
        <div class="flex justify-between items-start">
          <span class="font-black text-xs tracking-wider text-white">PLAYER</span>
          <div class="w-5 h-5 rounded-full bg-blue-900/80 border border-blue-500 flex items-center justify-center text-[8px] font-bold text-blue-200">42%</div>
        </div>
        <div class="flex justify-between items-end">
          <span class="text-[10px] font-bold text-gray-300">1:1</span>
          <span id="playerBetAmount" class="text-xs font-black text-amber-300">৳ 0</span>
        </div>
      </div>

      <div onclick="makeBetAndDeal('banker')" class="bet-box-banker p-2.5 flex flex-col justify-between h-20 shadow-xl relative active:scale-95 transition">
        <div class="flex justify-between items-start">
          <div class="w-5 h-5 rounded-full bg-red-900/80 border border-red-500 flex items-center justify-center text-[8px] font-bold text-red-200">51%</div>
          <span class="font-black text-xs tracking-wider text-white">BANKER</span>
        </div>
        <div class="flex justify-between items-end">
          <span id="bankerBetAmount" class="text-xs font-black text-amber-300">৳ 0</span>
          <span class="text-[10px] font-bold text-gray-300">0.95:1</span>
        </div>
      </div>
    </div>

    <!-- Chips Selection Row (7 Chips) -->
    <div class="scoreboard-panel p-1.5 flex items-center justify-around shadow-md">
      <div class="chip-item c-5" onclick="selectChip(5, this)">5</div>
      <div class="chip-item c-10" onclick="selectChip(10, this)">10</div>
      <div class="chip-item c-20" onclick="selectChip(20, this)">20</div>
      <div class="chip-item c-25 active" onclick="selectChip(25, this)" id="defaultActiveChip">25</div>
      <div class="chip-item c-50" onclick="selectChip(50, this)">50</div>
      <div class="chip-item c-100" onclick="selectChip(100, this)">100</div>
      <div class="chip-item c-500" onclick="selectChip(500, this)">500</div>
    </div>

    <!-- Scoreboard and Prediction Section -->
    <div class="scoreboard-panel p-2.5 flex gap-3 justify-between items-center shadow-md">
      <div class="grid grid-cols-6 gap-1 p-1 bg-black/40 rounded-lg">
        <span class="bg-red-500 w-2.5 h-2.5 rounded-full inline-block"></span>
        <span class="bg-red-500 w-2.5 h-2.5 rounded-full inline-block"></span>
        <span class="bg-blue-500 w-2.5 h-2.5 rounded-full inline-block"></span>
        <span class="bg-blue-500 w-2.5 h-2.5 rounded-full inline-block"></span>
        <span class="bg-red-500 w-2.5 h-2.5 rounded-full inline-block"></span>
        <span class="bg-emerald-500 w-2.5 h-2.5 rounded-full inline-block"></span>
      </div>

      <div class="flex flex-col gap-1.5 flex-1">
        <div class="flex justify-between items-center text-[10px] font-bold px-1">
          <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500"></span> 8</div>
          <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 5</div>
          <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 2</div>
        </div>
        <button class="bg-[#21262d] border border-slate-700 rounded-full py-1 px-2.5 flex justify-between items-center text-[10px] font-bold text-gray-200 shadow">
          <span>Ask Player Prediction</span>
          <div class="flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
          </div>
        </button>
      </div>
    </div>

    <!-- Bottom Limit & Balance Bar -->
    <div class="flex justify-between items-center text-[10px] px-2 text-gray-400 font-semibold pt-1">
      <span>Bet limit: 10-500</span>
      <span>Balance: <strong id="footerBalance" class="text-white">1.108.654$</strong></span>
      <span>Total bet: <strong id="totalBet" class="text-amber-400">250</strong></span>
    </div>

  </main>

  <script>
    let selectedChip = 25;
    let playerTotalBet = 0;
    let bankerTotalBet = 0;

    async function loadTopBar() {
      try {
        const res = await fetch('../bar/top.html');
        if (res.ok) {
          document.getElementById('topBarContainer').innerHTML = await res.text();
          document.querySelectorAll('a[href*="deposit"]').forEach(a => {
            a.href = '../account/deposit.html';
          });
        }
      } catch (e) {
        console.error('Top bar load error:', e);
      }
    }

    function selectChip(val, el) {
      selectedChip = val;
      document.querySelectorAll('.chip-item').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    function makeBetAndDeal(type) {
      if (type === 'player') {
        playerTotalBet += selectedChip;
        document.getElementById('playerBetAmount').innerText = '৳ ' + playerTotalBet;
      } else {
        bankerTotalBet += selectedChip;
        document.getElementById('bankerBetAmount').innerText = '৳ ' + bankerTotalBet;
      }

      document.getElementById('totalBet').innerText = playerTotalBet + bankerTotalBet;
      triggerCardDealingAnimation();
    }

    function triggerCardDealingAnimation() {
      const playerSlot = document.getElementById('playerCardSlot');
      const bankerSlot = document.getElementById('bankerCardSlot');

      playerSlot.innerHTML = '<span class="text-[10px] text-blue-400 font-bold">Player:</span>';
      bankerSlot.innerHTML = '<span class="text-[10px] text-red-400 font-bold">Banker:</span>';

      setTimeout(() => {
        bankerSlot.innerHTML += `<div class="dealing-card deal-anim text-red-600"><span>8</span><span>♥</span><span>8</span></div>`;
      }, 200);

      setTimeout(() => {
        playerSlot.innerHTML += `<div class="dealing-card deal-anim text-black"><span>9</span><span>♠</span><span>9</span></div>`;
      }, 600);
    }

    window.onload = async () => {
      await loadTopBar();
    };
  </script>
</body>
</html>
