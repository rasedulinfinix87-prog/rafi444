<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turbo Baccarat</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      background: #111418;
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    .table-felt {
      background: radial-gradient(circle at center, #d4af37 0%, #4a380e 100%);
      border: 2px solid #6b5314;
    }

    .glass-panel {
      background: #171d28;
      border: 1px solid #222b3a;
    }

    /* Scoreboard Roadmap Grid */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 1px;
      background: #e2e8f0;
      padding: 1px;
      border-radius: 4px;
    }
    .score-cell {
      aspect-ratio: 1/1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
    }
    .score-p { color: #2563eb; background: #eff6ff; border-radius: 50%; border: 1.5px solid #2563eb; width: 85%; height: 85%; margin: auto; }
    .score-b { color: #dc2626; background: #fef2f2; border-radius: 50%; border: 1.5px solid #dc2626; width: 85%; height: 85%; margin: auto; }
    .score-t { color: #16a34a; background: #f0fdf4; border-radius: 50%; border: 1.5px solid #16a34a; width: 85%; height: 85%; margin: auto; }

    /* Professional Playing Card Design */
    .playing-card {
      width: 38px;
      height: 52px;
      background: #ffffff;
      color: #111;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px;
      font-size: 11px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      border: 1px solid #cbd5e1;
    }
    .card-red { color: #dc2626; }
    .card-black { color: #0f172a; }

    /* Exact Matching Card Shapes & Colors */
    .baccarat-card-player {
      background: #0d47a1;
      border: 2px solid #2196f3;
      border-radius: 20px 20px 16px 16px;
    }

    .baccarat-card-banker {
      background: #b71c1c;
      border: 2px solid #f44336;
      border-radius: 20px 20px 16px 16px;
    }

    .baccarat-card-tie {
      background: #00c853;
      border: 2px solid #69f0ae;
      border-top-left-radius: 35px;
      border-top-right-radius: 35px;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
    }

    /* Overlapping Chip Stack Styling */
    .chip-wrapper {
      position: relative;
      width: 90px;
      height: 46px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .stacked-chip {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.6);
      border: 2px dashed rgba(255,255,255,0.8);
    }
    .chip-orange { background: #d97706; color: #fff; left: 0px; z-index: 1; }
    .chip-red-active { background: #ef4444; color: #fff; border: 2.5px solid #ffffff; z-index: 10; transform: scale(1.12); box-shadow: 0 0 12px rgba(239, 68, 68, 0.9); }
    .chip-blue { background: #2563eb; color: #fff; right: 0px; z-index: 1; }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-thumb { background: #222b3a; border-radius: 2px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-3">

  <!-- Top Bar Container -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <main class="max-w-md w-full mx-auto flex flex-col flex-1 p-2 gap-2">

    <!-- Dealer / Table Video Area & Professional Cards Display -->
    <div class="relative w-full rounded-xl overflow-hidden shadow-xl table-felt flex flex-col items-center justify-between p-3 gap-2">
      <div class="absolute inset-0 bg-black/25 pointer-events-none"></div>
      
      <div class="relative z-10 w-full flex justify-between items-center text-[10px] text-amber-200 font-bold px-1">
        <span>Turbo Baccarat | Casino Royale</span>
        <span class="bg-black/60 px-2 py-0.5 rounded">ID: 7789547126</span>
      </div>

      <!-- Professional Playing Cards Layout -->
      <div class="relative z-10 flex items-center justify-center gap-3 py-1">
        <!-- Banker Cards -->
        <div class="flex gap-1 items-center">
          <div class="playing-card card-red" id="bankerCard1">
            <span>A</span><span class="text-center text-xs">♥</span><span>A</span>
          </div>
          <div class="playing-card card-black" id="bankerCard2">
            <span>K</span><span class="text-center text-xs">♠</span><span>K</span>
          </div>
        </div>
        
        <!-- Center Countdown Timer -->
        <div class="w-10 h-10 rounded-full bg-black/85 border-2 border-red-500 flex items-center justify-center shadow-lg mx-1">
          <span id="countdownTimer" class="text-sm font-black text-white">3</span>
        </div>

        <!-- Player Cards -->
        <div class="flex gap-1 items-center">
          <div class="playing-card card-red" id="playerCard1">
            <span>7</span><span class="text-center text-xs">♦</span><span>7</span>
          </div>
          <div class="playing-card card-black" id="playerCard2">
            <span>8</span><span class="text-center text-xs">♣</span><span>8</span>
          </div>
        </div>
      </div>

      <div class="relative z-10 flex justify-between w-full px-6 text-[11px] font-bold text-amber-100">
        <span style="color:#f87171">Banker</span>
        <span style="color:#60a5fa">Player</span>
      </div>
    </div>

    <!-- Scoreboard (Roadmap) Section -->
    <div class="glass-panel p-2 rounded-xl flex flex-col gap-1.5 shadow-md">
      <div class="flex justify-between items-center text-[10px] text-gray-400 font-bold px-1">
        <span>ROADMAP SCOREBOARD</span>
        <div class="flex gap-3">
          <span class="text-blue-500">P: <strong id="countP">0</strong></span>
          <span class="text-red-500">B: <strong id="countB">0</strong></span>
          <span class="text-green-500">T: <strong id="countT">0</strong></span>
        </div>
      </div>
      <div class="score-grid" id="scoreGrid"></div>
    </div>

    <!-- Round Stats & Side Bets Row -->
    <div class="flex items-center justify-between text-[10px] bg-[#171d28] border border-[#222b3a] px-2 py-1 rounded-lg font-bold text-gray-300">
      <span class="text-amber-400" id="handNumberDisplay">#35</span>
      <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span> P 15</div>
      <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span> B 15</div>
      <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span> T 5</div>
    </div>

    <!-- 6 Side Bets Grid -->
    <div class="grid grid-cols-6 gap-1 text-[8.5px] font-bold text-center">
      <div class="bg-[#1e40af] border border-blue-400 rounded-lg py-1.5 px-0.5 flex flex-col justify-center shadow">
        <span class="text-white">PLAYER PAIR</span>
        <span class="text-blue-200 text-[9px] mt-0.5">11:1</span>
      </div>
      <div class="bg-[#1d4ed8] border border-blue-400 rounded-lg py-1.5 px-0.5 flex flex-col justify-center shadow">
        <span class="text-white">PLAYER BONUS</span>
        <span class="text-blue-200 text-[9px] mt-0.5">30:1</span>
      </div>
      <div class="bg-[#b45309] border border-amber-400 rounded-lg py-1.5 px-0.5 flex flex-col justify-center shadow">
        <span class="text-white">PERFECT PAIR</span>
        <span class="text-amber-200 text-[9px] mt-0.5">25:1</span>
      </div>
      <div class="bg-[#c2410c] border border-orange-400 rounded-lg py-1.5 px-0.5 flex flex-col justify-center shadow">
        <span class="text-white">EITHER PAIR</span>
        <span class="text-orange-200 text-[9px] mt-0.5">5:1</span>
      </div>
      <div class="bg-[#b91c1c] border border-red-400 rounded-lg py-1.5 px-0.5 flex flex-col justify-center shadow">
        <span class="text-white">BANKER BONUS</span>
        <span class="text-red-200 text-[9px] mt-0.5">30:1</span>
      </div>
      <div class="bg-[#dc2626] border border-red-400 rounded-lg py-1.5 px-0.5 flex flex-col justify-center shadow">
        <span class="text-white">BANKER PAIR</span>
        <span class="text-red-200 text-[9px] mt-0.5">11:1</span>
      </div>
    </div>

    <!-- Main Exact Shaped Baccarat Betting Cards -->
    <div class="grid grid-cols-3 gap-2">
      <div onclick="placeBet('player')" class="baccarat-card-player p-2.5 flex flex-col items-center justify-between shadow-xl h-32 cursor-pointer active:scale-95 transition">
        <span class="font-black text-xs tracking-wider text-white">PLAYER</span>
        <div class="text-[10px] font-bold text-white">1 : 1</div>
        <span id="betPlayerAmount" class="text-xs font-black text-amber-300">0</span>
      </div>

      <div onclick="placeBet('tie')" class="baccarat-card-tie p-2.5 flex flex-col items-center justify-between shadow-xl h-32 cursor-pointer active:scale-95 transition">
        <span class="font-black text-xs tracking-wider text-white">TIE</span>
        <div class="text-[10px] font-bold text-white">8 : 1</div>
        <span id="betTieAmount" class="text-xs font-black text-amber-300">0</span>
      </div>

      <div onclick="placeBet('banker')" class="baccarat-card-banker p-2.5 flex flex-col items-center justify-between shadow-xl h-32 cursor-pointer active:scale-95 transition">
        <span class="font-black text-xs tracking-wider text-white">BANKER</span>
        <div class="text-[10px] font-bold text-white">0.95 : 1</div>
        <span id="betBankerAmount" class="text-xs font-black text-amber-300">0</span>
      </div>
    </div>

    <!-- Bottom Utility Bar & Stacked Chips -->
    <div class="glass-panel p-2 rounded-xl flex items-center justify-between shadow-lg">
      <button class="w-9 h-9 rounded-xl bg-[#222b3a] flex items-center justify-center text-gray-300 relative shadow">
        <i class="fa-solid fa-layer-group text-xs"></i>
        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-black px-1 py-0.2 rounded-full">13</span>
      </button>

      <button onclick="clearBets()" class="w-9 h-9 rounded-xl bg-[#222b3a] hover:bg-[#323f56] flex items-center justify-center text-gray-300 shadow transition">
        <i class="fa-solid fa-rotate-left text-xs"></i>
      </button>

      <!-- Center Overlapping Chip Stack Selection -->
      <div class="chip-wrapper" onclick="cycleChipValue()">
        <div class="stacked-chip chip-orange">10</div>
        <div class="stacked-chip chip-red-active" id="activeChipDisp">20</div>
        <div class="stacked-chip chip-blue">50</div>
      </div>

      <button onclick="openMenu()" class="w-9 h-9 rounded-xl bg-[#222b3a] hover:bg-[#323f56] flex items-center justify-center text-gray-300 shadow transition">
        <i class="fa-solid fa-rotate text-xs"></i>
      </button>

      <button onclick="openMenu()" class="w-9 h-9 rounded-xl bg-[#222b3a] hover:bg-[#323f56] flex items-center justify-center text-gray-300 shadow transition">
        <i class="fa-solid fa-bars text-xs"></i>
      </button>
    </div>

  </main>

  <script>
    let selectedChipValue = 20;
    let currentBets = { player: 0, banker: 0, tie: 0 };
    let scoreHistory = ['P', 'B', 'P', 'P', 'P', 'P', 'B', 'B', 'B', 'P', 'B', 'P', 'B', 'P', 'T', 'P', 'B', 'P', 'B', 'T', 'P', 'T', 'B', 'P', 'B', 'P', 'B', 'P', 'B', 'P', 'B', 'P', 'B', 'P', 'B', 'P', 'B', 'P', 'B', 'T'];

    async function loadTopBar() {
      try {
        const res = await fetch('../bar/top.html');
        if (res.ok) {
          document.getElementById('topBarContainer').innerHTML = await res.text();
          document.querySelectorAll('a[href*="deposit"]').forEach(a => {
            a.href = '../account/deposit.html';
          });
        }
      } catch (e) {
        console.error('Top bar load error:', e);
      }
    }

    function cycleChipValue() {
      const chips = [10, 20, 50, 100];
      let idx = chips.indexOf(selectedChipValue);
      idx = (idx + 1) % chips.length;
      selectedChipValue = chips[idx];
      document.getElementById('activeChipDisp').innerText = selectedChipValue;
    }

    function placeBet(type) {
      currentBets[type] += selectedChipValue;
      document.getElementById('betPlayerAmount').innerText = currentBets.player || 0;
      document.getElementById('betTieAmount').innerText = currentBets.tie || 0;
      document.getElementById('betBankerAmount').innerText = currentBets.banker || 0;
    }

    function clearBets() {
      currentBets = { player: 0, banker: 0, tie: 0 };
      document.getElementById('betPlayerAmount').innerText = 0;
      document.getElementById('betTieAmount').innerText = 0;
      document.getElementById('betBankerAmount').innerText = 0;
    }

    function openMenu() {
      alert('মেনু এবং সেটিংস অপশন');
    }

    function initScoreGrid() {
      const grid = document.getElementById('scoreGrid');
      grid.innerHTML = '';
      let pCount = 0, bCount = 0, tCount = 0;

      for (let i = 0; i < 120; i++) {
        const cell = document.createElement('div');
        cell.className = 'score-cell';
        if (i < scoreHistory.length) {
          const res = scoreHistory[i];
          const innerSpan = document.createElement('span');
          innerSpan.innerText = res;
          innerSpan.className = res === 'P' ? 'score-p flex items-center justify-center' : res === 'B' ? 'score-b flex items-center justify-center' : 'score-t flex items-center justify-center';
          cell.appendChild(innerSpan);

          if (res === 'P') pCount++;
          else if (res === 'B') bCount++;
          else if (res === 'T') tCount++;
        }
        grid.appendChild(cell);
      }

      document.getElementById('countP').innerText = pCount;
      document.getElementById('countB').innerText = bCount;
      document.getElementById('countT').innerText = tCount;
    }

    window.onload = async () => {
      await loadTopBar();
      initScoreGrid();
    };
  </script>
</body>
</html>
