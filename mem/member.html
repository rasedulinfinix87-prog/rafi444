<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Account</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    :root {
      --font-xs: 11px;
      --font-sm: 12px;
      --font-base: 14px;
      --font-md: 16px;
      --font-lg: 18px;
      --font-xl: 22px;
      --font-2xl: 28px;
      --font-3xl: 32px;
    }

    * { -webkit-tap-highlight-color: transparent; }
    html { background: #0F212E; }
    body { background: #0F212E; color: #FFFFFF; font-size: var(--font-base); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0F212E; }
    ::-webkit-scrollbar-thumb { background: #1A2C38; border-radius: 8px; }
    .profile-card-bg { background: #1A2C38; border: 1px solid #0F212E; }
    .menu-card { background: #1A2C38; border: 1px solid #0F212E; border-radius: 15px; overflow: hidden; }
    .menu-row { min-height: 61px; display: flex; align-items: center; gap: 13px; padding: 12px 15px; width: 100%; text-align: left; }
    .menu-row + .menu-row { border-top: 1px solid #0F212E; }
    .menu-icon { width: 24px; flex: 0 0 24px; color: #FFFFFF; text-align: center; font-size: var(--font-lg); }
    .menu-label { color: #FFFFFF; font-size: var(--font-base); font-weight: 650; flex: 1; }
    .chevron-box { width: 35px; height: 35px; border-radius: 9px; background: #0F212E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: var(--font-base); }
    .shortcut { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 78px; border-radius: 10px; color: #FFFFFF; font-size: var(--font-xs); font-weight: 650; }
    .shortcut i { color: #FFFFFF; font-size: 23px; }
    .shortcut:active, .menu-row:active { background: rgba(255,255,255,.045); }
    .theme-switch { display:flex; align-items:center; padding:3px; background:#0F212E; border-radius:12px; }
    .theme-switch button { width:46px; height:42px; border-radius:10px; color:#FFFFFF; }
    .theme-switch button.active { background:#1A2C38; color:#FFFFFF; box-shadow:0 1px 3px #1116; }
    .avatar-button { cursor:pointer; }
    .avatar-button:focus-visible { outline:2px solid #34d399; outline-offset:3px; }
    .avatar-option { border:1px solid #0F212E; border-radius:13px; background:#1A2C38; padding:10px 5px; display:flex; flex-direction:column; align-items:center; gap:7px; color:#FFFFFF; font-size: var(--font-xs); font-weight:700; }
    .avatar-option.selected { border-color:#34d399; background:#173d32; box-shadow:0 0 0 1px #34d399 inset; }
    .avatar-option img { width:54px; height:54px; border-radius:50%; background:#1A2C38; }
  </style>
</head>

<body class="font-sans min-h-screen flex flex-col items-center justify-start p-0 select-none antialiased">
  <div class="w-full max-w-md min-h-screen flex flex-col overflow-x-hidden shadow-2xl relative">

    <!-- Top Header -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#1A2C38]/95 backdrop-blur-md sticky top-0 z-40 border-b border-[#0F212E]">
      <a href="../index.html" class="p-2 text-[#FFFFFF] hover:text-white transition" aria-label="Back">
        <i class="fa-solid fa-arrow-left text-[var(--font-lg)]"></i>
      </a>
      <h1 class="text-[var(--font-base)] font-bold text-[#FFFFFF] tracking-wide">My Account</h1>
      <div class="w-8"></div>
    </header>

    <main class="px-3 py-3 flex-1 flex flex-col gap-4">

      <!-- Profile & Account Status Card -->
      <div class="profile-card-bg border border-[#0F212E] text-[#FFFFFF] rounded-2xl p-4 shadow-xl relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 text-white/5 text-8xl pointer-events-none">
          <i class="fa-solid fa-crown"></i>
        </div>

        <div class="flex items-center gap-3">
          <button type="button" class="avatar-button relative w-14 h-14 rounded-full overflow-hidden border-2 border-emerald-400 bg-[#1A2C38] shrink-0 flex items-center justify-center" onclick="openAvatarPicker()" aria-label="Choose avatar" title="Choose avatar">
            <img id="userAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=male" alt="Selected avatar" class="w-full h-full object-cover">
            <span class="absolute inset-0 bg-black/0 hover:bg-black/20 flex items-center justify-center"><i class="fa-solid fa-pen text-[#FFFFFF] text-[var(--font-xs)] opacity-0 hover:opacity-100"></i></span>
          </button>

          <div class="flex flex-col gap-1 min-w-0">
            <span class="bg-[#0F212E] text-amber-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full border border-amber-300/20 w-fit">
              <i class="fa-solid fa-crown text-[9px] mr-1"></i> VIP 1
            </span>

            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-[var(--font-xs)] text-[#FFFFFF] font-medium shrink-0">GAME ID:</span>
              <span id="userGameId" class="text-[var(--font-sm)] text-emerald-400 font-bold truncate">----</span>
              <button type="button" onclick="copyGameId()" class="text-[#FFFFFF] hover:text-white text-[var(--font-sm)] p-1" aria-label="Copy Game ID" title="Copy Game ID">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>

            <span id="userJoined" class="text-[10px] text-[#FFFFFF] font-semibold">Joined: ----</span>

            <button type="button" onclick="openAvatarPicker()" class="text-left text-[var(--font-xs)] text-emerald-400 font-semibold mt-0.5">
              <i class="fa-solid fa-user-pen mr-1"></i> Change Avatar
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between mt-4 border-t border-[#0F212E] pt-3">
          <div class="flex items-baseline gap-1">
            <span class="text-[var(--font-lg)] font-bold text-emerald-400">৳</span>
            <span id="userBalance" class="text-[var(--font-2xl)] font-black text-emerald-400 tracking-tight">0.00</span>
          </div>

          <button type="button" onclick="syncMemberBalance()" class="text-[#FFFFFF] hover:text-white text-[var(--font-base)] p-2 transition" aria-label="Refresh balance">
            <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2 mt-4">
          <a href="../account/deposit.html" class="bg-[#0F212E] text-[#FFFFFF] font-extrabold text-[var(--font-xs)] py-3 px-1 rounded-xl border border-[#0F212E] text-center flex items-center justify-center gap-1.5 active:scale-95">
            <i class="fa-solid fa-wallet text-emerald-400"></i> Deposit
          </a>

          <a href="../account/withdraw.html" class="bg-[#0F212E] text-[#FFFFFF] font-extrabold text-[var(--font-xs)] py-3 px-1 rounded-xl border border-[#0F212E] text-center flex items-center justify-center gap-1.5 active:scale-95">
            <i class="fa-solid fa-money-bill-transfer text-amber-400"></i> Withdrawal
          </a>

          <a href="../account/profile.html" class="bg-[#0F212E] text-[#FFFFFF] font-extrabold text-[var(--font-xs)] py-3 px-1 rounded-xl border border-[#0F212E] text-center flex items-center justify-center gap-1 leading-tight active:scale-95">
            <i class="fa-solid fa-building-columns text-sky-400"></i> Bank Account
          </a>
        </div>
      </div>

      <!-- Account shortcuts -->
      <section class="menu-card px-3 py-3">
        <div class="grid grid-cols-4 gap-x-1 gap-y-2">
          <a href="../account/vault.html" class="shortcut"><i class="fa-solid fa-vault"></i><span>Vault Pro</span></a>
          <a href="../account/transactions.html" class="shortcut"><i class="fa-solid fa-receipt"></i><span>Transaction</span></a>
          <a href="../account/rollover.html" class="shortcut"><i class="fa-solid fa-chart-column"></i><span>Rollover</span></a>
          <a href="../account/bet-history.html" class="shortcut"><i class="fa-solid fa-clock-rotate-left"></i><span>Bet History</span></a>
          <a href="../account/free-plays.html" class="shortcut"><i class="fa-solid fa-coins"></i><span>Free Plays</span></a>
        </div>
      </section>

      <!-- Notifications -->
      <section class="menu-card">
        <a href="../account/notifications.html" class="menu-row">
          <i class="menu-icon fa-regular fa-bell"></i>
          <span class="menu-label">Notification</span>
          <span class="bg-emerald-400 text-[#062018] text-[var(--font-xs)] font-black rounded-full px-2 py-0.5">10</span>
          <span class="chevron-box"><i class="fa-solid fa-chevron-right"></i></span>
        </a>
      </section>

      <!-- Global settings -->
      <section class="menu-card">
        <a href="../account/settings.html" class="menu-row">
          <i class="menu-icon fa-solid fa-gear"></i>
          <span class="menu-label">Global Setting</span>
          <i class="fa-solid fa-circle-exclamation text-amber-400 text-[var(--font-base)] mr-1"></i>
          <span class="chevron-box"><i class="fa-solid fa-chevron-right"></i></span>
        </a>

        <button type="button" class="menu-row" onclick="cycleLanguage()">
          <i class="menu-icon fa-solid fa-language"></i>
          <span class="menu-label">Language</span>
          <span id="languageValue" class="text-[var(--font-base)] text-[#FFFFFF] mr-1">English</span>
          <span class="chevron-box"><i class="fa-solid fa-chevron-right"></i></span>
        </button>

        <div class="menu-row">
          <i class="menu-icon fa-solid fa-palette"></i>
          <span class="menu-label">Theme</span>
          <div class="theme-switch">
            <button id="darkThemeBtn" type="button" class="active" onclick="setTheme('dark')" aria-label="Dark theme">
              <i class="fa-solid fa-moon"></i>
            </button>
            <button id="lightThemeBtn" type="button" onclick="setTheme('light')" aria-label="Light theme">
              <i class="fa-solid fa-sun"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- Support -->
      <section class="menu-card">
        <a href="../account/support.html" class="menu-row">
          <i class="menu-icon fa-solid fa-headset text-emerald-400"></i>
          <span class="menu-label">Live Support</span>
          <span class="chevron-box"><i class="fa-solid fa-chevron-right"></i></span>
        </a>
      </section>

    </main>

    <footer class="py-4 text-center text-[var(--font-xs)] text-[#FFFFFF] border-t border-[#0F212E]">
      &copy; 2026 Gaming Portal. All Rights Reserved.
    </footer>
  </div>

  <!-- Avatar Picker Modal -->
  <div id="avatarModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/70 p-4" role="dialog" aria-modal="true" aria-labelledby="avatarModalTitle" onclick="if(event.target===this) closeAvatarPicker()">
    <div class="w-full max-w-sm rounded-2xl border border-[#0F212E] bg-[#1A2C38] p-4 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h2 id="avatarModalTitle" class="text-[var(--font-base)] font-extrabold text-[#FFFFFF]">Choose Your Avatar</h2>
        <button type="button" onclick="closeAvatarPicker()" class="w-9 h-9 rounded-lg bg-[#0F212E] text-[#FFFFFF]" aria-label="Close avatar picker">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="avatar-option" data-avatar="male" onclick="selectAvatar('male')">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=male&top=shortHair" alt="Male avatar"><span>Male</span>
        </button>

        <button type="button" class="avatar-option" data-avatar="female" onclick="selectAvatar('female')">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=female&top=longHair" alt="Female avatar"><span>Female</span>
        </button>

        <button type="button" class="avatar-option" data-avatar="queen" onclick="selectAvatar('queen')">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=queen&accessories=round" alt="Queen avatar"><span>Queen</span>
        </button>

        <button type="button" class="avatar-option" data-avatar="king" onclick="selectAvatar('king')">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=king&top=hat" alt="King avatar"><span>King</span>
        </button>

        <button type="button" class="avatar-option" data-avatar="rockman" onclick="selectAvatar('rockman')">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=rockman" alt="Rockman avatar"><span>Rockman</span>
        </button>
      </div>

      <p class="text-[var(--font-xs)] text-[#FFFFFF] mt-3">Your selection is saved on this device.</p>

      <button type="button" onclick="closeAvatarPicker()" class="mt-4 w-full rounded-xl bg-emerald-500 py-3 text-[var(--font-base)] font-extrabold text-[#062018]">
        Done
      </button>
    </div>
  </div>

  <script>
    const AVATAR_URLS = {
      male: 'https://api.dicebear.com/7.x/avataaars/svg?seed=male&top=shortHair',
      female: 'https://api.dicebear.com/7.x/avataaars/svg?seed=female&top=longHair',
      queen: 'https://api.dicebear.com/7.x/avataaars/svg?seed=queen&accessories=round',
      king: 'https://api.dicebear.com/7.x/avataaars/svg?seed=king&top=hat',
      rockman: 'https://api.dicebear.com/7.x/bottts/svg?seed=rockman'
    };

    function applySavedAvatar() {
      let selected = 'male';

      try {
        const saved = localStorage.getItem('selected_account_avatar');

        if (saved && Object.prototype.hasOwnProperty.call(AVATAR_URLS, saved)) {
          selected = saved;
        }
      } catch (e) {
        console.error('Avatar preference error:', e);
      }

      document.getElementById('userAvatar').src = AVATAR_URLS[selected];

      document.querySelectorAll('.avatar-option').forEach(option => {
        option.classList.toggle('selected', option.dataset.avatar === selected);
      });
    }

    function openAvatarPicker() {
      applySavedAvatar();

      const modal = document.getElementById('avatarModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeAvatarPicker() {
      const modal = document.getElementById('avatarModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function selectAvatar(type) {
      if (!Object.prototype.hasOwnProperty.call(AVATAR_URLS, type)) return;

      document.getElementById('userAvatar').src = AVATAR_URLS[type];

      document.querySelectorAll('.avatar-option').forEach(option => {
        option.classList.toggle('selected', option.dataset.avatar === type);
      });

      try {
        localStorage.setItem('selected_account_avatar', type);
      } catch (e) {
        console.error('Avatar save error:', e);
      }
    }

    async function copyGameId() {
      const gameId = document.getElementById('userGameId').textContent.trim();

      if (!gameId || gameId === '----') return;

      try {
        await navigator.clipboard.writeText(gameId);
        alert('GAME ID copied!');
      } catch (err) {
        prompt('Copy your GAME ID:', gameId);
      }
    }

    let memberSyncInProgress = false;

    async function syncMemberBalance() {
      const refreshIcon = document.getElementById('refreshIcon');

      if (memberSyncInProgress) return;

      memberSyncInProgress = true;

      if (refreshIcon) {
        refreshIcon.classList.add('fa-spin');
      }

      try {
        const storedUser = localStorage.getItem('current_user');

        if (!storedUser) {
          window.location.href = '../login-signup.html';
          return;
        }

        let currentUserObj;

        try {
          currentUserObj = JSON.parse(storedUser);
        } catch (parseError) {
          console.error('Invalid current_user data:', parseError);
          window.location.href = '../login-signup.html';
          return;
        }

        const userId =
          currentUserObj.id ||
          currentUserObj.user_id ||
          currentUserObj.uid;

        if (!userId) {
          console.error('Logged-in user UUID was not found.');
          alert('User session is invalid. Please log in again.');
          window.location.href = '../login-signup.html';
          return;
        }

        if (
          typeof supabaseClient === 'undefined' ||
          !supabaseClient
        ) {
          console.error(
            'supabaseClient was not found. Check ../supabase-config.js'
          );
          return;
        }

        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select(`
            id,
            full_name,
            phone_number,
            balance,
            created_at,
            user_game_id,
            turnover_required,
            current_turnover
          `)
          .eq('id', userId)
          .maybeSingle();

        if (error) {
          console.error('Profile load error:', error);
          return;
        }

        if (!profile) {
          console.error(
            'No profiles record found for user UUID:',
            userId
          );
          return;
        }

        const gameId = profile.user_game_id || profile.id || '';

        document.getElementById('userGameId').textContent = gameId
          ? String(gameId).slice(0, 8).toUpperCase()
          : '----';

        const balanceElement = document.getElementById('userBalance');

        if (
          profile.balance !== null &&
          profile.balance !== undefined &&
          Number.isFinite(Number(profile.balance))
        ) {
          balanceElement.textContent = Number(profile.balance).toFixed(2);
        } else {
          balanceElement.textContent = '0.00';
        }

        if (profile.created_at) {
          const joinedDate = new Date(profile.created_at);

          if (!Number.isNaN(joinedDate.getTime())) {
            document.getElementById('userJoined').textContent =
              'Joined: ' +
              joinedDate.toLocaleDateString('en-CA', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                timeZone: 'UTC'
              });
          }
        }

        console.log('Member profile synchronized successfully.');

      } catch (err) {
        console.error('Member synchronization error:', err);
      } finally {
        memberSyncInProgress = false;

        if (refreshIcon) {
          refreshIcon.classList.remove('fa-spin');
        }
      }
    }

    function setTheme(theme) {
      const isLight = theme === 'light';

      document.body.classList.toggle('light-mode', isLight);

      document.getElementById('darkThemeBtn')
        .classList.toggle('active', !isLight);

      document.getElementById('lightThemeBtn')
        .classList.toggle('active', isLight);
    }

    function cycleLanguage() {
      const el = document.getElementById('languageValue');

      el.textContent =
        el.textContent === 'English' ? 'বাংলা' : 'English';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applySavedAvatar();
      syncMemberBalance();
    });
  </script>
</body>
</html>
