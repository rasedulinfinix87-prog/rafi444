<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03140f">
  <meta name="description" content="Royal Blackjack — first-person blackjack table visual demo.">
  <title>Royal Blackjack</title>
  <style>
    :root { color-scheme: dark; background: #03140f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; width: 100%; }
    body { min-height: 100vh; min-height: 100dvh; background: #03140f; font-family: Arial, sans-serif; }
    main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; position: relative; overflow: hidden; }
    .table-image { display: block; width: 100%; height: 100vh; height: 100dvh; object-fit: contain; object-position: center; }
    .notice { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 24px); padding: 7px 12px; border: 1px solid #ffffff30; border-radius: 999px; background: #000b; color: #fff; font-size: 11px; text-align: center; }
    @media (max-width: 600px) { .table-image { width: 100%; height: auto; max-height: 100dvh; object-fit: contain; } .notice { font-size: 10px; } }
  </style>
</head>
<body>
  <main aria-label="Royal Blackjack demo table">
    <img class="table-image" src="assets/images/royel-blacljack.png" alt="First-person blackjack table with dealer, cards, chips, and game controls" width="1536" height="1024">
    <p class="notice">DEMO PREVIEW · Visual mockup only — gameplay and bets are not connected</p>
  </main>
</body>
</html>
