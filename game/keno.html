<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keno Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#10b981',
                            neon: '#00e701',
                            darkGreen: '#059669',
                            bg: '#181a20',
                            card: '#222630',
                            input: '#2b303c',
                            tile: '#2f3542',
                            tileActive: '#10b981',
                            accent: '#374151'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #f3f4f6;
            touch-action: manipulation;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #181a20;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #2b303c;
            border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 14px;
            border-radius: 6px;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* Glow effects */
        .neon-glow {
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }
        .tile-pressed {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 select-none">

    <!-- Top Navigation Header / Dynamic Anchor -->
    <div id="topBarContainer" class="w-full max-w-md sticky top-0 z-50 mb-3"></div>

    <!-- Main Game Container matching design layout -->
    <main class="w-full max-w-md bg-brand-card border border-gray-800/80 rounded-2xl p-3 sm:p-4 shadow-2xl flex flex-col space-y-3 mb-6">
        
        <!-- Top Multipliers Bar -->
        <div id="multipliers-bar" class="grid grid-cols-5 gap-1.5 w-full">
            <div class="bg-brand-neon/20 border border-emerald-500 text-emerald-400 rounded-lg py-1.5 text-center text-xs sm:text-sm font-black transition-all">1.88x</div>
            <div class="bg-brand-tile border border-transparent text-gray-400 rounded-lg py-1.5 text-center text-xs sm:text-sm font-black transition-all">0.00x</div>
            <div class="bg-brand-neon/20 border border-emerald-500 text-emerald-400 rounded-lg py-1.5 text-center text-xs sm:text-sm font-black transition-all">4.45x</div>
            <div class="bg-brand-neon/20 border border-emerald-500 text-emerald-400 rounded-lg py-1.5 text-center text-xs sm:text-sm font-black transition-all">4.45x</div>
            <div class="bg-brand-tile border border-transparent text-gray-400 rounded-lg py-1.5 text-center text-xs sm:text-sm font-black transition-all">0.98x</div>
        </div>

        <!-- 8x5 Number Tiles Grid (1 to 40) -->
        <div id="number-grid" class="grid grid-cols-8 gap-1.5 sm:gap-2 w-full pt-1">
            <!-- Dynamic JavaScript tiles inserted here -->
        </div>

        <!-- Info / Selection Message Box -->
        <div class="w-full bg-brand-input/90 border-b-2 border-emerald-500/80 rounded-xl py-3 px-4 text-center text-xs sm:text-sm font-medium text-gray-300 shadow-inner" id="status-message">
            Select 1-10 numbers to play
        </div>

        <!-- Main Actions: Bet & Auto Pick -->
        <div class="flex flex-col space-y-2 pt-1">
            <button id="bet-btn" onclick="placeBet()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-base rounded-xl transition-all shadow-lg active:scale-[0.99] flex items-center justify-center space-x-2">
                <span>Bet</span>
            </button>

            <button onclick="autoPick()" class="w-full py-3 bg-brand-tile hover:bg-gray-700 text-white font-semibold text-sm rounded-xl transition-all flex items-center justify-center space-x-2 border border-gray-700/50 shadow-md">
                <i class="fa-solid fa-wand-magic-sparkles text-gray-300 text-xs"></i>
                <span>Auto Pick</span>
            </button>
        </div>

        <!-- Amount Control Box -->
        <div class="flex flex-col space-y-1">
            <div class="flex justify-between items-center text-xs text-gray-400 font-medium px-1">
                <span class="flex items-center gap-1">Amount <i class="fa-regular fa-circle-question text-[10px]" title="Betting amount per round"></i></span>
                <span class="text-gray-400 font-mono text-[11px]">≈<span id="bcd-equivalent">0.00001</span>BCD</span>
            </div>

            <div class="flex items-center bg-brand-input border border-gray-700/60 rounded-xl p-1.5 focus-within:border-emerald-500 transition-colors">
                <div class="flex items-center pl-2 pr-1 text-emerald-400 font-bold text-base">
                    ৳
                </div>
                <input type="number" id="bet-amount-input" value="10" min="1" step="1" oninput="updateBcdValue()" class="w-full bg-transparent text-white font-bold text-sm focus:outline-none px-1">
                
                <div class="flex items-center space-x-1 pl-1">
                    <button onclick="halveBet()" class="bg-brand-tile hover:bg-gray-600 text-gray-300 text-xs font-bold px-2.5 py-1.5 rounded-lg transition-colors">1/2</button>
                    <button onclick="doubleBet()" class="bg-brand-tile hover:bg-gray-600 text-gray-300 text-xs font-bold px-2.5 py-1.5 rounded-lg transition-colors">2x</button>
                    <div class="flex flex-col space-y-0.5 bg-brand-tile rounded-lg p-0.5 border border-gray-700">
                        <button onclick="stepBet(5)" class="text-gray-400 hover:text-white text-[9px] px-1"><i class="fa-solid fa-chevron-up"></i></button>
                        <button onclick="stepBet(-5)" class="text-gray-400 hover:text-white text-[9px] px-1"><i class="fa-solid fa-chevron-down"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Row / Risk Slider -->
        <div class="flex flex-col space-y-1 pt-1">
            <div class="flex justify-between items-center text-xs text-gray-400 px-1 font-medium">
                <span>Row</span>
                <button onclick="clearTable()" class="text-gray-400 hover:text-emerald-400 underline underline-offset-2 text-xs transition-colors" id="clear-btn">Clear Table</button>
            </div>
            <div class="flex items-center space-x-3 bg-brand-input/40 px-3 py-2 rounded-xl border border-gray-800">
                <span class="text-xs font-bold text-gray-400" id="row-min">0</span>
                <input type="range" id="row-slider" min="0" max="10" value="0" oninput="document.getElementById('row-val').innerText = this.value">
                <span class="text-xs font-bold text-gray-400" id="row-val">0</span>
            </div>
        </div>

    </main>

    <!-- Notification Toast Box -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 border border-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs shadow-2xl transition-all transform translate-y-20 opacity-0 z-50 flex items-center space-x-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">Notification Message</span>
    </div>

    <script>
        // Game State Variables
        let selectedNumbers = new Set();
        const maxSelections = 10;
        let isSpinning = false;
        let currentBalance = 1000.00; // Default local balance

        // Load Top Bar Component dynamically
        async function loadTopBar() {
            try {
                const res = await fetch('../bar/top.html');
                if (res.ok) {
                    document.getElementById('topBarContainer').innerHTML = await res.text();
                    document.querySelectorAll('a[href*="deposit"]').forEach(a => a.href = '../account/deposit.html');
                    document.querySelectorAll('a[href*="member"]').forEach(a => {
                        if (a.href.includes('admin/mem/member.html')) {
                            a.href = a.href.replace('admin/mem/member.html', 'mem/member.html');
                        }
                    });
                    updateUIBalance();
                }
            } catch (e) {
                console.error("Top bar fetch error:", e);
            }
        }

        // Multipliers based on matched count
        const payoutRates = {
            1: [0, 1.8],
            2: [0, 1.2, 3.2],
            3: [0, 1.0, 2.1, 5.5],
            4: [0, 0.5, 1.8, 4.0, 10.0],
            5: [0, 0.2, 1.2, 3.0, 8.0, 20.0],
            6: [0, 0.0, 1.0, 2.5, 6.0, 15.0, 45.0],
            7: [0, 0.0, 0.5, 2.0, 4.5, 10.0, 30.0, 80.0],
            8: [0, 0.0, 0.0, 1.5, 3.5, 8.0, 20.0, 50.0, 150.0],
            9: [0, 0.0, 0.0, 1.0, 2.5, 6.0, 15.0, 40.0, 100.0, 300.0],
            10: [0, 0.0, 0.0, 0.5, 2.0, 5.0, 10.0, 25.0, 80.0, 200.0, 500.0]
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await loadTopBar();
            renderGrid();
            updateBcdValue();
        });

        // Render 1 to 40 Grid
        function renderGrid() {
            const grid = document.getElementById('number-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 40; i++) {
                const btn = document.createElement('button');
                btn.id = `tile-${i}`;
                btn.className = `aspect-square bg-brand-tile hover:bg-gray-600 border-b-2 border-black/40 text-white font-extrabold text-sm sm:text-base rounded-lg transition-all flex items-center justify-center shadow-md active:scale-95`;
                btn.innerText = i;
                btn.onclick = () => toggleNumber(i);
                grid.appendChild(btn);
            }
        }

        // Toggle Selection
        function toggleNumber(num) {
            if (isSpinning) return;

            if (selectedNumbers.has(num)) {
                selectedNumbers.delete(num);
            } else {
                if (selectedNumbers.size >= maxSelections) {
                    showToast('সর্বোচ্চ ১০টি নম্বর নির্বাচন করতে পারবেন', 'warning');
                    return;
                }
                selectedNumbers.add(num);
            }
            updateGridVisuals();
            updateStatusMsg();
        }

        // Update Grid Tile Styles
        function updateGridVisuals() {
            for (let i = 1; i <= 40; i++) {
                const tile = document.getElementById(`tile-${i}`);
                if (!tile) continue;

                if (selectedNumbers.has(i)) {
                    tile.className = `aspect-square bg-brand-neon hover:bg-emerald-400 text-gray-950 font-black text-sm sm:text-base rounded-lg transition-all flex items-center justify-center shadow-lg neon-glow scale-105 border-b-2 border-emerald-800`;
                } else {
                    tile.className = `aspect-square bg-brand-tile hover:bg-gray-600 border-b-2 border-black/40 text-white font-extrabold text-sm sm:text-base rounded-lg transition-all flex items-center justify-center shadow-md active:scale-95`;
                }
            }
        }

        // Status Message Banner
        function updateStatusMsg() {
            const msg = document.getElementById('status-message');
            if (selectedNumbers.size === 0) {
                msg.innerText = "Select 1-10 numbers to play";
                msg.className = "w-full bg-brand-input/90 border-b-2 border-emerald-500/80 rounded-xl py-3 px-4 text-center text-xs sm:text-sm font-medium text-gray-300 shadow-inner";
            } else {
                msg.innerText = `Selected ${selectedNumbers.size} of 10 numbers`;
                msg.className = "w-full bg-emerald-950/40 border-b-2 border-emerald-400 rounded-xl py-3 px-4 text-center text-xs sm:text-sm font-bold text-emerald-300 shadow-inner";
            }
        }

        // Auto Pick Function
        function autoPick() {
            if (isSpinning) return;
            selectedNumbers.clear();
            const count = Math.floor(Math.random() * 5) + 3; // pick 3 to 7 randomly
            while (selectedNumbers.size < count) {
                const randomNum = Math.floor(Math.random() * 40) + 1;
                selectedNumbers.add(randomNum);
            }
            updateGridVisuals();
            updateStatusMsg();
        }

        // Clear Table
        function clearTable() {
            if (isSpinning) return;
            selectedNumbers.clear();
            updateGridVisuals();
            updateStatusMsg();
        }

        // Amount Calculations
        function halveBet() {
            const input = document.getElementById('bet-amount-input');
            let val = parseFloat(input.value) || 0;
            input.value = Math.max(1, Math.floor(val / 2));
            updateBcdValue();
        }

        function doubleBet() {
            const input = document.getElementById('bet-amount-input');
            let val = parseFloat(input.value) || 0;
            input.value = Math.max(1, Math.floor(val * 2));
            updateBcdValue();
        }

        function stepBet(step) {
            const input = document.getElementById('bet-amount-input');
            let val = parseFloat(input.value) || 0;
            input.value = Math.max(1, val + step);
            updateBcdValue();
        }

        function updateBcdValue() {
            const input = document.getElementById('bet-amount-input');
            const val = parseFloat(input.value) || 0;
            const bcd = (val * 0.0000085).toFixed(6);
            document.getElementById('bcd-equivalent').innerText = bcd;
        }

        // Update Balance on Top Bar
        function updateUIBalance() {
            const topBal = document.getElementById('topBarBalance');
            if (topBal) {
                topBal.innerText = currentBalance.toFixed(2);
            }
        }

        // Main Bet Logic
        async function placeBet() {
            if (isSpinning) return;

            if (selectedNumbers.size === 0) {
                showToast('অন্তত ১টি নম্বর সিলেক্ট করুন!', 'error');
                return;
            }

            const betInput = document.getElementById('bet-amount-input');
            const betAmount = parseFloat(betInput.value) || 0;

            if (betAmount <= 0) {
                showToast('সঠিক বাজি পরিমাণ লিখুন', 'error');
                return;
            }

            if (currentBalance < betAmount) {
                showToast('আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!', 'error');
                return;
            }

            // Deduct balance
            currentBalance -= betAmount;
            updateUIBalance();

            isSpinning = true;
            document.getElementById('bet-btn').disabled = true;
            document.getElementById('bet-btn').classList.add('opacity-60');

            // Draw 10 winning numbers
            const drawnNumbers = new Set();
            while (drawnNumbers.size < 10) {
                drawnNumbers.add(Math.floor(Math.random() * 40) + 1);
            }

            // Animate Drawing
            const drawnArray = Array.from(drawnNumbers);
            for (let i = 0; i < drawnArray.length; i++) {
                const num = drawnArray[i];
                const tile = document.getElementById(`tile-${num}`);
                
                await new Promise(r => setTimeout(r, 120));

                if (selectedNumbers.has(num)) {
                    // Match Hit!
                    tile.className = `aspect-square bg-yellow-400 text-black font-black text-base rounded-lg flex items-center justify-center shadow-lg ring-4 ring-yellow-200 scale-110 z-10`;
                } else {
                    // Miss
                    tile.className = `aspect-square bg-rose-600 text-white font-black text-base rounded-lg flex items-center justify-center shadow-md scale-100 opacity-90`;
                }
            }

            // Calculate Matches
            let matchCount = 0;
            selectedNumbers.forEach(n => {
                if (drawnNumbers.has(n)) matchCount++;
            });

            // Calculate Multiplier
            const selCount = selectedNumbers.size;
            const table = payoutRates[selCount] || [0];
            const multiplier = table[matchCount] || 0;
            const payout = betAmount * multiplier;
            const isWin = payout > 0;

            if (isWin) {
                currentBalance += payout;
                updateUIBalance();
                showToast(`অভিনন্দন! ${matchCount} টি মিলেছে! আপনি পেয়েছেন ৳${payout.toFixed(2)} (${multiplier}x)`, 'success');
            } else {
                showToast(`দুঃখিত! ${matchCount} টি নম্বর মিলেছে। আবার চেষ্টা করুন।`, 'error');
            }

            // Push multiplier to top bar
            pushMultiplierBar(multiplier);

            // Reset after delay
            await new Promise(r => setTimeout(r, 1500));
            updateGridVisuals();
            isSpinning = false;
            document.getElementById('bet-btn').disabled = false;
            document.getElementById('bet-btn').classList.remove('opacity-60');
        }

        // Push top recent multipliers
        function pushMultiplierBar(mult) {
            const bar = document.getElementById('multipliers-bar');
            const newDiv = document.createElement('div');
            const multStr = mult.toFixed(2) + 'x';

            if (mult > 0) {
                newDiv.className = 'bg-brand-neon/20 border border-emerald-500 text-emerald-400 rounded-lg py-1.5 text-center text-xs sm:text-sm font-black transition-all';
            } else {
                newDiv.className = 'bg-brand-tile border border-transparent text-gray-400 rounded-lg py-1.5 text-center text-xs sm:text-sm font-black transition-all';
            }
            newDiv.innerText = multStr;

            bar.insertBefore(newDiv, bar.firstChild);
            if (bar.children.length > 5) {
                bar.removeChild(bar.lastChild);
            }
        }

        // Toast Messages
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;

            if (type === 'success') {
                toast.className = "fixed bottom-4 right-4 bg-gray-900 border border-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs shadow-2xl transition-all transform translate-y-0 opacity-100 z-50 flex items-center space-x-2";
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === 'error') {
                toast.className = "fixed bottom-4 right-4 bg-gray-900 border border-rose-500 text-white px-4 py-2.5 rounded-xl text-xs shadow-2xl transition-all transform translate-y-0 opacity-100 z-50 flex items-center space-x-2";
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-400";
            } else {
                toast.className = "fixed bottom-4 right-4 bg-gray-900 border border-sky-500 text-white px-4 py-2.5 rounded-xl text-xs shadow-2xl transition-all transform translate-y-0 opacity-100 z-50 flex items-center space-x-2";
                toastIcon.className = "fa-solid fa-circle-info text-sky-400";
            }

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
