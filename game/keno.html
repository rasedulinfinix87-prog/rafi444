<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keno Game - Realtime Supabase</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-element: #334155;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #475569;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Top Navigation Bar - 2nd Image Style */
    .top-navbar {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-card);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .wallet-box {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wallet-box i {
      color: var(--accent);
    }

    .wallet-balance {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: var(--bg-element);
      border: none;
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-icon:hover {
      background: var(--border-color);
    }

    /* Container */
    .game-container {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* History / Multipliers Header Bar */
    .history-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .history-item {
      background-color: var(--bg-card);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .history-item.active-hit {
      background-color: var(--primary);
      color: #000;
    }

    /* Numbers Grid 1-40 */
    .keno-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      background-color: var(--bg-card);
      padding: 12px;
      border-radius: 12px;
    }

    .num-btn {
      background-color: var(--bg-element);
      border: none;
      color: var(--text-main);
      aspect-ratio: 1;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .num-btn:hover {
      background-color: var(--border-color);
    }

    .num-btn.selected {
      background-color: var(--primary);
      color: #000;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .num-btn.hit {
      background-color: var(--accent);
      color: #000;
      animation: pulse 0.3s ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Info Bar */
    .selection-info {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    /* Control Panel */
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-bet {
      background-color: var(--primary);
      color: #000;
    }

    .btn-bet:hover {
      background-color: var(--primary-hover);
    }

    .btn-auto {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    /* Amount Section */
    .amount-card {
      background-color: var(--bg-card);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .amount-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .amount-input-group {
      display: flex;
      gap: 8px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .input-wrapper input {
      width: 100%;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      padding: 10px 12px 10px 32px;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: bold;
    }

    .currency-symbol {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-weight: bold;
    }

    .btn-sub {
      background-color: var(--bg-element);
      border: none;
      color: var(--text-main);
      padding: 0 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal for Deposit/Withdrawal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background-color: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .form-group input, .form-group select {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="top-navbar">
    <div class="nav-brand">
      <i class="fa-solid fa-gamepad"></i> Keno
    </div>
    
    <div class="wallet-box">
      <i class="fa-solid fa-wallet"></i>
      <span class="wallet-balance" id="user-balance">0.00</span>
    </div>

    <div class="nav-actions">
      <button class="btn-icon" title="Deposit" onclick="openModal('deposit-modal')">
        <i class="fa-solid fa-arrow-down-to-line" style="color: var(--primary);"></i>
      </button>
      <button class="btn-icon" title="Withdrawal" onclick="openModal('withdraw-modal')">
        <i class="fa-solid fa-arrow-up-from-line" style="color: var(--accent);"></i>
      </button>
    </div>
  </div>

  <div class="game-container">
    <!-- Multipliers/History Header -->
    <div class="history-bar">
      <div class="history-item">1.88x</div>
      <div class="history-item">0.00x</div>
      <div class="history-item active-hit">4.45x</div>
      <div class="history-item active-hit">4.45x</div>
      <div class="history-item">0.98x</div>
    </div>

    <!-- 1 to 40 Keno Numbers Grid -->
    <div class="keno-grid" id="keno-grid"></div>

    <!-- Selection Status Info -->
    <div class="selection-info" id="selection-info">
      Select 1-10 numbers to play
    </div>

    <!-- Controls -->
    <div class="control-panel">
      <button class="btn-main btn-bet" id="btn-place-bet">
        <i class="fa-solid fa-play"></i> Bet
      </button>
      <button class="btn-main btn-auto" id="btn-auto-pick">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Auto Pick
      </button>

      <!-- Bet Amount Card -->
      <div class="amount-card">
        <div class="amount-header">
          <span>Amount</span>
          <span>≈ 0.00001 BCD</span>
        </div>
        <div class="amount-input-group">
          <div class="input-wrapper">
            <span class="currency-symbol">৳</span>
            <input type="number" id="bet-amount" value="10" min="1">
          </div>
          <button class="btn-sub" onclick="adjustAmount(0.5)">1/2</button>
          <button class="btn-sub" onclick="adjustAmount(2)">2x</button>
        </div>
      </div>

      <!-- Clear Table Button -->
      <div style="display: flex; justify-content: space-between; align-items: center; color: var(--text-sub); font-size: 0.9rem;">
        <span>Selected: <b id="selected-count" style="color: var(--text-main);">0</b>/10</span>
        <span style="cursor: pointer;" onclick="clearSelection()">Clear Table</span>
      </div>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div class="modal-overlay" id="deposit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Deposit Funds</h3>
        <button class="modal-close" onclick="closeModal('deposit-modal')">&times;</button>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="dep-method">
          <option value="bKash">bKash</option>
          <option value="Nagad">Nagad</option>
          <option value="Rocket">Rocket</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (BDT)</label>
        <input type="number" id="dep-amount" placeholder="e.g. 500">
      </div>
      <div class="form-group">
        <label>Transaction ID</label>
        <input type="text" id="dep-txid" placeholder="TrxID">
      </div>
      <button class="btn-main btn-bet" onclick="submitDeposit()">Submit Deposit</button>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div class="modal-overlay" id="withdraw-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Request Withdrawal</h3>
        <button class="modal-close" onclick="closeModal('withdraw-modal')">&times;</button>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="wd-method">
          <option value="bKash">bKash</option>
          <option value="Nagad">Nagad</option>
        </select>
      </div>
      <div class="form-group">
        <label>Account Number</label>
        <input type="text" id="wd-account" placeholder="017XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Amount (BDT)</label>
        <input type="number" id="wd-amount" placeholder="e.g. 1000">
      </div>
      <button class="btn-main btn-bet" onclick="submitWithdrawal()">Request Withdraw</button>
    </div>
  </div>

  <!-- Realtime Script and Game Logic -->
  <script type="module">
    import { supabase } from '../supabase-config.js';

    let currentUserId = null;
    let userBalance = 0;
    let selectedNumbers = [];

    // Initialize Grid (1 to 40)
    const gridEl = document.getElementById('keno-grid');
    for (let i = 1; i <= 40; i++) {
      const btn = document.createElement('button');
      btn.className = 'num-btn';
      btn.innerText = i;
      btn.onclick = () => toggleNumber(i, btn);
      gridEl.appendChild(btn);
    }

    // Modal Helpers
    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    // Amount Helper
    window.adjustAmount = (factor) => {
      const input = document.getElementById('bet-amount');
      let current = parseFloat(input.value) || 0;
      input.value = Math.max(1, Math.round(current * factor));
    };

    // Number Selection Logic
    function toggleNumber(num, element) {
      if (selectedNumbers.includes(num)) {
        selectedNumbers = selectedNumbers.filter(n => n !== num);
        element.classList.remove('selected');
      } else {
        if (selectedNumbers.length >= 10) {
          alert('আপনি সর্বোচ্চ ১০টি নম্বর সিলেক্ট করতে পারবেন।');
          return;
        }
        selectedNumbers.push(num);
        element.classList.add('selected');
      }
      updateSelectionUI();
    }

    window.clearSelection = () => {
      selectedNumbers = [];
      document.querySelectorAll('.num-btn').forEach(btn => btn.classList.remove('selected', 'hit'));
      updateSelectionUI();
    };

    function updateSelectionUI() {
      document.getElementById('selected-count').innerText = selectedNumbers.length;
      const info = document.getElementById('selection-info');
      if (selectedNumbers.length === 0) {
        info.innerText = 'Select 1-10 numbers to play';
      } else {
        info.innerText = `Selected: ${selectedNumbers.sort((a,b)=>a-b).join(', ')}`;
      }
    }

    // Auto Pick Logic
    document.getElementById('btn-auto-pick').addEventListener('click', () => {
      clearSelection();
      const numbers = Array.from({length: 40}, (_, i) => i + 1);
      const shuffled = numbers.sort(() => 0.5 - Math.random());
      selectedNumbers = shuffled.slice(0, 5); // Pick 5 random numbers
      
      const buttons = document.querySelectorAll('.num-btn');
      selectedNumbers.forEach(num => {
        buttons[num - 1].classList.add('selected');
      });
      updateSelectionUI();
    });

    // 1. Fetch User Profile and Subscribe to Realtime Updates
    async function initRealtimeUser() {
      const { data: { user } } = await supabase.auth.getUser();
      
      if (!user) {
        console.log('User not logged in');
        return;
      }

      currentUserId = user.id;

      // Initial Fetch Profiles
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUserId)
        .single();

      if (data) {
        userBalance = parseFloat(data.balance) || 0;
        updateBalanceDisplay(userBalance);
      }

      // Realtime listener for balance updates in profiles table
      supabase
        .channel('schema-db-changes')
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'profiles',
            filter: `id=eq.${currentUserId}`
          },
          (payload) => {
            if (payload.new && payload.new.balance !== undefined) {
              userBalance = parseFloat(payload.new.balance);
              updateBalanceDisplay(userBalance);
            }
          }
        )
        .subscribe();
    }

    function updateBalanceDisplay(val) {
      document.getElementById('user-balance').innerText = val.toFixed(2);
    }

    // 2. Bet Logic and Update Supabase Table `bets`
    document.getElementById('btn-place-bet').addEventListener('click', async () => {
      if (selectedNumbers.length === 0) {
        alert('খেলার জন্য অন্তত ১টি নম্বর নির্বাচন করুন।');
        return;
      }

      const betAmount = parseFloat(document.getElementById('bet-amount').value) || 0;
      if (betAmount <= 0 || betAmount > userBalance) {
        alert('পর্যাপ্ত ব্যালেন্স নেই।');
        return;
      }

      // Draw 10 Random Winning Numbers
      const drawnNumbers = [];
      while (drawnNumbers.length < 10) {
        const rand = Math.floor(Math.random() * 40) + 1;
        if (!drawnNumbers.includes(rand)) drawnNumbers.push(rand);
      }

      // Highlight drawn hits
      const buttons = document.querySelectorAll('.num-btn');
      buttons.forEach(btn => btn.classList.remove('hit'));

      let hits = 0;
      drawnNumbers.forEach(num => {
        if (selectedNumbers.includes(num)) hits++;
        buttons[num - 1].classList.add('hit');
      });

      // Simple Multiplier Logic based on Hits
      let multiplier = hits >= 2 ? hits * 1.5 : 0;
      let payout = betAmount * multiplier;
      let isWin = payout > 0;

      // Balance update
      let newBalance = userBalance - betAmount + payout;
      
      // Update profiles balance
      await supabase
        .from('profiles')
        .update({ balance: newBalance })
        .eq('id', currentUserId);

      // Record Bet in `bets` Table
      await supabase
        .from('bets')
        .insert([{
          user_id: currentUserId,
          target_number: selectedNumbers.length,
          roll_result: hits,
          bet_amount: betAmount,
          payout: payout,
          is_bool: isWin
        }]);
    });

    // 3. Deposit Request
    window.submitDeposit = async () => {
      const amount = parseFloat(document.getElementById('dep-amount').value);
      const payment_method = document.getElementById('dep-method').value;
      const transection_id = document.getElementById('dep-txid').value;

      if (!amount || !transection_id) {
        alert('সব তথ্য সঠিকভাবে দিন।');
        return;
      }

      const { error } = await supabase.from('deposits').insert([{
        user_id: currentUserId,
        amount: amount,
        payment_method: payment_method,
        transection_id: transection_id,
        status: 'pending'
      }]);

      if (!error) {
        alert('ডিপোজিট রিকোয়েস্ট জমা হয়েছে!');
        closeModal('deposit-modal');
      }
    };

    // 4. Withdrawal Request
    window.submitWithdrawal = async () => {
      const amount = parseFloat(document.getElementById('wd-amount').value);
      const payment_method = document.getElementById('wd-method').value;
      const account_number = document.getElementById('wd-account').value;

      if (!amount || !account_number) {
        alert('সব তথ্য সঠিকভাবে দিন।');
        return;
      }

      if (amount > userBalance) {
        alert('আপনার ব্যালেন্স পর্যাপ্ত নয়।');
        return;
      }

      const { error } = await supabase.from('withdrawals').insert([{
        user_id: currentUserId,
        amount: amount,
        payment_method: payment_method,
        account_number: account_number,
        status: 'pending'
      }]);

      if (!error) {
        alert('উইথড্রয়াল রিকোয়েস্ট জমা হয়েছে!');
        closeModal('withdraw-modal');
      }
    };

    // Run Initialization
    initRealtimeUser();
  </script>
</body>
</html>
