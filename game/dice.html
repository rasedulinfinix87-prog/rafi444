<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICE REALTIME</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background-color: #161b22;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-back {
      background-color: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .title {
      font-size: 14px;
      letter-spacing: 1px;
      color: #8b949e;
      font-weight: 600;
    }

    /* ডাইস ট্র্যাক ও অ্যানিমেশন এরিয়া */
    .dice-track-container {
      position: relative;
      margin: 40px 0 30px;
    }

    .slider-track {
      height: 16px;
      width: 100%;
      background: #21262d;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .green-zone {
      position: absolute;
      top: 0;
      height: 100%;
      background-color: #2ea44f;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    /* পয়েন্ট স্কেল (0 - 100) */
    .scale-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #8b949e;
      font-size: 12px;
    }

    /* মুভিং ডাইস আইকন */
    .dice-icon {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      background-color: #ffffff;
      color: #0d1117;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      transition: left 1s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 5;
    }

    .dice-icon.rolling {
      animation: rotateDice 0.2s infinite linear;
    }

    @keyframes rotateDice {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* রেজাল্ট কার্ড */
    .result-display {
      text-align: center;
      margin: 20px 0;
      min-height: 48px;
    }

    .result-text {
      font-size: 18px;
      font-weight: 600;
    }

    .win {
      color: #2ea44f;
    }

    .loss {
      color: #f85149;
    }

    /* কন্ট্রোল প্যানেল */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      background-color: #0d1117;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }

    .control-label {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
      display: block;
    }

    .range-slider {
      width: 100%;
      accent-color: #2ea44f;
      cursor: pointer;
    }

    .direction-toggle {
      display: flex;
      gap: 10px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      background-color: #21262d;
      border: 1px solid #30363d;
      color: #ffffff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .toggle-btn.active {
      background-color: #238636;
      border-color: #2ea44f;
    }

    /* রোল বাটন */
    .btn-roll {
      width: 100%;
      padding: 16px;
      background-color: #238636;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-roll:disabled {
      background-color: #21262d;
      color: #8b949e;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <button class="btn-back">← হোমে ফিরুন</button>
    <span class="title">🎲 DICE REALTIME</span>
  </div>

  <!-- ডাইস স্লাইডার ট্র্যাকিং এরিয়া -->
  <div class="dice-track-container">
    <div class="slider-track">
      <div class="green-zone" id="greenZone"></div>
    </div>
    <!-- চলমান ডাইস আইকন -->
    <div class="dice-icon" id="diceIcon">🎲</div>
    <div class="scale-labels">
      <span>0</span>
      <span>25</span>
      <span>50</span>
      <span>75</span>
      <span>100</span>
    </div>
  </div>

  <!-- ফলাফল প্রদর্শনের জন্য জায়গা -->
  <div class="result-display" id="resultDisplay">
    <span style="color: #8b949e;">ডাইস রোল করতে নিচের বাটনে ক্লিক করুন</span>
  </div>

  <!-- কন্ট্রোলসমূহ -->
  <div class="controls">
    <!-- বাম থেকে ডান বা ডান থেকে বাম মোড সিলেক্ট -->
    <div class="direction-toggle">
      <button class="toggle-btn active" id="btnOver" onclick="setDirection('over')">Roll Over (ডান)</button>
      <button class="toggle-btn" id="btnUnder" onclick="setDirection('under')">Roll Under (বাম)</button>
    </div>

    <!-- পয়েন্ট পছন্দ করার স্লাইডার -->
    <div class="control-group">
      <span class="control-label">টার্গেট পয়েন্ট: <strong id="targetValue" style="color:#fff;">50.00</strong></span>
      <input type="range" min="5" max="95" value="50" class="range-slider" id="targetSlider">
    </div>

    <!-- রোল বাটন -->
    <button class="btn-roll" id="rollBtn" onclick="rollDice()">Roll Dice</button>
  </div>
</div>

<script>
  let mode = 'over'; // Default direction 'over'
  let isRolling = false;

  const targetSlider = document.getElementById('targetSlider');
  const targetValue = document.getElementById('targetValue');
  const greenZone = document.getElementById('greenZone');
  const diceIcon = document.getElementById('diceIcon');
  const resultDisplay = document.getElementById('resultDisplay');
  const rollBtn = document.getElementById('rollBtn');
  const btnOver = document.getElementById('btnOver');
  const btnUnder = document.getElementById('btnUnder');

  // সবুজ কালারের জোন আপডেট করার ফাংশন
  function updateGreenZone() {
    const val = parseFloat(targetSlider.value);
    targetValue.innerText = val.toFixed(2);

    if (mode === 'over') {
      // বাম থেকে সবুজ অংশ স্লাইডারের শেষ পর্যন্ত
      greenZone.style.left = val + '%';
      greenZone.style.width = (100 - val) + '%';
    } else {
      // শুরু থেকে স্লাইডারের পয়েন্ট পর্যন্ত সবুজ
      greenZone.style.left = '0%';
      greenZone.style.width = val + '%';
    }
  }

  // দিক পরিবর্তন (Roll Over / Roll Under)
  function setDirection(newMode) {
    if (isRolling) return;
    mode = newMode;
    if (mode === 'over') {
      btnOver.classList.add('active');
      btnUnder.classList.remove('active');
    } else {
      btnUnder.classList.add('active');
      btnOver.classList.remove('active');
    }
    updateGreenZone();
  }

  targetSlider.addEventListener('input', updateGreenZone);

  // মূল রোল ডাইস ফাংশন
  function rollDice() {
    if (isRolling) return;
    isRolling = true;
    rollBtn.disabled = true;
    rollBtn.innerText = "Rolling...";

    // র্যান্ডম পয়েন্ট জেনারেট (0.00 থেকে 100.00)
    const rolledPoint = (Math.random() * 100).toFixed(2);
    const targetPoint = parseFloat(targetSlider.value);

    // ডাইস ঘুরতে থাকার অ্যানিমেশন
    diceIcon.classList.add('rolling');
    diceIcon.innerText = '🎲';
    resultDisplay.innerHTML = '<span style="color: #8b949e;">রোল হচ্ছে...</span>';

    // স্লাইডারের উপর ডাইসটি নির্দিষ্ট জায়গায় মুভ করানো
    diceIcon.style.left = rolledPoint + '%';

    // ১ সেকেন্ড পর রোল থেমে ফলাফল দেখাবে
    setTimeout(() => {
      diceIcon.classList.remove('rolling');
      
      let isWin = false;
      if (mode === 'over' && parseFloat(rolledPoint) > targetPoint) {
        isWin = true;
      } else if (mode === 'under' && parseFloat(rolledPoint) < targetPoint) {
        isWin = true;
      }

      // রেজাল্ট দেখানো (পপ-আপ ছাড়াই)
      if (isWin) {
        diceIcon.innerText = '🎉';
        resultDisplay.innerHTML = `<div class="result-text win">ফলাফল: ${rolledPoint} | আপনি জিতেছেন! 🎉</div>`;
      } else {
        diceIcon.innerText = '❌';
        resultDisplay.innerHTML = `<div class="result-text loss">ফলাফল: ${rolledPoint} | আপনি হেরেছেন! 💔</div>`;
      }

      rollBtn.disabled = false;
      rollBtn.innerText = "Roll Dice";
      isRolling = false;
    }, 1000);
  }

  // প্রথমবার লোডের সময় সবুজ জোন সেটআপ
  updateGreenZone();
</script>

</body>
</html>
