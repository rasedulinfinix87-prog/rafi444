<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>BC Game Style Dice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<style>
body{background:#0f141c;color:#fff;font-family:sans-serif}.glass-card{background:#171d28;border:1px solid #222b3a;border-radius:18px;box-shadow:0 10px 25px -5px #0005}.green-button{background:#24ee89;color:#0f141c;font-weight:800;border:1px solid #24ee89;box-shadow:0 0 14px #24ee893f}::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-track{background:#0f141c}::-webkit-scrollbar-thumb{background:#222b3a;border-radius:3px}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:38px;width:38px;border-radius:50%;background:#fff;cursor:pointer;margin-top:-14px;box-shadow:0 0 10px #0008}.slider-track-outer{position:relative;height:28px;border-radius:14px;background:#0f141c;border:1px solid #222b3a;padding:6px;display:flex;align-items:center}.slider-track-bg{position:relative;width:100%;height:12px;border-radius:6px;overflow:visible}.slider-thumb-custom{position:absolute;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:10px;background:#3b82f6;box-shadow:0 4px 12px #0008;display:flex;align-items:center;justify-content:center;z-index:20}.dice-result-box{position:absolute;top:-38px;transform:translateX(-50%);background:#fff;color:#0f141c;font-weight:900;font-size:13px;padding:4px 10px;border-radius:8px;box-shadow:0 8px 20px #0006;z-index:40;display:none;white-space:nowrap;border:2px solid #e5e7eb;transition:left .4s}#popupMultiplier{font-size:1.875rem}#popupAmount{font-size:1.125rem}
</style></head>
<body class="bg-[#0f141c] text-white min-h-screen flex flex-col items-center p-0 select-none">
<div class="w-full max-w-2xl min-h-screen flex flex-col my-auto"><div id="topBarContainer" class="sticky top-0 z-50"></div>
<main class="p-3 sm:p-5 flex flex-col gap-4 flex-1"><div class="glass-card p-4 sm:p-5 flex flex-col gap-4 shadow-2xl">
<div id="historyContainer" class="flex items-center gap-2 overflow-x-auto py-1 min-h-[36px]"></div>
<div class="relative my-4 px-2"><div class="slider-track-outer"><div id="diceResultBox" class="dice-result-box"><span id="diceResultText">00.00</span></div><div class="slider-track-bg" id="sliderContainer"><div id="greenTrack" class="absolute top-0 bottom-0 bg-[#24ee89] transition-all" style="left:50%;width:50%"></div><div id="redTrack" class="absolute top-0 bottom-0 bg-red-500 transition-all" style="left:0;width:50%"></div></div><input type="range" min="2" max="98" step="0.01" value="50" id="diceRange" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer z-30"><div id="sliderThumb" class="slider-thumb-custom pointer-events-none" style="left:50%"><i class="fa-solid fa-grip-vertical text-xs"></i></div></div><div class="flex justify-between text-xs text-gray-400 font-semibold mt-2 px-1"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div><div class="relative w-full h-5 mt-1"><div id="targetBubble" class="absolute -translate-x-1/2 bg-[#171d28] text-[#24ee89] text-[11px] font-bold px-2 py-0.5 rounded border border-[#222b3a]" style="left:50%">50.00</div></div></div>
<div class="flex flex-col gap-3.5 pt-1"><div class="grid grid-cols-2 gap-3"><div class="flex flex-col gap-1"><label class="text-[11px] text-gray-400">Payout</label><div id="payoutBoxWrapper" class="flex items-center bg-[#0f141c] border border-[#222b3a] rounded-xl px-3 py-2"><input type="number" id="payoutInput" step="0.01" value="1.98" class="w-full bg-transparent text-xs font-bold focus:outline-none"><span id="payoutWarningIcon" class="text-red-500 hidden">⚠</span><span class="text-xs text-gray-400 ml-1">X</span><button onclick="toggleDirection()" id="dirToggleBtn" class="ml-2 w-7 h-7 rounded-lg bg-[#171d28] border border-[#222b3a] text-xs"><i class="fa-solid fa-right-left"></i></button></div></div><div class="flex flex-col gap-1"><label class="text-[11px] text-gray-400">Win Chance</label><div class="flex items-center bg-[#0f141c] border border-[#222b3a] rounded-xl px-3 py-2"><input type="number" id="winChanceInput" step="0.01" value="50" class="w-full bg-transparent text-xs font-bold focus:outline-none"><span class="text-xs text-gray-400">%</span></div></div></div>
<div class="flex flex-col gap-1"><div class="flex justify-between text-[11px] text-gray-400"><span>Amount (৳)</span><span class="text-[10px]">Betting with 0 enters demo mode</span></div><div class="flex items-center bg-[#0f141c] border border-[#222b3a] rounded-xl p-1"><span class="px-2 text-[#24ee89] font-bold text-xs">৳</span><input type="number" id="betAmount" value="10" min="0" step="1" class="w-full bg-transparent text-xs font-bold focus:outline-none px-1"><div class="flex gap-1"><button onclick="modifyBet('half')" class="px-2 py-1 rounded-lg bg-[#171d28] text-[10px]">1/2</button><button onclick="modifyBet('double')" class="px-2 py-1 rounded-lg bg-[#171d28] text-[10px]">2x</button><button onclick="modifyBet('max')" class="px-2 py-1 rounded-lg text-[10px] text-[#F5CF66]">MAX</button></div></div></div><button id="btnBet" onclick="triggerBet()" class="w-full py-3.5 green-button text-sm uppercase tracking-wider rounded-xl flex items-center justify-center">Bet</button></div>
<div class="rounded-xl overflow-hidden border border-[#222b3a] mt-1"><div class="flex border-b border-[#222b3a] bg-[#0f141c] text-xs font-bold"><button onclick="switchTab('manual')" id="tabManual" class="flex-1 py-2.5 green-button">Manual</button><button onclick="switchTab('auto')" id="tabAuto" class="flex-1 py-2.5 text-gray-400">Auto</button><button onclick="switchTab('advanced')" id="tabAdvanced" class="flex-1 py-2.5 text-gray-400">Advanced</button></div><div class="p-3.5 text-xs text-gray-400 bg-[#0f141c]"><div id="contentManual" class="flex flex-col gap-1"></div><div id="contentAuto" class="hidden flex-col gap-3"><b class="text-white">Advanced Options</b><div><label>On win</label><div class="grid grid-cols-2 gap-2 mt-1"><div class="flex bg-[#171d28] rounded p-1"><button onclick="setAutoStrategy('win','reset')" id="winResetBtn" class="flex-1 py-1 text-white">Reset</button><button onclick="setAutoStrategy('win','increase')" id="winIncBtn" class="flex-1 py-1">Increase</button></div><div class="flex bg-[#171d28] rounded px-2"><input id="winIncPercent" type="number" value="0" class="w-full bg-transparent"><span>%</span></div></div></div><div><label>On loss</label><div class="grid grid-cols-2 gap-2 mt-1"><div class="flex bg-[#171d28] rounded p-1"><button onclick="setAutoStrategy('loss','reset')" id="lossResetBtn" class="flex-1 py-1 text-white">Reset</button><button onclick="setAutoStrategy('loss','increase')" id="lossIncBtn" class="flex-1 py-1">Increase</button></div><div class="flex bg-[#171d28] rounded px-2"><input id="lossIncPercent" type="number" value="0" class="w-full bg-transparent"><span>%</span></div></div></div><label>Stop on win (৳)<input id="autoStopProfit" type="number" value="0" class="w-full bg-[#171d28] p-2 rounded mt-1"></label><label>Stop on loss (৳)<input id="autoStopLoss" type="number" value="0" class="w-full bg-[#171d28] p-2 rounded mt-1"></label><label>Number of Bets (0 = ∞)<input id="autoBetCount" type="number" value="0" min="0" class="w-full bg-[#171d28] p-2 rounded mt-1"></label></div><div id="contentAdvanced" class="hidden flex-col gap-3"><div class="p-2 bg-[#171d28] rounded"><b class="text-white">Condition Trigger Strategy</b><div class="flex gap-2 mt-2"><select id="condEvent" class="bg-[#0f141c] p-1"><option value="consecutive_loss">Consecutive Loss &gt;</option><option value="consecutive_win">Consecutive Win &gt;</option></select><input id="condStreak" type="number" value="3" class="w-12 bg-[#0f141c] text-center"></div></div></div></div></div>
<div class="flex items-center justify-between px-2 pt-1 text-gray-400 text-sm"><button onclick="toggleSettingsModal()" class="p-2"><i class="fa-solid fa-gear"></i></button><span class="text-xs">★ 12543</span><button id="turboBtn" onclick="toggleTurbo()" class="p-2"><i id="turboIcon" class="fa-solid fa-bolt text-gray-400"></i> <span id="turboText" class="text-xs">OFF</span></button><button onclick="toggleLiveStatsModal()" class="p-2"><i class="fa-solid fa-chart-simple"></i></button></div></div></main></div>
<div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden items-end justify-center"><div class="glass-card w-full max-w-md rounded-t-2xl p-4 flex flex-col gap-3"><div class="flex justify-between"><b>Settings</b><button onclick="toggleSettingsModal()">✕</button></div><button onclick="toggleSoundEffect()" id="soundSettingBtn" class="py-2 text-left">Sound Effects: <span id="soundStatusText">ON</span></button><button onclick="shareGame()" class="py-2 text-left">Share</button></div></div>
<div id="liveStatsModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4"><div class="glass-card w-full max-w-sm p-4 flex flex-col gap-4"><div class="flex justify-between"><b>Live Stats</b><button onclick="toggleLiveStatsModal()">✕</button></div><div class="bg-[#0f141c] p-3 rounded-xl text-xs space-y-3"><div class="flex justify-between"><span>Profit</span><b id="statsProfit">৳ 0.00</b></div><div class="flex justify-between"><span>Wagered</span><b id="statsWagered">৳ 0.00</b></div><div class="flex justify-between"><span>WIN <b id="statsWin">0</b></span><span>LOSE <b id="statsLose">0</b></span></div></div><div id="statsGraphContainer" class="h-24 flex items-end gap-1 overflow-x-auto text-xs">No bets yet</div></div></div>
<div id="cashoutPopup" style="display:none;position:fixed;inset:0;background:#000a;z-index:9999;align-items:center;justify-content:center"><div class="glass-card p-6 text-center"><div id="popupMultiplier" class="font-black text-[#24ee89]">2.50x</div><div id="popupAmount" class="font-bold">৳ 25.00</div></div></div>
<script>
let currentUserId=null,balance=0,isRolling=false,rollDirection='over',rollHistory=[],activeTab='manual',isAutoRunning=false,autoWinStrategy='reset',autoLossStrategy='reset',consecutiveWins=0,consecutiveLosses=0,baseBetAmount=10,isTurboOn=false,isSoundOn=true,totalProfit=0,totalWagered=0,totalWins=0,totalLosses=0,profitHistory=[0],profileChannel=null;
const HOUSE_EDGE=.99;const winSound=new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'),loseSound=new Audio('https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3');
const $=id=>document.getElementById(id);function playSound(w){if(!isSoundOn)return;const a=w?winSound:loseSound;a.currentTime=0;a.play().catch(()=>{});}function updateUIBalance(v){balance=Number(v)||0;const e=$('topBarBalance');if(e)e.textContent=balance.toFixed(2)}
async function loadTopBar(){try{const r=await fetch('../bar/top.html');if(!r.ok)throw Error('Top bar load failed');$('topBarContainer').innerHTML=await r.text();document.querySelectorAll('a[href*="deposit"]').forEach(a=>a.href='../account/deposit.html');updateUIBalance(balance)}catch(e){console.error(e)}}
async function refreshBalance(){if(!currentUserId||typeof supabaseClient==='undefined')return;const {data,error}=await supabaseClient.from('profiles').select('balance').eq('id',currentUserId).single();if(error)throw error;updateUIBalance(data.balance)}
async function initRealtimeGame(){await loadTopBar();updateSliderVisuals();syncCalculations('chance');if(typeof supabaseClient==='undefined'||typeof getCurrentUser!=='function'){alert('Supabase config load হয়নি।');return}try{const u=await getCurrentUser();if(!u){updateUIBalance(0);return}currentUserId=u.id;await refreshBalance();if(profileChannel)await supabaseClient.removeChannel(profileChannel);profileChannel=supabaseClient.channel('dice-profile-'+u.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+u.id},p=>{if(p.new&&p.new.balance!==undefined)updateUIBalance(p.new.balance)}).subscribe()}catch(e){console.error(e);alert('ব্যালেন্স লোড হয়নি: '+(e.message||e))}}
function updateSliderVisuals(){const v=Number($('diceRange').value);$('targetBubble').style.left=v+'%';$('targetBubble').textContent=v.toFixed(2);$('sliderThumb').style.left=v+'%';if(rollDirection==='over'){$('greenTrack').style.left=v+'%';$('greenTrack').style.width=(100-v)+'%';$('redTrack').style.left='0%';$('redTrack').style.width=v+'%'}else{$('greenTrack').style.left='0%';$('greenTrack').style.width=v+'%';$('redTrack').style.left=v+'%';$('redTrack').style.width=(100-v)+'%'}}
function syncCalculations(source){let v=Number($('diceRange').value);if(source==='slider'){let c=rollDirection==='over'?100-v:v;c=Math.max(.01,Math.min(98,c));$('winChanceInput').value=c.toFixed(2);$('payoutInput').value=(99/c).toFixed(4)}else if(source==='chance'){let c=Math.max(.01,Math.min(98,Number($('winChanceInput').value)||50));$('winChanceInput').value=c.toFixed(2);$('payoutInput').value=(99/c).toFixed(4);$('diceRange').value=(rollDirection==='over'?100-c:c).toFixed(2)}else{let p=Math.max(1.01,Number($('payoutInput').value)||1.98),c=Math.max(.01,Math.min(98,99/p));$('payoutInput').value=p.toFixed(4);$('winChanceInput').value=c.toFixed(2);$('diceRange').value=(rollDirection==='over'?100-c:c).toFixed(2)}$('payoutWarningIcon').classList.toggle('hidden',Number($('payoutInput').value)>1.001);$('payoutBoxWrapper').style.borderColor=Number($('payoutInput').value)<=1.001?'#ed4245':'#222b3a';updateSliderVisuals()}
$('diceRange').addEventListener('input',()=>syncCalculations('slider'));$('winChanceInput').addEventListener('change',()=>syncCalculations('chance'));$('payoutInput').addEventListener('change',()=>syncCalculations('payout'));
function toggleDirection(){if(isRolling)return;rollDirection=rollDirection==='over'?'under':'over';$('dirToggleBtn').classList.toggle('text-[#24ee89]',rollDirection==='under');syncCalculations('chance')}function modifyBet(t){let n=Number($('betAmount').value)||0;if(t==='half')n=Math.max(1,Math.floor(n/2));if(t==='double')n=Math.floor(n*2);if(t==='max')n=Math.floor(balance);$('betAmount').value=n}
function triggerBet(){if(activeTab==='auto'){if(isAutoRunning)stopAutoBet();else startAutoBet();return}executeRoll()}
function generateUUID(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16)})}

async function executeRoll(){if(isRolling)return false;const amount=Number($('betAmount').value)||0,target=Number($('diceRange').value);if(amount>0&&amount<1){alert('সর্বনিম্ন বেট ১ টাকা হতে হবে!');stopAutoBet();return false}if(amount>0&&!currentUserId){alert('বেট করার আগে লগইন করুন।');stopAutoBet();return false}if(amount>0&&amount>balance){alert('আপনার ব্যালেন্সে পর্যাপ্ত টাকা নেই।');stopAutoBet();return false}isRolling=true;$('btnBet').disabled=true;$('btnBet').textContent='Rolling...';let result,won,multiplier,payout=0,newBalance=balance;
try{if(amount>0){const {data,error}=await supabaseClient.rpc('place_dice_bet',{p_bet_amount:amount,p_target_number:target,p_roll_direction:rollDirection});if(error)throw error;const d=Array.isArray(data)?data[0]:data;if(!d||d.success!==true)throw Error('বেটের ফলাফল পাওয়া যায়নি');result=Number(d.roll_result);won=!!d.is_win;multiplier=Number(d.payout_multiplier);newBalance=Number(d.balance);payout=won?amount*multiplier:0;updateUIBalance(newBalance)}else{result=Number((Math.random()*99.99).toFixed(2));won=rollDirection==='over'?result>target:result<target;multiplier=Number($('payoutInput').value)||1.98}

// original_bets_history টেবিলে ডাটা সেভ করা হচ্ছে
if(currentUserId&&amount>0&&typeof supabaseClient!=='undefined'){
  const insertData={
    id:generateUUID(),
    user_id:currentUserId,
    game_name:'Dice',
    bet_amount:amount,
    payout:payout,
    multiplier:multiplier,
    status:won?'won':'lost',
    game_details:{
      target_number:target,
      roll_direction:rollDirection,
      roll_result:result
    }
  };
  await supabaseClient.from('original_bets_history').insert([insertData]);
}

$('diceResultBox').style.display='block';$('diceResultBox').style.left=result+'%';$('diceResultText').textContent=result.toFixed(2);$('diceResultText').className=won?'text-[#24ee89]':'text-red-500';await new Promise(r=>setTimeout(r,isTurboOn?50:400));playSound(won);totalWagered+=amount;if(won){consecutiveWins++;consecutiveLosses=0;totalWins++;totalProfit+=amount>0?payout-amount:0}else{consecutiveLosses++;consecutiveWins=0;totalLosses++;totalProfit-=amount}profitHistory.push(totalProfit);$('statsProfit').textContent='৳ '+totalProfit.toFixed(2);$('statsWagered').textContent='৳ '+totalWagered.toFixed(2);$('statsWin').textContent=totalWins;$('statsLose').textContent=totalLosses;updateGraph();addHistoryPill(result.toFixed(2),won);
if(isAutoRunning){if(won&&autoWinStrategy==='increase'){const p=Number($('winIncPercent').value)||0;$('betAmount').value=Math.max(1,Math.floor((Number($('betAmount').value)||0)*(1+p/100)))}else if(won)$('betAmount').value=baseBetAmount;else if(autoLossStrategy==='increase'){const p=Number($('lossIncPercent').value)||0;$('betAmount').value=Math.max(1,Math.floor((Number($('betAmount').value)||0)*(1+p/100)))}else $('betAmount').value=baseBetAmount;
const net=totalProfit;if(Number($('autoStopProfit').value)>0&&net>=Number($('autoStopProfit').value))stopAutoBet();if(Number($('autoStopLoss').value)>0&&net<=-Math.abs(Number($('autoStopLoss').value)))stopAutoBet();if(amount>0&&balance<Number($('betAmount').value))stopAutoBet()}
return true}catch(e){console.error('Bet error:',e);alert('বেট সম্পন্ন হয়নি: '+(e.message||e)+'\nSupabase SQL function তৈরি করা আছে কি না পরীক্ষা করুন।');try{await refreshBalance()}catch(_){}stopAutoBet();return false}finally{isRolling=false;$('btnBet').disabled=false;if(!isAutoRunning)$('btnBet').textContent=activeTab==='auto'?'Start Auto Bet':'Bet'}}
function addHistoryPill(result,won){rollHistory.unshift({result,won});if(rollHistory.length>10)rollHistory.pop();const p=document.createElement('div');p.className='px-2.5 py-1 rounded-lg text-xs font-bold '+(won?'bg-[rgba(36,238,137,0.15)] text-[#24ee89]':'bg-[#171d28] text-gray-400')+' border border-[#222b3a]';p.textContent=result;$('historyContainer').prepend(p);while($('historyContainer').children.length>10)$('historyContainer').lastChild.remove()}
function switchTab(tab){if(isAutoRunning)stopAutoBet();activeTab=tab;['manual','auto','advanced'].forEach(t=>{const on=t===tab;$('tab'+t[0].toUpperCase()+t.slice(1)).className='flex-1 py-2.5 text-center '+(on?'green-button':'text-gray-400');$('content'+t[0].toUpperCase()+t.slice(1)).classList.toggle('hidden',!on);$('content'+t[0].toUpperCase()+t.slice(1)).classList.toggle('flex',on)}$('btnBet').textContent=tab==='auto'?'Start Auto Bet':'Bet'}function setAutoStrategy(type,s){if(type==='win')autoWinStrategy=s;else autoLossStrategy=s;const prefix=type==='win'?'win':'loss';$(prefix+'ResetBtn').className=s==='reset'?'flex-1 py-1 bg-[#171d28] text-white rounded':'flex-1 py-1 text-gray-400';$(prefix+'IncBtn').className=s==='increase'?'flex-1 py-1 bg-[#171d28] text-white rounded':'flex-1 py-1 text-gray-400'}
async function startAutoBet(){const n=Number($('betAmount').value)||0;if(n>0&&!currentUserId){alert('বেট করার আগে লগইন করুন।');return}if(n>0&&n<1){alert('সর্বনিম্ন বেট ১ টাকা হতে হবে!');return}baseBetAmount=n;isAutoRunning=true;$('btnBet').textContent='Stop Auto Bet';$('btnBet').className='w-full py-3.5 bg-red-600 text-white font-black text-sm uppercase rounded-xl';runAutoLoop()}async function runAutoLoop(){let remaining=Number($('autoBetCount').value)||0;while(isAutoRunning){if(remaining>0&&remaining<=0)break;const ok=await executeRoll();if(!ok||!isAutoRunning)break;if(remaining>0){remaining--;$('autoBetCount').value=remaining;if(remaining<=0){stopAutoBet();break}}await new Promise(r=>setTimeout(r,isTurboOn?100:300))}if(isAutoRunning)stopAutoBet()}function stopAutoBet(){isAutoRunning=false;$('btnBet').disabled=false;$('btnBet').textContent=activeTab==='auto'?'Start Auto Bet':'Bet';$('btnBet').className='w-full py-3.5 green-button text-sm uppercase tracking-wider rounded-xl'}
function updateGraph(){const c=$('statsGraphContainer');c.innerHTML='';if(profitHistory.length<=1){c.textContent='No bets yet';return}const m=Math.max(...profitHistory.map(Math.abs),1);profitHistory.slice(1).forEach(v=>{const b=document.createElement('div');b.className='w-3 rounded-sm '+(v>=0?'bg-[#24ee89]':'bg-[#eb4e3d]');b.style.height=Math.max(10,Math.abs(v)/m*90)+'%';b.title='Profit: ৳'+v.toFixed(2);c.appendChild(b)})}
function toggleTurbo(){isTurboOn=!isTurboOn;$('turboIcon').className='fa-solid fa-bolt '+(isTurboOn?'text-[#24ee89]':'text-gray-400');$('turboText').textContent=isTurboOn?'ON':'OFF';$('turboText').className='text-xs '+(isTurboOn?'text-[#24ee89]':'text-gray-400')}function toggleSoundEffect(){isSoundOn=!isSoundOn;$('soundStatusText').textContent=isSoundOn?'ON':'OFF';$('soundSettingBtn').classList.toggle('text-gray-400',!isSoundOn);$('soundSettingBtn').classList.toggle('text-[#24ee89]',isSoundOn)}function toggleSettingsModal(){$('settingsModal').classList.toggle('hidden');$('settingsModal').classList.toggle('flex')}function toggleLiveStatsModal(){$('liveStatsModal').classList.toggle('hidden');$('liveStatsModal').classList.toggle('flex')}async function shareGame(){try{if(navigator.share)await navigator.share({title:'Dice Game',text:'Play this Dice game!',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('লিংক কপি করা হয়েছে!')}}catch(e){console.log(e)}}function toggleNotifications(){alert('এখন কোনো নতুন নোটিফিকেশন নেই।')}function clearNotifications(){}
window.addEventListener('load',initRealtimeGame);
</script></body></html>
