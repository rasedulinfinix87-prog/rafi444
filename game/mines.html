<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines Original - Game Portal</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0f141c',
            cardDark: '#1a212d',
            panelDark: '#212936',
            inputBg: '#151a23',
            bcGreen: '#24ee89',
            bcGreenHover: '#1fd879',
            bcRed: '#ed4245',
            textGray: '#8596a6',
            borderDark: '#2a3546'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: #0f141c;
    }

    .mines-card-bg {
      background: #1a212d;
      border: 1px solid #2a3546;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    /* Fixed equal size tiles */
    #minesGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    /* Default deep gray tiles - less rounded */
    .tile {
      background: #1c2330;
      border: 1px solid #2a3546;
      border-radius: 6px;
      transition: all 0.2s ease-in-out;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 900;
      aspect-ratio: 1 / 1;
    }

    .tile:hover:not(:disabled) {
      background: #252e3d;
      border-color: #3a4658;
    }

    /* Selected tile for Auto mode - glassy green */
    .tile-selected {
      background: rgba(36, 238, 137, 0.18) !important;
      border: 2px solid #24ee89 !important;
      box-shadow: 0 0 14px rgba(36, 238, 137, 0.35), inset 0 0 12px rgba(36, 238, 137, 0.12);
      backdrop-filter: blur(4px);
    }

    .tile-gem {
      background: linear-gradient(135deg, #1fd879 0%, #24ee89 100%) !important;
      border-color: #24ee89 !important;
      box-shadow: 0 0 20px rgba(36, 238, 137, 0.6) !important;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tile-bomb {
      background: linear-gradient(135deg, #ed4245 0%, #b91c1c 100%) !important;
      border-color: #ed4245 !important;
      box-shadow: 0 0 25px rgba(237, 66, 69, 0.7) !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
  </style>
</head>
<body class="bg-bgDark text-white min-h-screen flex flex-col font-sans antialiased selection:bg-bcGreen selection:text-bgDark">

  <!-- Top Bar Anchor -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <!-- Main Game Container -->
  <main class="max-w-md w-full mx-auto p-3 sm:p-4 space-y-3 flex-1 pb-10">

    <!-- 5x5 Mines Grid Board -->
    <div class="mines-card-bg rounded-3xl p-3.5 sm:p-4 shadow-2xl relative">
      <div id="minesGrid">
        <!-- 25 Tiles generated dynamically -->
      </div>
    </div>

    <!-- Multiplier + Profit -->
    <div class="mines-card-bg rounded-2xl p-3 flex justify-between items-center text-xs">
      <div class="flex items-center gap-2">
        <span class="text-textGray font-medium">Next Multiplier:</span>
        <span id="nextMultiplier" class="font-extrabold text-bcGreen text-sm">1.03x</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-textGray font-medium">Profit:</span>
        <span id="profitAmount" class="font-extrabold text-bcGreen text-sm">৳ 0.00</span>
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="mines-card-bg rounded-2xl p-4 space-y-3.5">

      <!-- Bet Amount -->
      <div class="space-y-1">
        <div class="flex justify-between text-xs text-textGray font-semibold">
          <span>Bet Amount</span>
          <span class="text-xs text-textGray">Min: 10 ৳</span>
        </div>
        <div class="flex items-center bg-inputBg border border-borderDark rounded-xl p-1">
          <input type="number" id="betAmount" value="10" min="0" class="w-full bg-transparent px-3 text-xs font-bold text-white focus:outline-none">
          <button onclick="adjustBet(0.5)" class="bg-panelDark hover:bg-borderDark text-textGray hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold mr-1">1/2</button>
          <button onclick="adjustBet(2)" class="bg-panelDark hover:bg-borderDark text-textGray hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold mr-1">2x</button>
          <button onclick="setMaxBet()" class="bg-panelDark hover:bg-borderDark text-textGray hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold">MAX</button>
        </div>
      </div>

      <!-- Mines Count Slider -->
      <div class="space-y-1">
        <div class="flex justify-between text-xs text-textGray font-semibold">
          <span>Mines</span>
          <span id="minesCountDisplay" class="font-bold text-bcGreen">3</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs text-textGray">1</span>
          <input type="range" id="minesRange" min="1" max="24" value="3" oninput="updateMinesCount(this.value)" class="w-full accent-bcGreen cursor-pointer h-2 bg-inputBg rounded-lg">
          <span class="text-xs text-textGray">24</span>
        </div>
      </div>

      <!-- Number of Bets (Auto) -->
      <div id="autoBetsSection" class="space-y-1 hidden">
        <div class="flex justify-between text-xs text-textGray font-semibold">
          <span>Number of Bets</span>
          <span class="text-xs text-textGray">0 = ∞</span>
        </div>
        <div class="flex items-center bg-inputBg border border-borderDark rounded-xl p-1">
          <input type="number" id="autoBetCount" value="0" min="0" class="w-full bg-transparent px-3 text-xs font-bold text-white focus:outline-none">
          <button onclick="setAutoBets(0)" class="bg-panelDark hover:bg-borderDark text-textGray hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold mr-1">∞</button>
          <button onclick="setAutoBets(10)" class="bg-panelDark hover:bg-borderDark text-textGray hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold mr-1">10</button>
          <button onclick="setAutoBets(100)" class="bg-panelDark hover:bg-borderDark text-textGray hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold">100</button>
        </div>
      </div>

      <!-- Action Button -->
      <button id="actionBtn" onclick="handleAction()" class="w-full bg-bcGreen hover:bg-bcGreenHover text-bgDark font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg">
        Bet
      </button>

      <!-- Manual / Auto Tabs -->
      <div class="flex bg-inputBg rounded-xl overflow-hidden border border-borderDark text-xs font-bold">
        <button onclick="switchTab('manual')" id="tabManual" class="flex-1 py-2.5 text-center text-bcGreen border-b-2 border-bcGreen bg-panelDark transition">Manual</button>
        <button onclick="switchTab('auto')" id="tabAuto" class="flex-1 py-2.5 text-center text-textGray hover:text-white transition">Auto</button>
      </div>

      <!-- Advanced Options (Auto only) -->
      <div id="advancedOptions" class="hidden space-y-3 pt-1">
        <div class="text-xs font-bold text-white">Advanced Options</div>

        <!-- On Win -->
        <div class="space-y-1">
          <label class="text-[11px] text-textGray">On win</label>
          <div class="grid grid-cols-2 gap-2">
            <div class="flex bg-inputBg border border-borderDark rounded-lg p-1">
              <button onclick="setAutoStrategy('win', 'reset')" id="winResetBtn" class="flex-1 py-1 bg-panelDark text-white font-bold rounded text-xs shadow">Reset</button>
              <button onclick="setAutoStrategy('win', 'increase')" id="winIncBtn" class="flex-1 py-1 text-textGray font-bold rounded text-xs">Increase by</button>
            </div>
            <div class="flex items-center bg-inputBg border border-borderDark rounded-lg px-2 py-1">
              <input type="number" id="winIncPercent" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-right pr-1 text-xs">
              <span class="text-textGray text-xs">%</span>
            </div>
          </div>
        </div>

        <!-- On Loss -->
        <div class="space-y-1">
          <label class="text-[11px] text-textGray">On loss</label>
          <div class="grid grid-cols-2 gap-2">
            <div class="flex bg-inputBg border border-borderDark rounded-lg p-1">
              <button onclick="setAutoStrategy('loss', 'reset')" id="lossResetBtn" class="flex-1 py-1 bg-panelDark text-white font-bold rounded text-xs shadow">Reset</button>
              <button onclick="setAutoStrategy('loss', 'increase')" id="lossIncBtn" class="flex-1 py-1 text-textGray font-bold rounded text-xs">Increase by</button>
            </div>
            <div class="flex items-center bg-inputBg border border-borderDark rounded-lg px-2 py-1">
              <input type="number" id="lossIncPercent" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-right pr-1 text-xs">
              <span class="text-textGray text-xs">%</span>
            </div>
          </div>
        </div>

        <!-- Stop on Win -->
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-textGray">Stop on win</span>
            <span class="text-textGray text-[10px]">≈0 BDT</span>
          </div>
          <div class="flex items-center bg-inputBg border border-borderDark rounded-lg px-3 py-1.5">
            <span class="text-bcGreen font-bold mr-2 text-xs">৳</span>
            <input type="number" id="autoStopProfit" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-xs">
          </div>
        </div>

        <!-- Stop on Loss -->
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-textGray">Stop on loss</span>
            <span class="text-textGray text-[10px]">≈0 BDT</span>
          </div>
          <div class="flex items-center bg-inputBg border border-borderDark rounded-lg px-3 py-1.5">
            <span class="text-bcGreen font-bold mr-2 text-xs">৳</span>
            <input type="number" id="autoStopLoss" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-xs">
          </div>
        </div>
      </div>

    </div>

  </main>

  <script>
    let currentUserId = null;
    let userBalance = 0;
    let gameState = 'idle'; // 'idle', 'playing', 'ended'
    let minesPositions = [];
    let openedTiles = [];
    let selectedTiles = []; // For Auto mode pre-selection
    let minesCount = 3;
    let currentBet = 10;
    let currentMultiplier = 1.0;
    let activeTab = 'manual';
    let isAutoRunning = false;
    let autoWinStrategy = 'reset';
    let autoLossStrategy = 'reset';
    let baseBetAmount = 10;
    let autoRemainingBets = 0;
    let sessionProfit = 0;

    // Load Top Bar Component
    async function loadTopBar() {
      try {
        const res = await fetch('../bar/top.html');
        if (res.ok) {
          document.getElementById('topBarContainer').innerHTML = await res.text();

          // Fix deposit link if present
          const depositLinks = document.querySelectorAll('a[href*="deposit"]');
          depositLinks.forEach(a => {
            a.href = '../account/deposit.html';
          });

          // Fix member link if present
          const memberLinks = document.querySelectorAll('a[href*="member"]');
          memberLinks.forEach(a => {
            if (a.href.includes('admin/mem/member.html')) {
              a.href = a.href.replace('admin/mem/member.html', 'mem/member.html');
            }
          });
        }
      } catch (e) { console.error(e); }
    }

    // Init Auth & Balance
    async function init() {
      await loadTopBar();
      try {
        let user = null;
        if (typeof requireAuth === 'function') user = await requireAuth();
        else if (typeof getCurrentUser === 'function') user = await getCurrentUser();

        if (user) {
          currentUserId = user.id;
          const { data: profile } = await supabaseClient.from('profiles').select('balance').eq('id', user.id).single();
          if (profile) {
            userBalance = parseFloat(profile.balance) || 0;
            const topBal = document.getElementById('topBarBalance');
            if (topBal) topBal.innerText = userBalance.toFixed(2);
          }
        }
      } catch (err) { console.error("Init Error:", err); }

      renderGrid();
      calculateNextMultiplier();
    }

    function renderGrid() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const btn = document.createElement('button');
        btn.dataset.index = i;
        btn.className = "tile";
        
        // Show selected state in Auto mode when idle
        if (activeTab === 'auto' && gameState === 'idle' && selectedTiles.includes(i)) {
          btn.classList.add('tile-selected');
        }

        btn.onclick = () => handleTileClick(i);
        
        // Disable only during playing in manual, or when auto is running
        if (activeTab === 'manual') {
          btn.disabled = gameState !== 'playing';
        } else {
          // Auto mode: allow selection when idle, disable when running/playing
          btn.disabled = isAutoRunning || gameState === 'playing';
        }

        grid.appendChild(btn);
      }
    }

    function handleTileClick(index) {
      if (activeTab === 'auto' && gameState === 'idle' && !isAutoRunning) {
        // Toggle selection for Auto → glassy green
        const idx = selectedTiles.indexOf(index);
        if (idx > -1) {
          selectedTiles.splice(idx, 1);
        } else {
          selectedTiles.push(index);
        }
        renderGrid();
        calculateNextMultiplier();
        return;
      }

      // Manual mode reveal (after bet)
      if (activeTab === 'manual' && gameState === 'playing') {
        revealTile(index);
      }
    }

    function updateMinesCount(val) {
      if (gameState === 'playing' || isAutoRunning) return;
      minesCount = parseInt(val);
      document.getElementById('minesCountDisplay').innerText = minesCount;
      calculateNextMultiplier();
    }

    function adjustBet(factor) {
      if (gameState === 'playing' || isAutoRunning) return;
      const inp = document.getElementById('betAmount');
      let val = parseFloat(inp.value) * factor;
      if (val < 0) val = 0;
      inp.value = Math.floor(val);
    }

    function setMaxBet() {
      if (gameState === 'playing' || isAutoRunning) return;
      document.getElementById('betAmount').value = Math.floor(userBalance);
    }

    function setAutoBets(n) {
      document.getElementById('autoBetCount').value = n;
    }

    function calculateNextMultiplier() {
      const safeTiles = 25 - minesCount;
      const count = (activeTab === 'auto' && gameState === 'idle') 
        ? selectedTiles.length 
        : openedTiles.length;
      
      let mult = 1.0;
      for (let i = 0; i < count; i++) {
        mult *= (25 - i) / (safeTiles - i);
      }
      if (count < safeTiles) {
        mult *= (25 - count) / (safeTiles - count);
      }
      currentMultiplier = parseFloat((mult * 0.97).toFixed(2));
      if (isNaN(currentMultiplier) || currentMultiplier < 1) currentMultiplier = 1.0;

      document.getElementById('nextMultiplier').innerText = `${currentMultiplier.toFixed(2)}x`;
      
      const profit = (currentBet * currentMultiplier) - currentBet;
      document.getElementById('profitAmount').innerText = `৳ ${Math.max(0, profit).toFixed(2)}`;
    }

    function switchTab(tab) {
      if (gameState === 'playing' || isAutoRunning) return;
      activeTab = tab;

      const tabManual = document.getElementById('tabManual');
      const tabAuto = document.getElementById('tabAuto');
      const autoBetsSection = document.getElementById('autoBetsSection');
      const advancedOptions = document.getElementById('advancedOptions');
      const btn = document.getElementById('actionBtn');

      if (tab === 'manual') {
        tabManual.className = "flex-1 py-2.5 text-center text-bcGreen border-b-2 border-bcGreen bg-panelDark transition";
        tabAuto.className = "flex-1 py-2.5 text-center text-textGray hover:text-white transition";
        autoBetsSection.classList.add('hidden');
        advancedOptions.classList.add('hidden');
        btn.innerText = "Bet";
        btn.className = "w-full bg-bcGreen hover:bg-bcGreenHover text-bgDark font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg";
        selectedTiles = [];
      } else {
        tabAuto.className = "flex-1 py-2.5 text-center text-bcGreen border-b-2 border-bcGreen bg-panelDark transition";
        tabManual.className = "flex-1 py-2.5 text-center text-textGray hover:text-white transition";
        autoBetsSection.classList.remove('hidden');
        advancedOptions.classList.remove('hidden');
        btn.innerText = "Start Auto";
        btn.className = "w-full bg-bcGreen hover:bg-bcGreenHover text-bgDark font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg";
      }
      renderGrid();
      calculateNextMultiplier();
    }

    function setAutoStrategy(type, strategy) {
      if (type === 'win') {
        autoWinStrategy = strategy;
        document.getElementById('winResetBtn').className = strategy === 'reset' ? 'flex-1 py-1 bg-panelDark text-white font-bold rounded text-xs shadow' : 'flex-1 py-1 text-textGray font-bold rounded text-xs';
        document.getElementById('winIncBtn').className = strategy === 'increase' ? 'flex-1 py-1 bg-panelDark text-white font-bold rounded text-xs shadow' : 'flex-1 py-1 text-textGray font-bold rounded text-xs';
      } else {
        autoLossStrategy = strategy;
        document.getElementById('lossResetBtn').className = strategy === 'reset' ? 'flex-1 py-1 bg-panelDark text-white font-bold rounded text-xs shadow' : 'flex-1 py-1 text-textGray font-bold rounded text-xs';
        document.getElementById('lossIncBtn').className = strategy === 'increase' ? 'flex-1 py-1 bg-panelDark text-white font-bold rounded text-xs shadow' : 'flex-1 py-1 text-textGray font-bold rounded text-xs';
      }
    }

    async function handleAction() {
      if (activeTab === 'auto') {
        if (isAutoRunning) {
          stopAuto();
        } else {
          startAuto();
        }
        return;
      }

      // Manual mode
      if (gameState === 'idle' || gameState === 'ended') {
        await startGame();
      } else if (gameState === 'playing') {
        await cashout();
      }
    }

    async function startGame() {
      currentBet = parseFloat(document.getElementById('betAmount').value) || 0;
      if (currentBet > 0 && currentBet < 10) {
        alert("সর্বনিম্ন বেট ১০ ৳");
        return false;
      }

      if (currentBet > userBalance) {
        alert("আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
        return false;
      }

      if (currentBet > 0) {
        userBalance -= currentBet;
        updateUIBalance(userBalance);
        await supabaseClient.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);
      }

      minesPositions = [];
      while (minesPositions.length < minesCount) {
        const r = Math.floor(Math.random() * 25);
        if (!minesPositions.includes(r)) minesPositions.push(r);
      }

      openedTiles = [];
      gameState = 'playing';

      renderGrid();
      document.getElementById('minesRange').disabled = true;
      document.getElementById('betAmount').disabled = true;

      const btn = document.getElementById('actionBtn');
      if (activeTab === 'manual') {
        btn.className = "w-full bg-amber-500 hover:bg-amber-400 text-bgDark font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg";
        btn.innerText = `Cashout (৳ ${currentBet.toFixed(2)})`;
      }

      calculateNextMultiplier();
      return true;
    }

    async function revealTile(index) {
      if (gameState !== 'playing' || openedTiles.includes(index)) return;

      openedTiles.push(index);
      const tiles = document.getElementById('minesGrid').children;
      const tileBtn = tiles[index];

      if (minesPositions.includes(index)) {
        // Bomb
        tileBtn.classList.add('tile-bomb');
        tileBtn.innerHTML = '<i class="fa-solid fa-bomb text-yellow-300"></i>';
        await gameOver(false);
      } else {
        // Gem
        tileBtn.classList.add('tile-gem');
        tileBtn.innerHTML = '<i class="fa-solid fa-gem text-bgDark"></i>';
        
        calculateNextMultiplier();

        const currentPayout = currentBet * currentMultiplier;
        const btn = document.getElementById('actionBtn');
        if (activeTab === 'manual') {
          btn.innerText = `Cashout (৳ ${currentPayout.toFixed(2)})`;
        }

        if (openedTiles.length === (25 - minesCount)) {
          await cashout();
        }
      }
    }

    async function cashout() {
      if (gameState !== 'playing' || openedTiles.length === 0) return;

      const payout = currentBet * currentMultiplier;
      const profit = payout - currentBet;
      sessionProfit += profit;

      if (currentBet > 0) {
        userBalance += payout;
        updateUIBalance(userBalance);
        await supabaseClient.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);

        await supabaseClient.from('bets').insert([{
          user_id: currentUserId,
          target_number: minesCount,
          roll_result: openedTiles.length,
          bet_amount: currentBet,
          payout: currentMultiplier,
          is_bool: true
        }]);
      }

      const btn = document.getElementById('actionBtn');
      btn.innerText = `${currentMultiplier.toFixed(2)}x  |  +৳ ${profit.toFixed(2)}`;

      await gameOver(true);
    }

    async function gameOver(isWin) {
      gameState = 'ended';
      
      const tiles = document.getElementById('minesGrid').children;
      for (let i = 0; i < 25; i++) {
        tiles[i].disabled = true;
        if (minesPositions.includes(i) && !openedTiles.includes(i)) {
          tiles[i].classList.add('tile-bomb');
          tiles[i].innerHTML = '<i class="fa-solid fa-bomb text-yellow-300"></i>';
        }
      }

      if (!isWin && currentBet > 0) {
        sessionProfit -= currentBet;
        await supabaseClient.from('bets').insert([{
          user_id: currentUserId,
          target_number: minesCount,
          roll_result: openedTiles.length,
          bet_amount: currentBet,
          payout: 0,
          is_bool: false
        }]);
      }

      document.getElementById('minesRange').disabled = false;
      document.getElementById('betAmount').disabled = false;

      if (isAutoRunning) {
        applyAutoStrategy(isWin);
        checkAutoStopConditions(isWin);

        if (isAutoRunning) {
          setTimeout(() => {
            if (isAutoRunning) runAutoRound();
          }, 900);
          return;
        }
      }

      const btn = document.getElementById('actionBtn');
      if (activeTab === 'manual') {
        setTimeout(() => {
          btn.className = "w-full bg-bcGreen hover:bg-bcGreenHover text-bgDark font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg";
          btn.innerText = "Bet";
          gameState = 'idle';
          renderGrid();
        }, 1500);
      } else {
        btn.innerText = "Start Auto";
        btn.className = "w-full bg-bcGreen hover:bg-bcGreenHover text-bgDark font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg";
        gameState = 'idle';
        renderGrid();
      }
    }

    function applyAutoStrategy(isWin) {
      if (isWin && autoWinStrategy === 'increase') {
        const inc = parseFloat(document.getElementById('winIncPercent').value) || 0;
        let newBet = parseFloat(document.getElementById('betAmount').value) * (1 + inc / 100);
        document.getElementById('betAmount').value = Math.floor(newBet);
      } else if (isWin && autoWinStrategy === 'reset') {
        document.getElementById('betAmount').value = baseBetAmount;
      } else if (!isWin && autoLossStrategy === 'increase') {
        const inc = parseFloat(document.getElementById('lossIncPercent').value) || 0;
        let newBet = parseFloat(document.getElementById('betAmount').value) * (1 + inc / 100);
        document.getElementById('betAmount').value = Math.floor(newBet);
      } else if (!isWin && autoLossStrategy === 'reset') {
        document.getElementById('betAmount').value = baseBetAmount;
      }
    }

    function checkAutoStopConditions(isWin) {
      const stopProfit = parseFloat(document.getElementById('autoStopProfit').value) || 0;
      const stopLoss = parseFloat(document.getElementById('autoStopLoss').value) || 0;

      if (stopProfit > 0 && sessionProfit >= stopProfit) {
        stopAuto();
        return;
      }
      if (stopLoss > 0 && sessionProfit <= -stopLoss) {
        stopAuto();
        return;
      }

      if (autoRemainingBets > 0) {
        autoRemainingBets--;
        document.getElementById('autoBetCount').value = autoRemainingBets;
        if (autoRemainingBets === 0) {
          stopAuto();
        }
      }
    }

    async function startAuto() {
      if (selectedTiles.length === 0) {
        alert("অটো বেট শুরু করতে অন্তত একটি টাইল সিলেক্ট করুন!");
        return;
      }

      baseBetAmount = parseFloat(document.getElementById('betAmount').value) || 0;
      autoRemainingBets = parseInt(document.getElementById('autoBetCount').value) || 0;
      sessionProfit = 0;
      isAutoRunning = true;

      const btn = document.getElementById('actionBtn');
      btn.innerText = "Stop Auto";
      btn.className = "w-full bg-bcRed hover:bg-red-600 text-white font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg";

      document.getElementById('minesRange').disabled = true;
      document.getElementById('betAmount').disabled = true;

      runAutoRound();
    }

    function stopAuto() {
      isAutoRunning = false;
      const btn = document.getElementById('actionBtn');
      btn.innerText = "Start Auto";
      btn.className = "w-full bg-bcGreen hover:bg-bcGreenHover text-bgDark font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg";

      document.getElementById('minesRange').disabled = false;
      document.getElementById('betAmount').disabled = false;

      gameState = 'idle';
      renderGrid();
    }

    async function runAutoRound() {
      if (!isAutoRunning) return;

      const started = await startGame();
      if (!started) {
        stopAuto();
        return;
      }

      // Directly reveal selected tiles one by one (result shown immediately)
      for (let i = 0; i < selectedTiles.length; i++) {
        if (!isAutoRunning || gameState !== 'playing') break;

        await new Promise(r => setTimeout(r, 300));
        await revealTile(selectedTiles[i]);

        if (gameState !== 'playing') break;
      }

      // If still playing after all selected → cashout
      if (gameState === 'playing' && openedTiles.length > 0) {
        await cashout();
      }
    }

    function updateUIBalance(bal) {
      const topBal = document.getElementById('topBarBalance');
      if (topBal) topBal.innerText = bal.toFixed(2);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
