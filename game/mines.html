<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mines Original - Game Portal</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    html {
      min-height: 100%;
      background: #0f141c;
      touch-action: pan-x pan-y;
    }

    body {
      background: #0f141c;
      color: #ffffff;
      font-family: sans-serif;
      padding-bottom: 90px;
      overflow-y: auto;
      -webkit-text-size-adjust: 100%;
      user-select: none;
    }

    .bc-main-wrapper {
      background: #171d28;
      border: 1px solid #222b3a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .bc-divider {
      height: 1px;
      background-color: #222b3a;
      width: 100%;
    }

    .bc-input-box {
      background: #0f141c;
      border: 1px solid #222b3a;
      border-radius: 10px;
    }
    .bc-input-box:focus-within {
      border-color: #24ee89;
    }

    .green-btn {
      background: #24ee89;
      color: #0f141c;
      font-weight: 800;
    }
    .green-btn:hover {
      background: #1ed67a;
    }

    .red-btn {
      background: #ed4245;
      color: #ffffff;
      font-weight: 800;
    }
    .red-btn:hover {
      background: #d3383b;
    }

    #minesGrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      aspect-ratio: 1 / 1;
      width: 100%;
    }

    .tile {
      background: #0f141c;
      border: 1px solid #222b3a;
      border-radius: 8px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 2px 4px rgba(0,0,0,0.35);
      transition: all 0.15s ease;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 900;
      aspect-ratio: 1 / 1;
      cursor: pointer;
    }

    .tile:hover:not(:disabled) {
      background: #222b3a;
      border-color: #24ee89;
    }

    .tile:disabled {
      cursor: default;
    }

    .tile-selected {
      background: rgba(36, 238, 137, 0.15) !important;
      border: 2px solid #24ee89 !important;
      box-shadow: 0 0 14px rgba(36, 238, 137, 0.4), inset 0 0 10px rgba(36, 238, 137, 0.15) !important;
    }

    .tile-gem {
      background: linear-gradient(135deg, #24ee89 0%, #1ed67a 100%) !important;
      box-shadow: 0 0 18px rgba(36, 238, 137, 0.55) !important;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tile-bomb {
      background: linear-gradient(135deg, #ed4245 0%, #b91c1c 100%) !important;
      box-shadow: 0 0 20px rgba(237, 66, 69, 0.65) !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    /* Cashout Popup */
    #cashoutPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      backdrop-blur-sm;
    }

    #cashoutPopup.show {
      display: flex;
    }

    .popup-box {
      background: #171d28;
      border: 1px solid #222b3a;
      border-radius: 16px;
      padding: 28px 36px;
      text-align: center;
      min-width: 220px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      animation: popIn 0.25s ease;
    }

    #minesLoader {
      position: fixed;
      inset: 0;
      background: #0f141c;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #minesLoader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-bomb {
      font-size: 3.5rem;
      color: #24ee89;
      animation: bombPulse 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(36, 238, 137, 0.6));
    }

    .loader-text {
      margin-top: 18px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #8596a6;
      text-transform: uppercase;
      animation: textFade 1.4s ease-in-out infinite;
    }

    .loader-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 3px;
      background: #24ee89;
      border-radius: 50%;
      animation: dotBounce 1.2s infinite ease-in-out;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bombPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.18); opacity: 0.85; }
    }

    @keyframes textFade {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* Hide scrollbar for history bar */
    #historyBar::-webkit-scrollbar {
      display: none;
    }

    #historyBar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-[#0f141c] text-white min-h-screen flex flex-col font-sans antialiased selection:bg-[#24ee89] selection:text-[#0f141c]">

  <!-- Mines Symbol Loader -->
  <div id="minesLoader">
    <div class="loader-bomb">
      <i class="fa-solid fa-bomb"></i>
    </div>
    <div class="loader-text">Loading Mines</div>
    <div class="loader-dots mt-3">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Top Bar Anchor -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <!-- Cashout Result Popup -->
  <div id="cashoutPopup">
    <div class="popup-box">
      <div id="popupMultiplier" class="text-3xl font-black text-[#24ee89] mb-1">2.50x</div>
      <div id="popupAmount" class="text-lg font-bold text-white">৳ 25.00</div>
    </div>
  </div>

  <!-- Main Game Container -->
  <main class="max-w-md w-full mx-auto p-3 sm:p-4 space-y-3 flex-1 pb-10">

    <!-- Unified Main Game Wrapper Card -->
    <div class="bc-main-wrapper flex flex-col shadow-xl">

      <!-- 5x5 Mines Grid Board Area -->
      <div class="p-3 sm:p-4 bg-[#171d28] flex justify-center items-center">
        <div id="minesGrid"></div>
      </div>

      <div class="bc-divider"></div>

      <!-- Multiplier + Profit Bar -->
      <div class="px-4 py-2.5 flex justify-between items-center text-xs bg-[#171d28]">
        <div class="flex items-center gap-2">
          <span class="text-gray-400 font-medium">Next Multiplier:</span>
          <span id="nextMultiplier" class="font-extrabold text-[#24ee89] text-sm">1.03x</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-gray-400 font-medium">Profit:</span>
          <span id="profitAmount" class="font-extrabold text-[#24ee89] text-sm">৳ 0.00</span>
        </div>
      </div>

      <div class="bc-divider"></div>

      <!-- Controls Panel Inside Wrapper -->
      <div class="p-4 space-y-3.5 bg-[#171d28]">

        <!-- Manual / Auto Tabs Switcher -->
        <div class="bg-[#0f141c] p-1 rounded-xl flex justify-around text-sm font-medium text-gray-400 border border-[#222b3a]">
          <button onclick="switchTab('manual')" id="tabManual" class="py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition">Manual</button>
          <button onclick="switchTab('auto')" id="tabAuto" class="py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition">Auto</button>
        </div>

        <!-- Bet Amount -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs text-gray-400 font-semibold">
            <span>Bet Amount (৳)</span>
            <span class="text-xs text-gray-400">Min: 10 ৳</span>
          </div>

          <div class="flex items-center bc-input-box p-1">
            <span class="text-[#24ee89] font-bold px-2 text-sm">৳</span>
            <input type="number" id="betAmount" value="10" min="0" class="w-full bg-transparent px-1 text-xs font-bold text-white focus:outline-none">

            <div class="flex items-center gap-1">
              <button onclick="adjustBet(0.5)" class="bg-[#171d28] hover:bg-[#222b3a] text-gray-300 hover:text-white px-2 py-1 rounded-lg text-[10px] font-bold border border-[#222b3a]">1/2</button>
              <button onclick="adjustBet(2)" class="bg-[#171d28] hover:bg-[#222b3a] text-gray-300 hover:text-white px-2 py-1 rounded-lg text-[10px] font-bold border border-[#222b3a]">2x</button>
              <button onclick="setMaxBet()" class="bg-[#171d28] hover:bg-[#222b3a] text-[#F5CF66] px-2 py-1 rounded-lg text-[10px] font-bold border border-[#222b3a]">MAX</button>
            </div>
          </div>
        </div>

        <!-- Mines Count Slider -->
        <div class="space-y-1">
          <div class="flex justify-between text-xs text-gray-400 font-semibold">
            <span>Mines</span>
            <span id="minesCountDisplay" class="font-bold text-[#24ee89]">3</span>
          </div>

          <div class="flex items-center gap-3 bc-input-box p-2.5">
            <span class="text-xs text-gray-400">1</span>
            <input type="range" id="minesRange" min="1" max="24" value="3" oninput="updateMinesCount(this.value)" class="w-full accent-[#24ee89] cursor-pointer h-2 bg-[#0f141c] rounded-lg">
            <span class="text-xs text-gray-400">24</span>
          </div>
        </div>

        <!-- Number of Bets (Auto) -->
        <div id="autoBetsSection" class="space-y-1 hidden">
          <div class="flex justify-between text-xs text-gray-400 font-semibold">
            <span>Number of Bets</span>
            <span class="text-xs text-gray-400">0 = ∞</span>
          </div>

          <div class="flex items-center bc-input-box p-1">
            <input type="number" id="autoBetCount" value="0" min="0" class="w-full bg-transparent px-3 text-xs font-bold text-white focus:outline-none">

            <div class="flex items-center gap-1">
              <button onclick="setAutoBets(0)" class="bg-[#171d28] hover:bg-[#222b3a] text-gray-300 hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold border border-[#222b3a]">∞</button>
              <button onclick="setAutoBets(10)" class="bg-[#171d28] hover:bg-[#222b3a] text-gray-300 hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold border border-[#222b3a]">10</button>
              <button onclick="setAutoBets(100)" class="bg-[#171d28] hover:bg-[#222b3a] text-gray-300 hover:text-white px-2.5 py-1 rounded-lg text-[10px] font-bold border border-[#222b3a]">100</button>
            </div>
          </div>
        </div>

        <!-- Advanced Options (Auto only) -->
        <div id="advancedOptions" class="hidden space-y-3 pt-1 border-t border-[#222b3a]">
          <div class="text-xs font-bold text-white">Advanced Options</div>

          <div class="space-y-1 bg-[#0f141c] p-2.5 rounded-xl border border-[#222b3a]">
            <label class="text-[11px] text-gray-400">On win</label>

            <div class="grid grid-cols-2 gap-2 mt-1">
              <div class="flex bg-[#171d28] border border-[#222b3a] rounded-lg p-1">
                <button onclick="setAutoStrategy('win', 'reset')" id="winResetBtn" class="flex-1 py-1 bg-[#222b3a] text-white font-bold rounded text-xs shadow">Reset</button>
                <button onclick="setAutoStrategy('win', 'increase')" id="winIncBtn" class="flex-1 py-1 text-gray-400 font-bold rounded text-xs hover:text-white">Increase by</button>
              </div>

              <div class="flex items-center bc-input-box px-2 py-1">
                <input type="number" id="winIncPercent" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-right pr-1 text-xs">
                <span class="text-gray-400 text-xs ml-1">%</span>
              </div>
            </div>
          </div>

          <div class="space-y-1 bg-[#0f141c] p-2.5 rounded-xl border border-[#222b3a]">
            <label class="text-[11px] text-gray-400">On loss</label>

            <div class="grid grid-cols-2 gap-2 mt-1">
              <div class="flex bg-[#171d28] border border-[#222b3a] rounded-lg p-1">
                <button onclick="setAutoStrategy('loss', 'reset')" id="lossResetBtn" class="flex-1 py-1 bg-[#222b3a] text-white font-bold rounded text-xs shadow">Reset</button>
                <button onclick="setAutoStrategy('loss', 'increase')" id="lossIncBtn" class="flex-1 py-1 text-gray-400 font-bold rounded text-xs hover:text-white">Increase by</button>
              </div>

              <div class="flex items-center bc-input-box px-2 py-1">
                <input type="number" id="lossIncPercent" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-right pr-1 text-xs">
                <span class="text-gray-400 text-xs ml-1">%</span>
              </div>
            </div>
          </div>

          <div class="space-y-1">
            <div class="flex justify-between items-center text-[11px]">
              <span class="text-gray-400">Stop on win</span>
              <span class="text-gray-400 text-[10px]">≈0 ৳</span>
            </div>

            <div class="flex items-center bc-input-box px-3 py-1.5">
              <span class="text-[#24ee89] font-bold mr-2 text-xs">৳</span>
              <input type="number" id="autoStopProfit" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-xs">
            </div>
          </div>

          <div class="space-y-1">
            <div class="flex justify-between items-center text-[11px]">
              <span class="text-gray-400">Stop on loss</span>
              <span class="text-gray-400 text-[10px]">≈0 ৳</span>
            </div>

            <div class="flex items-center bc-input-box px-3 py-1.5">
              <span class="text-[#24ee89] font-bold mr-2 text-xs">৳</span>
              <input type="number" id="autoStopLoss" value="0" class="w-full bg-transparent text-white font-bold focus:outline-none text-xs">
            </div>
          </div>
        </div>

        <!-- Action Button -->
        <button id="actionBtn" onclick="handleAction()" class="w-full green-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg">
          Bet
        </button>

      </div>

      <div class="bc-divider"></div>

      <!-- Bottom Action Bar inside the same card wrapper -->
      <div class="flex items-center justify-between px-4 py-2.5 text-gray-400 text-sm bg-[#171d28]">
        <button onclick="toggleSettingsModal()" class="hover:text-[#24ee89] p-1.5">
          <i class="fa-solid fa-gear"></i>
        </button>

        <button class="flex items-center gap-1.5 hover:text-[#24ee89] p-1.5">
          <i class="fa-solid fa-star text-xs text-[#24ee89]"></i>
          <span class="text-xs font-semibold">12543</span>
        </button>

        <button id="turboBtn" onclick="toggleTurbo()" class="hover:text-[#24ee89] p-1.5 flex items-center gap-1" title="Turbo Mode">
          <i id="turboIcon" class="fa-solid fa-bolt text-gray-400"></i>
          <span id="turboText" class="text-[10px] font-bold">OFF</span>
        </button>

        <button onclick="toggleLiveStatsModal()" class="hover:text-[#24ee89] p-1.5">
          <i class="fa-solid fa-chart-simple"></i>
        </button>
      </div>

    </div>

  </main>

  <!-- Settings Bottom Sheet Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center backdrop-blur-sm">
    <div class="bc-main-wrapper w-full max-w-md rounded-t-2xl p-4 flex flex-col gap-3 animate-slide-up bg-[#171d28] border-t border-[#222b3a]">
      <div class="flex justify-between items-center pb-2 border-b border-[#222b3a]">
        <span class="font-bold text-white">Settings</span>
        <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <button class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-left text-sm text-gray-300">
        <i class="fa-regular fa-circle-question w-5 text-[#24ee89]"></i> Help
      </button>

      <button onclick="toggleSoundEffect()" id="soundSettingBtn" class="flex items-center justify-between py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-sm text-[#24ee89]">
        <span class="flex items-center gap-3"><i class="fa-solid fa-volume-high w-5"></i> Sound Effects</span>
        <span id="soundStatusText" class="text-xs font-bold">ON</span>
      </button>

      <button class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-left text-sm text-gray-300">
        <i class="fa-solid fa-seedling w-5 text-[#24ee89]"></i> Seed
      </button>

      <button onclick="shareGame()" class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-left text-sm text-gray-300">
        <i class="fa-solid fa-share-nodes w-5 text-[#24ee89]"></i> Share
      </button>
    </div>
  </div>

  <!-- Live Stats Modal -->
  <div id="liveStatsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bc-main-wrapper w-full max-w-sm rounded-2xl p-4 flex flex-col gap-4 shadow-2xl bg-[#171d28]">
      <div class="flex justify-between items-center pb-2 border-b border-[#222b3a]">
        <span class="font-bold text-white text-base">Live Stats</span>
        <button onclick="toggleLiveStatsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="bc-input-box p-3 rounded-xl flex flex-col gap-3">
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-400">Profit</span>
          <span id="statsProfit" class="text-[#24ee89] font-bold">৳ 0.00</span>
        </div>

        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-400">Wagered</span>
          <span id="statsWagered" class="text-white font-bold">৳ 0.00</span>
        </div>

        <div class="flex justify-between items-center text-sm border-t border-[#222b3a] pt-2">
          <span class="text-gray-400">WIN: <strong id="statsWin" class="text-white">0</strong></span>
          <span class="text-gray-400">LOSE: <strong id="statsLose" class="text-white">0</strong></span>
        </div>
      </div>

      <div class="bc-input-box p-3 rounded-xl flex flex-col gap-2 h-36 relative overflow-hidden">
        <span class="text-[11px] text-gray-400">Profit/Loss Graph</span>
        <div class="flex-1 w-full flex items-end gap-1 overflow-x-auto pt-4" id="statsGraphContainer">
          <div class="w-full text-center text-xs text-gray-500 self-center">No bets yet</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUserId = null;
    let userBalance = 0;
    let gameState = 'idle';
    let minesPositions = [];
    let openedTiles = [];
    let selectedTiles = [];
    let minesCount = 3;
    let currentBet = 10;
    let currentMultiplier = 1.0;
    let activeTab = 'manual';
    let isAutoRunning = false;
    let autoWinStrategy = 'reset';
    let autoLossStrategy = 'reset';
    let baseBetAmount = 10;
    let autoRemainingBets = 0;
    let sessionProfit = 0;

    let isTurboOn = false;
    let isSoundOn = true;
    let totalWagered = 0;
    let totalWins = 0;
    let totalLosses = 0;
    let totalProfit = 0;
    let profitHistory = [0];

    // Prevent Zoom In / Zoom Out
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });

    const horrorBgMusic = new Audio('https://freesound.org/data/previews/515/515843_6142149-lq.mp3');
    horrorBgMusic.loop = true;
    horrorBgMusic.volume = 0.4;

    const winSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    const loseSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3');

    function playSound(isWin) {
      if (!isSoundOn) return;

      if (isWin) {
        winSound.currentTime = 0;
        winSound.play().catch(e => console.log(e));
      } else {
        loseSound.currentTime = 0;
        loseSound.play().catch(e => console.log(e));
      }
    }

    function toggleTurbo() {
      isTurboOn = !isTurboOn;

      const icon = document.getElementById('turboIcon');
      const txt = document.getElementById('turboText');

      if (isTurboOn) {
        icon.className = "fa-solid fa-bolt text-[#24ee89]";
        txt.innerText = "ON";
        txt.className = "text-[10px] font-bold text-[#24ee89]";
      } else {
        icon.className = "fa-solid fa-bolt text-gray-400";
        txt.innerText = "OFF";
        txt.className = "text-[10px] font-bold text-gray-400";
      }
    }

    function toggleSoundEffect() {
      isSoundOn = !isSoundOn;

      const btn = document.getElementById('soundSettingBtn');
      const txt = document.getElementById('soundStatusText');

      if (isSoundOn) {
        btn.className = "flex items-center justify-between py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-sm text-[#24ee89]";
        txt.innerText = "ON";
        horrorBgMusic.play().catch(e => console.log(e));
      } else {
        btn.className = "flex items-center justify-between py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-sm text-gray-400";
        txt.innerText = "OFF";
        horrorBgMusic.pause();
      }
    }

    async function shareGame() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Mines Game',
            text: 'Play this amazing Mines game!',
            url: window.location.href
          });
        } catch (err) {
          console.log('Share error:', err);
        }
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('লিংক কপি করা হয়েছে!');
      }
    }

    function toggleSettingsModal() {
      document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function toggleLiveStatsModal() {
      document.getElementById('liveStatsModal').classList.toggle('hidden');
    }

    function updateGraph() {
      const container = document.getElementById('statsGraphContainer');
      container.innerHTML = '';

      if (profitHistory.length <= 1) {
        container.innerHTML = '<div class="w-full text-center text-xs text-gray-500 self-center">No bets yet</div>';
        return;
      }

      const maxVal = Math.max(...profitHistory.map(Math.abs), 1);

      profitHistory.forEach((val, idx) => {
        if (idx === 0) return;

        const bar = document.createElement('div');
        const isProfit = val >= 0;
        const heightPercent = Math.min(Math.max((Math.abs(val) / maxVal) * 45, 10), 100);

        bar.className = `w-3 rounded-sm transition-all ${isProfit ? 'bg-[#24ee89]' : 'bg-[#ed4245]'}`;
        bar.style.height = heightPercent + '%';
        bar.title = `Profit: ৳${val.toFixed(2)}`;
        container.appendChild(bar);
      });

      container.scrollLeft = container.scrollWidth;
    }

    async function loadTopBar() {
      try {
        const res = await fetch('../bar/top.html');

        if (res.ok) {
          document.getElementById('topBarContainer').innerHTML = await res.text();

          document.querySelectorAll('a[href*="deposit"]').forEach(a => {
            a.href = '../account/deposit.html';
          });

          document.querySelectorAll('a[href*="member"]').forEach(a => {
            if (a.href.includes('admin/mem/member.html')) {
              a.href = a.href.replace('admin/mem/member.html', 'mem/member.html');
            }
          });
        }
      } catch (e) {
        console.error('Top bar load error:', e);
      }
    }

    /* Load Bottom Navigation from ../bar/bottom.html */
    async function loadBottomBar() {
      try {
        const response = await fetch('../bar/bottom.html');

        if (!response.ok) {
          throw new Error('bottom.html could not be loaded');
        }

        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        /* Load bottom.html styles */
        doc.querySelectorAll('style').forEach(oldStyle => {
          const newStyle = document.createElement('style');
          newStyle.textContent = oldStyle.textContent;
          document.head.appendChild(newStyle);
        });

        /* Load any required stylesheet links */
        doc.querySelectorAll('link[rel="stylesheet"]').forEach(oldLink => {
          const href = oldLink.getAttribute('href');

          if (
            href &&
            href.includes('font-awesome') &&
            !document.querySelector('link[href*="font-awesome"]')
          ) {
            const newLink = document.createElement('link');
            newLink.rel = 'stylesheet';
            newLink.href = new URL(href, response.url || window.location.href).href;
            document.head.appendChild(newLink);
          }
        });

        const navigation = doc.querySelector('.bottom-navigation');

        if (!navigation) {
          throw new Error('bottom-navigation not found in bottom.html');
        }

        /* Avoid duplicate navigation */
        const oldNavigation = document.querySelector('.bottom-navigation');
        if (oldNavigation) oldNavigation.remove();

        document.body.appendChild(navigation.cloneNode(true));

      } catch (error) {
        console.error('Bottom navigation load error:', error);
      }
    }

    function hideLoader() {
      const loader = document.getElementById('minesLoader');
      loader.classList.add('hide');
      setTimeout(() => {
        loader.style.display = 'none';
      }, 400);
    }

    async function init() {
      await Promise.all([
        loadTopBar(),
        loadBottomBar()
      ]);

      try {
        let user = null;

        if (typeof requireAuth === 'function') {
          user = await requireAuth();
        } else if (typeof getCurrentUser === 'function') {
          user = await getCurrentUser();
        }

        if (user) {
          currentUserId = user.id;

          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('balance')
            .eq('id', user.id)
            .single();

          if (profile) {
            userBalance = parseFloat(profile.balance) || 0;

            const topBal = document.getElementById('topBarBalance');
            if (topBal) {
              topBal.innerText = userBalance.toFixed(2);
            }
          }
        }
      } catch (err) {
        console.error('Init Error:', err);
      }

      document.addEventListener('click', () => {
        if (isSoundOn && horrorBgMusic.paused) {
          horrorBgMusic.play().catch(e => console.log(e));
        }
      }, { once: true });

      renderGrid();
      calculateNextMultiplier();
      hideLoader();
    }

    function renderGrid() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';

      for (let i = 0; i < 25; i++) {
        const btn = document.createElement('button');
        btn.dataset.index = i;
        btn.className = 'tile';

        if (activeTab === 'auto' && gameState === 'idle' && selectedTiles.includes(i)) {
          btn.classList.add('tile-selected');
        }

        btn.onclick = () => handleTileClick(i);

        if (activeTab === 'manual') {
          btn.disabled = gameState !== 'playing';
        } else {
          btn.disabled = isAutoRunning || gameState === 'playing';
        }

        grid.appendChild(btn);
      }
    }

    function handleTileClick(index) {
      if (activeTab === 'auto' && gameState === 'idle' && !isAutoRunning) {
        const idx = selectedTiles.indexOf(index);

        if (idx > -1) selectedTiles.splice(idx, 1);
        else selectedTiles.push(index);

        renderGrid();
        calculateNextMultiplier();
        return;
      }

      if (activeTab === 'manual' && gameState === 'playing') {
        revealTile(index);
      }
    }

    function updateMinesCount(val) {
      if (gameState === 'playing' || isAutoRunning) return;

      minesCount = parseInt(val);
      document.getElementById('minesCountDisplay').innerText = minesCount;
      calculateNextMultiplier();
    }

    function adjustBet(factor) {
      if (gameState === 'playing' || isAutoRunning) return;

      const inp = document.getElementById('betAmount');
      let val = (parseFloat(inp.value) || 0) * factor;

      if (val < 0) val = 0;
      inp.value = Math.floor(val);
    }

    function setMaxBet() {
      if (gameState === 'playing' || isAutoRunning) return;

      document.getElementById('betAmount').value = Math.floor(userBalance);
    }

    function setAutoBets(n) {
      document.getElementById('autoBetCount').value = n;
    }

    function calculateNextMultiplier() {
      const safeTiles = 25 - minesCount;
      const count = (activeTab === 'auto' && gameState === 'idle')
        ? selectedTiles.length
        : openedTiles.length;

      let mult = 1.0;

      for (let i = 0; i < count; i++) {
        mult *= (25 - i) / (safeTiles - i);
      }

      if (count < safeTiles) {
        mult *= (25 - count) / (safeTiles - count);
      }

      currentMultiplier = parseFloat((mult * 0.97).toFixed(2));

      if (isNaN(currentMultiplier) || currentMultiplier < 1) {
        currentMultiplier = 1.0;
      }

      document.getElementById('nextMultiplier').innerText =
        `${currentMultiplier.toFixed(2)}x`;

      const profit = (currentBet * currentMultiplier) - currentBet;

      document.getElementById('profitAmount').innerText =
        `৳ ${Math.max(0, profit).toFixed(2)}`;
    }

    function switchTab(tab) {
      if (gameState === 'playing' || isAutoRunning) return;

      activeTab = tab;

      const tabManual = document.getElementById('tabManual');
      const tabAuto = document.getElementById('tabAuto');
      const autoBetsSection = document.getElementById('autoBetsSection');
      const advancedOptions = document.getElementById('advancedOptions');
      const btn = document.getElementById('actionBtn');

      if (tab === 'manual') {
        tabManual.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabAuto.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';

        autoBetsSection.classList.add('hidden');
        advancedOptions.classList.add('hidden');

        btn.innerText = 'Bet';
        btn.className = 'w-full green-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg';

        selectedTiles = [];
      } else {
        tabAuto.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabManual.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';

        autoBetsSection.classList.remove('hidden');
        advancedOptions.classList.remove('hidden');

        btn.innerText = 'Start Auto';
        btn.className = 'w-full green-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg';
      }

      renderGrid();
      calculateNextMultiplier();
    }

    function setAutoStrategy(type, strategy) {
      if (type === 'win') {
        autoWinStrategy = strategy;

        document.getElementById('winResetBtn').className =
          strategy === 'reset'
            ? 'flex-1 py-1 bg-[#222b3a] text-white font-bold rounded text-xs shadow'
            : 'flex-1 py-1 text-gray-400 font-bold rounded text-xs hover:text-white';

        document.getElementById('winIncBtn').className =
          strategy === 'increase'
            ? 'flex-1 py-1 bg-[#222b3a] text-white font-bold rounded text-xs shadow'
            : 'flex-1 py-1 text-gray-400 font-bold rounded text-xs hover:text-white';
      } else {
        autoLossStrategy = strategy;

        document.getElementById('lossResetBtn').className =
          strategy === 'reset'
            ? 'flex-1 py-1 bg-[#222b3a] text-white font-bold rounded text-xs shadow'
            : 'flex-1 py-1 text-gray-400 font-bold rounded text-xs hover:text-white';

        document.getElementById('lossIncBtn').className =
          strategy === 'increase'
            ? 'flex-1 py-1 bg-[#222b3a] text-white font-bold rounded text-xs shadow'
            : 'flex-1 py-1 text-gray-400 font-bold rounded text-xs hover:text-white';
      }
    }

    function showCashoutPopup(mult, amount) {
      document.getElementById('popupMultiplier').innerText =
        mult.toFixed(2) + 'x';

      document.getElementById('popupAmount').innerText =
        '৳ ' + amount.toFixed(2);

      const popup = document.getElementById('cashoutPopup');
      popup.classList.add('show');

      setTimeout(() => popup.classList.remove('show'), 1800);
    }

    async function handleAction() {
      if (activeTab === 'auto') {
        if (isAutoRunning) stopAuto();
        else startAuto();
        return;
      }

      if (gameState === 'idle' || gameState === 'ended') {
        await startGame();
      } else if (gameState === 'playing') {
        await cashout();
      }
    }

    async function startGame() {
      currentBet = parseFloat(document.getElementById('betAmount').value) || 0;

      if (currentBet > 0 && currentBet < 10) {
        alert('সর্বনিম্ন বেট ১০ ৳');
        return false;
      }

      if (currentBet > userBalance) {
        alert('আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
        return false;
      }

      if (currentBet > 0) {
        userBalance -= currentBet;
        updateUIBalance(userBalance);

        await supabaseClient
          .from('profiles')
          .update({ balance: userBalance })
          .eq('id', currentUserId);
      }

      minesPositions = [];

      while (minesPositions.length < minesCount) {
        const r = Math.floor(Math.random() * 25);

        if (!minesPositions.includes(r)) {
          minesPositions.push(r);
        }
      }

      openedTiles = [];
      gameState = 'playing';

      renderGrid();

      document.getElementById('minesRange').disabled = true;
      document.getElementById('betAmount').disabled = true;

      const btn = document.getElementById('actionBtn');

      if (activeTab === 'manual') {
        btn.className = 'w-full red-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg';
        btn.innerText = `Cashout (৳ ${currentBet.toFixed(2)})`;
      }

      calculateNextMultiplier();
      return true;
    }

    async function revealTile(index) {
      if (gameState !== 'playing' || openedTiles.includes(index)) return;

      openedTiles.push(index);

      const tiles = document.getElementById('minesGrid').children;
      const tileBtn = tiles[index];

      if (minesPositions.includes(index)) {
        tileBtn.classList.add('tile-bomb');
        tileBtn.innerHTML = '<i class="fa-solid fa-bomb text-yellow-300"></i>';

        playSound(false);
        await gameOver(false);
      } else {
        tileBtn.classList.add('tile-gem');
        tileBtn.innerHTML = '<i class="fa-solid fa-gem text-[#0f141c]"></i>';

        playSound(true);
        calculateNextMultiplier();

        const currentPayout = currentBet * currentMultiplier;

        if (activeTab === 'manual') {
          document.getElementById('actionBtn').innerText =
            `Cashout (৳ ${currentPayout.toFixed(2)})`;
        }

        if (openedTiles.length === (25 - minesCount)) {
          await cashout();
        }
      }
    }

    async function cashout() {
      if (gameState !== 'playing' || openedTiles.length === 0) return;

      const payout = currentBet * currentMultiplier;
      const profit = payout - currentBet;

      sessionProfit += profit;
      totalWagered += currentBet;
      totalWins++;
      totalProfit += profit;
      profitHistory.push(totalProfit);

      document.getElementById('statsProfit').innerText =
        '৳ ' + totalProfit.toFixed(2);

      document.getElementById('statsWagered').innerText =
        '৳ ' + totalWagered.toFixed(2);

      document.getElementById('statsWin').innerText = totalWins;
      document.getElementById('statsLose').innerText = totalLosses;

      updateGraph();

      if (currentBet > 0) {
        userBalance += payout;
        updateUIBalance(userBalance);

        await supabaseClient
          .from('profiles')
          .update({ balance: userBalance })
          .eq('id', currentUserId);

        await supabaseClient.from('bets').insert([{
          user_id: currentUserId,
          target_number: minesCount,
          roll_result: openedTiles.length,
          bet_amount: currentBet,
          payout: currentMultiplier,
          is_bool: true
        }]);
      }

      showCashoutPopup(currentMultiplier, payout);
      await gameOver(true);
    }

    async function gameOver(isWin) {
      gameState = 'ended';

      const tiles = document.getElementById('minesGrid').children;

      for (let i = 0; i < 25; i++) {
        tiles[i].disabled = true;

        if (minesPositions.includes(i) && !openedTiles.includes(i)) {
          tiles[i].classList.add('tile-bomb');
          tiles[i].innerHTML = '<i class="fa-solid fa-bomb text-yellow-300"></i>';
        }
      }

      if (!isWin && currentBet > 0) {
        sessionProfit -= currentBet;
        totalWagered += currentBet;
        totalLosses++;
        totalProfit -= currentBet;
        profitHistory.push(totalProfit);

        document.getElementById('statsProfit').innerText =
          '৳ ' + totalProfit.toFixed(2);

        document.getElementById('statsWagered').innerText =
          '৳ ' + totalWagered.toFixed(2);

        document.getElementById('statsWin').innerText = totalWins;
        document.getElementById('statsLose').innerText = totalLosses;

        updateGraph();

        await supabaseClient.from('bets').insert([{
          user_id: currentUserId,
          target_number: minesCount,
          roll_result: openedTiles.length,
          bet_amount: currentBet,
          payout: 0,
          is_bool: false
        }]);
      }

      document.getElementById('minesRange').disabled = false;
      document.getElementById('betAmount').disabled = false;

      if (isAutoRunning) {
        applyAutoStrategy(isWin);

        const shouldContinue = checkAutoStopConditions(isWin);

        if (shouldContinue && isAutoRunning) {
          setTimeout(() => {
            if (isAutoRunning) runAutoRound();
          }, 1000);

          return;
        }
      }

      const btn = document.getElementById('actionBtn');

      if (activeTab === 'manual') {
        setTimeout(() => {
          btn.className = 'w-full green-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg';
          btn.innerText = 'Bet';
          gameState = 'idle';
          renderGrid();
        }, 1600);
      } else {
        btn.innerText = 'Start Auto';
        btn.className = 'w-full green-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg';

        gameState = 'idle';
        isAutoRunning = false;
        renderGrid();
      }
    }

    function applyAutoStrategy(isWin) {
      if (isWin) {
        if (autoWinStrategy === 'increase') {
          const inc = parseFloat(document.getElementById('winIncPercent').value) || 0;

          let newBet =
            (parseFloat(document.getElementById('betAmount').value) || 0) *
            (1 + inc / 100);

          document.getElementById('betAmount').value =
            Math.max(0, Math.floor(newBet));
        } else {
          document.getElementById('betAmount').value = baseBetAmount;
        }
      } else {
        if (autoLossStrategy === 'increase') {
          const inc = parseFloat(document.getElementById('lossIncPercent').value) || 0;

          let newBet =
            (parseFloat(document.getElementById('betAmount').value) || 0) *
            (1 + inc / 100);

          document.getElementById('betAmount').value =
            Math.max(0, Math.floor(newBet));
        } else {
          document.getElementById('betAmount').value = baseBetAmount;
        }
      }
    }

    function checkAutoStopConditions(isWin) {
      const stopProfit =
        parseFloat(document.getElementById('autoStopProfit').value) || 0;

      const stopLoss =
        parseFloat(document.getElementById('autoStopLoss').value) || 0;

      if (stopProfit > 0 && sessionProfit >= stopProfit) {
        stopAuto();
        return false;
      }

      if (stopLoss > 0 && sessionProfit <= -Math.abs(stopLoss)) {
        stopAuto();
        return false;
      }

      if (autoRemainingBets > 0) {
        autoRemainingBets--;

        document.getElementById('autoBetCount').value = autoRemainingBets;

        if (autoRemainingBets <= 0) {
          stopAuto();
          return false;
        }
      }

      return true;
    }

    async function startAuto() {
      if (selectedTiles.length === 0) {
        alert('অটো বেট শুরু করতে অন্তত একটি টাইল সিলেক্ট করুন!');
        return;
      }

      baseBetAmount =
        parseFloat(document.getElementById('betAmount').value) || 0;

      autoRemainingBets =
        parseInt(document.getElementById('autoBetCount').value) || 0;

      sessionProfit = 0;
      isAutoRunning = true;

      const btn = document.getElementById('actionBtn');

      btn.innerText = 'Stop Auto';
      btn.className = 'w-full red-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg';

      document.getElementById('minesRange').disabled = true;
      document.getElementById('betAmount').disabled = true;

      runAutoRound();
    }

    function stopAuto() {
      isAutoRunning = false;

      const btn = document.getElementById('actionBtn');

      btn.innerText = 'Start Auto';
      btn.className = 'w-full green-btn font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg';

      document.getElementById('minesRange').disabled = false;
      document.getElementById('betAmount').disabled = false;

      gameState = 'idle';
      renderGrid();
    }

    async function runAutoRound() {
      if (!isAutoRunning) return;

      const started = await startGame();

      if (!started) {
        stopAuto();
        return;
      }

      for (let i = 0; i < selectedTiles.length; i++) {
        if (!isAutoRunning || gameState !== 'playing') break;

        await new Promise(r => setTimeout(r, 280));
        await revealTile(selectedTiles[i]);

        if (gameState !== 'playing') break;
      }

      if (gameState === 'playing' && openedTiles.length > 0) {
        await cashout();
      }
    }

    function updateUIBalance(bal) {
      const topBal = document.getElementById('topBarBalance');

      if (topBal) {
        topBal.innerText = bal.toFixed(2);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
