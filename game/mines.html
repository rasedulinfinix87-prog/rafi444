<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines Original - Game Portal</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    /* Neon Glow & Vibrant Purple Color Theme matching 2nd image */
    body {
      background: linear-gradient(135deg, #0b071e 0%, #1a0b36 50%, #2a0845 100%);
    }

    .mines-card-bg {
      background: linear-gradient(145deg, rgba(30, 16, 60, 0.9), rgba(15, 7, 35, 0.9));
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.3);
    }

    /* Grid Tile Styles */
    .tile {
      background: linear-gradient(145deg, #2a164d, #190c33);
      border: 1px solid rgba(192, 132, 252, 0.2);
      transition: all 0.2s ease-in-out;
    }

    .tile:hover:not(:disabled) {
      background: linear-gradient(145deg, #3b1e6e, #25124a);
      border-color: #c084fc;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
    }

    /* Diamond Tile revealed */
    .tile-gem {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #9333ea 100%) !important;
      border-color: #22d3ee !important;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.8) !important;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Bomb Tile revealed */
    .tile-bomb {
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%) !important;
      border-color: #f87171 !important;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.9) !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col font-sans antialiased selection:bg-purple-500 selection:text-white">

  <!-- Top Bar Anchor -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <!-- Header -->
  <header class="bg-[#120826]/80 backdrop-blur-md border-b border-purple-900/50 px-4 py-3 flex justify-between items-center">
    <a href="../index.html" class="text-xs text-purple-300 hover:text-white transition flex items-center gap-1 font-semibold">
      <i class="fa-solid fa-chevron-left"></i> Games
    </a>
    <div class="flex items-center gap-2">
      <span class="text-xs font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500 uppercase">
        💎 MINES ORIGINAL
      </span>
    </div>
    <div class="w-12"></div>
  </header>

  <!-- Main Game Container -->
  <main class="max-w-md w-full mx-auto p-3 sm:p-4 space-y-4 flex-1 pb-10">

    <!-- Multiplier Display Banner -->
    <div class="mines-card-bg rounded-2xl p-3 flex justify-between items-center text-xs">
      <div class="flex items-center gap-2">
        <span class="text-gray-400 font-medium">Next Multiplier:</span>
        <span id="nextMultiplier" class="font-extrabold text-cyan-400 text-sm">1.03x</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-gray-400 font-medium">Profit:</span>
        <span id="profitAmount" class="font-extrabold text-emerald-400 text-sm">৳ 0.00</span>
      </div>
    </div>

    <!-- 5x5 Mines Grid Board -->
    <div class="mines-card-bg rounded-3xl p-3.5 sm:p-4 shadow-2xl relative">
      <div id="minesGrid" class="grid grid-cols-5 gap-2 sm:gap-2.5 aspect-square w-full">
        <!-- 25 Tiles generated dynamically -->
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="mines-card-bg rounded-2xl p-4 space-y-3.5">

      <!-- Action Button (Bet / Cashout) -->
      <button id="actionBtn" onclick="handleAction()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg shadow-emerald-500/20">
        Bet
      </button>

      <!-- Bet Amount Selection -->
      <div class="space-y-1">
        <div class="flex justify-between text-xs text-purple-200 font-semibold">
          <span>Bet Amount</span>
          <span class="text-xs text-gray-400">Min: 10 ৳</span>
        </div>
        <div class="flex items-center bg-[#13092b] border border-purple-800/60 rounded-xl p-1">
          <input type="number" id="betAmount" value="10" min="10" class="w-full bg-transparent px-3 text-xs font-bold text-white focus:outline-none">
          <button onclick="adjustBet(0.5)" class="bg-purple-900/60 hover:bg-purple-800 text-purple-300 px-2.5 py-1 rounded-lg text-[10px] font-bold mr-1">1/2</button>
          <button onclick="adjustBet(2)" class="bg-purple-900/60 hover:bg-purple-800 text-purple-300 px-2.5 py-1 rounded-lg text-[10px] font-bold mr-1">2x</button>
          <button onclick="setMaxBet()" class="bg-purple-900/60 hover:bg-purple-800 text-purple-300 px-2.5 py-1 rounded-lg text-[10px] font-bold">MAX</button>
        </div>
      </div>

      <!-- Mines Slider Count Selection -->
      <div class="space-y-1">
        <div class="flex justify-between text-xs text-purple-200 font-semibold">
          <span>Mines Count</span>
          <span id="minesCountDisplay" class="font-bold text-fuchsia-400">3 Mines</span>
        </div>
        <div class="flex items-center gap-3">
          <input type="range" id="minesRange" min="1" max="24" value="3" oninput="updateMinesCount(this.value)" class="w-full accent-fuchsia-500 cursor-pointer h-2 bg-purple-950 rounded-lg">
        </div>
      </div>

    </div>

  </main>

  <script>
    let currentUserId = null;
    let userBalance = 0;
    let gameState = 'idle'; // 'idle', 'playing', 'ended'
    let minesPositions = [];
    let openedTiles = [];
    let minesCount = 3;
    let currentBet = 10;
    let currentMultiplier = 1.0;

    // Load Top Bar Component
    async function loadTopBar() {
      try {
        const res = await fetch('../bar/top.html');
        if (res.ok) {
          document.getElementById('topBarContainer').innerHTML = await res.text();
        }
      } catch (e) { console.error(e); }
    }

    // Init Auth & Balance
    async function init() {
      await loadTopBar();
      try {
        let user = null;
        if (typeof requireAuth === 'function') user = await requireAuth();
        else if (typeof getCurrentUser === 'function') user = await getCurrentUser();

        if (user) {
          currentUserId = user.id;
          const { data: profile } = await supabaseClient.from('profiles').select('balance').eq('id', user.id).single();
          if (profile) {
            userBalance = parseFloat(profile.balance) || 0;
            const topBal = document.getElementById('topBarBalance');
            if (topBal) topBal.innerText = userBalance.toFixed(2);
          }
        }
      } catch (err) { console.error("Init Error:", err); }

      renderGrid();
    }

    // Render 5x5 Grid Tiles
    function renderGrid() {
      const grid = document.getElementById('minesGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        const btn = document.createElement('button');
        btn.dataset.index = i;
        btn.className = "tile rounded-2xl flex items-center justify-center text-xl sm:text-2xl font-black transition disabled:cursor-not-allowed";
        btn.onclick = () => revealTile(i);
        btn.disabled = gameState !== 'playing';
        grid.appendChild(btn);
      }
    }

    function updateMinesCount(val) {
      if (gameState === 'playing') return;
      minesCount = parseInt(val);
      document.getElementById('minesCountDisplay').innerText = `${minesCount} Mines`;
      calculateNextMultiplier();
    }

    function adjustBet(factor) {
      if (gameState === 'playing') return;
      const inp = document.getElementById('betAmount');
      let val = parseFloat(inp.value) * factor;
      if (val < 10) val = 10;
      inp.value = val.toFixed(0);
    }

    function setMaxBet() {
      if (gameState === 'playing') return;
      document.getElementById('betAmount').value = Math.floor(userBalance);
    }

    function calculateNextMultiplier() {
      const safeTiles = 25 - minesCount;
      const openedCount = openedTiles.length;
      
      let mult = 1.0;
      for (let i = 0; i <= openedCount; i++) {
        mult *= (25 - i) / (safeTiles - i);
      }
      currentMultiplier = parseFloat((mult * 0.97).toFixed(2)); // 3% House Edge
      document.getElementById('nextMultiplier').innerText = `${currentMultiplier.toFixed(2)}x`;
      
      const profit = (currentBet * currentMultiplier) - currentBet;
      document.getElementById('profitAmount').innerText = `৳ ${Math.max(0, profit).toFixed(2)}`;
    }

    async function handleAction() {
      if (gameState === 'idle' || gameState === 'ended') {
        await startGame();
      } else if (gameState === 'playing') {
        await cashout();
      }
    }

    async function startGame() {
      currentBet = parseFloat(document.getElementById('betAmount').value);
      if (isNaN(currentBet) || currentBet < 10) {
        alert("সর্বনিম্ন বেট ১০ ৳");
        return;
      }

      if (currentBet > userBalance) {
        alert("আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!");
        return;
      }

      // Deduct Bet Amount
      userBalance -= currentBet;
      updateUIBalance(userBalance);
      await supabaseClient.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);

      // Generate Random Mines Positions
      minesPositions = [];
      while (minesPositions.length < minesCount) {
        const r = Math.floor(Math.random() * 25);
        if (!minesPositions.includes(r)) minesPositions.push(r);
      }

      openedTiles = [];
      gameState = 'playing';

      // UI Updates
      renderGrid();
      document.getElementById('minesRange').disabled = true;
      document.getElementById('betAmount').disabled = true;
      
      const btn = document.getElementById('actionBtn');
      btn.className = "w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg shadow-amber-500/20";
      btn.innerText = `Cashout (৳ ${currentBet.toFixed(2)})`;

      calculateNextMultiplier();
    }

    async function revealTile(index) {
      if (gameState !== 'playing' || openedTiles.includes(index)) return;

      openedTiles.push(index);
      const tiles = document.getElementById('minesGrid').children;
      const tileBtn = tiles[index];

      if (minesPositions.includes(index)) {
        // BUSTED - Hit a Bomb!
        tileBtn.classList.add('tile-bomb');
        tileBtn.innerHTML = '<i class="fa-solid fa-bomb text-yellow-300 animate-bounce"></i>';
        
        await gameOver(false);
      } else {
        // SAFE - Found Diamond!
        tileBtn.classList.add('tile-gem');
        tileBtn.innerHTML = '<i class="fa-solid fa-[#22d3ee] fa-gem text-cyan-200"></i>';
        
        calculateNextMultiplier();

        const currentPayout = currentBet * currentMultiplier;
        const btn = document.getElementById('actionBtn');
        btn.innerText = `Cashout (৳ ${currentPayout.toFixed(2)})`;

        // Check if all safe tiles are opened
        if (openedTiles.length === (25 - minesCount)) {
          await cashout();
        }
      }
    }

    async function cashout() {
      if (gameState !== 'playing' || openedTiles.length === 0) return;

      const payout = currentBet * currentMultiplier;
      userBalance += payout;
      updateUIBalance(userBalance);

      // Credit winnings
      await supabaseClient.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);
      
      // Save record in bets table
      await supabaseClient.from('bets').insert([{
        user_id: currentUserId,
        target_number: minesCount,
        roll_result: openedTiles.length,
        bet_amount: currentBet,
        payout: currentMultiplier,
        is_bool: true
      }]);

      alert(`🎉 অভিনন্দন! আপনি ৳ ${payout.toFixed(2)} জিতেছেন!`);
      await gameOver(true);
    }

    async function gameOver(isWin) {
      gameState = 'ended';
      
      // Reveal all remaining mines
      const tiles = document.getElementById('minesGrid').children;
      for (let i = 0; i < 25; i++) {
        tiles[i].disabled = true;
        if (minesPositions.includes(i)) {
          tiles[i].classList.add('tile-bomb');
          tiles[i].innerHTML = '<i class="fa-solid fa-bomb text-yellow-300"></i>';
        }
      }

      if (!isWin) {
        // Save loss record in bets table
        await supabaseClient.from('bets').insert([{
          user_id: currentUserId,
          target_number: minesCount,
          roll_result: openedTiles.length,
          bet_amount: currentBet,
          payout: 0,
          is_bool: false
        }]);
      }

      // Reset Control Buttons
      document.getElementById('minesRange').disabled = false;
      document.getElementById('betAmount').disabled = false;

      const btn = document.getElementById('actionBtn');
      btn.className = "w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-black py-3.5 rounded-xl text-sm uppercase tracking-wider transition transform active:scale-95 shadow-lg shadow-emerald-500/20";
      btn.innerText = "Bet";
    }

    function updateUIBalance(bal) {
      const topBal = document.getElementById('topBarBalance');
      if (topBal) topBal.innerText = bal.toFixed(2);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
