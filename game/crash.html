<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BC Game Style Crash</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    body {
      background: #0f141c;
      color: #ffffff;
      font-family: sans-serif;
      overflow-y: auto;
    }

    .bc-main-wrapper {
      background: #171d28;
      border: 1px solid #222b3a;
      border-radius: 14px;
      overflow: hidden;
    }

    .bc-divider {
      height: 1px;
      background-color: #222b3a;
      width: 100%;
    }

    .bc-input-box {
      background: #0f141c;
      border: 1px solid #222b3a;
      border-radius: 10px;
    }
    .bc-input-box:focus-within {
      border-color: #24ee89;
    }

    .green-btn {
      background: #24ee89;
      color: #0f141c;
      font-weight: 800;
    }
    .green-btn:hover {
      background: #1ed67a;
    }

    .red-btn {
      background: #ed4245;
      color: #ffffff;
      font-weight: 800;
    }
    .red-btn:hover {
      background: #d3383b;
    }

    /* Smooth Color Shift Animation for Timer */
    @keyframes colorShift {
      0% { color: #ed4245; }   /* Red */
      33% { color: #3b82f6; }  /* Blue */
      66% { color: #ec4899; }  /* Pink */
      100% { color: #24ee89; } /* Green */
    }

    .timer-colored {
      animation: colorShift 10s linear infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0f141c;
    }
    ::-webkit-scrollbar-thumb {
      background: #222b3a;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-[#0f141c] text-white font-sans min-h-screen flex flex-col items-center justify-between p-0 select-none">

  <!-- Top Bar Container -->
  <div id="topBarContainer" class="w-full max-w-2xl sticky top-0 z-50"></div>

  <div class="w-full max-w-2xl flex flex-col justify-between overflow-x-hidden my-2 pb-24 px-2 sm:px-4">
    
    <main class="flex flex-col gap-3 flex-1">
      
      <!-- Unified Main Game Wrapper Card -->
      <div class="bc-main-wrapper flex flex-col shadow-xl">
        
        <!-- Crash Game Screen Area (Top Section inside wrapper) -->
        <div class="relative flex flex-col items-center justify-center h-64 w-full overflow-hidden bg-[#171d28] pt-10">
          
          <!-- Previous Multiplier History Bar (Properly spaced below top border, so plane won't overlap) -->
          <div id="historyBar" class="absolute top-2.5 left-3 right-3 flex items-center gap-1.5 overflow-x-auto z-30 pb-1 no-scrollbar">
            <!-- Dynamically populated history badges -->
          </div>

          <!-- Status / Multiplier Display -->
          <div id="gameStatusDisplay" class="flex flex-col items-center justify-center z-20 mt-4">
            <span id="multiplierText" class="text-4xl sm:text-5xl font-black tracking-wider text-white hidden">1.00x</span>
            <span id="subStatusText" class="text-sm sm:text-base font-bold timer-colored mt-1">Starts in 10.0s</span>
          </div>

          <!-- Canvas for Vector Airplane, Sharp Trail and Star Sparkles -->
          <canvas id="crashCanvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none" style="top: 25px; height: calc(100% - 25px);"></canvas>
        </div>

        <!-- Thin Divider Line between screen and controls -->
        <div class="bc-divider"></div>

        <!-- Game Controls Section (Bottom Section inside wrapper) -->
        <div class="p-4 flex flex-col gap-3.5 bg-[#171d28]">
          
          <!-- Manual / Auto Tabs Switcher -->
          <div class="bg-[#0f141c] p-1 rounded-xl flex justify-around text-sm font-medium text-gray-400 border border-[#222b3a]">
            <button onclick="switchTab('manual')" id="tabManual" class="py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition">Manual</button>
            <button onclick="switchTab('auto')" id="tabAuto" class="py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition">Auto</button>
          </div>

          <!-- Bet Amount Controls -->
          <div class="flex flex-col gap-1">
            <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
              <span>Amount (৳)</span>
              <span class="text-gray-400 text-[10px]">Min: 1 ৳</span>
            </div>
            <div class="flex items-center bc-input-box p-1">
              <div class="flex items-center px-2 text-gray-400 font-bold text-sm">৳</div>
              <input type="number" id="betAmount" value="10" min="0" step="1" class="w-full bg-transparent text-sm font-bold text-white focus:outline-none px-1">
              
              <div class="flex items-center gap-1">
                <button onclick="modifyBet('half')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">1/2</button>
                <button onclick="modifyBet('double')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">2x</button>
                <button onclick="modifyBet('max')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">Max</button>
              </div>
            </div>
          </div>

          <!-- Auto Cash Out Controls -->
          <div class="flex flex-col gap-1">
            <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
              <span>Auto Cash Out</span>
              <span class="text-gray-400 text-[10px]">Optional</span>
            </div>
            <div class="flex items-center bc-input-box p-1">
              <input type="number" id="autoCashOut" value="2.00" min="1.01" step="0.1" class="w-full bg-transparent text-sm font-bold text-white focus:outline-none px-3">
              <span class="px-3 text-gray-400 font-bold text-xs">×</span>
            </div>
          </div>

          <!-- Action Button -->
          <button id="btnAction" onclick="handleMainAction()" class="w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2">
            <span>Bet (Next Round)</span>
          </button>

          <!-- Demo Mode Info -->
          <div class="text-center text-[11px] text-gray-400">
            ℹ Betting with 0 will enter demo mode.
          </div>

        </div>

      </div>

    </main>
  </div>

  <!-- Bottom Bar Container -->
  <div id="bottomBarContainer" class="w-full max-w-2xl fixed bottom-0 z-50"></div>

  <script>
    let currentUserId = null;
    let balance = 0.00;
    let gameState = 'waiting'; // waiting, running, crashed
    let countdownTime = 10.0;
    let currentMultiplier = 1.00;
    let crashPoint = 1.00;
    let gameInterval = null;
    let isPlayingNext = false;
    let hasCashedOut = false;
    let activeBetAmount = 0;
    let activeTab = 'manual';
    let autoRoundCount = 0;
    let sparkles = [];
    let previousResults = JSON.parse(localStorage.getItem('bc_crash_history')) || [1.45, 2.10, 1.05, 5.30, 1.12];

    // 10 Distinct Color Tiers based on Multiplier Range
    function getMultiplierStyle(val) {
      if (val <= 1.50)  return { textColor: 'text-red-500', bgClass: 'bg-red-500/10 border-red-500/30' };     // Tier 1: Dark Red
      if (val <= 2.00)  return { textColor: 'text-rose-400', bgClass: 'bg-rose-400/10 border-rose-400/30' };   // Tier 2: Medium Red
      if (val <= 3.00)  return { textColor: 'text-orange-400', bgClass: 'bg-orange-400/10 border-orange-400/30' }; // Tier 3: Orange
      if (val <= 4.00)  return { textColor: 'text-amber-400', bgClass: 'bg-amber-400/10 border-amber-400/30' };   // Tier 4: Amber/Yellow-Gold
      if (val <= 5.00)  return { textColor: 'text-yellow-300', bgClass: 'bg-yellow-300/10 border-yellow-300/30' }; // Tier 5: Yellow
      if (val <= 7.00)  return { textColor: 'text-emerald-400', bgClass: 'bg-emerald-400/10 border-emerald-400/30' }; // Tier 6: Emerald Green
      if (val <= 10.00) return { textColor: 'text-[#24ee89]', bgClass: 'bg-[#24ee89]/10 border-[#24ee89]/30' }; // Tier 7: Bright Green
      if (val <= 20.00) return { textColor: 'text-cyan-400', bgClass: 'bg-cyan-400/10 border-cyan-400/30' };   // Tier 8: Cyan/Light Blue
      if (val <= 50.00) return { textColor: 'text-blue-500', bgClass: 'bg-blue-500/10 border-blue-500/30' };   // Tier 9: Deep Blue
      return            { textColor: 'text-purple-400', bgClass: 'bg-purple-400/10 border-purple-400/30' }; // Tier 10: Purple/Neon
    }

    async function loadBars() {
      try {
        const topRes = await fetch('../bar/top.html');
        if (topRes.ok) {
          document.getElementById('topBarContainer').innerHTML = await topRes.text();
          document.querySelectorAll('a[href*="deposit"]').forEach(a => {
            a.href = '../account/deposit.html';
          });
        }

        const botRes = await fetch('../bar/bottom.html');
        if (botRes.ok) {
          document.getElementById('bottomBarContainer').innerHTML = await botRes.text();
        }
      } catch (e) { console.error('Bar load error:', e); }
    }

    async function initCrashGame() {
      await loadBars();
      renderHistoryBar();
      drawEmptyCanvas();

      if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') {
        const user = await getCurrentUser();
        if (user) {
          currentUserId = user.id;
          const { data: profile } = await supabaseClient.from('profiles').select('balance').eq('id', user.id).single();
          if (profile) {
            balance = parseFloat(profile.balance) || 0;
            updateBalanceUI();
          }

          supabaseClient
            .channel('crash-profile-channel')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${user.id}` }, (payload) => {
              if (payload.new && payload.new.balance !== undefined) {
                balance = parseFloat(payload.new.balance) || 0;
                updateBalanceUI();
              }
            })
            .subscribe();
        }
      }

      let globalRoundStart = localStorage.getItem('bc_round_start_time');
      let now = Date.now();
      if (!globalRoundStart) {
        globalRoundStart = now;
        localStorage.setItem('bc_round_start_time', globalRoundStart);
      }

      let elapsedSec = (now - parseInt(globalRoundStart)) / 1000;
      let cycleTime = elapsedSec % 15;

      if (cycleTime < 10) {
        countdownTime = 10 - cycleTime;
        startWaitingPhase(true);
      } else {
        startRunningPhase(cycleTime - 10);
      }
    }

    function updateBalanceUI() {
      const topBal1 = document.getElementById('topBarBalance');
      const topBal2 = document.getElementById('userBalance');
      
      if (topBal1) topBal1.innerText = balance.toFixed(2);
      if (topBal2) topBal2.innerText = `৳ ${balance.toFixed(2)}`;
    }

    function renderHistoryBar() {
      const historyContainer = document.getElementById('historyBar');
      if (!historyContainer) return;
      historyContainer.innerHTML = '';

      previousResults.slice(-30).reverse().forEach(res => {
        let badge = document.createElement('span');
        let styleInfo = getMultiplierStyle(res);
        badge.className = `px-2 py-0.5 rounded-md text-[11px] font-bold border ${styleInfo.textColor} ${styleInfo.bgClass} whitespace-nowrap`;
        badge.innerText = res.toFixed(2) + 'x';
        historyContainer.appendChild(badge);
      });
      localStorage.setItem('bc_crash_history', JSON.stringify(previousResults));
    }

    function modifyBet(type) {
      let current = parseFloat(document.getElementById('betAmount').value) || 0;
      if (type === 'half') {
        document.getElementById('betAmount').value = Math.max(0, Math.floor(current / 2));
      } else if (type === 'double') {
        document.getElementById('betAmount').value = Math.floor(current * 2);
      } else if (type === 'max') {
        document.getElementById('betAmount').value = Math.floor(balance);
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      const tabManual = document.getElementById('tabManual');
      const tabAuto = document.getElementById('tabAuto');

      if (tab === 'manual') {
        tabManual.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabAuto.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';
      } else {
        tabAuto.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabManual.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';
      }
    }

    function drawEmptyCanvas() {
      const canvas = document.getElementById('crashCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sparkles = [];
    }

    async function startWaitingPhase(isSynced = false) {
      gameState = 'waiting';
      hasCashedOut = false;
      drawEmptyCanvas();
      
      const multText = document.getElementById('multiplierText');
      const subText = document.getElementById('subStatusText');
      const btn = document.getElementById('btnAction');

      multText.classList.add('hidden');
      subText.className = "text-sm sm:text-base font-bold timer-colored mt-1";

      if (!isSynced) {
        localStorage.setItem('bc_round_start_time', Date.now());
        countdownTime = 10.0;
      }

      if (activeTab === 'auto' && autoRoundCount > 0) {
        isPlayingNext = true;
      }

      if (isPlayingNext) {
        btn.className = "w-full py-3.5 red-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
        btn.innerText = "Cancel Bet";
      } else {
        btn.className = "w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
        btn.innerText = "Bet (Next Round)";
      }

      if (gameInterval) clearInterval(gameInterval);

      if (isPlayingNext && !isSynced) {
        await processBetDeduction();
      }

      gameInterval = setInterval(() => {
        countdownTime -= 0.1;
        subText.innerText = `Starts in ${Math.max(0, countdownTime).toFixed(1)}s`;

        if (countdownTime <= 0) {
          clearInterval(gameInterval);
          startRunningPhase(0);
        }
      }, 100);
    }

    async function processBetDeduction() {
      activeBetAmount = parseFloat(document.getElementById('betAmount').value) || 0;
      if (activeBetAmount > 0) {
        if (activeBetAmount > balance) {
          alert("পর্যাপ্ত ব্যালেন্স নেই!");
          isPlayingNext = false;
          startWaitingPhase();
          return;
        }
        balance -= activeBetAmount;
        updateBalanceUI();
        if (currentUserId && typeof supabaseClient !== 'undefined') {
          await supabaseClient.from('profiles').update({ balance: balance }).eq('id', currentUserId);
        }
      }
    }

    async function startRunningPhase(initialElapsed = 0) {
      gameState = 'running';
      currentMultiplier = 1.00;
      sparkles = [];
      
      let r = Math.random();
      crashPoint = parseFloat((Math.max(1.00, 0.99 / (1 - r))).toFixed(2));
      if (Math.random() < 0.04) crashPoint = 1.00;

      const multText = document.getElementById('multiplierText');
      const subText = document.getElementById('subStatusText');
      const btn = document.getElementById('btnAction');

      multText.classList.remove('hidden');
      multText.className = "text-4xl sm:text-5xl font-black tracking-wider text-white";
      subText.className = "text-xs text-gray-400 font-semibold mt-1 hidden"; // Removed Rocket launching text

      if (isPlayingNext) {
        btn.className = "w-full py-3.5 bg-[#24ee89] text-[#0f141c] font-black text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
        btn.innerText = "Cash Out";
      } else {
        btn.className = "w-full py-3.5 bg-[#222b3a] text-gray-400 font-bold text-sm rounded-xl cursor-not-allowed";
        btn.innerText = "Running...";
      }

      const canvas = document.getElementById('crashCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      let startTime = Date.now() - (initialElapsed * 1000);

      gameInterval = setInterval(async () => {
        let elapsedTime = (Date.now() - startTime) / 1000;
        currentMultiplier = parseFloat((Math.exp(0.08 * elapsedTime)).toFixed(2));

        multText.innerText = currentMultiplier.toFixed(2) + 'x';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let progress = Math.min(1, elapsedTime / 10);
        let startX = 25;
        let startY = canvas.height - 25;
        let currentX = startX + (canvas.width - 70) * progress;
        let currentY = startY - (canvas.height - 50) * Math.pow(progress, 1.3);

        // Draw Trail Line (Clamped below history bar)
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(startX + (currentX - startX) * 0.4, startY - 10, currentX, currentY);
        ctx.strokeStyle = '#ed4245';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Sparkles
        sparkles.push({
          x: currentX - 10 - (Math.random() * 12),
          y: currentY + (Math.random() * 8),
          vx: -1.5 - Math.random() * 1.5,
          vy: 1.5 + Math.random() * 2,
          size: Math.random() * 2 + 1,
          alpha: 1.0
        });

        for (let i = sparkles.length - 1; i >= 0; i--) {
          let s = sparkles[i];
          s.x += s.vx;
          s.y += s.vy;
          s.alpha -= 0.04;

          if (s.alpha <= 0) {
            sparkles.splice(i, 1);
            continue;
          }

          ctx.fillStyle = `rgba(255, 230, 120, ${s.alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // Airplane
        ctx.save();
        ctx.translate(currentX, currentY);
        ctx.rotate(-Math.PI / 5);

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#24ee89';
        ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-12, -6);
        ctx.lineTo(-8, 0);
        ctx.lineTo(-12, 6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();

        let autoCash = parseFloat(document.getElementById('autoCashOut').value) || 0;
        if (isPlayingNext && !hasCashedOut && autoCash > 1.00 && currentMultiplier >= autoCash) {
          if (currentMultiplier <= crashPoint) {
            cashOut(autoCash);
          }
        }

        if (currentMultiplier >= crashPoint) {
          clearInterval(gameInterval);
          triggerCrash();
        }
      }, 50);
    }

    async function cashOut(multiplierToUse = null) {
      if (!isPlayingNext || hasCashedOut || gameState !== 'running') return;
      hasCashedOut = true;

      let mult = multiplierToUse || currentMultiplier;
      let winAmount = activeBetAmount > 0 ? (activeBetAmount * mult) : 0;

      if (activeBetAmount > 0) {
        balance += winAmount;
        updateBalanceUI();
      }

      const btn = document.getElementById('btnAction');
      btn.className = "w-full py-3.5 bg-[#222b3a] text-gray-400 font-bold text-sm rounded-xl cursor-not-allowed";
      btn.innerText = activeBetAmount > 0 ? `Cashed Out (৳ ${winAmount.toFixed(2)})` : `Demo Win (${mult.toFixed(2)}x)`;

      if (currentUserId && activeBetAmount > 0 && typeof supabaseClient !== 'undefined') {
        await supabaseClient.from('bets').insert([{
          user_id: currentUserId,
          target_number: 0,
          roll_result: mult,
          bet_amount: activeBetAmount,
          payout: mult,
          is_bool: true
        }]);

        await supabaseClient.from('profiles').update({ balance: balance }).eq('id', currentUserId);
      }
    }

    async function triggerCrash() {
      gameState = 'crashed';
      const multText = document.getElementById('multiplierText');
      const subText = document.getElementById('subStatusText');
      const btn = document.getElementById('btnAction');

      let crashStyle = getMultiplierStyle(crashPoint);
      multText.className = `text-4xl sm:text-5xl font-black tracking-wider ${crashStyle.textColor}`;
      multText.innerText = crashPoint.toFixed(2) + 'x';
      subText.className = "text-xs text-gray-400 font-semibold mt-1";
      subText.innerText = "Crashed!";

      previousResults.push(crashPoint);
      if (previousResults.length > 30) previousResults.shift();
      renderHistoryBar();

      if (isPlayingNext && !hasCashedOut && activeBetAmount > 0) {
        if (currentUserId && typeof supabaseClient !== 'undefined') {
          await supabaseClient.from('bets').insert([{
            user_id: currentUserId,
            target_number: 0,
            roll_result: crashPoint,
            bet_amount: activeBetAmount,
            payout: 0,
            is_bool: false
          }]);
        }
      }

      if (activeTab === 'manual') {
        isPlayingNext = false;
      } else {
        if (autoRoundCount > 1) autoRoundCount--;
        else if (autoRoundCount === 1) {
          autoRoundCount = 0;
          isPlayingNext = false;
        }
      }

      setTimeout(() => {
        startWaitingPhase(false);
      }, 2500);
    }

    async function handleMainAction() {
      if (gameState === 'waiting') {
        if (activeTab === 'auto') {
          autoRoundCount = 10;
        }
        isPlayingNext = !isPlayingNext;
        const btn = document.getElementById('btnAction');
        if (isPlayingNext) {
          btn.className = "w-full py-3.5 red-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
          btn.innerText = "Cancel Bet";
          await processBetDeduction();
        } else {
          if (activeBetAmount > 0) {
            balance += activeBetAmount;
            updateBalanceUI();
            if (currentUserId && typeof supabaseClient !== 'undefined') {
              await supabaseClient.from('profiles').update({ balance: balance }).eq('id', currentUserId);
            }
          }
          btn.className = "w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
          btn.innerText = "Bet (Next Round)";
        }
      } else if (gameState === 'running' && isPlayingNext && !hasCashedOut) {
        cashOut();
      }
    }

    window.onload = initCrashGame;
  </script>
</body>
</html>
