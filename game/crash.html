<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BC Game Style Crash</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    html {
      min-height: 100%;
      background: #0f141c;
      touch-action: pan-x pan-y;
    }

    body {
      background: #0f141c;
      color: #ffffff;
      font-family: sans-serif;
      overflow-y: auto;
      -webkit-text-size-adjust: 100%;
      user-select: none;
    }

    .bc-main-wrapper {
      background: #171d28;
      border: 1px solid #222b3a;
      border-radius: 14px;
      overflow: hidden;
    }

    .bc-divider {
      height: 1px;
      background-color: #222b3a;
      width: 100%;
    }

    .bc-input-box {
      background: #0f141c;
      border: 1px solid #222b3a;
      border-radius: 10px;
    }
    .bc-input-box:focus-within {
      border-color: #24ee89;
    }

    .green-btn {
      background: #24ee89;
      color: #0f141c;
      font-weight: 800;
    }
    .green-btn:hover {
      background: #1ed67a;
    }

    .red-btn {
      background: #ed4245;
      color: #ffffff;
      font-weight: 800;
    }
    .red-btn:hover {
      background: #d3383b;
    }

    /* Smooth Color Shift Animation for Timer */
    @keyframes colorShift {
      0% { color: #ef4444; }   /* Red */
      33% { color: #3b82f6; }  /* Blue */
      66% { color: #ec4899; }  /* Pink */
      100% { color: #24ee89; } /* Green */
    }

    .timer-colored {
      animation: colorShift 10s linear infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0f141c;
    }
    ::-webkit-scrollbar-thumb {
      background: #222b3a;
      border-radius: 2px;
    }
  </style>
</head>
<body class="bg-[#0f141c] text-white font-sans min-h-screen flex flex-col items-center justify-between p-0 select-none">

  <!-- Top Bar Container -->
  <div id="topBarContainer" class="w-full max-w-2xl sticky top-0 z-50"></div>

  <div class="w-full max-w-2xl flex flex-col justify-between overflow-x-hidden my-2 pb-24 px-2 sm:px-4">
    
    <main class="flex flex-col gap-3 flex-1">
      
      <!-- Unified Main Game Wrapper Card -->
      <div class="bc-main-wrapper flex flex-col shadow-xl">
        
        <!-- Crash Game Screen Area -->
        <div class="relative flex flex-col items-center justify-center h-64 w-full overflow-hidden bg-[#171d28] pt-12">
          
          <!-- Sky and Cloud Background Layer -->
          <div class="absolute inset-0 pointer-events-none opacity-20 overflow-hidden z-0">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-blue-500 rounded-full blur-3xl"></div>
            <div class="absolute top-10 right-10 w-48 h-48 bg-indigo-600 rounded-full blur-3xl"></div>
            <div class="absolute bottom-5 left-1/3 w-36 h-36 bg-sky-400 rounded-full blur-2xl"></div>
          </div>

          <!-- History Bar & Icon -->
          <div class="absolute top-1.5 left-3 right-2 flex items-center justify-between z-30 pb-1 pr-1">
            <div id="historyBar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar flex-1 pr-6"></div>
            <button onclick="openHistoryModal()" class="bg-[#222b3a] hover:bg-[#2c3748] text-gray-300 hover:text-white px-2.5 py-1 rounded-md text-xs font-bold flex items-center gap-1 transition shadow shrink-0 -mt-1 mr-4">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
          </div>

          <!-- Status / Multiplier Display -->
          <div id="gameStatusDisplay" class="flex flex-col items-center justify-center z-20 mt-8">
            <span id="multiplierText" class="text-4xl sm:text-5xl font-black tracking-wider text-white hidden">1.00x</span>
            <span id="winLossSubText" class="text-xs font-bold mt-1 text-gray-400 hidden"></span>
            <span id="subStatusText" class="text-sm sm:text-base font-bold timer-colored mt-1">Starts in 10.0s</span>
          </div>

          <!-- Canvas for Vector Airplane -->
          <canvas id="crashCanvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none" style="top: 32px; height: calc(100% - 32px);"></canvas>
        </div>

        <div class="bc-divider"></div>

        <!-- Game Controls Section -->
        <div class="p-4 flex flex-col gap-3.5 bg-[#171d28]">
          
          <!-- Manual / Auto Tabs Switcher -->
          <div class="bg-[#0f141c] p-1 rounded-xl flex justify-around text-sm font-medium text-gray-400 border border-[#222b3a]">
            <button onclick="switchTab('manual')" id="tabManual" class="py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition">Manual</button>
            <button onclick="switchTab('auto')" id="tabAuto" class="py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition">Auto</button>
          </div>

          <!-- Bet Amount Controls -->
          <div class="flex flex-col gap-1">
            <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
              <span>Amount (৳)</span>
              <span class="text-gray-400 text-[10px]">Min: 0.1 ৳</span>
            </div>
            <div class="flex items-center bc-input-box p-1">
              <div class="flex items-center px-2 text-gray-400 font-bold text-sm">৳</div>
              <input type="number" id="betAmount" value="1" min="0.1" step="any" class="w-full bg-transparent text-sm font-bold text-white focus:outline-none px-1">
              
              <div class="flex items-center gap-1" id="betModifiers">
                <button onclick="modifyBet('half')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">1/2</button>
                <button onclick="modifyBet('double')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">2x</button>
                <button onclick="modifyBet('max')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-[#F5CF66] transition">Max</button>
              </div>
            </div>
          </div>

          <!-- Auto Cash Out Controls -->
          <div class="flex flex-col gap-1">
            <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
              <span>Auto Cash Out</span>
              <span id="chancePercentText" class="text-gray-400 text-[10px]">Chance: 49.50%</span>
            </div>
            <div id="autoCashBox" class="flex items-center bc-input-box p-1">
              <input type="number" id="autoCashOut" value="2.00" min="1.001" step="0.1" oninput="validateAutoCashOut()" class="w-full bg-transparent text-sm font-bold text-white focus:outline-none px-3">
              <span class="px-3 text-gray-400 font-bold text-xs">×</span>
            </div>
          </div>

          <!-- Auto Bet Specific & Advanced Options Section -->
          <div id="autoBetSettings" class="flex flex-col gap-3 hidden">
            <div class="flex flex-col gap-1">
              <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
                <span>Number of Bets (Rounds)</span>
              </div>
              <div class="flex items-center bc-input-box p-1">
                <input type="number" id="autoRounds" value="10" min="1" max="1000" class="w-full bg-transparent text-sm font-bold text-white focus:outline-none px-3">
              </div>
            </div>

            <!-- Advanced Options -->
            <div class="flex flex-col gap-2.5 pt-1 border-t border-[#222b3a]">
              <span class="text-xs font-bold text-gray-300">Advanced Options</span>

              <!-- On Win -->
              <div class="flex flex-col gap-1 bg-[#0f141c] p-2.5 rounded-xl border border-[#222b3a]">
                <span class="text-[11px] text-gray-400">On win</span>
                <div class="flex items-center gap-2">
                  <div class="flex flex-1 bg-[#171d28] p-1 rounded-lg border border-[#222b3a]">
                    <button onclick="setAdvancedAction('win', 'reset')" id="winResetBtn" class="flex-1 py-1 rounded-md text-xs font-bold bg-[#222b3a] text-white transition active:scale-95">Reset</button>
                    <button onclick="setAdvancedAction('win', 'increase')" id="winIncBtn" class="flex-1 py-1 rounded-md text-xs font-bold text-gray-400 hover:text-white transition active:scale-95">Increase by</button>
                  </div>
                  <div class="w-24 flex items-center bc-input-box px-2 py-1">
                    <input type="number" id="winIncVal" value="0" step="any" class="w-full bg-transparent text-xs font-bold text-white focus:outline-none text-right">
                    <span class="text-xs text-gray-400 ml-1">%</span>
                  </div>
                </div>
              </div>

              <!-- On Loss -->
              <div class="flex flex-col gap-1 bg-[#0f141c] p-2.5 rounded-xl border border-[#222b3a]">
                <span class="text-[11px] text-gray-400">On loss</span>
                <div class="flex items-center gap-2">
                  <div class="flex flex-1 bg-[#171d28] p-1 rounded-lg border border-[#222b3a]">
                    <button onclick="setAdvancedAction('loss', 'reset')" id="lossResetBtn" class="flex-1 py-1 rounded-md text-xs font-bold bg-[#222b3a] text-white transition active:scale-95">Reset</button>
                    <button onclick="setAdvancedAction('loss', 'increase')" id="lossIncBtn" class="flex-1 py-1 rounded-md text-xs font-bold text-gray-400 hover:text-white transition active:scale-95">Increase by</button>
                  </div>
                  <div class="w-24 flex items-center bc-input-box px-2 py-1">
                    <input type="number" id="lossIncVal" value="0" step="any" class="w-full bg-transparent text-xs font-bold text-white focus:outline-none text-right">
                    <span class="text-xs text-gray-400 ml-1">%</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Button -->
          <button id="btnAction" onclick="handleMainAction()" class="w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2">
            <span>Bet (Next Round)</span>
          </button>

        </div>

      </div>

    </main>
  </div>

  <!-- History Popup Modal -->
  <div id="historyModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-3">
    <div class="bg-[#171d28] border border-[#222b3a] w-full max-w-lg rounded-2xl p-4 flex flex-col max-h-[85vh] shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-[#222b3a]">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-history text-[#24ee89]"></i> 30 Crash History & Details</h3>
        <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-white px-2 py-1 text-sm font-bold"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="overflow-y-auto flex-1 mt-3 space-y-2 pr-1" id="modalHistoryList"></div>
    </div>
  </div>

  <!-- Bottom Bar Container -->
  <div id="bottomBarContainer" class="w-full max-w-2xl fixed bottom-0 z-50"></div>

  <script>
    let currentUserId = null;
    let userRealGameId = "GID-784920";
    let balance = 0.00;
    let gameState = 'waiting'; 
    let countdownTime = 10.0;
    let currentMultiplier = 1.00;
    let crashPoint = 1.00;
    let gameInterval = null;
    let isPlayingNext = false;
    let hasCashedOut = false;
    let activeBetAmount = 0;
    let activeTab = 'manual';
    let isAutoRunning = false;
    let remainingAutoRounds = 0;
    let initialAutoBetAmount = 1;
    let winAction = 'reset';
    let lossAction = 'reset';
    let sparkles = [];
    let previousResults = JSON.parse(localStorage.getItem('bc_crash_history')) || [1.45, 2.10, 1.05, 5.30, 1.12, 1.88, 3.40, 1.01, 2.22, 4.15];

    // Prevent Zoom In / Zoom Out
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getMultiplierStyle(val) {
      if (val <= 1.50)  return { textColor: 'text-red-500', hex: '#ef4444', bgClass: 'bg-red-500/10 border-red-500/30' };
      if (val <= 2.00)  return { textColor: 'text-rose-400', hex: '#fb7185', bgClass: 'bg-rose-400/10 border-rose-400/30' };
      if (val <= 3.00)  return { textColor: 'text-orange-400', hex: '#fb923c', bgClass: 'bg-orange-400/10 border-orange-400/30' };
      if (val <= 4.00)  return { textColor: 'text-amber-400', hex: '#fbbf24', bgClass: 'bg-amber-400/10 border-amber-400/30' };
      if (val <= 5.00)  return { textColor: 'text-yellow-300', hex: '#fde047', bgClass: 'bg-yellow-300/10 border-yellow-300/30' };
      if (val <= 7.00)  return { textColor: 'text-emerald-400', hex: '#34d399', bgClass: 'bg-emerald-400/10 border-emerald-400/30' };
      if (val <= 10.00) return { textColor: 'text-[#24ee89]', hex: '#24ee89', bgClass: 'bg-[#24ee89]/10 border-[#24ee89]/30' };
      if (val <= 20.00) return { textColor: 'text-cyan-400', hex: '#22d3ee', bgClass: 'bg-cyan-400/10 border-cyan-400/30' };
      if (val <= 50.00) return { textColor: 'text-blue-500', hex: '#3b82f6', bgClass: 'bg-blue-500/10 border-blue-500/30' };
      return            { textColor: 'text-purple-400', hex: '#c084fc', bgClass: 'bg-purple-400/10 border-purple-400/30' };
    }

    function generateMaskedHash(seed) {
      const chars = "abcdef0123456789";
      let fullHash = "";
      for (let i = 0; i < 32; i++) {
        fullHash += chars[Math.floor(Math.random() * chars.length)];
      }
      return fullHash.substring(0, 6) + " (...) " + fullHash.substring(26);
    }

    function validateAutoCashOut() {
      const val = parseFloat(document.getElementById('autoCashOut').value) || 0;
      const box = document.getElementById('autoCashBox');
      const chanceText = document.getElementById('chancePercentText');

      if (val <= 1.001) {
        box.style.borderColor = '#ed4245';
        chanceText.innerText = "Invalid Multiplier";
        chanceText.style.color = "#ed4245";
      } else {
        box.style.borderColor = '#222b3a';
        let chance = Math.min(99, Math.max(1, (99 / val))).toFixed(2);
        chanceText.innerText = `Chance: ${chance}%`;
        chanceText.style.color = "#9ca3af";
      }
    }

    async function loadBars() {
      try {
        const topRes = await fetch('../bar/top.html');
        if (topRes.ok) {
          document.getElementById('topBarContainer').innerHTML = await topRes.text();
        }

        const botRes = await fetch('../bar/bottom.html');
        if (botRes.ok) {
          document.getElementById('bottomBarContainer').innerHTML = await botRes.text();
        }
      } catch (e) { console.error('Bar load error:', e); }
    }

    async function initCrashGame() {
      await loadBars();
      renderHistoryBar();
      drawEmptyCanvas();
      validateAutoCashOut();

      if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') {
        const user = await getCurrentUser();
        if (user) {
          currentUserId = user.id;
          
          const { data: profile } = await supabaseClient.from('profiles').select('balance, user_game_id').eq('id', user.id).single();
          if (profile) {
            balance = parseFloat(profile.balance) || 0;
            if (profile.user_game_id) userRealGameId = profile.user_game_id;
            updateBalanceUI();
          }

          supabaseClient
            .channel('crash-profile-channel')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${user.id}` }, (payload) => {
              if (payload.new) {
                if (payload.new.balance !== undefined) {
                  balance = parseFloat(payload.new.balance) || 0;
                  updateBalanceUI();
                }
                if (payload.new.user_game_id !== undefined && payload.new.user_game_id) {
                  userRealGameId = payload.new.user_game_id;
                }
              }
            })
            .subscribe();
        }
      }

      let globalRoundStart = localStorage.getItem('bc_round_start_time');
      let now = Date.now();
      
      if (!globalRoundStart || (now - parseInt(globalRoundStart)) > 25000) {
        globalRoundStart = now;
        localStorage.setItem('bc_round_start_time', globalRoundStart);
      }

      let elapsedSec = (now - parseInt(globalRoundStart)) / 1000;
      let cycleTime = elapsedSec % 15;

      if (cycleTime < 10) {
        countdownTime = 10 - cycleTime;
        startWaitingPhase(true);
      } else {
        startRunningPhase(cycleTime - 10);
      }
    }

    function updateBalanceUI() {
      const topBal1 = document.getElementById('topBarBalance');
      const topBal2 = document.getElementById('userBalance');
      
      if (topBal1) topBal1.innerText = balance.toFixed(2);
      if (topBal2) topBal2.innerText = `৳ ${balance.toFixed(2)}`;
    }

    function renderHistoryBar() {
      const historyContainer = document.getElementById('historyBar');
      if (!historyContainer) return;
      historyContainer.innerHTML = '';

      previousResults.slice(-30).reverse().forEach(res => {
        let badge = document.createElement('span');
        let styleInfo = getMultiplierStyle(res);
        badge.className = `px-2 py-0.5 rounded-md text-[11px] font-bold border ${styleInfo.textColor} ${styleInfo.bgClass} whitespace-nowrap`;
        badge.innerText = res.toFixed(2) + 'x';
        historyContainer.appendChild(badge);
      });
      localStorage.setItem('bc_crash_history', JSON.stringify(previousResults));
    }

    function openHistoryModal() {
      const modal = document.getElementById('historyModal');
      const listContainer = document.getElementById('modalHistoryList');
      if (!modal || !listContainer) return;

      listContainer.innerHTML = '';
      let thirtyResults = previousResults.slice(-30).reverse();

      thirtyResults.forEach((res, index) => {
        let styleInfo = getMultiplierStyle(res);
        let row = document.createElement('div');
        row.className = "flex items-center justify-between bg-[#0f141c] border border-[#222b3a] px-3 py-2 rounded-xl text-xs";
        
        let uniqueHash = generateMaskedHash(index + res);
        let gameIdDisplay = userRealGameId + "-" + (1000 + index);

        row.innerHTML = `
          <div class="flex flex-col gap-0.5">
            <span class="text-gray-400 text-[10px]">Game ID: <b class="text-gray-200">${gameIdDisplay}</b></span>
            <span class="text-gray-500 font-mono text-[10px]">Hash: ${uniqueHash}</span>
          </div>
          <div class="px-2.5 py-1 rounded-lg font-black border ${styleInfo.textColor} ${styleInfo.bgClass}">
            ${res.toFixed(2)}x
          </div>
        `;
        listContainer.appendChild(row);
      });

      modal.classList.remove('hidden');
    }

    function closeHistoryModal() {
      const modal = document.getElementById('historyModal');
      if (modal) modal.classList.add('hidden');
    }

    function modifyBet(type) {
      if (isAutoRunning || (gameState === 'running' && isPlayingNext)) return;
      let input = document.getElementById('betAmount');
      let current = parseFloat(input.value) || 0;
      if (type === 'half') {
        input.value = Math.max(0.1, (current / 2)).toFixed(2);
      } else if (type === 'double') {
        input.value = (current * 2).toFixed(2);
      } else if (type === 'max') {
        input.value = balance.toFixed(2);
      }
    }

    function setAdvancedAction(type, action) {
      if (isAutoRunning || (gameState === 'running' && isPlayingNext)) return;
      if (type === 'win') {
        winAction = action;
        const resetBtn = document.getElementById('winResetBtn');
        const incBtn = document.getElementById('winIncBtn');
        if (action === 'reset') {
          resetBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold bg-[#222b3a] text-white transition active:scale-95';
          incBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold text-gray-400 hover:text-white transition active:scale-95';
        } else {
          incBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold bg-[#222b3a] text-white transition active:scale-95';
          resetBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold text-gray-400 hover:text-white transition active:scale-95';
        }
      } else {
        lossAction = action;
        const resetBtn = document.getElementById('lossResetBtn');
        const incBtn = document.getElementById('lossIncBtn');
        if (action === 'reset') {
          resetBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold bg-[#222b3a] text-white transition active:scale-95';
          incBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold text-gray-400 hover:text-white transition active:scale-95';
        } else {
          incBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold bg-[#222b3a] text-white transition active:scale-95';
          resetBtn.className = 'flex-1 py-1 rounded-md text-xs font-bold text-gray-400 hover:text-white transition active:scale-95';
        }
      }
    }

    function switchTab(tab) {
      if (isAutoRunning || (gameState === 'running' && isPlayingNext)) return;
      activeTab = tab;
      const tabManual = document.getElementById('tabManual');
      const tabAuto = document.getElementById('tabAuto');
      const autoSettings = document.getElementById('autoBetSettings');
      const btn = document.getElementById('btnAction');

      if (tab === 'manual') {
        tabManual.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabAuto.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';
        autoSettings.classList.add('hidden');
        btn.innerText = "Bet (Next Round)";
      } else {
        tabAuto.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabManual.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';
        autoSettings.classList.remove('hidden');
        btn.innerText = "Start Auto Bet";
      }
    }

    function drawEmptyCanvas() {
      const canvas = document.getElementById('crashCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sparkles = [];
    }

    async function startWaitingPhase(isSynced = false) {
      gameState = 'waiting';
      hasCashedOut = false;
      drawEmptyCanvas();
      
      const multText = document.getElementById('multiplierText');
      const subText = document.getElementById('subStatusText');
      const winLossText = document.getElementById('winLossSubText');
      const btn = document.getElementById('btnAction');

      multText.classList.add('hidden');
      winLossText.classList.add('hidden');
      subText.className = "text-sm sm:text-base font-bold timer-colored mt-1";

      if (!isSynced) {
        localStorage.setItem('bc_round_start_time', Date.now());
        countdownTime = 10.0;
      }

      if (isAutoRunning && remainingAutoRounds > 0) {
        isPlayingNext = true;
      }

      if (isPlayingNext) {
        if (isAutoRunning) {
          btn.className = "w-full py-3.5 red-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
          btn.innerText = `Stop Auto (${remainingAutoRounds})`;
        } else {
          btn.className = "w-full py-3.5 red-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
          btn.innerText = "Cancel Bet";
        }
      } else {
        btn.className = "w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
        btn.innerText = activeTab === 'auto' ? "Start Auto Bet" : "Bet (Next Round)";
      }

      if (gameInterval) clearInterval(gameInterval);

      if (isPlayingNext && !isSynced) {
        await processBetDeduction();
      }

      gameInterval = setInterval(() => {
        countdownTime -= 0.1;
        subText.innerText = `Starts in ${Math.max(0, countdownTime).toFixed(1)}s`;

        if (countdownTime <= 0) {
          clearInterval(gameInterval);
          startRunningPhase(0);
        }
      }, 100);
    }

    async function processBetDeduction() {
      let autoVal = parseFloat(document.getElementById('autoCashOut').value) || 0;
      if (autoVal <= 1.001) {
        alert("অটো ক্যাশ আউট ভ্যালু ১.০০১ এর বেশি হতে হবে!");
        stopAutoSequence();
        startWaitingPhase();
        return;
      }

      activeBetAmount = parseFloat(document.getElementById('betAmount').value) || 0;
      if (activeBetAmount < 0.1) {
        alert("সর্বনিম্ন বেট ০.১ টাকা হতে হবে!");
        stopAutoSequence();
        startWaitingPhase();
        return;
      }
      if (activeBetAmount > balance) {
        alert("পর্যাপ্ত ব্যালেন্স নেই!");
        stopAutoSequence();
        startWaitingPhase();
        return;
      }

      balance -= activeBetAmount;
      updateBalanceUI();
      if (currentUserId && typeof supabaseClient !== 'undefined') {
        await supabaseClient.from('profiles').update({ balance: balance }).eq('id', currentUserId);
      }
    }

    function stopAutoSequence() {
      isAutoRunning = false;
      isPlayingNext = false;
      remainingAutoRounds = 0;
      const tabManual = document.getElementById('tabManual');
      tabManual.disabled = false;
      tabManual.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    async function startRunningPhase(initialElapsed = 0) {
      gameState = 'running';
      currentMultiplier = 1.00;
      sparkles = [];
      
      let r = Math.random();
      crashPoint = parseFloat((Math.max(1.00, 0.99 / (1 - r))).toFixed(2));
      if (Math.random() < 0.04) crashPoint = 1.00;

      const multText = document.getElementById('multiplierText');
      const subText = document.getElementById('subStatusText');
      const btn = document.getElementById('btnAction');

      multText.classList.remove('hidden');
      subText.className = "text-xs text-gray-400 font-semibold mt-1 hidden";

      if (isPlayingNext) {
        if (isAutoRunning) {
          btn.className = "w-full py-3.5 bg-[#222b3a] text-gray-400 font-bold text-sm rounded-xl cursor-not-allowed";
          btn.innerText = `Auto Running... (${remainingAutoRounds})`;
        } else if (activeTab === 'manual') {
          btn.className = "w-full py-3.5 bg-[#24ee89] text-[#0f141c] font-black text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
          btn.innerText = "Cash Out";
        }
      } else {
        btn.className = "w-full py-3.5 bg-[#222b3a] text-gray-400 font-bold text-sm rounded-xl cursor-not-allowed";
        btn.innerText = "Running...";
      }

      const canvas = document.getElementById('crashCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;

      let startTime = Date.now() - (initialElapsed * 1000);

      gameInterval = setInterval(async () => {
        let elapsedTime = (Date.now() - startTime) / 1000;
        currentMultiplier = parseFloat((Math.exp(0.08 * elapsedTime)).toFixed(2));

        let currentStyle = getMultiplierStyle(currentMultiplier);
        multText.className = `text-4xl sm:text-5xl font-black tracking-wider ${currentStyle.textColor}`;
        multText.innerText = currentMultiplier.toFixed(2) + 'x';

        if (isPlayingNext && !hasCashedOut && activeBetAmount > 0) {
          let liveWin = activeBetAmount * currentMultiplier;
          if (activeTab === 'manual' && !isAutoRunning) {
            btn.innerText = `Cash Out (৳ ${liveWin.toFixed(2)})`;
          }
        }

        let autoCash = parseFloat(document.getElementById('autoCashOut').value) || 0;
        if (isPlayingNext && !hasCashedOut && autoCash > 1.001 && currentMultiplier >= autoCash) {
          if (currentMultiplier <= crashPoint) {
            await cashOut(autoCash);
          }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let progress = Math.min(1, elapsedTime / 10);
        let startX = 25;
        let startY = canvas.height - 25;
        let currentX = startX + (canvas.width - 70) * progress;
        let currentY = startY - (canvas.height - 50) * Math.pow(progress, 1.3);

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(startX + (currentX - startX) * 0.4, startY - 10, currentX, currentY);
        ctx.strokeStyle = currentStyle.hex;
        ctx.lineWidth = 4.5;
        ctx.shadowColor = currentStyle.hex;
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;

        sparkles.push({
          x: currentX - 10 - (Math.random() * 12),
          y: currentY + (Math.random() * 8),
          vx: -1.5 - Math.random() * 1.5,
          vy: 1.5 + Math.random() * 2,
          size: Math.random() * 2 + 1.5,
          alpha: 1.0
        });

        for (let i = sparkles.length - 1; i >= 0; i--) {
          let s = sparkles[i];
          s.x += s.vx;
          s.y += s.vy;
          s.alpha -= 0.05;

          if (s.alpha <= 0) {
            sparkles.splice(i, 1);
            continue;
          }

          ctx.fillStyle = currentStyle.hex;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.save();
        ctx.translate(currentX, currentY);
        ctx.rotate(-Math.PI / 5);

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = currentStyle.hex;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(16, 0);
        ctx.lineTo(-14, -7);
        ctx.lineTo(-9, 0);
        ctx.lineTo(-14, 7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();

        if (currentMultiplier >= crashPoint) {
          clearInterval(gameInterval);
          await triggerCrash();
        }
      }, 50);
    }

    async function cashOut(multiplierToUse = null) {
      if (!isPlayingNext || hasCashedOut || gameState !== 'running') return;
      hasCashedOut = true;

      let mult = multiplierToUse || currentMultiplier;
      let winAmount = activeBetAmount > 0 ? (activeBetAmount * mult) : 0;

      if (activeBetAmount > 0) {
        balance += winAmount;
        updateBalanceUI();
      }

      const multText = document.getElementById('multiplierText');
      const winLossText = document.getElementById('winLossSubText');
      multText.className = "text-4xl sm:text-5xl font-black tracking-wider text-[#24ee89]";
      multText.innerText = mult.toFixed(2) + 'x';
      
      if (activeBetAmount > 0) {
        winLossText.className = "text-xs font-bold mt-1 text-[#24ee89]";
        winLossText.innerText = `Won ৳ ${winAmount.toFixed(2)}`;
        winLossText.classList.remove('hidden');
      }

      const btn = document.getElementById('btnAction');
      btn.className = "w-full py-3.5 bg-[#222b3a] text-gray-400 font-bold text-sm rounded-xl cursor-not-allowed";
      btn.innerText = `Cashed Out (৳ ${winAmount.toFixed(2)})`;

      if (currentUserId && activeBetAmount > 0 && typeof supabaseClient !== 'undefined') {
        const insertData = {
          id: generateUUID(),
          user_id: currentUserId,
          game_name: 'Crash',
          bet_amount: activeBetAmount,
          payout: winAmount,
          multiplier: mult,
          status: 'won',
          game_details: {
            auto_cash_out: parseFloat(document.getElementById('autoCashOut').value) || 0
          }
        };

        const { error } = await supabaseClient.from('original_bets_history').insert([insertData]);
        if (error) console.error("Supabase Cashout Insert Error:", error);

        await supabaseClient.from('profiles').update({ balance: balance }).eq('id', currentUserId);
      }

      // Apply Advanced Option on Win
      if (isAutoRunning) {
        let curBet = parseFloat(document.getElementById('betAmount').value) || 1;
        if (winAction === 'reset') {
          document.getElementById('betAmount').value = initialAutoBetAmount.toFixed(2);
        } else {
          let incPct = parseFloat(document.getElementById('winIncVal').value) || 0;
          curBet += curBet * (incPct / 100);
          document.getElementById('betAmount').value = curBet.toFixed(2);
        }
      }
    }

    async function triggerCrash() {
      gameState = 'crashed';
      const multText = document.getElementById('multiplierText');
      const subText = document.getElementById('subStatusText');
      const winLossText = document.getElementById('winLossSubText');

      let crashStyle = getMultiplierStyle(crashPoint);
      multText.className = `text-4xl sm:text-5xl font-black tracking-wider ${crashStyle.textColor}`;
      multText.innerText = crashPoint.toFixed(2) + 'x';
      subText.className = "text-xs text-gray-400 font-semibold mt-1";
      subText.innerText = "Crashed!";

      let isWinRound = hasCashedOut;

      if (isPlayingNext && !hasCashedOut && activeBetAmount > 0) {
        winLossText.className = "text-xs font-bold mt-1 text-red-500";
        winLossText.innerText = "Lost";
        winLossText.classList.remove('hidden');

        if (currentUserId && typeof supabaseClient !== 'undefined') {
          const insertData = {
            id: generateUUID(),
            user_id: currentUserId,
            game_name: 'Crash',
            bet_amount: activeBetAmount,
            payout: 0,
            multiplier: crashPoint,
            status: 'lost',
            game_details: {
              auto_cash_out: parseFloat(document.getElementById('autoCashOut').value) || 0
            }
          };

          const { error } = await supabaseClient.from('original_bets_history').insert([insertData]);
          if (error) console.error("Supabase Crash Insert Error:", error);
        }

        // Apply Advanced Option on Loss
        if (isAutoRunning) {
          let curBet = parseFloat(document.getElementById('betAmount').value) || 1;
          if (lossAction === 'reset') {
            document.getElementById('betAmount').value = initialAutoBetAmount.toFixed(2);
          } else {
            let incPct = parseFloat(document.getElementById('lossIncVal').value) || 0;
            curBet += curBet * (incPct / 100);
            document.getElementById('betAmount').value = curBet.toFixed(2);
          }
        }
      }

      previousResults.push(crashPoint);
      if (previousResults.length > 30) previousResults.shift();
      renderHistoryBar();

      if (isAutoRunning) {
        remainingAutoRounds--;
        if (remainingAutoRounds <= 0) {
          stopAutoSequence();
        }
      } else {
        isPlayingNext = false;
      }

      setTimeout(() => {
        startWaitingPhase(false);
      }, 2500);
    }

    async function handleMainAction() {
      let autoVal = parseFloat(document.getElementById('autoCashOut').value) || 0;
      if (autoVal <= 1.001) {
        alert("অটো ক্যাশ আউট ভ্যালু ১.০০১ এর বেশি হতে হবে!");
        return;
      }

      if (gameState === 'waiting') {
        if (activeTab === 'auto') {
          if (isAutoRunning) {
            stopAutoSequence();
            startWaitingPhase(true);
            return;
          }

          remainingAutoRounds = parseInt(document.getElementById('autoRounds').value) || 10;
          if (remainingAutoRounds <= 0) {
            alert('অনুগ্রহ করে সঠিক রাউন্ড সংখ্যা দিন!');
            return;
          }

          initialAutoBetAmount = parseFloat(document.getElementById('betAmount').value) || 1;
          isAutoRunning = true;
          isPlayingNext = true;

          const tabManual = document.getElementById('tabManual');
          tabManual.disabled = true;
          tabManual.classList.add('opacity-50', 'cursor-not-allowed');

          const btn = document.getElementById('btnAction');
          btn.className = "w-full py-3.5 red-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
          btn.innerText = `Stop Auto (${remainingAutoRounds})`;
          await processBetDeduction();
        } else {
          isPlayingNext = !isPlayingNext;
          const btn = document.getElementById('btnAction');
          if (isPlayingNext) {
            btn.className = "w-full py-3.5 red-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
            btn.innerText = "Cancel Bet";
            await processBetDeduction();
          } else {
            if (activeBetAmount > 0) {
              balance += activeBetAmount;
              updateBalanceUI();
              if (currentUserId && typeof supabaseClient !== 'undefined') {
                await supabaseClient.from('profiles').update({ balance: balance }).eq('id', currentUserId);
              }
            }
            btn.className = "w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
            btn.innerText = "Bet (Next Round)";
          }
        }
      } else if (gameState === 'running' && activeTab === 'manual' && isPlayingNext && !hasCashedOut && !isAutoRunning) {
        await cashOut();
      }
    }

    window.onload = initCrashGame;
  </script>
</body>
