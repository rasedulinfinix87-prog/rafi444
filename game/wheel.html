<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BC Game Style Wheel</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #0f141c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f141c;
      color: #ffffff;
      font-family: sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: calc(140px + env(safe-area-inset-bottom));
    }

    /* BC Game Card Style */
    .bc-main-wrapper {
      background: #171d28;
      border: 1px solid #222b3a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .bc-divider {
      height: 1px;
      background-color: #222b3a;
      width: 100%;
    }

    .bc-input-box {
      background: #0f141c;
      border: 1px solid #222b3a;
      border-radius: 10px;
    }
    .bc-input-box:focus-within {
      border-color: #24ee89;
    }

    .green-btn {
      background: #24ee89;
      color: #0f141c;
      font-weight: 800;
    }
    .green-btn:hover {
      background: #1ed67a;
    }

    #topBarContainer {
      position: sticky;
      top: 0;
      z-index: 500;
      width: 100%;
    }

    /* Bottom navigation stays fixed at the bottom */
    #bottomBarContainer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 5000;
      isolation: isolate;
      padding-bottom: env(safe-area-inset-bottom);
    }

    ::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #0f141c;
    }

    ::-webkit-scrollbar-thumb {
      background: #222b3a;
      border-radius: 2px;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-scrollbar {
      display: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #24ee89;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(36, 238, 137, 0.4);
      position: relative;
      z-index: 2;
    }

    .slider-track-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Visible Dags/Ticks for Slider */
    .slider-ticks {
      display: flex;
      justify-content: space-between;
      padding: 0 6px;
      margin-top: 4px;
    }

    .slider-tick {
      width: 2px;
      height: 6px;
      background: #374151;
      position: relative;
    }
  </style>
</head>

<body class="bg-[#0f141c] text-white font-sans min-h-screen flex flex-col items-center justify-start p-0 select-none">

  <!-- Top Bar Container -->
  <div id="topBarContainer" class="w-full max-w-2xl"></div>

  <!-- Main Game Card Wrapper -->
  <div class="w-full max-w-2xl flex flex-col justify-between overflow-x-hidden my-2 px-2 sm:px-4">

    <main class="flex flex-col gap-3 flex-1 pb-10">

      <div class="bc-main-wrapper flex flex-col shadow-xl p-4 gap-4">

        <!-- Wheel Canvas Area -->
        <div class="relative flex flex-col items-center justify-center my-2">

          <!-- Wheel Pointer -->
          <div class="absolute -top-3 z-20 text-[#ed4245] text-2xl filter drop-shadow">
            <i class="fa-solid fa-location-pin"></i>
          </div>

          <!-- Wheel -->
          <div class="relative w-72 h-72 sm:w-80 sm:h-80 rounded-full border-4 border-[#222b3a] p-1 bg-[#171d28] shadow-2xl flex items-center justify-center">

            <canvas id="wheelCanvas" width="340" height="340" class="w-full h-full rounded-full"></canvas>

            <!-- Center Result -->
            <div class="absolute w-20 h-20 rounded-full bg-[#0f141c] border-2 border-[#222b3a] flex flex-col items-center justify-center shadow-inner">
              <span class="text-[10px] text-gray-400 font-medium">Result</span>
              <span class="text-sm font-black text-[#24ee89]" id="centerMultiplierText">0×</span>
            </div>

          </div>
        </div>

        <div class="bc-divider"></div>

        <!-- Single Container for Payout Cards -->
        <div class="bc-input-box p-2.5 rounded-xl flex items-center justify-between gap-2 overflow-x-auto">
          <div id="payoutCardsBar" class="flex items-center justify-between w-full gap-2"></div>
        </div>

        <!-- Manual / Auto Tabs Switcher -->
        <div class="bg-[#0f141c] p-1 rounded-xl flex justify-around text-sm font-medium text-gray-400 border border-[#222b3a]">
          <button onclick="switchTab('manual')" id="tabManual" class="py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition">Manual</button>
          <button onclick="switchTab('auto')" id="tabAuto" class="py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition">Auto</button>
        </div>

        <!-- Bet Controls -->
        <div class="flex flex-col gap-3.5">

          <div class="flex flex-col gap-1">

            <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
              <span>Amount (৳)</span>
              <span class="text-gray-400 text-[10px]">Min: 1 ৳</span>
            </div>

            <div class="flex items-center bc-input-box p-1">

              <div class="flex items-center px-2 text-gray-400 font-bold text-sm">৳</div>

              <input
                type="number"
                id="betAmount"
                value="1"
                min="0"
                step="1"
                class="w-full bg-transparent text-sm font-bold text-white focus:outline-none px-1"
              >

              <div class="flex items-center gap-1">
                <button onclick="modifyBet('half')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">1/2</button>

                <button onclick="modifyBet('double')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">2x</button>

                <button onclick="modifyBet('max')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-[#F5CF66] transition">Max</button>
              </div>

            </div>

            <span class="text-[11px] text-gray-400 mt-1 text-center">
              ℹ Betting with 0 will enter demo mode.
            </span>

          </div>

          <!-- Auto Bet Specific Settings & Advanced Options (Conditionally Shown) -->
          <div id="autoBetSettings" class="flex flex-col gap-3 hidden">
            <div class="flex flex-col gap-1">
              <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
                <span>Number of Bets (Rounds)</span>
              </div>
              <div class="flex items-center bc-input-box p-1">
                <input type="number" id="autoRounds" value="10" min="1" max="1000" class="w-full bg-transparent text-sm font-bold text-white focus:outline-none px-3">
              </div>
            </div>

            <!-- Advanced Options Panel -->
            <div class="bg-[#0f141c] border border-[#222b3a] rounded-xl p-3 flex flex-col gap-3">
              <span class="text-xs font-bold text-gray-300">Advanced Options</span>

              <div class="flex flex-col gap-1">
                <span class="text-[11px] text-gray-400">On win</span>
                <div class="flex gap-2">
                  <button type="button" class="flex-1 py-1.5 rounded-lg bg-[#171d28] border border-[#222b3a] text-xs font-bold text-gray-300 hover:text-white">Reset</button>
                  <button type="button" class="flex-1 py-1.5 rounded-lg bg-[#171d28] border border-[#222b3a] text-xs font-bold text-gray-300 hover:text-white">Increase by</button>
                  <div class="flex items-center bc-input-box px-2 py-1 w-24">
                    <input type="number" value="0" class="w-full bg-transparent text-xs font-bold text-white text-right focus:outline-none">
                    <span class="text-xs text-gray-400 ml-1">%</span>
                  </div>
                </div>
              </div>

              <div class="flex flex-col gap-1">
                <span class="text-[11px] text-gray-400">On loss</span>
                <div class="flex gap-2">
                  <button type="button" class="flex-1 py-1.5 rounded-lg bg-[#171d28] border border-[#222b3a] text-xs font-bold text-gray-300 hover:text-white">Reset</button>
                  <button type="button" class="flex-1 py-1.5 rounded-lg bg-[#171d28] border border-[#222b3a] text-xs font-bold text-gray-300 hover:text-white">Increase by</button>
                  <div class="flex items-center bc-input-box px-2 py-1 w-24">
                    <input type="number" value="0" class="w-full bg-transparent text-xs font-bold text-white text-right focus:outline-none">
                    <span class="text-xs text-gray-400 ml-1">%</span>
                  </div>
                </div>
              </div>

              <div class="flex flex-col gap-1">
                <span class="text-[11px] text-gray-400">Stop on win</span>
                <div class="flex items-center bc-input-box px-3 py-1.5">
                  <span class="text-xs text-gray-400 font-bold mr-1">৳</span>
                  <input type="number" value="0" class="w-full bg-transparent text-xs font-bold text-white focus:outline-none">
                </div>
              </div>

              <div class="flex flex-col gap-1">
                <span class="text-[11px] text-gray-400">Stop on loss</span>
                <div class="flex items-center bc-input-box px-3 py-1.5">
                  <span class="text-xs text-gray-400 font-bold mr-1">৳</span>
                  <input type="number" value="0" class="w-full bg-transparent text-xs font-bold text-white focus:outline-none">
                </div>
              </div>
            </div>
          </div>

          <button
            id="btnBet"
            onclick="handleMainAction()"
            class="w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2"
          >
            <span>Bet</span>
          </button>

        </div>

        <div class="bc-divider"></div>

        <!-- Settings & Configuration Section -->
        <div class="flex flex-col gap-3">

          <!-- Segments Slider with Visible Dags -->
          <div class="flex flex-col gap-1.5">

            <div class="flex justify-between items-center text-xs text-gray-400 font-semibold">
              <span>Segments</span>
              <span id="segmentsVal" class="text-white font-bold">10</span>
            </div>

            <div class="slider-track-container">
              <input
                type="range"
                id="segmentsRange"
                min="10"
                max="50"
                step="10"
                value="10"
                oninput="updateSegments(this.value)"
                class="w-full accent-[#24ee89] cursor-pointer"
              />
              <!-- Visible Dags / Ticks -->
              <div class="slider-ticks">
                <div class="slider-tick" title="10"></div>
                <div class="slider-tick" title="20"></div>
                <div class="slider-tick" title="30"></div>
                <div class="slider-tick" title="40"></div>
                <div class="slider-tick" title="50"></div>
              </div>
            </div>

            <div class="flex justify-between items-center text-[11px] text-gray-400 px-0.5">
              <span>10</span>
              <span>20</span>
              <span>30</span>
              <span>40</span>
              <span>50</span>
            </div>

          </div>

          <!-- Risk Level Selectors -->
          <div class="flex flex-col gap-1.5 pt-1">

            <span class="text-xs text-gray-400 font-semibold">Risk Level</span>

            <div class="grid grid-cols-3 gap-2 bg-[#0f141c] p-1 rounded-xl border border-[#222b3a]">

              <button
                onclick="setRiskLevel('low')"
                id="btnRiskLow"
                class="py-2 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white"
              >
                Low
              </button>

              <button
                onclick="setRiskLevel('medium')"
                id="btnRiskMedium"
                class="py-2 rounded-lg text-xs font-bold transition bg-[#222b3a] text-white shadow"
              >
                Medium
              </button>

              <button
                onclick="setRiskLevel('high')"
                id="btnRiskHigh"
                class="py-2 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white"
              >
                High
              </button>

            </div>

          </div>

        </div>

      </div>

    </main>
  </div>

  <!-- Bottom Bar Container -->
  <div id="bottomBarContainer"></div>

  <script>
    let currentUserId = null;
    let balance = 0.00;
    let isSpinning = false;
    let segmentsCount = 10;
    let riskLevel = 'medium';
    let wheelSegments = [];
    let activeTab = 'manual';
    let autoPlayInterval = null;
    let remainingAutoRounds = 0;

    const availableColors = [
      '#24ee89',
      '#3b82f6',
      '#8b5cf6',
      '#ec4899',
      '#f59e0b',
      '#06b6d4',
      '#ef4444',
      '#a855f7'
    ];

    async function loadBars() {
      const topContainer = document.getElementById('topBarContainer');
      const bottomContainer = document.getElementById('bottomBarContainer');

      try {
        const [topRes, bottomRes] = await Promise.all([
          fetch('../bar/top.html'),
          fetch('../bar/bottom.html')
        ]);

        if (topRes.ok) {
          topContainer.innerHTML = await topRes.text();
        }

        if (bottomRes.ok) {
          bottomContainer.innerHTML = await bottomRes.text();
        }

      } catch (error) {
        console.error('Bar loading error:', error);
      }
    }

    async function initWheelGame() {
      await loadBars();

      generateWheelSegments();
      drawWheel(0);

      if (
        typeof supabaseClient !== 'undefined' &&
        typeof getCurrentUser === 'function'
      ) {
        try {
          const user = await getCurrentUser();

          if (user) {
            currentUserId = user.id;

            const { data: profile } = await supabaseClient
              .from('profiles')
              .select('balance')
              .eq('id', user.id)
              .single();

            if (profile) {
              balance = parseFloat(profile.balance) || 0;
              updateBalanceUI();
            }

            supabaseClient
              .channel('wheel-profile-channel')
              .on(
                'postgres_changes',
                {
                  event: 'UPDATE',
                  schema: 'public',
                  table: 'profiles',
                  filter: `id=eq.${user.id}`
                },
                (payload) => {
                  if (
                    payload.new &&
                    payload.new.balance !== undefined
                  ) {
                    balance = parseFloat(payload.new.balance) || 0;
                    updateBalanceUI();
                  }
                }
              )
              .subscribe();
          }

        } catch (error) {
          console.error('Wheel initialization error:', error);
        }
      }
    }

    function updateBalanceUI() {
      const topBal1 = document.getElementById('topBarBalance');
      const topBal2 = document.getElementById('userBalance');
      
      if (topBal1) topBal1.innerText = balance.toFixed(2);
      if (topBal2) topBal2.innerText = `৳ ${balance.toFixed(2)}`;
    }

    function modifyBet(type) {
      const input = document.getElementById('betAmount');
      const current = parseFloat(input.value) || 0;

      if (type === 'half') {
        input.value = Math.max(0, Math.floor(current / 2));
      } else if (type === 'double') {
        input.value = Math.floor(current * 2);
      } else if (type === 'max') {
        input.value = Math.floor(balance);
      }
    }

    function switchTab(tab) {
      if (isSpinning) return;
      activeTab = tab;
      const tabManual = document.getElementById('tabManual');
      const tabAuto = document.getElementById('tabAuto');
      const autoSettings = document.getElementById('autoBetSettings');
      const btn = document.getElementById('btnBet');

      if (tab === 'manual') {
        tabManual.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabAuto.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';
        autoSettings.classList.add('hidden');
        btn.innerText = 'Bet';
        if (autoPlayInterval) {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
        }
      } else {
        tabAuto.className = 'py-2 flex-1 rounded-lg bg-[#222b3a] text-white text-xs font-bold transition';
        tabManual.className = 'py-2 flex-1 rounded-lg hover:text-white text-xs font-bold transition';
        autoSettings.classList.remove('hidden');
        btn.innerText = 'Start Auto Bet';
      }
    }

    function updateSegments(val) {
      if (isSpinning) return;

      segmentsCount = parseInt(val, 10);
      document.getElementById('segmentsVal').innerText = segmentsCount;

      generateWheelSegments();
      drawWheel(0);
    }

    function setRiskLevel(level) {
      if (isSpinning) return;

      riskLevel = level;

      ['low', 'medium', 'high'].forEach((item) => {
        const btn = document.getElementById(
          'btnRisk' + item.charAt(0).toUpperCase() + item.slice(1)
        );

        if (!btn) return;

        if (item === level) {
          btn.className =
            'py-2 rounded-lg text-xs font-bold transition bg-[#222b3a] text-white shadow';
        } else {
          btn.className =
            'py-2 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white';
        }
      });

      generateWheelSegments();
      drawWheel(0);
    }

    function generateWheelSegments() {
      wheelSegments = [];

      // যদি segments 50 এবং risk high হয়, তবে শুধুমাত্র একটি কালার এবং 50x মাল্টিপ্লায়ার থাকবে
      if (segmentsCount === 50 && riskLevel === 'high') {
        for (let i = 0; i < 50; i++) {
          wheelSegments.push({
            multiplier: 50.00,
            color: '#24ee89'
          });
        }
        renderColorPayoutCards();
        return;
      }

      let segmentFactor = (segmentsCount - 10) / 40;
      let baseZeroRatio = riskLevel === 'low' ? 0.10 : riskLevel === 'medium' ? 0.25 : 0.40;
      let zeroRatio = Math.min(0.70, baseZeroRatio + (segmentFactor * 0.25));

      const zeroCount = Math.floor(segmentsCount * zeroRatio);

      for (let i = 0; i < zeroCount; i++) {
        wheelSegments.push({
          multiplier: 0.00,
          color: '#171d28'
        });
      }

      const remaining = segmentsCount - zeroCount;
      const maxMult = (riskLevel === 'low' ? 3.5 : riskLevel === 'medium' ? 19.6 : 98.0) * (1 + segmentFactor * 0.5);

      for (let i = 0; i < remaining; i++) {
        let val = Math.pow(
          (i + 1) / remaining,
          riskLevel === 'high' ? 2.5 : 1.5
        ) * maxMult;

        if (val < 1.1) val = 1.2;

        const color = availableColors[i % availableColors.length];

        wheelSegments.push({
          multiplier: parseFloat(val.toFixed(2)),
          color
        });
      }

      wheelSegments.sort(() => Math.random() - 0.5);

      renderColorPayoutCards();
    }

    function renderColorPayoutCards(highlightColor = null) {
      const bar = document.getElementById('payoutCardsBar');
      bar.innerHTML = '';

      const colorMap = new Map();

      wheelSegments.forEach((segment) => {
        if (!colorMap.has(segment.color)) {
          colorMap.set(segment.color, segment.multiplier);
        }
      });

      let items = Array.from(colorMap.entries());
      items.sort((a, b) => a[1] - b[1]);
      items = items.slice(0, 5);

      items.forEach(([color, mult]) => {
        const isHit = highlightColor === color;
        const subCard = document.createElement('div');

        subCard.className =
          `flex-1 p-1.5 rounded-lg flex flex-col items-center justify-center text-center transition-all ${isHit ? 'border border-[#24ee89] bg-[#24ee89]/10 scale-105' : 'bg-[#0f141c] border border-[#222b3a]'}`;

        subCard.innerHTML = `
          <div
            class="w-4 h-4 rounded-full mb-1 border border-white/20 shadow-sm"
            style="background-color: ${color};">
          </div>
          <span class="text-[9px] text-gray-400">Payout</span>
          <span class="text-[11px] font-extrabold text-[#24ee89]">
            ${mult.toFixed(2)}×
          </span>
        `;

        bar.appendChild(subCard);
      });
    }

    function drawWheel(rotationAngle) {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');

      const count = wheelSegments.length;
      if (!count) return;

      const arc = (2 * Math.PI) / count;
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      
      const outerRadius = width / 2 - 4;
      const innerRadius = width / 2 - 28;

      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotationAngle);
      ctx.translate(-centerX, -centerY);

      wheelSegments.forEach((segment, i) => {
        const angle = i * arc;

        ctx.beginPath();
        ctx.fillStyle = segment.color;

        ctx.arc(centerX, centerY, outerRadius, angle, angle + arc);
        ctx.arc(centerX, centerY, innerRadius, angle + arc, angle, true);
        ctx.closePath();
        ctx.fill();

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#0f141c';
        ctx.stroke();
      });

      ctx.restore();
    }

    function handleMainAction() {
      if (activeTab === 'manual') {
        triggerBet();
      } else {
        if (autoPlayInterval) {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
          isSpinning = false;
          const btn = document.getElementById('btnBet');
          btn.disabled = false;
          btn.className = "w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
          btn.innerText = 'Start Auto Bet';
          return;
        }

        remainingAutoRounds = parseInt(document.getElementById('autoRounds').value) || 10;
        if (remainingAutoRounds <= 0) {
          alert('অনুগ্রহ করে সঠিক রাউন্ড সংখ্যা দিন!');
          return;
        }

        const btn = document.getElementById('btnBet');
        btn.className = "w-full py-3.5 bg-red-600 text-white font-bold text-sm rounded-xl transition shadow";
        btn.innerText = `Stop Auto (${remainingAutoRounds})`;

        runAutoSpinSequence();
      }
    }

    function runAutoSpinSequence() {
      if (remainingAutoRounds <= 0 || activeTab !== 'auto') {
        if (autoPlayInterval) clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        isSpinning = false;
        const btn = document.getElementById('btnBet');
        btn.disabled = false;
        btn.className = "w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
        btn.innerText = 'Start Auto Bet';
        return;
      }

      const betVal = parseFloat(document.getElementById('betAmount').value) || 0;
      if (betVal > 0 && betVal < 1) {
        alert('সর্বনিম্ন বেট ১ টাকা হতে হবে!');
        handleMainAction();
        return;
      }
      if (betVal > balance) {
        alert('আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
        handleMainAction();
        return;
      }

      executeSpin(betVal, () => {
        remainingAutoRounds--;
        const btn = document.getElementById('btnBet');
        if (remainingAutoRounds > 0 && autoPlayInterval) {
          btn.innerText = `Stop Auto (${remainingAutoRounds})`;
          autoPlayInterval = setTimeout(runAutoSpinSequence, 600);
        } else {
          handleMainAction();
        }
      });
    }

    async function triggerBet() {
      if (isSpinning) return;

      const betVal = parseFloat(document.getElementById('betAmount').value) || 0;

      if (betVal < 0) {
        alert('বেটের পরিমাণ ০ বা তার বেশি হতে হবে!');
        return;
      }

      if (betVal > 0 && betVal < 1) {
        alert('সর্বনিম্ন বেট ১ টাকা হতে হবে!');
        return;
      }

      if (betVal > balance) {
        alert('আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
        return;
      }

      const btn = document.getElementById('btnBet');
      btn.disabled = true;
      btn.className = "w-full py-3.5 bg-[#222b3a] text-gray-400 font-bold text-sm rounded-xl cursor-not-allowed";
      btn.innerText = 'Spinning...';

      executeSpin(betVal, () => {
        isSpinning = false;
        btn.disabled = false;
        btn.className = "w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2";
        btn.innerText = 'Bet';
      });
    }

    function executeSpin(betVal, callback) {
      isSpinning = true;

      if (betVal > 0) {
        balance -= betVal;
        updateBalanceUI();
      }

      const winningIndex = Math.floor(Math.random() * wheelSegments.length);
      const winningSegment = wheelSegments[winningIndex];
      const count = wheelSegments.length;
      const arcRad = (2 * Math.PI) / count;

      const targetAngle =
        (2 * Math.PI * 5) +
        ((count - winningIndex) * arcRad - arcRad / 2) -
        (Math.PI / 2);

      let startTime = null;
      const duration = 2500;

      function animateSpin(timestamp) {
        if (!startTime) startTime = timestamp;

        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const easeProgress = 1 - Math.pow(1 - progress, 2);
        const currentAngle = targetAngle * easeProgress;

        drawWheel(currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          finishSpin(winningSegment, betVal, callback);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    async function finishSpin(winningSegment, betVal, callback) {
      const multiplier = winningSegment.multiplier;
      const winAmount = betVal > 0 ? betVal * multiplier : 0;
      const isWin = multiplier > 0;

      if (isWin && betVal > 0) {
        balance += winAmount;
        updateBalanceUI();
      }

      document.getElementById('centerMultiplierText').innerText =
        multiplier.toFixed(2) + '×';

      renderColorPayoutCards(winningSegment.color);

      if (
        currentUserId &&
        betVal > 0 &&
        typeof supabaseClient !== 'undefined'
      ) {
        const { error: betError } = await supabaseClient
          .from('bets')
          .insert([{
            user_id: currentUserId,
            target_number: segmentsCount,
            roll_result: multiplier,
            bet_amount: betVal,
            payout: winAmount,
            is_bool: isWin
          }]);

        if (betError) {
          console.error('Bet record save error:', betError);
        }

        const { error: balanceError } = await supabaseClient
          .from('profiles')
          .update({ balance })
          .eq('id', currentUserId);

        if (balanceError) {
          console.error('Balance update error:', balanceError);
        }
      }

      if (typeof callback === 'function') {
        callback();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initWheelGame();
    });
  </script>

</body>
