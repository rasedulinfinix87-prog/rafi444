<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbo Game</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Config -->
    <script src="../supabase-config.js"></script>
    <style>
        body {
            background-color: #1a2c38;
            color: #ffffff;
            font-family: sans-serif;
        }
        /* Hide scrollbar for history bar */
        #historyBar::-webkit-scrollbar {
            display: none;
        }
        #historyBar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-card {
            background: rgba(245, 207, 102, 0.06);
            border: 1px solid rgba(245, 207, 102, 0.25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            box-shadow: 0 0 18px rgba(255, 184, 0, 0.08);
        }

        .gold-button {
            background: linear-gradient(
                135deg,
                #FFDF85,
                #F5CF66,
                #D9A441
            );
            color: #080B10;
            border: 1px solid #FFDF85;
            box-shadow: 0 0 14px rgba(255, 184, 0, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- Top Bar Connection Container -->
    <div id="topBarContainer" class="w-full max-w-md sticky top-0 z-50 mb-3"></div>

    <!-- Game Container -->
    <div class="w-full max-w-md p-4 flex flex-col gap-4 relative">
        
        <!-- Recent Multipliers History Bar (Right to Left flow, Bold Text) -->
        <div id="historyBar" class="flex flex-row-reverse gap-2 overflow-x-auto py-1 text-xs justify-start scroll-smooth">
            <!-- Dynamic history items will appear here -->
        </div>

        <!-- Main Display Box -->
        <div class="glass-card rounded-xl h-56 flex flex-col items-center justify-center relative overflow-hidden shadow-inner">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <div id="resultMultiplier" class="text-5xl font-black tracking-wider z-10 text-white transition-all duration-150">1.00x</div>
        </div>

        <!-- Bet / Start Auto Button -->
        <button id="betBtn" onclick="handleMainButton()" class="w-full gold-button font-bold py-3.5 rounded-xl transition duration-200 text-lg shadow-lg">
            Bet
        </button>

        <!-- Controls Section -->
        <div class="glass-card p-4 rounded-xl flex flex-col gap-4">
            
            <!-- Amount Input -->
            <div>
                <label class="text-xs text-gray-300 block mb-1">Amount</label>
                <div id="amountBoxContainer" class="flex items-center bg-[#0f212e] rounded-lg border border-[#2f4553] px-3 py-2">
                    <span class="text-amber-400 font-bold mr-2">৳</span>
                    <input type="number" id="betAmount" value="1" step="0.01" oninput="validateAmount()" class="bg-transparent w-full focus:outline-none text-white font-semibold">
                    <div class="flex gap-1 ml-2">
                        <button onclick="halveAmount()" class="bg-[#213743] hover:bg-[#2f4553] px-2 py-1 text-[11px] rounded font-medium">1/2</button>
                        <button onclick="doubleAmount()" class="bg-[#213743] hover:bg-[#2f4553] px-2 py-1 text-[11px] rounded font-medium">2x</button>
                        <button onclick="maxAmount()" class="bg-[#213743] hover:bg-[#2f4553] px-2 py-1 text-[11px] rounded font-medium text-amber-400">Max</button>
                    </div>
                </div>
            </div>

            <!-- Auto Bet Extra Settings Panel (Appears only on Auto Tab) -->
            <div id="autoSettingsPanel" class="flex flex-col gap-3 hidden border-t border-amber-500/20 pt-3">
                <!-- On Win -->
                <div class="flex flex-col gap-1">
                    <span class="text-xs text-gray-300 font-medium">On Win</span>
                    <div class="flex gap-2 items-center">
                        <button id="winResetBtn" onclick="setWinMode('reset')" class="flex-1 py-1.5 bg-[#2f4553] text-white text-xs rounded-lg font-bold">Reset</button>
                        <button id="winIncBtn" onclick="setWinMode('increase')" class="flex-1 py-1.5 bg-[#0f212e] text-gray-400 text-xs rounded-lg font-medium">Increase by:</button>
                        <div class="flex items-center bg-[#0f212e] rounded-lg border border-[#2f4553] px-2 py-1 w-20">
                            <input type="number" id="winIncValue" value="0" class="bg-transparent w-full text-xs text-white focus:outline-none">
                            <span class="text-gray-400 text-xs ml-1">%</span>
                        </div>
                    </div>
                </div>

                <!-- On Loss -->
                <div class="flex flex-col gap-1">
                    <span class="text-xs text-gray-300 font-medium">On Loss</span>
                    <div class="flex gap-2 items-center">
                        <button id="lossResetBtn" onclick="setLossMode('reset')" class="flex-1 py-1.5 bg-[#2f4553] text-white text-xs rounded-lg font-bold">Reset</button>
                        <button id="lossIncBtn" onclick="setLossMode('increase')" class="flex-1 py-1.5 bg-[#0f212e] text-gray-400 text-xs rounded-lg font-medium">Increase by:</button>
                        <div class="flex items-center bg-[#0f212e] rounded-lg border border-[#2f4553] px-2 py-1 w-20">
                            <input type="number" id="lossIncValue" value="0" class="bg-transparent w-full text-xs text-white focus:outline-none">
                            <span class="text-gray-400 text-xs ml-1">%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Payout & Chance Input -->
            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="text-xs text-gray-300 block mb-1">Payout</label>
                    <div id="payoutBox" class="flex items-center bg-[#0f212e] rounded-lg border border-[#2f4553] px-3 py-2">
                        <input type="number" id="targetMultiplier" value="2.00" step="0.001" min="1.001" oninput="updateChance()" class="bg-transparent w-full focus:outline-none text-white font-semibold">
                        <span class="text-gray-400 ml-1">×</span>
                    </div>
                </div>
                <div class="w-1/3">
                    <label id="chanceLabel" class="text-xs text-gray-300 block mb-1 text-right">Chance 49.00%</label>
                    <div id="chanceBox" class="flex items-center justify-between bg-[#0f212e] rounded-lg border border-[#2f4553] px-3 py-2">
                        <span id="chanceDisplay" class="text-white font-semibold text-sm w-full text-center">49.00%</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Tabs (Manual / Auto) -->
        <div class="glass-card p-1 rounded-xl flex justify-around text-sm font-medium text-gray-300">
            <button id="manualTab" onclick="switchTab('manual')" class="py-2 px-10 rounded-lg gold-button shadow">Manual</button>
            <button id="autoTab" onclick="switchTab('auto')" class="py-2 px-10 rounded-lg hover:text-white">Auto</button>
        </div>

        <!-- Bottom Action Bar (Settings, Rating, Turn Off/On, Live Stats) -->
        <div class="flex items-center justify-between px-2 py-1 text-gray-400 text-sm">
            <!-- Setting Icon -->
            <button onclick="toggleSettingsModal()" class="hover:text-white p-2">
                <i class="fa-solid fa-gear"></i>
            </button>
            <!-- Rating -->
            <button class="flex items-center gap-1 hover:text-white p-2">
                <i class="fa-solid fa-star text-xs text-yellow-500"></i>
                <span class="text-xs">12543</span>
            </button>
            <!-- Turn Off/On Turbo Mode -->
            <button id="turboBtn" onclick="toggleTurbo()" class="hover:text-white p-2 flex items-center gap-1" title="Turbo Mode">
                <i id="turboIcon" class="fa-solid fa-bolt text-gray-400"></i>
                <span id="turboText" class="text-[10px] font-bold">OFF</span>
            </button>
            <!-- Live Stats -->
            <button onclick="toggleLiveStatsModal()" class="hover:text-white p-2">
                <i class="fa-solid fa-chart-simple"></i>
            </button>
        </div>

    </div>

    <!-- Settings Bottom Sheet Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end justify-center">
        <div class="bg-[#1a2c38] w-full max-w-md rounded-t-2xl p-4 flex flex-col gap-3 border-t border-amber-500/30 animate-slide-up">
            <div class="flex justify-between items-center pb-2 border-b border-[#2f4553]">
                <span class="font-bold text-white">Settings</span>
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#213743] rounded-lg text-left text-sm text-gray-300">
                <i class="fa-regular fa-circle-question w-5"></i> Help
            </button>
            <button onclick="toggleSoundEffect()" id="soundSettingBtn" class="flex items-center justify-between py-2.5 px-3 hover:bg-[#213743] rounded-lg text-sm text-amber-400">
                <span class="flex items-center gap-3"><i class="fa-solid fa-volume-high w-5"></i> Sound Effects</span>
                <span id="soundStatusText" class="text-xs font-bold">ON</span>
            </button>
            <button class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#213743] rounded-lg text-left text-sm text-gray-300">
                <i class="fa-solid fa-seedling w-5"></i> Seed
            </button>
            <button onclick="shareGame()" class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#213743] rounded-lg text-left text-sm text-gray-300">
                <i class="fa-solid fa-share-nodes w-5"></i> Share
            </button>
        </div>
    </div>

    <!-- Live Stats Modal -->
    <div id="liveStatsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-2xl p-4 flex flex-col gap-4 shadow-2xl bg-[#1a2c38]">
            <div class="flex justify-between items-center pb-2 border-b border-[#2f4553]">
                <span class="font-bold text-white text-base">Live Stats</span>
                <button onclick="toggleLiveStatsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="bg-[#0f212e] p-3 rounded-xl flex flex-col gap-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">Profit</span>
                    <span id="statsProfit" class="text-[#2fbf71] font-bold">৳ 0.00</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">Wagered</span>
                    <span id="statsWagered" class="text-white font-bold">৳ 0.00</span>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-[#213743] pt-2">
                    <span class="text-gray-400">WIN: <strong id="statsWin" class="text-white">0</strong></span>
                    <span class="text-gray-400">LOSE: <strong id="statsLose" class="text-white">0</strong></span>
                </div>
            </div>

            <!-- Live Stats Graph Box -->
            <div class="bg-[#0f212e] p-3 rounded-xl flex flex-col gap-2 h-36 relative overflow-hidden border border-[#2f4553]">
                <span class="text-[11px] text-gray-400">Profit/Loss Graph</span>
                <div class="flex-1 w-full flex items-end gap-1 overflow-x-auto pt-4" id="statsGraphContainer">
                    <div class="w-full text-center text-xs text-gray-500 self-center">No bets yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let userBalance = 0.00;
        let isTurboOn = false;
        let isSoundOn = true;
        let currentMode = 'manual';
        let isAutoRunning = false;
        let autoInterval = null;

        let winMode = 'reset';
        let lossMode = 'reset';
        let baseBetAmount = 1;

        let totalProfit = 0;
        let totalWagered = 0;
        let totalWins = 0;
        let totalLosses = 0;
        let profitHistory = [0];

        const horrorBgMusic = new Audio('https://freesound.org/data/previews/515/515843_6142149-lq.mp3');
        horrorBgMusic.loop = true;
        horrorBgMusic.volume = 0.4;

        const winSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        const loseSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3');

        function playSound(isWin) {
            if (!isSoundOn) return;
            if (isWin) {
                winSound.currentTime = 0;
                winSound.play().catch(e => console.log(e));
            } else {
                loseSound.currentTime = 0;
                loseSound.play().catch(e => console.log(e));
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            const manualTab = document.getElementById('manualTab');
            const autoTab = document.getElementById('autoTab');
            const autoSettings = document.getElementById('autoSettingsPanel');
            const betBtn = document.getElementById('betBtn');

            if (mode === 'manual') {
                if (isAutoRunning) stopAutoBet();
                manualTab.className = "py-2 px-10 rounded-lg gold-button shadow";
                autoTab.className = "py-2 px-10 rounded-lg hover:text-white";
                autoSettings.classList.add('hidden');
                betBtn.innerText = "Bet";
                betBtn.className = "w-full gold-button font-bold py-3.5 rounded-xl transition duration-200 text-lg shadow-lg";
            } else {
                manualTab.className = "py-2 px-10 rounded-lg hover:text-white";
                autoTab.className = "py-2 px-10 rounded-lg gold-button shadow";
                autoSettings.classList.remove('hidden');
                betBtn.innerText = "Start Auto";
                betBtn.className = "w-full gold-button font-bold py-3.5 rounded-xl transition duration-200 text-lg shadow-lg";
            }
        }

        function setWinMode(mode) {
            winMode = mode;
            const resetBtn = document.getElementById('winResetBtn');
            const incBtn = document.getElementById('winIncBtn');
            if (mode === 'reset') {
                resetBtn.className = "flex-1 py-1.5 bg-[#2f4553] text-white text-xs rounded-lg font-bold";
                incBtn.className = "flex-1 py-1.5 bg-[#0f212e] text-gray-400 text-xs rounded-lg font-medium";
            } else {
                resetBtn.className = "flex-1 py-1.5 bg-[#0f212e] text-gray-400 text-xs rounded-lg font-medium";
                incBtn.className = "flex-1 py-1.5 bg-[#2f4553] text-white text-xs rounded-lg font-bold";
            }
        }

        function setLossMode(mode) {
            lossMode = mode;
            const resetBtn = document.getElementById('lossResetBtn');
            const incBtn = document.getElementById('lossIncBtn');
            if (mode === 'reset') {
                resetBtn.className = "flex-1 py-1.5 bg-[#2f4553] text-white text-xs rounded-lg font-bold";
                incBtn.className = "flex-1 py-1.5 bg-[#0f212e] text-gray-400 text-xs rounded-lg font-medium";
            } else {
                resetBtn.className = "flex-1 py-1.5 bg-[#0f212e] text-gray-400 text-xs rounded-lg font-medium";
                incBtn.className = "flex-1 py-1.5 bg-[#2f4553] text-white text-xs rounded-lg font-bold";
            }
        }

        function validateAmount() {
            let input = document.getElementById('betAmount');
            let box = document.getElementById('amountBoxContainer');
            let val = parseFloat(input.value) || 0;

            if (val < 0.59) {
                box.className = "flex items-center bg-[#0f212e] rounded-lg border border-red-500 px-3 py-2";
                input.className = "bg-transparent w-full focus:outline-none text-red-500 font-semibold";
                return false;
            } else {
                box.className = "flex items-center bg-[#0f212e] rounded-lg border border-[#2f4553] px-3 py-2";
                input.className = "bg-transparent w-full focus:outline-none text-white font-semibold";
                return true;
            }
        }

        function toggleTurbo() {
            isTurboOn = !isTurboOn;
            const icon = document.getElementById('turboIcon');
            const txt = document.getElementById('turboText');
            if (isTurboOn) {
                icon.className = "fa-solid fa-bolt text-amber-400";
                txt.innerText = "ON";
                txt.className = "text-[10px] font-bold text-amber-400";
            } else {
                icon.className = "fa-solid fa-bolt text-gray-400";
                txt.innerText = "OFF";
                txt.className = "text-[10px] font-bold text-gray-400";
            }
        }

        function toggleSoundEffect() {
            isSoundOn = !isSoundOn;
            const btn = document.getElementById('soundSettingBtn');
            const txt = document.getElementById('soundStatusText');
            if (isSoundOn) {
                btn.className = "flex items-center justify-between py-2.5 px-3 hover:bg-[#213743] rounded-lg text-sm text-amber-400";
                txt.innerText = "ON";
                horrorBgMusic.play().catch(e => console.log(e));
            } else {
                btn.className = "flex items-center justify-between py-2.5 px-3 hover:bg-[#213743] rounded-lg text-sm text-gray-400";
                txt.innerText = "OFF";
                horrorBgMusic.pause();
            }
        }

        async function shareGame() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Limbo Game',
                        text: 'Play this amazing Limbo game!',
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Share error:', err);
                }
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('লিংক কপি করা হয়েছে!');
            }
        }

        function getClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof supabase !== 'undefined') return supabase;
            if (window.supabaseClient) return window.supabaseClient;
            if (window.supabase) return window.supabase;
            return null;
        }

        async function loadTopBar() {
            try {
                const res = await fetch('../bar/top.html');
                if (res.ok) {
                    document.getElementById('topBarContainer').innerHTML = await res.text();
                    document.querySelectorAll('a[href*="deposit"]').forEach(a => a.href = '../account/deposit.html');
                    document.querySelectorAll('a[href*="member"]').forEach(a => {
                        if (a.href.includes('admin/mem/member.html')) {
                            a.href = a.href.replace('admin/mem/member.html', 'mem/member.html');
                        }
                    });
                }
            } catch (e) {
                console.error("Top bar fetch error:", e);
            }
        }

        function updateUIBalance(bal) {
            const topBal = document.getElementById('topBarBalance');
            if (topBal) topBal.innerText = parseFloat(bal).toFixed(2);
        }

        async function init() {
            await loadTopBar();
            const client = getClient();

            try {
                let user = null;
                if (typeof requireAuth === 'function') user = await requireAuth();
                else if (typeof getCurrentUser === 'function') user = await getCurrentUser();
                else if (client) {
                    const { data } = await client.auth.getUser();
                    user = data?.user;
                }

                if (user && client) {
                    currentUserId = user.id;

                    const { data: profile } = await client
                        .from('profiles')
                        .select('balance')
                        .eq('id', user.id)
                        .single();

                    if (profile) {
                        userBalance = parseFloat(profile.balance) || 0;
                        updateUIBalance(userBalance);
                    }

                    client
                        .channel('limbo-balance-channel')
                        .on('postgres_changes', {
                            event: 'UPDATE',
                            schema: 'public',
                            table: 'profiles',
                            filter: `id=eq.${user.id}`
                        }, (payload) => {
                            if (payload.new && payload.new.balance !== undefined) {
                                userBalance = parseFloat(payload.new.balance) || 0;
                                updateUIBalance(userBalance);
                            }
                        })
                        .subscribe();
                }
            } catch (err) {
                console.error("Init Error:", err);
            }

            document.addEventListener('click', () => {
                if (isSoundOn && horrorBgMusic.paused) {
                    horrorBgMusic.play().catch(e => console.log(e));
                }
            }, { once: true });

            updateChance();
            validateAmount();
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        function toggleLiveStatsModal() {
            const modal = document.getElementById('liveStatsModal');
            modal.classList.toggle('hidden');
        }

        function updateChance() {
            let targetInput = document.getElementById('targetMultiplier');
            let payoutBox = document.getElementById('payoutBox');
            let chanceBox = document.getElementById('chanceBox');
            let chanceDisplay = document.getElementById('chanceDisplay');

            let target = parseFloat(targetInput.value) || 1.001;
            let chance = (99 / target);

            if (target < 1.001 || chance > 98.02) {
                payoutBox.className = "flex items-center bg-[#0f212e] rounded-lg border border-red-500 px-3 py-2";
                chanceBox.className = "flex items-center justify-between bg-[#0f212e] rounded-lg border border-red-500 px-3 py-2";
                chanceDisplay.className = "text-red-500 font-semibold text-sm w-full text-center";
                chanceDisplay.innerText = chance.toFixed(2) + '%';
            } else {
                payoutBox.className = "flex items-center bg-[#0f212e] rounded-lg border border-[#2f4553] px-3 py-2";
                chanceBox.className = "flex items-center justify-between bg-[#0f212e] rounded-lg border border-[#2f4553] px-3 py-2";
                chanceDisplay.className = "text-white font-semibold text-sm w-full text-center";
                chanceDisplay.innerText = chance.toFixed(2) + '%';
            }
        }

        function halveAmount() {
            let input = document.getElementById('betAmount');
            let val = parseFloat(input.value) || 0.59;
            input.value = Math.max(0.59, val / 2).toFixed(2);
            validateAmount();
        }

        function doubleAmount() {
            let input = document.getElementById('betAmount');
            let val = parseFloat(input.value) || 0.59;
            input.value = (val * 2).toFixed(2);
            validateAmount();
        }

        function maxAmount() {
            let input = document.getElementById('betAmount');
            input.value = Math.max(0.59, userBalance).toFixed(2);
            validateAmount();
        }

        function updateGraph() {
            const container = document.getElementById('statsGraphContainer');
            container.innerHTML = '';
            
            if (profitHistory.length <= 1) {
                container.innerHTML = '<div class="w-full text-center text-xs text-gray-500 self-center">No bets yet</div>';
                return;
            }

            const maxVal = Math.max(...profitHistory.map(Math.abs), 1);

            profitHistory.forEach((val, idx) => {
                if (idx === 0) return;
                const bar = document.createElement('div');
                const isProfit = val >= 0;
                const heightPercent = Math.min(Math.max((Math.abs(val) / maxVal) * 45, 10), 100);
                
                bar.className = `w-3 rounded-sm transition-all ${isProfit ? 'bg-[#2fbf71]' : 'bg-[#eb4e3d]'}`;
                bar.style.height = heightPercent + '%';
                bar.title = `Profit: ৳${val.toFixed(2)}`;
                container.appendChild(bar);
            });
            container.scrollLeft = container.scrollWidth;
        }

        function handleMainButton() {
            if (!validateAmount()) {
                alert('অ্যামাউন্ট ০.৫৯ এর কম হতে পারবে না!');
                return;
            }
            if (currentMode === 'manual') {
                playLimbo();
            } else {
                if (!isAutoRunning) {
                    startAutoBet();
                } else {
                    stopAutoBet();
                }
            }
        }

        function startAutoBet() {
            const betInput = document.getElementById('betAmount');
            let betAmount = parseFloat(betInput.value) || 0;
            const targetMultiplier = parseFloat(document.getElementById('targetMultiplier').value) || 1.001;
            let chance = (99 / targetMultiplier);

            if (betAmount < 0.59 || targetMultiplier < 1.001 || chance > 98.02) {
                alert('সঠিক অ্যামাউন্ট বা পেআউট সীমা নির্ধারণ করুন!');
                return;
            }

            isAutoRunning = true;
            baseBetAmount = betAmount;
            const betBtn = document.getElementById('betBtn');
            betBtn.innerText = "Stop Auto";
            betBtn.className = "w-full bg-[#eb4e3d] hover:bg-[#d93639] text-white font-bold py-3.5 rounded-xl transition duration-200 text-lg shadow-lg";

            autoInterval = setInterval(async () => {
                let currentBet = parseFloat(betInput.value) || 0;
                if (userBalance < currentBet) {
                    stopAutoBet();
                    alert('অপর্যাপ্ত ব্যালেন্স!');
                    return;
                }

                let isWin = await executeRound(currentBet, targetMultiplier);

                if (isWin) {
                    if (winMode === 'reset') {
                        betInput.value = baseBetAmount.toFixed(2);
                    } else {
                        let incPct = parseFloat(document.getElementById('winIncValue').value) || 0;
                        let newAmt = currentBet + (currentBet * incPct / 100);
                        betInput.value = newAmt.toFixed(2);
                    }
                } else {
                    if (lossMode === 'reset') {
                        betInput.value = baseBetAmount.toFixed(2);
                    } else {
                        let incPct = parseFloat(document.getElementById('lossIncValue').value) || 0;
                        let newAmt = currentBet + (currentBet * incPct / 100);
                        betInput.value = newAmt.toFixed(2);
                    }
                }
                validateAmount();
            }, 600);
        }

        function stopAutoBet() {
            isAutoRunning = false;
            clearInterval(autoInterval);
            const betBtn = document.getElementById('betBtn');
            betBtn.innerText = "Start Auto";
            betBtn.className = "w-full gold-button font-bold py-3.5 rounded-xl transition duration-200 text-lg shadow-lg";
        }

        async function playLimbo() {
            const betAmount = parseFloat(document.getElementById('betAmount').value) || 0;
            const targetMultiplier = parseFloat(document.getElementById('targetMultiplier').value) || 1.001;
            let chance = (99 / targetMultiplier);

            if (betAmount < 0.59) {
                alert('অ্যামাউন্ট ০.৫৯ এর কম হতে পারবে না!');
                return;
            }

            if (targetMultiplier < 1.001 || chance > 98.02) {
                alert('সঠিক পেআউট বা চান্স সীমা নির্ধারণ করুন!');
                return;
            }

            await executeRound(betAmount, targetMultiplier);
        }

        async function executeRound(betAmount, targetMultiplier) {
            const resultDisplay = document.getElementById('resultMultiplier');
            const client = getClient();

            if (userBalance < betAmount) {
                return false;
            }

            if (client && currentUserId) {
                userBalance -= betAmount;
                updateUIBalance(userBalance);
                await client.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);
            }

            let randomRoll = parseFloat((99 / (Math.random() * 98 + 1)).toFixed(2));
            if (randomRoll < 1.00) randomRoll = 1.00;

            if (!isTurboOn) {
                resultDisplay.innerText = "1.00x";
                let counter = 1.00;
                let stepInterval = setInterval(() => {
                    counter += 0.15;
                    if (counter >= randomRoll) {
                        counter = randomRoll;
                        clearInterval(stepInterval);
                    }
                    resultDisplay.innerText = counter.toFixed(2) + 'x';
                }, 30);
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            resultDisplay.innerText = randomRoll.toFixed(2) + 'x';

            let isWin = randomRoll >= targetMultiplier;
            let payoutAmount = isWin ? betAmount * targetMultiplier : 0;

            playSound(isWin);

            totalWagered += betAmount;
            if (isWin) {
                totalWins++;
                totalProfit += (payoutAmount - betAmount);
            } else {
                totalLosses++;
                totalProfit -= betAmount;
            }
            profitHistory.push(totalProfit);

            document.getElementById('statsProfit').innerText = '৳ ' + totalProfit.toFixed(2);
            document.getElementById('statsWagered').innerText = '৳ ' + totalWagered.toFixed(2);
            document.getElementById('statsWin').innerText = totalWins;
            document.getElementById('statsLose').innerText = totalLosses;

            updateGraph();

            const historyBar = document.getElementById('historyBar');
            const historySpan = document.createElement('span');
            historySpan.className = `px-3 py-1 bg-[#213743] rounded-md font-bold shrink-0 ${isWin ? 'text-[#2fbf71]' : 'text-[#eb4e3d]'}`;
            historySpan.innerText = randomRoll.toFixed(2) + 'x';
            historyBar.prepend(historySpan);
            if (historyBar.children.length > 10) {
                historyBar.lastChild.remove();
            }

            if (isWin) {
                resultDisplay.className = "text-5xl font-black tracking-wider z-10 text-[#2fbf71]";
                userBalance += payoutAmount;
                updateUIBalance(userBalance);
            } else {
                resultDisplay.className = "text-5xl font-black tracking-wider z-10 text-[#eb4e3d]";
            }

            if (client && currentUserId) {
                try {
                    await client.from('bets').insert([
                        {
                            user_id: currentUserId,
                            target_number: targetMultiplier,
                            roll_result: randomRoll,
                            bet_amount: betAmount,
                            payout: payoutAmount,
                            is_bool: isWin
                        }
                    ]);

                    await client
                        .from('profiles')
                        .update({ balance: userBalance })
                        .eq('id', currentUserId);

                } catch (err) {
                    console.error('Database error:', err);
                }
            }

            return isWin;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
