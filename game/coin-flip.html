<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Game Style Coin Flip</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #0f141c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f141c;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }

    #topBarContainer {
      position: sticky;
      top: 0;
      z-index: 500;
      width: 100%;
      flex-shrink: 0;
    }

    #bottomBarContainer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 5000;
      isolation: isolate;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .game-page {
      width: 100%;
      max-width: 672px;
      margin: 5px auto 0;
      padding: 0 8px 100px;
    }

    .main-wrapper {
      background: #171d28;
      border: 1px solid #222b3a;
      border-radius: 14px;
      overflow: hidden;
    }

    .divider {
      height: 1px;
      background: #222b3a;
      width: 100%;
    }

    .input-box {
      background: #0f141c;
      border: 1px solid #222b3a;
      border-radius: 10px;
    }

    .input-box:focus-within {
      border-color: #24ee89;
    }

    .green-btn {
      background: #24ee89;
      color: #0f141c;
      font-weight: 800;
    }

    .green-btn:hover { background: #1ed67a; }

    .red-btn {
      background: #ed4245;
      color: #fff;
      font-weight: 800;
    }

    .red-btn:hover { background: #d3383b; }

    .green-btn:disabled,
    .red-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .game-screen {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 270px;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, #202a32 0%, #171d28 65%);
    }

    .game-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 25%, rgba(255,255,255,.09) 1px, transparent 2px),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.08) 1px, transparent 2px),
        radial-gradient(circle at 20% 80%, rgba(255,255,255,.06) 1px, transparent 2px);
    }

    .game-stage {
      position: absolute;
      left: 2px;
      right: 2px;
      top: 51px;
      bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .coin-container {
      perspective: 1000px;
      width: 98px;
      height: 98px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 15px rgba(0,0,0,.45),
        inset 0 0 10px rgba(255,255,255,.3);
      border: 3px solid #f59e0b;
    }

    .coin-heads {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .coin-tails {
      background: linear-gradient(135deg, #94a3b8, #64748b);
      border-color: #cbd5e1;
      transform: rotateY(180deg);
    }

    @keyframes flipHeads {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(1800deg); }
    }

    @keyframes flipTails {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(1980deg); }
    }

    .flipping-heads {
      animation: flipHeads .8s forwards;
    }

    .flipping-tails {
      animation: flipTails .8s forwards;
    }

    .game-status {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 10;
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 600;
      color: #a7b2bf;
    }

    .history-bar-wrapper {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
    }

    .history-bar::-webkit-scrollbar { display: none; }

    .history-btn-icon {
      background: #222b3a;
      border: 1px solid #2a3548;
      color: #cbd5e1;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .history-btn-icon:hover {
      background: #2c3748;
      color: #fff;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 6000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #171d28;
      border: 1px solid #222b3a;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    ::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }

    ::-webkit-scrollbar-track { background: #0f141c; }

    ::-webkit-scrollbar-thumb {
      background: #222b3a;
      border-radius: 2px;
    }
  </style>
</head>

<body class="bg-[#0f141c] text-white font-sans min-h-screen flex flex-col items-center p-0 select-none">

  <div id="topBarContainer" class="w-full max-w-2xl sticky top-0 z-50"></div>

  <div class="game-page">
    <main class="flex flex-col gap-3">
      <div class="main-wrapper flex flex-col shadow-xl">
        <div class="game-screen">
          <div class="history-bar-wrapper">
            <div id="historyBar" class="history-bar"></div>
            <button type="button" onclick="openHistoryModal()" class="history-btn-icon" title="View Full History">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
          </div>

          <div class="game-stage">
            <div id="seriesCard" class="stat-card" style="display:none !important;">
              <div id="seriesValue" class="stat-value">0</div>
              <div class="stat-label">Series</div>
            </div>

            <div class="coin-container">
              <div id="coinElement" class="coin">
                <div class="coin-face coin-heads">
                  <div class="w-14 h-14 rounded-full bg-red-600 flex items-center justify-center border-2 border-yellow-300 shadow-inner overflow-hidden">
                    <i class="fa-solid fa-dragon text-2xl text-yellow-300"></i>
                  </div>
                </div>

                <div class="coin-face coin-tails">
                  <div class="w-14 h-14 rounded-full bg-slate-700 flex items-center justify-center border-2 border-slate-300 shadow-inner overflow-hidden">
                    <i class="fa-solid fa-coins text-2xl text-slate-300"></i>
                  </div>
                </div>
              </div>
            </div>

            <div id="multiplyCard" class="stat-card" style="display:none !important;">
              <div id="multiplyValue" class="stat-value">×0.00</div>
              <div class="stat-label">Multiply</div>
            </div>
          </div>

          <div id="gameStatusText" class="game-status">
            Pick a side and place your bet!
          </div>
        </div>

        <div class="divider"></div>

        <div class="p-4 flex flex-col gap-3.5 bg-[#171d28]">
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectChoice('heads')" id="btnHeads"
              class="py-3 rounded-xl bg-[#222b3a] border-2 border-[#24ee89] text-white text-xs font-bold flex items-center justify-center gap-2 transition">
              <div class="w-5 h-5 rounded-full bg-amber-500 flex items-center justify-center text-[10px]">
                <i class="fa-solid fa-dragon"></i>
              </div>
              <span>Heads</span>
            </button>

            <button type="button" onclick="selectChoice('tails')" id="btnTails"
              class="py-3 rounded-xl bg-[#0f141c] border border-[#222b3a] text-gray-400 text-xs font-bold flex items-center justify-center gap-2 transition">
              <div class="w-5 h-5 rounded-full bg-slate-500 flex items-center justify-center text-[10px]">
                <i class="fa-solid fa-coins"></i>
              </div>
              <span>Tails</span>
            </button>
          </div>

          <div class="flex flex-col gap-1" id="betAmountContainer">
            <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
              <span>Amount (৳)</span>
              <span class="text-gray-400 text-[10px]">Min: 1 ৳</span>
            </div>

            <div class="flex items-center input-box p-1">
              <div class="flex items-center px-2 text-gray-400 font-bold text-sm">৳</div>

              <input type="number" id="betAmount" value="1.00" min="0" step="0.01"
                inputmode="decimal" oninput="validateBetInputStyle(this)"
                class="w-full min-w-0 bg-transparent text-sm font-bold text-white focus:outline-none px-1">

              <div class="flex items-center gap-1">
                <button type="button" onclick="modifyBet('half')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">1/2</button>
                <button type="button" onclick="modifyBet('double')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">2x</button>
                <button type="button" onclick="modifyBet('max')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-[#F5CF66] transition">Max</button>
              </div>
            </div>
          </div>

          <button type="button" id="btnAction" onclick="handleMainAction()"
            class="w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2">
            Bet
          </button>
        </div>

        <div class="divider"></div>

        <div class="flex items-center justify-between px-4 py-2.5 text-gray-400 text-sm bg-[#171d28]">
          <button onclick="toggleSettingsModal()" class="hover:text-[#24ee89] p-1.5" title="Settings">
            <i class="fa-solid fa-gear"></i>
          </button>

          <button onclick="handleRatingClick()" class="flex items-center gap-1.5 hover:text-[#24ee89] p-1.5 cursor-pointer" title="Rating">
            <i class="fa-solid fa-star text-xs text-[#24ee89]"></i>
            <span id="ratingDisplayCount" class="text-xs font-semibold">2635</span>
          </button>

          <button id="turboBtn" onclick="toggleTurbo()" class="hover:text-[#24ee89] p-1.5 flex items-center gap-1" title="Turbo Mode">
            <i id="turboIcon" class="fa-solid fa-bolt text-gray-400"></i>
            <span id="turboText" class="text-[10px] font-bold">OFF</span>
          </button>

          <button onclick="toggleLiveStatsModal()" class="hover:text-[#24ee89] p-1.5" title="Live Stats">
            <i class="fa-solid fa-chart-simple"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="settingsModal" class="fixed inset-0 bg-black/60 z-[6000] hidden flex items-end justify-center backdrop-blur-sm">
    <div class="main-wrapper w-full max-w-md rounded-t-2xl p-4 flex flex-col gap-3 bg-[#171d28] border-t border-[#222b3a]">
      <div class="flex justify-between items-center pb-2 border-b border-[#222b3a]">
        <span class="font-bold text-white">Settings</span>
        <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <button onclick="goToHelpPage()" class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-left text-sm text-gray-300">
        <i class="fa-regular fa-circle-question w-5 text-[#24ee89]"></i> Help
      </button>

      <button onclick="toggleSoundEffect()" id="soundSettingBtn" class="flex items-center justify-between py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-sm text-[#24ee89]">
        <span class="flex items-center gap-3"><i class="fa-solid fa-volume-high w-5"></i> Sound Effects</span>
        <span id="soundStatusText" class="text-xs font-bold">ON</span>
      </button>

      <button class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-left text-sm text-gray-300">
        <i class="fa-solid fa-seedling w-5 text-[#24ee89]"></i> Seed
      </button>

      <button onclick="shareGame()" class="flex items-center gap-3 py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-left text-sm text-gray-300">
        <i class="fa-solid fa-share-nodes w-5 text-[#24ee89]"></i> Share
      </button>
    </div>
  </div>

  <div id="liveStatsModal" class="fixed inset-0 bg-black/60 z-[6000] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="main-wrapper w-full max-w-sm rounded-2xl p-4 flex flex-col gap-3 shadow-2xl bg-[#171d28] border border-[#222b3a]">
      <div class="flex justify-between items-center pb-2">
        <span class="font-bold text-white text-base">Bet</span>
        <div class="flex items-center gap-2">
          <button onclick="resetLiveStats()" class="text-gray-400 hover:text-white text-sm" title="Reset Stats">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <button onclick="toggleLiveStatsModal()" class="text-gray-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>

      <div class="bg-[#111620] border border-[#222b3a] rounded-xl p-3 grid grid-cols-2 gap-4 relative">
        <div class="flex flex-col gap-1">
          <span class="text-xs text-gray-400 font-medium">Profit</span>
          <div class="flex items-center gap-1.5 text-sm font-extrabold text-[#24ee89]">
            <span class="w-4 h-4 rounded-full bg-[#24ee89] text-[#0f141c] flex items-center justify-center text-[9px] font-black">৳</span>
            <span id="statsProfit">BDT 0.00</span>
          </div>
        </div>

        <div class="flex flex-col gap-1 pl-3 border-l border-[#222b3a]">
          <span class="text-xs text-gray-400 font-medium">WIN</span>
          <span id="statsWin" class="text-sm font-extrabold text-[#24ee89]">0</span>
        </div>

        <div class="flex flex-col gap-1 pt-2 border-t border-[#222b3a]/50">
          <span class="text-xs text-gray-400 font-medium">Wagered</span>
          <div class="flex items-center gap-1.5 text-sm font-extrabold text-white">
            <span class="w-4 h-4 rounded-full bg-[#24ee89] text-[#0f141c] flex items-center justify-center text-[9px] font-black">৳</span>
            <span id="statsWagered">BDT 0.00</span>
          </div>
        </div>

        <div class="flex flex-col gap-1 pt-2 border-t border-[#222b3a]/50 pl-3 border-l border-[#222b3a]">
          <span class="text-xs text-gray-400 font-medium">LOSE</span>
          <span id="statsLose" class="text-sm font-extrabold text-[#ed4245]">0</span>
        </div>
      </div>

      <div class="bg-[#111620] border border-[#222b3a] rounded-xl h-44 relative overflow-hidden flex items-end">
        <svg id="statsAreaChart" class="w-full h-full" viewBox="0 0 320 140" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>

  <div id="historyModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="flex items-center justify-between p-4 border-b border-[#222b3a]">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-[#24ee89]"></i> Full History List
        </h3>
        <button type="button" onclick="closeHistoryModal()" class="text-gray-400 hover:text-white px-2 py-1 text-sm font-bold">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 space-y-3" id="modalHistoryList"></div>

      <div class="p-3 border-t border-[#222b3a] flex justify-center bg-[#0f141c]">
        <button type="button" id="historyToggleBtn" onclick="toggleHistoryLimit()" class="px-4 py-1.5 rounded-lg bg-[#222b3a] hover:bg-[#2c3748] text-xs font-bold text-gray-300 transition">
          More
        </button>
      </div>
    </div>
  </div>

  <!-- ডাইনামিক বটম বার কন্টেইনার -->
  <div id="bottomBarContainer"></div>

  <script>
    let currentUserId = null;
    let balance = 0;
    let profileChannel = null;

    let selectedChoice = 'heads';
    let gameState = 'ready';

    let isFlipping = false;
    let isProcessingAction = false;

    let activeBetAmount = 0;
    let currentMultiplier = 1.00;
    let currentSeries = 0;

    let previousResults = loadSavedHistory();
    let roundToken = 0;
    let showAllHistoryModal = false;

    let isTurboOn = false;
    let isSoundOn = true;
    let totalWagered = 0;
    let totalWins = 0;
    let totalLosses = 0;
    let totalProfit = 0;
    let profitHistory = [0];

    function playClockBellSound() {
      if (!isSoundOn) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {
        console.log('Audio error:', e);
      }
    }

    function initRatingSystem() {
      let savedRatingData = null;

      try {
        savedRatingData = JSON.parse(localStorage.getItem('game_rating_system'));
      } catch (e) {
        savedRatingData = null;
      }

      const now = Date.now();
      const interval12Hours = 12 * 60 * 60 * 1000;

      let ratingVal = 2635;
      let lastTime = now;

      if (savedRatingData) {
        ratingVal = savedRatingData.count || 2635;
        lastTime = savedRatingData.timestamp || now;

        const timePassed = now - lastTime;
        if (timePassed >= interval12Hours) {
          const increments = Math.floor(timePassed / interval12Hours);
          ratingVal += increments * 4;
          lastTime = now - (timePassed % interval12Hours);
        }
      }

      localStorage.setItem('game_rating_system', JSON.stringify({
        count: ratingVal,
        timestamp: lastTime,
        hasRated: savedRatingData ? savedRatingData.hasRated : false
      }));

      const displayElem = document.getElementById('ratingDisplayCount');
      if (displayElem) displayElem.innerText = ratingVal;
    }

    function handleRatingClick() {
      let savedRatingData;

      try {
        savedRatingData = JSON.parse(localStorage.getItem('game_rating_system'));
      } catch (e) {
        savedRatingData = null;
      }

      savedRatingData = savedRatingData || {
        count: 2635,
        timestamp: Date.now(),
        hasRated: false
      };

      if (savedRatingData.hasRated) return;

      savedRatingData.count += 1;
      savedRatingData.hasRated = true;
      localStorage.setItem('game_rating_system', JSON.stringify(savedRatingData));

      const displayElem = document.getElementById('ratingDisplayCount');
      if (displayElem) displayElem.innerText = savedRatingData.count;
      playClockBellSound();
    }

    function goToHelpPage() {
      window.location.href = 'helf-desk.html';
    }

    function toggleTurbo() {
      isTurboOn = !isTurboOn;
      const icon = document.getElementById('turboIcon');
      const txt = document.getElementById('turboText');

      if (isTurboOn) {
        icon.className = "fa-solid fa-bolt text-[#24ee89]";
        txt.innerText = "ON";
        txt.className = "text-[10px] font-bold text-[#24ee89]";
      } else {
        icon.className = "fa-solid fa-bolt text-gray-400";
        txt.innerText = "OFF";
        txt.className = "text-[10px] font-bold text-gray-400";
      }
    }

    function toggleSoundEffect() {
      isSoundOn = !isSoundOn;
      const btn = document.getElementById('soundSettingBtn');
      const txt = document.getElementById('soundStatusText');

      if (isSoundOn) {
        btn.className = "flex items-center justify-between py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-sm text-[#24ee89]";
        txt.innerText = "ON";
      } else {
        btn.className = "flex items-center justify-between py-2.5 px-3 hover:bg-[#222b3a] rounded-lg text-sm text-gray-400";
        txt.innerText = "OFF";
      }
    }

    async function shareGame() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Coin Flip Game',
            text: 'Play this amazing Coin Flip game!',
            url: window.location.href
          });
        } catch (err) {
          console.log('Share error:', err);
        }
      } else {
        try {
          await navigator.clipboard.writeText(window.location.href);
          alert('লিংক কপি করা হয়েছে!');
        } catch (err) {
          console.log('Copy error:', err);
        }
      }
    }

    function toggleSettingsModal() {
      document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function toggleLiveStatsModal() {
      document.getElementById('liveStatsModal').classList.toggle('hidden');
    }

    function resetLiveStats() {
      totalWagered = 0;
      totalWins = 0;
      totalLosses = 0;
      totalProfit = 0;
      profitHistory = [0];
      updateLiveStatsUI(0, 0, true);
      document.getElementById('statsWin').innerText = '0';
      document.getElementById('statsLose').innerText = '0';
      document.getElementById('statsProfit').innerText = 'BDT 0.00';
      document.getElementById('statsWagered').innerText = 'BDT 0.00';
      updateAreaChart();
    }

    function validateBetInputStyle(inputElem) {
      const val = Number(inputElem.value);
      const btnAction = document.getElementById('btnAction');

      if (val <= 0.99) {
        inputElem.style.color = '#ed4245';
        if (gameState === 'ready') {
          btnAction.disabled = true;
          btnAction.classList.add('opacity-65', 'cursor-not-allowed');
        }
      } else {
        inputElem.style.color = '#ffffff';
        if (gameState === 'ready') {
          btnAction.disabled = false;
          btnAction.classList.remove('opacity-65', 'cursor-not-allowed');
        }
      }
    }

    function updateAreaChart() {
      const svg = document.getElementById('statsAreaChart');
      if (!svg) return;
      svg.innerHTML = '';

      const width = 320;
      const height = 140;

      if (profitHistory.length <= 1) return;

      const minVal = Math.min(0, ...profitHistory);
      const maxVal = Math.max(...profitHistory, 1);
      const range = maxVal - minVal || 1;

      const points = profitHistory.map((val, idx) => {
        const x = (idx / (profitHistory.length - 1 || 1)) * width;
        const y = height - ((val - minVal) / range) * (height - 20) - 10;
        return { x, y };
      });

      const isOverallLoss = totalProfit < 0;
      const themeColor = isOverallLoss ? '#ed4245' : '#24ee89';
      const opacityVal = isOverallLoss ? '0.4' : '0.5';

      let pathD = `M 0 ${height} `;
      points.forEach(p => {
        pathD += `L ${p.x} ${p.y} `;
      });
      pathD += `L ${width} ${height} Z`;

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
      gradient.setAttribute('id', 'chartGradient');
      gradient.setAttribute('x1', '0%');
      gradient.setAttribute('y1', '0%');
      gradient.setAttribute('x2', '0%');
      gradient.setAttribute('y2', '100%');

      const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', themeColor);
      stop1.setAttribute('stop-opacity', opacityVal);

      const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stop2.setAttribute('offset', '100%');
      stop2.setAttribute('stop-color', themeColor);
      stop2.setAttribute('stop-opacity', '0.0');

      gradient.appendChild(stop1);
      gradient.appendChild(stop2);
      defs.appendChild(gradient);
      svg.appendChild(defs);

      const areaPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      areaPath.setAttribute('d', pathD);
      areaPath.setAttribute('fill', 'url(#chartGradient)');
      svg.appendChild(areaPath);

      let lineD = '';
      points.forEach((p, idx) => {
        lineD += (idx === 0 ? `M ${p.x} ${p.y} ` : `L ${p.x} ${p.y} `);
      });

      const linePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      linePath.setAttribute('d', lineD);
      linePath.setAttribute('fill', 'none');
      linePath.setAttribute('stroke', themeColor);
      linePath.setAttribute('stroke-width', '2');
      svg.appendChild(linePath);
    }

    function updateLiveStatsUI(profitChange, wagerChange, isWin) {
      totalWagered += wagerChange;
      totalProfit += profitChange;

      if (isWin && wagerChange > 0) {
        totalWins++;
      } else if (!isWin && wagerChange > 0) {
        totalLosses++;
      }

      profitHistory.push(totalProfit);

      const statsProfit = document.getElementById('statsProfit');
      const statsWagered = document.getElementById('statsWagered');
      const statsWin = document.getElementById('statsWin');
      const statsLose = document.getElementById('statsLose');

      if (statsProfit) statsProfit.innerText = 'BDT ' + totalProfit.toFixed(2);
      if (statsWagered) statsWagered.innerText = 'BDT ' + totalWagered.toFixed(2);
      if (statsWin) statsWin.innerText = totalWins;
      if (statsLose) statsLose.innerText = totalLosses;

      updateAreaChart();
    }

    function loadSavedHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem('coin_multiplier_history'));
        return Array.isArray(saved)
          ? saved.slice(-40)
          : ['1.96x', '0.00x', '3.84x', '1.96x', '0.00x'];
      } catch (e) {
        return ['1.96x', '0.00x', '3.84x', '1.96x', '0.00x'];
      }
    }

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function generateMaskedHash() {
      const chars = 'abcdef0123456789';
      let part1 = '';
      let part2 = '';

      for (let i = 0; i < 6; i++) {
        part1 += chars.charAt(Math.floor(Math.random() * chars.length));
        part2 += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      return `${part1}***${part2}`;
    }

    // টপ বার এবং বটম বার ডাইনামিক্যালি লোড করার ফাংশন
    async function loadBars() {
      try {
        const topRes = await fetch('../bar/top.html');
        if (topRes.ok) {
          let topContent = await topRes.text();
          topContent = topContent.replace(/game\/mem\/member\.html/g, 'mem/member.html');
          topContent = topContent.replace(/href="mem\/member\.html"/g, 'href="mem/member.html"');
          document.getElementById('topBarContainer').innerHTML = topContent;
          document.querySelectorAll('a[href*="deposit"]').forEach(a => {
            a.href = '../account/deposit.html';
          });
        }

        const botRes = await fetch('../bar/bottom.html');
        if (botRes.ok) {
          document.getElementById('bottomBarContainer').innerHTML = await botRes.text();
        }
      } catch (e) {
        console.error('Bar load error:', e);
      }
    }

    async function syncCoinFlipBalance() {
      if (typeof supabaseClient === 'undefined' || !supabaseClient) {
        updateBalanceUI();
        return;
      }

      let storedUser = null;
      try {
        const storedValue = localStorage.getItem('current_user');
        if (storedValue) {
          storedUser = JSON.parse(storedValue);
        }
      } catch (e) {}

      let userId = storedUser ? (storedUser.id || storedUser.user_id || storedUser.uid) : null;

      if (!userId && typeof getCurrentUser === 'function') {
        try {
          const authUser = await getCurrentUser();
          if (authUser) {
            userId = authUser.id || authUser.user_id || authUser.uid;
          }
        } catch (e) {}
      }

      if (!userId) {
        currentUserId = null;
        balance = 0;
        updateBalanceUI();
        return;
      }

      currentUserId = userId;

      try {
        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('id, balance')
          .eq('id', userId)
          .maybeSingle();

        if (error || !profile) {
          updateBalanceUI();
          return;
        }

        balance = Number(profile.balance) || 0;
        updateBalanceUI();

        if (profileChannel) {
          try {
            await supabaseClient.removeChannel(profileChannel);
          } catch (e) {}
        }

        profileChannel = supabaseClient
          .channel('coin-profile-channel-' + userId)
          .on(
            'postgres_changes',
            {
              event: 'UPDATE',
              schema: 'public',
              table: 'profiles',
              filter: `id=eq.${userId}`
            },
            payload => {
              if (payload.new && payload.new.balance !== undefined) {
                balance = Number(payload.new.balance) || 0;
                updateBalanceUI();
              }
            }
          )
          .subscribe();
      } catch (e) {
        updateBalanceUI();
      }
    }

    async function initCoinFlipGame() {
      await loadBars();
      initRatingSystem();

      renderHistoryBar();
      updateStatsUI();
      selectChoice('heads');
      updateAreaChart();

      const amountInput = document.getElementById('betAmount');
      if (amountInput) {
        validateBetInputStyle(amountInput);
      }

      await syncCoinFlipBalance();
    }

    function updateBalanceUI() {
      const topBal1 = document.getElementById('topBarBalance');
      const topBal2 = document.getElementById('userBalance');

      if (topBal1) topBal1.innerText = balance.toFixed(2);
      if (topBal2) topBal2.innerText = `৳ ${balance.toFixed(2)}`;
    }

    function updateStatsUI() {
      const seriesValue = document.getElementById('seriesValue');
      const multiplyValue = document.getElementById('multiplyValue');
      const seriesCard = document.getElementById('seriesCard');
      const multiplyCard = document.getElementById('multiplyCard');

      if (seriesValue) seriesValue.innerText = currentSeries;

      if (multiplyValue) {
        multiplyValue.innerText = currentSeries > 0
          ? '×' + currentMultiplier.toFixed(2)
          : '×0.00';
      }

      if (seriesCard) {
        seriesCard.classList.toggle('stat-active', currentSeries > 0);
      }

      if (multiplyCard) {
        multiplyCard.classList.toggle('stat-active', currentSeries > 0);
      }
    }

    function resetStats() {
      currentSeries = 0;
      currentMultiplier = 1.00;
      updateStatsUI();
    }

    function selectChoice(choice) {
      if (isFlipping || isProcessingAction) return;

      selectedChoice = choice;

      const btnHeads = document.getElementById('btnHeads');
      const btnTails = document.getElementById('btnTails');

      if (choice === 'heads') {
        btnHeads.className =
          'py-3 rounded-xl bg-[#222b3a] border-2 border-[#24ee89] text-white text-xs font-bold flex items-center justify-center gap-2 transition';
        btnTails.className =
          'py-3 rounded-xl bg-[#0f141c] border border-[#222b3a] text-gray-400 text-xs font-bold flex items-center justify-center gap-2 transition';
      } else {
        btnTails.className =
          'py-3 rounded-xl bg-[#222b3a] border-2 border-[#24ee89] text-white text-xs font-bold flex items-center justify-center gap-2 transition';
        btnHeads.className =
          'py-3 rounded-xl bg-[#0f141c] border border-[#222b3a] text-gray-400 text-xs font-bold flex items-center justify-center gap-2 transition';
      }

      if (gameState === 'won_streak') {
        executeFlip(false);
      }
    }

    function modifyBet(type) {
      if (gameState !== 'ready' || isProcessingAction || isFlipping) return;

      const input = document.getElementById('betAmount');
      const current = Number(input.value) || 0;

      if (type === 'half') {
        input.value = Math.max(1, current / 2).toFixed(2);
      } else if (type === 'double') {
        input.value = (current * 2).toFixed(2);
      } else if (type === 'max') {
        input.value = Math.max(1, balance).toFixed(2);
      }

      validateBetInputStyle(input);
    }

    function renderHistoryBar() {
      const historyContainer = document.getElementById('historyBar');
      if (!historyContainer) return;

      historyContainer.innerHTML = '';

      previousResults.slice(-20).reverse().forEach(resStr => {
        const badge = document.createElement('span');
        const isCrash = resStr === '0.00x';

        badge.className = isCrash
          ? 'px-2 py-1 rounded-md text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/30 whitespace-nowrap'
          : 'px-2 py-1 rounded-md text-[10px] font-bold bg-emerald-500/20 text-[#24ee89] border border-emerald-500/30 whitespace-nowrap';

        badge.innerText = resStr;
        historyContainer.appendChild(badge);
      });

      try {
        localStorage.setItem('coin_multiplier_history', JSON.stringify(previousResults));
      } catch (e) {}
    }

    function openHistoryModal() {
      showAllHistoryModal = false;
      renderModalHistoryList();
      document.getElementById('historyModal').classList.remove('hidden');
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    function toggleHistoryLimit() {
      showAllHistoryModal = !showAllHistoryModal;
      renderModalHistoryList();
    }

    function renderModalHistoryList() {
      const listContainer = document.getElementById('modalHistoryList');
      const toggleBtn = document.getElementById('historyToggleBtn');
      if (!listContainer) return;

      listContainer.innerHTML = '';

      const itemsToDisplay = showAllHistoryModal
        ? [...previousResults].reverse()
        : [...previousResults].slice(-10).reverse();

      itemsToDisplay.forEach(resStr => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between border-b border-[#222b3a] py-2 px-1 text-xs';

        const isCrash = resStr === '0.00x';
        const gameId = 'GID-' + Math.floor(100000 + Math.random() * 900000);
        const hashStr = generateMaskedHash();

        row.innerHTML = `
          <div class="flex flex-col gap-0.5">
            <span class="text-gray-300 font-bold text-[11px]">${gameId}</span>
            <span class="text-gray-500 font-mono text-[10px]">Hash: ${hashStr}</span>
          </div>
          <span class="font-bold px-2 py-0.5 rounded text-[10px] border ${isCrash ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-emerald-500/20 text-[#24ee89] border-emerald-500/30'}">
            ${resStr}
          </span>
        `;

        listContainer.appendChild(row);
      });

      if (toggleBtn) {
        toggleBtn.innerText = showAllHistoryModal ? 'Less' : 'More';
      }
    }

    function setActionButton(text, color, disabled = false) {
      const btn = document.getElementById('btnAction');

      btn.disabled = disabled;
      btn.className =
        'w-full py-3.5 ' + color +
        ' text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2';

      btn.innerText = text;
    }

    async function saveProfileBalance() {
      if (!currentUserId || typeof supabaseClient === 'undefined') {
        return false;
      }

      const { error } = await supabaseClient
        .from('profiles')
        .update({ balance: balance })
        .eq('id', currentUserId);

      if (error) {
        return false;
      }

      return true;
    }

    async function handleMainAction() {
      if (isFlipping || isProcessingAction) return;

      if (gameState === 'ready') {
        isProcessingAction = true;
        setActionButton('Starting...', 'green-btn', true);

        const amountInput = document.getElementById('betAmount');
        const enteredAmount = Number(amountInput.value);

        if (!Number.isFinite(enteredAmount) || enteredAmount < 1) {
          isProcessingAction = false;
          setActionButton('Bet', 'green-btn');
          return;
        }

        if (!currentUserId) {
          isProcessingAction = false;
          setActionButton('Bet', 'green-btn');
          document.getElementById('gameStatusText').innerHTML =
            '<span style="color:#ed4245;font-weight:800">Please log in to play.</span>';
          return;
        }

        if (enteredAmount > balance) {
          isProcessingAction = false;
          setActionButton('Bet', 'green-btn');
          return;
        }

        activeBetAmount = enteredAmount;
        resetStats();

        if (activeBetAmount > 0) {
          balance -= activeBetAmount;
          updateBalanceUI();

          const saved = await saveProfileBalance();

          if (!saved) {
            balance += activeBetAmount;
            updateBalanceUI();

            activeBetAmount = 0;
            isProcessingAction = false;

            setActionButton('Bet', 'green-btn');
            return;
          }
        }

        currentMultiplier = 1.91;
        gameState = 'playing';
        isProcessingAction = false;

        executeFlip(true);
      } else if (gameState === 'won_streak') {
        await cashOut();
      }
    }

    async function executeFlip(isFirstBet) {
      if (isFlipping || isProcessingAction) return;
      if (gameState !== 'playing' && gameState !== 'won_streak') return;

      isFlipping = true;

      const thisRound = roundToken;
      const btn = document.getElementById('btnAction');
      const statusText = document.getElementById('gameStatusText');
      const coin = document.getElementById('coinElement');

      btn.disabled = true;
      btn.className =
        'w-full py-3.5 green-btn text-sm rounded-xl transition shadow flex items-center justify-center gap-2';
      btn.innerText = 'Flipping...';

      statusText.innerText = 'Coin is flipping...';

      const outcome = Math.random() < 0.5 ? 'heads' : 'tails';

      coin.classList.remove('flipping-heads', 'flipping-tails');
      void coin.offsetWidth;

      const flipDelay = isTurboOn ? 100 : 800;
      coin.style.animationDuration = isTurboOn ? '0.1s' : '0.8s';

      coin.classList.add(
        outcome === 'heads' ? 'flipping-heads' : 'flipping-tails'
      );

      setTimeout(async () => {
        if (thisRound !== roundToken) return;

        const isWin = selectedChoice === outcome;
        playClockBellSound();

        if (isWin) {
          if (isFirstBet) {
            currentMultiplier = 1.91;
            currentSeries = 1;
          } else {
            currentMultiplier = Number((currentMultiplier * 1.91).toFixed(2));
            currentSeries++;
          }

          updateStatsUI();

          const potentialWin = activeBetAmount > 0
            ? activeBetAmount * currentMultiplier
            : 0;

          statusText.innerHTML =
            '<span style="color:#24ee89;font-weight:800">(WIN) · ৳ ' +
            potentialWin.toFixed(2) +
            '</span>';

          gameState = 'won_streak';
          isFlipping = false;

          setActionButton(
            activeBetAmount > 0
              ? 'Cash Out (৳ ' + potentialWin.toFixed(2) + ')'
              : 'Continue (Demo)',
            'red-btn'
          );

        } else {
          statusText.innerHTML =
            '<span style="color:#ed4245;font-weight:800">LOST! Better luck next time.</span>';

          previousResults.push('0.00x');
          if (previousResults.length > 50) previousResults.shift();
          renderHistoryBar();

          if (activeBetAmount > 0) {
            updateLiveStatsUI(-activeBetAmount, activeBetAmount, false);
          }

          if (currentUserId && activeBetAmount > 0 && typeof supabaseClient !== 'undefined') {
            const insertData = {
              id: generateUUID(),
              user_id: currentUserId,
              target_number: selectedChoice === 'heads' ? 1 : 2,
              roll_result: 0.00,
              bet_amount: activeBetAmount,
              payout: 0,
              is_bool: false
            };

            await supabaseClient.from('bets').insert([insertData]);
          }

          resetGameUI();
        }
      }, flipDelay);
    }

    async function cashOut() {
      if (isFlipping || isProcessingAction || gameState !== 'won_streak') {
        return;
      }

      isProcessingAction = true;

      const payoutAmount = activeBetAmount > 0
        ? Number((activeBetAmount * currentMultiplier).toFixed(2))
        : 0;

      setActionButton('Processing Cash Out...', 'red-btn', true);

      const recordedMultiplierStr = currentMultiplier.toFixed(2) + 'x';
      previousResults.push(recordedMultiplierStr);
      if (previousResults.length > 50) previousResults.shift();
      renderHistoryBar();

      const profit = payoutAmount - activeBetAmount;

      if (activeBetAmount > 0) {
        balance += payoutAmount;
        updateBalanceUI();

        const saved = await saveProfileBalance();

        if (!saved) {
          balance -= payoutAmount;
          updateBalanceUI();

          isProcessingAction = false;
          setActionButton(
            'Cash Out (৳ ' + payoutAmount.toFixed(2) + ')',
            'red-btn'
          );

          document.getElementById('gameStatusText').innerHTML =
            '<span style="color:#ed4245;font-weight:800">Balance update failed. Please try again.</span>';

          return;
        }

        updateLiveStatsUI(profit, activeBetAmount, true);
      }

      if (currentUserId && activeBetAmount > 0 && typeof supabaseClient !== 'undefined') {
        const insertData = {
          id: generateUUID(),
          user_id: currentUserId,
          target_number: selectedChoice === 'heads' ? 1 : 2,
          roll_result: currentMultiplier,
          bet_amount: activeBetAmount,
          payout: payoutAmount,
          is_bool: true
        };

        await supabaseClient.from('bets').insert([insertData]);
      }

      playClockBellSound();

      document.getElementById('gameStatusText').innerHTML =
        '<span style="color:#24ee89;font-weight:800">(Won): ৳ ' +
        payoutAmount.toFixed(2) +
        '</span>';

      resetGameUI();
    }

    function resetGameUI() {
      roundToken++;

      gameState = 'ready';
      isFlipping = false;
      isProcessingAction = false;

      activeBetAmount = 0;
      resetStats();

      const btn = document.getElementById('btnAction');
      const coin = document.getElementById('coinElement');

      coin.classList.remove('flipping-heads', 'flipping-tails');
      void coin.offsetWidth;

      btn.disabled = false;
      btn.className =
        'w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2';
      btn.innerText = 'Bet';

      const amountInput = document.getElementById('betAmount');
      if (amountInput) {
        validateBetInputStyle(amountInput);
      }
    }

    window.addEventListener('load', initCoinFlipGame);
  </script>
