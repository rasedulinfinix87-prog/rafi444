<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BC Game Style Coin Flip</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #0f141c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f141c;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: calc(100px + env(safe-area-inset-bottom));
    }

    #topBarContainer {
      position: sticky;
      top: 0;
      z-index: 500;
      width: 100%;
      flex-shrink: 0;
    }

    #bottomBarContainer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 5000;
      isolation: isolate;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .game-page {
      width: 100%;
      max-width: 672px;
      margin: 5px auto 0;
      padding: 0 8px 100px;
    }

    .bc-main-wrapper {
      background: #171d28;
      border: 1px solid #222b3a;
      border-radius: 14px;
      overflow: hidden;
    }

    .bc-divider {
      height: 1px;
      background: #222b3a;
      width: 100%;
    }

    .bc-input-box {
      background: #0f141c;
      border: 1px solid #222b3a;
      border-radius: 10px;
    }

    .bc-input-box:focus-within {
      border-color: #24ee89;
    }

    .green-btn {
      background: #24ee89;
      color: #0f141c;
      font-weight: 800;
    }

    .green-btn:hover { background: #1ed67a; }

    .red-btn {
      background: #ed4245;
      color: #fff;
      font-weight: 800;
    }

    .red-btn:hover { background: #d3383b; }

    .green-btn:disabled,
    .red-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    /* Game screen */
    .game-screen {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 270px;
      width: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, #202a32 0%, #171d28 65%);
    }

    .game-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 25%, rgba(255,255,255,.09) 1px, transparent 2px),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,.08) 1px, transparent 2px),
        radial-gradient(circle at 20% 80%, rgba(255,255,255,.06) 1px, transparent 2px);
    }

    /* UPDATED: narrower side cards, closer to screen edges */
    .game-stage {
      position: absolute;
      left: 2px;
      right: 2px;
      top: 51px;
      bottom: 32px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px minmax(0, 1fr);
      align-items: center;
      justify-items: center;
      gap: 2px;
    }

    /* UPDATED: thinner Series and Multiply cards */
    .stat-card {
      width: 100%;
      max-width: 88px;
      min-width: 0;
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-align: center;
      border-radius: 15px;
      border: 1px solid rgba(190, 210, 218, .17);
      background: rgba(180, 198, 205, .12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 5px 18px rgba(0,0,0,.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .stat-value {
      color: #fff;
      font-size: clamp(18px, 4.5vw, 25px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.6px;
      white-space: nowrap;
    }

    .stat-label {
      color: #f0f3f5;
      font-size: clamp(11px, 2.8vw, 14px);
      line-height: 1.2;
      font-weight: 800;
    }

    .stat-card.stat-active {
      border-color: rgba(36, 238, 137, .48);
      box-shadow: 0 0 15px rgba(36, 238, 137, .08);
    }

    .stat-card.stat-active .stat-value {
      color: #24ee89;
    }

    /* Coin */
    .coin-container {
      perspective: 1000px;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 20px rgba(0,0,0,.45),
        inset 0 0 15px rgba(255,255,255,.3);
      border: 4px solid #f59e0b;
    }

    .coin-heads {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .coin-tails {
      background: linear-gradient(135deg, #94a3b8, #64748b);
      border-color: #cbd5e1;
      transform: rotateY(180deg);
    }

    @keyframes flipHeads {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(1800deg); }
    }

    @keyframes flipTails {
      0% { transform: rotateY(0); }
      100% { transform: rotateY(1980deg); }
    }

    .flipping-heads {
      animation: flipHeads .8s forwards;
    }

    .flipping-tails {
      animation: flipTails .8s forwards;
    }

    .game-status {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 10;
      text-align: center;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 600;
      color: #a7b2bf;
    }

    .history-bar {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .history-bar::-webkit-scrollbar { display: none; }

    /* Small mobile screens */
    @media (max-width: 380px) {
      .game-screen { height: 245px; }

      .game-stage {
        left: 2px;
        right: 2px;
        top: 47px;
        bottom: 32px;
        grid-template-columns: minmax(0, 1fr) 108px minmax(0, 1fr);
        gap: 1px;
      }

      .coin-container {
        width: 104px;
        height: 104px;
      }

      .coin-face { border-width: 3px; }

      .coin-face > div {
        width: 67px;
        height: 67px;
      }

      .stat-card {
        max-width: 76px;
        height: 105px;
        border-radius: 13px;
        gap: 9px;
      }

      .stat-value { font-size: 18px; }
      .stat-label { font-size: 11px; }
    }

    /* Standard mobile screens */
    @media (min-width: 381px) and (max-width: 480px) {
      .game-stage {
        left: 2px;
        right: 2px;
        grid-template-columns: minmax(0, 1fr) 124px minmax(0, 1fr);
        gap: 2px;
      }

      .coin-container {
        width: 120px;
        height: 120px;
      }

      .stat-card {
        max-width: 84px;
        height: 116px;
      }
    }

    ::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }

    ::-webkit-scrollbar-track { background: #0f141c; }

    ::-webkit-scrollbar-thumb {
      background: #222b3a;
      border-radius: 2px;
    }
  </style>
</head>

<body class="bg-[#0f141c] text-white font-sans min-h-screen flex flex-col items-center p-0 select-none">

  <!-- Top Bar -->
  <div id="topBarContainer" class="w-full max-w-2xl sticky top-0 z-50"></div>

  <div class="game-page">
    <main class="flex flex-col gap-3">

      <!-- Main Game Card -->
      <div class="bc-main-wrapper flex flex-col shadow-xl">

        <!-- Game Screen -->
        <div class="game-screen">

          <!-- History -->
          <div id="historyBar" class="history-bar"></div>

          <!-- Series, Coin and Multiply -->
          <div class="game-stage">

            <!-- Left Card -->
            <div id="seriesCard" class="stat-card">
              <div id="seriesValue" class="stat-value">0</div>
              <div class="stat-label">Series</div>
            </div>

            <!-- Coin -->
            <div class="coin-container">
              <div id="coinElement" class="coin">

                <div class="coin-face coin-heads">
                  <div class="w-20 h-20 rounded-full bg-red-600 flex items-center justify-center border-2 border-yellow-300 shadow-inner overflow-hidden">
                    <i class="fa-solid fa-dragon text-3xl text-yellow-300"></i>
                  </div>
                </div>

                <div class="coin-face coin-tails">
                  <div class="w-20 h-20 rounded-full bg-slate-700 flex items-center justify-center border-2 border-slate-300 shadow-inner overflow-hidden">
                    <i class="fa-solid fa-coins text-3xl text-slate-300"></i>
                  </div>
                </div>

              </div>
            </div>

            <!-- Right Card -->
            <div id="multiplyCard" class="stat-card">
              <div id="multiplyValue" class="stat-value">×0.00</div>
              <div class="stat-label">Multiply</div>
            </div>

          </div>

          <!-- Status -->
          <div id="gameStatusText" class="game-status">
            Pick a side and place your bet!
          </div>
        </div>

        <div class="bc-divider"></div>

        <!-- Game Controls -->
        <div class="p-4 flex flex-col gap-3.5 bg-[#171d28]">

          <!-- Heads / Tails -->
          <div class="grid grid-cols-2 gap-2">

            <button type="button" onclick="selectChoice('heads')" id="btnHeads"
              class="py-3 rounded-xl bg-[#222b3a] border-2 border-[#24ee89] text-white text-xs font-bold flex items-center justify-center gap-2 transition">
              <div class="w-5 h-5 rounded-full bg-amber-500 flex items-center justify-center text-[10px]">
                <i class="fa-solid fa-dragon"></i>
              </div>
              <span>Heads</span>
            </button>

            <button type="button" onclick="selectChoice('tails')" id="btnTails"
              class="py-3 rounded-xl bg-[#0f141c] border border-[#222b3a] text-gray-400 text-xs font-bold flex items-center justify-center gap-2 transition">
              <div class="w-5 h-5 rounded-full bg-slate-500 flex items-center justify-center text-[10px]">
                <i class="fa-solid fa-coins"></i>
              </div>
              <span>Tails</span>
            </button>

          </div>

          <!-- Bet Amount -->
          <div class="flex flex-col gap-1" id="betAmountContainer">

            <div class="flex justify-between items-center text-xs text-gray-400 font-medium">
              <span>Amount (৳)</span>
              <span class="text-gray-400 text-[10px]">Min: 1 ৳</span>
            </div>

            <div class="flex items-center bc-input-box p-1">
              <div class="flex items-center px-2 text-gray-400 font-bold text-sm">৳</div>

              <input type="number" id="betAmount" value="1" min="0" step="1"
                inputmode="decimal"
                class="w-full min-w-0 bg-transparent text-sm font-bold text-white focus:outline-none px-1">

              <div class="flex items-center gap-1">
                <button type="button" onclick="modifyBet('half')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">1/2</button>
                <button type="button" onclick="modifyBet('double')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-gray-300 transition">2x</button>
                <button type="button" onclick="modifyBet('max')" class="px-2.5 py-1 rounded-lg bg-[#171d28] hover:bg-[#222b3a] text-xs font-bold text-[#F5CF66] transition">Max</button>
              </div>
            </div>
          </div>

          <!-- Main Action -->
          <button type="button" id="btnAction" onclick="handleMainAction()"
            class="w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2">
            Bet
          </button>

          <div class="text-center text-[11px] text-gray-400">
            ℹ Betting with 0 will enter demo mode.
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Bottom Bar -->
  <div id="bottomBarContainer" class="w-full max-w-2xl fixed bottom-0 z-50"></div>

  <script>
    let currentUserId = null;
    let balance = 0;

    let selectedChoice = 'heads';
    let gameState = 'ready';

    let isFlipping = false;
    let isProcessingAction = false;

    let activeBetAmount = 0;
    let currentMultiplier = 1.00;
    let currentSeries = 0;

    let previousResults = loadSavedHistory();
    let roundToken = 0;

    function loadSavedHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem('bc_coin_history'));

        return Array.isArray(saved)
          ? saved.filter(x => x === 'heads' || x === 'tails').slice(-30)
          : ['heads', 'tails', 'heads', 'heads', 'tails'];
      } catch (e) {
        return ['heads', 'tails', 'heads', 'heads', 'tails'];
      }
    }

    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    async function loadBars() {
      try {
        const topRes = await fetch('../bar/top.html');

        if (topRes.ok) {
          document.getElementById('topBarContainer').innerHTML = await topRes.text();

          document.querySelectorAll('a[href*="deposit"]').forEach(a => {
            a.href = '../account/deposit.html';
          });
        }

        const botRes = await fetch('../bar/bottom.html');

        if (botRes.ok) {
          document.getElementById('bottomBarContainer').innerHTML = await botRes.text();
        }
      } catch (e) {
        console.error('Bar load error:', e);
      }
    }

    async function initCoinFlipGame() {
      await loadBars();

      renderHistoryBar();
      updateStatsUI();
      selectChoice('heads');

      if (
        typeof supabaseClient !== 'undefined' &&
        typeof getCurrentUser === 'function'
      ) {
        try {
          const user = await getCurrentUser();

          if (user) {
            currentUserId = user.id;

            const { data: profile, error } = await supabaseClient
              .from('profiles')
              .select('balance')
              .eq('id', user.id)
              .single();

            if (!error && profile) {
              balance = Number(profile.balance) || 0;
              updateBalanceUI();
            }

            supabaseClient
              .channel('coin-profile-channel')
              .on(
                'postgres_changes',
                {
                  event: 'UPDATE',
                  schema: 'public',
                  table: 'profiles',
                  filter: `id=eq.${user.id}`
                },
                payload => {
                  if (payload.new && payload.new.balance !== undefined) {
                    balance = Number(payload.new.balance) || 0;
                    updateBalanceUI();
                  }
                }
              )
              .subscribe();
          }
        } catch (e) {
          console.error('User/balance load error:', e);
        }
      }
    }

    function updateBalanceUI() {
      const topBal1 = document.getElementById('topBarBalance');
      const topBal2 = document.getElementById('userBalance');

      if (topBal1) topBal1.innerText = balance.toFixed(2);
      if (topBal2) topBal2.innerText = `৳ ${balance.toFixed(2)}`;
    }

    function updateStatsUI() {
      const seriesValue = document.getElementById('seriesValue');
      const multiplyValue = document.getElementById('multiplyValue');
      const seriesCard = document.getElementById('seriesCard');
      const multiplyCard = document.getElementById('multiplyCard');

      if (seriesValue) seriesValue.innerText = currentSeries;

      if (multiplyValue) {
        multiplyValue.innerText = currentSeries > 0
          ? '×' + currentMultiplier.toFixed(2)
          : '×0.00';
      }

      if (seriesCard) {
        seriesCard.classList.toggle('stat-active', currentSeries > 0);
      }

      if (multiplyCard) {
        multiplyCard.classList.toggle('stat-active', currentSeries > 0);
      }
    }

    function resetStats() {
      currentSeries = 0;
      currentMultiplier = 1.00;
      updateStatsUI();
    }

    function selectChoice(choice) {
      if (isFlipping || isProcessingAction) return;

      selectedChoice = choice;

      const btnHeads = document.getElementById('btnHeads');
      const btnTails = document.getElementById('btnTails');

      if (choice === 'heads') {
        btnHeads.className =
          'py-3 rounded-xl bg-[#222b3a] border-2 border-[#24ee89] text-white text-xs font-bold flex items-center justify-center gap-2 transition';

        btnTails.className =
          'py-3 rounded-xl bg-[#0f141c] border border-[#222b3a] text-gray-400 text-xs font-bold flex items-center justify-center gap-2 transition';
      } else {
        btnTails.className =
          'py-3 rounded-xl bg-[#222b3a] border-2 border-[#24ee89] text-white text-xs font-bold flex items-center justify-center gap-2 transition';

        btnHeads.className =
          'py-3 rounded-xl bg-[#0f141c] border border-[#222b3a] text-gray-400 text-xs font-bold flex items-center justify-center gap-2 transition';
      }

      if (gameState === 'won_streak') {
        executeFlip(false);
      }
    }

    function modifyBet(type) {
      if (gameState !== 'ready' || isProcessingAction || isFlipping) return;

      const input = document.getElementById('betAmount');
      const current = Number(input.value) || 0;

      if (type === 'half') {
        input.value = Math.max(0, Math.floor(current / 2));
      } else if (type === 'double') {
        input.value = Math.floor(current * 2);
      } else if (type === 'max') {
        input.value = Math.max(0, Math.floor(balance));
      }
    }

    function renderHistoryBar() {
      const historyContainer = document.getElementById('historyBar');
      if (!historyContainer) return;

      historyContainer.innerHTML = '';

      previousResults.slice(-10).reverse().forEach(res => {
        const badge = document.createElement('span');

        if (res === 'heads') {
          badge.className =
            'px-2.5 py-1 rounded-md text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30';
          badge.innerText = 'Heads';
        } else {
          badge.className =
            'px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-500/20 text-slate-300 border border-slate-500/30';
          badge.innerText = 'Tails';
        }

        historyContainer.appendChild(badge);
      });

      try {
        localStorage.setItem('bc_coin_history', JSON.stringify(previousResults));
      } catch (e) {
        console.warn('History save error:', e);
      }
    }

    function setActionButton(text, color, disabled = false) {
      const btn = document.getElementById('btnAction');

      btn.disabled = disabled;
      btn.className =
        'w-full py-3.5 ' + color +
        ' text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2';

      btn.innerText = text;
    }

    async function saveProfileBalance() {
      if (!currentUserId || typeof supabaseClient === 'undefined') {
        return true;
      }

      const { error } = await supabaseClient
        .from('profiles')
        .update({ balance: balance })
        .eq('id', currentUserId);

      if (error) {
        console.error('Balance update error:', error);
        return false;
      }

      return true;
    }

    async function handleMainAction() {
      if (isFlipping || isProcessingAction) return;

      if (gameState === 'ready') {
        isProcessingAction = true;
        setActionButton('Starting...', 'green-btn', true);

        const amountInput = document.getElementById('betAmount');
        const enteredAmount = Number(amountInput.value);

        if (!Number.isFinite(enteredAmount) || enteredAmount < 0) {
          alert('সঠিক বেটের পরিমাণ লিখুন।');
          isProcessingAction = false;
          setActionButton('Bet', 'green-btn');
          return;
        }

        if (enteredAmount > 0 && enteredAmount < 1) {
          alert('সর্বনিম্ন বেট ১ টাকা।');
          isProcessingAction = false;
          setActionButton('Bet', 'green-btn');
          return;
        }

        if (enteredAmount > balance) {
          alert('পর্যাপ্ত ব্যালেন্স নেই!');
          isProcessingAction = false;
          setActionButton('Bet', 'green-btn');
          return;
        }

        activeBetAmount = enteredAmount;
        resetStats();

        if (activeBetAmount > 0) {
          balance -= activeBetAmount;
          updateBalanceUI();

          const saved = await saveProfileBalance();

          if (!saved) {
            balance += activeBetAmount;
            updateBalanceUI();

            activeBetAmount = 0;
            isProcessingAction = false;

            setActionButton('Bet', 'green-btn');
            alert('ব্যালেন্স আপডেট করা যায়নি। আবার চেষ্টা করুন।');
            return;
          }
        }

        currentMultiplier = 1.96;
        gameState = 'playing';
        isProcessingAction = false;

        executeFlip(true);
      } else if (gameState === 'won_streak') {
        await cashOut();
      }
    }

    async function executeFlip(isFirstBet) {
      if (isFlipping || isProcessingAction) return;

      if (gameState !== 'playing' && gameState !== 'won_streak') return;

      isFlipping = true;

      const thisRound = roundToken;
      const btn = document.getElementById('btnAction');
      const statusText = document.getElementById('gameStatusText');
      const coin = document.getElementById('coinElement');

      btn.disabled = true;
      btn.className =
        'w-full py-3.5 green-btn text-sm rounded-xl transition shadow flex items-center justify-center gap-2';
      btn.innerText = 'Flipping...';

      statusText.innerText = 'Coin is flipping...';

      const outcome = Math.random() < 0.5 ? 'heads' : 'tails';

      coin.classList.remove('flipping-heads', 'flipping-tails');
      void coin.offsetWidth;

      coin.classList.add(
        outcome === 'heads' ? 'flipping-heads' : 'flipping-tails'
      );

      setTimeout(async () => {
        if (thisRound !== roundToken) return;

        const isWin = selectedChoice === outcome;

        previousResults.push(outcome);

        if (previousResults.length > 30) {
          previousResults.shift();
        }

        renderHistoryBar();

        if (isWin) {
          if (isFirstBet) {
            currentMultiplier = 1.96;
            currentSeries = 1;
          } else {
            currentMultiplier = Number(
              (currentMultiplier * 1.96).toFixed(2)
            );
            currentSeries++;
          }

          updateStatsUI();

          const potentialWin = activeBetAmount > 0
            ? activeBetAmount * currentMultiplier
            : 0;

          statusText.innerHTML =
            '<span style="color:#24ee89;font-weight:800">WIN! Choose another side or Cash Out · ৳ ' +
            potentialWin.toFixed(2) +
            '</span>';

          gameState = 'won_streak';
          isFlipping = false;

          setActionButton(
            activeBetAmount > 0
              ? 'Cash Out (৳ ' + potentialWin.toFixed(2) + ')'
              : 'Continue (Demo)',
            'red-btn'
          );

        } else {
          statusText.innerHTML =
            '<span style="color:#ed4245;font-weight:800">LOST! Better luck next time.</span>';

          if (
            currentUserId &&
            activeBetAmount > 0 &&
            typeof supabaseClient !== 'undefined'
          ) {
            const insertData = {
              id: generateUUID(),
              user_id: currentUserId,
              target_number: selectedChoice === 'heads' ? 1 : 2,
              roll_result: outcome === 'heads' ? 1 : 2,
              bet_amount: activeBetAmount,
              payout: 0,
              is_bool: false
            };

            const { error } = await supabaseClient
              .from('bets')
              .insert([insertData]);

            if (error) {
              console.error('Lost bet record error:', error);
            }
          }

          resetGameUI();
        }
      }, 800);
    }

    async function cashOut() {
      if (
        isFlipping ||
        isProcessingAction ||
        gameState !== 'won_streak'
      ) {
        return;
      }

      isProcessingAction = true;

      const payoutAmount = activeBetAmount > 0
        ? Number((activeBetAmount * currentMultiplier).toFixed(2))
        : 0;

      setActionButton('Processing Cash Out...', 'red-btn', true);

      if (activeBetAmount > 0) {
        balance += payoutAmount;
        updateBalanceUI();

        const saved = await saveProfileBalance();

        if (!saved) {
          balance -= payoutAmount;
          updateBalanceUI();

          isProcessingAction = false;

          setActionButton(
            'Cash Out (৳ ' + payoutAmount.toFixed(2) + ')',
            'red-btn'
          );

          document.getElementById('gameStatusText').innerHTML =
            '<span style="color:#ed4245;font-weight:800">Balance update failed. Please try again.</span>';

          return;
        }
      }

      if (
        currentUserId &&
        activeBetAmount > 0 &&
        typeof supabaseClient !== 'undefined'
      ) {
        const insertData = {
          id: generateUUID(),
          user_id: currentUserId,
          target_number: selectedChoice === 'heads' ? 1 : 2,
          roll_result: selectedChoice === 'heads' ? 1 : 2,
          bet_amount: activeBetAmount,
          payout: payoutAmount,
          is_bool: true
        };

        const { error } = await supabaseClient
          .from('bets')
          .insert([insertData]);

        if (error) {
          console.error('Cashout bet record error:', error);
        }
      }

      document.getElementById('gameStatusText').innerHTML =
        '<span style="color:#24ee89;font-weight:800">Cashed Out Successfully: ৳ ' +
        payoutAmount.toFixed(2) +
        '</span>';

      resetGameUI();
    }

    function resetGameUI() {
      roundToken++;

      gameState = 'ready';
      isFlipping = false;
      isProcessingAction = false;

      activeBetAmount = 0;

      resetStats();

      const btn = document.getElementById('btnAction');
      const coin = document.getElementById('coinElement');

      coin.classList.remove('flipping-heads', 'flipping-tails');
      void coin.offsetWidth;

      btn.disabled = false;
      btn.className =
        'w-full py-3.5 green-btn text-sm rounded-xl transition shadow active:scale-[0.99] flex items-center justify-center gap-2';
      btn.innerText = 'Bet';
    }

    window.addEventListener('load', initCoinFlipGame);
  </script>

</body>
</html>
