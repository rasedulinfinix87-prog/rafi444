<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Game Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body class="bg-[#0f141c] text-white flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-[#161b22] border border-gray-800 rounded-2xl p-6 shadow-2xl">
    
    <!-- Tab Toggle -->
    <div class="flex border-b border-gray-800 mb-6">
      <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-center font-semibold border-b-2 border-[#24ee89] text-[#24ee89]">Login</button>
      <button id="tabSignup" onclick="switchTab('signup')" class="flex-1 py-2 text-center font-semibold border-b-2 border-transparent text-gray-400">Sign Up</button>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">Phone Number or Game ID</label>
        <input type="text" id="loginIdentifier" required placeholder="Enter Phone or Game ID" class="w-full bg-[#0f141c] border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#24ee89]">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full bg-[#0f141c] border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#24ee89]">
      </div>
      <button type="submit" id="loginBtn" class="w-full bg-[#24ee89] text-black font-bold py-2.5 rounded-lg hover:bg-emerald-400 transition">Log In</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs text-gray-400 mb-1">Full Name</label>
        <input type="text" id="signupFullName" required class="w-full bg-[#0f141c] border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#24ee89]">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Phone Number</label>
        <input type="tel" id="signupPhone" required placeholder="017xxxxxxxx" class="w-full bg-[#0f141c] border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#24ee89]">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Password</label>
        <input type="password" id="signupPassword" minlength="6" required class="w-full bg-[#0f141c] border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#24ee89]">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Confirm Password</label>
        <input type="password" id="signupConfirmPassword" minlength="6" required class="w-full bg-[#0f141c] border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#24ee89]">
      </div>
      <button type="submit" id="signupBtn" class="w-full bg-[#24ee89] text-black font-bold py-2.5 rounded-lg hover:bg-emerald-400 transition">Create Account</button>
    </form>

  </div>

  <script>
    const commonPasswords = ["123456", "password", "123456789", "123123", "qwerty", "111111", "admin", "12345"];

    function switchTab(type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.add('hidden');
      if (type === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('tabLogin').className = "flex-1 py-2 text-center font-semibold border-b-2 border-[#24ee89] text-[#24ee89]";
        document.getElementById('tabSignup').className = "flex-1 py-2 text-center font-semibold border-b-2 border-transparent text-gray-400";
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('tabSignup').className = "flex-1 py-2 text-center font-semibold border-b-2 border-[#24ee89] text-[#24ee89]";
        document.getElementById('tabLogin').className = "flex-1 py-2 text-center font-semibold border-b-2 border-transparent text-gray-400";
      }
    }

    function showAlert(msg, isSuccess = false) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerText = msg;
      alertBox.className = `mb-4 p-3 rounded-lg text-xs font-medium ${isSuccess ? 'bg-emerald-900/50 text-emerald-300 border border-emerald-700' : 'bg-red-900/50 text-red-300 border border-red-700'}`;
      alertBox.classList.remove('hidden');
    }

    function generateGameId() {
      const randomNum = Math.floor(100000 + Math.random() * 900000);
      return `GAME${randomNum}`;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerText = "Logging in...";

      try {
        const { data: user, error } = await supabaseClient
          .from('profiles')
          .select('*')
          .or(`phone_number.eq.${identifier},user_game_id.eq.${identifier}`)
          .maybeSingle();

        if (error || !user) {
          throw new Error("ভুল Game ID বা Phone Number দেওয়া হয়েছে!");
        }

        if (user.password !== password) {
          throw new Error("ভুল Password দেওয়া হয়েছে!");
        }

        // Save session in localStorage
        localStorage.setItem('current_user', JSON.stringify(user));

        window.location.href = "index.html";
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.innerText = "Log In";
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const fullName = document.getElementById('signupFullName').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;
      const btn = document.getElementById('signupBtn');

      if (commonPasswords.includes(password.toLowerCase())) {
        showAlert("এই পাসওয়ার্ডটি খুব সাধারণ (Common Password)। অনুগ্রহ করে অন্য একটি শক্তিশালী পাসওয়ার্ড দিন।");
        return;
      }

      if (password !== confirmPassword) {
        showAlert("পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড মিলছে না!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Checking Phone Number...";

      try {
        // Check if phone number already exists
        const { data: existingUser } = await supabaseClient
          .from('profiles')
          .select('phone_number')
          .eq('phone_number', phone)
          .maybeSingle();

        if (existingUser) {
          throw new Error("এই মোবাইল নাম্বারটি ইতিমধ্যে ব্যবহার করা হয়েছে। অন্য নাম্বার দিয়ে চেষ্টা করুন।");
        }

        btn.innerText = "Creating Account...";
        const userGameId = generateGameId();

        // Direct insert into profiles table (Bypassing Supabase Auth completely)
        const { data, error } = await supabaseClient
          .from('profiles')
          .insert([
            {
              full_name: fullName,
              phone_number: phone,
              user_game_id: userGameId,
              password: password,
              balance: 0
            }
          ])
          .select()
          .single();

        if (error) throw error;

        localStorage.setItem('current_user', JSON.stringify(data));

        showAlert("Account created successfully! Redirecting...", true);
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.innerText = "Create Account";
      }
    }
  </script>
</body>
</html>
