
<!-- components/game-tools.html -->

<template id="gameToolsTemplate">

    <!-- Compact Game Tools Card: Normal Page Flow -->
    <section id="gameToolsCard"
        class="mx-auto my-3 w-full max-w-xl px-3">

        <div class="grid grid-cols-4 items-center gap-1 rounded-xl
                    border border-[#F5CF66]/25 bg-[#10151d]
                    px-1.5 py-2 shadow-lg">

            <!-- Live Stats -->
            <button type="button"
                data-game-tools-open="gameToolsStatsModal"
                class="flex min-w-0 flex-col items-center justify-center
                       gap-1 rounded-lg py-2 text-[#F5CF66]
                       active:bg-white/10">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px] font-semibold sm:text-xs">
                    Live Stats
                </span>
            </button>

            <!-- Rating -->
            <button type="button"
                data-game-tools-open="gameToolsRatingModal"
                class="flex min-w-0 flex-col items-center justify-center
                       gap-1 rounded-lg py-2 text-[#F5CF66]
                       active:bg-white/10">
                <i class="fa-solid fa-star text-lg"></i>
                <span class="text-[10px] font-semibold sm:text-xs">
                    Rating
                </span>
            </button>

            <!-- Turbo -->
            <button type="button"
                id="gameToolsTurboToggle"
                aria-pressed="false"
                class="flex min-w-0 flex-col items-center justify-center
                       gap-1 rounded-lg py-2 text-[#F5CF66]
                       active:bg-white/10">
                <i class="fa-solid fa-bolt text-lg"></i>
                <span class="text-[10px] font-semibold sm:text-xs">
                    Turbo
                </span>
                <span id="gameToolsTurboStatus"
                    class="text-[9px] text-gray-400">OFF</span>
            </button>

            <!-- Settings -->
            <button type="button"
                data-game-tools-open="gameToolsSettingsModal"
                class="flex min-w-0 flex-col items-center justify-center
                       gap-1 rounded-lg py-2 text-[#F5CF66]
                       active:bg-white/10">
                <i class="fa-solid fa-gear text-lg"></i>
                <span class="text-[10px] font-semibold sm:text-xs">
                    Setting
                </span>
            </button>

        </div>
    </section>

    <!-- Settings Modal -->
    <div id="gameToolsSettingsModal"
        class="fixed inset-0 z-[10000] hidden items-end
               justify-center bg-black/70 p-3">

        <div class="w-full max-w-md rounded-2xl
                    border border-[#F5CF66]/25 bg-[#10151d]
                    p-4 text-white">

            <div class="mb-4 flex items-center justify-between">
                <strong>Settings</strong>
                <button type="button"
                    data-game-tools-close="gameToolsSettingsModal"
                    aria-label="Close settings"
                    class="px-3 py-1 text-gray-300">✕</button>
            </div>

            <button type="button"
                id="gameToolsSoundToggle"
                class="flex w-full items-center justify-between
                       rounded-lg border border-white/10 p-3 text-sm">
                <span>Sound Effects</span>
                <span id="gameToolsSoundStatus"
                    class="font-semibold text-[#F5CF66]">ON</span>
            </button>

            <button type="button"
                id="gameToolsShare"
                class="mt-2 w-full rounded-lg border border-white/10
                       p-3 text-left text-sm">
                Share Game
            </button>

        </div>
    </div>

    <!-- Live Stats Modal -->
    <div id="gameToolsStatsModal"
        class="fixed inset-0 z-[10000] hidden items-center
               justify-center bg-black/70 p-4">

        <div class="w-full max-w-sm rounded-2xl
                    border border-[#F5CF66]/25 bg-[#10151d]
                    p-4 text-white">

            <div class="mb-4 flex items-center justify-between">
                <strong>Live Stats</strong>
                <button type="button"
                    data-game-tools-close="gameToolsStatsModal"
                    aria-label="Close stats"
                    class="px-3 py-1 text-gray-300">✕</button>
            </div>

            <div class="space-y-3 text-sm">
                <div class="flex justify-between">
                    <span class="text-gray-400">Profit / Loss</span>
                    <strong id="gameToolsProfit">৳ 0.00</strong>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Wagered</span>
                    <strong id="gameToolsWagered">৳ 0.00</strong>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Wins</span>
                    <strong id="gameToolsWins">0</strong>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Losses</span>
                    <strong id="gameToolsLosses">0</strong>
                </div>
            </div>

            <div id="gameToolsStatsGraph"
                class="mt-4 flex h-24 items-end gap-1 overflow-x-auto">
            </div>

        </div>
    </div>

    <!-- Rating Modal -->
    <div id="gameToolsRatingModal"
        class="fixed inset-0 z-[10000] hidden items-center
               justify-center bg-black/70 p-4">

        <div class="w-full max-w-sm rounded-2xl
                    border border-[#F5CF66]/25 bg-[#10151d]
                    p-4 text-center text-white">

            <div class="mb-4 flex items-center justify-between">
                <strong>Rate This Game</strong>
                <button type="button"
                    data-game-tools-close="gameToolsRatingModal"
                    aria-label="Close rating"
                    class="px-3 py-1 text-gray-300">✕</button>
            </div>

            <p class="mb-4 text-sm text-gray-400">
                আপনার রেটিং নির্বাচন করুন
            </p>

            <div id="gameToolsRatingStars"
                class="flex justify-center gap-2">
                <button type="button" data-game-tools-rating="1"
                    aria-label="1 star" class="text-2xl text-gray-500">★</button>
                <button type="button" data-game-tools-rating="2"
                    aria-label="2 stars" class="text-2xl text-gray-500">★</button>
                <button type="button" data-game-tools-rating="3"
                    aria-label="3 stars" class="text-2xl text-gray-500">★</button>
                <button type="button" data-game-tools-rating="4"
                    aria-label="4 stars" class="text-2xl text-gray-500">★</button>
                <button type="button" data-game-tools-rating="5"
                    aria-label="5 stars" class="text-2xl text-gray-500">★</button>
            </div>

            <p id="gameToolsRatingMessage"
                class="mt-3 text-xs text-gray-400">
                এখনও কোনো রেটিং নির্বাচন করা হয়নি
            </p>

        </div>
    </div>

</template>
