<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Asia Roulette</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../supabase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      background: #0b0e14;
      margin: 0;
      font-family: system-ui, sans-serif;
      color: white;
      overflow-x: hidden;
    }


    /* =========================================================
       REALISTIC ROULETTE WHEEL
    ========================================================= */

    .wheel-section {
      background:
        radial-gradient(
          circle at center,
          #1b2430 0%,
          #141a22 55%,
          #0d1219 100%
        );

      border-radius: 16px;

      padding: 18px 10px 22px;

      position: relative;

      overflow: hidden;
    }


    .wheel-wrapper {

      position: relative;

      width: 280px;

      height: 280px;

      margin: 5px auto 0;

    }


    /* Outer metal rings */

    .wheel-wrapper::before {

      content: "";

      position: absolute;

      inset: -10px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #303846 0%,
          #202733 58%,
          #10151d 100%
        );

      box-shadow:
        0 0 0 3px #090d13,
        0 0 0 8px #303744,
        0 15px 35px rgba(0,0,0,.75);

      z-index: 0;
    }


    .wheel {

      width: 100%;

      height: 100%;

      border-radius: 50%;

      position: relative;

      overflow: hidden;

      z-index: 5;

      background: #111;

      box-shadow:
        inset 0 0 0 5px rgba(255,255,255,.05),
        inset 0 0 25px rgba(0,0,0,.8);

      transition:
        transform 4.5s cubic-bezier(.12,.02,.08,1);

      will-change: transform;

    }


    .wheel-inner {

      width: 100%;

      height: 100%;

      border-radius: 50%;

      position: absolute;

      top: 0;

      left: 0;

    }


    /* Roulette segments */

    .segment {

      position: absolute;

      width: 50%;

      height: 50%;

      left: 50%;

      top: 0;

      transform-origin: 0% 100%;

      clip-path:
        polygon(
          0 100%,
          100% 100%,
          50% 0
        );

      border-left: 1px solid rgba(255,255,255,.05);

    }


    .segment span {

      position: absolute;

      top: 17px;

      left: 50%;

      transform:
        translateX(-50%)
        rotate(90deg);

      font-size: 10px;

      font-weight: 900;

      color: #fff;

      text-shadow:
        0 1px 2px #000,
        0 0 4px #000;

    }


    /* Inner gold/metal ring */

    .wheel::after {

      content: "";

      position: absolute;

      width: 43%;

      height: 43%;

      left: 28.5%;

      top: 28.5%;

      border-radius: 50%;

      border: 5px solid #363d48;

      box-shadow:
        inset 0 0 10px #000,
        0 0 0 2px rgba(255,255,255,.04);

      pointer-events: none;

      z-index: 10;

    }


    /* Center */

    .wheel-center {

      position: absolute;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 58px;

      height: 58px;

      background:
        radial-gradient(
          circle at 35% 30%,
          #293241,
          #0d1219
        );

      border-radius: 50%;

      border: 3px solid #24ee89;

      display: flex;

      align-items: center;

      justify-content: center;

      font-weight: 900;

      font-size: 1.15rem;

      z-index: 25;

      box-shadow:
        0 0 15px rgba(36,238,137,.35),
        inset 0 0 12px rgba(0,0,0,.8);

    }


    /* =========================================================
       BALL
    ========================================================= */

    .ball-orbit {

      position: absolute;

      inset: 8px;

      border-radius: 50%;

      z-index: 35;

      pointer-events: none;

      transition:
        transform 4.5s cubic-bezier(.12,.02,.08,1);

      will-change: transform;

    }


    .roulette-ball {

      position: absolute;

      width: 14px;

      height: 14px;

      left: 50%;

      top: -5px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 30% 25%,
          #ffffff 0%,
          #ffffff 30%,
          #d9d9d9 48%,
          #8e8e8e 100%
        );

      box-shadow:
        0 2px 5px rgba(0,0,0,.9),
        0 0 5px rgba(255,255,255,.45);

    }


    /* Ball shadow */

    .roulette-ball::after {

      content: "";

      position: absolute;

      width: 18px;

      height: 7px;

      left: -2px;

      top: 9px;

      background: rgba(0,0,0,.35);

      filter: blur(3px);

      border-radius: 50%;

      z-index: -1;

    }


    /* Pointer */

    .pointer {

      position: absolute;

      top: -8px;

      left: 50%;

      transform: translateX(-50%);

      width: 0;

      height: 0;

      border-left: 12px solid transparent;

      border-right: 12px solid transparent;

      border-top: 23px solid #24ee89;

      z-index: 50;

      filter:
        drop-shadow(0 2px 4px rgba(0,0,0,.7));

    }


    /* =========================================================
       TIMER
    ========================================================= */

    .timer-popup {

      position: absolute;

      top: 10px;

      right: 10px;

      background: rgba(0,0,0,.55);

      backdrop-filter: blur(8px);

      border: 1px solid rgba(36,238,137,.35);

      border-radius: 10px;

      padding: 6px 11px;

      font-size: 13px;

      font-weight: 800;

      color: #24ee89;

      z-index: 60;

    }


    /* =========================================================
       RESULT POPUP
    ========================================================= */

    .result-popup {

      position: fixed;

      top: 50%;

      left: 50%;

      transform:
        translate(-50%, -50%)
        scale(.6);

      background:
        radial-gradient(
          circle,
          rgba(25,35,45,.96),
          rgba(0,0,0,.92)
        );

      backdrop-filter: blur(15px);

      border: 2px solid #24ee89;

      border-radius: 22px;

      padding: 25px 42px;

      font-size: 3rem;

      font-weight: 900;

      color: white;

      z-index: 100;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .3s ease,
        transform .3s ease;

      box-shadow:
        0 0 40px rgba(36,238,137,.25);

    }


    .result-popup.show {

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

    }


    /* =========================================================
       HISTORY
    ========================================================= */

    .history-bar {

      display: flex;

      flex-direction: row;

      gap: 6px;

      overflow-x: auto;

      padding: 8px 0;

      scrollbar-width: none;

    }


    .history-bar::-webkit-scrollbar {

      display: none;

    }


    .hist-item {

      min-width: 34px;

      height: 32px;

      border-radius: 7px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 12px;

      font-weight: 900;

      flex-shrink: 0;

      border: 1px solid rgba(255,255,255,.08);

    }


    .hist-red {

      background: #c62828;

    }


    .hist-black {

      background: #181818;

    }


    .hist-green {

      background: #167532;

    }


    /* =========================================================
       BETTING TABLE
    ========================================================= */

    .table-wrap {

      background: #162116;

      border-radius: 12px;

      overflow: hidden;

      border: 2px solid #2e4a2e;

    }


    .cell {

      display: flex;

      align-items: center;

      justify-content: center;

      font-weight: 800;

      font-size: 12px;

      cursor: pointer;

      position: relative;

      user-select: none;

      transition:
        transform .12s,
        filter .12s;

    }


    .cell:active {

      transform: scale(.95);

    }


    .cell.red {

      background: #8b1e1e;

    }


    .cell.black {

      background: #171717;

    }


    .cell.green {

      background: #176323;

    }


    .cell.outside {

      background: #293d29;

      font-size: 11px;

    }


    .cell.selected {

      outline: 2px solid #24ee89;

      outline-offset: -2px;

      box-shadow:
        inset 0 0 12px rgba(36,238,137,.4);

    }


    .chip-on {

      position: absolute;

      width: 18px;

      height: 18px;

      background: #24ee89;

      color: #061913;

      border-radius: 50%;

      font-size: 8px;

      font-weight: 900;

      display: flex;

      align-items: center;

      justify-content: center;

      top: 2px;

      right: 2px;

      box-shadow:
        0 1px 4px rgba(0,0,0,.6);

    }


    /* =========================================================
       CHIPS
    ========================================================= */

    .chip-btn {

      width: 42px;

      height: 42px;

      border-radius: 50%;

      font-weight: 900;

      font-size: 11px;

      border: 3px solid transparent;

      transition:
        all .15s;

    }


    .chip-btn.active {

      border-color: white;

      transform: scale(1.12);

      box-shadow:
        0 0 12px rgba(255,255,255,.4);

    }


    /* Spin glow */

    .spinning .wheel {

      box-shadow:
        inset 0 0 0 5px rgba(255,255,255,.04),
        0 0 25px rgba(36,238,137,.15);

    }


  </style>

</head>

<script>


/* ============================================================
   CONFIG
============================================================ */

const ROUND_TIME = 12;

const SPIN_TIME = 4.5;


/* ============================================================
   AMERICAN ROULETTE ORDER
============================================================ */

const WHEEL_ORDER = [

  0,
  28,
  9,
  26,
  30,
  11,
  7,
  20,
  32,
  17,
  5,
  22,
  34,
  15,
  3,
  24,
  36,
  13,
  1,
  '00',
  27,
  10,
  25,
  29,
  12,
  8,
  19,
  31,
  18,
  6,
  21,
  33,
  16,
  4,
  23,
  35,
  14,
  2

];


const RED = [

  1,
  3,
  5,
  7,
  9,
  12,
  14,
  16,
  18,
  19,
  21,
  23,
  25,
  27,
  30,
  32,
  34,
  36

];


/* ============================================================
   STATE
============================================================ */

let userId = null;

let balance = 0;

let chip = 10;

let bets = {};

let lastBets = {};

let isSpinning = false;

let timeLeft = ROUND_TIME;

let timer = null;

let rotation = 0;

let ballRotation = 0;

let history = [];


/* ============================================================
   TOP BAR
============================================================ */

async function loadTopBar() {

  try {

    const res = await fetch('../bar/top.html');

    if (res.ok) {

      document.getElementById(
        'topBarContainer'
      ).innerHTML = await res.text();

    }

  } catch (e) {

    console.log('Top bar error:', e);

  }

}


/* ============================================================
   INIT
============================================================ */

async function init() {

  await loadTopBar();


  try {

    let user = null;


    if (
      typeof requireAuth === 'function'
    ) {

      user = await requireAuth();

    }

    else if (
      typeof getCurrentUser === 'function'
    ) {

      user = await getCurrentUser();

    }


    if (user) {

      userId = user.id;


      const { data } =
        await supabaseClient
          .from('profiles')
          .select('balance')
          .eq('id', user.id)
          .single();


      if (data) {

        balance =
          parseFloat(data.balance) || 0;

        updateBalance();

      }

    }

  } catch (e) {

    console.log('User loading error:', e);

  }


  buildWheel();

  buildTable();

  setChip(10);

  startTimer();

}


/* ============================================================
   BALANCE
============================================================ */

function updateBalance() {

  document.getElementById(
    'balanceText'
  ).innerText =
    'BDT ' + balance.toFixed(2);


  const top =
    document.getElementById(
      'topBarBalance'
    );


  if (top) {

    top.innerText =
      balance.toFixed(2);

  }

}


/* ============================================================
   RANDOM NUMBER
   Crypto based random
============================================================ */

function secureRandomInt(max) {

  if (
    window.crypto &&
    window.crypto.getRandomValues
  ) {

    const array =
      new Uint32Array(1);

    window.crypto.getRandomValues(array);

    return array[0] % max;

  }


  return Math.floor(
    Math.random() * max
  );

}


/* ============================================================
   BUILD WHEEL
============================================================ */

function buildWheel() {

  const inner =
    document.getElementById(
      'wheelInner'
    );


  inner.innerHTML = '';


  const total =
    WHEEL_ORDER.length;


  const angle =
    360 / total;


  WHEEL_ORDER.forEach(
    (num, i) => {

      const seg =
        document.createElement('div');


      seg.className =
        'segment';


      let color;


      if (
        num === 0 ||
        num === '00'
      ) {

        color = '#126b2c';

      }

      else if (
        RED.includes(num)
      ) {

        color = '#c62828';

      }

      else {

        color = '#151515';

      }


      seg.style.background =
        color;


      seg.style.transform =
        `rotate(${i * angle}deg)`;


      const span =
        document.createElement('span');


      span.innerText =
        num;


      seg.appendChild(span);


      inner.appendChild(seg);

    }
  );

}


/* ============================================================
   BUILD TABLE
============================================================ */

function buildTable() {

  const container =
    document.getElementById(
      'mainNumbers'
    );


  container.innerHTML = '';


  const order = [

    [
      3,6,9,12,
      15,18,21,24,
      27,30,33,36
    ],

    [
      2,5,8,11,
      14,17,20,23,
      26,29,32,35
    ],

    [
      1,4,7,10,
      13,16,19,22,
      25,28,31,34
    ]

  ];


  order.forEach(row => {

    row.forEach(n => {

      const color =
        RED.includes(n)
          ? 'red'
          : 'black';


      const div =
        document.createElement(
          'div'
        );


      div.className =
        `cell ${color} h-10 border border-[#1a2a1a]`;


      div.id =
        `cell-${n}`;


      div.innerHTML =
        n;


      div.onclick =
        () => placeBet(n);


      container.appendChild(div);

    });

  });

}


/* ============================================================
   CHIP
============================================================ */

function setChip(val) {

  chip = val;


  document
    .querySelectorAll('.chip-btn')
    .forEach(btn => {

      btn.classList.toggle(
        'active',
        parseInt(btn.dataset.val) === val
      );

    });

}


/* ============================================================
   PLACE BET
============================================================ */

async function placeBet(target) {

  if (isSpinning)
    return;


  if (timeLeft < 1.5)
    return;


  if (!userId) {

    alert('Please login first.');

    return;

  }


  if (chip > balance) {

    alert(
      'Insufficient balance!'
    );

    return;

  }


  balance -= chip;


  updateBalance();


  /*
    Client-side balance update.
    Real-money production system:
    move this operation to server-side.
  */

  try {

    await supabaseClient
      .from('profiles')
      .update({
        balance: balance
      })
      .eq('id', userId);

  } catch (e) {

    console.log(
      'Balance update error:',
      e
    );

  }


  bets[target] =
    (bets[target] || 0) + chip;


  renderChips();

  updateTotalBet();

}


/* ============================================================
   RENDER CHIPS
============================================================ */

function renderChips() {

  document
    .querySelectorAll('.chip-on')
    .forEach(e => e.remove());


  document
    .querySelectorAll('.cell')
    .forEach(c =>
      c.classList.remove(
        'selected'
      )
    );


  for (
    const [key, amount]
    of Object.entries(bets)
  ) {

    const cell =
      document.getElementById(
        `cell-${key}`
      );


    if (!cell)
      continue;


    cell.classList.add(
      'selected'
    );


    const span =
      document.createElement(
        'span'
      );


    span.className =
      'chip-on';


    span.innerText =
      amount >= 1000
        ? (amount / 1000) + 'k'
        : amount;


    cell.appendChild(span);

  }

}


/* ============================================================
   TOTAL BET
============================================================ */

function updateTotalBet() {

  const total =
    Object.values(bets)
      .reduce(
        (a, b) => a + b,
        0
      );


  document.getElementById(
    'totalBet'
  ).innerText =
    'BDT ' + total.toFixed(2);

}


/* ============================================================
   CLEAR BETS
============================================================ */

async function clearBets() {

  if (isSpinning)
    return;


  const total =
    Object.values(bets)
      .reduce(
        (a, b) => a + b,
        0
      );


  if (total <= 0)
    return;


  balance += total;


  updateBalance();


  if (userId) {

    await supabaseClient
      .from('profiles')
      .update({
        balance: balance
      })
      .eq('id', userId);

  }


  bets = {};


  renderChips();

  updateTotalBet();

}


/* ============================================================
   REBET
============================================================ */

function repeatBet() {

  if (isSpinning)
    return;


  if (
    !Object.keys(lastBets).length
  ) {

    return;

  }


  clearBets();


  setTimeout(() => {

    for (
      const [key, value]
      of Object.entries(lastBets)
    ) {

      if (value <= balance) {

        chip = value;

        placeBet(key);

      }

    }

  }, 100);

}


/* ============================================================
   TIMER
============================================================ */

function startTimer() {

  timeLeft =
    ROUND_TIME;


  isSpinning =
    false;


  document
    .getElementById('status')
    .innerText =
    'Betting Open';


  document
    .getElementById('status')
    .className =
    'text-green-400 font-bold';


  document
    .getElementById('wheelSection')
    .classList.remove(
      'spinning'
    );


  document
    .getElementById('timer')
    .innerText =
    timeLeft.toFixed(1);


  clearInterval(timer);


  timer =
    setInterval(() => {

      timeLeft -= 0.1;


      if (
        timeLeft < 0
      ) {

        timeLeft = 0;

      }


      document
        .getElementById('timer')
        .innerText =
        timeLeft.toFixed(1);


      if (
        timeLeft <= 0
      ) {

        clearInterval(timer);

        spin();

      }

    }, 100);

}


/* ============================================================
   REAL SPIN
============================================================ */

function spin() {

  if (isSpinning)
    return;


  isSpinning =
    true;


  document
    .getElementById('status')
    .innerText =
    'No More Bets';


  document
    .getElementById('status')
    .className =
    'text-yellow-400 font-bold';


  document
    .getElementById('wheelSection')
    .classList.add(
      'spinning'
    );


  /*
    RANDOM RESULT
  */

  const resultIndex =
    secureRandomInt(
      WHEEL_ORDER.length
    );


  const result =
    WHEEL_ORDER[resultIndex];


  const total =
    WHEEL_ORDER.length;


  const anglePer =
    360 / total;


  /*
    Wheel target.
    Number-এর center pointer-এর নিচে আনা হবে।
  */

  const targetAngle =
    360 -
    (
      resultIndex * anglePer
    ) -
    (
      anglePer / 2
    );


  /*
    Previous rotation থেকে continue করবে।
  */

  const extraSpins =
    6 +
    Math.random() * 3;


  rotation +=
    extraSpins * 360 +
    targetAngle;


  /*
    BALL
    Wheel-এর বিপরীত দিকে বেশি কয়েকবার ঘুরবে।
  */

  const ballSpins =
    8 +
    Math.random() * 3;


  ballRotation -=
    ballSpins * 360;


  /*
    Apply wheel rotation
  */

  document
    .getElementById('wheel')
    .style.transform =
    `rotate(${rotation}deg)`;


  /*
    Apply ball rotation
  */

  document
    .getElementById('ballOrbit')
    .style.transform =
    `rotate(${ballRotation}deg)`;


  /*
    Result spin শেষ হওয়ার পরে
  */

  setTimeout(() => {

    finishSpin(result);

  }, SPIN_TIME * 1000);

}


/* ============================================================
   FINISH SPIN
============================================================ */

async function finishSpin(result) {

  document
    .getElementById('resultNum')
    .innerText =
    result;


  /*
    Popup
  */

  const popup =
    document.getElementById(
      'resultPopup'
    );


  popup.innerText =
    result;


  popup.classList.add(
    'show'
  );


  setTimeout(() => {

    popup.classList.remove(
      'show'
    );

  }, 1800);


  /*
    HISTORY
  */

  history.unshift(result);


  if (
    history.length > 15
  ) {

    history.pop();

  }


  renderHistory();

  updateHotCold();


  /*
    WIN
  */

  let winAmount = 0;


  for (
    const [target, amount]
    of Object.entries(bets)
  ) {

    if (
      checkWin(
        target,
        result
      )
    ) {

      winAmount +=
        amount *
        (
          getPayout(target) + 1
        );

    }

  }


  /*
    Add winnings
  */

  if (
    winAmount > 0
  ) {

    balance +=
      winAmount;


    updateBalance();


    if (userId) {

      await supabaseClient
        .from('profiles')
        .update({
          balance: balance
        })
        .eq(
          'id',
          userId
        );

    }

  }


  document
    .getElementById('lastWin')
    .innerText =
    'BDT ' +
    winAmount.toFixed(2);


  /*
    SAVE BETS
  */

  if (
    userId &&
    Object.keys(bets).length
  ) {


    for (
      const [target, amount]
      of Object.entries(bets)
    ) {


      const won =
        checkWin(
          target,
          result
        );


      let targetNumber = -1;


      /*
        Single number
      */

      if (
        target !== '00' &&
        !isNaN(target)
      ) {

        targetNumber =
          parseInt(target);

      }


      let rollResult = -1;


      if (
        result !== '00'
      ) {

        rollResult =
          parseInt(result);

      }


      await supabaseClient
        .from('bets')
        .insert([{

          user_id:
            userId,

          target_number:
            targetNumber,

          roll_result:
            rollResult,

          bet_amount:
            amount,

          payout:
            won
              ? getPayout(target)
              : 0,

          is_bool:
            won

        }]);

    }

  }


  /*
    Save previous bets
  */

  lastBets =
    {
      ...bets
    };


  /*
    Clear current bets
  */

  bets = {};


  renderChips();

  updateTotalBet();


  /*
    Wait before next round
  */

  setTimeout(() => {

    startTimer();

  }, 1800);

}


/* ============================================================
   HISTORY
============================================================ */

function renderHistory() {

  const bar =
    document.getElementById(
      'historyBar'
    );


  bar.innerHTML =
    history
      .map(n => {

        const cls =
          (
            n === 0 ||
            n === '00'
          )

            ? 'hist-green'

            : (
                RED.includes(n)
                  ? 'hist-red'
                  : 'hist-black'
              );


        return `
          <div class="hist-item ${cls}">
            ${n}
          </div>
        `;

      })
      .join('');

}


/* ============================================================
   CHECK WIN
============================================================ */

function checkWin(
  target,
  result
) {

  const r =
    result === '00'
      ? '00'
      : parseInt(result);


  /*
    Straight number
  */

  if (
    String(target) === String(r)
  ) {

    return true;

  }


  /*
    RED
  */

  if (
    target === 'red' &&
    typeof r === 'number' &&
    RED.includes(r)
  ) {

    return true;

  }


  /*
    BLACK
  */

  if (
    target === 'black' &&
    typeof r === 'number' &&
    r !== 0 &&
    !RED.includes(r)
  ) {

    return true;

  }


  /*
    EVEN
  */

  if (
    target === 'even' &&
    typeof r === 'number' &&
    r !== 0 &&
    r % 2 === 0
  ) {

    return true;

  }


  /*
    ODD
  */

  if (
    target === 'odd' &&
    typeof r === 'number' &&
    r % 2 === 1
  ) {

    return true;

  }


  /*
    1 - 18
  */

  if (
    target === '1-18' &&
    typeof r === 'number' &&
    r >= 1 &&
    r <= 18
  ) {

    return true;

  }


  /*
    19 - 36
  */

  if (
    target === '19-36' &&
    typeof r === 'number' &&
    r >= 19 &&
    r <= 36
  ) {

    return true;

  }


  /*
    1st 12
  */

  if (
    target === '1st12' &&
    typeof r === 'number' &&
    r >= 1 &&
    r <= 12
  ) {

    return true;

  }


  /*
    2nd 12
  */

  if (
    target === '2nd12' &&
    typeof r === 'number' &&
    r >= 13 &&
    r <= 24
  ) {

    return true;

  }


  /*
    3rd 12
  */

  if (
    target === '3rd12' &&
    typeof r === 'number' &&
    r >= 25 &&
    r <= 36
  ) {

    return true;

  }


  return false;

}


/* ============================================================
   PAYOUT
============================================================ */

function getPayout(target) {

  /*
    Straight number
    35:1
  */

  if (
    target === '00' ||
    (
      !isNaN(target) &&
      target !== ''
    )
  ) {

    return 35;

  }


  /*
    Dozen
    2:1
  */

  if (
    [
      '1st12',
      '2nd12',
      '3rd12'
    ].includes(target)
  ) {

    return 2;

  }


  /*
    Red / Black
    Even / Odd
    1-18 / 19-36
  */

  return 1;

}


/* ============================================================
   HOT / COLD
============================================================ */

function updateHotCold() {

  const count = {};


  history.forEach(n => {

    count[n] =
      (
        count[n] || 0
      ) + 1;

  });


  const sorted =
    Object.entries(count)
      .sort(
        (a, b) =>
          b[1] - a[1]
      );


  /*
    HOT
  */

  document
    .getElementById('hotNums')
    .innerHTML =
      sorted
        .slice(0, 5)
        .map(
          ([n]) =>
            `<span>${n}</span>`
        )
        .join(' ') || '-';


  /*
    COLD
  */

  document
    .getElementById('coldNums')
    .innerHTML =
      sorted
        .slice(-5)
        .reverse()
        .map(
          ([n]) =>
            `<span>${n}</span>`
        )
        .join(' ') || '-';

}


/* ============================================================
   START
============================================================ */

document.addEventListener(
  'DOMContentLoaded',
  init
);
