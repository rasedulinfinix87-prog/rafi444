
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Slot Lobby</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }
    h2 { color: #37e6a0; }
    input, select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 5px 0 12px;
      border-radius: 8px;
      border: 0;
    }
    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .game {
      background: #202d39;
      padding: 9px;
      border-radius: 10px;
      overflow: hidden;
    }
    .game img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 7px;
    }
    .name { font-weight: bold; margin: 8px 0; }
    button {
      width: 100%;
      padding: 10px;
      background: #16b978;
      color: white;
      border: 0;
      border-radius: 7px;
    }
    #status { color: #ffd166; }
  </style>
</head>
<body>
  <h2>🎰 My Slot Lobby</h2>
  <input id="search" placeholder="গেমের নাম লিখুন...">
  <select id="provider">
    <option value="">সব Provider</option>
  </select>
  <p id="status">গেম লোড হচ্ছে...</p>
  <div class="games" id="games"></div>

  <script>
    const API = "https://demo.slotindex.io/api/slots";
    const BASE = "https://demo.slotindex.io";
    let slots = [];

    const games = document.getElementById("games");
    const search = document.getElementById("search");
    const provider = document.getElementById("provider");
    const status = document.getElementById("status");

    async function init() {
      try {
        const response = await fetch(API);
        if (!response.ok) throw new Error("API error");
        slots = await response.json();

        const providers = [...new Set(
          slots.map(s => s.provider).filter(Boolean)
        )].sort();

        providers.forEach(p => {
          const option = document.createElement("option");
          option.value = p;
          option.textContent = p;
          provider.appendChild(option);
        });

        status.textContent = slots.length + " টি গেম পাওয়া গেছে";
        render();
      } catch (error) {
        status.textContent =
          "গেম লোড হয়নি। ইন্টারনেট, API বা CORS পরীক্ষা করুন।";
      }
    }

    function render() {
      games.replaceChildren();
      const q = search.value.toLowerCase();

      const filtered = slots.filter(s =>
        (s.name || "").toLowerCase().includes(q) &&
        (!provider.value || s.provider === provider.value)
      );

      filtered.slice(0, 100).forEach(s => {
        const card = document.createElement("div");
        card.className = "game";

        const img = document.createElement("img");
        if (s.thumbnail_url) {
          img.src = s.thumbnail_url.startsWith("https://")
            ? s.thumbnail_url
            : BASE + s.thumbnail_url;
        }
        img.alt = s.name || "Slot game";
        img.loading = "lazy";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = s.name || "Unnamed game";

        const studio = document.createElement("p");
        studio.textContent = s.provider || "Unknown provider";

        card.append(img, name, studio);

        if (s.has_demo && s.embed_url &&
            s.embed_url.startsWith(BASE + "/embed/")) {
          const btn = document.createElement("button");
          btn.textContent = "Play Demo";
          btn.onclick = () => {
            window.open(s.embed_url, "_blank", "noopener");
          };
          card.appendChild(btn);
        } else {
          const note = document.createElement("p");
          note.textContent = "Demo unavailable";
          card.appendChild(note);
        }

        games.appendChild(card);
      });

      if (!filtered.length) {
        status.textContent = "কোনো গেম পাওয়া যায়নি।";
      } else {
        status.textContent =
          filtered.length + " টি গেম · প্রথম 100 টি দেখানো হচ্ছে";
      }
    }

    search.addEventListener("input", render);
    provider.addEventListener("change", render);
    init();
  </script>
</body>
</html>
