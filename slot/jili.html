<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jili Super Ace - Custom Cards Demo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your Supabase Config -->
    <script src="supabase-config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #1f1c2c 0%, #0c0915 100%);
        }
        .card-slot {
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between">

    <!-- Top Navigation / Header -->
    <header class="bg-gray-900/90 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center px-6">
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-bold text-amber-400 tracking-wider">SUPER ACE (JILI)</h1>
        </div>
        <div class="flex items-center space-x-4">
            <div class="bg-gray-800 border border-gray-700 px-4 py-2 rounded-lg flex items-center space-x-2 shadow-inner">
                <span class="text-gray-400 text-sm">Balance:</span>
                <span id="user-balance" class="text-amber-400 font-bold text-lg">Loading...</span>
            </div>
            <button onclick="logoutUser()" class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded-lg text-sm font-semibold transition">Logout</button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-gray-950 border-4 border-amber-500/60 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            
            <!-- Glowing Top Bar -->
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-amber-500 via-yellow-300 to-amber-500 animate-pulse"></div>

            <!-- Super Ace Slot Grid (4 Columns x 3 Rows / Simplified to 3x3 for clean view, or custom card display) -->
            <div class="grid grid-cols-3 gap-3 my-6">
                <!-- Column 1 -->
                <div class="card-slot h-36 rounded-xl flex items-center justify-center border border-gray-700 overflow-hidden p-2">
                    <img id="card-0" src="" alt="Card" class="w-full h-full object-contain transform transition duration-300">
                </div>
                <!-- Column 2 -->
                <div class="card-slot h-36 rounded-xl flex items-center justify-center border border-gray-700 overflow-hidden p-2">
                    <img id="card-1" src="" alt="Card" class="w-full h-full object-contain transform transition duration-300">
                </div>
                <!-- Column 3 -->
                <div class="card-slot h-36 rounded-xl flex items-center justify-center border border-gray-700 overflow-hidden p-2">
                    <img id="card-2" src="" alt="Card" class="w-full h-full object-contain transform transition duration-300">
                </div>
            </div>

            <!-- Game Message / Win Info -->
            <div id="game-message" class="text-center h-10 text-amber-300 font-semibold text-lg mb-4 flex items-center justify-center">
                Place your bet and hit Spin!
            </div>

            <!-- Controls & Betting Panel -->
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3 w-full sm:w-auto justify-center">
                    <span class="text-sm text-gray-400">Bet:</span>
                    <button onclick="changeBet(-10)" class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded text-lg font-bold text-amber-400">-</button>
                    <span id="bet-amount" class="text-xl font-bold text-amber-400 w-20 text-center">50</span>
                    <button onclick="changeBet(10)" class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded text-lg font-bold text-amber-400">+</button>
                </div>

                <button id="spin-btn" onclick="spinCards()" class="w-full sm:w-auto bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-gray-950 font-extrabold px-10 py-3 rounded-xl shadow-lg transform active:scale-95 transition tracking-wide">
                    SPIN
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-500 border-t border-gray-900">
        &copy; 2026 Jili Super Ace Custom Simulation. All rights reserved.
    </footer>

    <!-- Game & Supabase Integration Logic -->
    <script>
        let currentUser = null;
        let currentBalance = 0;
        let currentBet = 50;

        // আপনার নিজের কার্ডের PNG ফাইলের পাথ বা লিংকগুলো এখানে বসাবেন। 
        // আপনি চাইলে যত খুশি কার্ড ইমেজ এখানে যুক্ত করতে পারেন।
        const customCardImages = [
            "assets/cards/ace_spades.png",    // উদাহরণ পাথ ১
            "assets/cards/king_hearts.png",   // উদাহরণ পাথ ২
            "assets/cards/queen_clubs.png",   // উদাহরণ পাথ ৩
            "assets/cards/jack_diamonds.png", // উদাহরণ পাথ ৪
            "assets/cards/joker.png"          // উদাহরণ পাথ ৫ (ওয়াইল্ড কার্ড)
        ];

        // যদি আপনার কাছে লোকাল ইমেজ না থাকে, তবে টেস্টের জন্য নিচের ডেমো কার্ড ইমেজ লিংকগুলো ব্যবহার করতে পারেন:
        const fallbackCards = [
            "https://upload.wikimedia.org/wikipedia/commons/3/30/Playing_card_spade_A.svg",
            "https://upload.wikimedia.org/wikipedia/commons/4/46/Playing_card_heart_K.svg",
            "https://upload.wikimedia.org/wikipedia/commons/2/22/Playing_card_club_Q.svg",
            "https://upload.wikimedia.org/wikipedia/commons/1/18/Playing_card_diamond_J.svg",
            "https://upload.wikimedia.org/wikipedia/commons/5/54/Playing_card_red_joker.svg"
        ];

        // setActiveCards pool (যদি কাস্টম ইমেজ না থাকে তবে ফলব্যাক ব্যবহার হবে)
        const activeCards = customCardImages[0].includes("assets") ? fallbackCards : customCardImages;

        // Initialize Page & Authenticate User
        window.addEventListener("DOMContentLoaded", async () => {
            currentUser = await requireAuth();
            if (currentUser) {
                await fetchAndUpdateBalance();
                setInitialCards();
            }
        });

        function setInitialCards() {
            document.getElementById("card-0").src = activeCards[0];
            document.getElementById("card-1").src = activeCards[1];
            document.getElementById("card-2").src = activeCards[2];
        }

        // Fetch User Balance from Supabase profiles table
        async function fetchAndUpdateBalance() {
            try {
                const profile = await getUserProfile(currentUser.id);
                if (profile && profile.balance !== undefined) {
                    currentBalance = Number(profile.balance);
                } else {
                    currentBalance = 1000;
                }
                document.getElementById("user-balance").innerText = currentBalance.toLocaleString();
            } catch (err) {
                console.error("Failed to fetch balance:", err);
                document.getElementById("user-balance").innerText = "Error";
            }
        }

        // Adjust Bet Amount
        function changeBet(amount) {
            currentBet += amount;
            if (currentBet < 10) currentBet = 10;
            if (currentBet > currentBalance && currentBalance > 0) currentBet = currentBalance;
            document.getElementById("bet-amount").innerText = currentBet;
        }

        // Spin Logic with Animation
        async function spinCards() {
            if (currentBalance < currentBet) {
                document.getElementById("game-message").innerText = "❌ Insufficient balance!";
                return;
            }

            const spinBtn = document.getElementById("spin-btn");
            spinBtn.disabled = true;
            document.getElementById("game-message").innerText = "🔄 Spinning cards...";

            // Deduct bet from local balance temporarily
            currentBalance -= currentBet;
            document.getElementById("user-balance").innerText = currentBalance.toLocaleString();

            // Shuffle animation effect
            let animCount = 0;
            const animInterval = setInterval(() => {
                document.getElementById("card-0").src = activeCards[Math.floor(Math.random() * activeCards.length)];
                document.getElementById("card-1").src = activeCards[Math.floor(Math.random() * activeCards.length)];
                document.getElementById("card-2").src = activeCards[Math.floor(Math.random() * activeCards.length)];
                animCount++;

                if (animCount > 12) {
                    clearInterval(animInterval);
                    finalizeSpinResult();
                }
            }, 90);
        }

        // Finalize Result & Save to Supabase (profiles & original_bets_history)
        async function finalizeSpinResult() {
            const c1 = activeCards[Math.floor(Math.random() * activeCards.length)];
            const c2 = activeCards[Math.floor(Math.random() * activeCards.length)];
            const c3 = activeCards[Math.floor(Math.random() * activeCards.length)];

            document.getElementById("card-0").src = c1;
            document.getElementById("card-1").src = c2;
            document.getElementById("card-2").src = c3;

            let multiplier = 0;
            let winAmount = 0;
            let message = "";
            let status = "lost";

            // Win condition logic (Super Ace style matching)
            if (c1 === c2 && c2 === c3) {
                multiplier = 5; // 5x Multiplier
                winAmount = currentBet * multiplier;
                message = `🎉 SUPER ACE JACKPOT! Won ${winAmount} coins! (${multiplier}X)`;
                status = "win";
            } else if (c1 === c2 || c2 === c3 || c1 === c3) {
                multiplier = 2; // 2x Multiplier
                winAmount = currentBet * multiplier;
                message = `✨ Combo Hit! Won ${winAmount} coins! (${multiplier}X)`;
                status = "win";
            } else {
                message = "😢 No match. Better luck next time!";
                status = "lost";
            }

            currentBalance += winAmount;
            document.getElementById("user-balance").innerText = currentBalance.toLocaleString();
            document.getElementById("game-message").innerText = message;

            // Update Database in Supabase
            try {
                // 1. Update profiles table (balance & turnover if applicable)
                const profileUpdate = { balance: currentBalance };
                
                const { error: profileError } = await supabaseClient
                    .from("profiles")
                    .update(profileUpdate)
                    .eq("id", currentUser.id);

                if (profileError) {
                    console.error("Error updating profile balance:", profileError);
                }

                // 2. Insert record into original_bets_history table
                const { error: historyError } = await supabaseClient
                    .from("original_bets_history")
                    .insert([{
                        user_id: currentUser.id,
                        game_name: "Jili Super Ace",
                        bet_amount: currentBet,
                        payout: winAmount,
                        multiplier: multiplier,
                        status: status,
                        game_details: { cards: [c1, c2, c3] }
                    }]);

                if (historyError) {
                    console.error("Error saving bet history:", historyError);
                }

            } catch (err) {
                console.error("Database sync error:", err);
            }

            document.getElementById("spin-btn").disabled = false;
        }
    </script>
</body>
</html>
