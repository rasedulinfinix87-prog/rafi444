<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Ace Slot</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

  <!-- Top Header / Balance Bar -->
  <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <a href="../index.html" class="bg-slate-700 px-3 py-1.5 rounded text-sm hover:bg-slate-600 transition">← Home</a>
      <h1 class="font-bold text-lg text-amber-400">Super Ace Slot</h1>
    </div>
    <div class="bg-slate-900 px-4 py-1.5 rounded-full border border-slate-700 flex items-center space-x-2">
      <span class="text-xs text-slate-400">Balance:</span>
      <span id="userBalance" class="font-bold text-emerald-400">0.00</span>
    </div>
  </header>

  <!-- Main Slot Machine Container -->
  <main class="flex-grow flex flex-col items-center justify-center p-4">
    <div class="bg-slate-800 border-4 border-amber-500/50 rounded-2xl p-6 shadow-2xl w-full max-w-md text-center">
      
      <!-- Slot Reels Display Area -->
      <div class="grid grid-cols-4 gap-3 bg-slate-950 p-4 rounded-xl mb-6 border border-slate-700">
        <div class="reel bg-slate-900 h-24 flex items-center justify-center text-4xl rounded-lg border border-slate-800 shadow-inner">👑</div>
        <div class="reel bg-slate-900 h-24 flex items-center justify-center text-4xl rounded-lg border border-slate-800 shadow-inner">💎</div>
        <div class="reel bg-slate-900 h-24 flex items-center justify-center text-4xl rounded-lg border border-slate-800 shadow-inner">⭐</div>
        <div class="reel bg-slate-900 h-24 flex items-center justify-center text-4xl rounded-lg border border-slate-800 shadow-inner">🍇</div>
      </div>

      <!-- Result / Status Message -->
      <div id="gameMessage" class="h-8 text-sm font-medium text-amber-300 mb-4 flex items-center justify-center">
        Set your bet and spin to win!
      </div>

      <!-- Bet Controls -->
      <div class="mb-5 flex flex-col items-center space-y-2">
        <label for="betAmountInput" class="text-xs text-slate-400 uppercase tracking-wider">Bet Amount</label>
        <div class="flex items-center space-x-2">
          <button onclick="adjustBet(-10)" class="bg-slate-700 px-3 py-1 rounded hover:bg-slate-600 font-bold">-</button>
          <input type="number" id="betAmountInput" value="20" min="1" class="w-28 bg-slate-900 text-center text-lg font-bold py-1 rounded border border-slate-700 text-amber-400 focus:outline-none">
          <button onclick="adjustBet(10)" class="bg-slate-700 px-3 py-1 rounded hover:bg-slate-600 font-bold">+</button>
        </div>
      </div>

      <!-- Spin Button -->
      <button id="spinBtn" onclick="playSuperAceSlot()" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-extrabold text-xl py-3 rounded-xl shadow-lg hover:from-amber-400 hover:to-yellow-400 transition transform active:scale-95">
        SPIN NOW
      </button>

    </div>
  </main>

  <!-- Footer Navigation Bar -->
  <footer class="bg-slate-800 p-3 text-center text-xs text-slate-400 border-t border-slate-700">
    &copy; Rasi Shop &bull; Super Ace Slot Integration
  </footer>

  <!-- Supabase Configuration & Game Logic Script -->
  <script src="../supabase-config.js"></script>
  <script>
    let currentUser = null;
    let userProfile = null;

    // Symbols used for slot spin animation/display
    const slotSymbols = ['👑', '💎', '⭐', '🍇', '🔔', '🍊', '🍉'];

    window.addEventListener('DOMContentLoaded', async () => {
      currentUser = await requireAuth();
      if (currentUser) {
        await loadUserProfileData();
      }
    });

    async function loadUserProfileData() {
      userProfile = await getUserProfile(currentUser.id);
      if (userProfile) {
        document.getElementById('userBalance').innerText = Number(userProfile.balance || 0).toFixed(2);
      }
    }

    function adjustBet(amount) {
      const input = document.getElementById('betAmountInput');
      let currentVal = parseFloat(input.value) || 0;
      currentVal += amount;
      if (currentVal < 1) currentVal = 1;
      input.value = currentVal;
    }

    async function playSuperAceSlot() {
      if (!currentUser || !userProfile) {
        alert("Session expired. Please login again.");
        window.location.href = "../login-signup.html";
        return;
      }

      const betInput = document.getElementById('betAmountInput');
      const betAmount = parseFloat(betInput.value);
      const currentBalance = parseFloat(userProfile.balance || 0);

      const msgEl = document.getElementById('gameMessage');
      const spinBtn = document.getElementById('spinBtn');

      if (isNaN(betAmount) || betAmount <= 0) {
        msgEl.innerText = "Please enter a valid bet amount!";
        return;
      }

      if (currentBalance < betAmount) {
        msgEl.innerText = "Insufficient balance!";
        return;
      }

      // Disable button during spin execution
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50');
      msgEl.innerText = "Spinning...";

      // Randomize symbols for visual effect
      const reels = document.querySelectorAll('.reel');
      let shuffleInterval = setInterval(() => {
        reels.forEach(reel => {
          const randomSym = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
          reel.innerText = randomSym;
        });
      }, 80);

      setTimeout(async () => {
        clearInterval(shuffleInterval);

        // Simple Win/Loss Calculation Logic
        // 40% win chance simulation
        const isWin = Math.random() < 0.40;
        let multiplier = 0;
        let payout = 0;

        // Final result symbols generation
        const finalSymbols = [];
        for (let i = 0; i < 4; i++) {
          finalSymbols.push(slotSymbols[Math.floor(Math.random() * slotSymbols.length)]);
        }
        reels.forEach((reel, idx) => {
          reel.innerText = finalSymbols[idx];
        });

        if (isWin) {
          multiplier = [2, 3, 5, 10][Math.floor(Math.random() * 4)];
          payout = betAmount * multiplier;
          msgEl.innerText = `Congratulations! You won ${payout.toFixed(2)} (${multiplier}X)`;
        } else {
          payout = 0;
          msgEl.innerText = "Try again! Better luck next time.";
        }

        const newBalance = currentBalance - betAmount + payout;

        try {
          // Update profile balance in Supabase
          const { error: updateError } = await supabaseClient
            .from('profiles')
            .update({ balance: newBalance })
            .eq('id', currentUser.id);

          if (updateError) {
            console.error("Balance update error:", updateError);
          }

          // Insert record into original_bets_history (automatically handles wagering & VIP point additions via interceptor)
          await supabaseClient
            .from('original_bets_history')
            .insert([{
              user_id: currentUser.id,
              game_name: 'Super Ace Slot',
              bet_amount: betAmount,
              payout: payout,
              multiplier: multiplier,
              status: isWin ? 'win' : 'loss',
              game_details: { symbols: finalSymbols }
            }]);

          // Refresh user profile data locally
          await loadUserProfileData();

        } catch (err) {
          console.error("Database transaction error:", err);
        }

        // Re-enable spin button
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50');

      }, 1200);
    }
  </script>
</body>
</html>
