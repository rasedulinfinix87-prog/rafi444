<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Ace Game</title>
  <style>
    /* স্বাভাবিক রিসেট যাতে রিফ্রেশ বা ব্রাউজার ফিচারে সমস্যা না হয় */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #030d12;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* গেমের মূল কন্টেইনার (মোবাইল ফ্রেম ফিট করার জন্য) */
    .game-container {
      /* Use the entire visible mobile viewport; no 410px/780px cap. */
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: none;
      max-height: none;
      flex: 0 0 100%;
      background: #030d12 url('slot/image/full_layout.png') no-repeat center center;
      background-size: 100% 100%;
      position: relative;
      overflow: hidden;
      box-shadow: none;
    }

    /* If this HTML is already inside the /slot folder, use its local image folder. */
    .game-container.asset-local {
      background-image: url('image/full_layout.png');
    }

    /* ৪x৫ গ্রিড বোর্ডের নিখুঁত পজিশন */
    .slot-board {
      position: absolute;
      top: 28.5%;
      left: 7.5%;
      width: 85%;
      height: 42%;
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }

    /* প্রতিটি কলাম (Reel Column) */
    .reel-column {
      width: 18%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .reel-inner {
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* কার্ডের স্টাইল */
    .card {
      width: 100%;
      height: 23.5%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 4px;
    }

    /* ড্রপ অ্যানিমেশন */
    @keyframes dropDown {
      0% {
        transform: translateY(-100%);
      }
      100% {
        transform: translateY(0);
      }
    }

    .drop-animate {
      animation: dropDown 0.3s ease-out forwards;
    }

    /* স্পিন বাটন এরিয়া */
    .controls {
      position: absolute;
      bottom: 4.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 20%;
      height: 11%;
    }

    .spin-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    @media (max-height: 620px) {
      .slot-board { top: 27%; height: 43%; }
      .controls { bottom: 3%; height: 10%; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- ৪x৫ কার্ড গ্রিড বোর্ড -->
    <div class="slot-board">
      <div class="reel-column"><div class="reel-inner" id="col-0"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-1"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-2"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-3"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-4"></div></div>
    </div>

    <!-- স্পিন বাটন -->
    <div class="controls">
      <button class="spin-btn" onclick="spinReels()"></button>
    </div>
  </div>

  <script>
    // Try /slot/image/full_layout.png first, then image/full_layout.png for HTML hosted inside /slot.
    (() => {
      const game = document.querySelector('.game-container');
      const test = new Image();
      test.onload = () => {};
      test.onerror = () => game.classList.add('asset-local');
      test.src = new URL('slot/image/full_layout.png', document.baseURI).href;
    })();

    // কার্ড এবং সিম্বলের তালিকা
    const cardTypes = [
      'image/card_ace.png',
      'image/card_king.png',
      'image/card_queen.png',
      'image/card_jack.png',
      'image/card_scatter.png',
      'image/card_heart.png',
      'image/card_club.png'
    ];

    // বোর্ড ইনিশিয়ালাইজেশন
    function initBoard() {
      for (let col = 0; col < 5; col++) {
        const colDiv = document.getElementById(`col-${col}`);
        colDiv.innerHTML = '';
        for (let row = 0; row < 4; row++) {
          const card = document.createElement('div');
          card.className = 'card';
          const randomCard = cardTypes[Math.floor(Math.random() * cardTypes.length)];
          card.style.backgroundImage = `url('${randomCard}')`;
          colDiv.appendChild(card);
        }
      }
    }

    // স্পিন ফাংশন এবং অ্যানিমেশন
    function spinReels() {
      for (let col = 0; col < 5; col++) {
        const colDiv = document.getElementById(`col-${col}`);
        
        setTimeout(() => {
          colDiv.classList.remove('drop-animate');
          void colDiv.offsetWidth;
          
          const cards = colDiv.querySelectorAll('.card');
          cards.forEach(card => {
            const randomCard = cardTypes[Math.floor(Math.random() * cardTypes.length)];
            card.style.backgroundImage = `url('${randomCard}')`;
          });

          colDiv.classList.add('drop-animate');
        }, col * 60);
      }
    }

    window.onload = initBoard;
  </script>
</body>
</html>
