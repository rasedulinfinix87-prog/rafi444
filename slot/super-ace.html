<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Balloon Game - Raseshop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: sans-serif;
        }
        .game-card {
            background-color: #1c2541;
            border: 1px solid #3a506b;
        }
        #balloon-element {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-16">

    <!-- Header / Top Bar -->
    <header class="bg-[#1c2541] p-4 shadow-md flex justify-between items-center border-b border-[#3a506b]">
        <h1 class="text-lg font-bold text-blue-400">Crash Game</h1>
        <div class="bg-[#0b132b] px-3 py-1.5 rounded-lg text-xs border border-[#3a506b]">
            Balance: <span id="user-balance" class="font-bold text-green-400">0.00</span> USDT
        </div>
    </header>

    <!-- Main Game Section -->
    <main class="flex-grow flex flex-col items-center justify-center p-3">
        <div class="w-full max-w-sm game-card rounded-2xl p-4 shadow-xl flex flex-col items-center">
            
            <!-- Balloon Graphic & Multiplier Area -->
            <div class="relative w-full h-44 flex flex-col items-center justify-center mb-4">
                <div id="balloon-element" class="relative w-28 h-32 bg-blue-600 rounded-[50%_50%_50%_50%/40%_40%_60%_60%] flex flex-col items-center justify-center shadow-[0_0_20px_rgba(37,99,235,0.5)] scale-100">
                    <div class="absolute top-3 right-4 w-2.5 h-2.5 bg-white/60 rounded-full"></div>
                    <span id="multiplier-display" class="text-2xl font-extrabold text-white">1.00x</span>
                </div>
                <div class="w-2 h-3 bg-blue-500"></div>
                <div class="w-28 h-10 bg-[#23304a] rounded-t-xl relative flex items-center justify-center border-t border-[#3a506b] shadow-inner mt-0.5">
                    <div class="absolute left-3 flex gap-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-slate-500"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-slate-500"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-slate-500"></div>
                    </div>
                </div>
                <div class="w-64 h-2 bg-[#131b2e] rounded-full -mt-1"></div>
            </div>

            <!-- Recent Multipliers Buttons -->
            <div class="grid grid-cols-3 gap-2 mb-4 w-full">
                <button class="bg-[#23304a] text-slate-300 py-1.5 rounded-lg text-xs font-semibold border border-[#3a506b]">1.00×</button>
                <button class="bg-[#23304a] text-slate-300 py-1.5 rounded-lg text-xs font-semibold border border-[#3a506b]">1.14×</button>
                <button class="bg-[#23304a] text-slate-300 py-1.5 rounded-lg text-xs font-semibold border border-[#3a506b]">1.31×</button>
            </div>

            <!-- Bet Button -->
            <button id="bet-action-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg mb-4 text-sm">
                Bet
            </button>

            <!-- Bet Amount Section -->
            <div class="w-full flex flex-col gap-1.5 mb-3">
                <div class="flex justify-between text-xs text-slate-400 px-1">
                    <span>Bet Amount</span>
                    <span id="amount-usd">$0.00</span>
                </div>
                <div class="flex items-center bg-[#0b132b] rounded-xl border border-[#3a506b] overflow-hidden px-3 py-2">
                    <input type="number" id="bet-amount" value="1.00000000" step="0.01" class="bg-transparent w-full outline-none text-white text-sm">
                    <div class="bg-green-600 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold text-white ml-2">₮</div>
                    <div class="flex items-center gap-2 ml-3 pl-3 border-l border-[#3a506b] text-xs font-bold text-slate-300">
                        <button id="btn-half" class="hover:text-white px-1">½</button>
                        <span class="text-slate-600">|</span>
                        <button id="btn-double" class="hover:text-white px-1">2×</button>
                    </div>
                </div>
            </div>

            <!-- Pump / Cashout Button -->
            <button id="pump-btn" class="w-full bg-[#23304a] text-slate-400 font-bold py-3 rounded-xl transition-all border border-[#3a506b] text-sm cursor-not-allowed" disabled>
                Pump
            </button>

        </div>
    </main>

    <!-- Bottom Navigation Bar Container -->
    <div id="bottom-bar-container">
        <div id="included-bottom"></div>
    </div>

    <!-- Configuration and Game Logic Scripts -->
    <script src="../supabase-config.js"></script>
    <script>
        let currentUser = null;
        let currentBetId = null;
        let multiplierSteps = [
            1.00, 1.14, 1.31, 1.49, 1.79, 2.10, 2.44, 2.96, 3.61, 4.23, 
            5.10, 6.50, 8.80, 11.30, 15.66, 19.99, 29.91, 46.77, 74.21, 
            122.32, 250.44, 701.34, 2653.00
        ];
        let currentStepIndex = 0;
        let isGameActive = false;

        async function initGame() {
            currentUser = await requireAuth();
            if (!currentUser) return;

            const profile = await getUserProfile(currentUser.id);
            if (profile) {
                document.getElementById('user-balance').innerText = Number(profile.balance || 0).toFixed(2);
            }
        }

        async function loadBottomBar() {
            try {
                const res = await fetch('../bar/bottom.html');
                if (res.ok) {
                    const html = await res.text();
                    document.getElementById('included-bottom').innerHTML = html;
                }
            } catch (e) {
                console.log('Bottom bar load error:', e);
            }
        }

        document.getElementById('btn-half').addEventListener('click', () => {
            if (isGameActive) return;
            const input = document.getElementById('bet-amount');
            let val = parseFloat(input.value) || 0;
            input.value = Math.max(1, val / 2).toFixed(8);
            document.getElementById('amount-usd').innerText = '$' + parseFloat(input.value).toFixed(2);
        });

        document.getElementById('btn-double').addEventListener('click', () => {
            if (isGameActive) return;
            const input = document.getElementById('bet-amount');
            let val = parseFloat(input.value) || 0;
            input.value = (val * 2).toFixed(8);
            document.getElementById('amount-usd').innerText = '$' + parseFloat(input.value).toFixed(2);
        });

        document.getElementById('bet-amount').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value) || 0;
            document.getElementById('amount-usd').innerText = '$' + val.toFixed(2);
        });

        // Bet Button Click -> Start Game & Activate Pump Button Immediately
        document.getElementById('bet-action-btn').addEventListener('click', async () => {
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            if (!currentUser || isNaN(betAmount) || betAmount < 1) {
                alert('সঠিক বেট অ্যামাউন্ট দিন (কমপক্ষে ১)।');
                return;
            }

            const { data, error } = await supabaseClient
                .from('original_bets_history')
                .insert([{
                    user_id: currentUser.id,
                    game_name: 'crash',
                    bet_amount: betAmount,
                    payout: 0,
                    multiplier: 1.00,
                    status: 'pending',
                    game_details: { type: 'crash_balloon_pump' }
                }])
                .select()
                .single();

            if (error) {
                console.error('Bet error:', error);
                alert('বেট শুরু করতে সমস্যা হয়েছে।');
            } else {
                currentBetId = data.id;
                isGameActive = true;
                currentStepIndex = 0;

                // Lock bet amount input & bet button
                document.getElementById('bet-amount').disabled = true;
                document.getElementById('bet-action-btn').disabled = true;
                document.getElementById('bet-action-btn').classList.add('opacity-50', 'cursor-not-allowed');

                // Automatically activate and style the Pump button
                const pumpBtn = document.getElementById('pump-btn');
                pumpBtn.disabled = false;
                pumpBtn.classList.remove('bg-[#23304a]', 'text-slate-400', 'cursor-not-allowed');
                pumpBtn.classList.add('bg-green-600', 'hover:bg-green-500', 'text-white', 'shadow-lg');
                pumpBtn.innerText = "Pump / Cash Out";

                updateMultiplierDisplay();
            }
        });

        // Pump Button Click -> Increases Multiplier Step-by-Step, or Cash Out if clicked again at desired stage
        document.getElementById('pump-btn').addEventListener('click', async () => {
            if (!isGameActive) return;

            if (currentStepIndex < multiplierSteps.length - 1) {
                currentStepIndex++;
                updateMultiplierDisplay();
            } else {
                // If maximum limit reached, trigger cash out automatically
                await cashOutGame();
            }
        });

        function updateMultiplierDisplay() {
            const currentMultiplier = multiplierSteps[currentStepIndex];
            document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + 'x';

            // Scale balloon smoothly as it pumps up
            const scaleValue = 1 + (currentStepIndex * 0.03);
            document.getElementById('balloon-element').style.transform = `scale(${scaleValue})`;
        }

        async function cashOutGame() {
            if (!isGameActive || !currentBetId) return;

            const finalMultiplier = multiplierSteps[currentStepIndex];
            const betAmount = parseFloat(document.getElementById('bet-amount').value);
            const payout = betAmount * finalMultiplier;

            // Update Supabase History Table with win status, multiplier and payout
            const { error } = await supabaseClient
                .from('original_bets_history')
                .update({
                    multiplier: finalMultiplier,
                    payout: payout,
                    status: 'win'
                })
                .eq('id', currentBetId);

            if (error) {
                console.error('Cashout error:', error);
                alert('ক্যাশআউট আপডেট করতে সমস্যা হয়েছে।');
            } else {
                alert(`সফলভাবে ক্যাশআউট হয়েছে! মাল্টিপ্লায়্যার: ${finalMultiplier}x, পেআউট: ${payout.toFixed(2)} USDT`);
                resetGameUI();
                initGame();
            }
        }

        function resetGameUI() {
            isGameActive = false;
            currentBetId = null;
            currentStepIndex = 0;

            document.getElementById('bet-amount').disabled = false;
            const betBtn = document.getElementById('bet-action-btn');
            betBtn.disabled = false;
            betBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            const pumpBtn = document.getElementById('pump-btn');
            pumpBtn.disabled = true;
            pumpBtn.classList.remove('bg-green-600', 'hover:bg-green-500', 'text-white', 'shadow-lg');
            pumpBtn.classList.add('bg-[#23304a]', 'text-slate-400', 'cursor-not-allowed');
            pumpBtn.innerText = "Pump";

            document.getElementById('multiplier-display').innerText = "1.00x";
            document.getElementById('balloon-element').style.transform = 'scale(1)';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initGame();
            loadBottomBar();
            document.getElementById('amount-usd').innerText = '$' + parseFloat(document.getElementById('bet-amount').value).toFixed(2);
        });
    </script>
</body>
</html>
