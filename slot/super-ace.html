<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Ace Slot Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1a20;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .game-container {
      width: 360px;
      height: 640px;
      background: linear-gradient(180deg, #0d2c38 0%, #03131a 100%);
      border: 4px solid #b8860b;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ১. টপ ডিসপেন্সার এবং মাল্টিপ্লায়ার স্ট্রিপ (z-index: 10) */
    .dispenser-header {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      height: 110px;
      background: url('dispenser_header.png') no-repeat center top;
      background-size: contain;
      z-index: 10; /* কার্ড যেন এর পেছন দিয়ে বের হয় */
      pointer-events: none;
    }

    /* ২. মূল গ্রিড বোর্ড (৫ কলাম) */
    .slot-board {
      position: absolute;
      top: 110px;
      width: 340px;
      height: 380px;
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }

    /* প্রতিটি কলাম (Reel Column) */
    .reel-column {
      width: 64px;
      height: 100%;
      position: relative;
      overflow: hidden; /* বাইরে কার্ড দেখা যাবে না */
    }

    .reel-inner {
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ৩. কার্ড আইটেম */
    .card {
      width: 64px;
      height: 85px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      background-color: #e6e6e6;
    }

    /* কার্ড স্লাইড ডাউন অ্যানিমেশন */
    @keyframes dropDown {
      0% {
        transform: translateY(-380px);
      }
      100% {
        transform: translateY(0);
      }
    }

    .drop-animate {
      animation: dropDown 0.5s ease-out forwards;
    }

    /* ৪. স্পিন বাটন কন্ট্রোল */
    .controls {
      position: absolute;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    .spin-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
      border: 3px solid #fff;
      font-size: 18px;
      font-weight: bold;
      color: #5a0000;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .spin-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- ১. কার্ড ডিসপেন্সার ও মাল্টিপ্লায়ার হেডার -->
    <div class="dispenser-header"></div>

    <!-- ২. ৫ কলামের কার্ড স্লট বোর্ড -->
    <div class="slot-board">
      <div class="reel-column"><div class="reel-inner" id="col-0"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-1"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-2"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-3"></div></div>
      <div class="reel-column"><div class="reel-inner" id="col-4"></div></div>
    </div>

    <!-- ৩. স্পিন বাটন -->
    <div class="controls">
      <button class="spin-btn" onclick="spinReels()">SPIN</button>
    </div>
  </div>

  <script>
    // কার্ডের ইমেজের ইউআরএল বা সোর্স (এখানে নমুনা হিসেবে কার্ডের নাম দেওয়া হলো)
    const cardTypes = [
      'card_ace.png',
      'card_king.png',
      'card_queen.png',
      'card_jack.png',
      'card_scatter.png',
      'card_heart.png',
      'card_club.png'
    ];

    // বোর্ড প্রাথমিক তৈরি (Init)
    function initBoard() {
      for (let col = 0; col < 5; col++) {
        const colDiv = document.getElementById(`col-${col}`);
        colDiv.innerHTML = '';
        for (let row = 0; row < 4; row++) {
          const card = document.createElement('div');
          card.className = 'card';
          // র‍্যান্ডম কার্ড সেট করা
          const randomCard = cardTypes[Math.floor(Math.random() * cardTypes.length)];
          card.style.backgroundImage = `url('${randomCard}')`;
          colDiv.appendChild(card);
        }
      }
    }

    // স্পিন বাটন ক্লিক করলে ড্রপ অ্যানিমেশন
    function spinReels() {
      for (let col = 0; col < 5; col++) {
        const colDiv = document.getElementById(`col-${col}`);
        
        // কলাম অনুযায়ী কিছুটা সময়ের ব্যবধান (Stagger Effect)
        setTimeout(() => {
          colDiv.classList.remove('drop-animate');
          void colDiv.offsetWidth; // Trigger Reflow
          
          // নতুন কার্ড সেট করা
          const cards = colDiv.querySelectorAll('.card');
          cards.forEach(card => {
            const randomCard = cardTypes[Math.floor(Math.random() * cardTypes.length)];
            card.style.backgroundImage = `url('${randomCard}')`;
          });

          colDiv.classList.add('drop-animate');
        }, col * 100);
      }
    }

    // গেম শুরু হওয়ার সাথে সাথে বোর্ড তৈরি
    window.onload = initBoard;
  </script>
</body>
</html>
