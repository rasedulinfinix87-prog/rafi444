<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Ace Slot</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase Client & App Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      background: #090d16;
      color: #ffffff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    .slot-frame {
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      border: 3px solid #d4af37;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.4);
    }

    .multiplier-bar {
      background: linear-gradient(90deg, #b45309 0%, #f59e0b 50%, #b45309 100%);
      border: 2px solid #fef08a;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 5px;
      background: #020617;
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #334155;
    }

    /* Real Printed Playing Card CSS Styling */
    .slot-card {
      aspect-ratio: 3/4;
      background: #f8fafc;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px;
      font-weight: 900;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(0,0,0,0.1);
      border: 1.5px solid #cbd5e1;
      position: relative;
      transition: transform 0.2s;
    }

    .card-ace { color: #0f172a; border-color: #f59e0b; background: linear-gradient(135deg, #ffffff 0%, #fef3c7 100%); }
    .card-king { color: #b45309; border-color: #d97706; background: linear-gradient(135deg, #ffffff 0%, #fef9c3 100%); }
    .card-queen { color: #dc2626; border-color: #ef4444; background: linear-gradient(135deg, #ffffff 0%, #fee2e2 100%); }
    .card-jack { color: #2563eb; border-color: #3b82f6; background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%); }
    .card-spade { color: #020617; background: #ffffff; }

    .card-corner {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      font-size: 11px;
    }
    .card-center-symbol {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
    }

    .spin-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      border: 4px solid #fef08a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.8), inset 0 2px 5px rgba(255,255,255,0.6);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .spin-btn:active { transform: scale(0.92); }

    .control-panel {
      background: #111827;
      border-top: 2px solid #1f2937;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Top Bar Container -->
  <div id="topBarContainer" class="sticky top-0 z-50"></div>

  <main class="max-w-md w-full mx-auto flex flex-col flex-1 p-2 gap-2 justify-between">

    <!-- Super Ace Header & Multiplier Bar -->
    <div class="flex flex-col gap-2">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-black tracking-widest text-amber-400 bg-black/60 px-3 py-1 rounded-full border border-amber-500/40">SUPER ACE</span>
        <div class="flex gap-2">
          <span class="bg-red-900/80 text-red-200 text-[10px] font-bold px-2 py-0.5 rounded border border-red-500">BUY BONUS</span>
          <span class="bg-amber-900/80 text-amber-200 text-[10px] font-bold px-2 py-0.5 rounded border border-amber-500">JACKPOT</span>
        </div>
      </div>

      <div class="multiplier-bar flex justify-around items-center py-1.5 px-2 text-black font-black text-sm">
        <span class="bg-white/90 px-3 py-0.5 rounded-lg shadow scale-110 text-amber-700">×1</span>
        <span>×2</span>
        <span>×3</span>
        <span>×5</span>
      </div>
    </div>

    <!-- Main Slot Reels Grid (5x4) -->
    <div class="slot-frame p-2">
      <div class="slot-grid" id="slotGrid">
        <!-- Rendered via JS -->
      </div>
      <div class="text-center py-1 font-bold text-xs text-amber-300 tracking-wider">
        WIN: <span id="winAmount" class="text-white">0.000</span>
      </div>
    </div>

    <!-- Bottom Action Controls & Spin Panel -->
    <div class="control-panel p-3 rounded-2xl flex flex-col gap-3 shadow-2xl">
      <div class="flex justify-between items-center text-xs font-bold px-2">
        <div class="flex flex-col">
          <span class="text-gray-400 text-[10px]">BET</span>
          <span id="betDisplay" class="text-amber-400">0.5</span>
        </div>
        <div class="flex flex-col text-right">
          <span class="text-gray-400 text-[10px]">BALANCE</span>
          <span id="slotBalance" class="text-white">1.750</span>
        </div>
      </div>

      <div class="flex items-center justify-between px-4">
        <button class="w-11 h-11 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-gray-300 shadow">
          <i class="fa-solid fa-gear text-sm"></i>
        </button>

        <button onclick="adjustBet(-0.5)" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-amber-400 font-bold text-lg shadow">-</button>

        <div class="spin-btn" onclick="triggerSpin()">
          <i class="fa-solid fa-rotate text-2xl text-white"></i>
        </div>

        <button onclick="adjustBet(0.5)" class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-amber-400 font-bold text-lg shadow">+</button>

        <button class="w-11 h-11 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-amber-400 shadow" title="Auto Spin">
          <i class="fa-solid fa-bolt text-sm"></i>
        </button>
      </div>
    </div>

  </main>

  <script>
    let currentUserId = null;
    let userBalance = 1.750;
    let currentBet = 0.5;

    const cardTypes = [
      { name: 'A', class: 'card-ace', symbol: '♠' },
      { name: 'K', class: 'card-king', symbol: '♔' },
      { name: 'Q', class: 'card-queen', symbol: '♕' },
      { name: 'J', class: 'card-jack', symbol: '♖' },
      { name: '♠', class: 'card-spade', symbol: '♠' }
    ];

    async function loadTopBar() {
      try {
        const res = await fetch('../bar/top.html');
        if (res.ok) {
          document.getElementById('topBarContainer').innerHTML = await res.text();
          document.querySelectorAll('a[href*="deposit"]').forEach(a => {
            a.href = '../account/deposit.html';
          });
        }
      } catch (e) {
        console.error('Top bar load error:', e);
      }
    }

    function updateBalances() {
      document.getElementById('slotBalance').innerText = userBalance.toFixed(3);
      document.getElementById('betDisplay').innerText = currentBet.toFixed(1);
      const topBal = document.getElementById('topBarBalance');
      if (topBal) topBal.innerText = userBalance.toFixed(2);
    }

    function initGrid() {
      const grid = document.getElementById('slotGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const randomCard = cardTypes[Math.floor(Math.random() * cardTypes.length)];
        const cardDiv = document.createElement('div');
        cardDiv.className = `slot-card ${randomCard.class}`;
        cardDiv.innerHTML = `
          <div class="card-corner"><span>${randomCard.name}</span><span style="font-size:9px">${randomCard.symbol}</span></div>
          <div class="card-center-symbol">${randomCard.symbol}</div>
          <div class="card-corner" style="transform: rotate(180deg)"><span>${randomCard.name}</span><span style="font-size:9px">${randomCard.symbol}</span></div>
        `;
        grid.appendChild(cardDiv);
      }
    }

    function adjustBet(amount) {
      currentBet = Math.max(0.5, currentBet + amount);
      updateBalances();
    }

    function triggerSpin() {
      if (userBalance < currentBet) {
        alert('অপর্যাপ্ত ব্যালেন্স!');
        return;
      }

      userBalance -= currentBet;
      updateBalances();

      const grid = document.getElementById('slotGrid');
      grid.style.transform = 'scale(0.97)';
      
      setTimeout(() => {
        initGrid();
        grid.style.transform = 'scale(1)';
        
        let win = Math.random() > 0.6 ? currentBet * (Math.floor(Math.random() * 5) + 1) : 0;
        if (win > 0) {
          userBalance += win;
          document.getElementById('winAmount').innerText = win.toFixed(3);
          updateBalances();
        } else {
          document.getElementById('winAmount').innerText = '0.000';
        }
      }, 250);
    }

    window.onload = async () => {
      await loadTopBar();
      initGrid();
      updateBalances();

      if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') {
        const user = await getCurrentUser();
        if (user) {
          currentUserId = user.id;
          const { data: profile } = await supabaseClient.from('profiles').select('balance').eq('id', user.id).single();
          if (profile) {
            userBalance = parseFloat(profile.balance) || 1.750;
            updateBalances();
          }
        }
      }
    };
  </script>
</body>
</html>
