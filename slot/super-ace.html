<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030d12">
  <title>Super Ace Background</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #030d12;
    }
    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #030d12;
      background-image: url('image/full_layout.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 100% 100%;
    }
    @supports not (height: 100dvh) {
      .background { height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="background" aria-label="Game background"></div>
</body>
</html>
