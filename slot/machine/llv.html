<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সিম্বল স্ট্রাকচার</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .symbol-card {
            background: #334155;
            width: 70px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            border-radius: 8px;
            border: 2px solid #475569;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .symbol-card:hover {
            transform: scale(1.05);
            border-color: #38bdf8;
        }
        .red {
            color: #ef4444;
        }
        .black {
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="symbol-card red">♥</div>
        <div class="symbol-card black">♠</div>
        <div class="symbol-card red">♦</div>
        <div class="symbol-card black">♣</div>
        <div class="symbol-card red">A</div>
        <div class="symbol-card black">K</div>
        <div class="symbol-card red">Q</div>
        <div class="symbol-card black">J</div>
    </div>

</body>
</html>
