<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Search - Game Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client & App Config (Path adjusted with ../) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <style>
        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1b2438; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: sans-serif;
        }
    </style>
</head>
<body class="bg-[#0b0e14] text-white min-h-screen flex flex-col font-sans antialiased">

    <!-- Top Navigation Bar Container -->
    <div id="topBarContainer" class="sticky top-0 z-50"></div>

    <!-- Main Content Wrapper -->
    <div class="flex-1 max-w-md w-full mx-auto p-4 pb-20">

        <!-- Top Search & Close Section -->
        <div class="flex items-center gap-3 mb-4">
            <div class="flex-1 flex items-center bg-[#18202c] rounded-xl px-4 py-3 border border-gray-800">
                <select class="bg-transparent text-white font-medium outline-none cursor-pointer pr-2 border-r border-gray-700">
                    <option class="bg-[#18202c]">Casino</option>
                </select>
                <input type="text" id="searchInput" placeholder="Search games" class="bg-transparent w-full pl-3 text-sm text-gray-300 placeholder-gray-400 outline-none">
            </div>
            <a href="../index.html" class="bg-[#18202c] p-3 rounded-xl border border-gray-800 text-gray-400 hover:text-white flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </a>
        </div>

        <!-- Filter Dropdowns -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="flex items-center justify-between bg-[#18202c] px-4 py-3 rounded-xl border border-gray-800 text-sm cursor-pointer">
                <span class="text-gray-300">All Providers</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </div>
            <div class="flex items-center justify-between bg-[#18202c] px-4 py-3 rounded-xl border border-gray-800 text-sm cursor-pointer">
                <span class="text-gray-300">Sort by: <span class="text-white">Featu...</span></span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </div>
        </div>

        <!-- Category Tabs -->
        <div class="relative mb-6">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2">
                <!-- Active Tab -->
                <button class="flex items-center gap-2 bg-[#1e1b3a] border border-[#635bff] text-white px-5 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#a5a1ff]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
                    All games
                </button>
                <!-- Normal Tab -->
                <button class="flex items-center gap-2 bg-[#18202c] border border-gray-800 text-gray-300 px-5 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap hover:bg-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /></svg>
                    Originals
                </button>
                <!-- Normal Tab -->
                <button class="flex items-center gap-2 bg-[#18202c] border border-gray-800 text-gray-300 px-5 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap hover:bg-gray-800">
                    Slots
                </button>
            </div>
        </div>

        <!-- Game Cards Grid -->
        <div class="grid grid-cols-3 gap-3">
            
            <!-- Card 1 -->
            <div class="relative bg-gradient-to-b from-orange-500 to-red-600 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between p-2 h-40 border border-orange-400/30">
                <span class="text-[9px] font-bold bg-black/40 text-orange-200 px-1.5 py-0.5 rounded uppercase self-center tracking-wider">Pragmatic Play</span>
                <div class="text-center font-black italic tracking-tighter text-white drop-shadow-md text-sm leading-tight">
                    GATES OF OLYMPUS 2500
                </div>
            </div>

            <!-- Card 2 -->
            <div class="relative bg-gradient-to-b from-red-600 to-black rounded-xl overflow-hidden shadow-lg flex flex-col justify-between p-2 h-40 border border-red-500/30">
                <span class="text-[9px] font-bold bg-black/40 text-red-200 px-1.5 py-0.5 rounded uppercase self-center tracking-wider">Hacksaw</span>
                <div class="text-center font-black italic tracking-tighter text-white drop-shadow-md text-base leading-tight">
                    LE VAMPIRE
                </div>
            </div>

            <!-- Card 3 -->
            <div class="relative bg-gradient-to-b from-orange-500 to-amber-600 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between p-2 h-40 border border-orange-500/30">
                <span class="text-[9px] font-bold bg-black/40 text-orange-200 px-1.5 py-0.5 rounded uppercase self-center tracking-wider">Pragmatic Play</span>
                <div class="text-center font-black italic tracking-tighter text-white drop-shadow-md text-xs leading-tight">
                    BIG BASS HALLOWEEN SPLASH 1000
                </div>
            </div>

            <!-- Card 4 -->
            <div class="relative bg-gradient-to-b from-rose-600 to-purple-900 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between p-2 h-40 border border-rose-500/30">
                <span class="text-[9px] font-bold bg-black/40 text-rose-200 px-1.5 py-0.5 rounded uppercase self-center tracking-wider">Peter & Sons</span>
                <div class="text-center font-black italic tracking-tighter text-white drop-shadow-md text-xs leading-tight">
                    BARBAROSSA BEYOND THE EDGE
                </div>
            </div>

            <!-- Card 5 -->
            <div class="relative bg-gradient-to-b from-amber-600 to-yellow-900 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between p-2 h-40 border border-amber-500/30">
                <span class="text-[9px] font-bold bg-black/40 text-amber-200 px-1.5 py-0.5 rounded uppercase self-center tracking-wider">Nolimit</span>
                <div class="text-center font-black italic tracking-tighter text-white drop-shadow-md text-sm leading-tight">
                    DUCK HUNTERS 2
                </div>
            </div>

            <!-- Card 6 -->
-           <div class="relative bg-gradient-to-b from-red-900 to-black rounded-xl overflow-hidden shadow-lg flex flex-col justify-between p-2 h-40 border border-red-700/30">
                <span class="text-[9px] font-bold bg-black/40 text-red-200 px-1.5 py-0.5 rounded uppercase self-center tracking-wider">Wicked Games</span>
                <div class="text-center font-black italic tracking-tighter text-white drop-shadow-md text-sm leading-tight">
                    WAR WHORES
                </div>
            </div>

        </div>
    </div>

    <!-- Dynamic Bottom Bar Container -->
    <div id="bottomBarContainer"></div>

    <script>
        let balanceSubscription = null;

        // Sync Realtime User Balance for Top Bar
        async function syncRealtimeUserBalance() {
            try {
                if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') {
                    const user = await getCurrentUser();
                    if (user) {
                        const { data: profile } = await supabaseClient
                            .from('profiles')
                            .select('balance')
                            .eq('id', user.id)
                            .single();
                        const balanceElement = document.getElementById('topBarBalance');
                        if (profile && balanceElement) {
                            balanceElement.innerText = parseFloat(profile.balance).toFixed(2);
                        }
                        if (!balanceSubscription) {
                            balanceSubscription = supabaseClient
                                .channel('public:profiles:' + user.id)
                                .on('postgres_changes', {
                                    event: 'UPDATE',
                                    schema: 'public',
                                    table: 'profiles',
                                    filter: `id=eq.${user.id}`
                                }, (payload) => {
                                    if (payload.new && payload.new.balance !== undefined) {
                                        const topBal = document.getElementById('topBarBalance');
                                        if (topBal) {
                                            topBal.innerText = parseFloat(payload.new.balance).toFixed(2);
                                        }
                                    }
                                })
                                .subscribe();
                        }
                    }
                }
            } catch (err) {
                console.error('Balance Sync Error:', err);
            }
        }

        // Load Top Bar from Root Folder
        async function loadTopBar() {
            try {
                const response = await fetch('../top.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('topBarContainer').innerHTML = html;
                    syncRealtimeUserBalance();
                }
            } catch (err) {
                console.error('Error loading top bar component:', err);
            }
        }

        // Load Bottom Bar from Root Folder
        async function loadBottomBar() {
            try {
                const response = await fetch('../bottom.html');
                if (response.ok) {
                    const html = await response.text();
                    const bottomBarContainer = document.getElementById('bottomBarContainer');
                    if (bottomBarContainer) {
                        bottomBarContainer.innerHTML = html;
                    }
                }
            } catch (err) {
                console.error('Error loading bottom bar component:', err);
            }
        }

        // Initialize on DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            loadTopBar();
            loadBottomBar();
        });
    </script>
</body>
</html>
