<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Payment Gateway - Lottery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">লটারি টিকেট ক্রয় ফরম</h2>

        <form id="ticketForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">নাম (Name)</label>
                <input type="text" id="buyerName" required class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400" placeholder="আপনার নাম লিখুন">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">মোবাইল (Mobile)</label>
                <input type="text" id="buyerMobile" required class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400" placeholder="মোবাইল নম্বর">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">ঠিকানা (Address)</label>
                <textarea id="buyerAddress" required rows="2" class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400" placeholder="আপনার ঠিকানা"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">লটারি নম্বর নির্বাচন করুন (ঠিক ১৪ ডিজিট)</label>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 mb-2">
                    <p class="text-xs text-slate-400 mb-1">নির্বাচিত নম্বর:</p>
                    <div id="selectedNumberDisplay" class="text-xl font-mono tracking-widest text-amber-400 min-h-[32px] break-all"></div>
                </div>
                
                <!-- Number Grid -->
                <div id="numberGrid" class="grid grid-cols-7 gap-2 max-h-60 overflow-y-auto p-2 bg-slate-900 rounded-xl">
                    <!-- Dynamic Circles -->
                </div>
                <p id="digitError" class="text-red-500 text-xs mt-1 hidden">অবश्यই ঠিক ১৪ ডিজিটের নম্বর নির্বাচন করতে হবে!</p>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold rounded-xl shadow-lg hover:opacity-95 transition">
                Proceed to E-payment
            </button>
        </form>
    </div>

    <script>
        const gridContainer = document.getElementById('numberGrid');
        const displayContainer = document.getElementById('selectedNumberDisplay');
        const digitError = document.getElementById('digitError');
        let selectedDigits = [];

        // গ্রিডের জন্য র্যান্ডম নম্বর জেনারেট করা
        for (let i = 0; i < 35; i++) {
            const num = Math.floor(Math.random() * 10);
            const btn = document.createElement('div');
            btn.className = 'w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold cursor-pointer select-none hover:bg-slate-600 transition';
            btn.innerText = num;
            btn.addEventListener('click', () => {
                if (selectedDigits.length < 14) {
                    selectedDigits.push(num);
                    btn.style.backgroundColor = '#ef4444';
                    btn.style.color = 'white';
                    updateDisplay();
                } else {
                    alert('সর্বোচ্চ ১৪ ডিজিট সিলেক্ট করা হয়েছে!');
                }
            });
            gridContainer.appendChild(btn);
        }

        function updateDisplay() {
            displayContainer.innerText = selectedDigits.join('');
            if (selectedDigits.length === 14) {
                digitError.classList.add('hidden');
            }
        }

        document.getElementById('ticketForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (selectedDigits.length !== 14) {
                digitError.classList.remove('hidden');
                return;
            }

            const formData = {
                name: document.getElementById('buyerName').value,
                mobile: document.getElementById('buyerMobile').value,
                address: document.getElementById('buyerAddress').value,
                ticketNumber: selectedDigits.join('')
            };

            localStorage.setItem('tempTicketData', JSON.stringify(formData));
            window.location.href = 'ticket-e-payment-verification.html';
        });
    </script>
</body>
</html>
