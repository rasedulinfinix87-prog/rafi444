<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06152B">
<title>My Tickets | Lottery Game</title>
<!-- Supabase JS Client & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../../supabase-config.js"></script>
<style>
:root{
  --bg:#06152b; --panel:#081d3a; --panel2:#0b2548; --blue:#075cff;
  --blue2:#1f51ff; --border:#102f58; --text:#fff; --muted:#a9c8f3;
  --green:#00c98b; --green-dark:#00a96b; --gray:#365580;
  --font-xs:11px; --font-sm:13px; --font-md:15px; --font-lg:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(135deg,#041126,#061a35 60%,#031024);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:var(--font-md);min-height:100vh}
button,a{font:inherit}
button{cursor:pointer}

main{max-width:1320px;margin:0 auto;padding:28px 24px 34px}
.hero{height:183px;border-radius:23px;background:radial-gradient(ellipse at 77% 40%,#063d83 0%,#082b5c 36%,#061d40 78%);border:1px solid #0d2b53;display:flex;align-items:center;justify-content:space-between;overflow:hidden;padding:28px 35px;position:relative}
.hero-copy{display:flex;align-items:center;gap:27px;z-index:1}
.hero-icon{height:82px;width:82px;display:grid;place-items:center;background:#075cff;border-radius:50%;font-size:38px;flex-shrink:0}
.hero h1{font-size:36px;margin:0 0 10px;font-weight:800;letter-spacing:-.5px}
.hero p{margin:0;color:#bed6fa;line-height:1.55;font-size:17px;max-width:480px}
.lottery-art{font-size:100px;letter-spacing:-13px;transform:rotate(-7deg);padding-right:14px;filter:drop-shadow(0 8px 14px #00122f);white-space:nowrap}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px;background:#071a35;border:1px solid #0b2548;border-radius:28px;margin:22px 0 26px}
.filter{min-height:57px;border:0;border-radius:21px;background:#0a2346;color:#c5dcfb;display:flex;align-items:center;justify-content:center;gap:11px;font-size:15px;font-weight:700}
.filter .ico{font-size:20px}
.filter .count{min-width:25px;height:25px;padding:0 7px;border-radius:20px;background:#102b52;color:#fff;display:grid;place-items:center;font-size:13px}
.filter.active{background:#075cff;color:white}
.filter.active .count{background:#3b8bff}
.tickets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ticket{background:linear-gradient(135deg,#071c39,#061832);border:1px solid #10315b;border-radius:24px;padding:21px 25px 20px;min-height:282px;position:relative;overflow:hidden}
.ticket-top{display:grid;grid-template-columns:116px minmax(0,1fr);gap:18px;align-items:center;padding-right:112px;min-height:78px}
.game-logo{width:105px;min-height:78px;display:flex;align-items:center;justify-content:center;text-align:center;}
.game-logo img{max-width:100%;max-height:78px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,255,255,0.2));}
.ticket-meta{min-width:0}
.muted{color:#a9c8f3}
.ticket-label{font-size:13px;margin-bottom:6px}
.ticket-id{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ticket-date{color:#a9c8f3;font-size:13px;margin-top:10px;white-space:nowrap}
.status{position:absolute;right:18px;top:20px;padding:9px 13px;border-radius:22px;font-size:11px;font-weight:800;white-space:nowrap}
.status.win{background:linear-gradient(90deg,#00b875,#00a76b);color:#fff}
.status.lose{background:linear-gradient(90deg,#31517f,#29436c);color:#fff}
.status.upcoming{background:#174c96;color:#dbeaff}
.numbers-title{font-size:13px;color:#a9c8f3;margin:20px 0 9px}
.numbers{display:flex;flex-wrap:wrap;gap:10px}
.ball{height:35px;width:35px;border-radius:50%;border:2px solid #456792;background:#071b36;display:grid;place-items:center;font-size:13px;font-weight:700;color:#f4f8ff}
.win-ticket .ball{border-color:#00c98b;color:#00e0a0}
.ticket-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:22px}
.prize{display:flex;align-items:center;gap:10px;min-height:38px}
.prize-icon{font-size:28px}
.prize small{display:block;color:#a9c8f3;font-size:13px;margin-bottom:3px}
.prize strong{color:#00d99a;font-size:20px}
.details{border:1px solid #0870ff;border-radius:25px;padding:12px 19px;background:transparent;color:#fff;font-weight:700;font-size:13px;white-space:nowrap;transition:.2s}
.details:hover{background:#075cff}
.details span{color:#1785ff;font-size:18px;margin-left:8px}
.empty{margin-top:19px;border:1px solid #10315b;border-radius:24px;background:linear-gradient(120deg,#071c39,#061832);text-align:center;padding:25px 15px 21px}
.empty-icon{width:68px;height:68px;margin:0 auto 12px;border-radius:50%;background:#153d70;display:grid;place-items:center;font-size:30px}
.empty h2{font-size:20px;margin:0 0 8px}
.empty p{color:#a9c8f3;margin:0 0 17px;font-size:14px}
.primary{border:0;border-radius:25px;background:#075cff;color:white;padding:13px 31px;font-weight:700;min-width:172px}
.primary:hover{background:#1f51ff}
.no-results{grid-column:1/-1;text-align:center;padding:45px 15px;color:#a9c8f3;background:#081d3a;border:1px solid #10315b;border-radius:20px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,7,20,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal-backdrop.show{display:flex}
.modal{width:min(440px,100%);border:1px solid #16416e;border-radius:22px;background:#081d3a;padding:25px;box-shadow:0 20px 80px #0009}
.modal h2{margin:0 0 18px}
.modal p{color:#b6d0f5;line-height:1.7}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:#102e54;color:white;width:35px;height:35px;border-radius:50%;font-size:20px}
@media(max-width:950px){
 .ticket{padding:18px}.ticket-top{grid-template-columns:88px minmax(0,1fr);gap:12px;padding-right:0}.game-logo{width:84px}.status{position:static;grid-column:1/-1;justify-self:start;order:-1;margin-bottom:10px}.ticket-meta{grid-column:2;grid-row:1}.ticket-top{grid-template-columns:88px minmax(0,1fr)}.ticket-date{white-space:normal}
}
@media(max-width:650px){
 main{padding:18px 12px 25px}.hero{height:auto;min-height:155px;padding:22px 17px;border-radius:18px}.hero-copy{gap:13px}.hero-icon{width:54px;height:54px;font-size:26px}.hero h1{font-size:27px}.hero p{font-size:13px}.lottery-art{font-size:54px;letter-spacing:-9px;padding:0 4px}
 .filters{grid-template-columns:repeat(2,1fr);border-radius:19px;margin:15px 0 18px}.filter{min-height:48px;border-radius:14px;font-size:13px;gap:7px}.tickets{grid-template-columns:1fr;gap:12px}.ticket{min-height:260px;border-radius:19px;padding:17px}.ticket-top{grid-template-columns:83px minmax(0,1fr)}.game-logo{width:78px}.ticket-id{font-size:13px}.ticket-date{font-size:12px}.status{font-size:10px;padding:7px 10px}.numbers{gap:8px}.ball{height:33px;width:33px}.ticket-bottom{margin-top:19px}.prize strong{font-size:18px}.details{padding:10px 13px;font-size:12px}.empty{margin-top:13px}
}
@media(max-width:390px){.lottery-art{display:none}.hero h1{font-size:25px}.ticket-top{grid-template-columns:70px minmax(0,1fr)}.game-logo{width:67px}.ticket-bottom{align-items:center}.details{padding:10px}.numbers{gap:6px}.ball{width:31px;height:31px}}
</style>
</head>
<body>

<!-- Dynamic Header Container -->
<div id="header-container"></div>

<main>
  <section class="hero">
    <div class="hero-copy">
      <div class="hero-icon">🎟</div>
      <div><h1>My Tickets</h1><p>Check your lottery tickets, view results<br class="desktop-break"> and track your winnings all in one place.</p></div>
    </div>
    <div class="lottery-art" aria-hidden="true">🎱 👑</div>
  </section>

  <section class="filters" aria-label="Filter tickets">
    <button class="filter active" data-filter="all"><span class="ico">🎟</span> All Tickets <span class="count" id="count-all">0</span></button>
    <button class="filter" data-filter="winning"><span class="ico">🏆</span> Winning <span class="count" id="count-winning">0</span></button>
    <button class="filter" data-filter="not-winning"><span class="ico">🎫</span> Not Winning <span class="count" id="count-not-winning">0</span></button>
    <button class="filter" data-filter="upcoming"><span class="ico">▦</span> Upcoming <span class="count" id="count-upcoming">0</span></button>
  </section>

  <!-- Dynamic Tickets Container -->
  <section class="tickets" id="tickets" aria-live="polite">
    <div class="no-results">Loading your tickets...</div>
  </section>

  <section class="empty" id="emptySection" style="display: none;">
    <div class="empty-icon">🎟</div>
    <h2>No More Tickets</h2>
    <p>You haven’t purchased any lottery tickets yet.</p>
    <button class="primary" onclick="window.location.href='tic-draw.html'">🎟 &nbsp;Play Now</button>
  </section>
</main>

<!-- Dynamic Footer Container -->
<div id="footer-container"></div>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="modal-head"><h2 id="modal-title">Ticket Details</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div><div id="modal-content"></div><button class="primary" onclick="closeModal()">Close</button></div>
</div>

<script>
  // হেডার ও ফুটার ফাইল ফেচ করে লোড করার ফাংশন
  async function loadComponents() {
    try {
      const headerRes = await fetch('navigation/header.html');
      if (headerRes.ok) {
        document.getElementById('header-container').innerHTML = await headerRes.text();
      }

      const footerRes = await fetch('navigation/footer.html');
      if (footerRes.ok) {
        document.getElementById('footer-container').innerHTML = await footerRes.text();
      }
    } catch (e) {
      console.error('Error loading components:', e);
    }
  }

  let ticketCards = [];

  async function fetchUserDataAndTickets() {
    const client = (typeof supabaseClient !== 'undefined') ? supabaseClient : null;
    if (!client) {
      document.getElementById('tickets').innerHTML = '<div class="no-results">Supabase connection not found.</div>';
      return;
    }

    try {
      const user = typeof getCurrentUser === 'function' ? await getCurrentUser() : null;
      if (!user || (!user.id && !user.user_id && !user.uid)) {
        document.getElementById('tickets').innerHTML = '<div class="no-results">Please log in to view your tickets.</div>';
        return;
      }

      const currentUserId = user.id || user.user_id || user.uid;

      const { data: tickets, error } = await client
        .from('tic_tickets')
        .select('*')
        .eq('tic_user_id', currentUserId)
        .order('tic_purchased_at', { ascending: false });

      if (error) {
        console.error('Error fetching tickets:', error);
        document.getElementById('tickets').innerHTML = '<div class="no-results">Failed to load tickets.</div>';
        return;
      }

      const container = document.getElementById('tickets');
      const emptySection = document.getElementById('emptySection');

      if (!tickets || tickets.length === 0) {
        container.innerHTML = '';
        emptySection.style.display = 'block';
        updateCounts([]);
        return;
      }

      emptySection.style.display = 'none';
      let html = '';

      tickets.forEach((ticket, index) => {
        const ticketNum = ticket.tic_ticket_number || '';
        let statusKey = 'upcoming';
        let statusClass = 'upcoming';
        let statusText = '🕒 UPCOMING';

        if (ticket.tic_ticket_status === 'winning') {
          statusKey = 'winning';
          statusClass = 'win';
          statusText = '🏆 WINNING';
        } else if (ticket.tic_ticket_status === 'not-winning' || ticket.tic_ticket_status === 'lose') {
          statusKey = 'not-winning';
          statusClass = 'lose';
          statusText = '✕ NOT WINNING';
        }

        let rawNumbers = ticketNum.replace('TICK-', '');
        let ballsHtml = '';
        for (let i = 0; i < rawNumbers.length; i += 2) {
          let pair = rawNumbers.substr(i, 2);
          if (pair) {
            ballsHtml += `<span class="ball">${pair}</span>`;
          }
        }
        if (!ballsHtml) {
          ballsHtml = `<span class="ball">--</span>`;
        }

        const formattedDate = ticket.tic_purchased_at ? new Date(ticket.tic_purchased_at).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'N/A';
        const isWin = statusKey === 'winning';

        // সঠিক পাথ অনুযায়ী win1.png বা win2.png লোড হবে
        const logoIndex = (index % 2) + 1;
        const logoSrc = `images/win${logoIndex}.png`;

        html += `
          <article class="ticket ${isWin ? 'win-ticket' : ''}" data-status="${statusKey}">
            <span class="status ${statusClass}">${statusText}</span>
            <div class="ticket-top">
              <div class="game-logo"><img src="${logoSrc}" alt="Logo"></div>
              <div class="ticket-meta">
                <div class="ticket-label muted">Ticket No.</div>
                <div class="ticket-id">${ticketNum}</div>
                <div class="ticket-date">▦ &nbsp;${formattedDate}</div>
              </div>
            </div>
            <div class="numbers-title">Your Numbers</div>
            <div class="numbers">${ballsHtml}</div>
            <div class="ticket-bottom">
              ${isWin ? '<div class="prize"><span class="prize-icon">🏆</span><span><small>Prize Won</small><strong>৳ 500.00</strong></span></div>' : '<div></div>'}
              <button class="details" onclick="showTicket(this)">View Details <span>→</span></button>
            </div>
          </article>
        `;
      });

      container.innerHTML = html;
      ticketCards = [...document.querySelectorAll('.ticket')];
      initFilters();

    } catch (err) {
      console.error('Error:', err);
      document.getElementById('tickets').innerHTML = '<div class="no-results">An unexpected error occurred.</div>';
    }
  }

  function updateCounts(customTickets) {
    const cards = customTickets || ticketCards;
    const counts = {
      all: cards.length,
      winning: cards.filter(t => t.dataset.status === 'winning').length,
      'not-winning': cards.filter(t => t.dataset.status === 'not-winning').length,
      upcoming: cards.filter(t => t.dataset.status === 'upcoming').length
    };
    Object.entries(counts).forEach(([key, value]) => {
      const el = document.getElementById('count-' + key);
      if (el) el.textContent = value;
    });
  }

  function initFilters() {
    const filters = [...document.querySelectorAll('.filter')];
    updateCounts();

    filters.forEach(button => {
      button.onclick = () => {
        filters.forEach(item => item.classList.toggle('active', item === button));
        const selected = button.dataset.filter;
        let visible = 0;
        ticketCards.forEach(ticket => {
          const show = selected === 'all' || ticket.dataset.status === selected;
          ticket.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        let empty = document.querySelector('.no-results');
        if (!visible && !empty) {
          empty = document.createElement('div');
          empty.className = 'no-results';
          empty.textContent = selected === 'upcoming' ? 'No upcoming tickets found.' : 'No tickets found in this category.';
          document.getElementById('tickets').appendChild(empty);
        } else if (visible && empty) {
          empty.remove();
        } else if (!visible && empty) {
          empty.textContent = selected === 'upcoming' ? 'No upcoming tickets found.' : 'No tickets found in this category.';
        }
      };
    });
  }

  function showTicket(button) {
    const card = button.closest('.ticket');
    const id = card.querySelector('.ticket-id').innerText;
    const date = card.querySelector('.ticket-date').innerText;
    const numbers = [...card.querySelectorAll('.ball')].map(n => n.innerText).join(' · ');
    const status = card.dataset.status === 'winning' ? '🏆 Winning' : card.dataset.status === 'upcoming' ? '🕒 Upcoming' : '✕ Not Winning';
    const prize = card.querySelector('.prize strong')?.innerText || '—';
    
    document.getElementById('modal-title').innerText = 'Ticket Details';
    document.getElementById('modal-content').innerHTML =
      '<p><strong>Ticket No.:</strong> ' + escapeHTML(id) + '</p>' +
      '<p><strong>Date:</strong> ' + escapeHTML(date) + '</p>' +
      '<p><strong>Your Numbers:</strong><br>' + escapeHTML(numbers) + '</p>' +
      '<p><strong>Status:</strong> ' + status + '</p>' +
      '<p><strong>Prize:</strong> ' + escapeHTML(prize) + '</p>';
    document.getElementById('modal').classList.add('show');
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }

  function closeModal() { 
    document.getElementById('modal').classList.remove('show'); 
  }

  document.addEventListener('keydown', e => { 
    if(e.key === 'Escape') closeModal(); 
  });

  window.addEventListener('DOMContentLoaded', async () => {
    await loadComponents();
    await fetchUserDataAndTickets();
  });
</script>
</body>
</html>
