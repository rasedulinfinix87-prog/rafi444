<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Verification - Lottery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../supabase-config.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold mb-4 text-center text-amber-400">পেমেন্ট ভেরিফিকেশন</h2>
        
        <div class="bg-slate-900 p-4 rounded-xl space-y-2 mb-6 text-sm">
            <p><strong>নাম:</strong> <span id="vName"></span></p>
            <p><strong>মোবাইল:</strong> <span id="vMobile"></span></p>
            <p><strong>ঠিকানা:</strong> <span id="vAddress"></span></p>
            <p><strong>লটারি টিকেট নম্বর:</strong> <span id="vTicket" class="font-mono text-amber-400 text-base"></span></p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">ট্রান্সেকশন আইডি (Trx ID)</label>
                <input type="text" id="trxId" required class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400" placeholder="আপনার Trx ID দিন">
            </div>

            <button id="confirmBtn" class="w-full py-3 bg-green-600 text-white font-bold rounded-xl shadow-lg hover:bg-green-500 transition">
                পেমেন্ট কনফার্ম ও টিকেট সাবমিট করুন
            </button>
        </div>
    </div>

    <script>
        const ticketData = JSON.parse(localStorage.getItem('tempTicketData'));

        if (!ticketData) {
            alert('কোনো তথ্য পাওয়া যায়নি! দয়া করে আবার ফরম পূরণ করুন।');
            window.location.href = 'ticket-payment-getway.html';
        } else {
            document.getElementById('vName').innerText = ticketData.name;
            document.getElementById('vMobile').innerText = ticketData.mobile;
            document.getElementById('vAddress').innerText = ticketData.address;
            document.getElementById('vTicket').innerText = ticketData.ticketNumber;
        }

        document.getElementById('confirmBtn').addEventListener('click', async () => {
            const trxId = document.getElementById('trxId').value.trim();
            if (!trxId) {
                alert('দয়া করে ট্রান্সেকশন আইডি প্রদান করুন।');
                return;
            }

            try {
                let userId = null;
                if (window._supabase && window._supabase.auth) {
                    const { data: { user } } = await window._supabase.auth.getUser();
                    if (user) userId = user.id;
                }

                const insertData = {
                    tic_ticket_number: ticketData.ticketNumber,
                    tic_buyer_name: ticketData.name,
                    tic_buyer_mobile: ticketData.mobile,
                    tic_ticket_status: 'Pending',
                    tic_trx_id: trxId,
                    tic_purchased_at: new Date().toISOString()
                };

                if (userId) {
                    insertData.tic_user_id = userId;
                }

                const { data, error } = await window._supabase
                    .from('tic_tickets')
                    .insert([insertData]);

                if (error) {
                    console.error('Supabase Error Details:', error);
                    alert('ডাটাবেজ এরর: ' + error.message);
                } else {
                    alert('আপনার টিকেট সফলভাবে সাবমিট হয়েছে!');
                    localStorage.removeItem('tempTicketData');
                    window.location.href = 'tic-draw.html';
                }
            } catch (err) {
                console.error('Catch Error:', err);
                alert('একটি ত্রুটি ঘটেছে: ' + err.message);
            }
        });
    </script>
</body>
</html>
