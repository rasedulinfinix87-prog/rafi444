<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lottery Lucky Draw</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../supabase-config.js"></script>
</head>
<body class="bg-[#0F212E] text-[#FFFFFF] min-h-screen flex flex-col justify-between select-none">

  <!-- Top Navigation Bar Include / Load -->
  <div id="topBarContainer"></div>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-md mx-auto w-full p-4 flex flex-col items-center justify-center">
    
    <div class="w-full bg-[#1A2C38] border border-[#0F212E] rounded-2xl p-6 shadow-xl text-center space-y-6">
      
      <!-- Header Title -->
      <div>
        <h2 class="text-xl font-extrabold text-[#FFFFFF] tracking-wide flex items-center justify-center gap-2">
          <i class="fa-solid fa-ticket text-[#24ee89]"></i> Lucky Ticket Draw
        </h2>
        <p class="text-xs text-[#FFFFFF]/70 mt-1">আপনার লাকি টিকিট কিনে জিতে নিন আকর্ষণীয় প্রাইজ!</p>
      </div>

      <!-- Ticket Price & Selection -->
      <div class="bg-[#0F212E] p-4 rounded-xl border border-[#0F212E] space-y-3">
        <label class="block text-xs font-semibold text-[#FFFFFF]/80 text-left">টিকেট মূল্য (Ticket Price): <span class="text-[#24ee89] font-bold">10.00 BDT</span></label>
        
        <div class="flex items-center justify-between bg-[#1A2C38] px-4 py-3 rounded-lg border border-[#0F212E]">
          <span class="text-xs text-[#FFFFFF]/70">পরিমাণ (Quantity)</span>
          <div class="flex items-center gap-3">
            <button onclick="changeQty(-1)" class="w-8 h-8 bg-[#0F212E] hover:bg-[#24ee89] hover:text-[#0F212E] font-bold rounded-lg transition flex items-center justify-center">-</button>
            <span id="ticketQty" class="text-base font-extrabold text-[#FFFFFF]">1</span>
            <button onclick="changeQty(1)" class="w-8 h-8 bg-[#0F212E] hover:bg-[#24ee89] hover:text-[#0F212E] font-bold rounded-lg transition flex items-center justify-center">+</button>
          </div>
        </div>

        <div class="flex justify-between items-center text-xs pt-2">
          <span class="text-[#FFFFFF]/70">মোট খরচ:</span>
          <span id="totalCost" class="text-sm font-extrabold text-[#24ee89]">10.00 BDT</span>
        </div>
      </div>

      <!-- Draw Animation / Result Box -->
      <div id="drawResultBox" class="hidden p-4 rounded-xl bg-[#0F212E] border border-[#24ee89] text-center animate-pulse">
        <p id="drawResultMessage" class="text-xs font-bold text-[#24ee89]"></p>
      </div>

      <!-- Buy & Play Button -->
      <button id="buyTicketBtn" onclick="buyTicketDraw()" class="w-full bg-[#24ee89] hover:bg-[#1ebc6d] text-[#0F212E] font-extrabold py-3.5 rounded-xl transition shadow-lg text-sm tracking-wide">
        টিকেট কিনুন ও ড্র করুন
      </button>

    </div>

  </main>

  <!-- Bottom Navigation Bar Include -->
  <div id="bottomBarContainer"></div>

  <script>
    let quantity = 1;
    const ticketPrice = 10.00;

    function changeQty(val) {
      quantity += val;
      if (quantity < 1) quantity = 1;
      if (quantity > 10) quantity = 10;
      
      document.getElementById('ticketQty').textContent = quantity;
      document.getElementById('totalCost').textContent = (quantity * ticketPrice).toFixed(2) + ' BDT';
    }

    async function loadComponents() {
      try {
        const topRes = await fetch('../../bar/top.html');
        if (topRes.ok) document.getElementById('topBarContainer').innerHTML = await topRes.text();

        const bottomRes = await fetch('../../bar/bottom.html');
        if (bottomRes.ok) document.getElementById('bottomBarContainer').innerHTML = await bottomRes.text();
      } catch (e) {
        console.error('Component load error:', e);
      }
    }

    async function buyTicketDraw() {
      const user = await requireAuth();
      if (!user) return;

      const userId = user.id || user.user_id;
      const totalCost = quantity * ticketPrice;

      const btn = document.getElementById('buyTicketBtn');
      btn.disabled = true;
      btn.textContent = 'প্রসেসিং হচ্ছে...';

      try {
        // Fetch current profile balance
        const profile = await getUserProfile(userId);
        if (!profile) {
          alert('প্রোফাইল পাওয়া যায়নি!');
          resetBtn();
          return;
        }

        const currentBalance = Number(profile.balance || 0);
        if (currentBalance < totalCost) {
          alert('পর্যাপ্ত ব্যালেন্স নেই! দয়া করে ডিপোজিট করুন।');
          resetBtn();
          return;
        }

        const newBalance = currentBalance - totalCost;

        // Update Balance in profiles table
        const { error: updateError } = await supabaseClient
          .from('profiles')
          .update({ balance: newBalance })
          .eq('id', userId);

        if (updateError) {
          throw updateError;
        }

        // Simulate win/loss result (e.g., 40% chance to win double)
        const isWin = Math.random() < 0.4;
        const payout = isWin ? totalCost * 2 : 0;

        if (isWin) {
          const updatedWinBalance = newBalance + payout;
          await supabaseClient
            .from('profiles')
            .update({ balance: updatedWinBalance })
            .eq('id', userId);
        }

        // Insert into original_bets_history to record wager & history automatically via interceptor
        await supabaseClient.from('original_bets_history').insert({
          user_id: userId,
          game_name: 'Lottery Lucky Draw',
          bet_amount: totalCost,
          payout: payout,
          multiplier: isWin ? 2 : 0,
          status: isWin ? 'win' : 'lose',
          game_details: { quantity: quantity, ticket_price: ticketPrice }
        });

        // Show Result UI
        const resultBox = document.getElementById('drawResultBox');
        const resultMsg = document.getElementById('drawResultMessage');
        resultBox.classList.remove('hidden');

        if (isWin) {
          resultMsg.className = 'text-xs font-bold text-[#24ee89]';
          resultMsg.textContent = `অভিনন্দন! আপনি লটারিতে ${payout.toFixed(2)} BDT জিতেছেন!`;
        } else {
          resultMsg.className = 'text-xs font-bold text-red-400';
          resultMsg.textContent = 'আফসোস! এই ড্রয়ে আপনি বিজয়ী হননি। আবার চেষ্টা করুন!';
        }

      } catch (err) {
        console.error('Lottery error:', err, err?.message || err);
        alert('ত্রুটি ঘটেছে: ' + (err?.message || JSON.stringify(err)));
      } finally {
        resetBtn();
      }
    }

    function resetBtn() {
      const btn = document.getElementById('buyTicketBtn');
      btn.disabled = false;
      btn.textContent = 'টিকেট কিনুন ও ড্র করুন';
    }

    document.addEventListener('DOMContentLoaded', loadComponents);
  </script>
</body>
</html>
