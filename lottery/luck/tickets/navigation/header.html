<!-- header.html -->
<header class="w-full bg-[#0b1622] border-b border-blue-500/20 px-4 py-3 max-w-[480px] mx-auto flex items-center justify-between sticky top-0 z-50">
  
  <!-- Left: Logo & Title -->
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 bg-[#1F51FF] rounded-xl flex items-center justify-center text-white font-bold text-base shadow-md">
      LD
    </div>
    <div>
      <h1 class="text-white font-bold text-base leading-tight">Lucky Draw</h1>
      <p class="text-[11px] text-gray-400">Lottery Demo · লটারি ডেমো</p>
    </div>
  </div>

  <!-- Right: Dynamic Login Check & White SVG Icon -->
  <div id="headerRightAction" class="flex items-center">
    <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে লগইন অবস্থা অনুযায়ী SVG আইকন লোড হবে -->
  </div>

</header>

<script>
  async function checkUserAndRenderHeader() {
    const rightActionContainer = document.getElementById('headerRightAction');
    if (!rightActionContainer) return;

    try {
      let isLogged = false;

      // ১. প্রথমে supabase-config.js এর getCurrentUser চেক করা
      if (typeof getCurrentUser === 'function') {
        const user = await getCurrentUser();
        if (user && (user.id || user.user_id || user.uid)) {
          isLogged = true;
        }
      }

      // ২. যদি সেখানে না পাওয়া যায়, তবে সরাসরি লোকালস্টোরেজ চেক করা
      if (!isLogged) {
        const stored = localStorage.getItem('current_user') || localStorage.getItem('user_id');
        if (stored) isLogged = true;
      }

      if (isLogged) {
        // ইউজার লগইন থাকলে ডান পাশে প্রোফাইল আইকন শো করবে
        rightActionContainer.innerHTML = `
          <a href="profile.html" class="w-9 h-9 rounded-full bg-[#1a2c38] border border-blue-500/30 flex items-center justify-center text-white hover:bg-blue-600/20 transition-all shadow-sm" title="Profile">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
          </a>
        `;
      } else {
        // ইউজার লগইন না থাকলে Login বাটন শো করবে
        rightActionContainer.innerHTML = `
          <a href="login-signup.html" class="text-xs font-semibold bg-[#1F51FF] text-white px-3 py-1.5 rounded-lg shadow">
            Login
          </a>
        `;
      }
    } catch (err) {
      console.error('Header auth check error:', err);
    }
  }

  window.addEventListener('DOMContentLoaded', checkUserAndRenderHeader);
</script>
