<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0F212E">
<title>Lucky Tickets</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Supabase JS Client & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../supabase-config.js"></script>

<style>
:root {
  --bg: #0F212E;
  --button: #1F51FF;
  --border: #0F212E;
  --text: #FFFFFF;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 14px;
  padding-bottom: calc(90px + env(safe-area-inset-bottom));
  overflow-y: auto;
}
button, a { font: inherit; }
button { cursor: pointer; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 14px 16px;
  background: var(--bg);
}

.hero-banner-container {
  width: 100%;
  margin-bottom: 17px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.hero-banner-container img {
  width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 19px;
}

.game-card { min-width: 0; }
.game-art { min-height: 120px; }
.game-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

.section-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:25px 2px 13px; }
.section-heading h2 { font-size: 22px; margin:0; }
.view-all { border:0; background:transparent; color:var(--text); font-size: 14px; white-space:nowrap; }

.winners { border:1px solid var(--border); border-radius:18px; padding:0 12px; background: #1A2C38; }
.winner { display:flex; justify-content:space-between; align-items:center; gap:9px; min-height:55px; border-bottom:1px solid #0F212E; font-size: 12px; }
.winner:last-child { border-bottom:0; }
.winner-avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:#16476d; font-size:17px; }

#topBarContainer { position: sticky; top: 0; z-index: 500; width: 100%; }
#footerContainer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 500; width: 100%; max-width: 480px; margin: 0 auto; }

.toast { position:fixed; z-index:20; bottom:80px; left:50%; transform:translateX(-50%); background:var(--button); color:white; border-radius:12px; padding:10px 15px; display:none; max-width:90%; text-align:center; }
.toast.show { display:block; }
</style>
</head>
<body>

<!-- Top Header Container (header.html) -->
<div id="topBarContainer"></div>

<main class="app">
  <!-- Banner Image Section -->
  <div class="hero-banner-container">
    <img src="images/banner.png" alt="Lucky Tickets Banner" />
  </div>

  <!-- প্রথম গ্রিড সেকশন -->
  <div class="grid grid-cols-2 gap-2.5 sm:gap-4 mb-4">
    <div onclick="getTicket('Ticket 1')" class="game-card bg-[#1A2C38] border border-[#0F212E] hover:border-[#1F51FF] rounded-2xl p-2 shadow-lg cursor-pointer">
      <div class="game-art w-full h-32 overflow-hidden rounded-xl">
        <img src="images/image.png" alt="Ticket 1" onerror="this.src='Images/image.png'" />
      </div>
    </div>

    <div onclick="getTicket('Ticket 2')" class="game-card bg-[#1A2C38] border border-[#0F212E] hover:border-[#1F51FF] rounded-2xl p-2 shadow-lg cursor-pointer">
      <div class="game-art w-full h-32 overflow-hidden rounded-xl">
        <img src="images/image1.png" alt="Ticket 2" onerror="this.src='Images/image1.png'" />
      </div>
    </div>
  </div>

  <!-- দ্বিতীয় গ্রিড সেকশন -->
  <div class="grid grid-cols-2 gap-2.5 sm:gap-4 mb-6">
    <div onclick="getTicket('Ticket 3')" class="game-card bg-[#1A2C38] border border-[#0F212E] hover:border-[#1F51FF] rounded-2xl p-2 shadow-lg cursor-pointer">
      <div class="game-art w-full h-32 overflow-hidden rounded-xl">
        <img src="images/image2.png" alt="Ticket 3" onerror="this.src='Images/image2.png'" />
      </div>
    </div>

    <div onclick="getTicket('Ticket 4')" class="game-card bg-[#1A2C38] border border-[#0F212E] hover:border-[#1F51FF] rounded-2xl p-2 shadow-lg cursor-pointer">
      <div class="game-art w-full h-32 overflow-hidden rounded-xl">
        <img src="images/image3.png" alt="Ticket 4" onerror="this.src='Images/image3.png'" />
      </div>
    </div>
  </div>

  <!-- Recent Winners Section -->
  <section>
    <div class="section-heading"><h2>Recent Winners</h2><button class="view-all" onclick="notify('Showing recent winners')">View All →</button></div>
    <div class="winners p-3 space-y-2">
      <div class="flex justify-between items-center border-b border-[#0F212E] pb-2">
        <div class="flex items-center gap-2"><div class="winner-avatar">♟</div><span class="font-bold">user123***</span></div>
        <span class="text-gray-300 text-xs">Daily Ticket</span>
        <span class="font-bold text-emerald-400">♧ 10,000</span>
      </div>
      <div class="flex justify-between items-center border-b border-[#0F212E] pb-2">
        <div class="flex items-center gap-2"><div class="winner-avatar">♟</div><span class="font-bold">lucky20***</span></div>
        <span class="text-gray-300 text-xs">Weekly Ticket</span>
        <span class="font-bold text-emerald-400">♧ 50,000</span>
      </div>
      <div class="flex justify-between items-center border-b border-[#0F212E] pb-2">
        <div class="flex items-center gap-2"><div class="winner-avatar">♟</div><span class="font-bold">winner88***</span></div>
        <span class="text-gray-300 text-xs">Special Ticket</span>
        <span class="font-bold text-emerald-400">♧ 250,000</span>
      </div>
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2"><div class="winner-avatar">♟</div><span class="font-bold">vip777***</span></div>
        <span class="text-gray-300 text-xs">VIP Ticket</span>
        <span class="font-bold text-emerald-400">♧ 1,000,000</span>
      </div>
    </div>
  </section>
</main>

<!-- Footer Container -->
<div id="footerContainer"></div>

<div class="toast" id="toast" role="status"></div>

<script>
  function notify(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function getTicket(type) {
    window.location.href = 'ticket-payment-getway.html';
  }

  async function loadNavigationComponents() {
    try {
      // ১. header.html লোড করা (আগের navigation.html এর বদলে)
      const topRes = await fetch('header.html');
      if (topRes.ok) {
        document.getElementById('topBarContainer').innerHTML = await topRes.text();
        const scripts = document.getElementById('topBarContainer').querySelectorAll('script');
        scripts.forEach(script => {
          const newScript = document.createElement('script');
          newScript.text = script.innerText;
          document.body.appendChild(newScript);
        });
      }

      // ২. navigation/footer.html লোড করা
      const footerRes = await fetch('navigation/footer.html');
      if (footerRes.ok) {
        document.getElementById('footerContainer').innerHTML = await footerRes.text();
      }
    } catch (err) {
      console.error('Navigation components loading error:', err);
    }
  }

  window.addEventListener('DOMContentLoaded', () => { 
    loadNavigationComponents(); 
  });
</script>
</body>
</html>
