<!DOCTYPE html>
<html lang="bn" class="dark">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>7 Under Over Game</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase-config.js"></script>

    <script>

        tailwind.config = {

            darkMode: 'class',

            theme: {

                extend: {

                    colors: {

                        bgDark: '#29283b',
                        cardDark: '#242334',
                        gameGreen: '#78b82a',
                        gameRed: '#b91c1c',
                        gameYellow: '#d6a52a',
                        gold: '#d7b96d',
                        textGray: '#d8d5df'

                    }

                }

            }

        }

    </script>

    <style>

        @import url(
            'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap'
        );


        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

            max-width: 100%;

        }


        body {

            font-family: 'Inter', sans-serif;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(94, 79, 130, .25),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #302f43 0%,
                    #272638 45%,
                    #1e1d2b 100%
                );

            color: #fff;

            touch-action: manipulation;

            overflow-x: hidden;

        }


        button {

            font-family: inherit;

        }


        /* =========================================================
           MAIN GAME
        ========================================================= */

        .game-wrapper {

            width: 100%;

            max-width: 971px;

            min-height: 100vh;

            margin: 0 auto;

            background: #272638;

            position: relative;

            overflow-x: hidden;

            overflow-y: hidden;

            box-shadow:
                0 0 45px rgba(0, 0, 0, .45);

        }


        /* =========================================================
           TOP GAME HEADER
        ========================================================= */

        .game-top {

            position: relative;

            height: 205px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 55%,
                    rgba(135, 91, 29, .25),
                    transparent 22%
                ),
                radial-gradient(
                    circle at 20% 55%,
                    rgba(184, 128, 45, .18),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 80% 55%,
                    rgba(184, 128, 45, .18),
                    transparent 25%
                ),
                linear-gradient(
                    180deg,
                    #29283a 0%,
                    #252436 100%
                );

        }


        .game-top::before {

            content: "";

            position: absolute;

            inset: -70px;

            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255,255,255,.035) 0deg 2deg,
                    transparent 2deg 10deg
                );

            opacity: .65;

            pointer-events: none;

        }


        /* =========================================================
           PLACE A BET
        ========================================================= */

        .place-bet {

            position: absolute;

            z-index: 8;

            left: 50%;

            top: 12px;

            transform: translateX(-50%);

            width: 66%;

            min-height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(62, 55, 74, .95),
                    rgba(45, 41, 57, .95)
                );

            border: 1px solid #766780;

            border-radius: 6px;

            box-shadow:
                inset 0 1px rgba(255,255,255,.08),
                0 5px 15px rgba(0,0,0,.35);

            font-size: 18px;

            font-weight: 800;

            color: #fff;

        }


        /* =========================================================
           DICE AREA
        ========================================================= */

        .dice-area {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 5px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 26px;

            z-index: 5;

            max-width: 100%;

        }


        .dice-ring {

            width: 122px;

            height: 122px;

            flex: 0 0 auto;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    #0c0912 0 60%,
                    #141020 61% 67%,
                    #c9a960 68% 72%,
                    #6c5220 73% 78%,
                    #dfc47c 79% 83%,
                    #493614 84% 100%
                );

            box-shadow:
                0 8px 22px rgba(0,0,0,.6),
                inset 0 0 12px rgba(255,255,255,.15);

            position: relative;

        }


        .dice-ring::after {

            content: "";

            position: absolute;

            inset: 8px;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,.08);

            pointer-events: none;

        }


        .dice {

            width: 82px;

            height: 82px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #e8e8e8 48%,
                    #cfcfcf
                );

            border-radius: 22px;

            box-shadow:
                0 5px 10px rgba(0,0,0,.6),
                inset 0 3px 6px rgba(255,255,255,.8),
                inset 0 -5px 8px rgba(0,0,0,.12);

            border: 2px solid #bdbdbd;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            grid-template-rows:
                repeat(3, 1fr);

            padding: 12px;

            position: relative;

            z-index: 2;

        }


        .dice-dot {

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #17151b;

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,.25),
                0 1px 2px rgba(0,0,0,.3);

        }


        /* =========================================================
           DICE ROLL ANIMATION
        ========================================================= */

        @keyframes diceRoll {

            0% {

                transform:
                    rotate(0deg)
                    scale(1);

            }

            20% {

                transform:
                    rotate(70deg)
                    scale(.88);

            }

            40% {

                transform:
                    rotate(145deg)
                    scale(1.05);

            }

            60% {

                transform:
                    rotate(220deg)
                    scale(.9);

            }

            80% {

                transform:
                    rotate(290deg)
                    scale(1.04);

            }

            100% {

                transform:
                    rotate(360deg)
                    scale(1);

            }

        }


        .rolling-anim {

            animation:
                diceRoll .42s infinite linear;

        }


        /* =========================================================
           RESULT
        ========================================================= */

        .result-text {

            text-align: center;

            min-height: 30px;

            margin-top: 0;

            padding-top: 8px;

            padding-bottom: 4px;

            font-size: 12px;

            font-weight: 800;

            color: #d5d1dc;

            width: 100%;

            overflow: hidden;

        }


        /* =========================================================
           REAL TIME BALANCE
        ========================================================= */

        .balance-bar {

            width: 100%;

            min-height: 58px;

            margin-bottom: 12px;

            padding: 10px 15px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-radius: 9px;

            border: 1px solid rgba(215,185,109,.55);

            background:
                linear-gradient(
                    135deg,
                    rgba(62,54,72,.98),
                    rgba(37,35,53,.98)
                );

            box-shadow:
                inset 0 1px rgba(255,255,255,.07),
                0 4px 10px rgba(0,0,0,.25);

        }


        .balance-label {

            display: flex;

            align-items: center;

            gap: 9px;

            color: #d8d5df;

            font-size: 14px;

            font-weight: 700;

        }


        .balance-label i {

            color: #d7b96d;

            font-size: 18px;

        }


        .balance-value {

            color: #f5d879;

            font-size: 19px;

            font-weight: 900;

            letter-spacing: .2px;

        }


        /* =========================================================
           BETTING PANEL
        ========================================================= */

        .bet-panel {

            width: 100%;

            max-width: 100%;

            background:
                linear-gradient(
                    180deg,
                    #29283a 0%,
                    #252435 100%
                );

            padding: 16px;

            overflow: hidden;

        }


        .bet-options {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 10px;

        }


        .bet-option {

            min-width: 0;

            width: 100%;

            min-height: 80px;

            position: relative;

            border-radius: 7px;

            background:
                linear-gradient(
                    180deg,
                    #393649,
                    #2c2a3b
                );

            border: 2px solid #4e526d;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #e4dfc6;

            box-shadow:
                inset 0 1px rgba(255,255,255,.08),
                0 3px 8px rgba(0,0,0,.25);

            transition: .15s ease;

        }


        .bet-option:active {

            transform: scale(.96);

        }


        .bet-option.selected {

            border-color:
                #8fbc26 !important;

            box-shadow:
                0 0 12px rgba(143,188,38,.5),
                inset 0 0 12px rgba(143,188,38,.12);

        }


        .bet-title {

            font-size: 17px;

            font-weight: 800;

            font-style: italic;

            white-space: nowrap;

        }


        .bet-multiplier {

            margin-top: 5px;

            font-size: 14px;

            font-weight: 800;

            color: #f0ead6;

        }


        /* =========================================================
           BET AMOUNT
        ========================================================= */

        .amount-controls {

            margin-top: 14px;

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 10px;

        }


        .amount-btn {

            min-width: 0;

            width: 100%;

            height: 50px;

            border-radius: 8px;

            border: 2px solid #9a8b65;

            background:
                linear-gradient(
                    180deg,
                    #f0e5b8,
                    #998d69
                );

            color: #292634;

            font-size: 17px;

            font-weight: 900;

            box-shadow:
                inset 0 2px 3px rgba(255,255,255,.7),
                0 3px 6px rgba(0,0,0,.35);

        }


        .amount-btn:active {

            transform:
                translateY(2px);

        }


        .amount-display {

            margin-top: 12px;

            width: 100%;

            height: 60px;

            display: flex;

            align-items: center;

            padding-left: 20px;

            border-radius: 8px;

            border: 3px solid #bfa35b;

            background: #272334;

            box-shadow:
                inset 0 0 10px rgba(0,0,0,.5),
                0 3px 7px rgba(0,0,0,.25);

            color: #fff;

            font-size: 19px;

            font-weight: 800;

        }


        /* =========================================================
           MAIN CONTROL BUTTONS
        ========================================================= */

        .main-controls {

            width: 100%;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1.35fr)
                minmax(0, 1fr);

            gap: 18px;

            align-items: center;

            margin-top: 14px;

        }


        .control-btn {

            min-width: 0;

            width: 100%;

            height: 92px;

            border-radius: 20px;

            border: 4px solid #171521;

            background:
                linear-gradient(
                    145deg,
                    #527fdc,
                    #2746a3
                );

            box-shadow:
                inset 0 3px 6px rgba(255,255,255,.35),
                inset 0 -5px 10px rgba(0,0,0,.35),
                0 5px 10px rgba(0,0,0,.45);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            transition: .15s;

        }


        .control-btn:active {

            transform:
                scale(.94);

        }


        .play-btn {

            min-width: 0;

            width: 100%;

            height: 108px;

            border-radius: 23px;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #b4e45b,
                    #6cae23 55%,
                    #477d12 100%
                );

            border: 5px solid #191723;

            box-shadow:
                0 0 20px rgba(140,207,41,.55),
                inset 0 4px 7px rgba(255,255,255,.4),
                inset 0 -8px 12px rgba(0,0,0,.3),
                0 6px 12px rgba(0,0,0,.5);

            color: white;

            font-size: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: .15s;

        }


        .play-btn:active {

            transform:
                scale(.94);

        }


        /* =========================================================
           OVERLAY
        ========================================================= */

        .casino-overlay {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background:
                rgba(0,0,0,.65);

            backdrop-filter:
                blur(4px);

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 100;

            animation:
                overlayIn .25s ease;

        }


        @keyframes overlayIn {

            from {

                opacity: 0;

                transform:
                    scale(.95);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        .result-card {

            min-width: 250px;

            max-width: calc(100vw - 40px);

            padding: 25px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #373348,
                    #1f1d2c
                );

            border: 2px solid #c7a858;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0,0,0,.7);

        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 600px) {

            .game-top {

                height: 205px;

            }


            .place-bet {

                top: 10px;

                width: 76%;

            }


            .dice-area {

                gap: 18px;

                bottom: 5px;

            }


            .dice-ring {

                width: 108px;

                height: 108px;

            }


            .dice {

                width: 76px;

                height: 76px;

                padding: 11px;

            }


            .bet-title {

                font-size: 15px;

            }


            .bet-multiplier {

                font-size: 13px;

            }


            .control-btn {

                height: 80px;

                font-size: 28px;

            }


            .play-btn {

                height: 96px;

                font-size: 42px;

            }

        }


        @media (max-width: 420px) {

            .game-top {

                height: 200px;

            }


            .place-bet {

                width: 82%;

                top: 9px;

                min-height: 40px;

            }


            .bet-panel {

                padding: 12px;

            }


            .bet-options {

                gap: 7px;

            }


            .amount-controls {

                gap: 6px;

            }


            .main-controls {

                gap: 9px;

            }


            .dice-area {

                gap: 12px;

                bottom: 5px;

            }


            .dice-ring {

                width: 100px;

                height: 100px;

            }


            .dice {

                width: 70px;

                height: 70px;

                border-radius: 18px;

            }


            .dice-dot {

                width: 10px;

                height: 10px;

            }


            .amount-btn {

                font-size: 15px;

            }


            .balance-value {

                font-size: 17px;

            }

        }


        @media (max-width: 350px) {

            .game-top {

                height: 190px;

            }


            .place-bet {

                width: 86%;

                top: 8px;

            }


            .bet-panel {

                padding: 10px;

            }


            .bet-options {

                gap: 5px;

            }


            .bet-title {

                font-size: 13px;

            }


            .bet-multiplier {

                font-size: 11px;

            }


            .amount-controls {

                gap: 5px;

            }


            .amount-btn {

                font-size: 13px;

            }


            .main-controls {

                gap: 6px;

            }


            .dice-area {

                gap: 8px;

                bottom: 4px;

            }


            .dice-ring {

                width: 92px;

                height: 92px;

            }


            .dice {

                width: 64px;

                height: 64px;

                padding: 9px;

            }

        }

    </style>

</head>


<body>


<main class="game-wrapper">


    <!-- =========================================================
         GAME HEADER
    ========================================================== -->

    <section class="game-top">


        <div class="place-bet">

            <span id="place-bet-text">
                Place a bet
            </span>

        </div>


        <div class="dice-area">


            <div class="dice-ring">

                <div
                    id="dice-1"
                    class="dice"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <div class="dice-ring">

                <div
                    id="dice-2"
                    class="dice"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


        </div>

    </section>


    <!-- =========================================================
         RESULT
    ========================================================== -->

    <div
        id="sum-result-text"
        class="result-text"
    >
        DEMO ROUND • NO REAL MONEY
    </div>


    <!-- =========================================================
         BET PANEL
    ========================================================== -->

    <section class="bet-panel">


        <!-- =====================================================
             REAL TIME BALANCE
        ====================================================== -->

        <div class="balance-bar">

            <div class="balance-label">

                <i class="fa-solid fa-wallet"></i>

                <span>
                    Balance
                </span>

            </div>


            <div
                id="balance-display"
                class="balance-value"
            >
                ৳ 0.00
            </div>

        </div>


        <div class="bet-options">


            <button
                onclick="placeUserBet('over')"
                id="spot-over"
                class="bet-option"
            >

                <span class="bet-title">
                    Over 7
                </span>

                <span class="bet-multiplier">
                    x 2.3
                </span>

                <div
                    id="chip-over"
                    class="hidden"
                ></div>

            </button>


            <button
                onclick="placeUserBet('exact')"
                id="spot-exact"
                class="bet-option"
            >

                <span class="bet-title">
                    Equal 7
                </span>

                <span class="bet-multiplier">
                    x 5.8
                </span>

                <div
                    id="chip-exact"
                    class="hidden"
                ></div>

            </button>


            <button
                onclick="placeUserBet('under')"
                id="spot-under"
                class="bet-option"
            >

                <span class="bet-title">
                    Under 7
                </span>

                <span class="bet-multiplier">
                    x 2.3
                </span>

                <div
                    id="chip-under"
                    class="hidden"
                ></div>

            </button>


        </div>


        <!-- =====================================================
             AMOUNT CONTROLS
        ====================================================== -->

        <div class="amount-controls">


            <button
                class="amount-btn"
                onclick="setBetAmount('min')"
            >
                MIN
            </button>


            <button
                class="amount-btn"
                onclick="setBetAmount('double')"
            >
                X2
            </button>


            <button
                class="amount-btn"
                onclick="setBetAmount('half')"
            >
                X/2
            </button>


            <button
                class="amount-btn"
                onclick="setBetAmount('max')"
            >
                MAX
            </button>


        </div>


        <!-- =====================================================
             BET AMOUNT
        ====================================================== -->

        <div
            id="amount-display"
            class="amount-display"
        >
            ৳ 10
        </div>


        <!-- =====================================================
             MAIN CONTROLS
        ====================================================== -->

        <div class="main-controls">


            <button
                onclick="setChip(selectedChipValue)"
                class="control-btn"
                title="Coins"
            >

                <i class="fa-solid fa-coins"></i>

            </button>


            <button
                onclick="manualRoll()"
                class="play-btn"
                title="Play"
            >

                <i class="fa-solid fa-play"></i>

            </button>


            <button
                onclick="resetGame()"
                class="control-btn"
                title="Refresh"
            >

                <i class="fa-solid fa-rotate"></i>

            </button>


        </div>


    </section>


    <!-- =========================================================
         RESULT OVERLAY
    ========================================================== -->

    <div
        id="result-overlay"
        class="casino-overlay hidden"
    >

        <div class="result-card">


            <div
                id="overlay-text"
                class="text-2xl font-black"
            >
                YOU WIN
            </div>


        </div>

    </div>


</main>


<script>


    /* =========================================================
       GLOBAL VARIABLES
    ========================================================== */

    let currentUserId = null;


    let userBalance = 0.00;


    let selectedChipValue = 10;


    let selectedChipColor =
        'bg-red-600';


    let currentRoundState =
        'betting';


    const ROUND_DURATION = 10;


    let activeBets = {

        under: 0,

        over: 0,

        exact: 0

    };


    let activeBetChipColors = {

        under: '',

        over: '',

        exact: ''

    };


    let profileRealtimeChannel = null;


    /* =========================================================
       SUPABASE CLIENT
    ========================================================== */

    function getClient() {


        if (
            typeof supabaseClient !==
            'undefined'
        )

            return supabaseClient;


        if (
            typeof supabase !==
            'undefined'
        )

            return supabase;


        if (
            window.supabaseClient
        )

            return window.supabaseClient;


        if (
            window.supabase
        )

            return window.supabase;


        return null;

    }


    /* =========================================================
       INIT GAME
    ========================================================== */

    async function initGame() {


        const client =
            getClient();


        try {


            let user = null;


            if (
                typeof requireAuth ===
                'function'
            ) {


                user =
                    await requireAuth();


            } else if (
                typeof getCurrentUser ===
                'function'
            ) {


                user =
                    await getCurrentUser();


            } else if (client) {


                const { data } =
                    await client.auth.getUser();


                user =
                    data?.user;

            }


            /*
             * USER NOT LOGGED IN
             */

            if (
                !user ||
                !client
            ) {


                userBalance =
                    0;


                updateBalanceUI();


                return;

            }


            currentUserId =
                user.id;


            /*
             * LOAD USER PROFILE
             */

            await fetchUserProfile(
                client,
                currentUserId,
                user
            );


            /*
             * REALTIME BALANCE
             */

            subscribeToRealtimeBalance(
                client,
                currentUserId
            );


        } catch (err) {


            console.error(
                "Auth init error:",
                err
            );


            userBalance =
                0;


            updateBalanceUI();

        }


        syncAndStartTimer();


        loadHistoryFromStorage();


        renderDiceDots(
            'dice-1',
            6
        );


        renderDiceDots(
            'dice-2',
            1
        );


    }


    /* =========================================================
       FETCH PROFILE
    ========================================================== */

    async function fetchUserProfile(
        client,
        userId,
        user
    ) {


        const { data: profile, error } =
            await client
                .from('profiles')
                .select(
                    'id, full_name, phone_number, balance, created_at'
                )
                .eq(
                    'id',
                    userId
                )
                .maybeSingle();


        if (error) {


            console.error(
                'Profile fetch error:',
                error
            );


            return;

        }


        /*
         * PROFILE EXISTS
         */

        if (profile) {


            userBalance =
                Number(
                    profile.balance
                ) || 0;


            updateBalanceUI();


            return;

        }


        /*
         * PROFILE DOES NOT EXIST
         * CREATE PROFILE
         */

        const metadata =
            user?.user_metadata || {};


        const fullName =
            metadata.full_name ||
            metadata.name ||
            '';


        const phoneNumber =
            metadata.phone ||
            metadata.phone_number ||
            user?.phone ||
            '';


        const { data: newProfile, error: insertError } =
            await client
                .from('profiles')
                .insert({

                    id:
                        userId,

                    full_name:
                        fullName,

                    phone_number:
                        phoneNumber,

                    balance:
                        0

                })
                .select()
                .single();


        if (insertError) {


            console.error(
                'Profile creation error:',
                insertError
            );


            userBalance =
                0;


            updateBalanceUI();


            return;

        }


        userBalance =
            Number(
                newProfile?.balance
            ) || 0;


        updateBalanceUI();

    }


    /* =========================================================
       REALTIME BALANCE SUBSCRIPTION
    ========================================================== */

    function subscribeToRealtimeBalance(
        client,
        userId
    ) {


        /*
         * Prevent duplicate subscription
         */

        if (
            profileRealtimeChannel
        ) {


            try {

                client.removeChannel(
                    profileRealtimeChannel
                );

            } catch (e) {

                console.warn(
                    'Old channel remove error:',
                    e
                );

            }

        }


        profileRealtimeChannel =
            client
                .channel(
                    `profile-balance-${userId}`
                )
                .on(

                    'postgres_changes',

                    {

                        event: 'UPDATE',

                        schema: 'public',

                        table: 'profiles',

                        filter:
                            `id=eq.${userId}`

                    },

                    payload => {


                        if (
                            payload?.new &&
                            payload.new.balance !==
                            undefined
                        ) {


                            userBalance =
                                Number(
                                    payload.new.balance
                                ) || 0;


                            updateBalanceUI();


                            /*
                             * Keep selected MAX amount
                             * inside available balance
                             */

                            if (
                                selectedChipValue >
                                userBalance &&
                                userBalance >= 10
                            ) {


                                selectedChipValue =
                                    Math.floor(
                                        userBalance
                                    );


                                updateAmountDisplay();

                            }


                        }

                    }

                )
                .subscribe(

                    status => {


                        console.log(
                            'Balance realtime status:',
                            status
                        );

                    }

                );

    }


    /* =========================================================
       REFRESH BALANCE FROM DATABASE
    ========================================================== */

    async function refreshBalanceFromDatabase() {


        const client =
            getClient();


        if (
            !client ||
            !currentUserId
        ) {

            return false;

        }


        const { data, error } =
            await client
                .from('profiles')
                .select('balance')
                .eq(
                    'id',
                    currentUserId
                )
                .maybeSingle();


        if (error) {


            console.error(
                'Balance refresh error:',
                error
            );


            return false;

        }


        if (data) {


            userBalance =
                Number(
                    data.balance
                ) || 0;


            updateBalanceUI();


            return true;

        }


        return false;

    }


    /* =========================================================
       UPDATE BALANCE IN DATABASE
    ========================================================== */

    async function saveBalanceToDatabase(
        newBalance
    ) {


        const client =
            getClient();


        if (
            !client ||
            !currentUserId
        ) {


            return {

                success: false,

                error:
                    'User is not authenticated.'

            };

        }


        const safeBalance =
            Math.max(
                0,
                Number(
                    newBalance
                ) || 0
            );


        const { data, error } =
            await client
                .from('profiles')
                .update({

                    balance:
                        safeBalance

                })
                .eq(
                    'id',
                    currentUserId
                )
                .select('balance')
                .maybeSingle();


        if (error) {


            console.error(
                'Balance update error:',
                error
            );


            return {

                success: false,

                error

            };

        }


        if (data) {


            userBalance =
                Number(
                    data.balance
                ) || 0;


        } else {


            userBalance =
                safeBalance;

        }


        updateBalanceUI();


        return {

            success: true,

            balance:
                userBalance

        };

    }

    /* =========================================================
       BET AMOUNT
    ========================================================== */

    function setBetAmount(type) {


        let value =
            Number(
                selectedChipValue
            ) || 10;


        if (
            type === 'min'
        ) {


            value =
                10;


        } else if (
            type === 'double'
        ) {


            value *= 2;


        } else if (
            type === 'half'
        ) {


            value =
                Math.max(
                    10,
                    Math.floor(
                        value / 2
                    )
                );


        } else if (
            type === 'max'
        ) {


            value =
                Math.max(
                    10,
                    Math.floor(
                        userBalance
                    )
                );

        }


        /*
         * Never allow selected amount
         * to exceed balance.
         */

        if (
            userBalance >= 10 &&
            value > userBalance
        ) {


            value =
                Math.floor(
                    userBalance
                );

        }


        selectedChipValue =
            Math.max(
                10,
                value
            );


        /*
         * If balance is below minimum
         */

        if (
            userBalance < 10
        ) {


            selectedChipValue =
                10;

        }


        updateAmountDisplay();

    }

    /* =========================================================
       TIMER
    ========================================================== */

    function syncAndStartTimer() {


        let roundStartTime =
            localStorage.getItem(
                'dice_round_start_time'
            );


        let now =
            Date.now();


        if (!roundStartTime) {


            roundStartTime =
                now;


            localStorage.setItem(
                'dice_round_start_time',
                roundStartTime
            );

        }


        let elapsedSeconds =
            Math.floor(

                (
                    now -
                    parseInt(
                        roundStartTime
                    )
                ) / 1000

            );


        let timeLeft =
            ROUND_DURATION -
            (
                elapsedSeconds %
                ROUND_DURATION
            );


        if (
            timeLeft <= 0
        )

            timeLeft =
                ROUND_DURATION;


        runTimerCountdown(
            timeLeft
        );

    }


    function runTimerCountdown(
        initialTime
    ) {


        let timeLeft =
            initialTime;


        if (
            window.globalTimerInterval
        )

            clearInterval(
                window.globalTimerInterval
            );


        window.globalTimerInterval =
            setInterval(

                () => {


                    const placeBetText =
                        document.getElementById(
                            'place-bet-text'
                        );


                    if (
                        timeLeft <= 3
                    ) {


                        placeBetText.innerText =
                            timeLeft > 0
                                ? `Rolling in ${timeLeft}...`
                                : 'Rolling...';


                    } else {


                        placeBetText.innerText =
                            'Place a bet';

                    }


                    if (
                        timeLeft <= 3 &&
                        timeLeft > 0
                    ) {


                        document
                            .getElementById(
                                'dice-1'
                            )
                            .classList
                            .add(
                                'rolling-anim'
                            );


                        document
                            .getElementById(
                                'dice-2'
                            )
                            .classList
                            .add(
                                'rolling-anim'
                            );


                        currentRoundState =
                            'rolling_soon';

                    }


                    if (
                        timeLeft <= 0
                    ) {


                        clearInterval(
                            window.globalTimerInterval
                        );


                        localStorage.setItem(
                            'dice_round_start_time',
                            Date.now()
                        );


                        lockBetsAndRollDice();


                        return;

                    }


                    timeLeft--;


                },

                1000

            );

    }


    /* =========================================================
       PLACE BET
    ========================================================== */

    async function placeUserBet(
        spot
    ) {


        if (
            currentRoundState ===
            'rolling'
        ) {

            return;

        }


        /*
         * Check current database balance
         * before placing every bet.
         */

        await refreshBalanceFromDatabase();


        let roundStartTime =
            parseInt(

                localStorage.getItem(
                    'dice_round_start_time'
                ) ||
                Date.now()

            );


        let elapsed =
            Math.floor(

                (
                    Date.now() -
                    roundStartTime
                ) / 1000

            );


        let timeLeft =
            ROUND_DURATION -
            (
                elapsed %
                ROUND_DURATION
            );


        if (
            timeLeft <= 3
        ) {


            showMessage(
                'এই রাউন্ডের বেটিং সময় শেষ!'
            );


            return;

        }


        if (
            selectedChipValue <= 0
        ) {

            return;

        }


        /*
         * IMPORTANT:
         * Never allow betting above balance.
         */

        if (
            userBalance <
            selectedChipValue
        ) {


            showMessage(
                'পর্যাপ্ত ব্যালেন্স নেই!'
            );


            return;

        }


        const oldBalance =
            Number(
                userBalance
            ) || 0;


        const newBalance =
            oldBalance -
            Number(
                selectedChipValue
            );


        /*
         * Update database first.
         */

        const balanceResult =
            await saveBalanceToDatabase(
                newBalance
            );


        if (
            !balanceResult.success
        ) {


            showMessage(
                'ব্যালেন্স আপডেট করা যায়নি!'
            );


            /*
             * Reload actual balance.
             */

            await refreshBalanceFromDatabase();


            return;

        }


        /*
         * Update local active bet.
         */

        activeBets[spot] +=
            selectedChipValue;


        activeBetChipColors[spot] =
            selectedChipColor;


        updateBalanceUI();


        updateChipsDisplay();


        const spotEl =
            document.getElementById(
                `spot-${spot}`
            );


        if (spotEl) {


            spotEl.classList.add(
                'selected'
            );


            setTimeout(

                () => {


                    spotEl.classList.remove(
                        'selected'
                    );


                },

                300

            );

        }

    }


    window.placeUserBet =
        placeUserBet;

    /* =========================================================
       INSERT BET HISTORY
    ========================================================== */

    async function saveBetHistory(
        spot,
        sum,
        bAmount,
        itemPayout,
        isWinner
    ) {


        const client =
            getClient();


        if (
            !client ||
            !currentUserId
        ) {


            return {

                success: false,

                error:
                    'Authentication unavailable.'

            };

        }


        /*
         * target_number:
         *
         * Under 7 = 6
         * Equal 7 = 7
         * Over 7  = 8
         */

        const targetNumber =
            spot === 'under'
                ? 6
                : spot === 'over'
                ? 8
                : 7;


        const { data, error } =
            await client
                .from('bets')
                .insert({

                    user_id:
                        currentUserId,

                    target_number:
                        targetNumber,

                    roll_result:
                        sum,

                    bet_amount:
                        Number(
                            bAmount
                        ),

                    payout:
                        Number(
                            itemPayout
                        ),

                    is_bool:
                        Boolean(
                            isWinner
                        )

                })
                .select()
                .single();


        if (error) {


            console.error(
                'Bet history insert error:',
                error
            );


            return {

                success: false,

                error

            };

        }


        return {

            success: true,

            data

        };

    }


    /* =========================================================
       ROLL DICE
    ========================================================== */

    async function lockBetsAndRollDice() {


        if (
            currentRoundState ===
            'rolling'
        ) {


            return;

        }


        currentRoundState =
            'rolling';


        document
            .getElementById(
                'place-bet-text'
            )
            .innerText =
            'Rolling...';


        const dice1 =
            document.getElementById(
                'dice-1'
            );


        const dice2 =
            document.getElementById(
                'dice-2'
            );


        dice1.classList.add(
            'rolling-anim'
        );


        dice2.classList.add(
            'rolling-anim'
        );


        const d1 =
            Math.floor(
                Math.random() * 6
            ) + 1;


        const d2 =
            Math.floor(
                Math.random() * 6
            ) + 1;


        const sum =
            d1 + d2;


        await new Promise(

            resolve =>
                setTimeout(
                    resolve,
                    1500
                )

        );


        dice1.classList.remove(
            'rolling-anim'
        );


        dice2.classList.remove(
            'rolling-anim'
        );


        renderDiceDots(
            'dice-1',
            d1
        );


        renderDiceDots(
            'dice-2',
            d2
        );


        let winner =
            '';


        if (
            sum < 7
        )

            winner =
                'under';

        else if (
            sum > 7
        )

            winner =
                'over';

        else

            winner =
                'exact';


        let userWonAny =
            false;


        let totalPayoutEarned =
            0;


        const client =
            getClient();


        /*
         * Process each active bet.
         */

        for (
            let spot in activeBets
        ) {


            let bAmount =
                Number(
                    activeBets[spot]
                ) || 0;


            if (
                bAmount <= 0
            ) {


                continue;

            }


            let isWinner =
                spot === winner;


            let payoutMultiplier =
                spot === 'exact'
                    ? 5.8
                    : 2.3;


            let itemPayout =
                isWinner
                    ? bAmount *
                      payoutMultiplier
                    : 0;


            if (
                itemPayout > 0
            ) {


                userBalance +=
                    itemPayout;


                totalPayoutEarned +=
                    itemPayout;


                userWonAny =
                    true;

            }


            /*
             * Save bet history to bets table.
             */

            if (
                client &&
                currentUserId
            ) {


                const result =
                    await saveBetHistory(

                        spot,

                        sum,

                        bAmount,

                        itemPayout,

                        isWinner

                    );


                if (
                    !result.success
                ) {


                    console.error(
                        'Could not save bet history:',
                        result.error
                    );

                }

            }

        }


        /*
         * Save final balance after payout.
         */

        if (
            client &&
            currentUserId
        ) {


            const balanceResult =
                await saveBalanceToDatabase(
                    userBalance
                );


            if (
                !balanceResult.success
            ) {


                /*
                 * If update fails,
                 * fetch actual database balance.
                 */

                await refreshBalanceFromDatabase();

            }

        }


        updateBalanceUI();


        document
            .getElementById(
                'sum-result-text'
            )
            .innerText =
            `RESULT: ${sum} • ${winner.toUpperCase()}`;


        const overlay =
            document.getElementById(
                'result-overlay'
            );


        const overlayText =
            document.getElementById(
                'overlay-text'
            );


        let hasActiveBets =
            Object.values(
                activeBets
            ).some(
                val => val > 0
            );


        if (
            hasActiveBets
        ) {


            if (
                userWonAny
            ) {


                overlayText.innerText =
                    `YOU WIN! ৳${totalPayoutEarned.toFixed(2)}`;


                overlayText.className =
                    'text-emerald-400 text-2xl font-black';


            } else {


                overlayText.innerText =
                    'YOU LOST';


                overlayText.className =
                    'text-red-500 text-2xl font-black';

            }


            overlay.classList.remove(
                'hidden'
            );

        }


        updateHistoryLog(
            sum
        );


        activeBets = {

            under: 0,

            over: 0,

            exact: 0

        };


        updateChipsDisplay();


        updateBalanceUI();


        setTimeout(

            () => {


                overlay.classList.add(
                    'hidden'
                );


                currentRoundState =
                    'betting';


                document
                    .getElementById(
                        'place-bet-text'
                    )
                    .innerText =
                    'Place a bet';


                syncAndStartTimer();


            },

            2500

        );

    }

    ========================================================== */

    function updateHistoryLog(
        sum
    ) {


        let histories =
            JSON.parse(

                localStorage.getItem(
                    'dice_game_histories'
                ) || '[]'

            sum

        if (
            histories.length > 10
        ) {

            histories.pop();

        }


        localStorage.setItem(

            'dice_game_histories',

            JSON.stringify(

            )

        );
