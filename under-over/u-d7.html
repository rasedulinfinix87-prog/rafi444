<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Under Over Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgDark: '#070a0f',
                        cardDark: '#18181b',
                        gameGreen: '#065f46',
                        gameRed: '#b91c1c',
                        gameYellow: '#d97706',
                        textGray: '#cbd5e1'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a0f;
            color: #f3f4f6;
            touch-action: manipulation;
        }
        .dice-box {
            perspective: 1000px;
        }
        .bet-spot-selected {
            border-color: #24ee89 !important;
            box-shadow: 0 0 15px rgba(36, 238, 137, 0.6);
        }
        /* ডাইস রোলিং অ্যানিমেশন স্টাইল (স্মুথ ঘূর্ণন ও ঝাঁকুনি) */
        @keyframes diceSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        @keyframes diceShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 4px) rotate(-15deg); }
            40% { transform: translate(4px, -4px) rotate(15deg); }
            60% { transform: translate(-4px, -4px) rotate(-10deg); }
            80% { transform: translate(4px, 4px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .rolling-anim {
            animation: diceSpin 0.4s infinite linear, diceShake 0.4s infinite ease-in-out;
        }
        /* ক্যাসিনো স্টাইল ট্রান্সপারেন্ট ওভারলে */
        .casino-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            animation: fadeInOut 3.5s ease forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            15% { opacity: 1; transform: scale(1); }
            85% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); display: none; }
        }
        /* পোকার চিপ ডিজাইন স্টাইল */
        .poker-chip {
            border-radius: 50%;
            border: 3px dashed rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-0 select-none selection:bg-yellow-500 selection:text-black">

    <!-- Main Game Wrapper -->
    <main class="w-full max-w-md flex flex-col bg-cardDark shadow-2xl overflow-hidden relative pb-16">
        
        <!-- Top Display Section (Dice Roll Area) -->
        <div class="relative w-full h-56 bg-gradient-to-b from-[#111827] to-[#1f2937] border-b border-gray-800 flex flex-col justify-between p-3 overflow-hidden">
            <div class="flex items-center justify-between w-full text-[11px] text-gray-400">
                <span class="bg-black/40 px-2.5 py-1 rounded border border-gray-700 font-medium text-yellow-400">7 Under / Over</span>
                <div class="flex items-center space-x-1 bg-black/40 px-2.5 py-1 rounded border border-gray-700 font-bold text-white">
                    <i class="fa-solid fa-clock text-yellow-400"></i>
                    <span id="timer-display">10s</span>
                </div>
            </div>

            <!-- Dice Rolling Animation Area (গোল সার্কেলের ভিতরে দুটি ডাইস) -->
            <div class="flex items-center justify-center my-auto">
                <div class="w-36 h-36 rounded-full bg-black/40 border-2 border-yellow-500/30 flex items-center justify-center space-x-4 shadow-[0_0_20px_rgba(0,0,0,0.6)_inset]">
                    <div id="dice-1" class="w-14 h-14 bg-white text-gray-900 rounded-xl shadow-2xl flex items-center justify-center border-2 border-gray-300 transition-all duration-300">
                        <div class="w-full h-full p-2 grid grid-cols-3 grid-rows-3 items-center justify-items-center">
                            <span class="dot-1 col-start-2 row-start-2 w-3 h-3 bg-black rounded-full"></span>
                        </div>
                    </div>
                    <div id="dice-2" class="w-14 h-14 bg-white text-gray-900 rounded-xl shadow-2xl flex items-center justify-center border-2 border-gray-300 transition-all duration-300">
                        <div class="w-full h-full p-2 grid grid-cols-3 grid-rows-3 items-center justify-items-center">
                            <span class="dot-2 col-start-2 row-start-2 w-3 h-3 bg-black rounded-full"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Total Sum Result Display -->
            <div class="text-center">
                <span id="sum-result-text" class="text-xs font-bold text-gray-300 tracking-wider">ROLL THE DICE</span>
            </div>

            <!-- ক্যাসিনো স্টাইল উইন/লস ওভারলে মেসেজ -->
            <div id="result-overlay" class="absolute inset-0 z-20 flex items-center justify-center font-black text-xl tracking-widest uppercase hidden casino-overlay">
                <span id="overlay-text" class="text-white drop-shadow-lg">YOU WIN</span>
            </div>
        </div>

        <!-- History Bar -->
        <div class="w-full h-12 bg-[#111827] border-b border-gray-800 flex items-center px-3 space-x-2 overflow-x-auto">
            <span class="text-[10px] text-gray-400 font-bold">HISTORY:</span>
            <div id="history-container" class="flex items-center space-x-1.5">
                <!-- History badges -->
            </div>
        </div>

        <!-- Betting Options Layout -->
        <div class="p-3 grid grid-cols-3 gap-2.5 bg-cardDark">
            
            <!-- Over 7 -->
            <button onclick="placeUserBet('over')" id="spot-over" class="relative p-3 bg-[#1e293b] hover:bg-slate-800 rounded-xl flex flex-col items-center justify-center transition-all border-2 border-gray-700 shadow-lg active:scale-95">
                <span class="text-[11px] font-bold text-gray-300 uppercase">Over 7</span>
                <span class="text-xs font-black text-yellow-400 my-1">x 2.3</span>
                <div id="chip-over" class="absolute -top-2 -right-2 w-7 h-7 text-[10px] text-white shadow-md hidden"></div>
            </button>

            <!-- Equal 7 -->
            <button onclick="placeUserBet('exact')" id="spot-exact" class="relative p-3 bg-[#1e293b] hover:bg-slate-800 rounded-xl flex flex-col items-center justify-center transition-all border-2 border-gray-700 shadow-lg active:scale-95">
                <span class="text-[11px] font-bold text-gray-300 uppercase">Equal 7</span>
                <span class="text-xs font-black text-yellow-400 my-1">x 5.8</span>
                <div id="chip-exact" class="absolute -top-2 -right-2 w-7 h-7 text-[10px] text-white shadow-md hidden"></div>
            </button>

            <!-- Under 7 -->
            <button onclick="placeUserBet('under')" id="spot-under" class="relative p-3 bg-[#1e293b] hover:bg-slate-800 rounded-xl flex flex-col items-center justify-center transition-all border-2 border-gray-700 shadow-lg active:scale-95">
                <span class="text-[11px] font-bold text-gray-300 uppercase">Under 7</span>
                <span class="text-xs font-black text-yellow-400 my-1">x 2.3</span>
                <div id="chip-under" class="absolute -top-2 -right-2 w-7 h-7 text-[10px] text-white shadow-md hidden"></div>
            </button>

        </div>

    </main>

    <!-- Fixed Bottom Footer (Balance & Chips Bar) -->
    <footer class="w-full max-w-md fixed bottom-0 z-50 bg-[#111827] border-t border-gray-800 flex flex-col">
        <div class="flex items-center justify-between px-3 py-2.5 text-xs bg-[#18181b]">
            <div class="flex flex-col">
                <span class="text-gray-400 text-[10px]">BALANCE</span>
                <span class="text-white font-mono font-bold text-sm">৳<span id="user-balance-display">0.00</span></span>
            </div>
            
            <!-- Chip Selector Buttons -->
            <div class="flex items-center space-x-2">
                <button onclick="setChip(10, 'bg-red-600')" class="w-8 h-8 rounded-full bg-red-600 text-white font-bold text-[10px] shadow flex items-center justify-center border-2 border-dashed border-white/70 chip-btn ring-2 ring-yellow-400" data-val="10" data-color="bg-red-600">10</button>
                <button onclick="setChip(50, 'bg-blue-600')" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold text-[10px] shadow flex items-center justify-center border-2 border-dashed border-white/70 chip-btn" data-val="50" data-color="bg-blue-600">50</button>
                <button onclick="setChip(100, 'bg-emerald-600')" class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold text-[10px] shadow flex items-center justify-center border-2 border-dashed border-white/70 chip-btn" data-val="100" data-color="bg-emerald-600">100</button>
                <button onclick="setChip(500, 'bg-neutral-900')" class="w-8 h-8 rounded-full bg-neutral-900 text-white font-bold text-[10px] shadow flex items-center justify-center border-2 border-dashed border-white/70 chip-btn" data-val="500" data-color="bg-neutral-900">500</button>
            </div>

            <div class="flex flex-col text-right">
                <span class="text-gray-400 text-[10px]">TOTAL BET</span>
                <span class="text-yellow-400 font-mono font-bold text-sm">৳<span id="total-bet-display">0.00</span></span>
            </div>
        </div>
    </footer>

    <script>
        let currentUserId = null;
        let userBalance = 0.00;
        let selectedChipValue = 10;
        let selectedChipColor = 'bg-red-600';
        let currentRoundState = 'betting';
        
        const ROUND_DURATION = 10; // ১০ সেকেন্ড
        
        let activeBets = {
            under: 0,
            over: 0,
            exact: 0
        };

        let activeBetChipColors = {
            under: '',
            over: '',
            exact: ''
        };

        function getClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof supabase !== 'undefined') return supabase;
            if (window.supabaseClient) return window.supabaseClient;
            if (window.supabase) return window.supabase;
            return null;
        }

        async function initGame() {
            const client = getClient();
            try {
                let user = null;
                if (typeof requireAuth === 'function') user = await requireAuth();
                else if (typeof getCurrentUser === 'function') user = await getCurrentUser();
                else if (client) {
                    const { data } = await client.auth.getUser();
                    user = data?.user;
                }

                if (user && client) {
                    currentUserId = user.id;
                    await fetchUserProfile(client, currentUserId);

                    client.channel('public:profiles')
                        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${currentUserId}` }, payload => {
                            if (payload.new && payload.new.balance !== undefined) {
                                userBalance = parseFloat(payload.new.balance) || 0.00;
                                updateBalanceUI();
                            }
                        })
                        .subscribe();
                } else {
                    alert('দয়া করে প্রথমে লগইন করুন!');
                    window.location.href = '../login.html';
                }
            } catch (err) {
                console.error("Auth init error:", err);
            }

            syncAndStartTimer();
            loadHistoryFromStorage();
        }

        async function fetchUserProfile(client, userId) {
            const { data: profile } = await client.from('profiles').select('balance').eq('id', userId).single();
            if (profile) {
                userBalance = parseFloat(profile.balance) || 0.00;
                updateBalanceUI();
            }
        }

        function setChip(val, colorClass) {
            selectedChipValue = val;
            selectedChipColor = colorClass;
            document.querySelectorAll('.chip-btn').forEach(btn => {
                if(parseInt(btn.getAttribute('data-val')) === val) {
                    btn.classList.add('ring-2', 'ring-yellow-400');
                } else {
                    btn.classList.remove('ring-2', 'ring-yellow-400');
                }
            });
        }
        window.setChip = setChip;

        function updateBalanceUI() {
            document.getElementById('user-balance-display').innerText = userBalance.toFixed(2);
            let total = Object.values(activeBets).reduce((a, b) => a + b, 0);
            document.getElementById('total-bet-display').innerText = total.toFixed(2);
        }

        function syncAndStartTimer() {
            let roundStartTime = localStorage.getItem('dice_round_start_time');
            let now = Date.now();

            if (!roundStartTime) {
                roundStartTime = now;
                localStorage.setItem('dice_round_start_time', roundStartTime);
            }

            let elapsedSeconds = Math.floor((now - parseInt(roundStartTime)) / 1000);
            let timeLeft = ROUND_DURATION - (elapsedSeconds % ROUND_DURATION);
            
            if (timeLeft <= 0) timeLeft = ROUND_DURATION;

            runTimerCountdown(timeLeft);
        }

        function runTimerCountdown(initialTime) {
            let timeLeft = initialTime;
            const timerDisplay = document.getElementById('timer-display');
            
            if (window.globalTimerInterval) clearInterval(window.globalTimerInterval);

            // টাইমার শুরু হওয়ার সাথে সাথেই ডাইসে রোলিং অ্যানিমেশন সচল করা (টাইম সিংক অনুযায়ী)
            if (timeLeft <= 3) {
                document.getElementById('dice-1').classList.add('rolling-anim');
                document.getElementById('dice-2').classList.add('rolling-anim');
            }

            window.globalTimerInterval = setInterval(() => {
                timerDisplay.innerText = timeLeft + 's';

                if (timeLeft <= 3 && timeLeft > 0) {
                    currentRoundState = 'rolling_soon';
                    document.getElementById('dice-1').classList.add('rolling-anim');
                    document.getElementById('dice-2').classList.add('rolling-anim');
                }

                if (timeLeft <= 0) {
                    clearInterval(window.globalTimerInterval);
                    localStorage.setItem('dice_round_start_time', Date.now());
                    lockBetsAndRollDice();
                }
                timeLeft--;
            }, 1000);
        }

        async function placeUserBet(spot) {
            let roundStartTime = parseInt(localStorage.getItem('dice_round_start_time') || Date.now());
            let elapsed = Math.floor((Date.now() - roundStartTime) / 1000);
            let timeLeft = ROUND_DURATION - (elapsed % ROUND_DURATION);

            if (timeLeft <= 2) {
                alert('এই রাউন্ডের বেটিং সময় শেষ!');
                return;
            }

            if (userBalance < selectedChipValue) {
                alert('পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            userBalance -= selectedChipValue;
            activeBets[spot] += selectedChipValue;
            activeBetChipColors[spot] = selectedChipColor;
            
            updateBalanceUI();
            updateChipsDisplay();

            const spotEl = document.getElementById(`spot-${spot}`);
            if(spotEl) {
                spotEl.classList.add('bet-spot-selected');
                setTimeout(() => spotEl.classList.remove('bet-spot-selected'), 300);
            }

            const client = getClient();
            if (client && currentUserId) {
                await client.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);
            }
        }
        window.placeUserBet = placeUserBet;

        function updateChipsDisplay() {
            Object.keys(activeBets).forEach(spot => {
                const chip = document.getElementById(`chip-${spot}`);
                if (chip) {
                    if (activeBets[spot] > 0) {
                        chip.className = `absolute -top-2 -right-2 px-2 py-0.5 rounded-full text-[10px] font-black text-white shadow-lg poker-chip ${activeBetChipColors[spot] || 'bg-red-600'}`;
                        chip.innerText = `৳${activeBets[spot]}`;
                        chip.classList.remove('hidden');
                    } else {
                        chip.classList.add('hidden');
                    }
                }
            });
        }

        function renderDiceDots(diceElementId, value) {
            const diceEl = document.getElementById(diceElementId);
            let dotPositions = '';

            switch(value) {
                case 1:
                    dotPositions = '<span class="col-start-2 row-start-2 w-3 h-3 bg-black rounded-full"></span>';
                    break;
                case 2:
                    dotPositions = `
                        <span class="col-start-1 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                    `;
                    break;
                case 3:
                    dotPositions = `
                        <span class="col-start-1 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-2 row-start-2 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                    `;
                    break;
                case 4:
                    dotPositions = `
                        <span class="col-start-1 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-1 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                    `;
                    break;
                case 5:
                    dotPositions = `
                        <span class="col-start-1 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-2 row-start-2 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-1 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                    `;
                    break;
                case 6:
                    dotPositions = `
                        <span class="col-start-1 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-1 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-1 row-start-2 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-2 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-1 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                        <span class="col-start-3 row-start-3 w-2.5 h-2.5 bg-black rounded-full"></span>
                    `;
                    break;
            }

            diceEl.innerHTML = `<div class="w-full h-full p-1.5 grid grid-cols-3 grid-rows-3 items-center justify-items-center">${dotPositions}</div>`;
        }

        async function lockBetsAndRollDice() {
            currentRoundState = 'rolling';
            document.getElementById('sum-result-text').innerText = 'ROLLING...';

            document.getElementById('dice-1').classList.add('rolling-anim');
            document.getElementById('dice-2').classList.add('rolling-anim');

            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const sum = d1 + d2;

            await new Promise(r => setTimeout(r, 1200));

            document.getElementById('dice-1').classList.remove('rolling-anim');
            document.getElementById('dice-2').classList.remove('rolling-anim');

            renderDiceDots('dice-1', d1);
            renderDiceDots('dice-2', d2);

            let winner = '';
            if (sum < 7) winner = 'under';
            else if (sum > 7) winner = 'over';
            else winner = 'exact';

            let userWonAny = false;
            let totalPayoutEarned = 0;
            const client = getClient();

            for (let spot in activeBets) {
                let bAmount = activeBets[spot];
                if (bAmount > 0) {
                    let isWinner = (spot === winner);
                    let payoutMultiplier = (spot === 'exact') ? 5.8 : 2.3;
                    let itemPayout = isWinner ? (bAmount * payoutMultiplier) : 0;
                    let targetNum = (spot === 'under') ? 6 : (spot === 'over') ? 8 : 7;

                    if (itemPayout > 0) {
                        userBalance += itemPayout;
                        totalPayoutEarned += itemPayout;
                        userWonAny = true;
                    }

                    if (client && currentUserId) {
                        await client.from('bets').insert({
                            user_id: currentUserId,
                            target_number: targetNum,
                            roll_result: sum,
                            bet_amount: bAmount,
                            payout: itemPayout,
                            is_bool: isWinner
                        });
                    }
                }
            }

            if (client && currentUserId) {
                await client.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);
            }

            updateBalanceUI();

            document.getElementById('sum-result-text').innerText = `TOTAL SUM: ${sum} (${winner.toUpperCase()})`;
            
            const overlay = document.getElementById('result-overlay');
            const overlayText = document.getElementById('overlay-text');
            
            let hasActiveBets = Object.values(activeBets).some(val => val > 0);

            if (hasActiveBets) {
                if (userWonAny) {
                    overlayText.innerText = `YOU WIN! ৳${totalPayoutEarned.toFixed(1)}`;
                    overlayText.className = "text-emerald-400 drop-shadow-[0_0_15px_rgba(16,185,129,0.8)] text-xl font-black";
                } else {
                    overlayText.innerText = "YOU LOST";
                    overlayText.className = "text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)] text-xl font-black";
                }
                overlay.classList.remove('hidden');
            }

            updateHistoryLog(sum);

            activeBets = { under: 0, over: 0, exact: 0 };
            updateChipsDisplay();

            setTimeout(() => {
                overlay.classList.add('hidden');
                syncAndStartTimer();
            }, 3500);
        }

        function updateHistoryLog(sum) {
            const container = document.getElementById('history-container');
            const span = document.createElement('span');
            span.className = `w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black text-white ${sum < 7 ? 'bg-gameRed' : sum > 7 ? 'bg-gameYellow' : 'bg-gameGreen'}`;
            span.innerText = sum;
            container.prepend(span);
            
            let histories = JSON.parse(localStorage.getItem('dice_game_histories') || '[]');
            histories.unshift(sum);
            if(histories.length > 10) histories.pop();
            localStorage.setItem('dice_game_histories', JSON.stringify(histories));

            if(container.children.length > 6) {
                container.lastChild.remove();
            }
        }

        function loadHistoryFromStorage() {
            let histories = JSON.parse(localStorage.getItem('dice_game_histories') || '[]');
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            histories.forEach(sum => {
                const span = document.createElement('span');
                span.className = `w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black text-white ${sum < 7 ? 'bg-gameRed' : sum > 7 ? 'bg-gameYellow' : 'bg-gameGreen'}`;
                span.innerText = sum;
                container.appendChild(span);
            });
        }

        document.addEventListener('DOMContentLoaded', initGame);
    </script>
