<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Under Over Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgDark: '#070a0f',
                        cardDark: '#18181b',
                        gameGreen: '#065f46',
                        gameRed: '#b91c1c',
                        gameYellow: '#d97706',
                        textGray: '#cbd5e1'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a0f;
            color: #f3f4f6;
            touch-action: manipulation;
        }
        .bet-spot-selected {
            border-color: #24ee89 !important;
            box-shadow: 0 0 15px rgba(36, 238, 137, 0.6);
        }

        @keyframes shakeDice {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-5deg); }
            40% { transform: translate(3px, -2px) rotate(5deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(-2deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .dice-shaking {
            animation: shakeDice 0.4s infinite ease-in-out;
        }

        /* ক্যাসিনো স্টাইল পপ-আপ অ্যানিমেশন */
        @keyframes popUpScale {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .casino-popup {
            animation: popUpScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* ক্যাসিনো চিপ ডিজাইন ஸ்டাইল */
        .casino-chip {
            border: 3px dashed rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-0 select-none selection:bg-yellow-500 selection:text-black">

    <!-- Main Game Wrapper -->
    <main class="w-full max-w-md flex flex-col bg-cardDark shadow-2xl overflow-hidden relative pb-16">
        
        <!-- Top Display Section (Dice Roll Area) -->
        <div class="relative w-full h-56 bg-gradient-to-b from-[#111827] to-[#1f2937] border-b border-gray-800 flex flex-col justify-between p-3 overflow-hidden">
            <div class="flex items-center justify-between w-full text-[11px] text-gray-400">
                <span class="bg-black/40 px-2.5 py-1 rounded border border-gray-700 font-medium text-yellow-400">7 Under / Over</span>
                <div class="flex items-center space-x-1 bg-black/40 px-2.5 py-1 rounded border border-gray-700 font-bold text-white">
                    <i class="fa-solid fa-clock text-yellow-400"></i>
                    <span id="timer-display">10s</span>
                </div>
            </div>

            <!-- Dice Rolling Animation Area -->
            <div id="dice-container-box" class="flex items-center justify-center space-x-6 my-auto">
                <!-- Dice 1 (Standard Dot Face Representation) -->
                <div id="dice-1" class="w-16 h-16 bg-white text-gray-900 rounded-xl shadow-2xl flex items-center justify-center border-4 border-gray-300">
                    <div class="grid grid-cols-3 grid-rows-3 w-10 h-10 p-1">  
                        <span class="dot-1 bg-black rounded-full m-auto w-2 h-2"></span>
                        <span class="dot-2 bg-transparent"></span>
                        <span class="dot-3 bg-black rounded-full m-auto w-2 h-2"></span>
                        <span class="dot-4 bg-transparent"></span>
                        <span class="dot-5 bg-black rounded-full m-auto w-2 h-2"></span>
                        <span class="dot-6 bg-transparent"></span>
                        <span class="dot-7 bg-black rounded-full m-auto w-2 h-2"></span>
                        <span class="dot-8 bg-transparent"></span>
                        <span class="dot-9 bg-black rounded-full m-auto w-2 h-2"></span>
                    </div>
                </div>
                <!-- Dice 2 -->
                <div id="dice-2" class="w-16 h-16 bg-white text-gray-900 rounded-xl shadow-2xl flex items-center justify-center border-4 border-gray-300">
                    <div class="grid grid-cols-3 grid-rows-3 w-10 h-10 p-1">
                        <span class="dot-1 bg-transparent"></span>
                        <span class="dot-2 bg-transparent"></span>
                        <span class="dot-3 bg-transparent"></span>
                        <span class="dot-4 bg-transparent"></span>
                        <span class="dot-5 bg-black rounded-full m-auto w-2 h-2"></span>
                        <span class="dot-6 bg-transparent"></span>
                        <span class="dot-7 bg-transparent"></span>
                        <span class="dot-8 bg-transparent"></span>
                        <span class="dot-9 bg-transparent"></span>
                    </div>
                </div>
            </div>

            <!-- Total Sum Result Display -->
            <div class="text-center">
                <span id="sum-result-text" class="text-xs font-bold text-gray-300 tracking-wider">ROLL THE DICE</span>
            </div>

            <!-- ক্যাসিনো স্টাইল উইন/লস পপ-আপ ওভারলে -->
            <div id="result-overlay" class="absolute inset-0 bg-black/70 z-20 flex items-center justify-center hidden backdrop-blur-[2px]">
                <div id="popup-box" class="casino-popup px-6 py-3 rounded-2xl shadow-2xl border-4 text-center font-black text-2xl tracking-widest uppercase">
                    YOU WIN
                </div>
            </div>
        </div>

        <!-- History Bar -->
        <div class="w-full h-12 bg-[#111827] border-b border-gray-800 flex items-center px-3 space-x-2 overflow-x-auto">
            <span class="text-[10px] text-gray-400 font-bold">HISTORY:</span>
            <div id="history-container" class="flex items-center space-x-1.5">
                <!-- History badges will load here -->
            </div>
        </div>

        <!-- Betting Options Layout (Under 7, Exactly 7, Over 7) -->
        <div class="p-3 flex flex-col space-y-3 bg-cardDark">
            
            <!-- Under 7 & Over 7 (Main Bets) -->
            <div class="grid grid-cols-2 gap-3">
                <!-- Under 7 (Payout 2.3) -->
                <button onclick="placeUserBet('under')" id="spot-under" class="relative p-4 bg-gameRed hover:bg-red-700 rounded-2xl flex flex-col items-center justify-center transition-all border-2 border-transparent shadow-lg active:scale-95">
                    <span class="text-[11px] font-bold text-white/80 uppercase tracking-widest">Under 2 - 6</span>
                    <span class="text-lg font-black text-white my-0.5">UNDER 7</span>
                    <span class="text-xs font-bold text-yellow-300">x 2.3</span>
                    <div id="chip-container-under" class="absolute bottom-2 right-2 flex items-center"></div>
                </button>

                <!-- Over 7 (Payout 2.3) -->
                <button onclick="placeUserBet('over')" id="spot-over" class="relative p-4 bg-gameYellow hover:bg-amber-600 rounded-2xl flex flex-col items-center justify-center transition-all border-2 border-transparent shadow-lg active:scale-95">
                    <span class="text-[11px] font-bold text-white/80 uppercase tracking-widest">Over 8 - 12</span>
                    <span class="text-lg font-black text-white my-0.5">OVER 7</span>
                    <span class="text-xs font-bold text-yellow-200">x 2.3</span>
                    <div id="chip-container-over" class="absolute bottom-2 right-2 flex items-center"></div>
                </button>
            </div>

            <!-- Exactly 7 / Equal 7 (High Payout 5.8) -->
            <button onclick="placeUserBet('exact')" id="spot-exact" class="relative p-3.5 bg-gameGreen hover:bg-emerald-700 rounded-2xl flex flex-col items-center justify-center transition-all border-2 border-transparent shadow-lg active:scale-95">
                <span class="text-[11px] font-bold text-white/80 uppercase tracking-widest">Lucky Number</span>
                <span class="text-xl font-black text-white">7 EQUAL</span>
                <span class="text-xs font-bold text-yellow-300">x 5.8</span>
                <div id="chip-container-exact" class="absolute bottom-2 right-2 flex items-center"></div>
            </button>

        </div>

    </main>

    <!-- Fixed Bottom Footer (Balance & Chips Bar) -->
    <footer class="w-full max-w-md fixed bottom-0 z-50 bg-[#111827] border-t border-gray-800 flex flex-col">
        <div class="flex items-center justify-between px-3 py-2.5 text-xs bg-[#18181b]">
            <div class="flex flex-col">
                <span class="text-gray-400 text-[10px]">BALANCE</span>
                <span class="text-white font-mono font-bold text-sm">৳<span id="user-balance-display">0.00</span></span>
            </div>
            
            <!-- Chip Selector Buttons (Different Colors) -->
            <div class="flex items-center space-x-1.5">
                <button onclick="setChip(10, 'bg-red-600')" class="w-8 h-8 rounded-full bg-red-600 text-white font-bold text-[10px] shadow flex items-center justify-center border border-white/20 casino-chip chip-btn" data-val="10">10</button>
                <button onclick="setChip(50, 'bg-blue-600')" class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold text-xs shadow flex items-center justify-center border border-white/20 casino-chip chip-btn" data-val="50">50</button>
                <button onclick="setChip(100, 'bg-emerald-600')" class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold text-[10px] shadow flex items-center justify-center border border-white/20 casino-chip chip-btn ring-2 ring-yellow-400" data-val="100">100</button>
                <button onclick="setChip(500, 'bg-purple-600')" class="w-8 h-8 rounded-full bg-purple-600 text-white font-bold text-[10px] shadow flex items-center justify-center border border-white/20 casino-chip chip-btn" data-val="500">500</button>
            </div>

            <div class="flex flex-col text-right">
                <span class="text-gray-400 text-[10px]">TOTAL BET</span>
                <span class="text-yellow-400 font-mono font-bold text-sm">৳<span id="total-bet-display">0.00</span></span>
            </div>
        </div>
    </footer>

    <script>
        let currentUserId = null;
        let userBalance = 0.00;
        let selectedChipValue = 100;
        let selectedChipColor = 'bg-emerald-600';
        let currentRoundState = 'betting';
        let timeLeft = 10;
        let globalTimerInterval = null;

        let activeBets = {
            under: 0,
            over: 0,
            exact: 0
        };

        // নির্দিষ্ট বেট স্পটে কোন কালারের চিপ কতবার বা কী পরিমাণে দেওয়া হয়েছে তার লগ
        let spotChipsData = {
            under: [],
            over: [],
            exact: []
        };

        function getClient() {
            if (typeof supabaseClient !== 'undefined') return supabaseClient;
            if (typeof supabase !== 'undefined') return supabase;
            if (window.supabaseClient) return window.supabaseClient;
            if (window.supabase) return window.supabase;
            return null;
        }

        async function initGame() {
            const client = getClient();
            try {
                let user = null;
                if (typeof requireAuth === 'function') user = await requireAuth();
                else if (typeof getCurrentUser === 'function') user = await getCurrentUser();
                else if (client) {
                    const { data } = await client.auth.getUser();
                    user = data?.user;
                }

                if (user && client) {
                    currentUserId = user.id;
                    await fetchUserProfile(client, currentUserId);

                    client.channel('public:profiles')
                        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles', filter: `id=eq.${currentUserId}` }, payload => {
                            if (payload.new && payload.new.balance !== undefined) {
                                userBalance = parseFloat(payload.new.balance) || 0.00;
                                updateBalanceUI();
                            }
                        })
                        .subscribe();
                } else {
                    alert('দয়া করে প্রথমে লগইন করুন!');
                    window.location.href = '../login.html';
                }
            } catch (err) {
                console.error("Auth init error:", err);
            }

            loadStateFromLocalStorage();
            startGlobalTimer();
        }

        async function fetchUserProfile(client, userId) {
            const { data: profile, error } = await client.from('profiles').select('balance').eq('id', userId).single();
            if (profile) {
                userBalance = parseFloat(profile.balance) || 0.00;
                updateBalanceUI();
            } else if (error) {
                console.error("Error fetching profile:", error);
            }
        }

        function setChip(val, colorClass) {
            selectedChipValue = val;
            selectedChipColor = colorClass;
            document.querySelectorAll('.chip-btn').forEach(btn => {
                if(parseInt(btn.getAttribute('data-val')) === val) {
                    btn.classList.add('ring-2', 'ring-yellow-400');
                } else {
                    btn.classList.remove('ring-2', 'ring-yellow-400');
                }
            });
        }
        window.setChip = setChip;

        function updateBalanceUI() {
            document.getElementById('user-balance-display').innerText = userBalance.toFixed(2);
            let total = Object.values(activeBets).reduce((a, b) => a + b, 0);
            document.getElementById('total-bet-display').innerText = total.toFixed(2);
        }

        // লোকাল স্টোরেজে টাইমার ও হিস্ট্রি সংরক্ষণ যাতে রিলোড করলে ক্লিয়ার না হয়
        function saveStateToLocalStorage() {
            const historyHTML = document.getElementById('history-container').innerHTML;
            localStorage.setItem('game_history', historyHTML);
            localStorage.setItem('game_time_left', timeLeft);
        }

        function loadStateFromLocalStorage() {
            const savedHistory = localStorage.getItem('game_history');
            if (savedHistory) {
                document.getElementById('history-container').innerHTML = savedHistory;
            }
            const savedTime = localStorage.getItem('game_time_left');
            if (savedTime && !isNaN(savedTime)) {
                timeLeft = parseInt(savedTime);
            }
        }

        function startGlobalTimer() {
            currentRoundState = 'betting';
            activeBets = { under: 0, over: 0, exact: 0 };
            spotChipsData = { under: [], over: [], exact: [] };
            updateChipsDisplay();
            updateBalanceUI();

            document.getElementById('sum-result-text').innerText = 'BETTING OPEN';
            document.getElementById('result-overlay').classList.add('hidden');

            if (globalTimerInterval) clearInterval(globalTimerInterval);

            globalTimerInterval = setInterval(() => {
                if (currentRoundState === 'betting') {
                    timeLeft--;
                    if (timeLeft < 0) timeLeft = 0;
                    document.getElementById('timer-display').innerText = timeLeft + 's';
                    saveStateToLocalStorage();

                    if (timeLeft <= 0) {
                        clearInterval(globalTimerInterval);
                        lockBetsAndRollDice();
                    }
                }
            }, 1000);
        }

        async function placeUserBet(spot) {
            if (currentRoundState !== 'betting') {
                alert('পরবর্তী রাউন্ডের জন্য অপেক্ষা করুন!');
                return;
            }

            if (userBalance < selectedChipValue) {
                alert('পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            userBalance -= selectedChipValue;
            activeBets[spot] += selectedChipValue;
            spotChipsData[spot].push({ value: selectedChipValue, color: selectedChipColor });
            
            updateBalanceUI();
            updateChipsDisplay();

            const spotEl = document.getElementById(`spot-${spot}`);
            if(spotEl) {
                spotEl.classList.add('bet-spot-selected');
                setTimeout(() => spotEl.classList.remove('bet-spot-selected'), 300);
            }

            const client = getClient();
            if (client && currentUserId) {
                await client.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);
            }
        }
        window.placeUserBet = placeUserBet;

        // সুনির্দিষ্ট কালার অনুযায়ী চিপ রেন্ডার করার ফাংশন
        function updateChipsDisplay() {
            Object.keys(activeBets).forEach(spot => {
                const container = document.getElementById(`chip-container-${spot}`);
                if (container) {
                    container.innerHTML = '';
                    if (activeBets[spot] > 0) {
                        // সর্বশেষ ব্যবহৃত চিপের কালার ও অ্যামাউন্ট শো করবে
                        let chipsList = spotChipsData[spot];
                        let lastChip = chipsList[chipsList.length - 1];
                        
                        let chipBadge = document.createElement('div');
                        chipBadge.className = `${lastChip ? lastChip.color : 'bg-green-600'} text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-lg border border-white/40 casino-chip flex items-center space-x-1`;
                        chipBadge.innerHTML = `<span>৳${activeBets[spot]}</span>`;
                        container.appendChild(chipBadge);
                    }
                }
            });
        }

        // ডাইসের ফোটা (Dot layout) রেন্ডার করার ফাংশন যাতে ইউজার কোনো স্ক্যাম মনে না করে
        function renderDiceFace(diceElementId, number) {
            const diceEl = document.getElementById(diceElementId);
            let dotConfig = '';

            // ১ থেকে ৬ এর স্ট্যান্ডার্ড ডট প্যাটার্ন
            if (number === 1) {
                dotConfig = `<span class="col-start-2 row-start-2 bg-black rounded-full w-2.5 h-2.5 m-auto"></span>`;
            } else if (number === 2) {
                dotConfig = `
                    <span class="col-start-1 row-start-1 bg-black rounded-full w-2.5 h-2.5 m-auto"></span>
                    <span class="col-start-3 row-start-3 bg-black rounded-full w-2.5 h-2.5 m-auto"></span>
                `;
            } else if (number === 3) {
                dotConfig = `
                    <span class="col-start-1 row-start-1 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-2 row-start-2 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-3 bg-black rounded-full w-2 h-2 m-auto"></span>
                `;
            } else if (number === 4) {
                dotConfig = `
                    <span class="col-start-1 row-start-1 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-1 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-1 row-start-3 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-3 bg-black rounded-full w-2 h-2 m-auto"></span>
                `;
            } else if (number === 5) {
                dotConfig = `
                    <span class="col-start-1 row-start-1 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-1 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-2 row-start-2 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-1 row-start-3 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-3 bg-black rounded-full w-2 h-2 m-auto"></span>
                `;
            } else if (number === 6) {
                dotConfig = `
                    <span class="col-start-1 row-start-1 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-1 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-1 row-start-2 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-2 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-1 row-start-3 bg-black rounded-full w-2 h-2 m-auto"></span>
                    <span class="col-start-3 row-start-3 bg-black rounded-full w-2 h-2 m-auto"></span>
                `;
            }

            diceEl.innerHTML = `<div class="grid grid-cols-3 grid-rows-3 w-10 h-10 p-0.5">${dotConfig}</div>`;
        }

        async function lockBetsAndRollDice() {
            currentRoundState = 'rolling';
            document.getElementById('sum-result-text').innerText = 'ROLLING...';

            const diceBox = document.getElementById('dice-container-box');
            diceBox.classList.add('dice-shaking');

            // ১ সেকেন্ড ধরে ডাইস ঘুরবে (রেন্ডম ফোটা ফ্লিকার করবে)
            let rollAnimTimer = setInterval(() => {
                renderDiceFace('dice-1', Math.floor(Math.random() * 6) + 1);
                renderDiceFace('dice-2', Math.floor(Math.random() * 6) + 1);
            }, 100);

            await new Promise(r => setTimeout(r, 1000));
            clearInterval(rollAnimTimer);
            diceBox.classList.remove('dice-shaking');

            // ফাইনাল রেন্ডম ফলাফল নির্ধারণ
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const sum = d1 + d2;

            renderDiceFace('dice-1', d1);
            renderDiceFace('dice-2', d2);

            let winner = '';
            if (sum < 7) winner = 'under';
            else if (sum > 7) winner = 'over';
            else winner = 'exact';

            const client = getClient();
            let totalRoundPayout = 0;
            let hasUserWonAny = false;
            let hasUserBetAnything = Object.values(activeBets).some(val => val > 0);

            for (let spot in activeBets) {
                let bAmount = activeBets[spot];
                if (bAmount > 0) {
                    let isWinner = (spot === winner);
                    if (isWinner) hasUserWonAny = true;

                    // আপডেটকৃত নতুন ওডস ও পেআউট (Under/Over এর জন্য 2.3 এবং Exact এর জন্য 5.8)
                    let payoutMultiplier = (spot === 'exact') ? 5.8 : 2.3; 
                    let itemPayout = isWinner ? (bAmount * payoutMultiplier) : 0;
                    let targetNum = (spot === 'under') ? 6 : (spot === 'over') ? 8 : 7;

                    if (itemPayout > 0) {
                        totalRoundPayout += itemPayout;
                    }

                    if (client && currentUserId) {
                        await client.from('bets').insert({
                            user_id: currentUserId,
                            target_number: targetNum,
                            roll_result: sum,
                            bet_amount: bAmount,
                            payout: itemPayout,
                            is_bool: isWinner
                        });
                    }
                }
            }

            if (totalRoundPayout > 0) {
                userBalance += totalRoundPayout;
            }

            if (client && currentUserId) {
                await client.from('profiles').update({ balance: userBalance }).eq('id', currentUserId);
            }

            updateBalanceUI();
            document.getElementById('sum-result-text').innerText = `TOTAL SUM: ${sum} (${winner.toUpperCase()})`;
            
            // ক্যাসিনো স্টাইল পপ-আপ মেসেজ (YOU WIN / YOU LOST)
            const overlay = document.getElementById('result-overlay');
            const popupBox = document.getElementById('popup-box');
            
            if (hasUserBetAnything) {
                if (hasUserWonAny) {
                    popupBox.className = "casino-popup px-6 py-3 rounded-2xl shadow-2xl border-4 border-yellow-400 bg-emerald-900 text-yellow-300 text-center font-black text-xl tracking-widest uppercase";
                    popupBox.innerText = "YOU WIN";
                } else {
                    popupBox.className = "casino-popup px-6 py-3 rounded-2xl shadow-2xl border-4 border-red-500 bg-red-950 text-red-400 text-center font-black text-xl tracking-widest uppercase";
                    popupBox.innerText = "YOU LOST";
                }
                overlay.classList.remove('hidden');
            }

            updateHistoryLog(sum);

            setTimeout(() => {
                overlay.classList.add('hidden');
                timeLeft = 10;
                startGlobalTimer();
            }, 3500);
        }

        function updateHistoryLog(sum) {
            const container = document.getElementById('history-container');
            const span = document.createElement('span');
            span.className = `w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black text-white ${sum < 7 ? 'bg-gameRed' : sum > 7 ? 'bg-gameYellow' : 'bg-gameGreen'}`;
            span.innerText = sum;
            container.prepend(span);
            if(container.children.length > 6) {
                container.lastChild.remove();
            }
            saveStateToLocalStorage();
        }

        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
