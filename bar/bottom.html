<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottom Navigation</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d131d;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0e1520;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 14px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 9999;
    }

    /* Navigation Item */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #8a99ad;
      gap: 5px;
      flex: 1;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s ease;
    }

    .nav-item:hover, .nav-item:active {
      color: #ffffff;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item span {
      font-size: 12px;
      font-weight: 500;
    }

    /* ---------------- Modal Drawer Styles (Bottom Sheet) ---------------- */
    /* Dark Backdrop / Overlay */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Bottom Drawer Panel */
    .drawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      max-height: 80vh;
      background-color: #121a24;
      z-index: 10001;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.6);
      transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      overflow-y: auto;
    }

    .drawer.show {
      bottom: 0;
    }

    /* Drawer Header */
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      color: #ffffff;
    }

    .drawer-header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8a99ad;
      font-size: 22px;
      cursor: pointer;
      padding: 5px;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    /* Drawer Menu Buttons (Vertical List) */
    .drawer-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drawer-btn {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 14px 16px;
      background-color: #1a2432;
      color: #e1e7ed;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .drawer-btn:hover {
      background-color: #243244;
      color: #ffffff;
    }

    .drawer-btn i {
      font-size: 18px;
      color: #a855f7;
    }
  </style>
</head>
<body>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <!-- সরাসরি ইনলাইন ক্লিক ইভেন্ট দেওয়া হয়েছে যাতে ফেচ করা পেজেও কোনো মিস না হয় -->
    <button type="button" class="nav-item" onclick="document.getElementById('modalDrawer').classList.add('show'); document.getElementById('drawerOverlay').classList.add('show');">
      <i class="fa-solid fa-bars"></i>
      <span>Menu</span>
    </button>

    <a href="/rafi444/search/search.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </a>

    <a href="/rafi444/reward/reward.html" class="nav-item">
      <i class="fa-solid fa-gift"></i>
      <span>Reward</span>
    </a>

    <a href="/rafi444/sports/sports.html" class="nav-item">
      <i class="fa-solid fa-trophy"></i>
      <span>Sports</span>
    </a>
  </nav>

  <!-- Overlay -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="this.classList.remove('show'); document.getElementById('modalDrawer').classList.remove('show');"></div>

  <!-- Modal Drawer (Bottom Sheet) -->
  <div class="drawer" id="modalDrawer">
    <div class="drawer-header">
      <h3>Menu</h3>
      <button type="button" class="close-btn" onclick="document.getElementById('modalDrawer').classList.remove('show'); document.getElementById('drawerOverlay').classList.remove('show');">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="drawer-menu">
      <a href="/rafi444/index.html" class="drawer-btn">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>

      <a href="#" class="drawer-btn">
        <i class="fa-regular fa-star"></i>
        <span>Favourites</span>
      </a>

      <a href="#" class="drawer-btn">
        <i class="fa-solid fa-rocket"></i>
        <span>Latest Releases</span>
      </a>

      <a href="#" class="drawer-btn">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Recently Played</span>
      </a>
    </div>
  </div>

</body>
</html>
