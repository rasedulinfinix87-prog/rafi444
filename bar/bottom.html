<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottom Navigation</title>

  <!-- 1. Font Awesome CDN (Icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 2. Supabase JS Client (Required before config) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 3. Your Supabase Config File -->
  <!-- আপনার ফোল্ডার স্ট্রাকচার অনুযায়ী সঠিক পাথ দিন (যেমন: ./supabase-config.js বা ../supabase-config.js) -->
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d131d;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0e1520;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0 16px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
    }

    /* Navigation Item */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #8a99ad;
      gap: 6px;
      flex: 1;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
      transition: color 0.2s ease;
    }

    .nav-item:hover, .nav-item:active {
      color: #b0c4de;
    }

    .nav-item i {
      font-size: 22px;
    }

    .nav-item span {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* ---------------- Modal Drawer Styles ---------------- */
    /* Dark Backdrop / Overlay */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Left Drawer Panel */
    .drawer {
      position: fixed;
      top: 0;
      left: -280px; /* Hidden by default */
      width: 280px;
      height: 100%;
      background-color: #121a24;
      z-index: 1002;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .drawer.active {
      left: 0; /* Slide in from left */
    }

    /* Drawer Header */
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      color: #ffffff;
    }

    .drawer-header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8a99ad;
      font-size: 20px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    /* Drawer Menu Buttons */
    .drawer-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drawer-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background-color: #1a2432;
      color: #e1e7ed;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .drawer-btn:hover {
      background-color: #243244;
      color: #ffffff;
    }

    .drawer-btn i {
      font-size: 18px;
      color: #f39c12; /* Golden Accent Icon */
    }
  </style>
</head>
<body>

  <!-- Bottom Navigation Component -->
  <nav class="bottom-nav">
    <button type="button" class="nav-item" id="openDrawer">
      <i class="fa-solid fa-bars"></i>
      <span>Menu</span>
    </button>

    <a href="/search/search.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </a>

    <a href="/reward/reward.html" class="nav-item">
      <i class="fa-solid fa-gift"></i>
      <span>Reward</span>
    </a>

    <a href="/sports/sports.html" class="nav-item">
      <i class="fa-solid fa-trophy"></i>
      <span>Sports</span>
    </a>
  </nav>

  <!-- Drawer Overlay -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Modal Drawer (Left Side) -->
  <div class="drawer" id="modalDrawer">
    <div class="drawer-header">
      <h3>Menu</h3>
      <button class="close-btn" id="closeDrawer">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="drawer-menu">
      <a href="/vip/vip.html" class="drawer-btn">
        <i class="fa-solid fa-crown"></i>
        <span>Vip</span>
      </a>

      <a href="/collection/collection.html" class="drawer-btn">
        <i class="fa-solid fa-layer-group"></i>
        <span>Collection</span>
      </a>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // DOM Elements
    const openDrawerBtn = document.getElementById('openDrawer');
    const closeDrawerBtn = document.getElementById('closeDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const modalDrawer = document.getElementById('modalDrawer');

    // Drawer Open Logic
    openDrawerBtn.addEventListener('click', () => {
      modalDrawer.classList.add('active');
      drawerOverlay.classList.add('active');
    });

    // Drawer Close Function
    const closeDrawer = () => {
      modalDrawer.classList.remove('active');
      drawerOverlay.classList.remove('active');
    };

    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // Optional: Check Supabase Authentication Status on Page Load
    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof getCurrentUser === "function") {
        const user = await getCurrentUser();
        if (user) {
          console.log("Logged in user:", user.id || user.email);
        } else {
          console.log("No active user session found.");
        }
      }
    });
  </script>

</body>
</html>
