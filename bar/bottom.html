<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottom Navigation</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS Client & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d131d;
    }

    /* Bottom Navigation Bar Container */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0e1520;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 14px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 9999;
    }

    /* Navigation Item */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #8a99ad;
      gap: 5px;
      flex: 1;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s ease;
    }

    .nav-item:hover, .nav-item:active {
      color: #ffffff;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item span {
      font-size: 12px;
      font-weight: 500;
    }

    /* ---------------- Modal Drawer Styles ---------------- */
    /* Dark Backdrop / Overlay */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Left Drawer Panel */
    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background-color: #121a24;
      z-index: 10001;
      box-shadow: 5px 0 20px rgba(0, 0, 0, 0.6);
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .drawer.show {
      left: 0;
    }

    /* Drawer Header */
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      color: #ffffff;
    }

    .drawer-header h3 {
      font-size: 18px;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      color: #8a99ad;
      font-size: 22px;
      cursor: pointer;
      padding: 5px;
    }

    .close-btn:hover {
      color: #ffffff;
    }

    /* Drawer Menu Buttons */
    .drawer-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drawer-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background-color: #1a2432;
      color: #e1e7ed;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .drawer-btn:hover {
      background-color: #243244;
      color: #ffffff;
    }

    .drawer-btn i {
      font-size: 18px;
      color: #f39c12;
    }
  </style>
</head>
<body>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button type="button" class="nav-item" id="openDrawer">
      <i class="fa-solid fa-bars"></i>
      <span>Menu</span>
    </button>

    <a href="search/search.html" class="nav-item">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </a>

    <a href="reward/reward.html" class="nav-item">
      <i class="fa-solid fa-gift"></i>
      <span>Reward</span>
    </a>

    <a href="sports/sports.html" class="nav-item">
      <i class="fa-solid fa-trophy"></i>
      <span>Sports</span>
    </a>
  </nav>

  <!-- Overlay -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Modal Drawer (Left Side) -->
  <div class="drawer" id="modalDrawer">
    <div class="drawer-header">
      <h3>Menu</h3>
      <button type="button" class="close-btn" id="closeDrawer">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="drawer-menu">
      <a href="vip/vip.html" class="drawer-btn">
        <i class="fa-solid fa-crown"></i>
        <span>Vip</span>
      </a>

      <a href="collection/collection.html" class="drawer-btn">
        <i class="fa-solid fa-layer-group"></i>
        <span>Collection</span>
      </a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const openDrawerBtn = document.getElementById('openDrawer');
      const closeDrawerBtn = document.getElementById('closeDrawer');
      const drawerOverlay = document.getElementById('drawerOverlay');
      const modalDrawer = document.getElementById('modalDrawer');

      // Modal Drawer খোলার লজিক
      function openDrawer() {
        modalDrawer.classList.add('show');
        drawerOverlay.classList.add('show');
      }

      // Modal Drawer বন্ধ করার লজিক
      function closeDrawer() {
        modalDrawer.classList.remove('show');
        drawerOverlay.classList.remove('show');
      }

      if (openDrawerBtn) {
        openDrawerBtn.addEventListener('click', function (e) {
          e.preventDefault();
          openDrawer();
        });
      }

      if (closeDrawerBtn) {
        closeDrawerBtn.addEventListener('click', closeDrawer);
      }

      if (drawerOverlay) {
        drawerOverlay.addEventListener('click', closeDrawer);
      }
    });
  </script>

</body>
</html>
