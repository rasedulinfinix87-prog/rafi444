<!-- Top Navigation Bar Container -->
<header class="w-full bg-[#0f141c] border-b border-[#222b3a] px-4 py-2.5 flex items-center justify-between text-white select-none">

  <!-- Left Side: Hamburger Menu Button -->
  <div class="flex items-center gap-3">
    <button id="hamburgerBtn" onclick="toggleSidebar()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-[#222b3a] transition focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Right Side -->
  <div class="flex items-center gap-3">

    <!-- Real Balance + Deposit -->
    <div class="flex items-center bg-[#0f141c] border border-[#222b3a] rounded-lg p-1 text-xs">
      <div class="flex items-center gap-1.5 px-2.5 py-1">
        <span class="w-2 h-2 rounded-full bg-[#24ee89] animate-pulse"></span>
        <span class="text-[#24ee89] font-bold text-sm">৳</span>
        <span id="topBarBalance" class="font-extrabold text-white text-sm">লোড হচ্ছে...</span>
      </div>

      <a href="account/deposit.html" id="depositLinkBtn" class="green-btn font-extrabold p-1.5 rounded-md transition flex items-center justify-center shadow-md">
        <svg class="w-4 h-4 text-[#0f141c]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
      </a>
    </div>

    <!-- Notifications -->
    <div class="relative">
      <button id="notifBtn" onclick="toggleNotifications()" class="relative p-2 text-gray-400 hover:text-white rounded-lg hover:bg-[#222b3a] transition focus:outline-none">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#24ee89] rounded-full ring-2 ring-[#0f141c]"></span>
      </button>

      <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-[#171d28] border border-[#222b3a] rounded-xl shadow-2xl z-50 overflow-hidden">
        <div class="p-3 border-b border-[#222b3a] flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300">Notifications</span>
          <button onclick="clearNotifications()" class="text-[10px] text-gray-500 hover:text-gray-300">Mark as read</button>
        </div>
        <div id="notifList" class="max-h-60 overflow-y-auto p-2 text-xs space-y-2 text-gray-400">
          <div class="p-2 bg-[#0f141c] rounded-lg border border-[#222b3a]">
            <p class="text-white font-medium text-[11px]">Welcome Bonus Received!</p>
            <span class="text-[9px] text-gray-500">Your initial deposit bonus has been credited.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Icon -->
    <a href="mem/member.html" id="profileLinkBtn" class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-[#222b3a] transition border border-[#222b3a] flex items-center justify-center bg-[#0f141c]">
      <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </a>

  </div>
</header>

<script>
(function () {
  // Prevent duplicate initialization if header is loaded more than once.
  if (window.__topBarBalanceInitialized) return;
  window.__topBarBalanceInitialized = true;

  let balanceChannel = null;
  let currentBalanceUserId = null;
  let refreshInProgress = false;

  function showBalance(value) {
    const el = document.getElementById("topBarBalance");
    if (!el) return;

    const amount = Number(value);
    if (!Number.isFinite(amount)) {
      el.textContent = "ত্রুটি";
      return;
    }

    el.textContent = amount.toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  async function loadBalance() {
    if (refreshInProgress) return;
    refreshInProgress = true;

    try {
      if (typeof supabaseClient === "undefined") {
        console.error("top.html: supabaseClient পাওয়া যায়নি।");
        showBalance("ত্রুটি");
        return;
      }

      const { data: { user }, error: authError } =
        await supabaseClient.auth.getUser();

      if (authError || !user) {
        showBalance("লগইন করুন");
        if (balanceChannel) {
          await supabaseClient.removeChannel(balanceChannel);
          balanceChannel = null;
        }
        currentBalanceUserId = null;
        return;
      }

      if (currentBalanceUserId !== user.id) {
        if (balanceChannel) {
          await supabaseClient.removeChannel(balanceChannel);
          balanceChannel = null;
        }

        currentBalanceUserId = user.id;

        balanceChannel = supabaseClient
          .channel("topbar-balance-" + user.id)
          .on(
            "postgres_changes",
            {
              event: "UPDATE",
              schema: "public",
              table: "profiles",
              filter: "id=eq." + user.id
            },
            function (payload) {
              if (payload.new && payload.new.balance !== undefined) {
                showBalance(payload.new.balance);
              } else {
                loadBalance();
              }
            }
          )
          .subscribe(function (status) {
            if (status === "CHANNEL_ERROR" ||
                status === "TIMED_OUT") {
              console.warn("Top bar realtime status:", status);
            }
          });
      }

      const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("balance")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        console.error("top.html balance query failed:", error);
        showBalance("ত্রুটি");
        return;
      }

      if (!profile) {
        console.error("এই ইউজারের profiles রেকর্ড পাওয়া যায়নি:", user.id);
        showBalance("পাওয়া যায়নি");
        return;
      }

      showBalance(profile.balance);

    } catch (err) {
      console.error("top.html balance error:", err);
      showBalance("ত্রুটি");
    } finally {
      refreshInProgress = false;
    }
  }

  // Initial balance load.
  loadBalance();

  // Refresh when the page becomes active again.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) loadBalance();
  });

  window.addEventListener("focus", loadBalance);

  // Allows a game to request a balance refresh after a bet or payout.
  window.refreshTopBarBalance = loadBalance;

  // Fallback refresh for game pages that update balance without Realtime.
  window.setInterval(function () {
    if (!document.hidden) loadBalance();
  }, 5000);
})();
</script>
