</header><script>
(function () {
  // Prevent duplicate initialization if the header is loaded more than once.
  if (window.__topBarBalanceInitialized) {
    if (typeof window.syncTopBarBalance === 'function') {
      window.syncTopBarBalance();
    }
    return;
  }

  window.__topBarBalanceInitialized = true;

  let profileSubscription = null;
  let currentSubscribedUserId = null;
  let balanceSyncInProgress = false;

  window.updateBalanceUI = function (newBalance) {
    const el = document.getElementById('topBarBalance');
    if (!el || newBalance === null || newBalance === undefined) return;

    const amount = Number(newBalance);
    if (!Number.isFinite(amount)) {
      console.error('Invalid profile balance:', newBalance);
      return;
    }

    el.textContent = amount.toFixed(2);
  };

  window.syncTopBarBalance = async function () {
    if (balanceSyncInProgress) return;

    if (
      typeof supabaseClient === 'undefined' ||
      typeof getCurrentUser !== 'function'
    ) {
      console.error(
        'Top bar: supabaseClient/getCurrentUser unavailable. Check script loading order.'
      );
      return;
    }

    balanceSyncInProgress = true;

    try {
      const user = await getCurrentUser();

      if (!user) {
        window.updateBalanceUI(0);
        return;
      }

      // Fetch the signed-in user's current balance.
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('balance')
        .eq('id', user.id)
        .maybeSingle();

      if (error) {
        console.error('Top bar profile balance error:', error.message);
        return;
      }

      if (!profile) {
        console.error(
          'No profiles row found for the signed-in user:',
          user.id
        );
        return;
      }

      window.updateBalanceUI(profile.balance);

      // Subscribe only once per signed-in user.
      if (currentSubscribedUserId !== user.id) {
        if (profileSubscription) {
          await supabaseClient.removeChannel(profileSubscription);
          profileSubscription = null;
        }

        currentSubscribedUserId = user.id;

        profileSubscription = supabaseClient
          .channel('topbar-balance-' + user.id)
          .on(
            'postgres_changes',
            {
              event: 'UPDATE',
              schema: 'public',
              table: 'profiles',
              filter: 'id=eq.' + user.id
            },
            function (payload) {
              if (
                payload.new &&
                payload.new.id === user.id &&
                payload.new.balance !== undefined
              ) {
                window.updateBalanceUI(payload.new.balance);
              }
            }
          )
          .subscribe(function (status) {
            if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
              console.error('Top bar realtime subscription status:', status);
            }
          });
      }
    } catch (err) {
      console.error('Top bar balance sync error:', err);
    } finally {
      balanceSyncInProgress = false;
    }
  };

  window.toggleNotifications = function () {
    const dropdown = document.getElementById('notifDropdown');
    if (dropdown) dropdown.classList.toggle('hidden');
  };

  window.clearNotifications = function () {
    const badge = document.getElementById('notifBadge');
    if (badge) badge.classList.add('hidden');
  };

  window.toggleSidebar = function () {
    const sidebar = document.getElementById('appSidebar');
    if (sidebar) {
      sidebar.classList.toggle('hidden');
    } else {
      console.log('Sidebar element #appSidebar was not found.');
    }
  };

  // Run whether this script loads before or after DOMContentLoaded.
  function initializeTopBar() {
    window.syncTopBarBalance();

    if (
      typeof supabaseClient !== 'undefined' &&
      supabaseClient.auth
    ) {
      supabaseClient.auth.onAuthStateChange(function (event) {
        if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
          window.syncTopBarBalance();
        } else if (event === 'SIGNED_OUT') {
          window.updateBalanceUI(0);
          currentSubscribedUserId = null;

          if (profileSubscription) {
            supabaseClient.removeChannel(profileSubscription);
            profileSubscription = null;
          }
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeTopBar, {
      once: true
    });
  } else {
    initializeTopBar();
  }
})();
</script>
