<!-- Top Navigation Bar Container -->
<header class="w-full bg-[#0F212E] border-b border-[#0F212E] px-4 py-3.5 flex items-center justify-between text-[#FFFFFF] select-none">
  <!-- Left Side: Logo (Dynamic Root Path) -->
  <div class="flex items-center gap-3">
    <a href="/rafi444/index.html" class="flex items-center focus:outline-none">
      <img src="/rafi444/assets/images/logo.png" alt="Logo" class="h-7 w-auto object-contain" onerror="this.style.display='none'" />
    </a>
  </div>

  <!-- Right Side: Balance, Deposit, Notifications & Profile -->
  <div class="flex items-center gap-3">
    <!-- Balance & Deposit Box -->
    <div class="flex items-center bg-[#0F212E] border border-[#0F212E] rounded-lg p-1 text-[var(--font-xs)]">
      <div class="flex items-center px-3 py-1">
        <span id="topBarBalance" class="font-extrabold text-[#FFFFFF] text-[var(--font-md)] tracking-wide">0.00</span>
      </div>
      
      <!-- Deposit / Wallet Button linked to account/deposit.html -->
      <a href="/rafi444/account/deposit.html" id="depositLinkBtn" class="bg-[#24ee89] hover:bg-[#1ebc6d] text-[#0F212E] font-extrabold p-2 rounded-md transition flex items-center justify-center shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
      </a>
    </div>

    <!-- Notification Icon -->
    <div class="relative">
      <button id="notifBtn" onclick="toggleNotifications()" class="relative p-2.5 text-[#FFFFFF] hover:text-white rounded-lg hover:bg-[#1A2C38] transition focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span id="notifBadge" class="absolute top-2 right-2 w-2 h-2 bg-[#24ee89] rounded-full ring-2 ring-[#0F212E]"></span>
      </button>

      <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-[#1A2C38] border border-[#0F212E] rounded-xl shadow-2xl z-50 overflow-hidden">
        <div class="p-3 border-b border-[#0F212E] flex justify-between items-center">
          <span class="text-[var(--font-xs)] font-bold text-[#FFFFFF]">Notifications</span>
          <button onclick="clearNotifications()" class="text-[10px] text-[#FFFFFF]/70 hover:text-[#FFFFFF]">Mark as read</button>
        </div>
        <div id="notifList" class="max-h-60 overflow-y-auto p-2 text-[var(--font-xs)] space-y-2 text-[#FFFFFF]/80">
          <div class="p-2 bg-[#0F212E] rounded-lg border border-[#0F212E]">
            <p class="text-[#FFFFFF] font-medium text-[11px]">Welcome Bonus Received!</p>
            <span class="text-[9px] text-[#FFFFFF]/70">Your initial deposit bonus has been credited.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Icon -->
    <a href="/rafi444/mem/member.html" id="profileLinkBtn" class="p-2 text-[#FFFFFF] hover:text-white rounded-lg hover:bg-[#1A2C38] transition border border-[#0F212E] flex items-center justify-center bg-[#0F212E]">
      <svg class="w-6 h-6 text-[#FFFFFF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </a>
  </div>
</header>

<script>
(function () {
  'use strict';

  let balanceSyncInProgress = false;
  let balanceRefreshTimer = null;
  let profileChannel = null;

  function getTopBarSupabaseClient() {
    if (typeof supabaseClient !== 'undefined' && supabaseClient) {
      return supabaseClient;
    }
    return null;
  }

  async function syncTopBarBalance() {
    if (balanceSyncInProgress) return;

    const balanceElement = document.getElementById('topBarBalance');
    if (!balanceElement) return;

    balanceSyncInProgress = true;

    try {
      const storedUser = localStorage.getItem('current_user');

      if (!storedUser) {
        balanceElement.textContent = '0.00';
        return;
      }

      let currentUserObj;

      try {
        currentUserObj = JSON.parse(storedUser);
      } catch (error) {
        console.error('Top bar: invalid current_user data.', error);
        return;
      }

      const userId =
        currentUserObj.id ||
        currentUserObj.user_id ||
        currentUserObj.uid;

      if (!userId) return;

      const client = getTopBarSupabaseClient();
      if (!client) return;

      const { data: profile, error } = await client
        .from('profiles')
        .select('id, balance')
        .eq('id', userId)
        .maybeSingle();

      if (error || !profile) return;

      const balance = Number(profile.balance);

      if (profile.balance !== null &&
          profile.balance !== undefined &&
          Number.isFinite(balance)) {
        balanceElement.textContent = balance.toFixed(2);
      }
    } catch (error) {
        console.error('Top bar balance synchronization error:', error);
    } finally {
      balanceSyncInProgress = false;
    }
  }

  function subscribeToTopBarBalance() {
    const client = getTopBarSupabaseClient();
    if (!client) return;

    const storedUser = localStorage.getItem('current_user');
    if (!storedUser) return;

    let user;

    try {
      user = JSON.parse(storedUser);
    } catch (_) {
      return;
    }

    const userId = user.id || user.user_id || user.uid;
    if (!userId) return;

    if (profileChannel) {
      client.removeChannel(profileChannel);
      profileChannel = null;
    }

    profileChannel = client
      .channel('top-bar-balance-' + userId)
      .on(
        'postgres_changes',
        {
          event: 'UPDATE',
          schema: 'public',
          table: 'profiles',
          filter: 'id=eq.' + userId
        },
        function (payload) {
          const balanceElement = document.getElementById('topBarBalance');
          const newBalance = Number(payload.new && payload.new.balance);

          if (
            balanceElement &&
            payload.new &&
            payload.new.balance !== null &&
            payload.new.balance !== undefined &&
            Number.isFinite(newBalance)
          ) {
            balanceElement.textContent = newBalance.toFixed(2);
          } else {
            syncTopBarBalance();
          }
        }
      )
      .subscribe();
  }

  function startTopBarBalanceSync() {
    syncTopBarBalance();
    subscribeToTopBarBalance();

    if (balanceRefreshTimer) {
      clearInterval(balanceRefreshTimer);
    }

    balanceRefreshTimer = setInterval(syncTopBarBalance, 5000);

    window.addEventListener('focus', syncTopBarBalance);

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) syncTopBarBalance();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startTopBarBalanceSync);
  } else {
    startTopBarBalanceSync();
  }
})();
</script>
