</header><script>
(function () {
  // This script can execute more than once when the header is reloaded.
  if (window.__topBarScriptInstalled) {
    if (typeof window.syncTopBarBalance === 'function') {
      window.syncTopBarBalance();
    }
    return;
  }

  window.__topBarScriptInstalled = true;

  let activeChannel = null;
  let activeUserId = null;
  let authListenerRegistered = false;
  let syncSequence = 0;

  function getClient() {
    return typeof supabaseClient !== 'undefined'
      ? supabaseClient
      : null;
  }

  function displayBalance(value) {
    const element = document.getElementById('topBarBalance');
    if (!element || value === null || value === undefined) return;

    const amount = Number(value);
    if (Number.isFinite(amount)) {
      element.textContent = amount.toFixed(2);
    } else {
      console.error('Top bar: Invalid balance value.');
    }
  }

  window.updateBalanceUI = displayBalance;

  async function resolveUser(client) {
    // Prefer the active Supabase session.
    try {
      const { data, error } = await client.auth.getUser();

      if (!error && data && data.user) {
        return data.user;
      }
    } catch (error) {
      console.error('Top bar auth lookup failed:', error);
    }

    // Fallback to the same user ID source used by My Account.
    try {
      const stored = localStorage.getItem('current_user');

      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed && parsed.id) {
          return { id: parsed.id };
        }
      }
    } catch (error) {
      console.error('Top bar stored user lookup failed:', error);
    }

    return null;
  }

  async function attachRealtime(client, userId) {
    if (activeUserId === userId && activeChannel) return;

    if (activeChannel) {
      try {
        await client.removeChannel(activeChannel);
      } catch (error) {
        console.error('Top bar channel cleanup failed:', error);
      }
      activeChannel = null;
    }

    activeUserId = userId;

    activeChannel = client
      .channel('topbar-balance-' + userId)
      .on(
        'postgres_changes',
        {
          event: 'UPDATE',
          schema: 'public',
          table: 'profiles',
          filter: 'id=eq.' + userId
        },
        function (payload) {
          if (
            payload.new &&
            payload.new.id === userId &&
            payload.new.balance !== undefined
          ) {
            displayBalance(payload.new.balance);
          }
        }
      )
      .subscribe(function (status) {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.error('Top bar realtime error:', status);
        }
      });
  }

  window.syncTopBarBalance = async function () {
    const thisSync = ++syncSequence;
    const client = getClient();

    if (!client) {
      console.error(
        'Top bar: supabaseClient not found. Load Supabase and supabase-config.js first.'
      );
      return;
    }

    try {
      const user = await resolveUser(client);

      if (thisSync !== syncSequence) return;

      if (!user || !user.id) {
        console.warn('Top bar: No logged-in user was found.');
        return;
      }

      const { data: profile, error } = await client
        .from('profiles')
        .select('balance')
        .eq('id', user.id)
        .maybeSingle();

      if (thisSync !== syncSequence) return;

      if (error) {
        console.error('Top bar balance query failed:', error.message);
        return;
      }

      if (!profile) {
        console.error(
          'Top bar: No matching profiles row for user ID:',
          user.id
        );
        return;
      }

      displayBalance(profile.balance);
      await attachRealtime(client, user.id);

    } catch (error) {
      console.error('Top bar balance sync failed:', error);
    }
  };

  window.toggleNotifications = function () {
    const element = document.getElementById('notifDropdown');
    if (element) element.classList.toggle('hidden');
  };

  window.clearNotifications = function () {
    const badge = document.getElementById('notifBadge');
    if (badge) badge.classList.add('hidden');
  };

  window.toggleSidebar = function () {
    const sidebar = document.getElementById('appSidebar');
    if (sidebar) {
      sidebar.classList.toggle('hidden');
    } else {
      console.warn('Sidebar #appSidebar was not found.');
    }
  };

  function initialize() {
    window.syncTopBarBalance();

    const client = getClient();

    if (client && client.auth && !authListenerRegistered) {
      authListenerRegistered = true;

      client.auth.onAuthStateChange(function (event) {
        if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
          window.syncTopBarBalance();
        }

        if (event === 'SIGNED_OUT') {
          syncSequence++;
          displayBalance(0);
          activeUserId = null;

          if (activeChannel) {
            client.removeChannel(activeChannel);
            activeChannel = null;
          }
        }
      });
    }
  }

  // Works whether the HTML is loaded before or after DOMContentLoaded.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize, {
      once: true
    });
  } else {
    initialize();
  }

  // Public function for pages that insert this HTML with fetch().
  window.initializeTopBar = initialize;

})();
</script>
