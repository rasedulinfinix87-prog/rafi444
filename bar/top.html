<!-- Top Navigation Bar Container -->
<header class="w-full bg-[#161b22] border-b border-gray-800/80 px-4 py-2.5 flex justify-between items-center text-white select-none sticky top-0 z-40">  
  <!-- Left Side: Hamburger Menu Button -->
  <div class="flex items-center gap-3">
    <button id="hamburgerBtn" onclick="toggleSidebar()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Right Side -->
  <div class="flex items-center gap-3">
    <!-- Balance and Deposit Button Group -->
    <div class="flex items-center bg-[#0f141c] border border-gray-800 rounded-lg p-1 text-xs">
      <div class="flex items-center gap-1.5 px-2.5 py-1">
        <span class="w-2 h-2 rounded-full bg-[#24ee89] animate-pulse"></span>
        <span id="topBarCurrency" class="text-gray-400 font-semibold text-[11px]">৳</span>
        <span id="topBarBalance" class="font-extrabold text-[#24ee89] text-sm">0.00</span>
      </div>

      <a href="../account/deposit.html" id="depositLinkBtn" class="bg-[#24ee89] hover:bg-emerald-400 text-black font-extrabold p-1.5 rounded-md transition flex items-center justify-center shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
      </a>
    </div>

    <!-- Notification Icon -->
    <div class="relative">
      <button id="notifBtn" onclick="toggleNotifications()" class="relative p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition focus:outline-none">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-[#161b22]"></span>
      </button>

      <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-[#161b22] border border-gray-800 rounded-xl shadow-2xl z-50 overflow-hidden">
        <div class="p-3 border-b border-gray-800 flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300">Notifications</span>
          <button onclick="clearNotifications()" class="text-[10px] text-gray-500 hover:text-gray-300">Mark as read</button>
        </div>
        <div id="notifList" class="max-h-60 overflow-y-auto p-2 text-xs space-y-2 text-gray-400">
          <div class="p-2 bg-[#0f141c] rounded-lg border border-gray-800/60">
            <p class="text-white font-medium text-[11px]">Welcome Bonus Received!</p>
            <span class="text-[9px] text-gray-500">Your initial deposit bonus has been credited.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Icon -->
    <a href="../mem/member.html" id="profileLinkBtn" class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition border border-gray-800 flex items-center justify-center bg-[#0f141c]">
      <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </a>
  </div>
</header>

<script>
  window.toggleNotifications = function() {
    var d = document.getElementById('notifDropdown');
    if (d) d.classList.toggle('hidden');
  };

  window.clearNotifications = function() {
    var b = document.getElementById('notifBadge');
    if (b) b.classList.add('hidden');
  };

  window.toggleSidebar = function() {
    var s = document.getElementById('appSidebar');
    if (s) s.classList.toggle('hidden');
  };

  (function() {
    async function directSyncBalance() {
      try {
        if (typeof supabaseClient === 'undefined') return;

        let userId = null;
        
        // ১. Supabase auth থেকে ইউজার বের করার চেষ্টা
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user && user.id) {
          userId = user.id;
        } else {
          // ২. localStorage বা অন্য সোর্স থেকেFallback
          const localUser = localStorage.getItem('current_user');
          if (localUser) {
            const parsed = JSON.parse(localUser);
            if (parsed && parsed.id) userId = parsed.id;
          }
        }

        if (!userId) return;

        // গেমের গ্লোবাল আইডিতে সেট করা
        window.currentUserId = userId;
        if (typeof currentUserId !== 'undefined') currentUserId = userId;

        // profiles টেবিল থেকে সরাসরি ব্যালান্স ফেচ করা
        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('balance')
          .eq('id', userId)
          .maybeSingle();

        if (error || !profile) return;

        const currentBal = Number(profile.balance) || 0;

        // UI-তে ব্যালান্স বসানো
        const balanceElem = document.getElementById('topBarBalance');
        if (balanceElem) {
          balanceElem.textContent = currentBal.toFixed(2);
        }

        // গেমের নিজস্ব ভ্যারিয়েবলগুলোতে ব্যালান্স পুশ করা
        if (typeof balance !== 'undefined') balance = currentBal;
        if (typeof userBalance !== 'undefined') userBalance = currentBal;
        window.balance = currentBal;

      } catch (err) {
        console.error('Direct balance sync error:', err);
      }
    }

    // পেজ লোড হওয়ার সাথে সাথে এবং ১ সেকেন্ড পরপর নিশ্চিত করার জন্য সিঙ্ক কল করা
    directSyncBalance();
    setTimeout(directSyncBalance, 800);
    setInterval(directSyncBalance, 3000);
  })();
</script>
