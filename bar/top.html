<!-- Top Navigation Bar Container -->
<header class="w-full bg-[#080B10] border-b border-[rgba(245,207,102,0.25)] px-4 py-2.5 flex items-center justify-between text-white select-none">  
  <!-- Left Side: Hamburger Menu Button -->  
  <div class="flex items-center gap-3">
    <button id="hamburgerBtn" onclick="toggleSidebar()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-[rgba(245,207,102,0.1)] transition focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>  

  <!-- Right Side -->  
  <div class="flex items-center gap-3">
    <!-- Balance and Deposit -->
    <div class="flex items-center bg-[#080B10] border border-[rgba(245,207,102,0.25)] rounded-lg p-1 text-xs">
      <div class="flex items-center gap-1.5 px-2.5 py-1">
        <span class="w-2 h-2 rounded-full bg-[#F5CF66] animate-pulse"></span>
        <span class="text-[#F5CF66] font-bold text-sm">৳</span>
        <span id="topBarBalance" class="font-extrabold text-white text-sm">0.00</span>
      </div>

      <a href="account/deposit.html" id="depositLinkBtn" class="gold-button font-extrabold p-1.5 rounded-md transition flex items-center justify-center shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
      </a>
    </div>

    <!-- Notifications -->
    <div class="relative">
      <button id="notifBtn" onclick="toggleNotifications()" class="relative p-2 text-gray-400 hover:text-white rounded-lg hover:bg-[rgba(245,207,102,0.1)] transition focus:outline-none">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#F5CF66] rounded-full ring-2 ring-[#080B10]"></span>
      </button>

      <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-[#080B10] border border-[rgba(245,207,102,0.25)] rounded-xl shadow-2xl z-50 overflow-hidden">
        <div class="p-3 border-b border-[rgba(245,207,102,0.25)] flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300">Notifications</span>
          <button onclick="clearNotifications()" class="text-[10px] text-gray-500 hover:text-gray-300">Mark as read</button>
        </div>

        <div id="notifList" class="max-h-60 overflow-y-auto p-2 text-xs space-y-2 text-gray-400">
          <div class="p-2 bg-[#1a212d] rounded-lg border border-[rgba(245,207,102,0.15)]">
            <p class="text-white font-medium text-[11px]">Welcome Bonus Received!</p>
            <span class="text-[9px] text-gray-500">Your initial deposit bonus has been credited.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile -->
    <a href="mem/member.html" id="profileLinkBtn" class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-[rgba(245,207,102,0.1)] transition border border-[rgba(245,207,102,0.25)] flex items-center justify-center bg-[#080B10]">
      <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </a>
  </div>
</header>

<script>
  window.__topBarBalanceBooted = true;

  window.toggleNotifications = function() {
    var d = document.getElementById('notifDropdown');
    if (d) d.classList.toggle('hidden');
  };

  window.clearNotifications = function() {
    var b = document.getElementById('notifBadge');
    if (b) b.classList.add('hidden');
  };

  window.toggleSidebar = function() {
    var s = document.getElementById('appSidebar');
    if (s) s.classList.toggle('hidden');
  };

  (function() {
    var channel = null;
    var activeId = null;

    window.updateBalanceUI = function(v) {
      var e = document.getElementById('topBarBalance');
      if (!e || v === null || v === undefined) return;
      var n = Number(v);
      if (Number.isFinite(n)) {
        e.textContent = n.toFixed(2);
      }
    };

    window.syncTopBarBalance = async function() {
      try {
        if (typeof supabaseClient === 'undefined') return;
        var u = null;

        if (typeof getCurrentUser === 'function') {
          try {
            u = await getCurrentUser();
          } catch (e) {
            console.warn('Top bar auth lookup failed', e);
          }
        }

        if (!u) {
          try {
            var raw = localStorage.getItem('current_user');
            if (raw) {
              var saved = JSON.parse(raw);
              if (saved && saved.id) {
                u = { id: saved.id };
              }
            }
          } catch (e) {
            console.warn('Could not read saved user', e);
          }
        }

        if (!u || !u.id) return;

        // গেমের গ্লোবাল স্কোপের জন্য আইডি এবং ব্যালেন্স সেট করে দেওয়া
        if (typeof currentUserId !== 'undefined') {
          currentUserId = u.id;
        }

        var r = await supabaseClient.from('profiles').select('balance').eq('id', u.id).maybeSingle();
        if (r.error) {
          console.error('Top bar balance query failed:', r.error.message);
          return;
        }
        if (!r.data) {
          console.error('Top bar profile not found for user:', u.id);
          return;
        }

        var currentFetchedBalance = Number(r.data.balance) || 0;
        window.updateBalanceUI(currentFetchedBalance);

        if (typeof balance !== 'undefined') {
          balance = currentFetchedBalance;
        }

        if (activeId !== u.id) {
          if (channel) {
            try { await supabaseClient.removeChannel(channel); } catch (e) {}
          }
          activeId = u.id;
          channel = supabaseClient.channel('topbar-balance-fallback-' + u.id)
            .on(
              'postgres_changes',
              { event: 'UPDATE', schema: 'public', table: 'profiles', filter: 'id=eq.' + u.id },
              function(payload) {
                if (payload.new && payload.new.id === u.id && payload.new.balance !== undefined) {
                  var newBal = Number(payload.new.balance) || 0;
                  window.updateBalanceUI(newBal);
                  if (typeof balance !== 'undefined') {
                    balance = newBal;
                  }
                }
              }
            )
            .subscribe();
        }
      } catch (e) {
        console.error('Top bar balance sync error:', e);
      }
    };

    window.syncTopBarBalance();

    if (typeof supabaseClient !== 'undefined' && supabaseClient.auth) {
      supabaseClient.auth.onAuthStateChange(function(event) {
        if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
          window.syncTopBarBalance();
        }
        if (event === 'SIGNED_OUT') {
          window.updateBalanceUI(0);
          if (typeof balance !== 'undefined') balance = 0;
          activeId = null;
          if (channel) {
            supabaseClient.removeChannel(channel);
            channel = null;
          }
        }
      });
    }

    // GitHub Pages sub-folder path adjuster for links
    document.addEventListener('DOMContentLoaded', () => {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      let depth = pathSegments.length > 1 ? pathSegments.length - 1 : 0;
      if (!window.location.hostname.includes('github.io')) {
        depth = pathSegments.length > 0 ? pathSegments.length - 1 : 0;
      }
      let prefix = '';
      for (let i = 0; i < depth; i++) {
        prefix += '../';
      }

      const profileLink = document.getElementById('profileLinkBtn');
      if (profileLink) profileLink.href = prefix + 'mem/member.html';

      const depositLink = document.getElementById('depositLinkBtn');
      if (depositLink) depositLink.href = prefix + 'account/deposit.html';
    });
  })();
</script>
