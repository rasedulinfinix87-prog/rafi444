<!-- Top Navigation Bar Container -->
<header class="w-full bg-[#161b22] border-b border-gray-800/80 px-4 py-2.5 flex items-center justify-between text-white select-none">
  
  <!-- Left Side: Hamburger Menu Button -->
  <div class="flex items-center gap-3">
    <button id="hamburgerBtn" onclick="toggleSidebar()" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800/60 transition focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Right Side: Real Balance + Deposit, Notification Icon, Profile Icon -->
  <div class="flex items-center gap-3">
    
    <!-- Real Balance & Deposit Button Group -->
    <div class="flex items-center bg-[#0f141c] border border-gray-800 rounded-lg p-1 text-xs">
      <!-- Balance Display -->
      <div class="flex items-center gap-1.5 px-2.5 py-1">
        <span class="w-2 h-2 rounded-full bg-[#24ee89] animate-pulse"></span>
        <span id="topBarCurrency" class="text-gray-400 font-semibold text-[11px]">BDT</span>
        <span id="topBarBalance" class="font-extrabold text-white text-sm">0.00</span>
      </div>

      <!-- Quick Deposit Button -->
      <a href="account/deposit.html" class="bg-[#24ee89] hover:bg-emerald-400 text-black font-extrabold p-1.5 rounded-md transition flex items-center justify-center shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
      </a>
    </div>

    <!-- Notification Icon with Dropdown -->
    <div class="relative">
      <button id="notifBtn" onclick="toggleNotifications()" class="relative p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800/60 transition focus:outline-none">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <!-- Unread Badge Indicator -->
        <span id="notifBadge" class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#24ee89] rounded-full ring-2 ring-[#161b22]"></span>
      </button>

      <!-- Notification Panel Dropdown -->
      <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-[#161b22] border border-gray-800 rounded-xl shadow-2xl z-50 overflow-hidden">
        <div class="p-3 border-b border-gray-800 flex justify-between items-center">
          <span class="text-xs font-bold text-gray-300">Notifications</span>
          <button onclick="clearNotifications()" class="text-[10px] text-gray-500 hover:text-gray-300">Mark as read</button>
        </div>
        <div id="notifList" class="max-h-60 overflow-y-auto p-2 text-xs space-y-2 text-gray-400">
          <div class="p-2 bg-[#0f141c] rounded-lg border border-gray-800/60">
            <p class="text-white font-medium text-[11px]">Welcome Bonus Received!</p>
            <span class="text-[9px] text-gray-500">Your initial deposit bonus has been credited.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Icon -->
    <a href="account/profile.html" class="p-1.5 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800/60 transition border border-gray-800 flex items-center justify-center bg-[#0f141c]">
      <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
    </a>

  </div>
</header>

<script>
  let profileSubscription = null;

  // Function to Update UI Balance Display
  function updateBalanceUI(newBalance) {
    const el = document.getElementById('topBarBalance');
    if (el && newBalance !== undefined && newBalance !== null) {
      el.innerText = parseFloat(newBalance).toFixed(2);
    }
  }

  // Fetch initial profile balance and subscribe to Supabase Realtime changes
  async function syncTopBarBalance() {
    try {
      if (typeof supabaseClient !== 'undefined' && typeof getCurrentUser === 'function') {
        const user = await getCurrentUser();
        if (user) {
          // 1. Fetch current profile balance
          const { data: profile, error } = await supabaseClient
            .from('profiles')
            .select('balance')
            .eq('id', user.id)
            .single();

          if (!error && profile) {
            updateBalanceUI(profile.balance);
          }

          // 2. Realtime Listener for Instant Balance Changes
          if (!profileSubscription) {
            profileSubscription = supabaseClient
              .channel('public:profiles:' + user.id)
              .on(
                'postgres_changes',
                {
                  event: 'UPDATE',
                  schema: 'public',
                  table: 'profiles',
                  filter: `id=eq.${user.id}`
                },
                (payload) => {
                  if (payload.new && payload.new.balance !== undefined) {
                    updateBalanceUI(payload.new.balance);
                  }
                }
              )
              .subscribe();
          }
        }
      }
    } catch (err) {
      console.error("Top bar balance sync error:", err);
    }
  }

  function toggleNotifications() {
    const dropdown = document.getElementById('notifDropdown');
    if (dropdown) dropdown.classList.toggle('hidden');
  }

  function clearNotifications() {
    const badge = document.getElementById('notifBadge');
    if (badge) badge.classList.add('hidden');
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('appSidebar');
    if (sidebar) {
      sidebar.classList.toggle('hidden');
    } else {
      console.log("Sidebar toggle clicked");
    }
  }

  // Initialize and attach listener on page load
  document.addEventListener('DOMContentLoaded', () => {
    syncTopBarBalance();

    // Listen to Supabase Auth State changes if available
    if (typeof supabaseClient !== 'undefined') {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
          syncTopBarBalance();
        } else if (event === 'SIGNED_OUT') {
          updateBalanceUI(0);
        }
      });
    }
  });
</script>
