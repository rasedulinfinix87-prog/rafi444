<!-- bar/header.html -->
<header class="w-full bg-[#080B10] border-b border-[#222b3a] px-3 py-3 text-white">
  <div class="flex items-center justify-between gap-3">

    <div class="min-w-0">
      <div class="text-xs text-gray-400">Available Balance</div>
      <div id="headerBalance" class="text-lg font-bold text-white">
        ৳0.00
      </div>
      <div id="headerBalanceStatus" class="text-xs text-gray-500">
        Connecting...
      </div>
    </div>

    <button
      id="headerRefreshBalance"
      type="button"
      class="rounded-lg border border-[#2a3546] bg-[#151a23] px-3 py-2 text-sm"
    >
      <i class="fas fa-sync-alt"></i> Refresh
    </button>

  </div>
</header>

<script>
(function () {
  'use strict';

  // Prevent duplicate initialization
  if (window.headerBalanceInitialized) return;
  window.headerBalanceInitialized = true;

  const balanceElement = document.getElementById('headerBalance');
  const statusElement = document.getElementById('headerBalanceStatus');
  const refreshButton = document.getElementById('headerRefreshBalance');

  if (!balanceElement || !statusElement) return;

  let currentUserId = null;
  let balanceChannel = null;
  let betsChannel = null;
  let lastBalance = null;
  let refreshInProgress = false;

  function setStatus(message, color) {
    statusElement.textContent = message;
    statusElement.style.color = color || '#9ca3af';
  }

  function formatBalance(value) {
    const amount = Number(value);
    if (!Number.isFinite(amount)) return '৳0.00';

    return '৳' + amount.toLocaleString('en-BD', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function getSupabaseClient() {
    // Uses the existing Supabase client if available.
    if (window.client && typeof window.client.from === 'function') {
      return window.client;
    }

    if (window.supabaseClient &&
        typeof window.supabaseClient.from === 'function') {
      return window.supabaseClient;
    }

    // Uses the existing project configuration if available.
    if (window.supabase &&
        typeof window.supabase.from === 'function') {
      return window.supabase;
    }

    return null;
  }

  async function loadBalance(client, userId) {
    if (refreshInProgress) return;
    refreshInProgress = true;

    try {
      const { data, error } = await client
        .from('profiles')
        .select('balance')
        .eq('id', userId)
        .single();

      if (error) throw error;

      if (!data) {
        throw new Error('Profile not found');
      }

      lastBalance = Number(data.balance);
      balanceElement.textContent = formatBalance(data.balance);
      setStatus('Balance synced', '#2ed573');

    } catch (error) {
      console.error('Balance load error:', error);
      setStatus('Balance sync failed', '#ef4444');
    } finally {
      refreshInProgress = false;
    }
  }

  function removeOldChannels(client) {
    if (balanceChannel) {
      client.removeChannel(balanceChannel);
      balanceChannel = null;
    }

    if (betsChannel) {
      client.removeChannel(betsChannel);
      betsChannel = null;
    }
  }

  async function initializeHeader() {
    const client = getSupabaseClient();

    if (!client) {
      setStatus('Supabase client not found', '#ef4444');
      return;
    }

    try {
      const { data: { user }, error } = await client.auth.getUser();

      if (error || !user) {
        currentUserId = null;
        balanceElement.textContent = '৳0.00';
        setStatus('Please log in', '#ef4444');
        return;
      }

      if (currentUserId !== user.id) {
        removeOldChannels(client);
        currentUserId = user.id;
        lastBalance = null;
      }

      await loadBalance(client, user.id);

      // Listen for balance changes in the logged-in user's profile.
      if (!balanceChannel) {
        balanceChannel = client
          .channel('header-profile-balance-' + user.id)
          .on(
            'postgres_changes',
            {
              event: 'UPDATE',
              schema: 'public',
              table: 'profiles',
              filter: 'id=eq.' + user.id
            },
            function (payload) {
              if (payload.new &&
                  payload.new.balance !== undefined) {
                lastBalance = Number(payload.new.balance);
                balanceElement.textContent =
                  formatBalance(payload.new.balance);

                setStatus('Balance updated live', '#2ed573');
              }
            }
          )
          .subscribe(function (state) {
            if (state === 'SUBSCRIBED') {
              setStatus('Live balance connected', '#2ed573');
            } else if (state === 'CHANNEL_ERROR' ||
                       state === 'TIMED_OUT') {
              setStatus('Realtime reconnecting...', '#f59e0b');
            }
          });
      }

      // Detect new bet records and re-check the actual profile balance.
      if (!betsChannel) {
        betsChannel = client
          .channel('header-user-bets-' + user.id)
          .on(
            'postgres_changes',
            {
              event: 'INSERT',
              schema: 'public',
              table: 'bets',
              filter: 'user_id=eq.' + user.id
            },
            async function () {
              await loadBalance(client, user.id);
            }
          )
          .subscribe();
      }

    } catch (error) {
      console.error('Header initialization error:', error);
      setStatus('Unable to connect', '#ef4444');
    }
  }

  if (refreshButton) {
    refreshButton.addEventListener('click', function () {
      initializeHeader();
    });
  }

  // Initial load
  initializeHeader();

  // Detect login/logout or account changes.
  const client = getSupabaseClient();

  if (client && client.auth &&
      typeof client.auth.onAuthStateChange === 'function') {
    client.auth.onAuthStateChange(function () {
      currentUserId = null;
      initializeHeader();
    });
  }

})();
</script>
