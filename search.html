
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Games - Game Portal</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #0b0f19;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-btn {
            flex: 0 0 auto;
            min-width: 100px;
            padding: 12px 14px;
            border: 1px solid #263247;
            border-radius: 13px;
            background: #111827;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
            transition: .2s;
        }

        .category-btn.active {
            background: #24ee89;
            color: #06130c;
            border-color: #24ee89;
        }

        .game-card {
            display: block;
            min-width: 0;
            overflow: hidden;
            border: 1px solid #263247;
            border-radius: 14px;
            background: #111827;
            color: white;
            text-decoration: none;
            transition: border-color .2s, transform .2s;
        }

        .game-card:active { transform: scale(.98); }
        .game-card:hover { border-color: #24ee89; }

        .game-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #172033;
        }

        .game-name {
            padding: 9px 5px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .search-input:focus {
            outline: none;
            border-color: #24ee89;
            box-shadow: 0 0 0 2px #24ee8920;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Existing Top Bar -->
    <div id="topBarContainer" class="sticky top-0 z-50"></div>

    <main class="w-full max-w-7xl mx-auto px-3 sm:px-5 py-5 flex-1">

        <h1 class="text-xl font-extrabold mb-2">🔎 Search Games</h1>
        <p class="text-xs text-slate-400 mb-5">
            Search games by entering at least 3 words.
        </p>

        <!-- Search Box -->
        <div class="relative mb-5">
            <span class="absolute left-4 top-1/2 -translate-y-1/2">🔍</span>

            <input
                type="search"
                id="gameSearch"
                class="search-input w-full rounded-2xl border border-slate-700 bg-[#111827] py-4 pl-11 pr-4 text-sm text-white"
                placeholder="Enter at least 3 words..."
                autocomplete="off"
            >
        </div>

        <p id="searchMessage" class="text-xs text-slate-400 mb-5">
            Enter at least 3 words to search games.
        </p>

        <!-- Category Buttons -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-5">
            <button class="category-btn active" data-category="hot">
                🔥 Hot Game
            </button>

            <button class="category-btn" data-category="original">
                🎮 Arso Original
            </button>

            <button class="category-btn" data-category="slot">
                🎰 Slot
            </button>

            <button class="category-btn" data-category="casino">
                🃏 Casino
            </button>

            <button class="category-btn" data-category="blackjack">
                ♠️ Blackjack
            </button>
        </div>

        <!-- Results Heading -->
        <div class="flex items-center justify-between mb-4">
            <h2 id="resultsTitle" class="text-sm font-bold">
                🔥 Hot Games
            </h2>

            <span id="resultCount" class="text-xs text-slate-400">0 games</span>
        </div>

        <!-- Games Results -->
        <section
            id="gamesGrid"
            class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3"
        ></section>

        <p id="emptyMessage" class="hidden text-center text-sm text-slate-400 py-10">
            No games found.
        </p>

    </main>

    <footer class="border-t border-slate-800 bg-[#111827] py-5 text-center text-xs text-slate-500">
        © 2026 Game Portal. All Rights Reserved.
    </footer>

    <script>
        // ==========================================
        // TOP BAR LOADER
        // ==========================================
        async function loadTopBar() {
            try {
                const response = await fetch('/bar/top.html');

                if (!response.ok) {
                    throw new Error('Top bar could not be loaded.');
                }

                document.getElementById('topBarContainer').innerHTML =
                    await response.text();

                if (typeof syncRealtimeUserBalance === 'function') {
                    syncRealtimeUserBalance();
                }
            } catch (error) {
                console.error('Top bar loading error:', error);
            }
        }

        // ==========================================
        // GAME CONFIGURATION
        // ==========================================

        // Existing game paths from your index.html
        const originalGames = [
            { name: 'Classic Dice', path: '/game/dice.html', image: '/assets/images/dice.png' },
            { name: 'Mines', path: '/game/mines.html', image: '/assets/images/mines.png' },
            { name: 'Limbo', path: '/game/limbo.html', image: '/assets/images/limbo.png' },
            { name: 'Plinko', path: '/game/plinko.html', image: '/assets/images/plinko.png' },
            { name: 'Crash', path: '/game/crash.html', image: '/assets/images/crash.png' },
            { name: 'Wheel', path: '/game/wheel.html', image: '/assets/images/wheel.png' },
            { name: 'Keno', path: '/game/keno.html', image: '/assets/images/keno.png' },
            { name: 'Coin Flip', path: '/game/coin-flip.html', image: '/assets/images/coin-flip.png' }
        ];

        // Add your actual slot games here if directory listing is disabled.
        // Example:
        // { name: 'Slot Game Name', path: '/slot/your-game.html',
        //   image: '/assets/images/your-game.png' }
        const slotGamesFallback = [];

        const dummyGames = {
            slot: [],
            casino: [],
            blackjack: []
        };

        let activeCategory = 'hot';
        let allGames = [];
        let searchResults = [];

        const grid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('gameSearch');
        const searchMessage = document.getElementById('searchMessage');

        // ==========================================
        // TRY TO READ HTML FILES FROM A DIRECTORY
        // Requires server directory listing to be enabled.
        // ==========================================
        async function getGamesFromDirectory(folder) {
            try {
                const response = await fetch(folder);

                if (!response.ok) return [];

                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');

                const links = [...doc.querySelectorAll('a[href]')];
                const games = [];

                links.forEach(link => {
                    const href = link.getAttribute('href');

                    if (!href || href.startsWith('?') ||
                        href.startsWith('#') || href.startsWith('../')) {
                        return;
                    }

                    // Only HTML files directly inside this folder.
                    if (!/^[^/?#]+\.html?$/i.test(href)) return;

                    const path = folder.replace(/\/?$/, '/') + href;
                    const fileName = decodeURIComponent(href)
                        .replace(/\.html?$/i, '')
                        .replace(/[-_]/g, ' ');

                    games.push({
                        name: fileName.replace(/\b\w/g, c => c.toUpperCase()),
                        path,
                        image: '/assets/images/game-placeholder.png'
                    });
                });

                return games;
            } catch (error) {
                console.warn('Could not read directory:', folder, error);
                return [];
            }
        }

        // ==========================================
        // LOAD GAMES FOR SELECTED CATEGORY
        // ==========================================
        async function loadCategory(category) {
            activeCategory = category;

            document.querySelectorAll('.category-btn').forEach(button => {
                button.classList.toggle(
                    'active',
                    button.dataset.category === category
                );
            });

            const titles = {
                hot: '🔥 Hot Games',
                original: '🎮 Arso Original',
                slot: '🎰 Slot Games',
                casino: '🃏 Casino Games',
                blackjack: '♠️ Blackjack Games'
            };

            document.getElementById('resultsTitle').textContent =
                titles[category] || 'Games';

            grid.innerHTML = `
                <div class="col-span-full text-center text-sm text-slate-400 py-8">
                    Loading games...
                </div>
            `;

            if (category === 'hot') {
                // Hot Game = games located in /slot/
                allGames = await getGamesFromDirectory('/slot/');

                if (allGames.length === 0) {
                    allGames = slotGamesFallback;
                }
            } else if (category === 'original') {
                // Arso Original = existing /game/ games
                allGames = originalGames;

                // Try directory listing and use it if available.
                const directoryGames = await getGamesFromDirectory('/game/');

                if (directoryGames.length > 0) {
                    allGames = directoryGames;
                }
            } else {
                // Temporary dummy categories
                allGames = dummyGames[category] || [];
            }

            applySearch();
        }

        // ==========================================
        // SEARCH: REQUIRE AT LEAST 3 WORDS
        // ==========================================
        function applySearch() {
            const query = searchInput.value.trim();
            const words = query.split(/\s+/).filter(Boolean);

            if (query && words.length < 3) {
                searchResults = [];

                searchMessage.textContent =
                    `Please enter at least 3 words. Current words: ${words.length}.`;

                renderGames([]);
                return;
            }

            searchMessage.textContent = query
                ? `Search results for: "${query}"`
                : 'Browse games or enter at least 3 words to search.';

            if (query) {
                const terms = words.map(word => word.toLowerCase());

                searchResults = allGames.filter(game => {
                    const searchableText =
                        `${game.name} ${game.path}`.toLowerCase();

                    // Each query word must match the game's name or path.
                    return terms.every(term => searchableText.includes(term));
                });
            } else {
                searchResults = allGames;
            }

            renderGames(searchResults);
        }

        // ==========================================
        // RENDER GAME CARDS
        // ==========================================
        function renderGames(games) {
            grid.innerHTML = '';

            document.getElementById('resultCount').textContent =
                `${games.length} game${games.length === 1 ? '' : 's'}`;

            document.getElementById('emptyMessage').classList.toggle(
                'hidden',
                games.length > 0
            );

            if (games.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full rounded-xl border border-slate-800
                                bg-[#111827] p-6 text-center text-xs text-slate-400">
                        ${searchInput.value.trim().split(/\s+/).filter(Boolean).length > 0
                            ? 'No matching games found.'
                            : 'No games available in this category yet.'}
                    </div>
                `;
                return;
            }

            const fragment = document.createDocumentFragment();

            games.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = game.path;

                const image = document.createElement('img');
                image.className = 'game-image';
                image.src = game.image || '/assets/images/game-placeholder.png';
                image.alt = game.name;
                image.loading = 'lazy';

                image.onerror = function () {
                    this.onerror = null;
                    this.style.display = 'none';
                };

                const name = document.createElement('div');
                name.className = 'game-name';
                name.textContent = game.name;

                card.append(image, name);
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);
        }

        // ==========================================
        // EVENTS
        // ==========================================
        document.querySelectorAll('.category-btn').forEach(button => {
            button.addEventListener('click', () => {
                loadCategory(button.dataset.category);
            });
        });

        let searchTimer;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(applySearch, 200);
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadTopBar();
            loadCategory('hot');
        });
    </script>

</body>
</html>
