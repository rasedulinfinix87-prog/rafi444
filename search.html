<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --font-xs: 11px;
      --font-sm: 12px;
      --font-base: 14px;
      --font-md: 16px;
      --font-lg: 18px;
      --font-xl: 22px;
      --font-2xl: 28px;
      --font-3xl: 32px;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: #0F212E; color: #FFFFFF; font-size: var(--font-base); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0F212E; }
    ::-webkit-scrollbar-thumb { background: #1A2C38; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    body { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
    #topBarContainer { position: sticky; top: 0; z-index: 500; width: 100%; }
    #bottomBarContainer { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; z-index: 5000; isolation: isolate; padding-bottom: env(safe-area-inset-bottom); }
    .category-btn { white-space: nowrap; }
    .game-card { min-width: 0; min-height: 154px; }
    .game-art { min-height: 154px; }
    @media (min-width: 640px) {
      .game-card, .game-art { min-height: 210px; }
    }
  </style>
</head>
<body class="font-sans antialiased bg-[#0F212E] text-[#FFFFFF]">
  <!-- Top bar loaded from root /bar/top.html -->
  <div id="topBarContainer"></div>

  <main class="max-w-5xl mx-auto p-3 sm:p-4 space-y-4">
    <!-- Search -->
    <div class="bg-[#1A2C38] border border-[#0F212E] rounded-2xl p-3 flex items-center gap-3">
      <i class="fa-solid fa-magnifying-glass text-[#FFFFFF]/70 text-[var(--font-sm)]"></i>
      <input id="gameSearch" type="search" placeholder="Search games..." autocomplete="off"
        class="bg-transparent text-[#FFFFFF] placeholder-[#FFFFFF]/50 focus:outline-none w-full text-[var(--font-sm)]">
      <button id="clearSearch" type="button" aria-label="Clear search" class="hidden text-[#FFFFFF]/70 hover:text-[#FFFFFF] px-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Categories -->
    <div id="categoryBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
      <button type="button" data-category="hot" class="category-btn flex items-center gap-2 bg-[#24ee89] text-[#0F212E] font-bold px-4 py-2.5 rounded-xl text-[var(--font-xs)] shadow-sm">
        <i class="fa-solid fa-fire text-orange-500"></i> Hot Game
      </button>
      <button type="button" data-category="original" class="category-btn flex items-center gap-2 bg-[#1A2C38] text-[#FFFFFF] font-semibold px-4 py-2.5 rounded-xl text-[var(--font-xs)] border border-[#0F212E]">
        <i class="fa-solid fa-bolt text-[#24ee89]"></i> Original
      </button>
      <button type="button" data-category="color_trading" class="category-btn flex items-center gap-2 bg-[#1A2C38] text-[#FFFFFF] font-semibold px-4 py-2.5 rounded-xl text-[var(--font-xs)] border border-[#0F212E]">
        <i class="fa-solid fa-palette text-purple-400"></i> Color Trading
      </button>
      <button type="button" data-category="lucky_lottery" class="category-btn flex items-center gap-2 bg-[#1A2C38] text-[#FFFFFF] font-semibold px-4 py-2.5 rounded-xl text-[var(--font-xs)] border border-[#0F212E]">
        <i class="fa-solid fa-ticket text-yellow-400"></i> Lucky Lottery
      </button>
      <button type="button" data-category="slot" class="category-btn flex items-center gap-2 bg-[#1A2C38] text-[#FFFFFF] font-semibold px-4 py-2.5 rounded-xl text-[var(--font-xs)] border border-[#0F212E]">
        <i class="fa-solid fa-dice text-blue-400"></i> Slot
      </button>
      <button type="button" data-category="casino" class="category-btn flex items-center gap-2 bg-[#1A2C38] text-[#FFFFFF] font-semibold px-4 py-2.5 rounded-xl text-[var(--font-xs)] border border-[#0F212E]">
        <i class="fa-solid fa-circle-dot text-red-400"></i> Casino
      </button>
      <a href="/sports/sports.html" id="sportsBtn" class="category-btn flex items-center gap-2 bg-[#1A2C38] text-[#FFFFFF] font-semibold px-4 py-2.5 rounded-xl text-[var(--font-xs)] border border-[#0F212E] no-underline">
        <i class="fa-solid fa-futbol text-green-400"></i> Sports
      </a>
    </div>

    <!-- Cards populated via Supabase -->
    <div id="gamesGrid" class="grid grid-cols-3 gap-2.5 sm:gap-4"></div>
    
    <!-- Loading & Empty state messages -->
    <p id="loadingMessage" class="text-center text-[var(--font-sm)] text-[#FFFFFF]/70 py-10">গেম লোড হচ্ছে...</p>
    <p id="emptyMessage" class="hidden text-center text-[var(--font-sm)] text-[#FFFFFF]/70 py-10">কোনো গেম পাওয়া যায়নি। অন্য নাম দিয়ে সার্চ করুন।</p>

    <!-- Load More Button -->
    <div class="text-center pt-2">
      <button id="loadMoreBtn" class="hidden bg-[#0F212E] hover:bg-[#1A2C38] text-[#24ee89] font-bold border border-[#24ee89]/40 px-6 py-2.5 rounded-xl text-[var(--font-xs)] transition-all">
        <i class="fa-solid fa-rotate-right mr-1"></i> Load More
      </button>
    </div>
  </main>

  <!-- Bottom bar loaded from root /bar/bottom.html -->
  <div id="bottomBarContainer"></div>

  <script>
    (function () {
      'use strict';

      let allGames = [];
      let filteredGames = [];
      let visibleLimit = 12;
      let activeCategory = 'hot';

      const grid = document.getElementById('gamesGrid');
      const searchInput = document.getElementById('gameSearch');
      const clearSearch = document.getElementById('clearSearch');
      const emptyMessage = document.getElementById('emptyMessage');
      const loadingMessage = document.getElementById('loadingMessage');
      const loadMoreBtn = document.getElementById('loadMoreBtn');

      function getBasePath() {
        if (window.location.hostname.includes('github.io')) {
          const pathParts = window.location.pathname.split('/');
          if (pathParts.length > 1 && pathParts[1] !== '') {
            return '/' + pathParts[1] + '/';
          }
        }
        return './';
      }

      async function fetchGamesFromSupabase() {
        try {
          const client = (typeof supabaseClient !== 'undefined') ? supabaseClient : null;

          if (!client || typeof client.from !== 'function') {
            console.error('Supabase client is missing.');
            loadingMessage.textContent = 'Supabase কনফিগারেশন পাওয়া যায়নি।';
            return;
          }

          const { data, error } = await client
            .from('grid_control_url_image')
            .select('*')
            .eq('is_active', true)
            .order('sort_order', { ascending: true });

          if (error) throw error;

          allGames = data || [];
          loadingMessage.classList.add('hidden');
          applyFilters();
        } catch (err) {
          console.error('Error fetching games:', err);
          grid.innerHTML = '';
          grid.classList.add('hidden');
          emptyMessage.classList.add('hidden');
          loadingMessage.classList.remove('hidden');
          loadingMessage.textContent = 'গেম লোড করতে সমস্যা হয়েছে: ' + (err.message || 'অজানা সমস্যা');
        }
      }

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        
        filteredGames = allGames.filter(game => {
          const gameCat = (game.category || '').trim().toLowerCase();
          const activeCat = activeCategory.trim().toLowerCase();
          const catMatch = gameCat === activeCat;
          const searchMatch = (game.title && game.title.toLowerCase().includes(query));
          return catMatch && searchMatch;
        });

        filteredGames.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

        visibleLimit = 12;
        renderGrid();
      }

      function renderGrid() {
        const currentSlice = filteredGames.slice(0, visibleLimit);
        const basePath = getBasePath();

        const sportsBtn = document.getElementById('sportsBtn');
        if (sportsBtn && basePath !== './') {
          sportsBtn.href = basePath.replace(/\/$/, '') + '/sports/sports.html';
        }

        if (currentSlice.length === 0) {
          grid.innerHTML = '';
          emptyMessage.classList.remove('hidden');
          grid.classList.add('hidden');
        } else {
          emptyMessage.classList.add('hidden');
          grid.classList.remove('hidden');

          grid.innerHTML = currentSlice.map(game => {
            let imageUrl = game.image_url ? game.image_url.trim() : '';
            let pageUrl = game.page_url ? game.page_url.trim() : '#';

            if (imageUrl.startsWith('/') && basePath !== './' && !imageUrl.startsWith(basePath)) {
              imageUrl = basePath.replace(/\/$/, '') + imageUrl;
            }

            if (pageUrl.startsWith('/') && basePath !== './' && !pageUrl.startsWith(basePath)) {
              pageUrl = basePath.replace(/\/$/, '') + pageUrl;
            }

            const hasImg = imageUrl !== '';
            const title = game.title || 'Untitled Game';
            const catBadge = game.category ? game.category.toUpperCase() : 'GAME';

            const showTitle = game.show_title !== false;
            const showBadge = game.show_badge !== false;

            return `
              <a href="${pageUrl}" class="game-card group relative bg-[#1A2C38] border border-[#0F212E] hover:border-[#24ee89]/70 rounded-2xl overflow-hidden flex flex-col justify-between transition-transform duration-150">
                <div class="game-art absolute inset-0 bg-gradient-to-b from-indigo-900/60 to-[#1A2C38] flex flex-col items-center justify-center p-1">
                  ${hasImg 
                    ? `<img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover rounded-xl group-hover:scale-105 transition-transform duration-200" loading="lazy" />`
                    : `<i class="fa-solid fa-gamepad text-3xl sm:text-4xl text-white/80 drop-shadow-lg mb-2"></i>
                       ${showTitle ? `<div class="text-center font-black text-xs sm:text-sm text-[#FFFFFF] tracking-wide drop-shadow-lg px-2">${title}</div>` : ''}`
                  }
                </div>
                <div class="relative z-10 flex justify-end items-center p-2">
                  ${showBadge ? `<span class="text-[9px] sm:text-[10px] font-bold text-[#FFFFFF] bg-black/60 px-2 py-0.5 rounded-full border border-white/10 backdrop-blur-sm">${catBadge}</span>` : ''}
                </div>
                <div class="relative z-10 p-2 text-center bg-gradient-to-t from-black/90 via-black/50 to-transparent">
                  ${showTitle ? `<span class="text-[9px] sm:text-[11px] font-bold tracking-wider text-[#FFFFFF] truncate block">${title}</span>` : ''}
                </div>
              </a>
            `;
          }).join('');
        }

        clearSearch.classList.toggle('hidden', !searchInput.value);

        if (visibleLimit < filteredGames.length) {
          loadMoreBtn.classList.remove('hidden');
        } else {
          loadMoreBtn.classList.add('hidden');
        }
      }

      document.querySelectorAll('[data-category]').forEach(button => {
        button.addEventListener('click', () => {
          activeCategory = button.dataset.category;
          document.querySelectorAll('[data-category]').forEach(btn => {
            const active = btn === button;
            btn.classList.toggle('bg-[#24ee89]', active);
            btn.classList.toggle('text-[#0F212E]', active);
            btn.classList.toggle('bg-[#1A2C38]', !active);
            btn.classList.toggle('text-[#FFFFFF]', !active);
            btn.classList.toggle('border', !active);
            btn.classList.toggle('border-[#0F212E]', !active);
          });
          applyFilters();
        });
      });

      searchInput.addEventListener('input', applyFilters);
      clearSearch.addEventListener('click', () => { 
        searchInput.value = ''; 
        applyFilters(); 
        searchInput.focus(); 
      });

      loadMoreBtn.addEventListener('click', () => {
        visibleLimit += 12;
        renderGrid();
      });

      async function loadBars() {
        const basePath = getBasePath();
        
        try {
          const topRes = await fetch(basePath + 'bar/top.html');
          if (topRes.ok) {
            let topContent = await topRes.text();
            topContent = topContent.replace(/game\/mem\/member\.html/g, basePath + 'mem/member.html');
            document.getElementById('topBarContainer').innerHTML = topContent;
            document.querySelectorAll('a[href*="deposit"]').forEach(a => {
              a.href = basePath + 'account/deposit.html';
            });
          } else {
            console.error('Top bar failed:', topRes.status);
          }

          const botRes = await fetch(basePath + 'bar/bottom.html');
          if (botRes.ok) {
            document.getElementById('bottomBarContainer').innerHTML = await botRes.text();
          } else {
            console.error('Bottom bar failed:', botRes.status);
          }
        } catch (err) {
          console.error('Bar loading error:', err);
        }
      }

      window.addEventListener('DOMContentLoaded', () => { 
        loadBars(); 
        setTimeout(fetchGamesFromSupabase, 100);
      });
    })();
  </script>
</body>
</html>
