<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Games Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f141c; }
        ::-webkit-scrollbar-thumb { background: #222b3a; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0f141c] text-white min-h-screen font-sans antialiased p-3 sm:p-4">

    <div class="max-w-4xl mx-auto space-y-4">
        
        <!-- Top Search Bar Container -->
        <div class="bg-[#171d28] border border-[#222b3a] rounded-2xl p-2.5 flex items-center gap-3">
            <!-- Casino Dropdown -->
            <div class="flex items-center gap-1.5 px-3 py-1.5 bg-[#1f293a] rounded-xl text-xs font-semibold cursor-pointer hover:bg-[#283548] transition">
                <span>Casino</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
            </div>
            
            <!-- Divider -->
            <div class="h-5 w-[1px] bg-[#2d3748]"></div>

            <!-- Search Input -->
            <div class="flex items-center gap-2.5 flex-1">
                <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                <input type="text" placeholder="Search games" class="bg-transparent text-white placeholder-gray-500 focus:outline-none w-full text-xs sm:text-sm">
            </div>
        </div>

        <!-- Categories Navigation Bar (Horizontal Scrollable) -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
            <button class="flex items-center gap-2 bg-[#222b3a] text-white font-bold px-4 py-2.5 rounded-xl text-xs whitespace-nowrap shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-[#24ee89] inline-block"></span> All Games
            </button>
            <button class="flex items-center gap-2 bg-[#171d28] hover:bg-[#222b3a] text-gray-300 font-semibold px-4 py-2.5 rounded-xl text-xs whitespace-nowrap border border-[#222b3a] transition">
                <i class="fa-solid fa-bolt text-[#24ee89]"></i> BC Originals
            </button>
            <button class="flex items-center gap-2 bg-[#171d28] hover:bg-[#222b3a] text-gray-300 font-semibold px-4 py-2.5 rounded-xl text-xs whitespace-nowrap border border-[#222b3a] transition">
                <i class="fa-solid fa-fire text-orange-500"></i> Hot Games
            </button>
            <button class="flex items-center gap-2 bg-[#171d28] hover:bg-[#222b3a] text-gray-300 font-semibold px-4 py-2.5 rounded-xl text-xs whitespace-nowrap border border-[#222b3a] transition">
                <i class="fa-solid fa-dice text-blue-400"></i> Slots
            </button>
        </div>

        <!-- Sort By & Providers Filter Section -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Sort By Dropdown -->
            <div class="bg-[#171d28] border border-[#222b3a] rounded-xl px-3.5 py-2.5 flex items-center justify-between text-xs cursor-pointer hover:border-gray-600 transition">
                <div class="flex items-center gap-2 text-gray-400">
                    <span>Sort By:</span>
                    <span class="text-white font-semibold">Popular</span>
                </div>
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 bg-[#222b3a] p-1.5 rounded-lg"></i>
            </div>

            <!-- Providers Dropdown -->
            <div class="bg-[#171d28] border border-[#222b3a] rounded-xl px-3.5 py-2.5 flex items-center justify-between text-xs cursor-pointer hover:border-gray-600 transition">
                <div class="flex items-center gap-2 text-gray-400">
                    <span>Providers:</span>
                    <span class="text-white font-semibold">All</span>
                </div>
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 bg-[#222b3a] p-1.5 rounded-lg"></i>
            </div>
        </div>

        <!-- Game Cards Grid (3 Columns) -->
        <div class="grid grid-cols-3 gap-2.5 sm:gap-4">
            
            <!-- Card 1: Crash -->
            <a href="#" class="group relative bg-[#171d28] border border-[#222b3a] hover:border-indigo-500/50 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-56 transition-transform duration-100">
                <div class="absolute inset-0 bg-gradient-to-b from-purple-800 to-[#171d28] flex items-center justify-center p-4">
                    <div class="text-center font-black italic text-lg sm:text-2xl text-white tracking-wider drop-shadow-lg">CRASH</div>
                </div>
                <div class="relative z-20 flex justify-end items-center p-2">
                    <span class="text-[10px] font-bold text-gray-200 bg-black/60 px-2 py-0.5 rounded-full flex items-center gap-1 border border-white/10">
                        <i class="fa-solid fa-user text-[9px] text-gray-300"></i> 1100
                    </span>
                </div>
                <div class="relative z-20 p-2 text-center bg-gradient-to-t from-black/80 to-transparent">
                    <span class="text-[9px] font-bold tracking-widest text-gray-300 uppercase">Original Game</span>
                </div>
            </a>

            <!-- Card 2: Aviator -->
            <a href="#" class="group relative bg-[#171d28] border border-[#222b3a] hover:border-indigo-500/50 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-56 transition-transform duration-100">
                <div class="absolute inset-0 bg-gradient-to-b from-red-900 to-[#171d28] flex items-center justify-center p-4">
                    <div class="text-center font-black italic text-base sm:text-xl text-white tracking-wider drop-shadow-lg">AVIATOR</div>
                </div>
                <div class="relative z-20 flex justify-end items-center p-2">
                    <span class="text-[10px] font-bold text-gray-200 bg-black/60 px-2 py-0.5 rounded-full flex items-center gap-1 border border-white/10">
                        <i class="fa-solid fa-user text-[9px] text-gray-300"></i> 90
                    </span>
                </div>
                <div class="relative z-20 p-2 text-center bg-gradient-to-t from-black/80 to-transparent">
                    <span class="text-[9px] font-bold tracking-widest text-gray-300 uppercase">Spribe</span>
                </div>
            </a>

            <!-- Card 3: Super Ace -->
            <a href="#" class="group relative bg-[#171d28] border border-[#222b3a] hover:border-indigo-500/50 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-56 transition-transform duration-100">
                <div class="absolute inset-0 bg-gradient-to-b from-amber-700 to-[#171d28] flex items-center justify-center p-4">
                    <div class="text-center font-black italic text-sm sm:text-lg text-yellow-300 tracking-wider drop-shadow-lg">Super Ace</div>
                </div>
                <div class="relative z-20 flex justify-between items-center p-2">
                    <span class="text-[9px] font-bold text-yellow-900 bg-yellow-400 px-1.5 py-0.5 rounded shadow">Bonus Buy</span>
                    <span class="text-[10px] font-bold text-gray-200 bg-black/60 px-2 py-0.5 rounded-full flex items-center gap-1 border border-white/10">
                        <i class="fa-solid fa-user text-[9px] text-gray-300"></i> 30
                    </span>
                </div>
                <div class="relative z-20 p-2 text-center bg-gradient-to-t from-black/80 to-transparent">
                    <span class="text-[9px] font-bold tracking-widest text-yellow-500 uppercase">JILI</span>
                </div>
            </a>

            <!-- Card 4: Super Elements -->
            <a href="#" class="group relative bg-[#171d28] border border-[#222b3a] hover:border-indigo-500/50 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-56 transition-transform duration-100">
                <div class="absolute inset-0 bg-gradient-to-b from-orange-800 to-[#171d28] flex items-center justify-center p-4">
                    <div class="text-center font-black italic text-xs sm:text-base text-orange-200 tracking-wider drop-shadow-lg">Super Elements</div>
                </div>
                <div class="relative z-20 flex justify-end items-center p-2">
                    <span class="text-[10px] font-bold text-gray-200 bg-black/60 px-2 py-0.5 rounded-full flex items-center gap-1 border border-white/10">
                        <i class="fa-solid fa-user text-[9px] text-gray-300"></i> 26
                    </span>
                </div>
                <div class="relative z-20 p-2 text-center bg-gradient-to-t from-black/80 to-transparent">
                    <span class="text-[9px] font-bold tracking-widest text-emerald-400 uppercase">FC</span>
                </div>
            </a>

            <!-- Card 5: Circus Joker -->
            <a href="#" class="group relative bg-[#171d28] border border-[#222b3a] hover:border-indigo-500/50 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-56 transition-transform duration-100">
                <div class="absolute inset-0 bg-gradient-to-b from-fuchsia-900 to-[#171d28] flex items-center justify-center p-4">
                    <div class="text-center font-black italic text-xs sm:text-sm text-fuchsia-200 tracking-wider drop-shadow-lg">CIRCUS JOKER</div>
                </div>
                <div class="relative z-20 flex justify-end items-center p-2">
                    <span class="text-[10px] font-bold text-gray-200 bg-black/60 px-2 py-0.5 rounded-full flex items-center gap-1 border border-white/10">
                        <i class="fa-solid fa-user text-[9px] text-gray-300"></i> 31
                    </span>
                </div>
                <div class="relative z-20 p-2 text-center bg-gradient-to-t from-black/80 to-transparent">
                    <span class="text-[9px] font-bold tracking-widest text-yellow-400 uppercase">JILI</span>
                </div>
            </a>

            <!-- Card 6: Lucky Neko -->
            <a href="#" class="group relative bg-[#171d28] border border-[#222b3a] hover:border-indigo-500/50 rounded-2xl overflow-hidden flex flex-col justify-between h-44 sm:h-56 transition-transform duration-100">
                <div class="absolute inset-0 bg-gradient-to-b from-blue-900 to-[#171d28] flex items-center justify-center p-4">
                    <div class="text-center font-black italic text-sm sm:text-lg text-pink-300 tracking-wider drop-shadow-lg">Lucky Neko</div>
                </div>
                <div class="relative z-20 flex justify-end items-center p-2">
                    <span class="text-[10px] font-bold text-gray-200 bg-black/60 px-2 py-0.5 rounded-full flex items-center gap-1 border border-white/10">
                        <i class="fa-solid fa-user text-[9px] text-gray-300"></i> 34
                    </span>
                </div>
                <div class="relative z-20 p-2 text-center bg-gradient-to-t from-black/80 to-transparent">
                    <span class="text-[9px] font-bold tracking-widest text-yellow-300 uppercase">PG</span>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
